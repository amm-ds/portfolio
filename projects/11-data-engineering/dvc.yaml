stages:
  fetch:
    cmd: uv run python -m data_engineering.cli fetch-data --params-file params.yaml
    deps:
      - src/data_engineering/
      - params.yaml
    params:
      - seed
      - trips_url
      - trips_sha256
      - zones_url
      - zones_sha256
    outs:
      - data/raw/yellow_tripdata_2024-01.parquet
      - data/raw/taxi_zone_lookup.csv
      - data/prepared/trips.parquet
      - data/prepared/trips.csv
      - data/prepared/partitioned/
      - data/dataset_contract.json

  evaluate:
    cmd: uv run python -m data_engineering.cli evaluate --params-file params.yaml
    deps:
      - src/data_engineering/
      - params.yaml
      - data/prepared/trips.parquet
      - data/prepared/trips.csv
      - data/prepared/partitioned/
      - data/raw/taxi_zone_lookup.csv
    params:
      - seed
      - repeats
      - memory_probes
    outs:
      - reports/metrics.json
      - reports/evaluation_metadata.json
      - reports/report.html
      - reports/results.md
      - reports/figures/task_times_dotplot.html
      - reports/figures/task_times_dotplot.json
      - reports/figures/speedup_overview.html
      - reports/figures/speedup_overview.json
      - reports/figures/scalability_lines.html
      - reports/figures/scalability_lines.json
      - reports/figures/memory_lollipop.html
      - reports/figures/memory_lollipop.json
      - reports/figures/normalized_heatmap.html
      - reports/figures/normalized_heatmap.json
