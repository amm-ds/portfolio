key_concepts:
  - "**Wall-time speedup** — one engine's median run time divided into another's; read per task, summarized as a geomean."
  - "**Peak RSS** — the high-water mark of resident memory; measured in a fresh process so earlier tasks cannot be charged to later ones."
  - "**Canonical result contract** — every engine must return the same rows for a task (counts exact, floats within a tight band) before timing counts."
  - "**Lazy evaluation** — building a query plan first and paying for it only at execution; Polars's default and the reason its whole plan is timed."
  - "**sqlite conversion tax** — stdlib sqlite cannot read parquet/CSV, so each task loads the file into its in-memory database inside the timed cell; right answers, priced per task."
  - "**Log-log slope** — the growth exponent of time vs row count (1.0 = linear); sub-linear slopes mean an engine's per-row advantage widens with scale."
figure_captions:
  task_times_dotplot: >-
    Median wall time per task and engine — the dot is the median of 5 untraced
    warm repeats, the whiskers span the fastest and slowest repeat (log scale).
    Read it top to bottom: pandas's CSV read (1.16 s) towers over the columnar
    band at 2-83 ms; sqlite forms a second, higher band at 1.9-5.9 s — the
    conversion tax of loading files into its in-memory database, measured not
    assumed.
  speedup_overview: >-
    Speedup vs the two classical baselines (median wall time, log scale): pandas
    on the left, sqlite on the SQL tasks on the right; the dashed line is x1.
    Polars and DuckDB sit 11-44x past pandas and up to three orders of magnitude
    past sqlite (75-1985x); sqlite itself never crosses x1 against pandas
    (0.01-0.2x, i.e. 5-110x slower, one honest n/a excepted).
  scalability_lines: >-
    Median task time vs seeded row count (log-log) on the five most
    discriminating tasks. Slope is the growth exponent: 1.0 means linear. pandas
    and sqlite hold slope ~1.0 everywhere; Polars and DuckDB run sub-linear
    (0.31-0.76), so their per-row advantage widens as data grows — at 10M rows
    the group-by is 0.020-0.031 s vs pandas's 1.15 s and sqlite's 26.4 s.
  memory_lollipop: >-
    Peak RSS per task from fresh-process probes: the stem runs from zero to the
    process high-water mark, so cross-task comparisons read as heights. pandas
    reaches 549-945 MB (945 MB on the join); Polars and DuckDB stay near
    178-529 MB; sqlite runs 396-1520 MB because the loaded frame and its
    database share the process.
  normalized_heatmap: >-
    Each task's median time scaled to its fastest engine (log color scale, so a
    one-step darker cell is 10x slower). Read a row left to right to rank
    engines on that task; read a column to see an engine's profile across tasks.
    The write_parquet x sqlite square is an honest n/a gap — no stdlib parquet
    writer — not a zero.
