key_concepts:
- '**Wall-time speedup:** divide one engine''s median elapsed time by another''s. Read it per task; the geomean is the geometric
  mean of those ratios.'
- '**Peak RSS (resident set size):** the most physical memory a process holds. A fresh process per task keeps earlier tasks
  out of the measurement.'
- '**Canonical result contract:** every engine must return the same rows, with exact counts and floats within a tight band,
  before timing counts.'
- '**Lazy evaluation:** build a query plan first and execute it later. Polars uses this approach, so timing includes its whole
  plan.'
- '**sqlite conversion cost:** standard-library sqlite cannot read parquet or CSV directly, so each timed task loads the file
  into an in-memory database first.'
- '**Log-log slope:** the growth rate of time versus row count on logarithmic axes. A slope of 1.0 is linear; lower measured
  slopes are sub-linear.'
figure_captions:
  task_times_dotplot: 'Median wall time per task and engine. Each dot is the median of 5 untraced warm repeats, and the whiskers
    span the fastest and slowest repeat on a log scale. Read top to bottom: pandas''s CSV read (1.16 s) towers over the columnar
    band at 2-83 ms. sqlite forms a higher band at 1.9-5.9 s, showing the measured cost of loading files into its in-memory
    database.'
  speedup_overview: Speedup versus the two classical baselines, using median wall time on a log scale. pandas is on the left
    and sqlite is on the SQL tasks on the right; the dashed line is x1. Against pandas, Polars spans x6.7-x43.5 and DuckDB
    spans x4.1-x38.4; both reach up to three orders of magnitude past sqlite (75-1985x). sqlite never crosses x1 against pandas
    (0.01-0.2x, or 5-110x slower), with one n/a exception.
  scalability_lines: The left panel summarizes committed log-log growth exponents for all five tasks; the dashed reference
    at 1.0 means linear growth. The right panel shows the representative group-by curves on seeded 1M / 3M / 10M row tracks.
    pandas and sqlite hold slope ~1.0; Polars and DuckDB are sub-linear (0.31-0.76). At 10M rows, group-by takes 0.020-0.031
    s versus pandas's 1.15 s and sqlite's 26.4 s.
  memory_lollipop: Peak RSS per task from fresh-process probes. Each stem runs from zero to the process high-water mark, so
    compare heights across tasks. pandas reaches 549-945 MB (945 MB on the join); Polars spans 200-529 MB and DuckDB 178-633 MB;
    sqlite runs 396-1520 MB because the loaded frame and its database share the process.
  normalized_heatmap: Each task's median time is scaled to its fastest engine. The log color scale makes a one-step darker
    cell 10x slower. Read a row left to right to rank engines on that task, or a column to see one engine across tasks. The
    write_parquet x sqlite square is n/a because standard-library sqlite has no parquet writer; it is not a zero.
