project_id: 11-data-engineering
short_version: |
  Ten data tasks over 2.96M NYC taxi trips, parity-checked on pandas, Polars, DuckDB and stdlib sqlite: Polars 19x, DuckDB 15x pandas; sqlite answers every SQL task but file conversion leaves it ~29x slower; 1M-10M tracks show the fast two scaling sub-linearly. NYC TLC 2024-01.
sections:
  - id: background
    text_md: |
      **Every data team eventually asks the same question: pandas, Polars,
      DuckDB — or just the sqlite3 that ships with Python?** The internet
      answers with benchmarks, but most are one-off scripts on someone's
      laptop, measuring different queries with no correctness check. This
      project builds the comparison the way the portfolio builds everything
      else: pinned public data, one task contract every engine must satisfy,
      a seeded fallback track for CI, and numbers you can re-run from the
      README.

      ```diagram 11-engine-benchmark
      ```

      The point is not a winner; it is a measured map — which tasks are
      close, which are 40x apart, what the classical engine still costs, and
      what the memory bill looks like.

      **Business summary:** One pinned month of real taxi trips, ten tasks,
      four engines — same contract for all, results checked equal before
      any stopwatch starts.
    figures: []
  - id: objectives
    text_md: |
      **The bar was fixed before any number existed, so the results cannot
      negotiate with it:**

      - Ten tasks on all four engines: parquet read, CSV read, per-day
        group-by, zone join, top-N-per-day window, filtered scan, a
        string-categorical rollup (payment type by vendor), a sorted
        distinct rollup, parquet write, and a 31-file partitioned read.
        sqlite joins every task but one. The parquet write needs a writer
        stdlib sqlite3 does not have, so that cell is honestly n/a.
      - Every task returns the same rows on every engine. Dates, counts,
        and keys match exactly; floats sit within a tight band. A timing
        race without this check is theater.
      - Wall time is the median of 5 warm repeats. Nothing traces the timed
        region, so the tracer cannot skew the race. One extra, untimed pass
        holds the Python-side allocation peak. IO tasks also get one cold
        read in a fresh process. Memory is the fresh-process peak RSS.
      - The whole benchmark reruns from a clean clone: pinned download for
        the real track, a seeded synthetic track for CI in about 26
        seconds, and a seeded 1M / 3M / 10M scalability study for the
        growth curves.
      - Any repeat that drifts from the first result fails the run loudly.

      ```mermaid
      flowchart LR
        subgraph GATE["determinism gate"]
          R["canonical rows<br/>pandas Polars DuckDB sqlite"]
        end
        subgraph TIME["measurement"]
          M["median, 5 warm runs<br/>untraced"]
          C["cold fresh-process read (IO)"]
          X["peak RSS<br/>fresh process"]
        end
        R --> M
        R --> C
        R --> X
      ```

      Parity first, timing second — that order is the entire method.

      **Business summary:** The contract: ten shared tasks, equal results
      as a hard gate, untraced median-of-5 timing plus cold reads and true
      peak memory, fully rerunnable offline in CI.
    figures: []
  - id: data
    text_md: |
      **Real data, pinned twice over.** The track is the NYC TLC yellow-taxi
      file for January 2024 — 2,964,624 trips, 43 MB of parquet — the same
      snapshot family the data registry already pins for project 07
      ([registry card](https://amm-ds.github.io/portfolio/data-registry/nyc-tlc/),
      `registry/nyc-tlc-yellow-2024-01.dvc`). The fetch script pins the
      sha256 of the file it downloads and re-checks it on every run, so a
      republished upstream file fails loudly instead of benchmarking the
      wrong month.

      ```mermaid
      flowchart LR
        RAW["raw parquet (20 cols)<br/>sha256-pinned"] --> CUT["8-column working<br/>projection"]
        ZONES["zone lookup CSV<br/>sha256-pinned"] --> LOOKUP["LocationID to borough"]
        CUT --> PQ["trips.parquet"]
        CUT --> CSV["trips.csv - 157 MB"]
        CUT --> PART["31 per-day parquet<br/>files, hive layout"]
        LOOKUP --> JOIN["join task's<br/>lookup table"]
      ```

      The tasks need eight columns — pickup time, both zone ids, passengers,
      distance, fare, plus vendor and payment type. The last two are cast to
      strings once, up front, so the string-categorical rollup is
      string-shaped here exactly as on the synthetic track. The projection
      keeps the derived CSV at 157 MB instead of roughly 700 MB, and every
      engine reads byte-identical input. The zone lookup carries one quirk
      that matters later: a borough literally named "N/A". The CI and
      scalability tracks regenerate the same schema from a seed,
      deterministic to the checksum.

      **Business summary:** January 2024 yellow-taxi trips, sha256-pinned
      from the same snapshot family project 07 uses; one derived CSV and a
      31-file partitioned layout every engine reads identically.
    figures: []
  - id: eda
    text_md: |
      **What the month looks like.** Just under three million trips across
      35 distinct pickup days — about 95,600 a day on January's 31 — with
      the expected shape: quiet 4 a.m., two evening peaks, business days
      busier than weekends. Money is skewed: a typical fare sits near $16,
      while a long tail of airport and late-night rides stretches past
      $200, and a handful of rows are negative — fare adjustments, kept
      because they are real. That tail feeds the filtered scan (fares over
      $50 and trips over 10 miles).

      Three reading rules follow, and every figure in this study obeys them:

      - Every number comes from runs whose canonical results matched across
        engines — counts and keys exact, float sums within a 1e-5 band.
      - Timings are untraced medians of 5 on one shared machine: trust the
        ordering and the magnitude, not the third decimal. (The first
        protocol traced inside the timed region; it made pandas's group-by
        look 4x slower than it is, which is exactly why tracing moved out.)
      - Memory is measured in a fresh process per task, because a long-lived
        benchmark process would charge earlier tasks' peaks to later ones.

      ```mermaid
      flowchart LR
        M["2.96M trips<br/>~95,600 daily"] --> SHAPE["quiet 4am<br/>two evening peaks"]
        FARE["fares skewed:<br/>typical near $16"] --> TAIL["long tail past $200<br/>feeds filtered scan"]
      ```

      The engine ladder follows, rung by rung.

      **Business summary:** 2.96 million real trips, strongly daily and
      strongly skewed on fare — read every number as an untraced median on a
      shared machine, with parity verified first.
    figures: []
  - id: training
    text_md: |
      **The engines, run the way each is actually used.** pandas reads with
      its pyarrow engine and parses the CSV timestamps. Polars works lazy:
      each task builds a scan plan and pays for it only at collect, so the
      whole plan is timed. DuckDB runs parameterized SQL over one in-memory
      connection — `read_parquet`, `read_csv_auto`, and `COPY ... TO` for
      the write task — letting its parallel aggregator do its own thing.
      sqlite3, the stdlib classical engine, cannot read parquet or CSV at
      all: each task loads the prepared file into a fresh in-memory
      database via pandas (timed — that conversion is the honest cost of
      using it on file-shaped data) and then runs plain SQL, window
      functions included.

      **Execution core — idiomatic engines, identical logical work.** Polars
      collects its lazy plan; DuckDB scans parquet directly with bound paths.
      Both return through the same canonical-row parity contract.

      ```python
      # Polars: build the plan, execute at the boundary
      out = (
          ad.scan_parquet(str(bundle.trips_parquet))
          .group_by(pl.col("tpep_pickup_datetime").dt.date().alias("day"))
          .agg(
              pl.len().alias("trips"),
              pl.sum("fare_amount").alias("total_fare"),
              pl.mean("trip_distance").alias("mean_distance"),
              pl.mean("passenger_count").alias("mean_passengers"),
          )
      )
      result = canonical_rows(ad.to_polars(out.collect()))

      # DuckDB: the same aggregation as parameterized SQL
      frame = ad.query(
          "SELECT CAST(tpep_pickup_datetime AS DATE) AS day, count(*) AS trips,"
          " sum(fare_amount) AS total_fare, avg(trip_distance) AS mean_distance,"
          " avg(passenger_count) AS mean_passengers"
          " FROM read_parquet($1) GROUP BY 1",
          (str(bundle.trips_parquet),),
      )
      result = canonical_rows(frame)
      ```

      Excerpt from [tasks.py](https://github.com/amm-ds/portfolio/blob/main/projects/11-data-engineering/src/data_engineering/tasks.py).
      The speedup figure tells the shape of the map before any detail does.
      Polars finishes the ten-task ladder in 0.16 s of median work against
      pandas's 2.99 s (geomean x19.2); DuckDB totals 0.22 s (geomean
      x14.9). Per task the spread runs x6.7 to x43.5 — which is why one
      number never answers the engine question. sqlite answers everything
      correctly and lands nowhere near the race: its conversions cost
      1.9-5.9 s per task, 40.55 s for the ladder (geomean x0.035 —
      about 29x slower than pandas), and the one task it cannot do, writing
      parquet, stays n/a.

      - **Where pandas bleeds:** the CSV read (1.16 s of its 2.99 s total)
        and the object-heavy group-by and window paths.
      - **Where everyone meets:** raw parquet reads are single-digit
        milliseconds for both columnar engines; at that size the page
        cache, not the engine, sets the price.
      - **Where sqlite surprises:** the join is its best cell (3.65 s) — a
        real engine underneath, priced out by the per-task import.

      What ships to a data platform team? The evaluation setup answers.

      **Business summary:** Polars x19.2 and DuckDB x14.9 over pandas on
      the geomean, a 7-44x spread by task, and sqlite quantified as the
      correct-but-priced-out classical option.
    figures: [speedup_overview]
    metrics_keys: [groupby, read_csv, window]
  - id: evaluation
    text_md: |
      **For a platform team, this answers the sizing question: what an
      engine migration buys on analytics-shaped work, what the classical
      engine still costs, and what it all costs in memory.** The deliverable
      is the measured map, not a slogan — the geomean headline with the
      per-task table next to it, because the map is the story.

      The protocol diagram shows how a cell becomes a number: five warm
      repeats with nothing tracing the timed region, one untimed tracemalloc
      pass for the Python-side allocation peak, one fresh-process probe for
      true peak RSS (and the cold read for IO tasks), and a determinism gate
      between every pair of runs.

      ```mermaid
      flowchart LR
        subgraph CELL["one task, one engine"]
          R1["repeat 1..5 (warm, untraced)<br/>median wall time"]
          T1["one tracemalloc pass (untimed)<br/>Python-side allocation peak"]
          P1["fresh-process probe<br/>peak RSS, cold read"]
        end
        subgraph GATE["determinism gate"]
          G["canonical rows match:<br/>counts exact, floats 1e-5"]
        end
        R1 --> G
        T1 --> G
        P1 --> G --> N["committed cell"]
      ```

      Two findings came from the gate itself, before any figure was drawn.
      First, the parity contract caught pandas silently dropping every trip
      whose borough is the literal string "N/A" — the default CSV parser
      treats it as missing, and the group-by then discards the rows: 1,658
      trips hidden until the cross-engine comparison flagged it. Second, the
      repeat gate caught parallel float drift: DuckDB and Polars may reorder
      summation between runs, and the 295-trip EWR borough sum sat within an
      ulp of a rounding cliff — noise, not drift, so the gate compares
      within a tight float band and fails only on structural change.

      Then the scalability study asks the forward-looking question: how does
      each engine grow? The seeded 1M / 3M / 10M tracks rerun the five most
      discriminating tasks. The growth curves separate by shape, not just
      height: pandas and sqlite scale linearly (log-log slopes 0.98-1.00
      and 1.00-1.09 — every 10x in rows costs ~10x in time), while Polars
      (0.44-0.76) and DuckDB (0.31-0.65) scale sub-linearly, so their
      per-row advantage widens with size. At 10M rows the group-by costs
      pandas 1.15 s, Polars 0.031 s, DuckDB 0.020 s, sqlite 26.4 s; sqlite's
      CSV read needs 19.4 s against Polars's 0.12 s.

      **Business summary:** For platform sizing: per-task speedups with
      per-task memory, one untraced-median cell at a time — and growth
      curves showing the columnar engines pull away with scale while pandas
      and sqlite stay linear.
    figures: [scalability_lines]
  - id: results
    text_md: |
      **What the measured numbers support — and what they do not.** The
      three figures below read as one: the dot plot shows absolute time with
      the repeat-to-repeat whiskers, the lollipops show the memory bill, and
      the heatmap normalizes every task to its best engine so the pattern
      survives log scales.

      - The task-time dots: pandas's CSV read (1.16 s) towers over the
        columnar band (2-83 ms); sqlite's dots form a second, higher band at
        1.9-5.9 s — the conversion tax, visible at a glance.
      - The memory lollipops: pandas peaks at 549-945 MB depending on the
        task (945 MB on the join), Polars stays near 200-529 MB, DuckDB near
        178-633 MB, and sqlite runs hot at 396-1520 MB because the loaded
        frame and its database coexist in the process. On the write task the
        three applicable engines tie at 529-633 MB — the frame has to exist
        somewhere.
      - The heatmap: sqlite is the slowest cell in 9 of 10 tasks; pandas
        only on the parquet write, where sqlite is n/a. Polars takes 9 of 10
        fastest cells, DuckDB the sorted distinct rollup; the
        write_parquet × sqlite square is an honest n/a gap, not a zero.
      - Cold reads add little on this machine because the files sit in the
        OS page cache: pandas's cold CSV read (1.23 s) is the one place
        interpreter startup visibly registers; sqlite's cold tracks its warm
        almost exactly (5.82 vs 5.75 s) because conversion, not startup, is
        its cost.

      Read the geomean with the spread: x19.2 / x14.9 summarize a map that
      runs from 6.7x on the parquet write to 43.5x on the window task.
      Absolute totals for identical results: 2.99 s of median pandas work
      versus 0.16 s (Polars), 0.22 s (DuckDB), and 40.55 s (sqlite).

      The conclusions hold the full record — tables, protocol, limits.

      **Business summary:** Identical results in 0.16-0.22 s instead of
      2.99 s, a 7-44x per-task spread, 2-3x memory headroom for the columnar
      engines — and sqlite's tax measured rather than assumed.
    figures: [task_times_dotplot, memory_lollipop, normalized_heatmap]
  - id: conclusions
    text_md: |
      ## Results summary

      Ten shared data tasks on 2,964,624 real January-2024 taxi trips,
      parity-checked across four engines: Polars totals 0.16 s of median
      work against pandas's 2.99 s (geomean x19.2), DuckDB totals 0.22 s
      (geomean x14.9), and sqlite — correct on every SQL task — totals
      40.55 s (geomean x0.035, about 29x slower than pandas), with
      fresh-process peak RSS of 549-945 MB for pandas against 200-529 MB
      (Polars), 178-633 MB (DuckDB), and 396-1520 MB (sqlite). Every figure
      passed the canonical-result gate.
      [full evaluation report](https://amm-ds.github.io/portfolio/projects/11-data-engineering/)

      ## What the experiment taught

      - The map matters more than the mean: per-task speedups run 6.7-43.5x
        for Polars — one number never answers the engine question.
      - Parity checks are not overhead: pandas's default CSV parsing
        silently dropped the literal "N/A" borough (1,658 trips) until the
        cross-engine comparison caught it.
      - Exact float equality is the wrong determinism bar: parallel engines
        reorder summation, and the 295-trip EWR sum sat on a rounding cliff.
        The gate compares counts and keys exactly, floats within 1e-5.
      - The profiler is not neutral: tracing inside the timed region made
        pandas's group-by look 4x slower than it is; wall time is measured
        untraced, with a separate untimed allocation pass.
      - sqlite is the honest classical baseline: right answers, linear
        growth, a per-task conversion tax of seconds, and one honest gap —
        parquet write stays n/a because stdlib sqlite3 cannot do it.
      - Growth separates engines by shape: Polars and DuckDB scale
        sub-linearly (log-log slopes 0.31-0.76) while pandas and sqlite
        stay linear (0.98-1.09), so the migration case strengthens with
        data volume.

      ## Exact numbers

      Headline: geomean speedup vs pandas x19.2 (Polars), x14.9 (DuckDB);
      medians of 5 untraced warm repeats on one shared machine (macOS
      arm64, 16 cores; pandas 2.3.3, Polars 2.0.0, DuckDB 2.0.0,
      sqlite 3.47.1, pyarrow 26).
      Terms: **speedup**, median pandas time divided by the engine's;
      **peak RSS**, high-water mark of one fresh process per task;
      **cold read**, the same task in a fresh interpreter.

      ```mermaid
      flowchart LR
        subgraph READS["reads + aggregates"]
          direction LR
          A["read parquet"] --> B["read csv"] --> C["group-by"] --> D["join"]
        end
        subgraph XFORMS["transforms"]
          direction LR
          E["window"] --> F["filter"] --> G["strings"] --> H["sort"]
        end
        subgraph WRITES["writes"]
          direction LR
          I["write parquet"] --> J["partitioned read"]
        end
        READS --> XFORMS --> WRITES
      ```

      **Headline table** (median wall time, seconds; x = speedup vs pandas;
      run ids in `reports/metrics.json`):

      | task | pandas | Polars | DuckDB | sqlite | Polars x | DuckDB x |
      |---|---|---|---|---|---|---|
      | read_parquet | 0.044 | 0.002 | 0.003 | 4.869 | 18.0 | 15.4 |
      | read_csv | 1.165 | 0.040 | 0.077 | 5.753 | 29.4 | 15.2 |
      | groupby | 0.374 | 0.009 | 0.010 | 5.179 | 40.7 | 36.2 |
      | join | 0.242 | 0.010 | 0.010 | 3.650 | 25.3 | 23.8 |
      | window | 0.341 | 0.008 | 0.009 | 5.882 | 43.5 | 38.4 |
      | filter | 0.048 | 0.004 | 0.012 | 1.947 | 11.0 | 4.1 |
      | strings_groupby | 0.149 | 0.006 | 0.006 | 4.212 | 25.1 | 25.0 |
      | distinct_sort | 0.075 | 0.007 | 0.005 | 3.866 | 11.4 | 14.3 |
      | write_parquet | 0.500 | 0.074 | 0.083 | n/a | 6.7 | 6.0 |
      | partitioned_read | 0.048 | 0.004 | 0.006 | 5.190 | 13.3 | 7.9 |
      | **total / geomean** | **2.99** | **0.16** | **0.22** | **40.55** | **x19.2** | **x14.9** |

      **Record** (peak RSS, MB, fresh-process probes; cold reads for IO):

      | finding | record |
      |---|---|
      | peak RSS | pandas 549-945 MB (join worst); Polars 200-529; DuckDB 178-633; sqlite 396-1520 (read_csv worst — frame and database coexist) |
      | cold CSV read | pandas 1.23 s cold vs 1.16 s warm; Polars 0.048 s; DuckDB 0.080 s; sqlite 5.82 s (conversion-bound) |
      | fastest per task | Polars takes 9 of 10; DuckDB takes the sorted distinct rollup |
      | scalability | pandas slopes 0.98-1.00 and sqlite 1.00-1.09 (linear); Polars 0.44-0.76 and DuckDB 0.31-0.65 (sub-linear) |
      | parity + determinism | 39/39 measured cells passed the canonical gate; 0 structural mismatches across 5 repeats + traced pass + probe each |

      ## Protocol

      - **Benchmark:** 10 tasks x 4 engines (39 timed cells — write_parquet x
        sqlite is n/a) over the pinned January-2024 slice (2,964,624 rows,
        8-column projection); 5 untraced warm repeats, median wall time; 1
        untimed tracemalloc pass per cell; 1 fresh-process probe per cell
        for peak RSS; cold read for the 4 IO tasks.
      - **Scalability:** the 5 most discriminating tasks x 4 engines on
        seeded synthetic tracks at 1M / 3M / 10M rows; median of 2 warm
        repeats, no probes; per-cell log-log slopes committed.
      - **Correctness:** every task returns canonical rows; counts, keys and
        dates must match exactly across engines and repeats, float sums
        within a 1e-5 relative band (parallel summation reorder is noise).
      - **Synthetic tracks:** same schema from a seeded generator — the CI
        path runs the full protocol in ~26 s; the scalability datasets cache
        under `data/scalability/`, verified against the seeded checksum.
      - **Artifacts:** `reports/metrics.json`, `reports/evaluation_metadata.json`
        (versions + hardware), 5 figures, `report.html`.

      ## Limits

      - One month of one city's taxis: the map is shaped by this schema and
        this machine; other shapes (deeper joins, wider rows) move the
        numbers.
      - Wall-clock medians on a shared laptop: ordering and magnitude are
        stable, the third decimal is not.
      - Cold reads do not drop the OS page cache (not portable without
        root); "cold" means a fresh interpreter, not a cold disk.
      - sqlite's numbers are the from-files workflow (load, then query); a
        long-lived sqlite database would pay the conversion once, not per
        task — that is a different benchmark.
      - The scalability tracks are synthetic (seeded, same schema); they
        measure growth shape, not real-trip behavior at 10M.

      **Business summary:** The map is committed: x19.2 / x14.9 geomean, a
      7-44x spread by task, linear-vs-sub-linear growth curves, and a parity
      gate that proved its worth before the first figure shipped.
    figures: []
