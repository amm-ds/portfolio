project_id: 11-data-engineering
short_version: |
  Eight data tasks over 2.96M NYC taxi trips on pandas, Polars and DuckDB, results parity-checked: Polars x17.3, DuckDB x14.7 vs pandas on the geomean — widest on CSV parsing, narrowest on parquet IO. Parity caught pandas dropping the N/A borough. Data: NYC TLC yellow 2024-01.
sections:
  - id: background
    text_md: |
      **Every data team eventually asks the same question: pandas, Polars, or
      DuckDB?** The internet answers with benchmarks, but most are one-off
      scripts on someone's laptop, measuring different queries with no
      correctness check. This project builds the comparison the way the
      portfolio builds everything else: pinned public data, one task
      contract every engine must satisfy, a seeded fallback track for CI,
      and numbers you can re-run from the README.

      ```mermaid
      flowchart LR
        subgraph ONE["one dataset"]
          D["NYC TLC yellow taxi<br/>January 2024 - 2.96M trips"]
        end
        subgraph THREE["three engines"]
          P["pandas 2.x"]
          PL["Polars lazy"]
          DK["DuckDB SQL"]
        end
        subgraph EIGHT["eight tasks, one contract"]
          T["read / group-by / join /<br/>window / filter / write"]
        end
        D --> P & PL & DK
        P & PL & DK --> T --> C["canonical result<br/>compared, then timed"]
      ```

      The point is not a winner; it is a measured map — which tasks are
      close, which are 100x apart, and what the memory bill looks like.

      **Business summary:** One pinned month of real taxi trips, eight tasks,
      three engines — same contract for all, results checked equal before
      any stopwatch starts.
    figures: []
  - id: objectives
    text_md: |
      **The bar was fixed before any number existed, so the results cannot
      negotiate with it:**

      - Eight tasks on all three engines: parquet read, CSV read, per-day
        group-by, zone join, top-N-per-day window, filtered scan, parquet
        write, and a 31-file partitioned read.
      - Every task returns the same canonical result on every engine —
        dates, counts, and keys exact; floats within a tight band. A timing
        comparison without this is theater.
      - Wall time is the median of 5 warm repeats; IO tasks also get one
        cold read in a fresh process; memory is the fresh-process peak RSS.
      - The whole benchmark reruns from a clean clone: pinned download for
        the real track, a seeded synthetic track for CI in about 15 seconds.
      - Any repeat that drifts from the first result fails the run loudly.

      ```mermaid
      flowchart LR
        subgraph GATE["before any stopwatch"]
          R["canonical rows<br/>pandas vs Polars vs DuckDB"]
        end
        subgraph TIME["then measure"]
          M["median of 5 warm runs"]
          C["cold fresh-process read (IO)"]
          X["peak RSS in a fresh process"]
        end
        R --> M
        R --> C
        R --> X
      ```

      Parity first, timing second — that order is the entire method.

      **Business summary:** The contract: eight shared tasks, equal results
      as a hard gate, median-of-5 timing plus cold reads and true peak
      memory, fully rerunnable offline in CI.
    figures: []
  - id: data
    text_md: |
      **Real data, pinned twice over.** The track is the NYC TLC yellow-taxi
      file for January 2024 — 2,964,624 trips, 50 MB of parquet — the same
      snapshot family the data registry already pins for project 07
      ([registry card](https://amm-ds.github.io/portfolio/data-registry/nyc-tlc/),
      `registry/nyc-tlc-yellow-2024-01.dvc`). The fetch script pins the
      sha256 of the file it downloads and re-checks it on every run, so a
      republished upstream file fails loudly instead of benchmarking the
      wrong month.

      ```mermaid
      flowchart LR
        RAW["raw parquet (20 cols)<br/>sha256-pinned"] --> CUT["6-column working<br/>projection"]
        ZONES["zone lookup CSV<br/>sha-pinned"] --> LOOKUP["LocationID to borough"]
        CUT --> PQ["trips.parquet"]
        CUT --> CSV["trips.csv - 145 MB"]
        CUT --> PART["31 per-day parquet<br/>files, hive layout"]
        LOOKUP --> JOIN["the join task's<br/>lookup table"]
      ```

      The tasks need six columns — pickup time, both zone ids, passengers,
      distance, fare — so the pipeline projects them once, up front. That
      keeps the derived CSV at 145 MB instead of roughly 700 MB, and every
      engine reads byte-identical input. The zone lookup carries one quirk
      that matters later: a borough literally named "N/A". The CI track
      regenerates the same schema from a seed, deterministic to the
      checksum.

      **Business summary:** January 2024 yellow-taxi trips, sha256-pinned
      from the same snapshot family project 07 uses; one derived CSV and a
      31-file partitioned layout every engine reads identically.
    figures: []
  - id: eda
    text_md: |
      **What the month looks like.** Just under three million trips across
      31 days — about 95,600 a day — with the expected shape: quiet 4 a.m.,
      two evening peaks, business days busier than weekends. Money is
      skewed: a typical fare sits near $16, while a long tail of airport and
      late-night rides stretches past $200. That tail is what the filtered
      scan selects (fares over $50 and trips over 10 miles).

      Three reading rules follow, and every figure in this study obeys them:

      - Every number comes from runs whose canonical results matched across
        engines — counts and keys exact, float sums within a 1e-5 band.
      - Timings are medians of 5 on one shared machine: trust the ordering
        and the magnitude, not the third decimal.
      - Memory is measured in a fresh process per task, because a long-lived
        benchmark process would charge earlier tasks' peaks to later ones.

      ```mermaid
      flowchart LR
        M["31 days<br/>about 95,600 trips each"] --> SHAPE["quiet 4am<br/>two evening peaks"]
        FARE["fares skewed:<br/>typical near 16 dollars"] --> TAIL["a long tail past 200 dollars<br/>feeds the filtered scan"]
      ```

      The engine ladder follows, rung by rung.

      **Business summary:** 2.96 million real trips, strongly daily and
      strongly skewed on fare — read every number as a median on a shared
      machine, with parity verified first.
    figures: []
  - id: training
    text_md: |
      **The engines, run the way each is actually used.** pandas reads with
      its pyarrow engine and parses the CSV timestamps. Polars works lazy:
      each task builds a scan plan and pays for it only at collect, so the
      whole plan is timed. DuckDB runs parameterized SQL over one in-memory
      connection — `read_parquet`, `read_csv_auto`, and `COPY ... TO` for
      the write task — letting its parallel aggregator do its own thing.

      The speedup figure tells the shape of the map before any detail does.
      Polars finishes the eight-task ladder in 0.14 s of median work against
      pandas's 4.98 s (geomean x17.3); DuckDB totals 0.16 s (geomean
      x14.7). The spread across tasks is enormous — 5x on raw parquet
      reads, 111-170x on the group-by and window tasks — which is why one
      number never answers the engine question.

      - **Where pandas bleeds:** the per-day group-by and the top-N window
        both build Python-object intermediates (`.dt.date`, per-group
        cumcount) — 1.5 s against roughly 10 ms for both rivals.
      - **Where everyone meets:** warm parquet reads are single-digit
        milliseconds for all three; at that scale the page cache, not the
        engine, sets the price.
      - **Where CSV hurts:** parsing 145 MB of CSV costs pandas 1.44 s of
        the 4.98 s total; Polars does it in 40 ms.

      What ships to a data platform team? The evaluation setup answers.

      **Business summary:** Polars x17.3 and DuckDB x14.7 over pandas on
      the geomean — the gap is 4x on parquet IO, 140x-plus on group-by and
      window work, and pandas spends a third of its whole ladder parsing
      CSV.
    figures: [speedup_vs_pandas, runtime_by_task]
    metrics_keys: [groupby, read_csv, window]
  - id: evaluation
    text_md: |
      **For a platform team, this answers the sizing question: what an
      engine migration buys on analytics-shaped work, and what it costs in
      memory.** The deliverable is the measured map, not a slogan — the
      geomean headline with the per-task table next to it, because the map
      is the story.

      The protocol diagram shows how a cell becomes a number: five warm
      repeats under tracemalloc, one fresh-process probe for true peak RSS
      (and the cold read for IO tasks), and a determinism gate between
      every pair of runs.

      ```mermaid
      flowchart LR
        subgraph CELL["one task x one engine"]
          R1["repeat 1..5 (warm)<br/>median wall time"]
          P1["fresh-process probe<br/>peak RSS / cold read"]
        end
        subgraph GATE["determinism gate"]
          G["canonical rows match:<br/>counts exact, floats 1e-5"]
        end
        R1 --> G
        P1 --> G --> N["the committed cell"]
      ```

      Two findings came from the gate itself, before any figure was drawn.
      First, the parity contract caught pandas silently dropping every trip
        whose borough is the literal string "N/A" — the default CSV parser
        treats it as missing, and the group-by then discards the rows: 1,658
        trips hidden until the three-engine comparison flagged it. Second,
        the repeat gate caught parallel float drift: DuckDB and Polars may
        reorder summation between runs, and a 295-trip borough sum sat
        within an ulp of a rounding cliff — noise, not drift, so the gate
        compares within a tight float band and fails only on structural
        change.

      The measured record follows.

      **Business summary:** For platform sizing: per-task speedups with
      per-task memory, one fresh process per measurement — and a gate that
      caught a real pandas data-loss bug and the parallel-float rounding
      cliff before either reached a figure.
    figures: [io_cold_warm]
  - id: results
    text_md: |
      **What the measured numbers support — and what they do not.** The
      memory figure is the second half of the map: pandas peaks at 450-800
      MB depending on the task (799 MB on the join), Polars stays near
      196-428 MB, DuckDB near 177-455 MB. On the write task all three land
      around 428-455 MB — the frame has to exist somewhere. Cold reads add
      little on this machine because the files sit in the OS page cache;
      pandas's cold CSV read (1.15 s) is the one place process startup
      visibly registers.

      - Read the geomean with the spread: x17.3 / x14.7 summarize a map
        that runs from 3-5x (parquet IO) to 112-158x (group-by, window).
      - The single-task crown is nearly all Polars — Polars takes 6 of 8;
        DuckDB takes the join and the parquet write.
      - Absolute totals: 4.98 s of median pandas work versus 0.14 s
        (Polars) and 0.16 s (DuckDB) for the identical results.
      - Memory is not the migration's prize: the wins are time and code
        shape; the RSS gap is a comfortable 2-3x on the heavy tasks.

      The conclusions hold the full record — tables, protocol, limits.

      **Business summary:** Identical results in 0.14-0.16 s instead of
      4.98 s, with peak memory 2-3x lower on the heavy tasks — read as a
      map from 3x to 170x, not as one average.
    figures: [memory_by_task]
  - id: conclusions
    text_md: |
      ## Results summary

      Eight shared data tasks on 2,964,624 real January-2024 taxi trips,
      parity-checked across engines: Polars totals 0.14 s of median work
      against pandas's 4.98 s (geomean x17.3) and DuckDB's 0.16 s (geomean
      x14.7), with fresh-process peak RSS of 446-797 MB for pandas against
      196-428 MB (Polars) and 177-455 MB (DuckDB). Every figure passed the
      canonical-result gate.
      [full evaluation report](https://amm-ds.github.io/portfolio/projects/11-data-engineering/)

      ## What the experiment taught

      - The map matters more than the mean: per-task speedups run 3-5x on
        parquet IO and 112-158x on group-by and window work — one number
        never answers the engine question.
      - Parity checks are not overhead: pandas's default CSV parsing
        silently dropped the literal "N/A" borough (1,658 trips) until the
        three-engine comparison caught it.
      - Exact float equality is the wrong determinism bar: parallel engines
        reorder summation, and a 295-trip sum sat on a rounding cliff. The
        gate compares counts and keys exactly, floats within 1e-5.
      - CSV parsing, not compute, is pandas's heaviest tax: 1.44 s of its
        4.98 s ladder — the strongest single-task case for Polars (x36).
      - Warm parquet reads are a tie (single-digit milliseconds): below
        some size the page cache, not the engine, sets the price.

      ## Exact numbers

      Headline: geomean speedup vs pandas x17.3 (Polars), x14.7 (DuckDB);
      medians of 5 warm repeats on one shared machine (macOS arm64, 16
      cores; pandas 2.3.3, Polars 2.0.0, DuckDB 2.0.0, pyarrow 26).
      Terms: **speedup**, median pandas time divided by the engine's;
      **peak RSS**, high-water mark of one fresh process per task; **cold
      read**, the same task in a fresh interpreter.

      ```mermaid
      flowchart LR
        A["read parquet"] --> B["read csv"] --> C["group-by"] --> D["join"]
        D --> E["window"] --> F["filter"] --> G["write parquet"] --> H["partitioned read"]
      ```

      **Headline table** (median wall time, seconds; x = speedup vs pandas;
      run ids in `reports/metrics.json`):

      | task | pandas | Polars | DuckDB | Polars x | DuckDB x |
      |---|---|---|---|---|---|
      | read_parquet | 0.014 | 0.003 | 0.003 | 5.4 | 4.7 |
      | read_csv | 1.444 | 0.040 | 0.064 | 36.4 | 22.6 |
      | groupby | 1.517 | 0.010 | 0.014 | 158.1 | 111.5 |
      | join | 0.205 | 0.010 | 0.010 | 20.6 | 21.3 |
      | window | 1.491 | 0.011 | 0.012 | 137.6 | 122.4 |
      | filter | 0.018 | 0.005 | 0.005 | 3.9 | 3.9 |
      | write_parquet | 0.277 | 0.056 | 0.050 | 4.9 | 5.5 |
      | partitioned_read | 0.017 | 0.004 | 0.005 | 4.7 | 3.3 |
      | **total / geomean** | **4.98** | **0.14** | **0.16** | **x17.3** | **x14.7** |

      **Record** (peak RSS, MB, fresh-process probes; cold reads for IO):

      | finding | record |
      |---|---|
      | peak RSS | pandas 446-797 MB (join worst); Polars 196-428; DuckDB 177-455 (write 428-455 ties pandas — the frame must exist somewhere) |
      | cold CSV read | pandas 1.15 s cold vs 1.44 s warm; Polars 0.04 s; DuckDB 0.07 s |
      | fastest per task | Polars takes 6 of 8; DuckDB takes the join and the parquet write |
      | parity + determinism | 24/24 cells passed the canonical gate; 0 structural mismatches across 5 repeats + 1 probe each |

      ## Protocol

      - **Benchmark:** 8 tasks x 3 engines over the pinned January-2024
        slice (2,964,624 rows, 6-column projection); 5 warm repeats, median
        wall time; 1 fresh-process probe per cell for peak RSS; cold read
        for the 4 IO tasks.
      - **Correctness:** every task returns canonical rows; counts, keys and
        dates must match exactly across engines and repeats, float sums
        within a 1e-5 relative band (parallel summation reorder is noise).
      - **Synthetic track:** same schema from a seeded generator, the full
        protocol in ~15 s — the CI path.
      - **Artifacts:** `reports/metrics.json`, `reports/evaluation_metadata.json`
        (versions + hardware), 4 figures, `report.html`.

      ## Limits

      - One month of one city's taxis: the map is shaped by this schema and
        this machine; other shapes (wide string group-bys, deeper joins)
        move the numbers.
      - Wall-clock medians on a shared laptop: ordering and magnitude are
        stable, the third decimal is not.
      - Cold reads do not drop the OS page cache (not portable without
        root); "cold" means a fresh interpreter, not a cold disk.
      - The parquet read task is page-cache-bound at this size; a
        bigger-than-RAM track would separate the engines further and is
        deferred.

      **Business summary:** The map is committed: x17.3 / x14.7 geomean, a
      3-158x spread by task, 2-3x memory headroom, and a parity gate that
      proved its worth before the first figure shipped.
    figures: []
roadmap:
  - status: delivered
    text: "Pinned the NYC TLC 2024-01 slice (sha256) with derived CSV and 31-way partitioned layout, plus a seeded synthetic CI track."
  - status: delivered
    text: "Built the 8-task contract on all three engines with canonical-result parity as a hard gate."
  - status: delivered
    text: "Measured median-of-5 wall time, cold fresh-process reads, and true peak RSS probes; geomean x17.3 (Polars), x14.7 (DuckDB)."
  - status: delivered
    text: "The gates earned their keep: parity caught pandas dropping the N/A borough; the repeat gate caught parallel-float rounding cliffs."
  - status: deferred
    text: "Bigger-than-RAM out-of-core track (cold page cache, spill-to-disk) — the current parquet reads are page-cache-bound."
key_concepts:
  - "**Wall-time speedup** — one engine's median run time divided into another's; read per task, summarized as a geomean."
  - "**Peak RSS** — the high-water mark of resident memory; measured in a fresh process so earlier tasks cannot be charged to later ones."
  - "**Canonical result contract** — every engine must return the same rows for a task (counts exact, floats within a tight band) before timing counts."
  - "**Lazy evaluation** — building a query plan first and paying for it only at execution; Polars's default and the reason its whole plan is timed."
  - "**DuckDB** — an in-process SQL engine over files; table functions like `read_parquet` query parquet directly, and its parallel sum reorders floats between runs."
  - "**Predicate pushdown** — applying filters while reading so unread rows never materialize; the filtered-scan task measures it."
figure_captions:
  speedup_vs_pandas: >-
    Wall-time speedup vs pandas per task (median of 5, log scale), with the geomean
    annotated. The spread is the story: 3-5x on parquet IO, 21-36x on joins and CSV,
    and 111-158x on the group-by and window tasks where pandas builds Python-object
    intermediates.
  runtime_by_task: >-
    Median warm runtime per task and engine (log scale). The eight-task ladder totals
    4.98 s for pandas against 0.14 s (Polars) and 0.16 s (DuckDB) for identical,
    parity-checked results; every cell passed the determinism gate.
  memory_by_task: >-
    Peak RSS per task from fresh-process probes: pandas reaches 446-797 MB (797 MB on
    the join) while Polars stays near 196-428 MB and DuckDB 177-455 MB; on the write
    task all three tie around 428-455 MB — the frame must exist somewhere.
  io_cold_warm: >-
    Cold fresh-process reads vs warm in-process medians for the four IO tasks. The OS
    page cache stays warm throughout, so cold only adds interpreter startup — visible
    on pandas's 1.15 s CSV read, negligible elsewhere.
