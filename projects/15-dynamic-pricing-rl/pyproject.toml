[project]
name = "15-dynamic-pricing-rl"
version = "0.1.0"
description = "Constrained dynamic pricing in an M5-calibrated Gymnasium environment."
requires-python = ">=3.12"
dependencies = [
    "gymnasium==1.4.0",
    "stable-baselines3==2.9.2",
    "sb3-contrib==2.9.2",
    "scipy",
    "numpy>=2.1",
    "polars>=1.9",
    "pyarrow",
    "pyyaml>=6.0",
    "typer>=0.12",
    "plotly>=5.24",
    "portfolio-core",
    "portfolio-eval",
]

[project.scripts]
dynamic_pricing = "dynamic_pricing.cli:app"

[tool.uv.sources]
portfolio-core = { workspace = true }
portfolio-eval = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dynamic_pricing"]
