  profit_vs_baselines: "Mean normalised profit on 1,000 sealed test episodes with per-policy episode-bootstrap 95% intervals. RL reaches 0.5120 and trails locked B1 at 0.5217; UB is a relaxed ceiling."
  price_traces: "B1 and RL price multipliers over 91 days for fixed-seed test episodes 89, 654, and 773. Episodes were selected before outcomes were inspected and traced during the single sealed pass."
  bound_share_by_rho: "Ratio of mean policy profit to mean relaxed fluid upper bound by inventory pressure rho. RL reaches 96.76% overall versus 98.60% for B1; UB is not executable."
