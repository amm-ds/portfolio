project_id: 04-nlp-classification
short_version: |
  AG News sorter: the selected transformer + selective LLM cascade shows no measurable change in fresh macro-F1 (0.953 → 0.954, +0.001) and accuracy (0.953 → 0.954), reviewing 22 of 1,000 fresh items. Full evaluation: $0.023671 cloud-equivalent. License: research purposes.
sections:
- id: background
  text_md: |
    **A full-data transformer sorts fresh news at `0.9529` `macro-F1`; reviewing `22` uncertain items adds only `+0.001`.**
    `AG News` holds `127,600` items (`120k` train). A `TF-IDF` keyword model scores `0.8785` fresh at `~40×` speed and zero token cost, while the full-data transformer reaches `0.9529` before any `LLM` review.

    ```diagram auto-04-nlp-classification-3
    ```

    Follow the routing flow in three steps:

    - **Fast pass:** Score every item locally with the full-data transformer.
    - **Confidence gate (`τ = 0.6`):** Send only the uncertain `2.2%` (`22` per `1,000`) to the `kimi-for-coding` reviewer.
    - **Outcome:** Fresh `macro-F1` reaches `0.9539`; without per-row decisions, that small gain has no paired interval.

    We next define the rungs each candidate must climb ([Objectives →](#sec-objectives)).

    **In plain terms:** The local neural model gets 95.3% of fresh articles right; a large AI model double-checks 22 uncertain cases per 1,000, but the tiny improvement is not proven to be real.
  figures: []
- id: objectives
  text_md: |
    **The goal is to find the cheapest model step that earns its measured
    gain.** The ladder diagram shows five rungs, from two simple floors to a
    transformer fitted on 108k training rows with 12k held out for validation. A floor is a
    trivial reference policy. The first always predicts the majority topic.
    The second makes seeded random guesses. A seed fixes a random starting
    point so another run can repeat it.

    The third rung uses `TF-IDF` with logistic regression. `TF-IDF` means term
    frequency-inverse document frequency. It turns words into numbers based
    on how often they appear and how distinctive they are. Logistic
    regression uses those numbers to estimate topic probabilities. The last
    two rungs train a compact transformer on the bounded, or size-limited,
    sample and then on all available rows.

    Each rung must beat the one below it. Otherwise, its extra cost buys no
    measured gain. The judge below the diagram uses two metrics:

    - **Accuracy:** the share of all predictions that are correct.
    - **Macro-F1:** the unweighted mean of per-topic F1, so a rare topic
      counts as much as a common one.

    The protocol follows the diagram's order:

    - Beat both trivial floors before claiming value from a complex model.
    - Establish the keyword baseline before testing a transformer.
    - Tune and select with a seeded validation protocol; report paired
      uncertainty and allow an inconclusive result.
    - Keep every bounded rung reproducible on a laptop, then test the full
      120k split.

    ```diagram auto-04-nlp-classification-1
    ```

    The final node in the diagram records the main caveat. Validation selects
    the hyperparameter-optimization (`HPO`) candidate, but its paired interval crosses zero, so the tuning
    result is inconclusive. Test labels are excluded from that decision.
    Starting with the largest model would spend the budget before establishing
    a cheaper comparison.

    We next fix the four data views that keep these five rungs and one judge
    fair ([Data →](#sec-data)).

    **In plain terms:** Every text classifier must beat simple guessing on both overall accuracy and topic balance, with the final choice locked on validation data rather than test-set luck.
  figures: []
- id: data
  text_md: |
    `AG News` holds `127,600` headline-plus-description items across four topics.
    The standard training portion has 120k rows. Its license is limited to
    research purposes per
    [the dataset card](https://amm-ds.github.io/portfolio/data-registry/ag-news/).
    The data-lineage diagram shows how four fixed views make the model ladder
    a fair comparison.

    Follow the four views in the diagram:

    - **Sample split:** a seeded, stratified sample has `3,600` training rows,
      400 validation rows, and a 1,000-article test set with exactly 250 per
      topic. Stratified means each split preserves the topic balance.
      Validation data guides model choices. Test data measures the result.
    - **Full split:** the full 120k portion supplies 108k training rows and
      12k validation rows, with the same test set. This tests whether the
      recipe scales beyond the laptop-friendly sample.
    - **Fresh holdout:** `1,000` articles come from the test partition's other `6,600` rows.
      A holdout is data kept out of training and selection. This one is
      disjoint by construction, so no article overlaps the bounded test set.
    - **Scale ladder:** the same seeded protocol runs at 3.6k, 10.8k, 36k, and
      108k training rows. Only data size changes.

    ```diagram auto-04-nlp-classification-2
    ```

    The validation branch freezes model selection before test scoring. The
    separate 6,600-row branch feeds the fixed fresh holdout, which supplies
    diagnostics and never changes the selected candidate. Equal topic shares
    in the shared test set prevent class priors, or topic frequencies, from
    explaining a score gap.

    We next inspect the balance figure that makes the bounded test readable
    while selection and diagnostics stay apart ([EDA →](#sec-eda)).

    **In plain terms:** Four clean data views keep testing honest: a small sample for quick tuning, the full 120,000-article dataset, a brand-new holdout set, and a size-scaling check.
  figures: []
- id: eda
  text_md: |
    The class-balance figure shows why the bounded comparison is readable.
    Look for four equal bars and the text-length distribution. Each bounded
    class is exactly 25%. Training texts cluster at 20–50 words, well inside
    the 128-token budget. Truncation means cutting off text beyond that
    budget. Neither topic volume nor truncation explains the bounded gaps.

    Three design choices guide the comparison:

    - **Balanced classes:** the figure's four even bars stop a model from
      gaining through topic frequency alone.
    - **Short texts:** the 20–50-word cluster keeps the articles within the
      model's input limit.
    - **Two metrics:** accuracy and `macro-F1` judge every rung. Macro-F1 is
      the stricter companion because it gives every topic equal weight. Two
      naive floors, majority-class prediction and random guessing, set the
      minimum bar on the fixed 1,000-article test set.

    The figure cannot quantify model-selection uncertainty. That comes from
    the paired validation bootstrap: HPO minus default is `+0.0073` `macro-F1`
    with `95%` `CI` [`−0.0048`, `+0.0204`], so the choice is inconclusive. The bounded
    test and fixed fresh holdout never enter that selection.

    We next examine how the transformer trained and where tuning stopped ([Training →](#sec-training)).

    **In plain terms:** All four news topics are evenly balanced and articles are short, so simple baselines set a clear floor before neural models run.
  figures: [eda_class_balance]
- id: training
  text_md: |
    **Two figures show how the transformer learned and where tuning
    stopped.** The ladder measurements give their context. On shared test,
    the two floors score `0.1000` and `0.2533` macro-F1. The keyword model reaches
    `0.8714`, the bounded transformer `0.9021`, and the full-data model 0.9460.
    Fresh scores preserve the order: `0.8785`, `0.8962`, and 0.9529. The full-data
    advantage is therefore not just an artifact of selecting on test data.

    - **More data moved the score.** The `scale_ladder` figure in Results gives
      the direct view. At identical settings, each tripling adds +1.5, +1.6,
      and +1.3 `macro-F1` points on test. Fresh gains are +1.5, +2.1, and +1.0.
      Same-rows device twins differ by `0.0002` on test and `0.0105` on fresh
      `macro-F1`. The fresh gap is comparable to the final `+0.010` fresh scale
      gain, so fresh results alone cannot rule out a device effect. The
      fixed-device rungs isolate the scale effect.
    - **Tuning changed little.** In `hpo_history`, follow the running best
      across all twelve trials. Seeded search lifts validation `macro-F1` from
      `0.8880` to 0.8953. Validation selects HPO, but the paired `+0.0073` delta
      has `95%` `CI` [`−0.0048`, `+0.0204`]: inconclusive. That margin is about
      `1.7` times the `0.0042` standard deviation across three seed reruns
      (mean `0.8910`), and the paired interval still crosses zero.
    - **Temperature scaling improved confidence without changing predictions.**
      This calibration method fits one temperature on validation data. Expected
      calibration error (`ECE`) measures the gap between confidence and observed
      accuracy. For the bounded selected model, it falls from `0.0360` to `0.0227` on test. Read this beside
      `training_curve`: its `macro-F1` line tracks predictions, while calibration
      changes only confidence.
    - **Errors concentrate where topics blur.** The confusion matrix in
      Results shows Business predicted as Sci/Tech for 25 of 250 bounded test
      items. Hybrid headlines remain unsolved; the exact pre-ladder diagnostic is
      separated from the controlled scale ladder in Conclusions.

    **Calibration fits one temperature on validation NLL.** NLL, or negative
    log-likelihood, penalizes confident wrong predictions. Logits are the
    classifier's raw scores before probabilities. The code keeps logits and
    labels fixed and scales only confidence.

    ```python
    logits, labels = collect_logits(model, val_ds, device, batch_size)
    temperature = nn.Parameter(torch.ones(1))
    optimizer = torch.optim.LBFGS([temperature], max_iter=max_iter)

    def closure() -> torch.Tensor:
        optimizer.zero_grad()
        loss = nn.functional.cross_entropy(
            logits / temperature.clamp(min=1e-2), labels
        )
        loss.backward()
        return loss

    optimizer.step(closure)
    fitted = float(temperature.clamp(min=1e-2).item())
    nll = float(nn.functional.cross_entropy(logits / fitted, labels).item())
    logger.info("temperature scaling: T=%.4f (val NLL=%.4f)", fitted, nll)
    return fitted
    ```

    Excerpt from [calibration.py](https://github.com/amm-ds/portfolio/blob/main/projects/04-nlp-classification/src/nlp_classification/calibration.py).
    In `training_curve`, the left panel is the two-epoch headline run and the
    right panel is the separate four-epoch probe. Solid and dotted histories
    never join: the probe's four-epoch learning-rate schedule differs from the
    headline schedule, and the star marks the headline endpoint only. An epoch
    is one pass through the training data. The probe peaks at validation
    `macro-F1` `0.9477` in epoch 3, then slides while validation loss rises. Extra
    epochs overfit, meaning they learn training detail that does not generalize.
    The probe confirms the default instead of replacing it.

    We next turn these measurements into an operating policy ([Evaluation →](#sec-evaluation)).

    **In plain terms:** More training data beats fancy tuning: each tripling of data adds roughly 1.5 percentage points of accuracy, reaching 95.3% on fresh articles, while a simple calibration step fixes confidence scores for free.
  figures: [training_curve, hpo_history]
  metrics_keys: [baseline_tfidf_logreg, encoder_b, distilbert, distilbert_tuned, distilbert_scale_4000, distilbert_scale_12000,
    distilbert_scale_40000, distilbert_full_120k]
- id: evaluation
  text_md: |
    The evaluation diagram turns the measurements into an operating policy.
    Follow an item from the full-data transformer to the confidence gate. The
    gate uses the full-data model's raw softmax maximum probability. Temperature
    `T=0.927` belongs to the bounded selected model and is not applied to this
    gate. Confident predictions stay unchanged. Only rows below τ=0.6
    go to `kimi-for-coding` in batches of eight. A cascade is a sequence of
    models with later stages handling selected cases. This cascade reviews
    selectively. It does not classify every item with an LLM.

    ```diagram auto-04-nlp-classification-3
    ```

    The comparison figure supplies the measured outcome for each diagram
    branch. Validation alone selects τ=0.6: its `+0.00005` `macro-F1` gain
    with 6 reviews wins a tie-break toward fewer reviews. Test and fresh are
    then each scored once. Macro-F1 moves `0.9602` → `0.9602` on validation with
    6 reviews, `0.9460` → `0.9490` on bounded test with 16, and `0.9529` →
    `0.9539` on the disjoint fresh `1,000` with 22. Accuracy stays `0.960` on
    validation and moves `0.946` → `0.949` on test and `0.953` → `0.954` on fresh.
    Fresh items have zero overlap with bounded test. Neither test nor fresh
    labels or examples tune the router.

    Across validation, test, and fresh, the figure reflects **44 total
    reviews**, with respective `macro-F1` deltas of `+0.0001`, `+0.0030`, and
    `+0.001`. Measured review latency,
    the time spent waiting for those reviews, is **`96.933` s** in total. The
    **`$0.023671` cloud-equivalent** cost is an estimate from a rate card, not
    an observed cloud bill. No paired cascade interval can be computed from
    committed artifacts — the per-row review decisions are not persisted —
    so these deltas do not establish superiority.

    The figure also keeps the cheaper baseline in view. Keyword-first routing
    reaches `0.9061` fresh `macro-F1` while `75.4%` of items run at keyword speed.
    The full-data transformer reaches `0.9529` fresh. The selected cascade
    adds only 22 fresh reviews to that stronger baseline. Separate one-machine
    probes measure ~`4,478` items/s on the keyword path and ~111 items/s on the
    transformer. The comparison figure does not show those speeds, and the
    probes do not price the hosted review pass.

    We next use three test figures to explain and bound this measured trade-off ([Results →](#sec-results)).

    **In plain terms:** Only 22 uncertain articles per 1,000 get a second opinion from a large AI model; the resulting one-point-per-thousand gain is too small to count as proven.
  figures: [llm_cascade_comparison]
- id: results
  text_md: |
    **The three figures explain both the gain and its limits.** Validation
    freezes the bounded candidate before these test diagnostics are scored;
    the paired validation comparison remains inconclusive.

    - In `confusion_matrix_selected`, look for the largest off-diagonal cell.
      A confusion matrix compares actual topics with predicted topics. It uses
      the bounded transformer, not the final cascade. Business predicted as
      Sci/Tech dominates, with 25 of 250 bounded test items.
    - In `per_class_f1_comparison`, compare the topic bars. Per-class F1
      measures each topic separately. The same Business and Sci/Tech blur
      accounts for the residual gap.
    - In `scale_ladder`, follow the rising scores as training rows increase.
      Same-rows CPU and MPS twins sit `0.0002` test `macro-F1` apart. CPU is the
      computer's main processor. MPS is Apple's framework for GPU computing.
      A GPU is a processor built for parallel numerical work. Their fresh gap is
      `0.0105`, comparable to the last fresh scale gain; the fixed-device ladder,
      not the fresh twin alone, isolates the data-scale effect.

    These figures diagnose the bounded models and scale ladder. They do not
    depict the final cascade. Its measured `macro-F1` is `0.9490` on bounded
    test and `0.9539` on fresh data. The fixed fresh data is diagnostic and
    does not reselect any candidate.

    The figures also bound what can be claimed:

    - **Production breadth:** they cover English-only items with four clean
      topics. Overlapping or multi-label topics, where one item can have
      several labels, need a different contract.
    - **Measurement limits:** the cascade requests 44 reviews across three
      fixed splits, with different deltas on each. Transformer speeds use one
      machine at batch size 1.
    - **Tuning headroom:** HPO's `+0.0073` margin is about `1.7` seed standard
      deviations and its paired interval crosses zero. A larger budget might
      separate candidates, but that is unproven.

    We next preserve the exact tables, run identities, and protocol behind
    these visual summaries ([Conclusions →](#sec-conclusions)).

    **In plain terms:** The local model gets 95.3% of fresh articles right; checking 22 uncertain items per 1,000 changes that to 95.4%, but the evidence cannot show whether this tiny gain is real.
  figures: [confusion_matrix_selected, per_class_f1_comparison, scale_ladder]
- id: conclusions
  text_md: |
    ## Results summary

    The final diagram shows the selected path: full-data transformer,
    confidence gate, and selective `LLM` review. Read it with the exact tables
    below. On the fresh 1,000-article holdout, this path moves `macro-F1` from
    **`0.9529` to `0.9539`** (`+0.001`) and accuracy from **`0.953` to `0.954`**.
    It reviews 22 rows below τ=0.6. Bounded test moves from `0.9460` to `0.9490`
    `macro-F1` and `0.946` to `0.949` accuracy with 16 reviews. All 44 reviews across
    validation, test, and fresh take `96.933` s. Their `$0.023671`
    cloud-equivalent cost is estimated. `TF-IDF` + logistic regression remains
    the 0.8785-fresh-macro-F1 baseline. The keyword-first router reaches
    `0.9061` with `75.4%` of items at keyword speed.
    [Full evaluation report](https://amm-ds.github.io/portfolio/projects/04-nlp-classification/).

    ## What the experiment taught

    The diagram summarizes the serving choice. It does not show training
    scale, tuning, calibration, or error analysis. The exact tables and the
    earlier figures carry that evidence.

    - More data moved the transformer score at fixed device. Each tripling
      bought about +1.5 macro-F1. Same-rows device twins differed by `0.0002`
      on test; their `0.0105` fresh gap does not independently rule out a fresh
      device effect.
    - Tuning was inconclusive. Validation selected HPO by `+0.0073` `macro-F1`,
      but its paired `95%` `CI` [`−0.0048`, `+0.0204`] crosses zero. The margin is about `1.7`
      times the `0.0042` standard deviation across three seeds (mean `0.8910`).
    - Selective `LLM` review changed `macro-F1` by `+0.0001`, `+0.0030`,
      and `+0.001` on validation, bounded test, and fresh respectively.
    - Data leakage means evaluation information influencing model choices.
      Validation-only model and threshold fitting keep test/fresh labels out
      of those choices; fresh candidate scores are diagnostics only.
    - Temperature scaling cut test `ECE` from `0.0360` to `0.0227` without
      changing a single prediction.

    ## Limits

    The diagram's selected score does not remove these limits:

    - Validation selects the bounded model, but its paired `CI` crosses zero.
      The fresh candidate comparison is also inconclusive and never reselects.
    - The reading is per-item, English-only, on four clean topics. Multi-label
      Business/Sci-Tech routing needs a different label and metric contract.
    - The cascade deltas (`+0.0001` validation, `+0.0030` bounded test,
      `+0.001` fresh) lack paired intervals and are bounded to these fixed splits. They do not justify sending every item to an `LLM` or
      establish production breadth or superiority.
    - All serving speeds come from one machine at batch size 1.
    - HPO's paired interval crosses zero at this scale. A larger budget might
      separate candidates, but this project neither proves nor disproves that
      possibility.

    ```diagram auto-04-nlp-classification-4
    ```

    ## Exact numbers

    `DistilBERT` and `RoBERTa` are transformer model designs. The run ids below
    identify each measured configuration. The bounded ladder uses the shared 1,000-row test set and
    records its run ids in `reports/metrics.json`:

    | # | run | accuracy | f1_macro |
    |---|---|---|---|
    | 1 | `naive_majority` | 0.2500 | 0.1000 |
    | 2 | `random_uniform` | 0.2540 | 0.2533 |
    | 3 | `baseline_tfidf_logreg` | 0.8720 | 0.8714 |
    | 4 | `encoder_b` (roberta-base) | 0.8980 | 0.8982 |
    | 5 | `distilbert` (bounded) | 0.9020 | 0.9021 |
    | 6 | `distilbert_tuned` (bounded; validation-selected HPO) | 0.9010 | 0.9011 |
    | 7 | `distilbert_full_120k` | 0.9460 | 0.9460 |

    Fresh-holdout diagnostics (`reports/fresh_holdout.json`; `1,000` rows drawn
    from the 6,600-row complement of the bounded split, disjoint by
    construction, no retraining or reselection):

    | run | fresh acc | fresh macro-F1 |
    |---|---|---|
    | `baseline_tfidf_logreg` | 0.8790 | 0.8785 |
    | `distilbert` (initial bounded artifact) | 0.8960 | 0.8962 |
    | `distilbert_tuned` candidate (HPO-retrained) | 0.9030 | 0.9031 |
    | `encoder_b` (roberta-base) | 0.9070 | 0.9074 |
    | `distilbert_full_120k` | 0.9530 | 0.9529 |

    Fresh HPO minus default is `+0.0069` `macro-F1` with paired `95%` `CI`
    [`−0.0025`, `+0.0161`]: inconclusive, with no change to validation selection.

    Selected cascade (`reports/llm_cascade.json`; τ=0.6, eight rows per review
    call, `selected=cascade`):

    | split | transformer → cascade macro-F1 | transformer → cascade accuracy | reviews |
    |---|---:|---:|---:|
    | validation | 0.9602 → 0.9602 | 0.960 → 0.960 | 6 |
    | bounded test | 0.9460 → 0.9490 | 0.946 → 0.949 | 16 |
    | fresh holdout | 0.9529 → 0.9539 | 0.953 → 0.954 | 22 |

    Total: 44 reviews, `96.933` s measured review latency, and `$0.023671`
    estimated cloud-equivalent cost. The threshold is fitted on validation only.
    Test and fresh are scored once, with no fresh/bounded overlap and no
    test/fresh labels or examples used for tuning. Cascade deltas are point
    estimates without a persisted paired interval.

    At fixed device and hyperparameters, each `3×` data step buys +1.5, +1.6,
    and +1.3 `macro-F1` points on test. Scores rise at every step, while the
    gains slow. Fresh
    gains are +1.5 / +2.1 / +1.0 points. Same-rows device twins differ by
    `0.0002` test and `0.0105` fresh `macro-F1`; the latter is comparable to the
    final fresh scale gain. A separate pre-ladder diagnostic, not a controlled
    rung, tracks Business → Sci/Tech confusion at `24/250` → `15/250` → `14/250`
    across the original default 3.6k / 20k-subset (18k train / 2k validation) /
    full runs (`DESIGN.md`).

    Serving means using a trained model to make predictions. This
    confidence-routed table uses the fresh holdout. The `TF-IDF` max-probability
    router sends items below τ to the served transformer:

    | τ | escalated | macro-F1 |
    |---|---|---|
    | 0.50 | 24.6% | 0.9061 |
    | 0.60 | 40.4% | **0.9082** |
    | 0.70 | 59.8% | 0.9051 |
    | 0.80 | 77.5% | 0.9041 |
    | 0.90 | 94.8% | 0.9041 |

    Serving economics come from an Apple M4 Max probe with CPU batch=1 and
    n=200, meaning 200 measured items. The rate card is $1/M input + $4/M
    output tokens. MB is model size in megabytes. `p50` ms is median latency in
    milliseconds. pred/s is predictions per second. $/1k is estimated cost per
    `1,000` items. acc is accuracy. fp32 is a 32-bit floating-point format for
    model numbers.

    | variant | MB | p50 ms | pred/s | $/1k | acc | f1 |
    |---|---|---|---|---|---|---|
    | `tfidf_logreg` | 0.5 | 0.2 | 4477.8 | 0.0000 | 0.8720 | 0.8714 |
    | `distilbert_tuned` fp32 | 255.5 | 9.0 | 110.7 | 0.0656 | 0.9010 | 0.9011 |
    | `distilbert_full_120k` fp32 | 255.5 | 8.7 | 112.5 | 0.0654 | 0.9460 | 0.9460 |

    ## Protocol

    These details define the measurements behind the diagram and tables.

    - Bounded sample split: seeded, stratified `4,000` articles → `3,600` train /
      400 validation; shared test set of `1,000` articles, exactly 250 per topic
      (bounded test draw seed 43). Full split: 108k train / 12k validation from
      the 120k training portion.
    - Model selection: validation `macro-F1` chooses HPO over the default by
      +0.0073. A paired row bootstrap uses `2,000` resamples and seed 42; its
      `95%` `CI` [`−0.0048`, `+0.0204`] crosses zero, so the result is inconclusive.
      The choice is frozen before test scoring.
    - Fresh holdout: `1,000` articles from the 6,600-row complement, per-class
      stratified, seed 45, disjoint by construction; diagnostics only, with
      no retraining or reselection.
    - Scale ladder: identical hyperparameters and seed 42. Learning rate 2e-5
      controls update size. Weight decay `0.01` discourages large internal
      numbers. Warmup ratio 0.1 gradually increases the learning rate. Batch 32
      means 32 items per update. Early-stop patience 1 allows one non-improving
      check.
    - Metrics: accuracy and macro-F1. Temperature scaling fits one `T` on
      validation; ECE measures the result. For the bounded selected model,
      `T=0.927`. Seeded `Optuna` TPE, or
      Tree-structured Parzen Estimator, uses past trials to choose new ones.
      Median pruning stops unpromising trials. A separate 12-trial study peaks
      at `0.8953`; three 6-trial seed reruns give `0.8953` / `0.8852` / `0.8926`
      (mean `0.8910` ± `0.0042`).
    - Serving probe: Apple M4 Max, CPU batch=1, n=200; rate card `$1` per 1M
      input + `$4` per 1M output tokens. The router uses raw, uncalibrated `TF-IDF`
      maximum class probability and escalates below τ. Uncalibrated means the
      confidence has not received calibration adjustment. The transformer leg
      is the validation-selected bounded model.
    - Selected cascade: fit τ on validation only, review rows below τ=0.6 in
      batches of eight, then score test and fresh once. Fresh is disjoint from
      bounded test. No test/fresh labels or examples enter tuning or prompts.
      Prompts are the text instructions sent to the LLM.

    **In plain terms:** Use the keyword model for speed and zero token cost; use the local neural model for its 95.3% fresh score, knowing that reviewing 22 uncertain cases adds no proven advantage.
