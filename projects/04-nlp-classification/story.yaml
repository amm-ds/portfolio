project_id: 04-nlp-classification
headline: Full-data DistilBERT reaches 0.9460 accuracy and macro-F1 on the 1,000-row test split; the bounded 3.6k-row ladder reaches 0.9020 / 0.9021.
data_note: Real AG News corpus — 127,600 items (120k standard train split) from HuggingFace `fancyzhx/ag_news`; the dataset card records the license as unknown.
limits: Test macro-F1 selects `distilbert_tuned`, so that bounded comparison is not a clean final holdout; the bounded and full runs also differ in data, device and training setup, so their gap is not an isolated data-scale effect.
sections:
  - id: background
    text_md: |
      Route short news items to World, Sports, Business or Sci/Tech without
      brittle keyword rules. The practical question is what each modeling rung
      delivers under a fixed compute budget, using the public four-topic AG News
      benchmark rather than a technology-only comparison.
  - id: objectives
    text_md: |
      Maximize macro-F1 while keeping the full ladder reproducible and visible.

      | Criterion | Target | Verified by |
      |---|---|---|
      | Naive floors | majority + seeded random | macro-F1 exposes what accuracy hides |
      | Classical anchor | TF-IDF + LogisticRegression | `baseline_tfidf_logreg` |
      | HPO discipline | seeded Optuna, persisted parameters | `reports/hpo_study.json` |
      | Selection disclosure | test-based choice reported explicitly | `reports/selection.json` |
      | Reproducibility | seeded, laptop-feasible runs | bit-exact validation re-runs |
      | Full-data evidence | 120k fine-tune on Apple MPS | test macro-F1 + wall clock |
  - id: data
    text_md: |
      AG News contains 127,600 headline + description items across four classes;
      the standard train split has 120k rows. Its license is recorded as
      `unknown`. See [the dataset card](https://amm-ds.github.io/portfolio/data-registry/ag-news/).

      - **Bounded ladder:** seeded, stratified 4,000-train / 1,000-test sample
        (3,600 train / 400 validation after carve-out; 250 test rows per class).
      - **Full run:** 108k train / 12k validation from the full 120k split,
        evaluated on the same bounded 1,000-row test sample.
  - id: eda
    text_md: |
      The bounded splits are exactly 25% per class, and texts cluster at 20–50
      words, within the 128-token budget. This removes class-prior and material
      truncation differences within the bounded comparison; it does not remove
      the bounded-versus-full training confound.
    figures: [eda_class_balance]
  - id: training
    text_md: |
      One hand-written PyTorch loop implements AdamW, linear warmup/decay,
      validation macro-F1 and patience-1 early stopping with best-state restore.

      ```mermaid
      flowchart LR
          A[Tokenized batch] --> B[AdamW + LR schedule]
          B --> C[val macro-F1]
          C --> D{Improved?}
          D -- yes --> E[save best state]
          D -- no --> F[patience / early stop]
      ```

      - **Bounded rungs:** default DistilBERT, an Optuna-retrained candidate
        (seeded TPE, median pruning, 12 trials) and roberta-base, with dynamic
        padding (~3× epoch speedup at the fixed cap).
      - **Full run:** Apple-Silicon MPS, measured at ~18–27 min/epoch.
      - **Epoch probe:** with early stopping disabled, validation macro-F1
        peaks at 0.9477 in epoch 3 (+0.0003 over epoch 2, −0.0003 by epoch 4)
        while validation loss rises; extra epochs overfit rather than improve.
    figures: [training_curve, epochs_probe, hpo_history]
  - id: evaluation
    text_md: |
      All runs use the same 1,000-row stratified test sample and standard
      classification metrics. **That sample is not untouched by model
      selection:** `distilbert_tuned` is whichever of the HPO-retrained model
      and earlier artifact has higher test macro-F1, persisted in
      `reports/selection.json`. The bounded tuned comparison is therefore
      selection-biased and needs a fresh holdout for an unbiased final claim.

      Validation gains did not transfer: HPO improved validation macro-F1
      0.8880 → 0.8953, but the retrained candidate scored 0.9011 on test versus
      the artifact's 0.9021, so the artifact won by 0.0010. This negative result
      and the selection limitation are reported rather than hidden.
    figures: [confusion_matrix_selected]
  - id: results
    text_md: |
      The full run reaches **0.9460 test macro-F1** (validation 0.9433 →
      0.9464; ~18–27 min/epoch). Its +4.4 pp gap over the bounded model is
      measured, but data size, device and training setup vary together; it is
      not a controlled estimate of data scaling alone.

      | # | run | accuracy | f1_macro |
      |---|---|---|---|
      | 1 | `naive_majority` | 0.2500 | 0.1000 |
      | 2 | `random_uniform` | 0.2540 | 0.2533 |
      | 3 | `baseline_tfidf_logreg` | 0.8720 | 0.8714 |
      | 4 | `encoder_b` (roberta-base) | 0.8980 | 0.8982 |
      | 5 | `distilbert` (bounded) | 0.9020 | 0.9021 |
      | 6 | `distilbert_tuned` (bounded; test-selected) | 0.9020 | 0.9021 |
      | 7 | `distilbert_full_120k` | 0.9460 | 0.9460 |

      Serving is probe evidence from an Apple M4 Max (CPU batch=1, n=200;
      $1/M-input + $4/M-output tokens). Int8 quality uses a 2,000-row **train**
      sample, not test.

      | variant | MB | p50 ms | pred/s | $/1k | acc | f1 |
      |---|---|---|---|---|---|---|
      | `tfidf_logreg` | 0.5 | 0.2 | 4477.8 | 0.0000 | 0.8720 | 0.8714 |
      | `distilbert_tuned` fp32 | 255.5 | 9.0 | 110.7 | 0.0656 | 0.9020 | 0.9021 |
      | `distilbert_full_120k` fp32 | 255.5 | 8.7 | 112.5 | 0.0654 | 0.9460 | 0.9460 |
      | `distilbert_full_120k` int8 | 132.3 | 13.2 | 77.6 | 0.0654 | 0.9635 | 0.9637 |

      - **Measured ladder:** 0.1000 → 0.2533 → 0.8714 → 0.9021 → 0.9270
        (20k evidence) → 0.9460 macro-F1. Treat the last two increments as
        run-to-run evidence, not controlled scaling effects.
      - **HPO null result:** seed bests 0.8953 / 0.8852 / 0.8926 (mean
        0.8910 ± 0.0042); gains sit inside seed noise and did not transfer.
      - **Calibration:** validation-fitted temperature T=0.843 cuts test ECE
        0.0467 → 0.0133 (−71%) without changing predictions.
      - **Serving trade-off:** int8 halves size with no measured loss on its
        train sample (0.9627 → 0.9637) but is slower at batch=1.
      - **Error floor:** Business → Sci/Tech counts fall 24/250 → 15/250 →
        14/250 across 3.6k / 20k / full runs; hybrid headlines remain difficult.

      `reports/history_fulldata.json` is the shipped two-epoch full-data run;
      `reports/history_probe4.json` is a separate four-epoch probe with early
      stopping disabled. Their early epochs differ because total step count
      changes the LR schedule; the probe is not a better headline.

      Representative bounded-test errors from the test-selected artifact
      (full list in `reports/misclassification_examples.json`):

      | text snippet | true | predicted |
      |---|---|---|
      | "Amazon Snaps Up China's Largest Web Retailer…" | Business | Sci/Tech |
      | "India's Tata makes powerful debut…" | World | Business |
      | "Dell Exits Low-End China Consumer PC Market…" | Sci/Tech | Business |
      | "Future Doctors, Crossing Borders…" | World | Sci/Tech |
      | "U.S. Misses Cut in Olympic 100 Free…" | World | Sports |
      | "103 arrests for Internet fraud…" | Sci/Tech | World |
    figures: [per_class_f1_comparison]
    metrics_keys: [baseline_tfidf_logreg, encoder_b, distilbert, distilbert_tuned, distilbert_full_120k]
  - id: conclusions
    text_md: |
      Full-data DistilBERT delivers the strongest measured score, while TF-IDF
      remains the low-latency, interpretable option. HPO did not beat defaults
      beyond noise, int8 bought memory rather than speed, and Business/Sci-Tech
      ambiguity persists. The bounded selection and bounded-versus-full
      confound limit causal or unbiased-holdout interpretations; fresh-holdout
      selection and controlled scale runs are the next evidence needed.
    metrics_keys: [distilbert_full_120k]
roadmap:
  - status: delivered
    text: Full 120k run — 0.9460 test macro-F1; measured MPS timings and epoch probe.
  - status: delivered
    text: HPO, seed-noise and calibration evidence — null tuning result retained; ECE −71%.
  - status: remaining
    text: Fresh-holdout model selection and controlled data-scale comparisons.
  - status: deferred
    text: Multi-label Business/Sci-Tech routing — a different label and metric contract.
figure_captions:
  eda_class_balance: The bounded splits are uniformly 25% per class and train texts cluster at 20–50 words. Class priors and the 128-token cap do not explain the bounded differences.
  training_curve: Full-120k train/validation loss and validation macro-F1. Validation quality plateaus within two epochs while training loss keeps falling.
  epochs_probe: The four-epoch full-data probe peaks at validation macro-F1 0.9477 in epoch 3 (+0.0003, then −0.0003). The plateau and rising validation loss indicate overfitting, not a better headline.
  hpo_history: Seeded 12-trial Optuna validation macro-F1 and running best. Best validation 0.8953 did not transfer to test and sits inside seed noise.
  confusion_matrix_selected: Confusion matrix for the test-selected bounded model on the 1,000-row test sample. Business → Sci/Tech remains the dominant off-diagonal pair.
  per_class_f1_comparison: Per-class F1 for the test-selected bounded model and TF-IDF baseline. The residual gap concentrates in Business/Sci-Tech.
