project_id: 04-nlp-classification
sections:
  - id: background
    text_md: |
      **Result.** Full-data DistilBERT reaches 0.9460 accuracy and macro-F1
      on the 1,000-row bounded test split; the bounded 3.6k-row ladder reaches
      0.9020 / 0.9021. On a fresh 1,000-row holdout drawn from the rest of
      the test partition the full model reads 0.9529 macro-F1.

      **Data.** Real AG News corpus — 127,600 items (120k standard train
      split) from HuggingFace `fancyzhx/ag_news`; the dataset card records
      the license as unknown.

      **Limits.** Test macro-F1 selects `distilbert_tuned`, so that bounded
      comparison is not a clean final holdout — the fresh holdout below is
      the unbiased reading. The bounded↔full gap is no longer confounded:
      the controlled ladder in Results trains same-rows twins on both
      devices at 3.6k (Δ ≤ 0.011 F1, inside noise) and same-device rungs
      at 10.8k/36k/108k, isolating a monotone data-scale slope of
      +1.3–1.6 pp per 3× step.

      Route short news items to World, Sports, Business or Sci/Tech without
      brittle keyword rules. The measured question is what each modeling rung
      delivers under a fixed compute budget, on the public four-topic AG News
      benchmark, with an honest account of what model selection did to the
      test split.

      **Business summary:** the routing table this project supports is a
      model-choice decision — TF-IDF at ~4,500 predictions/s and no token
      cost versus DistilBERT at ~110/s and ~$0.065 per 1k items — with a
      measured quality gap of 3.1 pp macro-F1 on the bounded ladder and
      7.4 pp against the full-data model (0.9529 vs 0.8785 on the fresh
      holdout). The fresh-holdout routing sweep below closes most of the
      bounded gap at a quarter of the transformer price.
  - id: objectives
    text_md: |
      Maximize macro-F1 while keeping the full ladder reproducible and visible.

      | Criterion | Target | Verified by |
      |---|---|---|
      | Naive floors | majority + seeded random | macro-F1 exposes what accuracy hides |
      | Classical anchor | TF-IDF + LogisticRegression | `baseline_tfidf_logreg` |
      | HPO discipline | seeded Optuna, persisted parameters | `reports/hpo_study.json` |
      | Selection disclosure | test-based choice reported explicitly | `reports/selection.json` |
      | Reproducibility | seeded, laptop-feasible runs | bit-exact validation re-runs |
      | Full-data evidence | 120k fine-tune on Apple MPS | test macro-F1 + wall clock |
  - id: data
    text_md: |
      AG News contains 127,600 headline + description items across four classes;
      the standard train split has 120k rows. Its license is recorded as
      `unknown`. See [the dataset card](https://amm-ds.github.io/portfolio/data-registry/ag-news/).

      - **Bounded ladder:** seeded, stratified 4,000-train / 1,000-test sample
        (3,600 train / 400 validation after carve-out; 250 test rows per class).
      - **Full run:** 108k train / 12k validation from the full 120k split,
        evaluated on the same bounded 1,000-row test sample.
      - **Controlled scale ladder:** the same seeded protocol at subset
        scales (`train-nn --full-data --subset N`): 3.6k / 10.8k / 36k train
        rows on one device — subset 4,000 reproduces the bounded rows
        exactly, giving a cross-device twin rung.
  - id: eda
    text_md: |
      The bounded splits are exactly 25% per class, and texts cluster at 20–50
      words, within the 128-token budget. This removes class-prior and material
      truncation differences within the bounded comparison; the
      bounded-versus-full training confound itself is removed by the
      controlled scale ladder in Results, not by the split design.
    figures: [eda_class_balance]
  - id: training
    text_md: |
      One hand-written PyTorch loop implements AdamW, linear warmup/decay,
      validation macro-F1 and patience-1 early stopping with best-state restore.

      ```mermaid
      flowchart LR
          A[Tokenized batch] --> B[AdamW + LR schedule]
          B --> C[val macro-F1]
          C --> D{Improved?}
          D -- yes --> E[save best state]
          D -- no --> F[patience / early stop]
      ```

      - **Bounded rungs:** default DistilBERT, an Optuna-retrained candidate
        (seeded TPE, median pruning, 12 trials) and roberta-base, with dynamic
        padding (~3× epoch speedup at the fixed cap).
      - **Full run:** Apple-Silicon MPS, measured at ~18–27 min/epoch.
      - **Epoch probe:** with early stopping disabled, validation macro-F1
        peaks at 0.9477 in epoch 3 (+0.0003 over epoch 2, −0.0003 by epoch 4)
        while validation loss rises; extra epochs overfit rather than improve.
    figures: [training_curve, epochs_probe, hpo_history]
  - id: evaluation
    text_md: |
      All runs use the same 1,000-row stratified test sample and standard
      classification metrics. **That sample is not untouched by model
      selection:** `distilbert_tuned` is whichever of the HPO-retrained model
      and earlier artifact has higher test macro-F1, persisted in
      `reports/selection.json`. The bounded tuned comparison is therefore
      selection-biased — the wave-2 artifact won by 0.0010, inside noise.

      Validation gains did not transfer: HPO improved validation macro-F1
      0.8880 → 0.8953, but the retrained candidate scored 0.9011 on test versus
      the artifact's 0.9021. This negative result and the selection limitation
      are reported rather than hidden; the unbiased reading they call for is
      the fresh holdout in Results — 1,000 rows drawn from the complement of
      the bounded split in the full test partition, disjoint by construction.
    figures: [confusion_matrix_selected]
  - id: results
    text_md: |
      The full run reaches **0.9460 test macro-F1** (validation 0.9433 →
      0.9464; ~18–27 min/epoch). Its +4.4 pp gap over the bounded model is
      measured, but data size, device and training setup vary together; it is
      not a controlled estimate of data scaling alone.

      | # | run | accuracy | f1_macro |
      |---|---|---|---|
      | 1 | `naive_majority` | 0.2500 | 0.1000 |
      | 2 | `random_uniform` | 0.2540 | 0.2533 |
      | 3 | `baseline_tfidf_logreg` | 0.8720 | 0.8714 |
      | 4 | `encoder_b` (roberta-base) | 0.8980 | 0.8982 |
      | 5 | `distilbert` (bounded) | 0.9020 | 0.9021 |
      | 6 | `distilbert_tuned` (bounded; test-selected) | 0.9020 | 0.9021 |
      | 7 | `distilbert_full_120k` | 0.9460 | 0.9460 |

      Serving is probe evidence from an Apple M4 Max (CPU batch=1, n=200;
      $1/M-input + $4/M-output tokens). Int8 quality uses a 2,000-row **train**
      sample, not test.

      | variant | MB | p50 ms | pred/s | $/1k | acc | f1 |
      |---|---|---|---|---|---|---|
      | `tfidf_logreg` | 0.5 | 0.2 | 4477.8 | 0.0000 | 0.8720 | 0.8714 |
      | `distilbert_tuned` fp32 | 255.5 | 9.0 | 110.7 | 0.0656 | 0.9020 | 0.9021 |
      | `distilbert_full_120k` fp32 | 255.5 | 8.7 | 112.5 | 0.0654 | 0.9460 | 0.9460 |
      | `distilbert_full_120k` int8 | 132.3 | 13.2 | 77.6 | 0.0654 | 0.9635 | 0.9637 |

      - **Measured ladder:** 0.1000 → 0.2533 → 0.8714 → 0.9021 → 0.9270
        (20k evidence) → 0.9460 macro-F1. The 20k increment was a CPU
        evidence run; it is superseded by the controlled ladder below.

      **Controlled data-scale ladder** (figure `scale_ladder`; rungs trained
      through `train-nn --full-data --subset N --device mps`, seed 42,
      identical hypers, per-rung wall-clock in `reports/scale_meta_<N>.json`).
      Every rung is scored on both the bounded test split and the same fresh
      holdout — one varied factor at a time:

      | train rows | run | device | val F1 | test macro-F1 | fresh macro-F1 |
      |---|---|---|---|---|---|
      | 3.6k | `distilbert` (legacy) | CPU | 0.8880 | 0.9021 | 0.8962 |
      | 3.6k | `distilbert_scale_4000` | MPS | 0.8849 | 0.9019 | 0.9067 |
      | 10.8k | `distilbert_scale_12000` | MPS | 0.9120 | 0.9170 | 0.9219 |
      | 36k | `distilbert_scale_40000` | MPS | 0.9320 | 0.9331 | 0.9428 |
      | 108k | `distilbert_full_120k` | MPS | 0.9464 | 0.9460 | 0.9529 |

      - **Device component measured:** the same-rows twins differ by 0.0002
        macro-F1 on the test split and 0.0105 on the fresh holdout (the MPS
        twin's best epoch is 2 versus the CPU twin's epoch 1 — depth + fp
        noise, still inside the ±1.9 pp CI). Device is not what moved the
        bounded↔full gap.
      - **Data component measured:** at fixed device and hypers each 3× step
        buys +1.5 pp (3.6k→10.8k), +1.6 pp (10.8k→36k) and +1.3 pp
        (36k→108k) on the test split — a monotone, decelerating curve that
        reproduces on the fresh holdout (+1.5 / +2.1 / +1.0 pp). The legacy
        CPU 18k evidence run (0.9270) lands exactly between the 10.8k and
        36k rungs, as its size predicts.
      - **HPO null result:** seed bests 0.8953 / 0.8852 / 0.8926 (mean
        0.8910 ± 0.0042); gains sit inside seed noise and did not transfer.
      - **Calibration:** validation-fitted temperature T=0.843 cuts test ECE
        0.0467 → 0.0133 (−71%) without changing predictions.
      - **Serving trade-off:** int8 halves size with no measured loss on its
        train sample (0.9627 → 0.9637) but is slower at batch=1.
      - **Error floor:** Business → Sci/Tech counts fall 24/250 → 15/250 →
        14/250 across 3.6k / 20k / full runs; hybrid headlines remain difficult.

      `reports/history_fulldata.json` is the shipped two-epoch full-data run;
      `reports/history_probe4.json` is a separate four-epoch probe with early
      stopping disabled. Their early epochs differ because total step count
      changes the LR schedule; the probe is not a better headline.

      Representative bounded-test errors from the test-selected artifact
      (full list in `reports/misclassification_examples.json`):

      | text snippet | true | predicted |
      |---|---|---|
      | "Amazon Snaps Up China's Largest Web Retailer…" | Business | Sci/Tech |
      | "India's Tata makes powerful debut…" | World | Business |
      | "Dell Exits Low-End China Consumer PC Market…" | Sci/Tech | Business |
      | "Future Doctors, Crossing Borders…" | World | Sci/Tech |
      | "U.S. Misses Cut in Olympic 100 Free…" | World | Sports |
      | "103 arrests for Internet fraud…" | Sci/Tech | World |

      **Fresh-holdout reading** (`reports/fresh_holdout.json`, 1,000 rows drawn
      from the 6,600-row complement of the bounded split — disjoint by
      construction, no retraining). This is the unbiased check the bounded
      selection could not give:

      | run | fresh acc | fresh macro-F1 |
      |---|---|---|
      | `baseline_tfidf_logreg` | 0.8790 | 0.8785 |
      | `distilbert` (wave-2 artifact) | 0.8960 | 0.8962 |
      | `distilbert_tuned` candidate (HPO-retrained) | 0.9030 | 0.9031 |
      | `encoder_b` (roberta-base) | 0.9070 | 0.9074 |
      | `distilbert_full_120k` | 0.9530 | 0.9529 |

      Fresh data **flips the tuned selection**: the HPO-retrained model beats
      the wave-2 artifact by +0.0069 macro-F1 (0.9031 vs 0.8962), against the
      test split's +0.0010 the other way. Both margins sit inside test noise —
      the honest conclusion is that the two bounded candidates are tied at this
      scale, and the fresh holdout also confirms the headline: the full-data
      model reads 0.9529 here versus 0.9460 on the bounded split.

      **Confidence-routed serving** (same fresh holdout; TF-IDF max-probability
      router, escalate below τ to the served transformer). Endpoints reproduce
      the constituents by construction:

      | τ | escalated | macro-F1 |
      |---|---|---|
      | 0.50 | 24.6% | **0.9020** |
      | 0.60 | 40.4% | 0.9011 |
      | 0.70 | 59.8% | 0.8981 |
      | 0.80 | 77.5% | 0.8962 |
      | 0.90 | 94.8% | 0.8962 |
      | 1.00 | 100.0% | 0.8962 |

      At τ=0.50, 75.4% of items are served at TF-IDF speed/cost and the routed
      macro-F1 (0.9020) beats either constituent alone (0.8785 / 0.8962) — the
      cheap model is right exactly where it is confident. The sweep uses raw
      (uncalibrated) TF-IDF confidence; calibration is a tuning knob on top,
      not a caveat against the result.

      **Business summary:** a production router can serve three of four items
      on TF-IDF economics and still match or beat the all-transformer quality
      (0.9020 vs 0.8962 macro-F1 measured); the full-data model remains the
      accuracy ceiling (0.9529 fresh) where volume justifies its per-item
      price, and the fresh holdout settles the selection question the biased
      test split could not: the two bounded candidates are tied within noise.
    figures: [per_class_f1_comparison, scale_ladder]
    metrics_keys: [baseline_tfidf_logreg, encoder_b, distilbert, distilbert_tuned, distilbert_scale_4000, distilbert_scale_12000, distilbert_scale_40000, distilbert_full_120k]
  - id: conclusions
    text_md: |
      Full-data DistilBERT delivers the strongest measured score, while TF-IDF
      remains the low-latency, interpretable option. HPO did not beat defaults
      beyond noise, int8 bought memory rather than speed, and Business/Sci-Tech
      ambiguity persists. The fresh holdout settles the two open selection
      questions: the tuned-versus-artifact margin flips sign on disjoint data
      (tied within noise), and the full-data advantage holds unchanged on data
      the selection never touched (0.9529 fresh vs 0.9460 bounded). The
      confidence-routed sweep turns the serving economics into an operating
      policy: TF-IDF where confident, transformer on the rest, with measured
      quality at every escalation rate. The controlled ladder closes the last
      open confound: the bounded↔full gap is a data-scale effect (+4.4 pp from
      3.6k to 108k train rows at fixed device, decelerating per 3× step), not a
      device artifact — the same-rows twins on both devices bracket device
      noise at ≤0.011 macro-F1.

      **Business summary:** default to the cascade router (TF-IDF first,
      escalate ~25% at τ=0.50) for the best measured quality-per-dollar;
      reserve the full-data DistilBERT for high-value traffic; treat the two
      bounded DistilBERT candidates as interchangeable.
    metrics_keys: [distilbert_full_120k]
roadmap:
  - status: delivered
    text: Full 120k run — 0.9460 test macro-F1; measured MPS timings and epoch probe.
  - status: delivered
    text: HPO, seed-noise and calibration evidence — null tuning result retained; ECE −71%.
  - status: delivered
    text: Fresh-holdout selection (fresh data flips the winner, +0.0069) and confidence-routed TF-IDF→DistilBERT serving (0.9020 at 24.6% escalation).
  - status: delivered
    text: Controlled data-scale ladder — same-device (MPS) rungs at 3.6k/10.8k/36k/108k plus CPU/MPS same-rows twins at 3.6k; device effect ≤0.011 F1, data effect +1.3–1.6 pp per 3× step.
  - status: deferred
    text: Multi-label Business/Sci-Tech routing — a different label and metric contract.
figure_captions:
  eda_class_balance: The bounded splits are uniformly 25% per class and train texts cluster at 20–50 words. Class priors and the 128-token cap do not explain the bounded differences.
  training_curve: Full-120k train/validation loss and validation macro-F1. Validation quality plateaus within two epochs while training loss keeps falling.
  epochs_probe: The four-epoch full-data probe peaks at validation macro-F1 0.9477 in epoch 3 (+0.0003, then −0.0003). The plateau and rising validation loss indicate overfitting, not a better headline.
  hpo_history: Seeded 12-trial Optuna validation macro-F1 and running best. Best validation 0.8953 did not transfer to test and sits inside seed noise.
  confusion_matrix_selected: Confusion matrix for the test-selected bounded model on the 1,000-row test sample. Business → Sci/Tech remains the dominant off-diagonal pair.
  per_class_f1_comparison: Per-class F1 for the test-selected bounded model and TF-IDF baseline. The residual gap concentrates in Business/Sci-Tech.
  scale_ladder: Controlled data-scale ladder on the bounded 1,000-row test split. The MPS rungs (3.6k/10.8k/36k/108k train rows, identical hypers) trace a monotone data-scale slope of +1.3–1.6 pp per 3× step; the lone CPU marker is the legacy bounded model, whose same-rows MPS twin sits 0.0002 F1 away — device is not the confound.
