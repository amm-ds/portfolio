key_concepts:
- '**Macro-F1**: the unweighted mean of per-topic F1, so a rare topic counts as much as a common one.'
- '**Model ladder**: cheapest-first rungs judged by one metric pair. A rung must beat the rung below it to justify its extra
  cost.'
- '**Scale ladder**: the identical seeded protocol repeated at 3.6k / 10.8k / 36k rows, leaving data size as the only varying
  factor.'
- '**Fresh holdout**: 1,000 disjoint articles used for fixed diagnostics, never for model selection.'
- '**Keyword-first router**: the cheaper baseline scores every item with keywords and escalates the uncertain quarter to the
  bounded transformer.'
- '**Selective LLM cascade**: the full-data transformer keeps confident predictions. Only rows below validation-fitted τ=0.6
  receive batched LLM review.'
- '**Calibration (ECE)**: expected calibration error measures the mismatch between confidence and observed accuracy. One temperature
  fitted on validation cut this error without changing a prediction.'
figure_captions:
  eda_class_balance: Each bounded split has 25% per class, and training texts cluster at 20–50 words. Topic frequencies and
    the 128-token cap do not explain the bounded differences.
  training_curve: Two distinct full-120k histories in separate panels. Solid lines are the shipped two-epoch headline run;
    dotted lines are the four-epoch probe, whose learning-rate schedule is not a continuation of the headline run. The star
    marks the headline's final validation macro-F1 (0.9464) beside, not within, the probe history. The probe peaks at 0.9477
    in epoch 3, then declines while validation loss rises.
