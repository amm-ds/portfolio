figure_captions:
  eda_class_balance: The bounded splits are uniformly 25% per class and train texts cluster at 20–50 words. Class priors and the 128-token cap do not explain the bounded differences.
  training_curve: Full-120k train/validation loss and validation macro-F1. Validation quality plateaus within two epochs while training loss keeps falling.
  epochs_probe: The four-epoch full-data probe peaks at validation macro-F1 0.9477 in epoch 3 (+0.0003, then −0.0003). The plateau and rising validation loss indicate overfitting, not a better headline.
  hpo_history: Seeded 12-trial Optuna validation macro-F1 and running best. Best validation 0.8953 did not transfer to test and sits inside seed noise.
  confusion_matrix_selected: Confusion matrix for the test-selected bounded model on the 1,000-row test sample. Business → Sci/Tech remains the dominant off-diagonal pair.
  per_class_f1_comparison: Per-class F1 for the test-selected bounded model and TF-IDF baseline. The residual gap concentrates in Business/Sci-Tech.
  scale_ladder: Controlled data-scale ladder on the bounded 1,000-row test split. The MPS rungs (3.6k/10.8k/36k/108k train rows, identical hypers) trace a monotone data-scale slope of +1.3–1.6 points per 3× step; the lone CPU marker is the legacy bounded model, whose same-rows MPS twin sits 0.0002 F1 away — device is not the confound.
