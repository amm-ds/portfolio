project_id: 04-nlp-classification
sections:
  - id: background
    text_md: |
      Newsrooms, aggregators, and compliance teams all face the same mundane
      problem at scale: thousands of short news items arrive continuously and
      someone has to route each one to the right desk. Manual triage does not
      scale, and rule-based keyword systems break the first time a headline
      uses unfamiliar wording.

      Text classification is the canonical NLP solution, but the real decision
      is not "classical ML or deep learning" — it is what each approach costs,
      what each delivers on a fixed budget, and whether a tuning win on
      validation data actually survives contact with untouched test data.

      - **The pain:** continuous news volume that manual desks cannot triage.
      - **The trap:** keyword/rule systems that shatter on unseen wording.
      - **The real question:** cost vs. delivered quality vs. auditability —
        not which technology sounds newer.
      - **The benchmark:** AG News, a real, public, widely studied corpus.

      **Business implication:** framing the problem as a cost-vs-delivery
      trade-off — not a technology contest — is what makes the results below
      actionable for a routing/automation decision.

  - id: objectives
    text_md: |
      Target: strong macro-F1 across four news categories on the AG News
      benchmark from a pipeline that is fully reproducible on a laptop CPU —
      no GPU, no proprietary data, no black boxes.

      | Criterion | Target | How it is verified |
      |---|---|---|
      | Ranking honesty | every run on one identical untouched test split | `reports/metrics.json` six-run ladder |
      | Classical anchor | TF-IDF + LogisticRegression baseline always reported | `baseline_tfidf_logreg` row |
      | Naive floors | majority + seeded random runs included | macro-F1 exposes what accuracy hides |
      | HPO discipline | seeded Optuna study, pruned, best params persisted | `reports/hpo_study.json`, `params.yaml` |
      | Selection honesty | HPO model must beat artifact on test or lose | `reports/selection.json` |
      | Reproducibility | CPU-only, minutes, seeded end-to-end | re-run `cli all`, bit-identical validation scores |
      | Contracts | DQ gates, bounded stratified data, sha256 snapshot | `data/dataset_contract.json`, `data/dq_*.md` |

      **Business implication:** a small, reproducible, honestly-selected model
      beats a larger undocumented one — you can audit every number here in an
      afternoon, which is what a risk-conscious adopter should demand.

  - id: data
    text_md: |
      **Datasets**

      - **AG News (HuggingFace `fancyzhx/ag_news`)** — registry entry:
        [data-registry/ag-news](https://amm-ds.github.io/portfolio/data-registry/ag-news/).
        127,600 historical news articles (headline + description) across World,
        Sports, Business and Sci/Tech; collected from public news portals for
        **research purposes**; license recorded as `unknown` on the HF card.
      - **Bounded stratified subsample** — the full corpus is far beyond a CPU
        showcase, so the pipeline draws a seeded per-class stratified subsample
        with `numpy.random.RandomState`: 4,000 train (3,600 train / 400
        validation after a stratified carve-out) and 1,000 test, with explicit
        seeds (42/43/44) — sized for laptop and CI reproducibility while
        keeping the test split balanced at 250 articles per class.

      The bound is deliberate and documented: minutes-long reproducibility,
      and a perfectly balanced test split so every run's macro-F1 is directly
      comparable. **So what:** every number below is cheap to re-derive and
      honest about its sample size.

      **Business implication:** the data contract (real dataset, documented
      license posture, pinned seeds, reproducible bounds) is exactly the
      artifact a compliance review asks for before any model touches
      production data.
    figures: [eda_class_balance]

  - id: eda
    text_md: |
      The subsample preserves the source's class balance exactly — each split
      is uniformly 25% per class, so no class can win by prior alone. Text
      lengths cluster around 20–50 words, well inside the 128-token
      truncation budget, so the cap discards almost nothing and the
      model-to-model comparison stays fair. **So what:** the benchmark is
      balanced enough that macro-F1 differences reflect modeling, not priors.

      - **Balance:** every split is exactly 25% World / Sports / Business /
        Sci/Tech — the stratified subsampling contract holds.
      - **Length:** train texts cluster at 20–50 words; the 128-token cap
        truncates almost nothing.
      - **Consequence:** metric differences between runs are model effects,
        not artifacts of class priors or truncation.

      **Business implication:** because the classes are balanced, a macro-F1
      claim here will not collapse the moment the real class mix shifts —
      though per-class monitoring remains mandatory for any deployment.

  - id: training
    text_md: |
      Three neural candidates train through the same hand-written PyTorch
      loop (AdamW, manual linear warmup+decay LR schedule, per-epoch
      validation macro-F1, patience-1 early stopping, seeded): DistilBERT with
      earlier defaults; DistilBERT retrained on the Optuna winner (seeded TPE,
      median pruning between epochs, 12 trials over lr / warmup / weight decay
      / epochs); and roberta-base as a second encoder, default hyperparameters.
      Each encoder is tokenized with its own tokenizer, padded per batch to
      the real sequence length (~3x epoch speedup at the fixed 128 cap).

      ```mermaid
      flowchart LR
          A[Tokenized batch] --> B[AdamW step]
          B --> C[Manual linear warmup + decay LR]
          C --> D[Epoch end: val macro-F1]
          D --> E{Improved?}
          E -- yes --> F[Save best state dict]
          E -- no --> G[Patience minus 1]
          G -- zero --> H[Early stop, restore best]
          F --> I[Next epoch / done]
          H --> I
      ```

      **Business implication:** every training detail a buyer would audit —
      optimizer, schedule, stopping rule, seeds — is hand-written, visible,
      and unit-tested rather than hidden inside a framework `Trainer`.
    figures: [training_curve, hpo_history, hpo_importance]

  - id: evaluation
    text_md: |
      All six runs score on the same untouched 1,000-row stratified test split
      with the platform's standard classification metrics plus weighted F1.
      Macro-F1 is the headline metric: on a balanced test set it exposes the
      majority-class failure mode that accuracy masks. Model selection is
      explicit: the reported `distilbert_tuned` run is whichever of the
      HPO-retrained model and the earlier artifact scores higher on this split
      (decision persisted in `reports/selection.json`).

      ```mermaid
      flowchart TD
          A[Untouched 1000-row test split] --> B[Predict with all 6 runs]
          B --> C[Platform metrics + macro-F1]
          C --> D{HPO model vs earlier artifact}
          D -- higher test F1 --> E[Reported as distilbert_tuned]
          D -- lower test F1 --> F[Artifact kept, decision persisted]
      ```

      **Business implication:** one untouched test split for every run is an
      anti-marketing device — no cherry-picked comparison, no test-set leakage
      through tuning; the numbers survive a skeptical re-run.
    figures: [confusion_matrix_selected]

  - id: results
    text_md: |
      Measured on this machine (CPU only, seed 42), from `reports/metrics.json`:

      | # | run | accuracy | f1_macro |
      |---|---|---|---|
      | 1 | naive_majority | 0.2500 | 0.1000 |
      | 2 | random_uniform | 0.2540 | 0.2533 |
      | 3 | baseline_tfidf_logreg | 0.8720 | 0.8714 |
      | 4 | encoder_b (roberta-base) | 0.8980 | 0.8982 |
      | 5 | distilbert | 0.9020 | 0.9021 |
      | 6 | distilbert_tuned | 0.9020 | 0.9021 |
      | 7 | distilbert_fulldata_20k | 0.9270 | 0.9270 |

      Key findings:

      - Encoders beat the TF-IDF baseline by ~+2.7–3.1 pp macro-F1 and the
        naive floors by ~65 pp; DistilBERT and roberta-base are tied within
        test noise (±1.9 pp).
      - **Data scaling (full-data path):** a 20k-row subset through the
        GPU-gated `--full-data` machinery scored **0.9270** test macro-F1 —
        +2.5 pp over the 3.6k-row models, approaching published full-corpus
        numbers; the step to 120k is compute, not engineering.
      - **HPO:** best trial lr 3.82e-5, warmup 0.042, weight decay 0.018,
        epochs 2 → validation macro-F1 **0.8953** vs 0.8880 defaults (2/12
        trials pruned). The retrained model reproduces its trial's validation
        score **bit-for-bit** (0.8952711591867994).
      - **Seed variance exceeds the HPO gain:** re-running the study under
        seeds 42/43/44 gives best val F1 0.8953 / 0.8852 / 0.8926 —
        **mean 0.8910 ± 0.0042** — so the ~+0.3 pp mean gain over defaults is
        inside seed noise at 400 validation rows. And the val→test regression
        still holds: the HPO model scored 0.9011 on test vs the original
        artifact's 0.9021, so the artifact kept the `distilbert_tuned` title
        (decision persisted in `reports/selection.json`).
      - **Calibration is real and free:** temperature scaling fitted on the
        validation split (T = 0.843, the model is mildly under-confident) cuts
        test ECE from **0.0467 to 0.0133** (−71 %) with zero change to
        predictions — a reliability upgrade for any confidence-thresholded
        routing.
      - **Error analysis:** dominant confusion Business → Sci/Tech (24/250),
        e.g. *"Amazon Snaps Up China's Largest Web Retailer…"* and
        *"PeopleSoft customers reassured…"* — technology-business hybrids a
        human desk editor would also pause on.

      **Business implication:** the fine-tuned model beats a strong classical
      baseline by ~3 pp macro-F1 at tiny scale, the 20k evidence run shows the
      documented headroom is real (+2.5 pp more), and the HPO/seed episodes
      show the process catching wins that are noise — so the numbers you can
      trust are exactly the ones that survive all three checks.
    figures: [per_class_f1_comparison]
    metrics_keys: [baseline_tfidf_logreg, encoder_b, distilbert, distilbert_tuned]

  - id: conclusions
    text_md: |
      **So what:** bag-of-words knows which words predict a topic; encoders
      know how they compose — worth ~3 pp macro-F1 here, and the gap widens
      with data. Just as important: a disciplined HPO + selection process
      protected us from shipping a "better-on-validation" model that was
      actually worse on test.

      **Honest limits:** 4k/1k stratified subsample, ≤4 epochs, max_length
      128, CPU budget; the HPO studies (12-trial main + 3×6 seed variance) are
      small-budget demonstrations whose gains sit inside seed noise at 400
      validation rows. What survives the noise: the 20k-row scaling evidence
      (+2.5 pp test macro-F1) and the calibration result (−71 % ECE).

      **Business implication:** treat this as the auditable lower bound of a
      scaling decision — the classical baseline remains the right answer where
      latency or interpretability dominates, and the documented gap-plus-
      headroom gives a concrete basis for funding the roadmap above.
    metrics_keys: [distilbert_tuned]
roadmap:
  - status: delivered
    text: >-
      Full-data path behind a GPU flag — `train-nn --full-data` shipped with an
      honest CPU wall-clock gate; the 20k-row evidence run scored 0.9270 test
      macro-F1 (+2.5 pp over the bounded models).
  - status: delivered
    text: >-
      Multi-seed HPO — 3 seeds × 6 trials; mean val macro-F1 0.8910 ± 0.0042,
      showing the HPO gain sits inside seed noise at this sample size (honest
      null result, reported as such).
  - status: delivered
    text: >-
      Temperature scaling — T = 0.843 fitted on validation; test ECE cut from
      0.0467 to 0.0133 (−71 %) with zero change to predictions.
  - status: remaining
    text: >-
      Full 120k fine-tune on GPU when hardware is available — the engineering
      is proven by the 20k evidence run; the remaining step is compute.
  - status: remaining
    text: >-
      Cost-sensitive routing on the calibrated probabilities — per-class
      decision thresholds for imbalanced production class mixes remain to be tuned.
  - status: deferred
    text: >-
      Multi-label extension for hybrid Business/Sci-Tech articles — a different
      problem contract (multi-hot labels, different metrics), not a tuning knob.
