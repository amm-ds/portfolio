project_id: 04-nlp-classification
sections:
  - id: background
    text_md: |
      Newsrooms, aggregators, and compliance teams all face the same mundane
      problem at scale: thousands of short news items arrive continuously and
      someone has to route each one to the right desk. Manual triage does not
      scale, and rule-based keyword systems break the first time a headline
      uses unfamiliar wording.

      Text classification is the canonical NLP solution, but the real decision
      is not "classical ML or deep learning" — it is what each approach costs,
      what each delivers on a fixed budget, and whether a tuning win on
      validation data actually survives contact with untouched test data.
      This showcase makes all three questions concrete on a real benchmark.

  - id: objectives
    text_md: |
      Target: strong macro-F1 across four news categories on the AG News
      benchmark from a pipeline that is fully reproducible on a laptop CPU —
      no GPU, no proprietary data, no black boxes.

      Objectives: (1) score encoders against a strong TF-IDF baseline and two
      naive floors on one identical test split; (2) search the fine-tuning
      hyperparameters with Optuna (seeded, pruned, CPU-bounded) and persist
      the winner; (3) select the reported model honestly — if the HPO model
      does not beat the existing artifact on test, the artifact wins; (4) keep
      every platform contract: bounded stratified sampling, DQ gates, sha256
      snapshot metadata, standard metric rows.

  - id: data
    text_md: |
      Real dataset: AG News (`fancyzhx/ag_news`, HuggingFace), 127,600
      historical news items (headline + description) across World, Sports,
      Business and Sci/Tech; license recorded as `unknown` on the HF card. The
      full corpus is far beyond a CPU showcase, so the pipeline downloads it
      once and draws a seeded per-class stratified subsample with
      `numpy.random.RandomState`: 4,000 train (3,600 train / 400 validation
      after a stratified carve-out) and 1,000 test.

      The bound is deliberate and documented: minutes-long reproducibility,
      and a perfectly balanced 250-per-class test split so every run's
      macro-F1 is directly comparable. **So what:** every number below is
      cheap to re-derive and honest about its sample size.
    figures: [eda_class_balance]

  - id: eda
    text_md: |
      The subsample preserves the source's class balance exactly — each split
      is uniformly 25% per class, so no class can win by prior alone. Text
      lengths cluster around 20–50 words, well inside the 128-token
      truncation budget, so the cap discards almost nothing and the
      model-to-model comparison stays fair. **So what:** the benchmark is
      balanced enough that macro-F1 differences reflect modeling, not priors.

  - id: training
    text_md: |
      Three neural candidates train through the same hand-written PyTorch
      loop (AdamW, manual linear warmup+decay LR schedule, per-epoch
      validation macro-F1, patience-1 early stopping, seeded): DistilBERT with
      wave-2 defaults; DistilBERT retrained on the Optuna winner (seeded TPE,
      median pruning between epochs, 12 trials over lr / warmup / weight decay
      / epochs); and roberta-base as a second encoder, default hyperparameters.
      Each encoder is tokenized with its own tokenizer, padded per batch to
      the real sequence length (~3x epoch speedup at the fixed 128 cap).
    figures: [training_curve, hpo_history, hpo_importance]

  - id: evaluation
    text_md: |
      All six runs score on the same untouched 1,000-row stratified test split
      with the platform's standard classification metrics plus weighted F1.
      Macro-F1 is the headline metric: on a balanced test set it exposes the
      majority-class failure mode that accuracy masks. Model selection is
      explicit: the reported `distilbert_tuned` run is whichever of the
      HPO-retrained model and the wave-2 artifact scores higher on this split
      (decision persisted in `reports/selection.json`).
    figures: [confusion_matrix_selected]

  - id: results
    text_md: |
      Measured on this machine (CPU only, seed 42), from `reports/metrics.json`:

      | # | run | accuracy | f1_macro |
      |---|---|---|---|
      | 1 | naive_majority | 0.2500 | 0.1000 |
      | 2 | random_uniform | 0.2540 | 0.2533 |
      | 3 | baseline_tfidf_logreg | 0.8720 | 0.8714 |
      | 4 | encoder_b (roberta-base) | 0.8980 | 0.8982 |
      | 5 | distilbert | 0.9020 | 0.9021 |
      | 6 | distilbert_tuned | 0.9020 | 0.9021 |

      Findings:

      - Encoders beat the TF-IDF baseline by ~+2.7–3.1 pp macro-F1 and the
        naive floors by ~65 pp.
      - DistilBERT and roberta-base are tied within test noise (±1.9 pp).
      - HPO raised validation macro-F1 0.8880 → 0.8953, but the retrained
        model scored 0.9011 on test vs the wave-2 artifact's 0.9021 — the
        wave-2 artifact kept the `distilbert_tuned` title (margin +0.0010,
        noise). Validation gains did not transfer at this sample size.
      - Dominant error: Business → Sci/Tech (24/250), e.g. *"Amazon Snaps Up
        China's Largest Web Retailer…"* — technology-business hybrids.
    figures: [per_class_f1_comparison]
    metrics_keys: [baseline_tfidf_logreg, encoder_b, distilbert, distilbert_tuned]

  - id: conclusions
    text_md: |
      **So what:** bag-of-words knows which words predict a topic; encoders
      know how they compose — worth ~3 pp macro-F1 here, and the gap widens
      with data. Just as important: a disciplined HPO + selection process
      protected us from shipping a "better-on-validation" model that was
      actually worse on test.

      **Honest limits:** 4k/1k stratified subsample, ≤4 epochs, max_length
      128, single seed, CPU budget; the 12-trial study is a small-budget
      demonstration and its hyperparameter rankings carry more noise than
      signal at 400 validation rows. On full data (120k rows) with a GPU,
      published results reach ~0.93–0.94 macro-F1, so these numbers are the
      cheap lower bound of the scaling curve. Roadmap: GPU-scale real-data
      track, multi-seed HPO with nested validation, calibration and
      thresholding for imbalanced deployments.
    metrics_keys: [distilbert_tuned]
