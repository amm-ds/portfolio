key_concepts:
- '**Macro-F1**: the unweighted mean of per-topic F1, so a rare topic counts as much as a common one.'
- '**Model ladder**: cheapest-first rungs judged by one metric pair. A rung must beat the rung below it to justify its extra
  cost.'
- '**Scale ladder**: the identical seeded protocol repeated at 3.6k / 10.8k / 36k / 108k training rows, leaving data size as the only varying
  factor.'
- '**Fresh holdout**: 1,000 disjoint articles used for fixed diagnostics, never for model selection.'
- '**Keyword-first router**: the cheaper baseline scores every item with keywords and escalates the uncertain quarter to the
  bounded transformer.'
- '**Selective LLM cascade**: the full-data transformer keeps confident predictions. Only rows below validation-fitted τ=0.6
  receive batched LLM review.'
- '**Calibration (ECE)**: expected calibration error measures the mismatch between confidence and observed accuracy. One temperature
  fitted on validation cut this error without changing a prediction.'
figure_captions:
  eda_class_balance: Each bounded split has 25% per class, and training texts cluster at 20–50 words. Topic frequencies and
    the 128-token cap do not explain the bounded differences.
  training_curve: Two distinct full-120k histories in separate panels. Solid lines are the shipped two-epoch headline run;
    dotted lines are the four-epoch probe, whose learning-rate schedule is not a continuation of the headline run. The star
    marks the headline's final validation macro-F1 (0.9464) beside, not within, the probe history. The probe peaks at 0.9477
    in epoch 3, then declines while validation loss rises.
  hpo_history: Seeded 12-trial Optuna validation macro-F1 and running best. The paired HPO/default validation CI crosses zero;
    the +0.0073 margin is about 1.7 seed standard deviations.
  llm_cascade_comparison: Full-data transformer versus the selected τ=0.6 selective LLM cascade on validation, bounded test,
    and disjoint fresh holdout. Fresh macro-F1 moves from 0.9529 to 0.9539 (+0.001) with 22 reviews;
    no paired cascade interval is persisted, so the small point gain does not establish superiority.
  confusion_matrix_selected: Actual versus predicted topics for the validation-selected bounded model on the 1,000-row test
    sample. Business → Sci/Tech remains the dominant off-diagonal pair.
  per_class_f1_comparison: Topic-level F1 for the validation-selected bounded model and TF-IDF baseline. The residual gap
    concentrates in Business/Sci-Tech.
  scale_ladder: Controlled data-scale ladder on the bounded 1,000-row test split. The MPS rungs (3.6k/10.8k/36k/108k train
    rows, identical hyperparameters) rise by +1.3–1.6 points per 3× step. The lone CPU marker is the bounded model, whose
    same-rows MPS twin sits 0.0002 test F1 away; their fresh gap is 0.0105, so the fixed-device rungs carry the scale claim.
