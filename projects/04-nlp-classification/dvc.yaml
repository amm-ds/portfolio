stages:
  prepare:
    cmd: uv run python -m nlp_classification.cli prepare
    deps:
      - src/nlp_classification
      - params.yaml
    outs:
      - data/train
      - data/val
      - data/test
      - data/label_names.json
      - data/dataset_contract.json
  train-baseline:
    cmd: uv run python -m nlp_classification.cli train-baseline
    deps:
      - src/nlp_classification
      - params.yaml
      - data/train
      - data/val
    outs:
      - reports/models/baseline.joblib
  train-nn:
    cmd: uv run python -m nlp_classification.cli train-nn
    deps:
      - src/nlp_classification
      - params.yaml
      - data/train
      - data/val
      - data/label_names.json
    outs:
      - reports/models/distilbert.pt
      - reports/history.json
  hpo:
    cmd: uv run python -m nlp_classification.cli hpo
    deps:
      - src/nlp_classification
      - params.yaml
      - data/train
      - data/val
      - data/label_names.json
    outs:
      - reports/hpo_study.json
      - reports/hpo_best.json
      # hpo figures flow through the evaluate stage's reports/figures out
      # (a directory and its contents cannot both be stage outputs)
  hpo-seeds:
    cmd: uv run python -m nlp_classification.cli hpo-seeds
    deps:
      - src/nlp_classification
      - params.yaml
      - data/train
      - data/val
      - data/label_names.json
    outs:
      - reports/hpo_seeds.json
  train-tuned:
    cmd: uv run python -m nlp_classification.cli train-tuned
    deps:
      - src/nlp_classification
      - params.yaml
      - reports/hpo_best.json
      - data/train
      - data/val
      - data/label_names.json
    outs:
      - reports/models/distilbert_tuned.pt
      - reports/history_tuned.json
  train-encoder-b:
    cmd: uv run python -m nlp_classification.cli train-encoder-b
    deps:
      - src/nlp_classification
      - params.yaml
      - data/train
      - data/val
      - data/label_names.json
    outs:
      - reports/models/encoder_b.pt
      - reports/history_encoder_b.json
  evaluate:
    cmd: uv run python -m nlp_classification.cli evaluate
    deps:
      - src/nlp_classification
      - params.yaml
      - data/test
      - data/train
      - data/val
      - data/label_names.json
      - reports/models/baseline.joblib
      - reports/models/distilbert.pt
      - reports/models/distilbert_tuned.pt
      - reports/models/encoder_b.pt
      - reports/history.json
      - reports/hpo_study.json
    outs:
      - reports/report.html
      - reports/error_analysis.md
      - reports/selection.json
      - reports/figures
    metrics:
      - reports/metrics.json

  # Manual stage (run explicitly via `dvc repro fresh_holdout` or the CLI).
  # Roadmap experiment over the persisted artifacts — no retraining: scores
  # them on a fresh holdout drawn from the complement of the bounded test
  # split and runs the TF-IDF -> transformer routing sweep.
  fresh_holdout:
    cmd: uv run python -m nlp_classification.cli fresh-holdout
    deps:
      - src/nlp_classification
      - params.yaml
      - data/train
      - data/test
      - data/val
      - data/label_names.json
      - reports/models/baseline.joblib
      - reports/models/distilbert.pt
      - reports/models/distilbert_tuned.pt
      - reports/models/encoder_b.pt
      - reports/selection.json
    outs:
      - reports/fresh_holdout.json
