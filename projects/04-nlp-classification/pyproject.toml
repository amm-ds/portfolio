[project]
name = "04-nlp-classification"
version = "0.1.0"
description = "Portfolio project 04-nlp-classification."
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4",
    "transformers>=4.44",
    "datasets>=3.0",
    "sentence-transformers>=3.0",
    "optuna>=4.0",
    "scikit-learn>=1.5",
    "typer>=0.12",
    "plotly>=5.24",
    "numpy>=2.1",
    "portfolio-core",
    "portfolio-eval",
]

[project.scripts]
nlp_classification = "nlp_classification.cli:app"

[tool.uv.sources]
portfolio-core = { workspace = true }
portfolio-eval = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nlp_classification"]
