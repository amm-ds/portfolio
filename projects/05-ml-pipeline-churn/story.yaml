project_id: 05-ml-pipeline-churn
short_version: |
  On 7,043 IBM telco customers, a calibrated churn policy frozen at 0.175 from training OOF predictions costs 601 versus 1,035 for contact-everyone (95% paired bootstrap CI -508 to -353). Re-select the cutoff when missed-churner cost changes.
sections:
  - id: background
    text_md: |
      **The output is a priced contact list.** Churn means a customer leaves.
      In the decision diagram, follow one row through a model, a learned rule
      that estimates churn. Serving uses that rule to choose contacts. A
      threshold is the cutoff for action. At 0.175, it separates "call" from
      "skip". The bill box shows 601 cost units (missed churner $5, contact
      $1, from `params.yaml`) versus 1,035 for contacting
      everyone, a 41.9% cut.

      ```diagram 05-churn-cycle
      ```

      The diagram's mistake costs explain the objective. A false alarm spends
      one retention voucher. A missed churner costs five. Accuracy, the share
      of correct predictions, treats mistakes alike, so it cannot choose the
      cheapest list. The 95% bootstrap interval of −508 to −353 estimates the
      saving's uncertainty by repeatedly resampling customers.

      **Business summary:** On 7,043 real telco customers, the model cuts
      retention cost 42% versus contacting everyone. Re-derive the cutoff
      when a missed churner's price changes.
    figures: []
  - id: objectives
    text_md: |
      **The goal is the cheapest contact list, not the highest accuracy.**
      In the cost-model diagram, the contact-nobody policy is 73.5% accurate
      but saves nothing. That contrast shows why accuracy is the wrong target.

      The diagram also sets three tests for success:

      - Compare every candidate under one cost model and on one holdout. A
        holdout is customer data reserved for final testing.
      - Choose a threshold and estimate a range for its saving.
      - Re-run the choice when a missed churner costs between 3 and 8.

      ```diagram auto-05-ml-pipeline-churn-1
      ```

      Follow the diagram from costs to candidates. A false alarm costs 1
      voucher and a missed churner costs 5. A grid, or list, of 41 thresholds
      is priced on training-side out-of-fold predictions. The lowest-cost
      cutoff is frozen before the candidate is tested on the same 1,409-row
      holdout. The final branches report the exact policy's saving interval
      and re-freeze a cutoff under each alternative missed-churner price.

      **Business summary:** The goal is the cheapest contact list under a
      1-versus-5 cost split, with the saving's range and the threshold's
      stability measured, not asserted.
    figures: []
  - id: data
    text_md: |
      **One real customer table and one synthetic twin feed the same gates.**
      The lineage diagram starts with the IBM telco panel, a table of 7,043
      customers and 21 columns with 26.5% churn. It comes from the canonical
      public copy on GitHub with a pinned sha256, a fixed digital fingerprint
      that identifies the exact file. The [dataset contract](https://amm-ds.github.io/portfolio/data-registry/telco-churn/)
      records that source.

      Follow both source branches in the diagram. Data-quality gates are
      checks that reject invalid data. They bound null, or missing-value,
      rates, enforce allowed ranges, and require a binary churn field with
      only two outcomes. Both sources pass these checks before splitting.

      ```diagram auto-05-ml-pipeline-churn-2
      ```

      The diagram's stratified 80/20 split preserves the churn share in each
      part. Seed 42 makes the random split repeatable. It creates 5,634
      training rows and 1,409 holdout rows. The holdout is scored once,
      after fitting, tuning, and calibration. Calibration adjusts predicted
      probabilities, scores from 0 to 1, to match observed churn rates. Its
      separate 20% carve-out comes only from training data.

      The synthetic branch is generated test data, not business evidence. The
      twin has 8.8% churn, planted nulls, and one 9,999 outlier, or extreme,
      charge. It runs the same gates offline for CI, meaning automated
      software checks, when the network is unavailable. It never replaces the
      real-data results.

      **Business summary:** One real panel of 7,043 customers, pinned by
      sha256, splits into train, calibration, and a scored-once holdout. A
      synthetic twin guards the pipeline, or full processing sequence, in CI
      only.
    figures: []
  - id: eda
    text_md: |
      **The churn-profile figure shows the highest churn where commitment is
      low.** Compare the contract bars: month-to-month customers churn at
      42.7%, versus 2.8% for two-year contracts. The other panels show 41.7%
      churn for senior citizens and 41.9% for fiber-optic users. Churners pay
      more, about $74 versus $61 a month, and leave sooner, about 18 versus
      38 months of tenure. Tenure is how long a customer has stayed.

      Use all three figures under the same judging rules:

      - Compare candidates on one shared holdout under one cost model.
      - ROC-AUC, or area under the receiver-operating-characteristic curve,
        measures how often a random churner ranks above a random stayer.
      - Macro F1 combines precision and recall, then averages both classes
        equally. Precision is the share of flagged customers who churn.
        Recall is the share of actual churners found.
      - Business cost prices mistakes across 41 thresholds. Calibration
        error measures how far predicted probabilities sit from observed
        churn rates.

      In the precision-recall figure, compare each curve with the 26.5%
      base-rate floor. The base rate is the overall churn share. A curve near
      that floor adds little ranking skill.

      **Business summary:** The churn profile shows high churn for
      month-to-month, senior, and fiber customers. Churners also pay more and
      leave sooner. The precision-recall curve shows ranking skill; it does not
      select the operating cutoff.
    figures: [eda_churn_profile, precision_recall_curve]
  - id: training
    text_md: |
      **One preparation pipeline sits behind all three training figures.**
      The data-quality gates pass first: null rates are 0.000 for tenure and
      charges, values stay within allowed ranges, and churn is binary. The
      pipeline caps extreme values, flags and fills missing values, scales
      numbers, and turns categories into indicator columns of zeros and ones.
      Serving means using the fitted model on new rows. Training and serving
      use this same
      pipeline, so each figure reflects the same preparation.

      - **Start with the flat line in the business-cost figure.** Contacting
        everyone costs 1,035. Contacting nobody instead misses 374 churners
        and costs 1,870 under the 1-versus-5 price model.
      - **Compare the logistic policies.** A logistic model is a simple linear
        model that predicts probabilities. Its default threshold costs 691.
        The 0.450 cutoff, frozen from training-side out-of-fold predictions,
        costs 655. An F1-first search chose a different model family. The
        figure's cost-based winner therefore depends on the objective, not
        accuracy alone.
      - **Use the calibration and cost figures together.** A seeded Optuna
        search, an automated way to test model settings, ran 25 trials.
        Median pruning stopped weak trials early. It chose a gradient-boosted
        model, which combines many small decision trees, using out-of-fold
        business cost. Out-of-fold means each training row is scored by a
        model that did not fit that row. Isotonic calibration is a flexible
        adjustment learned only on training-side data. On the calibration
        figure, the reliability curve compares predicted and observed rates.
        The isotonic curve sits closer to the ideal line. ECE, or
        expected calibration error, measures the average gap between
        predicted probabilities and observed rates. ECE improves 0.028 →
        0.016. The stars on the cost figure mark frozen policies, not holdout
        optima: raw cost is 644 at 0.225 and calibrated cost is 601 at 0.175.
      - **Re-freeze the cutoff when price changes.** Training-side sensitivity
        selection moves the served threshold to 0.250 at missed-churner price
        3, 0.175 at 5, and 0.150 at 8. Holdout costs are 514, 601, and 718.
        Every contact-everyone interval excludes zero. Calibration helps at
        five, 644 → 601, and at eight, 725 → 718.
      - **Read permutation importance from top to bottom.** Permutation
        importance measures the F1 drop after shuffling one column. Contract,
        tenure, and charges rank highest, so they carry the strongest signals
        in this figure.

      **Decision core: the threshold minimizes a priced training-side OOF
      confusion matrix.** A confusion matrix counts correct and mistaken
      predictions. The code charges false positives and false negatives
      differently. Accuracy never enters the objective. The resulting cutoff
      is persisted before the holdout is read.

      ```python
      def business_cost(y_true, proba, threshold, fp_cost, fn_cost) -> float:
          y_pred = (proba >= threshold).astype(int)
          _tn, fp, fn, _tp = confusion_matrix(y_true, y_pred, labels=[0, 1]).ravel()
          return fp_cost * float(fp) + fn_cost * float(fn)

      def cost_curve(cfg, y_true, proba):
          costs = np.array(
              [
                  business_cost(y_true, proba, t, cfg.fp_cost, cfg.fn_cost)
                  for t in cfg.threshold_grid
              ],
              dtype=float,
          )
          return costs, float(cfg.threshold_grid[int(np.argmin(costs))])
      ```

      Excerpt from [evaluate.py](https://github.com/amm-ds/portfolio/blob/main/projects/05-ml-pipeline-churn/src/churn_pipeline/evaluate.py).

      **Business summary:** Training-side cost, not accuracy or holdout
      retuning, picks the cutoff. A calibrated boosted model serves at 0.175
      for 601 versus 1,035. The cutoff is re-frozen when price moves.
    figures: [calibration_curve, business_cost_curve, permutation_importance]
    metrics_keys: [naive_majority, logreg_threshold_0.450, selected_model, selected_model_calibrated]
  - id: evaluation
    text_md: |
      **The evaluation diagram shows the saved model and one frozen-policy
      estimate.** The artifact accepts raw customer rows from a CRM, or customer
      relationship management, system. It returns a scored contact list at the
      same 0.175 cutoff saved during training.

      Follow the measurement chain from left to right. Three-fold OOF predictions
      price a 41-point cutoff grid under the 1-versus-5 cost model. OOF means
      each training row is scored by a model that did not fit that row. The
      lowest-cost cutoff is saved in `operating_policy.json` before holdout
      scoring. Evaluation then scores that policy once. Two paired bootstraps,
      with 2,000 resamples each, compare it with contact-everyone and
      logistic-at-0.5.

      ```diagram auto-05-ml-pipeline-churn-3
      ```

      The first watch item limits each interval. Resampling holdout rows at a
      fixed cutoff estimates row noise. It does not measure changes from model
      search or cutoff selection. A fresh time split would test the frozen rule
      on later customers, but this snapshot has no time axis. Rollout, or real
      release, therefore needs a time-stamped feed from the data owner.

      The second watch item is the raw model's blind spot for two-year churners.
      Fairness means checking results across customer groups. Fresh data must
      test the served calibrated policy before rollout.

      **Business summary:** The artifact accepts raw CRM rows behind the
      data-quality gates. The frozen policy's measured cost cut is about 42%
      when a missed churner costs 5×. Temporal validation and fresh-data
      fairness remain rollout gates.
    figures: []
  - id: results
    text_md: |
      **Read the fairness-slices figure one customer group at a time.** Each
      bar shows recall for the raw, uncalibrated model at its OOF-frozen 0.225
      threshold. In the contract panel, recall is 0.918 for month-to-month
      customers, 0.250 for one-year customers, and 0.000 for two-year
      customers. The gender bars are nearly level. This figure therefore
      exposes a contract-shaped blind spot, not a gender gap.

      The figure also sets clear limits on the results:

      - It plots recall, not cost. It cannot verify the separate headline of
        **601 versus 1,035 (−41.9%) at threshold 0.175, with interval
        [−508, −353]**. That number is a measured budget line, not a score
        or a promise.
      - Cost and slices use the same 1,409-row holdout, but thresholds were
        frozen from training-side OOF predictions first. The bootstrap
        estimates row-sampling variation only, not selection instability.
      - The figure describes a snapshot with no time axis. It supports no
        claim about drift, meaning change over time, seasonality, meaning
        repeating time patterns, or causation, meaning that the policy caused
        an outcome.
      - It shows the raw model, not the served calibrated policy. The raw
        model misses 27 of 36 one-year churners and all 9 two-year churners.
        Those counts must not be attributed to serving.
      - It covers one operator and 21 columns. Transfer to other customer
        bases is plausible, but unmeasured.

      **Business summary:** Treat 601 as a measured budget line from one
      snapshot split. The fairness figure makes fresh-data checks a
      pre-rollout gate, especially for long-contract customers.
    figures: [fairness_slices]
  - id: conclusions
    text_md: |
      ## Results summary

      In the bootstrap figure, look at the cost-delta distribution and its
      interval. Cost delta means the served cost minus the contact-everyone
      cost. The measured saving is 601 versus 1,035 on the frozen 1,409-row
      holdout, a 41.9% cut. The bootstrap point is −434. Its 95% CI, or
      confidence interval, is [−508, −353]. This interval estimates a range
      for the saving from repeated customer resamples.

      The pipeline diagram separates the raw and isotonic model paths. That
      comparison gives the ECE improvement of 0.028 → 0.016 and the frozen
      policy cost improvement of 644 → 601 on the holdout. A seeded 25-trial
      search selected XGBoost; a separate three-fold OOF cost search froze the
      served threshold of 0.175 under the 1-versus-5 cost model. The bootstrap
      holds thresholds fixed, so its interval does not measure selection
      uncertainty.
      [full evaluation report](https://amm-ds.github.io/portfolio/projects/05-ml-pipeline-churn/) · [try the live demo](https://amm-ds.github.io/portfolio/demos/churn-sandbox/)

      ## Exact numbers

      Cost model. FP means false positive, a customer contacted who would
      have stayed. FN means false negative, a churner the list misses:

      | cost parameter | value | meaning |
      |---|---|---|
      | FP cost | 1 | one retention voucher / false alarm |
      | FN cost | 5 | one lost customer |
      | holdout churn rate | 26.5% | 374 of 1,409 customers |
      | threshold grid | 41 points (0.00–1.00) | training-side OOF cost search |

      Holdout results at thresholds frozen before scoring, with run identifiers
      in `reports/metrics.json`. XGB is XGBoost, the selected model that
      combines gradient-boosted trees:

      | run | threshold | ROC-AUC | F1 (macro) | ECE | business cost |
      |---|---|---|---|---|---|
      | contact everyone (fixed) | 0.000 | 0.5000 | 0.2098 | – | 1,035 |
      | logistic, default | 0.500 | 0.8292 | 0.7022 | – | 691 |
      | logistic, OOF-frozen | 0.450 | 0.8292 | 0.6796 | – | 655 |
      | selected raw XGB | 0.225 | 0.8387 | 0.6981 | 0.028 | 644 |
      | selected + isotonic ← served | 0.175 | 0.8317 | 0.6745 | **0.016** | **601** |

      Compare the last row with the bootstrap figure: cost falls 1,035 → 601
      (−41.9%) versus contacting everyone. The bootstrap point is −434, with
      95% CI [−508, −353] over 2,000 paired resamples at fixed thresholds.
      Against logistic-at-0.5, the exact served policy's point is −90 with
      95% CI [−159, −26].

      Cost-model sensitivity, re-scored via `cli sensitivity` into
      `reports/sensitivity.json`, re-freezes each cutoff from the same persisted
      training OOF predictions before scoring the holdout:

      | FN cost | served threshold | served cost | contact-everyone cost | delta 95% CI |
      |---|---|---|---|---|
      | 3 | 0.250 | 514 | 1,035 | [−581, −456] |
      | 5 | 0.175 | 601 | 1,035 | [−508, −353] |
      | 8 | 0.150 | 718 | 1,035 | [−418, −204] |

      Record. CV means cross-validation, which estimates training performance
      on held-out folds. For expert readers, `n_estimators` counts trees,
      `learning_rate` scales each tree's contribution, `max_depth` limits tree
      depth, and `subsample` sets the fraction of rows used:

      | record | detail |
      |---|---|
      | model search | seeded Optuna (25 trials, median pruning) on out-of-fold business cost at each trial's own threshold; XGBoost wins telco (n_estimators 211, learning_rate 0.0309, max_depth 3, subsample 0.5187; CV cost 2,416); logistic wins the synthetic track; the isotonic twin uses only the train-side calibration split |
      | operating policy | stratified three-fold OOF predictions on all 5,634 training rows; calibrated OOF training cost 2,425; threshold 0.175 frozen before holdout scoring and loaded unchanged by evaluation and serving |
      | fairness slices | raw model at t=0.225, from `reports/figures/fairness_slices.json`, not the served policy: gender recall 0.834 female / 0.829 male; senior recall 0.898 versus 0.808 non-senior; contract recall 0.918 month-to-month, 0.250 one-year, 0.000 two-year; the raw policy misses 27 of 36 one-year churners and all 9 two-year churners; the served artifact is isotonic-calibrated at t=0.175, so these counts must not be attributed to serving |

      **Pipeline:** one fitted scikit-learn Pipeline applies every preparation
      step in a fixed order. Follow the raw and calibrated branches to keep
      the search, synthetic, and fairness records attached to the right path.

            ```diagram auto-05-ml-pipeline-churn-4
            ```

      ## Protocol

      The pipeline diagram and bootstrap figure use this protocol:

      - **Split:** stratified 80/20 at seed 42 → 5,634 training rows and the
        1,409-row holdout, scored once. 20% of training is reserved for
        isotonic calibration.
      - **Threshold selection:** stratified three-fold OOF predictions price
        the 41-point grid. Thresholds and OOF costs persist in
        `data/operating_policy.json` before evaluation or serving.
      - **Judging:** one cost model and one holdout; ROC-AUC, macro F1,
        business cost at each frozen policy, and ECE; fairness slices on
        contract, gender, and senior status.
      - **Uncertainty:** 2,000 paired bootstrap resamples at fixed thresholds
        compare the exact calibrated policy with contact-everyone and with
        logistic-at-0.5. They measure row-sampling variation, not selection
        instability.
      - **Synthetic twin:** 8.8% churn, planted nulls, and one 9,999 outlier
        charge provide CI evidence only.

      ## Limits

      - Final metrics come from one random snapshot split. Bootstrap resamples
        do not capture model-search or threshold-selection instability.
      - Neither visual has a time axis. They support no drift, seasonality,
        or causal claim. Temporal validation waits for a time-stamped feed
        from the data owner.
      - The pipeline diagram keeps raw and calibrated serving separate.
        Fairness numbers describe the raw model at its OOF-frozen threshold,
        not the served calibrated policy.
      - The pipeline covers one operator and 21 columns. Transfer to other
        customer bases is plausible, not measured.

      **Business summary:** The measured record is 601 versus 1,035 on one
      holdout. The visuals and tables preserve its limits: one snapshot,
      raw-model fairness, no time axis, and unmeasured transfer.
    figures: [bootstrap_ci]
