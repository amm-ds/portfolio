project_id: 05-ml-pipeline-churn
short_version: |
  A churn scorer on real IBM telco data (7,043 customers): serving the calibrated model at a 0.175 threshold cuts decision cost 42% (601 vs 1,035 for contacting everyone; 95% bootstrap interval -485 to -343). The cutoff must be re-derived when a missed churner's price changes.
sections:
  - id: background
    text_md: |
      **On a 1,409-customer holdout, the calibrated model at a 0.175
      threshold cuts decision cost 41.9%—601 vs 1,035 for contacting
      everyone—paired-bootstrap interval −485 to −343 on the saving.**

      **Data.** Real IBM telco data (7,043 customers, IBM sample-data
      license), sha256-pinned; a synthetic twin (8.8% churn) supports CI.

      **Limits.** Thresholds are selected and scored on the same holdout—cost
      and slice figures are optimistically biased; the snapshot has no time
      axis; fairness slices: contract, gender, senior-citizen status only.

      **In plain terms:** it hands retention a budget line, not a scoreboard. A
      false alarm costs one voucher; a missed churner costs five; the scored
      list is 42% cheaper than contacting everyone—explore in
      [the churn sandbox](https://amm-ds.github.io/portfolio/demos/churn-sandbox).
  - id: objectives
    text_md: |
      Turn churn scores into a retention-contact policy under asymmetric
      costs: a false alarm spends one retention voucher, a missed churner
      costs five. Accuracy is the wrong target here — a policy that contacts
      nobody scores 73.5% accurate while saving nothing.

      The question: what contact threshold minimizes the expected bill, how
      uncertain is that saving, and how stable is the threshold when the
      price of a missed churner moves? Every candidate — including a naive
      constant-probability baseline whose cheapest choice is contacting
      everyone — answers on the same holdout under the same cost model.
  - id: data
    text_md: |
      The primary track is the real IBM telco panel: 7,043 customers × 21
      columns at 26.5% churn, loaded from the canonical GitHub mirror with a
      pinned sha256 and [dataset contract](https://amm-ds.github.io/portfolio/data-registry/telco-churn/).
      The HF id cited in planning does not exist; the raw IBM mirror is the
      implemented source.

      A stratified 80/20 split yields 5,634 training rows and the 1,409-row
      holdout; 20% of training is reserved for calibration, so the holdout is
      untouched by fitting, tuning and calibration. A separate synthetic CI
      generator (8.8% churn, planted nulls and one outlier charge) exercises
      the same data-quality gates offline and never substitutes for the
      real-data results.
  - id: eda
    text_md: |
      Real churn concentrates where commitment is low: month-to-month
      customers churn at 42.7% versus 2.8% on two-year contracts, senior
      citizens at 41.7%, fiber-optic subscribers at 41.9%. Churners pay more
      (~$74 versus ~$61 mean monthly charges) and leave sooner (~18 versus
      ~38 mean months of tenure).

      Every candidate is judged on the same holdout under one cost model:
      ranking quality (ROC-AUC), macro F1, business cost across a 41-point
      threshold grid, and, for selected models, calibration error — with PR
      curves read against the 26.5% base-rate floor, permutation importance,
      and fairness slices by contract, gender and senior status. The paired
      bootstrap resamples holdout rows at fixed thresholds, so its interval
      captures cost sampling variation, not threshold-selection instability.
    figures: [eda_churn_profile, precision_recall_curve, cost_surface]
  - id: training
    text_md: |
      All data-quality gates pass before training: null rates are 0.000 for
      tenure and charges, values sit inside their allowed ranges, and churn is
      binary. One fitted pipeline owns outlier capping, missingness flags,
      imputation, scaling and one-hot encoding, so training and serving share
      preprocessing exactly.

      **The naive policy is the expensive one.** Contacting everyone costs
      1,035; doing nothing is cheaper only if missed churners are free, which
      they are not at five vouchers each.

      **Cost beats accuracy as an objective.** A default-threshold logistic
      model costs 691; re-tuning its threshold cuts that to 611. An earlier
      F1-driven selection picked a different family — the objective changes
      the winner, which is why the cost model leads here.

      **The served model.** A gradient-boosted model chosen by seeded search
      on out-of-fold business cost, then isotonic-calibrated on the training
      side only, costs 601 at threshold 0.175 — the 41.9% cut, with the
      paired-bootstrap interval [−485, −343] excluding zero. Calibration
      improves error 0.028 → 0.016 and cost 619 → 601.

      **The cutoff is not a constant.** Re-scoring under different missed-
      churner prices moves the served threshold — 0.200 when a churner costs
      3, 0.175 when 5, 0.100 when 8 — and every variant's interval still
      excludes zero. Calibration's edge is itself price-dependent: it helps
      at five (619 → 601) and slightly hurts at eight (691 → 699).

      **The strongest signal hides the weakest slice.** The raw model recalls
      month-to-month churners at 0.976 but misses 19 of 36 one-year and all
      9 two-year churners; gender recall is near-uniform (0.902 versus 0.906).
      Contract, tenure and charges drive the ranking — and long-contract
      churners are exactly who the raw policy loses.
    figures: [calibration_curve, business_cost_curve, permutation_importance]
    metrics_keys: [naive_majority, logreg_threshold_0.300, selected_model, selected_model_calibrated]
  - id: evaluation
    text_md: |
      The artifact is deployable as-is: raw CRM rows in, gated and
      preprocessed inside the pipeline, scored and thresholded out. The
      measured value is a 42% decision-cost cut with its uncertainty attached
      — a budget line a retention team can act on. Two watch items ride with
      it: the saving is read on the same holdout that chose the threshold, so
      it is optimistic; and the raw model's blind spot for two-year
      churners means served-policy fairness on fresh data is the gate before
      rollout.

      **Business summary:** deploy on raw CRM rows with the data-quality
      gates as the contract; expect a ~42% decision-cost cut at a 5× missed-
      churner price, stable in sign from 3× to 8×; re-derive — never copy —
      the cutoff whenever the price ratio changes.
  - id: results
    text_md: |
      - Thresholds are selected and scored on the same 1,409-row holdout, so
        the 601 cost and every slice figure are optimistically biased; the
        bootstrap quantifies cost sampling variation only, not
        threshold-selection instability.
      - The snapshot has no time axis: nothing here is a drift, seasonality
        or causal claim, and the deferred next step is a time-stamped feed.
      - Fairness numbers describe the raw model at its own threshold, not
        the served calibrated policy.
      - One operator, 21 columns: transfer to other customer bases is
        plausible, not measured.
    figures: [fairness_slices]
  - id: conclusions
    text_md: |
      Full evidence: exact tables, parameter records, and reproduction
      pointers.

      **Cost model:**

      | cost parameter | value | meaning |
      |---|---|---|
      | FP cost | 1 | one retention voucher / false alarm |
      | FN cost | 5 | one lost customer |
      | holdout churn rate | 26.5% | 374 of 1,409 customers |
      | threshold grid | 41 points (0.00–1.00) | cost-optimum search |

      **Pipeline** (one fitted sklearn Pipeline owns preprocessing, so
      training and serving share it):

      ```mermaid
      flowchart LR
          A[raw CRM row] --> B[OutlierCapper]
          B --> C[MissingValueIndicator]
          C --> D[impute + scale]
          E[contract] --> F[one-hot encode]
          D --> G[ColumnTransformer]
          F --> G
          G --> H[classifier]
          H --> I[predict_proba]
      ```

      **Judging procedure:**

      ```mermaid
      flowchart LR
          A[predict_proba on holdout] --> B[41-point threshold grid]
          B --> C[cost at threshold]
          C --> D[cost-optimal threshold]
          D --> E[raw vs isotonic comparison]
      ```

      **Column mapping** (project name → telco source → role):

      | project column | telco source | role |
      |---|---|---|
      | tenure_months | tenure | numeric feature |
      | monthly_charges | MonthlyCharges | numeric feature |
      | contract | Contract | categorical feature + fairness slice |
      | internet_service | InternetService | categorical feature |
      | gender / senior_citizen | gender / SeniorCitizen | fairness slices |
      | churned | Churn | target |

      **EDA segments** (real telco; the synthetic twin's planted nulls and
      9,999 outlier charge are CI fixtures, not features of this data):

      | segment | rows | churn rate |
      |---|---|---|
      | month-to-month | 3,875 | 42.7% |
      | one-year | 1,473 | 11.3% |
      | two-year | 1,695 | 2.8% |
      | senior citizens | 1,142 | 41.7% |
      | fiber-optic internet | 3,096 | 41.9% |

      **Holdout results** (same-holdout optima; run ids as recorded in
      `reports/metrics.json`):

      | run | threshold | ROC-AUC | F1 (macro) | ECE | business cost |
      |---|---|---|---|---|---|
      | naive base rate (contact-everyone optimum) | 0.000 | 0.5000 | 0.2098 | – | 1,035 |
      | logistic, default | 0.500 | 0.8292 | 0.7022 | – | 691 |
      | logistic, tuned | 0.300 | 0.8292 | 0.6151 | – | 611 |
      | selected raw XGB | 0.150 | 0.8387 | 0.6512 | 0.028 | 619 |
      | selected + isotonic ← served | 0.175 | 0.8317 | 0.6745 | **0.016** | **601** |

      - **Cost:** 1,035 → 601 (−41.9%) versus contact everyone; paired
        bootstrap delta −416, 95% CI [−485, −343], 2,000 resamples at fixed
        thresholds, significant at 95%.
      - **Model record:** seeded Optuna (25 trials, median pruning) searched
        logistic, HistGradientBoosting, XGBoost and LightGBM on out-of-fold
        business cost at each trial's own threshold. XGBoost wins telco
        (n_estimators 211, learning_rate 0.0309, max_depth 3, subsample
        0.5187; CV cost 2,416); logistic wins the synthetic track (CV cost
        1,220). The isotonic twin uses only the train-side calibration split.
      - **Regime dependence:** synthetic t*=0.700 versus telco t*=0.175; the
        procedure transfers, not the cutoff.
      - **Cost-model sensitivity** (`reports/sensitivity.json`, re-scored via
        `cli sensitivity`):

      | FN cost | served threshold | served cost | naive cost | delta 95% CI |
      |---|---|---|---|---|
      | 3 | 0.200 | 510 | 1,035 | [−618, −474] |
      | 5 | 0.175 | 601 | 1,035 | [−485, −343] |
      | 8 | 0.100 | 699 | 1,035 | [−426, −258] |

      Calibration's cost edge is itself cost-model dependent: isotonic helps
      at FN=5 (619 → 601) but slightly hurts at FN=8 (691 → 699). The naive
      comparator stays 1,035 throughout (contact-everyone has no missed
      churners), so the absolute saving shrinks as FN rises.
      - **Fairness slices** (raw model at t=0.150, from
        `reports/figures/fairness_slices.json` — not the served policy):
        gender recall 0.902 female / 0.906 male; senior recall 0.969 versus
        0.880 non-senior; contract recall 0.976 month-to-month, 0.472
        one-year, 0.000 two-year — the raw policy misses **19 of 36** one-
        year churners and **all 9** two-year churners. The served artifact is
        isotonic-calibrated at t=0.175, so these counts must not be
        attributed to serving.
      - **Drivers:** permutation importance (5 repeats) ranks contract,
        tenure and charges as the main signal. The naive row's accuracy is
        0.265 at contact-all; contact-none would score 0.735 accuracy but is
        a different policy.
      - **Try it:** [the churn threshold sandbox](https://amm-ds.github.io/portfolio/demos/churn-sandbox)
        replays the committed holdout payload.

      **Reproduction:** pipeline stages and the evaluate/threshold grid run
      through the project CLI on the pinned dataset; the FN-cost variants
      re-score the persisted artifacts via `cli sensitivity`
      (`reports/sensitivity.json`). The served artifact's record —
      family, parameters, threshold rule, holdout minimum — is persisted in
      `reports/models/serving/meta.json`.
    figures: [bootstrap_ci]
roadmap:
  - status: delivered
    text: Real telco pipeline — DQ gates, cost-aware HPO, calibration and serving at t=0.175.
  - status: delivered
    text: Evidence pack — fixed-threshold bootstrap CI, cost surface and raw-model fairness slices.
  - status: delivered
    text: FN-cost sensitivity re-run — t*=0.200/0.175/0.100 at FN=3/5/8, every CI excludes zero; queued-DVC path re-validated.
  - status: deferred
    text: Frozen-threshold validation of cost and served-policy fairness on fresh data, plus any drift or seasonality claim — the IBM snapshot has no time axis; a new time-stamped feed from the data owner is the prerequisite.
figure_captions:
  eda_churn_profile: Real telco churn by contract, charges and tenure. Month-to-month churn is 42.7% versus 2.8% for two-year contracts; synthetic outlier/NaN fixtures are separate CI evidence.
  calibration_curve: Raw versus isotonic reliability on the 1,409-row holdout. Isotonic improves ECE 0.028 → 0.016 and the same-holdout cost optimum 619 → 601.
  precision_recall_curve: Logistic and selected-model PR curves with the 26.5% base-rate floor. Ranked probabilities, not the no-skill policy, lift precision above that floor.
  cost_surface: Isotonic-model cost across threshold and FN cost, with t=0.175 starred. The cutoff moves with the price assigned to a missed churner; its reported optimum is selected on this same holdout.
  business_cost_curve: Holdout cost across thresholds for each candidate. The served isotonic model reaches 601 versus 1,035 for the naive contact-everyone optimum; both thresholds and costs use this holdout.
  permutation_importance: Holdout F1 decrease after permutation, five repeats with error bars. Contract, tenure and monthly charges carry the main signal.
  fairness_slices: Raw XGB slices at t=0.150, not the served isotonic policy. The raw model misses 19 of 36 one-year and all 9 two-year churners; gender recall is nearly uniform.
  bootstrap_ci: Two thousand paired holdout resamples at fixed thresholds. The cost-delta 95% CI [−485, −343] excludes zero; it does not include threshold-selection variance.
