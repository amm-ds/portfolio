project_id: 05-ml-pipeline-churn
sections:
  - id: background
    text_md: |
      Churn is asymmetric economics: a missed churner (false negative) costs
      the business roughly five times a false alarm (false positive) — a lost
      customer versus one retention voucher. With a base churn rate of only
      ~9%, the cheapest "model" is to never ring the alarm, and it is still
      wrong in the way that costs money.

      This project shows how to take churn from a spreadsheet of scores to an
      operating decision: a production-grade sklearn pipeline whose artifact
      can be handed raw CRM rows, an honest naive baseline on the same cost
      curve, model selection with Optuna, and a threshold chosen on a
      business-cost curve rather than accepted as a library default.

      **Business implication:** retention budget is a cost-minimization
      problem (FP=1, FN=5), so every artifact below is judged in money saved,
      not in accuracy or leaderboard rank.
  - id: objectives
    text_md: |
      1. Rank customers by churn risk on deliberately messy tabular data,
         with all preprocessing embedded in the fitted model (no train/serve
         skew, deployable as-is).
      2. Quantify value honestly: every metric is reported against a naive
         majority baseline on the same holdout and the same cost model.
      3. Select the classifier with Optuna (logistic vs gradient boosting,
         seeded) — and check whether the selection objective (CV F1) actually
         transfers to the business metric.
      4. Decide the operating threshold by minimizing FP·1 + FN·5, and verify
         whether isotonic calibration improves that optimum.
      5. Enforce data quality as a gate: null rates and ranges are checked
         before training, and a failure halts the pipeline loudly.

      **Business implication:** the deliverable is an operating decision — a
      threshold and an expected cost — with the model selection metric held
      accountable to the business metric it will be judged by.
  - id: data
    text_md: |
      The dataset is the platform's seedable synthetic churn generator
      (`portfolio_core.synthetic.churn`) — 5,000 rows with deliberate
      production pathologies: ~2% NaN in `age`, ~3% NaN in `support_calls`
      (NaN-encoded gaps, the way CRM exports often leak them), a single 9,999
      monthly-charge outlier, and a boolean churn flag at an 8.8% base rate.
      It lives in the platform's synthetic generator library
      ([libs/portfolio-core](https://github.com/amm-ds/portfolio/tree/main/libs/portfolio-core)),
      is fully seeded, and is versioned here by a DatasetContract with a
      SHA-256 checksum.

      No external dataset card exists for it — that is the point: the
      synthetic track mirrors production pathologies (missingness, outliers,
      drift) in a compact, reproducible frame, and the pipeline contract
      (DQ gates → embedded preprocessing → cost-tuned decision) transfers to
      a client's CRM extract unchanged. Split: stratified 80/20 → 4,000
      train / 1,000 holdout; a further 20% of train is reserved for
      calibration only. No time axis exists, so random stratification is the
      correct protocol.

      **Business implication:** a client demo runs on data with the same
      failure modes as their CRM export, and swapping in their real extract
      requires no code change — only a new DatasetContract row.
  - id: eda
    text_md: |
      Churn is concentrated where contracts are short: month-to-month
      customers churn at 13.6%, one-year at 3.8%, two-year at 1.9% — the
      single strongest visual split in the data. Churners also pay more
      (~111 vs ~68 mean monthly charges, overlapping distributions) and have
      shorter tenure (~15 vs ~25 months), and a long low-tenure tail is
      visible in the distribution panels.

      The outlier charge sits far outside the bulk of both distributions —
      exactly the row that would distort an unguarded scaler — and the
      NaN-encoded gaps are invisible to a casual `head()` but visible to the
      DQ gates.

      **Business implication:** contract type and bill size are where a
      retention budget buys the most — and the outlier/missingness handling
      is what keeps that budget aimed at real customers instead of data
      artifacts.
    figures: [eda_churn_profile]
  - id: training
    text_md: |
      One fitted sklearn Pipeline from raw DataFrame to probability. Numeric
      branch: `OutlierCapper` clips at train-time 1%/99% quantiles, a
      `MissingValueIndicator` appends `<col>_was_missing` flags before
      imputation, then median imputation and standard scaling. Categorical
      branch: most-frequent imputation + one-hot with `handle_unknown=
      'ignore'`. All preprocessing lives inside the estimator, so the
      artifact's deployment contract is "hand us the raw row".

      **Selection:** a wave-2 `GridSearchCV` over C keeps the logistic
      baseline; Optuna (seeded TPE, 25 trials, median pruning, stratified-CV
      F1) then searches LogisticRegression (C log 1e-3..1e2, l1_ratio 0..1)
      against HistGradientBoostingClassifier. The winner — **HistGB**
      (learning_rate 0.0795, max_iter 116, max_leaf_nodes 20,
      min_samples_leaf 41; CV F1 0.3648 vs 0.3433) — is written back to
      `params.yaml` as the production config. An isotonic-calibrated twin is
      fitted on the calibration split only.

      **Business implication:** the artifact handed to engineering scores raw
      CRM rows as-is — no ETL rewrite, no train/serve skew — and the winning
      config is recorded in versioned config, not in someone's notebook.
  - id: evaluation
    text_md: |
      Holdout: 1,000 stratified rows, never seen by HPO, fitting, or
      calibration. Metrics via `portfolio_eval`: ROC-AUC, macro
      precision/recall/F1, business cost (FP·1 + FN·5) at each run's operating
      point, and ECE (expected calibration error, 10 bins) for the selected
      runs. Five runs: naive majority (constant probability = base rate), the
      wave-2 logistic at 0.5 and at its cost optimum, and the selected model
      raw and isotonic-calibrated at their cost optima.

      Diagnostics: reliability diagram (raw vs calibrated, ECE in the
      legend), permutation importance (holdout F1, 5 repeats, error bars),
      PR curves with the naive base-rate floor, decision-curve analysis (net
      benefit vs treat-all / treat-none), and the business-cost curve with
      every optimum marked.

      **Business implication:** calibration improved probabilities 10×
      (ECE 0.157 → 0.017) without moving the cost optimum — know which metric
      pays: ECE matters when probabilities themselves are consumed, the cost
      curve is what settles the alarm threshold.
    figures: [calibration_curve, precision_recall_curve, decision_curve]
  - id: results
    text_md: |
      Run ladder (holdout, FP=1/FN=5):

      | run | threshold | ROC-AUC | F1 (macro) | ECE | business cost |
      |---|---|---|---|---|---|
      | naive majority | cost-optimal | 0.5000 | 0.4770 | – | 440 |
      | logistic, default 0.5 | 0.500 | 0.8344 | 0.5796 | – | 350 |
      | logistic, tuned | 0.725 | 0.8344 | **0.6833** | – | **282** |
      | selected (HistGB) | 0.700 | 0.8125 | 0.6593 | 0.157 | 321 |
      | selected + isotonic | 0.225 | 0.8008 | 0.6642 | **0.017** | 328 |

      Key findings:

      - **Cost vs naive: −35.9% (440 → 282), macro F1 +43% (0.477 → 0.683).**
      - **Threshold tuning alone: −19.4%** of the cost win (350 → 282), same
        model, no retraining — the operating point is a business decision.
      - **Isotonic calibration: ECE 0.157 → 0.017 (−89%)**, F1 up slightly,
        but the cost optimum does not improve (328 vs 321).
      - **Selection-objective lesson:** HPO picked HistGB on CV F1 (0.3648 vs
        0.3433), yet the simpler tuned logistic wins the business cost on
        holdout (282 vs 321).
      - The naive run posts the best accuracy (0.912): on an 8.8% churn
        rate, never alarming is accurate and useless.

      **Business implication:** the HPO-selected GBM loses on business cost
      to the simpler logistic — the deployment objective, not the leaderboard
      metric, chose the production model; report both and the choice is
      defensible.
    figures: [business_cost_curve, permutation_importance]
    metrics_keys: [naive_majority, logreg_threshold_0.725, selected_model, selected_model_calibrated]
  - id: conclusions
    text_md: |
      Pipeline-embedded preprocessing is the deployment contract: capping,
      flags, imputation, and scaling ship inside the artifact, so serving is
      one line of code and cannot drift from training — a data bug either
      passes the DQ gate or stops the pipeline.

      Three lessons generalize. **First**, threshold choice is a business
      decision: tuning to the cost curve cut cost by a fifth with zero
      retraining. **Second**, optimize what you deploy: CV F1 selected a
      model that lost on the business metric — scoring trials by business
      cost (roadmap) closes that gap. **Third**, calibration is a product
      decision: it made probabilities trustworthy (ECE 0.157 → 0.017) without
      moving the alarm's cost — the decision-curve and business-cost figures
      are the arbiters, not the reliability diagram alone.

      **Business implication:** the framework transfers to a client's CRM
      extract unchanged — same gates, same artifact contract, same cost
      curve — only the DatasetContract and the FP/FN costs change.
