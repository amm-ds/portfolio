project_id: 05-ml-pipeline-churn
short_version: |
  A churn scorer on real IBM telco data (7,043 customers): serving the calibrated model at a 0.175 threshold cuts decision cost 42% (601 vs 1,035 for contacting everyone; 95% bootstrap interval -485 to -343). The cutoff must be re-derived when a missed churner's price changes.
sections:
  - id: background
    text_md: |
      **A churn scorer turns scores into a contact list with a price on it.**
      For a retention team the deliverable is the priced list, not the
      score. The decision diagram shows the served path: read it
      left to right — one fitted pipeline scores each row, the 0.175
      threshold splits "call" from "skip", and the bill box prices the
      outcome at 601 versus 1,035 for contacting everyone, a 41.9% cut;
      95% bootstrap interval −485 to −343.

      ```mermaid
      flowchart LR
        subgraph CYCLE["one retention cycle"]
          CRM["raw CRM row<br/>21 columns"] --> PIPE["one fitted pipeline<br/>caps, flags, imputes, encodes"]
          PIPE --> SCORE["churn probability"]
          SCORE --> CUT{"threshold 0.175"}
          CUT -->|"above"| LIST["contact list"]
          CUT -->|"below"| SKIP["no contact"]
        end
        subgraph BILL["1,409-row holdout"]
          LIST --> COST["601 cost units<br/>FP x 1 + FN x 5"]
          ALL["contact everyone: 1,035"] --> DELTA["saving -41.9%<br/>95% interval -485 to -343"]
          COST --> DELTA
        end
      ```

      The cost asymmetry is the point: a false alarm spends one retention
      voucher, a missed churner costs five — accuracy-first scoring was
      rejected because it prices both mistakes the same.
      The next section asks what "best" means under that price split.

      **Business summary:** On 7,043 real telco customers, the served model
      cuts the retention-contact bill 42% versus contacting everyone; the
      cutoff must be re-derived when a missed churner's price changes.
    figures: []
  - id: objectives
    text_md: |
      **The goal is the cheapest contact list, not the best score.**
      Accuracy is the wrong target here: a policy that contacts nobody is
      73.5% accurate and saves nothing. Three questions drive the work.
      Which contact threshold gives the lowest expected bill? How sure is
      the saving? And how far does the best threshold move when the price
      of a missed churner changes? The cost-model diagram shows the search.
      Read it left to right: the stated cost model — a false alarm costs
      1 voucher, a missed churner 5 — feeds the three candidates, all
      answering on the same 1,409-row holdout under a 41-point threshold
      grid, where the cheapest expected bill wins. The chain ends with
      the two outputs: the served policy's saving with its interval, and
      a stability check that re-runs the search as the missed-churner
      price moves. An F1-first selection was tried and rejected: it picked
      a different model family, proof that the objective changes the
      winner.

      ```mermaid
      flowchart LR
        CM["cost model:<br/>FP 1, FN 5"] --> CD["candidates:<br/>naive, logistic, boosting"]
        CD --> G["41-point threshold grid"] --> A["argmin of<br/>expected bill"]
        A --> S["served policy:<br/>saving + interval"] --> Q["stability vs<br/>FN price"]
      ```

      Success means:

      - One cost model and one holdout, so every candidate is comparable.
      - A threshold with an interval on its saving.
      - A clear answer when the missed-churner price runs from 3 to 8.

      The next section sets up the data those candidates answer on.

      **Business summary:** The goal is the cheapest contact list under a
      1-versus-5 cost split, with the saving's range and the threshold's
      stability measured, not asserted.
    figures: []
  - id: data
    text_md: |
      **One real panel, one synthetic twin, strict splits.** The primary
      track is the IBM telco panel: 7,043 customers × 21 columns at 26.5%
      churn, loaded from the canonical GitHub mirror with a pinned sha256
      and a [dataset contract](https://amm-ds.github.io/portfolio/data-registry/telco-churn/).
      The HF id cited in planning does not exist; the raw IBM mirror is the
      implemented source — a public mirror with a hash beat a re-hosted
      copy, because the pin must travel with the citation. The lineage
      diagram shows how the panel flows to the scored-once holdout. Read it
      left to right: both sources pass the same data-quality gates — null
      rates within bounds, values inside allowed ranges, churn strictly
      binary — and only then split.

      ```mermaid
      flowchart LR
        SRC["IBM mirror +<br/>synthetic twin"] --> DQ["contract gates:<br/>nulls, ranges, binary churn"]
        DQ --> SP["stratified 80/20,<br/>seed 42"] --> TR["train 5,634:<br/>fit + calibrate"]
        SP --> HO["holdout 1,409:<br/>scored once"]
      ```

      The split is stratified 80/20 at seed 42: 5,634 training rows and the
      1,409-row holdout, which is scored once, after fitting, tuning and
      calibration are finished. Calibration gets its own 20% carve-out on
      the train side only, so the holdout never informs the isotonic fit.
      The synthetic twin — 8.8% churn, planted nulls, one 9,999 outlier
      charge — exists for CI: it exercises the same gates offline when the
      network is unavailable, and never substitutes for the real-data
      results. The next section profiles what churn looks like in this
      panel.

      **Business summary:** One real panel — 7,043 customers, sha256-pinned
      — splits into train, calibration and a scored-once holdout; a
      synthetic twin guards the pipeline in CI only.
    figures: []
  - id: eda
    text_md: |
      **Churn is highest where commitment is low.** The churn-profile figure
      shows it — read the contract panel first: month-to-month customers
      churn at 42.7%, two-year contracts at 2.8%. Senior citizens churn at
      41.7%; fiber-optic users at 41.9%. Churners also pay more (about $74
      vs $61 a month, on average) and leave sooner (about 18 vs 38 months
      of tenure).

      These facts set the rules for judging models. Every model is scored
      on the same holdout under one cost model: ROC-AUC (how often a random
      churner outranks a random stayer), macro F1 (the precision-recall
      balance, averaged over both classes), business cost over a 41-point
      threshold grid, and, for the top models, calibration error. Three
      figures carry the reading. The precision-recall figure is read
      against the 26.5% base-rate floor — a curve hugging that floor adds
      nothing. The cost-surface figure maps cost over thresholds and
      missed-churner prices before any cutoff is picked: find the dark
      valley, watch its floor drift left as the missed-churner price rises,
      and check the starred point — the served cutoff, t=0.175. The paired
      bootstrap resamples holdout rows at fixed thresholds; it prices the
      noise in the cost, not the choice of threshold. The next section runs
      the candidates under these rules.

      **Business summary:** Churn is highest where commitment is low —
      month-to-month, senior, fiber — and churners pay more and leave
      sooner; those patterns set the judging rules for every model below.
    figures: [eda_churn_profile, precision_recall_curve, cost_surface]
  - id: training
    text_md: |
      All data-quality gates pass before any model is fit: null rates are
      0.000 for tenure and charges, values sit inside their allowed ranges,
      and churn is binary. One fitted pipeline owns outlier capping,
      missingness flags, imputation, scaling and one-hot encoding, so
      training and serving share preprocessing exactly.

      **The naive policy is the expensive one.** Contacting everyone costs
      1,035; doing nothing is cheaper only if missed churners are free —
      and at five vouchers each, they are not.

      **Cost beats accuracy as an objective.** A default-threshold logistic
      model costs 691; re-tuning its threshold cuts that to 611. An earlier
      F1-driven selection picked a different family — the objective changes
      the winner.

      **The served model.** A seeded search (25 Optuna trials, median
      pruning) chose a gradient-boosted model on out-of-fold business cost;
      isotonic calibration on the training side only improves ECE (expected
      calibration error) 0.028 → 0.016 and the cost optimum 619 → 601 at
      threshold 0.175 — the 41.9% cut, its interval excluding zero.

      **The cutoff is not a constant.** Re-scoring under different
      missed-churner prices moves the served threshold — 0.200 when a
      churner costs 3, 0.175 when 5, 0.100 when 8 — and every variant's
      interval still excludes zero. Calibration's edge is itself
      price-dependent: it helps at five (619 → 601) and slightly hurts at
      eight (691 → 699).

      **The strongest signal hides the weakest slice.** The raw model
      recalls month-to-month churners at 0.976 but misses 19 of 36 one-year
      and all 9 two-year churners; gender recall is near-uniform (0.902
      versus 0.906). The permutation-importance figure ranks contract,
      tenure and charges on top — and long-contract churners are exactly
      who the raw policy loses.

      Read the figures at face value: the calibration figure overlays the
      raw and isotonic reliability curves — the straighter line wins; the
      cost-curve figure is read by its minimum, 601 versus the naive flat
      line at 1,035; the permutation-importance figure is read top-down,
      where contract, tenure and charges sit. The next section checks the
      served artifact against the measurement contract.

      **Business summary:** Cost, not accuracy, picks the winner: a
      calibrated boosted model serves at 0.175 for 601 versus 1,035; the
      cutoff moves when the missed-churner price moves.
    figures: [calibration_curve, business_cost_curve, permutation_importance]
    metrics_keys: [naive_majority, logreg_threshold_0.300, selected_model, selected_model_calibrated]
  - id: evaluation
    text_md: |
      **Deployable as-is, optimistic by construction.** The artifact takes
      raw CRM rows in and returns a scored, thresholded contact list. The
      measurement chain behind the headline number is fixed up front: every
      candidate scores probabilities on the same frozen holdout, a 41-point
      threshold grid prices each cutoff under the 1-versus-5 cost model,
      the argmin picks the threshold, and 2,000 paired bootstrap resamples
      at fixed thresholds turn the raw-versus-isotonic cost gap into a 95%
      interval. The evaluation-contract diagram shows the chain; read it
      left to right — scoring, grid, argmin, interval — then the two watch
      items hanging off the end.

      ```mermaid
      flowchart LR
        subgraph HOLDOUT["one frozen holdout - 1,409 rows"]
          S["score every candidate"]
          G["41-point threshold grid"]
          A["cost-optimal threshold"]
        end
        subgraph EVIDENCE["headline evidence"]
          I["2,000 paired resamples:<br/>95% interval -485 to -343"]
        end
        S --> G --> A --> I
        I --> W["two watch items:<br/>same-holdout optimism,<br/>served-policy fairness"]
      ```

      The optimism is structural, not a bug to fix here: the interval is
      read on the same holdout that chose the threshold. The obvious
      alternative — a fresh time-split — is impossible with this snapshot,
      because the data carries no time axis and later months cannot be
      re-scored. The fix, a time-stamped feed from the data owner, is the
      first requirement before rollout. The second watch item is the raw
      model's blind spot for two-year churners, which makes served-policy
      fairness on fresh data the gate before rollout. The next section
      lists what the measured numbers do and do not support.

      **Business summary:** Deploy on raw CRM rows behind the data-quality
      gates; expect a ~42% cost cut at a 5× missed-churner price, stable
      from 3× to 8×; re-derive the cutoff when the price changes.
    figures: []
  - id: results
    text_md: |
      What the measured numbers support — and what they do not. Every claim
      below is traceable to a committed artifact, and the caveats are part
      of the results, not fine print. The fairness-slices figure is read
      slice by slice: each bar is a group's recall under the raw model at
      its own threshold. Look at the contract panel first — 0.976
      month-to-month against 0.000 two-year; the gender bars sit nearly
      level, so the blind spot is contract-shaped, not demographic.

      - The headline is a decision-cost cut: **601 versus 1,035 (−41.9%)
        at threshold 0.175, interval [−485, −343]** — a budget line a
        retention team can act on, not a scoreboard.
      - Thresholds are selected and scored on the same 1,409-row holdout,
        so 601 and every slice figure are optimistically biased; the
        bootstrap quantifies cost sampling variation only.
      - The snapshot has no time axis: nothing here is a drift, seasonality
        or causal claim.
      - The fairness-slices figure describes the raw model at its own
        threshold, not the served calibrated policy — the blind spot is
        total there (0 of 9 two-year churners recalled).
      - One operator, 21 columns: transfer to other customer bases is
        plausible, not measured.

      That is the honest ledger; the conclusions hold the full record.

      **Business summary:** The saving is real but read on the same holdout
      that chose the threshold; treat 601 as a budget line with optimism
      built in, and fairness as a pre-rollout gate.
    figures: [fairness_slices]
  - id: conclusions
    text_md: |
      Full evidence: exact tables, parameter records, and reproduction
      pointers.

      ## Exact numbers

      Cost model:

      | cost parameter | value | meaning |
      |---|---|---|
      | FP cost | 1 | one retention voucher / false alarm |
      | FN cost | 5 | one lost customer |
      | holdout churn rate | 26.5% | 374 of 1,409 customers |
      | threshold grid | 41 points (0.00–1.00) | cost-optimum search |

      Holdout results (same-holdout optima; run ids as recorded in
      `reports/metrics.json`):

      | run | threshold | ROC-AUC | F1 (macro) | ECE | business cost |
      |---|---|---|---|---|---|
      | naive base rate (contact-everyone optimum) | 0.000 | 0.5000 | 0.2098 | – | 1,035 |
      | logistic, default | 0.500 | 0.8292 | 0.7022 | – | 691 |
      | logistic, tuned | 0.300 | 0.8292 | 0.6151 | – | 611 |
      | selected raw XGB | 0.150 | 0.8387 | 0.6512 | 0.028 | 619 |
      | selected + isotonic ← served | 0.175 | 0.8317 | 0.6745 | **0.016** | **601** |

      - **Cost:** 1,035 → 601 (−41.9%) versus contact everyone; paired
        bootstrap point −416, 95% confidence interval [−485, −343], 2,000
        resamples at fixed thresholds, significant at 95% — the bootstrap
        figure plots every resampled delta.
      - **Model record:** seeded Optuna (25 trials, median pruning) searched
        logistic, HistGradientBoosting, XGBoost and LightGBM on out-of-fold
        business cost at each trial's own threshold. XGBoost wins telco
        (n_estimators 211, learning_rate 0.0309, max_depth 3, subsample
        0.5187; CV cost 2,416); logistic wins the synthetic track. The
        isotonic twin uses only the train-side calibration split.
      - **Regime dependence:** synthetic t*=0.700 versus telco t*=0.175;
        the procedure transfers, not the cutoff.
      - **Cost-model sensitivity** (`reports/sensitivity.json`, re-scored
        via `cli sensitivity`):

      | FN cost | served threshold | served cost | naive cost | delta 95% CI |
      |---|---|---|---|---|
      | 3 | 0.200 | 510 | 1,035 | [−618, −474] |
      | 5 | 0.175 | 601 | 1,035 | [−485, −343] |
      | 8 | 0.100 | 699 | 1,035 | [−426, −258] |

      Calibration's cost edge is itself cost-model dependent: isotonic helps
      at FN=5 (619 → 601) but slightly hurts at FN=8 (691 → 699). The naive
      comparator stays 1,035 throughout, so the absolute saving shrinks as
      FN rises.
      - **Fairness slices** (raw model at t=0.150, from
        `reports/figures/fairness_slices.json` — not the served policy):
        gender recall 0.902 female / 0.906 male; senior recall 0.969 versus
        0.880 non-senior; contract recall 0.976 month-to-month, 0.472
        one-year, 0.000 two-year — the raw policy misses **19 of 36** one-
        year churners and **all 9** two-year churners. The served artifact
        is isotonic-calibrated at t=0.175, so these counts must not be
        attributed to serving.
      - **Drivers:** permutation importance (5 repeats) ranks contract,
        tenure and charges as the main signal. The naive row's accuracy is
        0.265 at contact-all; contact-none would score 0.735 accuracy but is
        a different policy.
      - **Try it:** [the churn threshold sandbox](https://amm-ds.github.io/portfolio/demos/churn-sandbox)
        replays the committed holdout payload.

      **Pipeline** (one fitted sklearn Pipeline owns preprocessing, so
      training and serving share it):

      ```mermaid
      flowchart LR
          A["raw CRM row"] --> B["OutlierCapper"]
          B --> C["MissingValueIndicator"]
          C --> D["impute + scale"]
          E["contract"] --> F["one-hot encode"]
          D --> G["ColumnTransformer"]
          F --> G
          G --> H["classifier"]
          H --> I["predict_proba"]
      ```

      **Column mapping** (project name → telco source → role):

      | project column | telco source | role |
      |---|---|---|
      | tenure_months | tenure | numeric feature |
      | monthly_charges | MonthlyCharges | numeric feature |
      | contract | Contract | categorical feature + fairness slice |
      | internet_service | InternetService | categorical feature |
      | gender / senior_citizen | gender / SeniorCitizen | fairness slices |
      | churned | Churn | target |

      **EDA segments** (real telco; the synthetic twin's planted nulls and
      9,999 outlier charge are CI fixtures, not features of this data):

      | segment | rows | churn rate |
      |---|---|---|
      | month-to-month | 3,875 | 42.7% |
      | one-year | 1,473 | 11.3% |
      | two-year | 1,695 | 2.8% |
      | senior citizens | 1,142 | 41.7% |
      | fiber-optic internet | 3,096 | 41.9% |

      ## Protocol

      - **Split:** stratified 80/20 at seed 42 → 5,634 training rows and the
        1,409-row holdout; 20% of training is reserved for isotonic
        calibration, so the holdout is untouched by fitting, tuning and
        calibration.
      - **Judging:** all candidates score the same holdout under one cost
        model — ROC-AUC for ranking, macro F1, business cost over the
        41-point grid, ECE for selected models; PR curves are read against
        the 26.5% base-rate floor; permutation importance uses 5 repeats;
        fairness slices cover contract, gender and senior status.
      - **Uncertainty:** 2,000 paired bootstrap resamples of holdout rows at
        fixed thresholds — the interval covers cost sampling variation, not
        threshold-selection instability.
      - **HPO:** seeded Optuna, 25 trials with median pruning, selecting on
        out-of-fold business cost at each trial's own threshold.
      - **Synthetic twin:** 8.8% churn with planted nulls and one 9,999
        outlier charge, run through the same gates — CI evidence only.

      ## Limits

      - Thresholds are selected and scored on the same holdout — the 601
        cost and every slice figure are optimistically biased.
      - The snapshot has no time axis: no drift, seasonality or causal
        claim is supported; frozen-threshold validation of cost and
        served-policy fairness on fresh data waits on a time-stamped feed
        from the data owner.
      - Fairness numbers describe the raw model at its own threshold, not
        the served calibrated policy.
      - One operator, 21 columns: transfer to other customer bases is
        plausible, not measured.

      ## Revision notes

      - Served artifact record — family, parameters, threshold rule, holdout
        minimum — is persisted in `reports/models/serving/meta.json` (built
        2026-10-17).
      - Cost-model sensitivity re-runs (`cli sensitivity`) persist at
        `reports/sensitivity.json`; the FN=5 variant reproduces the baseline
        metrics exactly.
      - The synthetic track's record (logistic winner, t*=0.700) lives in
        `data/model_selection.json`; it does not transfer to the real
        regime.

      ## Reproduce

      ```bash
      cd projects/05-ml-pipeline-churn
      uv run python -m churn_pipeline.cli all   # prepare -> train (cost-aware HPO) -> evaluate, ~35 s
      uv run python -m churn_pipeline.cli sensitivity   # FN=3/5/8 -> reports/sensitivity.json
      dvc repro projects/05-ml-pipeline-churn   # or staged via DVC
      ```

      CI path (no network): set `data_source: synthetic` in `params.yaml`,
      then the same `cli all`. Tests: `uv run pytest -q`.

      **Business summary:** The record: 601 versus 1,035 on one honest
      holdout, every caveat labelled — optimism, raw-model fairness, no time
      axis — and every artifact one command away.
    figures: [bootstrap_ci]
roadmap:
  - status: delivered
    text: Real telco pipeline — DQ gates, cost-aware HPO, calibration and serving at t=0.175.
  - status: delivered
    text: Evidence pack — fixed-threshold bootstrap CI, cost surface and raw-model fairness slices.
  - status: delivered
    text: FN-cost sensitivity re-run — t*=0.200/0.175/0.100 at FN=3/5/8, every CI excludes zero.
figure_captions:
  eda_churn_profile: Real telco churn by contract, charges and tenure. Month-to-month churn is 42.7% versus 2.8% for two-year contracts; synthetic outlier/NaN fixtures are separate CI evidence.
  calibration_curve: Raw versus isotonic reliability on the 1,409-row holdout. Isotonic improves ECE 0.028 → 0.016 and the same-holdout cost optimum 619 → 601.
  precision_recall_curve: Logistic and selected-model PR curves with the 26.5% base-rate floor. Ranked probabilities, not the no-skill policy, lift precision above that floor.
  cost_surface: Isotonic-model cost across threshold and FN cost, with t=0.175 starred. The cutoff moves with the price assigned to a missed churner; its reported optimum is selected on this same holdout.
  business_cost_curve: Holdout cost across thresholds for each candidate. The served isotonic model reaches 601 versus 1,035 for the naive contact-everyone optimum; both thresholds and costs use this holdout.
  permutation_importance: Holdout F1 decrease after permutation, five repeats with error bars. Contract, tenure and monthly charges carry the main signal.
  fairness_slices: Raw XGB slices at t=0.150, not the served isotonic policy. The raw model misses 19 of 36 one-year and all 9 two-year churners; gender recall is nearly uniform.
  bootstrap_ci: Two thousand paired holdout resamples at fixed thresholds. The cost-delta 95% CI [−485, −343] excludes zero; it does not include threshold-selection variance.
