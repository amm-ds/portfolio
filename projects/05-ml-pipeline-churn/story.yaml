project_id: 05-ml-pipeline-churn
sections:
  - id: background
    text_md: |
      Churn is asymmetric economics: a missed churner (false negative) costs
      the business roughly five times a false alarm (false positive) — a lost
      customer versus one retention voucher. With a base churn rate of only
      ~9%, the cheapest "model" is to never ring the alarm, and it is still
      wrong in the way that costs money.

      This project shows how to take churn from a spreadsheet of scores to an
      operating decision: a production-grade sklearn pipeline whose artifact
      can be handed raw CRM rows, an honest naive baseline on the same cost
      curve, model selection with Optuna, and a threshold chosen on a
      business-cost curve rather than accepted as a library default.

      | cost parameter | value | meaning |
      |---|---|---|
      | FP cost | 1 | one retention voucher / false alarm |
      | FN cost | 5 | one lost customer |
      | base churn rate | 8.8% | never-alarm accuracy: 0.912 |
      | threshold grid | 41 points (0.00–1.00) | where the optimum is searched |

      **Business implication:** retention budget is a cost-minimization
      problem (FP=1, FN=5), so every artifact below is judged in money saved,
      not in accuracy or leaderboard rank.
  - id: objectives
    text_md: |
      - Rank customers by churn risk on deliberately messy tabular data, with
        all preprocessing embedded in the fitted model (no train/serve skew,
        deployable as-is).
      - Quantify value honestly: every metric is reported against a naive
        majority baseline on the same holdout and the same cost model.
      - Select the classifier with Optuna (logistic vs gradient boosting,
        seeded) on a **cost-aware objective** — CV business cost with
        per-trial threshold tuning — so selection and deployment optimize the
        same thing.
      - Decide the operating threshold by minimizing FP·1 + FN·5, attach a
        paired bootstrap CI to the cost delta vs naive, and verify whether
        isotonic calibration improves that optimum.
      - Enforce data quality as a gate: null rates and ranges are checked
        before training, and a failure halts the pipeline loudly.

      **Business implication:** the deliverable is an operating decision — a
      threshold and an expected cost — with the model selection metric held
      accountable to the business metric it will be judged by.
  - id: data
    text_md: |
      The primary track is the real IBM telco churn dataset — 7,043 customers
      x 21 columns (demographics, services, account, churn label) at a 26.5%
      base churn rate, loaded from the canonical GitHub mirror with a pinned
      sha256 through the platform's fetch + DatasetContract (see
      [data-registry/telco-churn](https://github.com/amm-ds/portfolio/tree/main/docs/data-registry/telco-churn.md)).
      The HF id `julien-c/telco-churn` cited in planning does not exist; the
      raw CSV from IBM's repo is the documented fallback and is what runs.
      The platform's seeded synthetic generator (2% NaN age, 3% NaN
      support_calls, one 9,999 charge outlier, 8.8% base rate) stays as the
      clearly labeled CI path (`data_source: synthetic`) so tests never touch
      the network.

      | project column | telco source | role |
      |---|---|---|
      | tenure_months | tenure | numeric feature |
      | monthly_charges | MonthlyCharges | numeric feature |
      | contract | Contract | categorical feature + fairness slice |
      | internet_service | InternetService | categorical feature |
      | gender / senior_citizen | gender / SeniorCitizen | fairness slices |
      | churned | Churn | target (26.5% base rate) |

      - Split: stratified 80/20 → 5,634 train / 1,409 holdout; a further 20%
        of train is reserved for calibration only. No time axis exists, so
        random stratification is the correct protocol.

      **Business implication:** a client demo now runs on the same public
      dataset their data science team has benchmarked against for years — and
      the CI path proves the contract holds when the columns change.
  - id: eda
    text_md: |
      Churn is concentrated where contracts are short: month-to-month
      customers churn at 42.7%, one-year at 11.3%, two-year at 2.8% — the
      single strongest visual split in the data. Seniors churn at 41.7% vs
      23.6% for non-seniors, fiber-optic internet customers at 41.9%. Churners
      also pay more (~74 vs ~61 mean monthly charges) and have much shorter
      tenure (~18 vs ~38 months).

      | segment | rows | churn rate |
      |---|---|---|
      | month-to-month | 3,875 | 42.7% |
      | one-year | 1,473 | 11.3% |
      | two-year | 1,695 | 2.8% |
      | senior citizens | 1,142 | 41.7% |
      | fiber-optic internet | 3,096 | 41.9% |

      The outlier charge sits far outside the bulk of both distributions —
      exactly the row that would distort an unguarded scaler — and the
      NaN-encoded gaps are invisible to a casual `head()` but visible to the
      DQ gates.

      **Business implication:** contract type and bill size are where a
      retention budget buys the most — and the outlier/missingness handling
      is what keeps that budget aimed at real customers instead of data
      artifacts.
    figures: [eda_churn_profile]
  - id: training
    text_md: |
      All preprocessing lives inside one fitted sklearn Pipeline, so the
      artifact's deployment contract is "hand us the raw row":

      ```mermaid
      flowchart LR
          A[raw CRM row<br/>NaNs, outlier, strings] --> B[OutlierCapper<br/>train-time 1%/99% caps]
          B --> C[MissingValueIndicator<br/>was_missing flags]
          C --> D[SimpleImputer median<br/>+ StandardScaler]
          E[contract] --> F[most_frequent impute<br/>+ OneHot ignore-unknown]
          D --> G[ColumnTransformer]
          F --> G
          G --> H[classifier<br/>logreg or HistGB]
          H --> I[predict_proba]
      ```

      **Selection:** an earlier `GridSearchCV` over C keeps the logistic
      baseline; Optuna (seeded TPE, 25 trials, median pruning) then searches
      **four arms** — LogisticRegression (C log 1e-3..1e2, l1_ratio 0..1),
      HistGradientBoostingClassifier, XGBClassifier, and LGBMClassifier (both
      sklearn-API, on the same in-pipeline preprocessing) — on a
      **cost-aware objective**: stratified CV produces out-of-fold
      probabilities per trial, and the trial is scored by the business cost
      (FP=1/FN=5) at its own cost-optimal threshold — the same
      threshold-tuning view used at evaluation. The winner — **logistic
      regression (C=0.6494, l1_ratio=0.4540)**, best CV cost 1,220, family
      means 1,225 (logreg) / 1,367 (lightgbm) / 1,409 (xgboost, balanced
      via scale_pos_weight) / 1,339 (histgb) — is written back to `params.yaml` as the production config.
      An earlier F1-objective run picked HistGB instead; the two objectives
      disagreeing is itself a finding (see results). An isotonic-calibrated
      twin is fitted on the calibration split only.

      **Business implication:** the artifact handed to engineering scores raw
      CRM rows as-is — no ETL rewrite, no train/serve skew — and the winning
      config is recorded in versioned config, not in someone's notebook.
  - id: evaluation
    text_md: |
      Every candidate is scored through the same decision procedure, so
      thresholds and models compare like-for-like on money:

      ```mermaid
      flowchart LR
          A[predict_proba on<br/>1,000-row holdout] --> B[41-point threshold grid]
          B --> C[FP·1 + FN·5<br/>cost per threshold]
          C --> D[cost-optimal threshold]
          D --> E[RunResult<br/>F1, ROC-AUC, ECE, cost]
          E --> F{calibration<br/>helps cost?}
          F -->|yes| G[ship calibrated]
          F -->|no| H[ship raw, keep ECE noted]
      ```

      Holdout rows are never seen by HPO, fitting, or calibration. Metrics
      via `portfolio_eval`: ROC-AUC, macro precision/recall/F1, business cost
      (FP·1 + FN·5) at each run's operating point, and ECE (10 bins) for the
      selected runs. Five runs: naive majority (constant probability = base
      rate), the earlier logistic at 0.5 and at its cost optimum, and the
      selected model raw and isotonic-calibrated at their cost optima.
      Diagnostics add permutation importance (5 repeats, error bars), PR
      curves with the naive base-rate floor, and decision-curve analysis.

      **Business implication:** calibration improved probabilities 20×
      (ECE 0.281 → 0.014) without moving the cost optimum — know which metric
      pays: ECE matters when probabilities themselves are consumed, the cost
      curve is what settles the alarm threshold; and the paired bootstrap CI
      (−157, 95% CI [−236, −86]) is what makes the saving defensible in a
      budget meeting.
    figures: [calibration_curve, precision_recall_curve, decision_curve]
  - id: results
    text_md: |
      Run ladder (holdout, FP=1/FN=5):

      | run | threshold | ROC-AUC | F1 (macro) | ECE | business cost |
      |---|---|---|---|---|---|
      | naive majority | cost-optimal | 0.5000 | 0.2098 | – | 1,035 |
      | logistic, default 0.5 | 0.500 | 0.8292 | 0.7022 | – | 691 |
      | logistic, tuned | 0.300 | 0.8292 | 0.6151 | – | 611 |
      | selected (cost-HPO XGB) | 0.150 | 0.8387 | 0.6512 | 0.028 | 619 |
      | selected + isotonic | 0.175 | 0.8317 | 0.6745 | **0.016** | **601** |

      Key findings:

      - **Cost vs naive: −41.9% (1,035 → 601), bootstrap −416, 95% CI
        [−485, −343] — significant.** The naive accuracy is 0.735: on a 26.5%
        base rate the ignore-all policy looks accurate and burns 1,035.
      - **The winner changes on real data** — XGBoost replaces the synthetic
        track's logistic; the calibrated booster holds the holdout cost
        optimum (601 vs the tuned logistic's 611).
      - **The operating point does not transfer; the procedure does:**
        synthetic t*=0.700 vs telco t*=0.175. Re-deriving the threshold per
        regime is not optional.
      - **Calibration verdict flips:** isotonic improves both ECE
        (0.028 → 0.016) and cost (619 → 601) on the noisier real regime.
      - **Fairness slices** (at t=0.150): recall is uniform across gender
        (0.90 both) and higher for seniors (0.97 vs 0.88). The real gap is
        contractual: month-to-month recall 0.98 vs one-year 0.47, two-year
        0.00 — the optimum is tuned to the dominant short-contract churn and
        misses nearly all 45 long-contract churners in the holdout. A
        business choice at FN=5, stated openly, movable on the cost surface.
      - The naive run posts accuracy 0.735 while losing 1,035 cost units —
        the accuracy trap, inverted.

      **Business implication:** −41.9% cost at a defensible CI, with the
      slice report showing exactly who the operating point misses — that is
      the story a client budget conversation needs.
    figures: [business_cost_curve, permutation_importance, bootstrap_ci]
    metrics_keys: [naive_majority, logreg_threshold_0.300, selected_model, selected_model_calibrated]
  - id: conclusions
    text_md: |
      Pipeline-embedded preprocessing is the deployment contract: capping,
      flags, imputation, and scaling ship inside the artifact, so serving is
      one line of code and cannot drift from training — a data bug either
      passes the DQ gate or stops the pipeline. Three lessons generalize:

      - Threshold choice is a business decision: tuning to the cost curve cut
        cost by a fifth with zero retraining.
      - Optimize what you deploy: cost-aware selection now drives the study,
        and the winner it picked lands at the holdout cost optimum.
      - Calibration is a product decision: trustworthy probabilities and
        cost-optimal decisions are different deliverables — ship both
        evaluations.
      - Uncertainty has a number: paired bootstrap CIs turn "the model saves
        money" into "the model saves 157 cost units, 95% CI [75, 236], at alpha 0.05".

      **Business implication:** the framework transfers to a client's CRM
      extract unchanged — same gates, same artifact contract, same cost
      curve — only the DatasetContract and the FP/FN costs change.
roadmap:
