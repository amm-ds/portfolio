key_concepts:
  - "**Decision cost**: Price false alarms and missed churners separately, then tune the model on the bill rather than accuracy."
  - "**Cost-ratio sensitivity**: The served threshold moves when a missed churner's price moves. The cutoff is a policy choice, not a constant."
  - "**Calibration before serving**: Isotonic fitting is flexible calibration learned on a train-side split so predicted probabilities better match observed churn rates."
  - "**The data-quality gate checklist**: Missing-value, range, and two-outcome target checks must pass before fitting or scoring."
  - "**Same-holdout optimism**: Picking and scoring a threshold on the same reserved test data inflates the saving. Bootstrap resampling repeats customer-row samples to estimate row noise only."
figure_captions:
  eda_churn_profile: Real telco churn by contract, charges, and tenure. Month-to-month churn is 42.7% versus 2.8% for two-year contracts. Synthetic extreme-value and NaN, or not-a-number, fixtures are separate evidence for automated software checks.
  calibration_curve: Raw versus isotonic reliability on the 1,409-row holdout. Reliability compares predicted probabilities with observed rates. Isotonic improves ECE, or expected calibration error, 0.028 → 0.016 and the same-holdout cost optimum 619 → 601.
  precision_recall_curve: Logistic and selected-model precision-recall curves with the 26.5% base-rate floor. Ranked probabilities, not the no-skill policy, lift precision above that floor.
  cost_surface: Isotonic-model cost across thresholds and missed-churner costs, with threshold t=0.175 starred. The cutoff moves with the price assigned to a missed churner. Its reported optimum is selected on this same holdout.
  business_cost_curve: Holdout cost across thresholds for each candidate. The served isotonic model reaches 601 versus 1,035 for the naive contact-everyone optimum. Both thresholds and costs use this holdout.
  permutation_importance: Holdout decrease in F1, the combined precision-recall measure, after shuffling one column. Five repeats include error bars. Contract, tenure, and monthly charges carry the main signal.
  fairness_slices: Raw XGBoost slices at threshold t=0.150, not the served isotonic policy. The raw model misses 19 of 36 one-year and all 9 two-year churners. Gender recall is nearly uniform.
  bootstrap_ci: Two thousand paired holdout resamples at fixed thresholds. The cost-delta 95% confidence interval [−485, −343] excludes zero. It does not include threshold-selection variance.
