project_id: 05-ml-pipeline-churn
sections:
  - id: background
    text_md: |
      **Result.** Cost-aware threshold tuning cuts holdout decision cost 41.9%
      (1,035 → 601) versus the naive contact-everyone comparator; the paired
      bootstrap delta is −416 (95% CI [−485, −343]).

      **Data.** Real IBM telco churn data (7,043 customers, IBM sample-data
      license) behind a sha256-pinned DatasetContract; a labeled 8.8%-churn
      synthetic twin supports offline CI.

      **Limits.** Operating thresholds are selected and scored on the same
      1,409-row holdout, so cost and slice results are optimistically biased;
      the snapshot has no time axis, and fairness covers only contract,
      gender and senior-citizen slices.

      Turn churn scores into a retention-contact policy under asymmetric costs:
      a false alarm costs 1 voucher and a missed churner costs 5. Accuracy is
      the wrong target when a silent policy scores 0.735 by never contacting
      anyone; the deliverable is an auditable threshold and its measured cost.

      | cost parameter | value | meaning |
      |---|---|---|
      | FP cost | 1 | one retention voucher / false alarm |
      | FN cost | 5 | one lost customer |
      | holdout churn rate | 26.5% | 374 of 1,409 customers |
      | threshold grid | 41 points (0.00–1.00) | cost-optimum search |

      **Business summary:** on the committed 1,409-customer holdout, serving
      the calibrated model at t=0.175 contacts fewer customers than the naive
      blast and still cuts decision cost by 41.9% — a budget line a retention
      team can act on, with the sampling uncertainty (95% CI [−485, −343])
      attached to the saving.
  - id: objectives
    text_md: |
      - Embed preprocessing in a fitted sklearn Pipeline that accepts raw CRM rows.
      - Compare every run on one holdout and cost model, including a naive
        constant-probability baseline whose cost optimum is contact everyone.
      - Select among logistic and boosting models with seeded Optuna on CV
        business cost, with per-trial threshold tuning.
      - Report calibration, paired-bootstrap uncertainty, data-quality gates
        and fairness slices alongside the operating threshold.
  - id: data
    text_md: |
      The primary track is the real IBM telco panel: 7,043 customers × 21
      columns at 26.5% churn, loaded from the canonical GitHub mirror with a
      pinned sha256 and [dataset contract](https://amm-ds.github.io/portfolio/data-registry/telco-churn/).
      The HF id cited in planning does not exist; the raw IBM mirror is the
      implemented source.

      | project column | telco source | role |
      |---|---|---|
      | tenure_months | tenure | numeric feature |
      | monthly_charges | MonthlyCharges | numeric feature |
      | contract | Contract | categorical feature + fairness slice |
      | internet_service | InternetService | categorical feature |
      | gender / senior_citizen | gender / SeniorCitizen | fairness slices |
      | churned | Churn | target |

      A stratified 80/20 split yields 5,634 train / 1,409 holdout rows; 20% of
      train is reserved for calibration. The separate synthetic CI generator
      (8.8% churn, 2% NaN age, 3% NaN support_calls, one 9,999 charge outlier)
      never substitutes for the real-data results.
  - id: eda
    text_md: |
      **Real telco EDA:** churn concentrates in short contracts and among
      seniors and fiber customers; churners have higher charges and shorter tenure.

      | segment | rows | churn rate |
      |---|---|---|
      | month-to-month | 3,875 | 42.7% |
      | one-year | 1,473 | 11.3% |
      | two-year | 1,695 | 2.8% |
      | senior citizens | 1,142 | 41.7% |
      | fiber-optic internet | 3,096 | 41.9% |

      Mean monthly charges are ~74 for churners versus ~61 otherwise; mean
      tenure is ~18 versus ~38 months. The outlier-charge and NaN examples are
      **synthetic CI fixtures**, not features of this real EDA; their purpose is
      to exercise the same DQ and preprocessing contract offline.
    figures: [eda_churn_profile]
  - id: training
    text_md: |
      One fitted Pipeline owns outlier capping, missingness flags, imputation,
      scaling and one-hot encoding, so training and serving share preprocessing.

      ```mermaid
      flowchart LR
          A[raw CRM row] --> B[OutlierCapper]
          B --> C[MissingValueIndicator]
          C --> D[impute + scale]
          E[contract] --> F[one-hot encode]
          D --> G[ColumnTransformer]
          F --> G
          G --> H[classifier]
          H --> I[predict_proba]
      ```

      An earlier grid search retains the logistic baseline. Seeded Optuna
      (25 trials, median pruning) searches LogisticRegression,
      HistGradientBoosting, XGBoost and LightGBM on out-of-fold business cost at
      each trial's own threshold. XGBoost wins telco (n_estimators 211,
      learning_rate 0.0309, max_depth 3, subsample 0.5187; CV cost 2,416);
      logistic wins the synthetic track (CV cost 1,220). An earlier F1 objective
      picked HistGB, demonstrating that the objective changes the winner. The
      isotonic twin uses only the train-side calibration split.
  - id: evaluation
    text_md: |
      Each candidate is scored with ROC-AUC, macro metrics, business cost and,
      for selected models, ECE. The constant base-rate `naive_majority` run has
      only two decision regimes; at FN=5 its cheaper choice is **contact
      everyone**, not do nothing.

      ```mermaid
      flowchart LR
          A[predict_proba on holdout] --> B[41-point threshold grid]
          B --> C[cost at threshold]
          C --> D[cost-optimal threshold]
          D --> E[raw vs isotonic comparison]
      ```

      The holdout is excluded from fitting, HPO and calibration, **but it is
      used both to choose each displayed threshold and to report its cost**.
      These are same-holdout optima, not an independent assessment of a frozen
      policy. The paired bootstrap resamples rows at fixed thresholds; its CI
      captures cost sampling variation, not threshold-selection instability.

      Diagnostics include PR curves with the base-rate floor, calibration,
      permutation importance (5 repeats), the threshold × FN-cost surface and
      raw-model fairness slices.
    figures: [calibration_curve, precision_recall_curve, cost_surface]
  - id: results
    text_md: |
      **▶ Try [the churn threshold sandbox](https://amm-ds.github.io/portfolio/demos/churn-sandbox)
      on the committed holdout payload.**

      All real-data DQ gates pass before training: null rates are 0.000 for
      tenure and charges; tenure is within [0, 72], charges within
      [18.25, 118.75], and churn is binary.

      | run | threshold | ROC-AUC | F1 (macro) | ECE | business cost |
      |---|---|---|---|---|---|
      | naive base rate (contact-everyone optimum) | 0.000 | 0.5000 | 0.2098 | – | 1,035 |
      | logistic, default | 0.500 | 0.8292 | 0.7022 | – | 691 |
      | logistic, tuned | 0.300 | 0.8292 | 0.6151 | – | 611 |
      | selected raw XGB | 0.150 | 0.8387 | 0.6512 | 0.028 | 619 |
      | selected + isotonic ← served | 0.175 | 0.8317 | 0.6745 | **0.016** | **601** |

      - **Cost:** 1,035 → 601 (−41.9%) versus contact everyone; paired
        bootstrap delta −416, 95% CI [−485, −343], significant at 95%.
      - **Model and calibration:** XGBoost replaces the synthetic winner;
        isotonic improves ECE 0.028 → 0.016 and same-holdout cost 619 → 601.
      - **Regime dependence:** synthetic t*=0.700 versus telco t*=0.175; the
        procedure transfers, not the cutoff.
      - **Cost-model sensitivity** (`reports/sensitivity.json`, re-scored via
        `cli sensitivity`): served-isotonic cost and threshold move with the
        FN price — 510 at t=0.200 (FN=3), 601 at t=0.175 (FN=5), 699 at
        t=0.100 (FN=8) — and every variant's paired-bootstrap CI excludes
        zero. The naive comparator stays 1,035 throughout (contact-everyone
        has no missed churners), so the absolute saving shrinks as FN rises.
        Calibration's cost edge is itself cost-model dependent: isotonic helps
        at FN=5 (619 → 601) but slightly hurts at FN=8 (691 → 699).
      - **Raw-model fairness, not served-policy fairness:** at raw XGB t=0.150,
        gender recall is 0.902 female / 0.906 male and senior recall is 0.969
        versus 0.880 non-senior. Contract recall is 0.976 month-to-month,
        0.472 one-year and 0.000 two-year: the raw policy misses **19 of 36**
        one-year churners and **all 9** two-year churners. The figure uses the
        raw model; the served artifact is isotonic-calibrated at t=0.175, so
        these counts must not be attributed to serving.
      - **Drivers:** permutation importance ranks contract, tenure and charges
        as the main signal. The naive row's accuracy is 0.265 at contact-all;
        contact-none would score 0.735 accuracy but is a different policy.

      **Business summary:** the served policy is contact at t=0.175 on the
      calibrated model — 601 versus 1,035 for the naive blast (−41.9%), CI
      [−485, −343]. The threshold must be re-derived when the FN:FP price
      ratio changes (0.200 at FN=3, 0.100 at FN=8): the procedure and its
      savings are stable, the cutoff is not a constant.
    figures: [calibration_curve, business_cost_curve, permutation_importance, fairness_slices]
    metrics_keys: [naive_majority, logreg_threshold_0.300, selected_model, selected_model_calibrated]
  - id: conclusions
    text_md: |
      Pipeline-embedded preprocessing and DQ gates make the artifact deployable
      on raw rows. Cost-aware selection, calibration and thresholding each have
      measured effects, and the bootstrap quantifies cost uncertainty at fixed
      thresholds. The raw-model slices expose a severe long-contract recall
      trade-off, while same-holdout threshold selection means the 601 cost and
      served operating point still need evaluation on fresh data. The
      FN-cost sensitivity run bounds the threshold's stability: the operating
      point moves monotonically with the missed-churner price, so the served
      cutoff must be re-derived (not copied) when the cost model changes.

      **Business summary:** deployable as-is on raw CRM rows with the DQ gates
      as the contract; expected value is a ~42% decision-cost cut at FN=5,
      stable in sign across FN=3–8, with re-derivation of the cutoff on any
      price change and an explicit watch item: two-year-contract churners are
      missed by the raw policy, so served-policy fairness on fresh data is the
      gate before rollout.
    figures: [bootstrap_ci]
roadmap:
  - status: delivered
    text: Real telco pipeline — DQ gates, cost-aware HPO, calibration and serving at t=0.175.
  - status: delivered
    text: Evidence pack — fixed-threshold bootstrap CI, cost surface and raw-model fairness slices.
  - status: delivered
    text: FN-cost sensitivity re-run — t*=0.200/0.175/0.100 at FN=3/5/8, every CI excludes zero; queued-DVC path re-validated.
  - status: remaining
    text: Freeze the threshold before evaluation and validate cost and fairness on fresh data.
  - status: deferred
    text: Drift and seasonality claims — the source snapshot has no time axis.
figure_captions:
  eda_churn_profile: Real telco churn by contract, charges and tenure. Month-to-month churn is 42.7% versus 2.8% for two-year contracts; synthetic outlier/NaN fixtures are separate CI evidence.
  calibration_curve: Raw versus isotonic reliability on the 1,409-row holdout. Isotonic improves ECE 0.028 → 0.016 and the same-holdout cost optimum 619 → 601.
  precision_recall_curve: Logistic and selected-model PR curves with the 26.5% base-rate floor. Ranked probabilities, not the no-skill policy, lift precision above that floor.
  cost_surface: Isotonic-model cost across threshold and FN cost, with t=0.175 starred. The cutoff moves with the price assigned to a missed churner; its reported optimum is selected on this same holdout.
  business_cost_curve: Holdout cost across thresholds for each candidate. The served isotonic model reaches 601 versus 1,035 for the naive contact-everyone optimum; both thresholds and costs use this holdout.
  permutation_importance: Holdout F1 decrease after permutation, five repeats with error bars. Contract, tenure and monthly charges carry the main signal.
  fairness_slices: Raw XGB slices at t=0.150, not the served isotonic policy. The raw model misses 19 of 36 one-year and all 9 two-year churners; gender recall is nearly uniform.
  bootstrap_ci: Two thousand paired holdout resamples at fixed thresholds. The cost-delta 95% CI [−485, −343] excludes zero; it does not include threshold-selection variance.
