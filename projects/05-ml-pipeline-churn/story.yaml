key_concepts:
- '**Decision cost**: Price false alarms and missed churners separately, then tune the model on the bill rather than accuracy.'
- '**Cost-ratio sensitivity**: The served threshold moves when a missed churner''s price moves. The cutoff is a policy choice,
  not a constant.'
- '**Calibration before serving**: Isotonic fitting is flexible calibration learned on a train-side split so predicted probabilities
  better match observed churn rates.'
- '**The data-quality gate checklist**: Missing-value, range, and two-outcome target checks must pass before fitting or scoring.'
- '**Frozen-policy evaluation**: Select thresholds from training-side OOF predictions, persist them, and only then score the
  reserved holdout. Bootstrap resampling estimates row noise at those fixed policies.'
figure_captions:
  eda_churn_profile: Real telco churn by contract, charges, and tenure. Month-to-month churn is 42.7% versus 2.8% for two-year
    contracts. Synthetic extreme-value and NaN, or not-a-number, fixtures are separate evidence for automated software checks.
  calibration_curve: Raw versus isotonic reliability on the 1,409-row holdout. Reliability compares predicted probabilities
    with observed rates. Isotonic improves ECE, or expected calibration error, 0.028 → 0.016; the separately frozen policies
    cost 644 → 601.
  precision_recall_curve: Logistic and selected-model precision-recall curves with the 26.5% base-rate floor. Ranked probabilities,
    not the no-skill policy, lift precision above that floor.
  business_cost_curve: Holdout cost across thresholds for each candidate. Stars mark training-side OOF-frozen policies, not
    holdout optima. The served isotonic policy costs 601 versus 1,035 for fixed contact-everyone.
  permutation_importance: Holdout decrease in F1, the combined precision-recall measure, after shuffling one column. Five
    repeats include error bars. Tenure (0.213), contract (0.174), internet service (0.088), and monthly charges (0.033) rank in that order.
  fairness_slices: Raw XGBoost slices at OOF-frozen threshold t=0.225, not the served isotonic policy. The raw model misses
    27 of 36 one-year and all 9 two-year churners. Gender recall is nearly uniform.
  bootstrap_ci: Two thousand paired holdout resamples of the exact calibrated policy minus fixed contact-everyone. The cost-delta
    95% confidence interval [−508, −353] excludes zero. It does not include model or threshold-selection variance.
