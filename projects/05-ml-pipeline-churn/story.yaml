    text: >-
      Cost-aware HPO — shipped, verified: Optuna study on CV business cost with
      per-trial threshold tuning changed the winner; the cost-HPO model holds the
      holdout cost optimum (283 cost units at threshold 0.700; four arms raced).
  - status: delivered
    text: >-
      CRM client onboarding — shipped, verified: `prepare --input client.csv`
      ingests a client extract through the same DQ gates and DatasetContract
      as the synthetic data.
  - status: delivered
    text: >-
      Bootstrap CIs — shipped, verified: paired 2,000-resample CI on the cost
      delta vs naive is −416 [−485, −343] on telco (was −157 [−236, −86] on the
      synthetic CI track), significant at 95 %.
  - status: delivered
    text: >-
      Calibration verdict — shipped, verified on BOTH tracks: on synthetic the
      cost optimum was unchanged by isotonic (322 vs 283); on telco calibration
      improves both ECE (0.028 → 0.016) and cost (619 → 601) - the verdict is
      per-regime, not universal.
  - status: delivered
    text: >-
      Gradient-boosted arms — shipped, verified across both tracks: on synthetic
      the logistic won (best trial CV cost 1,220); on telco XGBoost won (2,416)
      and holds the holdout optimum after isotonic calibration - the winner
      tracks the data.
  - status: delivered
    text: >-
      Real-data telco track — shipped, verified: IBM telco churn (7,043 rows,
      sha256-pinned) is the default data_source behind the same DQ gates and
      DatasetContract; fairness slice report and cost-surface figure added;
      −41.9% cost vs naive at a significant CI.
  - status: remaining
    text: >-
      Client-engagement onboarding — the path exists (`prepare --input`), but a
