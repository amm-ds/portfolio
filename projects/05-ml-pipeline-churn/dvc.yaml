stages:
  prepare:
    cmd: uv run --python 3.12.9 python -m churn_pipeline.cli prepare --params-file params.yaml
    deps:
      - src/churn_pipeline/
      - params.yaml
    params:
      - n_samples
      - seed
      - data_source
      - test_frac
      - c_grid
      - cv_folds
      - calibration_bins
      - cap_quantile_low
      - cap_quantile_high
    outs:
      - data/churn.parquet
      - data/dataset_contract.json
      - reports/dq_report.md

  train:
    cmd: uv run --python 3.12.9 python -m churn_pipeline.cli train --params-file params.yaml
    deps:
      - src/churn_pipeline/
      - params.yaml
      - data/churn.parquet
    params:
      - seed
      - data_source
      - test_frac
      - c_grid
      - cv_folds
      - model_family
      - model_params
      - hpo_trials
      - hpo_objective
      - calib_frac
      - fp_cost
      - fn_cost
    outs:
      - data/model.pkl
      - data/selected_model.pkl
      - data/selected_model_calibrated.pkl
      - data/model_selection.json
      - data/model_meta.json
      - data/holdout.parquet

  evaluate:
    cmd: uv run --python 3.12.9 python -m churn_pipeline.cli evaluate --params-file params.yaml
    deps:
      - src/churn_pipeline/
      - params.yaml
      - data/model.pkl
      - data/selected_model.pkl
      - data/selected_model_calibrated.pkl
      - data/model_meta.json
      - data/holdout.parquet
    params:
      - seed
      - data_source
      - test_frac
      - threshold_grid
      - fp_cost
      - fn_cost
      - calibration_bins
    outs:
      - reports/report.html

    metrics:
      - reports/metrics.json