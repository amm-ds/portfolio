id: churn-sandbox
title: churn threshold sandbox
hook: Move the alarm threshold and the missed-churner cost — watch the optimal cutoff and the saved budget change on a real churn model.
project: 05-ml-pipeline-churn
group: retain customers
skills: [classification economics, calibration, decision science]
modes: [browser, live]
hero:
  label: decision cost per 1,400 customers
  value: "$601 vs $1,035 naive"
  ci: paired bootstrap CI [−485, −343]
scenarios:
  - name: base
    controls: {fn_ratio: 5, threshold: 0.15}
  - name: high-cost-miss
    controls: {fn_ratio: 9, threshold: 0.12}
  - name: default-threshold
    controls: {fn_ratio: 5, threshold: 0.5}
live_endpoints:
  - method: POST
    path: /projects/05-ml-pipeline-churn/score
    label: live customer scoring
    cost: free-local
payload:
  path: reports/demo_payload.json
  schema_version: 1
  required_keys:
    - demo
    - project
    - holdout_n
    - model
    - cost_model
    - headline
    - thresholds
    - overall
    - slices
    - calibration
    - customers
    - feature_domains
    - roc_auc
