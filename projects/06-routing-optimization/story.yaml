project_id: 06-routing-optimization
sections:
- id: background
  text_md: |
    Last-mile and field-service routing is one of the few places where a few
    percent of travel distance converts directly into fuel, driver hours and
    CO₂ — every day, on every route. The vehicle routing problem with time
    windows (VRPTW) is its canonical form: a fleet leaves a depot, serves
    every customer exactly once inside a promised time window, respects
    vehicle capacity, and returns. At 100 customers the search space is
    already beyond enumeration, so quality has to be measured against
    published best-known values, not hope. This project answers with an
    auditable, seeded solver ladder that lands within 4.23 % of those
    published optima on every family — and states exactly what the remaining
    gap costs.

    - **Cost levers** — fuel and vehicle-hours per route, daily and
      fleet-wide; overtime and missed-window penalties; fleet size, where
      better consolidation defers vehicle purchases; CO₂ reporting,
      increasingly a compliance line item.
    - **The two client questions** — *how good is a quick, transparent
      heuristic, and what would a heavier optimizer buy us?*
    - **One pipeline, both answers** — a seeded, deterministic solver
      ladder and a metaheuristic share one `RoutePlan` contract, each
      carrying a stated, verifiable gap to published optima (design in
      `DESIGN.md`).

    **Business implication:** last-mile routing is a direct cost lever —
    every percent of distance is fuel, vehicle hours and CO₂, so even
    single-digit routing improvements compound into a material annual
    saving.
  figures: []
  metrics_keys: []
- id: objectives
  text_md: |
    Success is a verifiable quality number, not a route plan that merely
    looks reasonable. Every solver must be feasible, fast, transparent and
    measured against literature values on the full benchmark:

    | criterion | target | how it is verified |
    |---|---|---|
    | feasibility | every customer served exactly once, capacity + time windows respected | `RoutePlan` validator + per-route time simulation |
    | quality | dual gap vs published best-known: distance % **and** vehicle Δ | registry table + SINTEF TOP-derived supplement |
    | transparency | seeded, deterministic, auditable solvers | fixed seed, stdlib-only search, no hidden state |
    | speed | full 56-instance benchmark incl. both HPO searches in ~90 s | per-solver wall time |
    | legibility | a feasible randomized floor in every chart | construction/metaheuristic deltas stay readable |

    Two reporting rules hold throughout: the dual criteria are always
    reported together — the benchmark ranks vehicles first, distance second —
    and every tuning loop reports what it actually found, including negative
    results.

    **Business implication:** the deliverable is a stated optimality gap that
    procurement can hold any future optimizer — ours or a vendor's —
    accountable to.
  figures: []
  metrics_keys: [randomized, clarke_wright, two_opt, two_opt_tuned, alns, ortools_cp]
- id: data
  text_md: |
    The benchmark is the complete Solomon VRPTW 100-customer set (CVRPLIB),
    the reference this literature has used since 1987. All 56 instances run,
    spanning six families — clustered tight-window (C1), clustered
    long-horizon (C2), random tight (R1), random long-horizon (R2) and mixed
    RC1/RC2 — each pinning 100 customers' coordinates, demand, time window
    and service time.

    - **[CVRPLIB Solomon VRPTW benchmark](https://amm-ds.github.io/portfolio/data-registry/cvrplib-solomon/)**
      — academic benchmark, free to use with citation; sha256-pinned
      archive from the SINTEF TOP mirror (snapshot card in
      `data/raw/dataset_card.json`).
    - **Reference values** — the curated registry best-known table plus a
      project-local `best_known_supplement.csv` covering the 42 instances
      the registry table omits, sourced from the published SINTEF TOP table.
    - **DQ gates** — null rates and ranges vs fleet capacity halt the
      pipeline loudly on any anomaly.

    **Business implication:** a public, citation-backed benchmark means
    every quality claim can be re-checked by the client's own team against
    literature values — no trust-us slide required.
  figures: []
  metrics_keys: []
- id: eda
  text_md: |
    Geography only tells half the story. On C101 (`eda_instance_map`) the
    customers form tight spatial clusters, but the color scale shows how
    narrow their time windows are (width = due − ready). Narrow windows
    constrain the *order* in which nearby customers may be visited — which
    is why C101 is easy to serve with few vehicles yet hard to keep short:
    the routing is dictated by the clock more than by the map. The depot
    (star) sits inside the cluster, and the tightest windows are scattered
    across it, so no simple geographic sweep can respect them.

    The pattern differs per family: R1/RC1 pair geography with window
    tightness, while C2's wide horizons leave scheduling room but reward
    extreme consolidation. Different families bind on different
    constraints — the reason a solver must be checked per family, not just
    on averages (see the family-gap figure in the results).

    **Business implication:** "draw neat geographic territories"
    underperforms because the binding constraint is the delivery-promise
    window — any tooling must optimize the clock and the map together.
  figures: [eda_instance_map]
  metrics_keys: []
- id: training
  text_md: |
    There is no model fitting — "training" is construction, improvement,
    metaheuristics, tuning. Pydantic models (`Customer`,
    `Problem`, `RoutePlan`, tuning contracts) keep every solver on one
    contract. The seeded ladder, Euclidean distances:

    - **randomized** — seed-shuffled packing into capacity/time-window
      feasible routes; the flat floor answering "what would blind
      feasibility cost?"
    - **nearest_neighbor** — greedy nearest-feasible insertion.
    - **clarke_wright** — savings merges gated on capacity and full-route
      time-window feasibility.
    - **two_opt** — 2-opt reversals + 2-opt* tail exchanges on the better
      construction plan, feasibility-preserving moves only.
    - **alns** — Ropke–Pisinger adaptive large-neighborhood search:
      random / worst / Shaw removal, regret-2 repair, segment-adapted
      operator weights, SA acceptance; starts from the tuned 2-opt plan.
    - **ortools_cp** — ALNS-hinted CP-SAT cross-check: the ALNS plan is
      injected as the hint under a 10 s/instance budget; an
      incumbent-improvement probe, **not an independent baseline**. If the
      budget expires first the incumbent is returned unchanged, so the arm
      never degrades a plan.

    ```mermaid
    flowchart LR
        A[randomized feasible floor] --> B[nearest_neighbor]
        B --> C[clarke_wright savings]
        C --> D[two_opt improvement]
        D --> E[two_opt_tuned via seeded HPO]
        E --> F[alns destroy + repair]
        F --> G[ortools_cp hinted cross-check]
        G --> H[validated route plan]
    ```

    Two seeded random searches tune the stages — 24 trials over the 2-opt
    knobs (all 56 instances) and 12 over the ALNS knobs (6-instance
    subset); winners persist to `params.yaml`.

    **Business implication:** HPO paid for itself in evidence, not just
    config — it proved randomized restarts don't pay (k=1 chosen) before a
    single ALNS iteration ran: measurement beats intuition.
  figures: []
  metrics_keys: [randomized, clarke_wright, two_opt, two_opt_tuned, alns, ortools_cp]
- id: evaluation
  text_md: |
    Every candidate passes the same improvement-and-audit loop before it
    reaches any table or figure:

    ```mermaid
    flowchart LR
        S[solver output] --> V[hard validator: once-only, capacity]
        V --> T[time-window simulation]
        T -->|infeasible| X[pipeline halts loudly]
        T -->|feasible| G[dual gap: distance % + vehicle Δ vs best-known]
        G --> R[metrics.json, figures, reports/report.html]
    ```

    All seven solvers run on all 56 instances against the published
    best-known values (registry table + SINTEF TOP supplement), reported
    per instance and per family. The figure set tells the story at a
    glance: `solver_profile` shows the full ladder per instance,
    `route_map_C101` shows the best C101 plan, `alns_convergence_C101`
    shows the winning metaheuristic's descent, and `pareto_gap_runtime`
    places every solver on the runtime-vs-gap plane. Runtimes are
    load-sensitive (shared machine), so the seeded, deterministic
    distances and gaps are the verdict and times are context. Full
    per-solver runtime tables in `reports/results.md`.

    **Business implication:** evaluation is cheap and fully reproducible,
    so it can run in CI on every change — optimization quality becomes a
    guarded regression metric, not a one-off report.
  figures: [route_map_C101, solver_profile, alns_convergence_C101, pareto_gap_runtime]
  metrics_keys: [randomized, clarke_wright, two_opt, two_opt_tuned, alns, ortools_cp]
- id: results
  text_md: |
    Real run, seed 42, all 56 instances — **both criteria reported**:
    distance gap % and vehicle delta (veh Δ) vs published best-known.

    | solver | mean gap | mean veh Δ | mean runtime |
    |---|---|---|---|
    | randomized (floor) | 316.95 % | +11.09 | <10 ms |
    | nearest_neighbor | 71.64 % | +6.75 | <10 ms |
    | clarke_wright | 18.31 % | +5.79 | <10 ms |
    | two_opt_tuned (HPO) | 13.63 % | +5.79 | <10 ms |
    | **alns (HPO-tuned)** | **4.23 %** | **+3.73** | 0.8–2.8 s |
    | ortools_cp (hinted cross-check, 10 s) | 4.23 % | +3.73 | 13.6 s |

    `gap_pct` shows the per-instance spread (runtimes load-inflated, gaps
    seeded and deterministic):

    - **ALNS wins 56/56 on distance** (13.63 % → **4.23 %**); destroy +
      regret-2 repair makes the cross-route moves 2-opt cannot. Per family
      (`family_gap`; two_opt_tuned: 13–22 % / +2.5–7.6): C1 4.48/+1.00, C2
      6.50/+1.00, R1 4.10/+3.42, R2 3.04/+6.73, RC1 4.75/+2.88, RC2
      3.00/+6.75.
    - **Vehicles-first ranking: ALNS wins 43/56 intra-ladder** — naive
      solvers take the rest with fewer vehicles at far worse distance, and
      no solver beats best-known on vehicles (+3.73 mean, +6–8 on R2/RC2
      where hierarchical optima run 2–4); distance-only comparisons
      flatter.
    - **Negative distance gaps are real**: ALNS undercuts the references on
      8 instances (best RC202 −3.85 %). Residuals: C2 6.50 %, C203
      19.48 %, C103 11.67 %.
    - **HPO negatives stand**: tuning 2-opt bought only 13.75 % → 13.63 %;
      randomized restarts never pay (k=1 chosen), budgets saturate at
      ≤~20 accepted moves.
    - **Hinted CP-SAT verdict**: 10 s/instance with the ALNS plan as hint →
      `UNKNOWN` on all 56, incumbent returned unchanged (ties 56/56 at ~5×
      runtime). Its real win is small-scale certification: 25-customer C101
      prefix certified optimal at 191.8 in 2.9 s (2-opt hint: 286.3);
      5-customer instance proved optimal in 0.1 s (runtime-vs-gap
      placement in the evaluation figure).

    **Business implication:** a 4.23 % mean distance gap (with the
    +3.73-vehicle caveat) against 1987-published optima on every family, in
    auditable seeded code — the number procurement can anchor to; ~0.8 s
    best case per instance keeps the harness usable daily.
  figures: [gap_pct, family_gap]
  metrics_keys: [randomized, clarke_wright, two_opt, two_opt_tuned, alns, ortools_cp]
- id: conclusions
  text_md: |
    The ladder told the story in three acts: feasibility is cheap
    (randomized floor, 317 %), constraint-aware construction is the first
    big lever (savings, 18.3 %), local polish helps a little (2-opt+HPO,
    13.6 %), and the metaheuristic closes the rest — ALNS at **4.23 %**
    mean gap over all 56 instances, single digits on every family. The
    hinted CP-SAT cross-check closed the loop: ~5× the runtime bought
    nothing at 100-customer scale, but certifies small subproblems
    optimal in seconds.

    **Results quality: strong, with one stated caveat.** The gap is
    seeded and re-runnable in CI; the caveat is +3.73 vehicles — a
    practitioner contracts on the distance number, not on fleet-size
    parity.

    Lessons that transfer:

    - **Validate feasibility in code** — a `RoutePlan` either passes the
      validator or the pipeline halts.
    - **Benchmark against published optima on both criteria** —
      vehicles-first ranking means single-number gap claims hide the
      vehicle story.
    - **Demand negative results from tuning loops** — recording that
      restarts don't pay is worth more than a prettier config.
    - **Cross-check, and label the probe** — a hinted probe is not an
      independent comparison; labelling it makes the other numbers
      credible.

    The remaining ~4 % lives in C2's wide-horizon optima and a few tight
    chains (C203, C103) — destroy size and operator pool are the next
    levers.

    **Business implication:** the same harness a client would deploy daily
    runs the whole benchmark in minutes with a literature-anchored quality
    number — solver selection under a runtime budget stops being a leap of
    faith.
  figures: []
  metrics_keys: [randomized, clarke_wright, two_opt, two_opt_tuned, alns, ortools_cp]
roadmap:
- status: delivered
  text: >-
    ALNS solver behind the `RoutePlan` contract — shipped, verified: destroy
    (random/worst/Shaw) + regret-2 repair, segment-adapted weights, SA
    acceptance; 4.23 % mean distance gap over all 56 instances, dual
    criteria reported, HPO-tuned (winners persisted to `params.yaml`).
- status: delivered
  text: >-
    Full 56-instance Solomon benchmark with per-family dual-criteria
    reporting — shipped: distance gap AND vehicle delta vs best-known
    (C1 4.48 %, C2 6.50 %, R1 4.10 %, R2 3.04 %, RC1 4.75 %, RC2 3.00 %);
    vehicles-first ranking: ALNS wins 43/56 intra-ladder.
- status: delivered
  text: >-
    Hierarchical-objective reporting per the SINTEF convention (vehicles
    first, distance second) — landed; the dual-gap audit quantified the
    stakes: ALNS averages +3.73 vehicles over best-known, up to +6-8 on
    R2/RC2 where hierarchical optima run 2-4 vehicles.
- status: delivered
  text: >-
    CP-SAT hinted cross-check arm (`ortools_cp`) — shipped: 10 s/instance
    budget with the ALNS plan injected as the hint; an incumbent-improvement
    probe, not an independent baseline. Ties ALNS 56/56 at ~5x runtime;
    certifies the 25-customer C101 prefix optimal (191.8) in 2.9 s.
- status: deferred
  text: >-
    Engagement-dependent extensions — one note covers all three: an
    unhinted independent-solver comparison (PyVRP or OR-Tools at an equal
    budget), Gehring-Homberger 200-1000-customer scale-out, and a
    solver-as-a-service endpoint. The `RoutePlan` contract and benchmark
    are ready.
