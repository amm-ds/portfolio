project_id: 06-routing-optimization
sections:
- id: background
  text_md: |
    Last-mile and field-service routing is one of the few places where a few
    percent of travel distance translates directly into fuel, driver hours and
    CO₂ — every day, on every route. The vehicle routing problem with time
    windows (VRPTW) is its canonical form: a fleet leaves a depot, must serve
    every customer inside a promised time window, respects vehicle capacity,
    and comes home. It is also one of the hardest combinatorial problems in
    practice — 100 customers already have more candidate solutions than any
    computer can enumerate.

    Cost levers a routing solution moves:

    - fuel and vehicle-hours per route, daily and fleet-wide
    - overtime and missed delivery-window penalties
    - fleet size — better consolidation defers vehicle purchases
    - CO₂ reporting, increasingly a compliance line item

    Clients usually ask two questions: *how good is a quick, transparent
    heuristic, and what would a heavier optimizer buy us?* This project answers
    both with one pipeline: the same code runs a transparent heuristic ladder
    and a metaheuristic, each with a stated, verifiable gap to published
    optima.

    **Business implication:** last-mile routing is a direct cost lever — every
    percent of distance is fuel, vehicle hours and CO₂, so even single-digit
    routing improvements compound into a material annual saving.
  figures: []
  metrics_keys: []
- id: objectives
  text_md: |
    Serve all customers exactly once, within capacity and every time window,
    while minimizing total distance — and prove it. Success criteria:

    | criterion | target | how it is verified |
    |---|---|---|
    | feasibility | every customer served exactly once, capacity and time windows respected | `RoutePlan` validator + per-route time simulation |
    | quality | optimality gap vs published best-known values | registry table + SINTEF-derived supplement |
    | transparency | seeded, deterministic, auditable solvers | fixed seed, stdlib-only search, no hidden state |
    | speed | full 56-instance benchmark including both HPO searches in ~90 s | per-solver wall time |
    | legibility | a feasible randomized floor in every chart | makes construction/metaheuristic deltas readable |

    Quality is measured against the full Solomon benchmark, not our own
    yesterday's run — and every tuning loop must report what it actually
    found, including negative results.

    **Business implication:** the deliverable is not a route plan, it is a
    *verifiable quality number* — a stated optimality gap that procurement can
    hold any future optimizer (ours or a vendor's) accountable to.
  figures: []
  metrics_keys: [randomized, clarke_wright, two_opt, two_opt_tuned, alns, ortools_cp]
- id: data
  text_md: |
    Real benchmark data: the complete Solomon VRPTW 100-customer benchmark
    (CVRPLIB), the standard reference this literature has used since 1987.
    All 56 instances run, spanning the six families — clustered tight-window
    (C1), clustered long-horizon (C2), random tight (R1), random long-horizon
    (R2) and the mixed RC1/RC2 — each with 100 customers whose coordinates,
    demand, time window and service time are pinned by the instance file.

    **Datasets:**

    - [CVRPLIB Solomon VRPTW benchmark](https://amm-ds.github.io/portfolio/data-registry/cvrplib-solomon/)
      — academic benchmark, free to use with citation; downloaded from the
      SINTEF TOP mirror as one sha256-pinned archive (snapshot card in
      `data/raw/dataset_card.json`). 56 classic 100-customer instances;
      best-known reference values from the curated registry table plus a
      project-local supplement (`best_known_supplement.csv`) covering the 42
      instances the registry table omits, sourced from the published SINTEF
      TOP table.

    Data-quality gates (null rates, ranges vs fleet capacity) halt the
    pipeline loudly on any anomaly.

    **Business implication:** using a public, citation-backed benchmark means
    every quality claim in this case study can be re-checked by the client's
    own team against literature values — no trust-us slide required.
  figures: []
  metrics_keys: []
- id: eda
  text_md: |
    Geography only tells half the story. On C101 the customers form tight
    spatial clusters — but the color scale below shows how narrow their time
    windows are (width = due − ready). Narrow windows constrain the *order* in
    which nearby customers may be visited, which is why this instance is easy
    to serve with few vehicles yet hard to keep short: the routing is dictated
    by the clock more than by the map.

    The depot (star) sits inside the cluster, and the tightest windows are
    scattered across it — no simple geographic sweep can respect them.

    **Business implication:** this is why "draw neat geographic territories"
    underperforms in practice — the binding constraint is the delivery
    promise window, so any tooling must optimize the clock and the map
    together.
  figures: [eda_instance_map]
  metrics_keys: []
- id: training
  text_md: |
    There is no model fitting here — "training" is construction, improvement,
    metaheuristics, and tuning each stage. The problem is specified as pydantic
    models (`Customer`, `Problem`, `RoutePlan`, `TwoOptTuning`, `AlnsTuning`)
    so every solver speaks the same contract. Five deterministic, seeded
    solvers, Euclidean distances:

    - **randomized** — shuffle customers with the run seed, pack them in that
      order into capacity/time-window-feasible routes, repair any route whose
      return-to-depot leg breaks the horizon. No local search; the flat
      reference that answers "what would blind feasibility cost?"
    - **nearest_neighbor** — greedy nearest-feasible insertion, seeded by the
      earliest-due customer.
    - **clarke_wright** — Clarke–Wright savings with capacity and full-route
      time-window feasibility checks on every merge.
    - **two_opt** — 2-opt (intra-route reversals + 2-opt* tail exchanges) on
      the better construction plan, accepting only moves that keep every
      route feasible; acceptance rule, move budget and tail exchange are HPO
      knobs (winner: budget 50, best-improvement, 2-opt + 2-opt*).
    - **alns** — adaptive large-neighborhood search (Ropke–Pisinger): destroy
      q=10 customers via random / worst / Shaw time-window-relatedness
      removal, repair with greedy regret-2 insertion, operator weights adapted
      per segment from scores, simulated-annealing acceptance; starts from the
      tuned 2-opt plan.
    - **ortools_cp** (external reference) — OR-Tools CP-SAT model: one circuit
      per vehicle over time-window-filtered arcs, time/capacity propagated
      along arcs, ALNS plan injected as the solution hint; single worker,
      fixed seed, 10 s wall-time budget per instance. If the limit expires
      before CP-SAT confirms a solution, the hinted incumbent is returned —
      the arm never degrades a plan.

    The solver ladder each instance climbs:

    ```mermaid
    flowchart LR
        A[randomized feasible floor] --> B[nearest_neighbor]
        B --> C[clarke_wright savings]
        C --> D[two_opt improvement]
        D --> E[two_opt_tuned via seeded HPO]
        E --> F[alns destroy + repair]
        F --> G[ortools_cp external check]
        G --> H[validated route plan]
    ```

    Two seeded random searches tune the stages: 24 trials over the 2-opt knobs
    (budget, acceptance, tail exchange, best-of-k restarts; objective = mean
    distance over all 56 instances) and 12 trials over the ALNS knobs
    (segment length, reaction factor, init weights; objective over a
    6-instance representative subset). Winners persist to `params.yaml`.

    **Business implication:** the searches paid for themselves in evidence,
    not just config: they proved randomized restarts don't pay (chose k=1)
    before a single ALNS iteration ran — measurement beats intuition.
  figures: []
  metrics_keys: [randomized, clarke_wright, two_opt, two_opt_tuned, alns, ortools_cp]
- id: evaluation
  text_md: |
    Every candidate solution passes through the same improvement-and-audit
    loop before it reaches any table or figure:

    ```mermaid
    flowchart LR
        S[solver output] --> V[hard validator: once-only, capacity]
        V --> T[time-window simulation]
        T -->|infeasible| X[pipeline halts loudly]
        T -->|feasible| G[gap % vs published best-known]
        G --> R[metrics.json, figures, report.html]
    ```

    All seven solvers run on all 56 instances; distances are compared against
    the published best-known values and reported as gap %, aggregated
    per instance and per family. Runtimes: microseconds-to-milliseconds for
    the heuristics, ~0.8–3 s/instance for ALNS, and a deliberately generous
    10 s/instance budget for the CP-SAT external reference — an asymmetric
    comparison whose verdict is reported honestly in the results. The route
    map shows the best C101 plan, the family chart shows where each solver
    stands per problem class, the convergence curves show the 2-opt and ALNS
    descents, and the Pareto chart places every solver on the
    runtime-vs-gap plane.

    **Business implication:** because evaluation is cheap and fully
    reproducible, it can run inside CI on every change — optimization quality
    becomes a guarded regression metric, not a one-off report.
  figures: [route_map_C101, solver_profile, family_gap, convergence_C101, convergence_RC105, alns_convergence_C101, alns_convergence_RC105, pareto_gap_runtime]
  metrics_keys: [randomized, clarke_wright, two_opt, two_opt_tuned, alns, ortools_cp]
- id: results
  text_md: |
    Real run, seed 42 — the solver ladder (means over all 56 instances).
    **Two gaps are reported**: distance gap % and vehicle-count delta (veh Δ)
    vs the published best-known solutions — the benchmark ranks vehicles
    first, distance second, so both numbers matter.

    | solver | mean distance | mean gap | mean vehicles | mean veh Δ | mean runtime |
    |---|---|---|---|---|---|
    | randomized | 3868.55 | 316.95 % | 18.3 | +11.09 | 0.6 ms |
    | nearest_neighbor | 1694.18 | 71.64 % | 14.0 | +6.75 | 1.1 ms |
    | clarke_wright | 1200.06 | 18.31 % | 13.0 | +5.79 | 3.0 ms |
    | two_opt (untuned) | 1158.34 | 13.75 % | 13.0 | +5.79 | 15.0 ms |
    | two_opt_tuned (HPO) | 1156.92 | 13.63 % | 13.0 | +5.79 | 36.3 ms |
    | **alns (HPO-tuned)** | **1062.02** | **4.23 %** | **11.0** | **+3.73** | 2.77 s |
    | ortools_cp (external, 10 s/instance) | 1062.02 | 4.23 % | 11.0 | +3.73 | 13.6 s |

    (Wall-clock runtimes from a shared machine — heuristic and ALNS numbers
    are load-inflated; distances and gaps are seeded and deterministic.)

    Per-family mean distance gap / mean vehicle delta (two-panel figure
    `family_gap`):

    | family | instances | two_opt_tuned | alns |
    |---|---|---|---|
    | C1 | 9 | 18.62 % / +3.44 | 4.48 % / +1.00 |
    | C2 | 8 | 21.48 % / +2.50 | 6.50 % / +1.00 |
    | R1 | 12 | 14.95 % / +6.92 | 4.10 % / +3.42 |
    | R2 | 11 | 7.28 % / +7.64 | 3.04 % / +6.73 |
    | RC1 | 8 | 13.29 % / +5.88 | 4.75 % / +2.88 |
    | RC2 | 8 | 7.23 % / +7.38 | 3.00 % / +6.75 |

    Key findings:

    - **ALNS wins 56/56 on distance** and cuts the mean gap from 13.63 % to
      **4.23 %** — single digits on every family; the cross-route
      re-sequencing (destroy + regret-2 repair) is exactly the neighborhood
      2-opt cannot express.
    - **Under the benchmark's vehicles-first ranking, ALNS wins 43/56** —
      nearest_neighbor "wins" 10 and randomized 3 by using fewer vehicles at
      far worse distance. Distance-only comparison flatters; the vehicle
      column is the honest one for fleet planning.
    - **Vs the references, no solver uses fewer vehicles than best-known**
      (best ALNS +3.73 mean); the vehicle gap is largest where the references'
      hierarchical objective bites hardest (R2/RC2, +6–8 vehicles).
    - **Negative distance gaps are real and reported**: ALNS lands below the
      published reference on 8 instances (best RC202 −3.85 %, R207 −3.51 %,
      R211 −3.43 %) — the reference table mixes conventions, and our
      full-precision plain-distance solutions legitimately undercut a few values.
    - Honest residuals: C2 6.50 % (few-vehicle wide-horizon optima resist
      q=10 destroy), C203 19.48 % and C103 11.67 % (tight chains).
    - Standing caveats: naive baselines can exceed the stated 25-vehicle fleet
      on tight R1/RC1 instances (CW needs 31 on R101) — reported, not hidden;
      distance stays valid and the vehicle count flags the fragmentation.
    - The 2-opt HPO negatives stand: randomized restarts
      never pay (k=1 chosen) and 2-opt budgets saturate (≤ ~20 moves).
    - **External reference verdict (OR-Tools CP-SAT, 10 s/instance, hinted by
      the ALNS plan): it does not beat ALNS anywhere on the 100-customer
      benchmark.** On all 56 instances it ended at `UNKNOWN` — CP-SAT could
      not even register its own hinted solution within the budget — and the
      arm returned the incumbent unchanged: ortools_cp ties ALNS 56/56 at
      ~5x the runtime (13.6 s vs 2.8 s mean). The 4.23 % gap is not an
      artifact of weak in-house optimization. Where CP-SAT does dominate is
      small problems: it certifies the 25-customer C101 prefix to a 191.8
      optimum in 2.9 s (the 2-opt hint was 286.3) and proves the 5-customer
      test instance optimal in 0.1 s. The model is verified sound — with the
      hinted arcs fixed, CP-SAT proves C101-incumbent feasibility in 1.4 s,
      and every returned plan re-passes the hard validator.

    **Business implication:** a 4.23 % mean distance gap — with the honest
    +3.73-vehicle caveat attached — on 1987-published optima and every problem
    family, with seeded deterministic code a client can audit: that is the
    quality number a procurement process can anchor to, and the ~0.8 s
    per-instance cost makes the same harness usable for daily routing.
  figures: [gap_pct, pareto_gap_runtime]
  metrics_keys: [randomized, clarke_wright, two_opt, two_opt_tuned, alns, ortools_cp]
- id: conclusions
  text_md: |
    The ladder told the story in three acts. Feasibility is cheap (randomized
    floor, 317 % gap). Constraint-aware construction is the first big lever
    (savings, 18.3 %). Local polish helps a little (2-opt + HPO, 13.6 %).
    The metaheuristic closes the rest: ALNS reaches **4.23 %** mean gap over
    all 56 Solomon instances — single digits on every family, 56 wins out of
    56, negative gaps on 8 instances where our full-precision solutions
    undercut convention-mixed references. The external cross-check closed the
    loop: OR-Tools CP-SAT, given a deliberately generous 10 s/instance budget
    and the ALNS plan as its starting hint, tied ALNS on every one of the
    56 instances at ~5x the runtime — it could not improve the incumbent
    anywhere at 100-customer scale, while certifying small subproblems to
    optimality in seconds. Lessons that transfer: validate feasibility in
    code; benchmark against published optima; keep a randomized floor in
    every chart; demand negative results from tuning loops; and cross-check
    in-house solvers against external references before trusting a gap number.

    Where the remaining gap lives: ~4 % mean is concentrated in C2's
    few-vehicle wide-horizon optima (6.50 %) and a handful of tight chains
    (C203, C103) — the destroy size and operator pool, not the framework, are
    the next levers. The roadmap below records what was delivered and what
    was consciously deferred.

    **Business implication:** a 4.23 % mean gap to 1987-published optima, on
    every problem family, with seeded deterministic code a client can audit —
    that is the quality number a procurement process can anchor to, and the
    ~0.8 s per-instance cost makes the same harness usable for daily routing.
  figures: []
  metrics_keys: [randomized, clarke_wright, two_opt, two_opt_tuned, alns, ortools_cp]
roadmap:
- status: delivered
  text: |
    ALNS solver behind the `RoutePlan` contract — shipped, verified:
    destroy (random/worst/Shaw) + regret-2 repair, segment-adapted weights,
    SA acceptance; 4.23 % mean gap over all 56 instances, 56/56 wins,
    HPO-tuned (segment 100, reaction 0.5).
- status: delivered
  text: |
    OR-Tools CP-SAT external reference (`ortools_cp`) — shipped: time-bounded
    (10 s/instance), hinted by the ALNS plan, deterministic within the limit.
    Verdict: ties ALNS 56/56 at ~5x runtime; certifies small subproblems to
    optimality in seconds. Pareto + ALNS-convergence figures added.
- status: delivered
  text: |
    Full 56-instance Solomon benchmark with per-family gap reporting —
    shipped (C1 4.48 %, C2 6.50 %, R1 4.10 %, R2 3.04 %, RC1 4.75 %,
    RC2 3.00 %) with the `family_gap` figure.
- status: delivered
  text: |
    Seeded HPO searches for both improvement stages — shipped; negatives on
    record (randomized restarts never pay, k=1 chosen; 2-opt budgets
    saturate at ≤ ~20 accepted moves).
- status: delivered
  text: |
    Hard-feasibility evaluation harness — shipped: once-only/capacity
    validator plus per-route time-window simulation gates every solution
    before it reaches a table or figure.
- status: deferred
  text: |
    Hierarchical objective (vehicles first, then distance): multi-echelon
    fleet constraints are a different problem contract — parked deliberately.
    The dual-gap audit quantified the stakes: ALNS averages +3.73 vehicles
    over the references, up to +6–8 on R2/RC2 (hierarchical optima: 2–4).
- status: deferred
  text: |
    Time-window-preserving destroy operators for the C2-family residuals
    (C2 6.50 %, C203 19.48 %) — not committed: needs a dedicated
    destroy-size/operator-pool study beyond the shipped q=10 ALNS; the HPO
    harness is ready if an engagement asks for it.
