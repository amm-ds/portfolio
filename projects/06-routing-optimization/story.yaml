project_id: 06-routing-optimization
short_version: |
  Routing planner for the 56 standard Solomon 100-customer problems with time windows. A hand-written search returns feasible plans within 4.2% of best-known routes in ~1 second each, using 3.7 more vehicles than best-known on average; an exact solver certifies small cases only.
sections:
  - id: background
    text_md: |
      **One delivery day, 100 customers: each customer has a time slot, each
      truck a capacity limit.** The planner's job is a legal day — every
      stop served once, every window met — made as short as possible.
      Solomon's problems are the field's standard test days, which makes
      them the honest yardstick. Across the 56 instances, a tuned adaptive
      large-neighborhood search lands within 4.23% of the best published
      distance, in about a second per problem, using 3.73 more trucks than
      best-known on average. The day-plan diagram shows the shape of one
      problem — inputs, route list, and the machine-checked validator every
      plan must pass before its distance counts. The next section fixes
      the acceptance contract before any solver runs.

      ```mermaid
      flowchart LR
        subgraph DAY["one Solomon problem - 100 customers"]
          I["depot + 100 customers<br/>windows + capacity"]
        end
        subgraph PLAN["a plan"]
          R["route list"] --> V["machine-checked validator"] --> D["distance + truck count"]
        end
        I --> R
      ```

      **Business summary:** Across 56 real benchmark days, the search lands
      within about 4% of the best published plans in a second per day, at
      3.73 extra trucks on average.
    figures: []
  - id: objectives
    text_md: |
      **The question: how close do simple, seeded search methods get to the
      best published plans — and how long does each rung of the ladder
      take?** The acceptance contract is fixed before any solver runs, so
      the goalposts cannot move after the results arrive:

      - Every plan serves each customer exactly once, inside truck capacity
        and every time window.
      - Every plan is checked by code before any number is reported.
      - Distance and truck count stay together: the field ranks a smaller
        fleet ahead of a shorter distance.
      - The search is fully repeatable: fixed seed, no hidden state.
      - The full 56-problem ladder, tuning included, finishes in about
        90 seconds.
      - Bad tuning results stay in the report.

      The contract diagram shows how the clauses chain: the rules feed one
      code check — the RoutePlan validator plus a route simulation — and
      the two scored criteria then land on the benchmark convention. The
      convention needed stating because the tempting alternative,
      distance-only reporting, hides the truck count: a fleet can almost
      always shorten its distance by adding vehicles, so the two numbers
      are never reported apart. The next section pins the 56 test days and
      the reference plans they are scored against.

      ```mermaid
      flowchart LR
        subgraph RULES["the contract"]
          R["serve once, in capacity,<br/>meet windows, fixed seed"]
        end
        subgraph CHECK["before any number is reported"]
          V["RoutePlan validator<br/>+ route simulation"]
        end
        subgraph SCORE["scoring"]
          GAP["gap to best-known"]
          VEH["vehicle delta"]
        end
        RULES --> V
        V --> GAP --> C["convention:<br/>fewer trucks first"]
        V --> VEH --> C
      ```

      **Business summary:** The bar: legal plans only, checked by code;
      distance and truck count side by side; the whole ladder with tuning
      inside about 90 seconds.
    figures: []
  - id: data
    text_md: |
      **56 standard test days, six families, pinned and free with
      citation.** The complete Solomon 100-customer set holds 56 instances:
      C1 (9), C2 (8), R1 (12), R2 (11), RC1 (8), RC2 (8) — clustered,
      random, or mixed geography crossed with tight or wide time windows.
      The family counts are not decorative: family shapes the gap, so the
      per-family view returns in the results. Each instance pins
      coordinates, demand, time windows and service time, nothing left to
      interpretation. The
      [CVRPLIB snapshot](https://amm-ds.github.io/portfolio/data-registry/cvrplib-solomon/)
      comes sha256-pinned from the SINTEF TOP mirror — a primary mirror
      plus a hash beat a bundled copy, because the citation must resolve
      for a stranger in five years. The lineage diagram shows how sources
      become the reference table: read it left to right, the snapshot
      passes data-quality gates that reject nulls and out-of-range values
      and fans out into the six families, while on the reference side the
      curated best-known registry and a project-local SINTEF TOP supplement
      merge into one comparison table of distance and truck count.

      ```mermaid
      flowchart LR
        CVR["CVRPLIB snapshot:<br/>56 instances, pinned"] --> DQ["DQ gates:<br/>nulls, bad ranges"] --> FAM["six families"]
        REG["curated registry"] --> TAB["merged table:<br/>distance + trucks"]
        SUP["local supplement:<br/>42 cases"] --> TAB
        FAM --> TAB
      ```

      The supplement matters because without it 42 instances would have no
      reference and would silently drop out of the ladder. Best-known is a
      moving literature reference, not an optimality certificate. The next
      section profiles what the 56 days actually look like.

      **Business summary:** 56 standard test days from a pinned public
      benchmark, six families, plus published reference plans and quality
      gates on both.
    figures: []
  - id: eda
    text_md: |
      **The 56 days are not alike.** The instance-map figure shows C101:
      customers sit close on the map — one tight cluster around the starred
      depot — but narrow time windows are scattered across that cluster,
      and the color scale says so at a glance. The figure exists to stop a
      natural misreading: reaching for the map before the clock. Two
      customers who are neighbors geographically can be hours apart in
      feasible arrival time, so the clock, not the map, sets the stop
      order. C2 flips the picture: wide horizons favor few, full trucks.
      R1 and RC1 mix map spread with tighter windows.

      Two reading rules follow. First, every plan is checked — served
      once, capacity, time windows — before any metric or figure is
      written; a pretty route that breaks a window is not a result.
      Second, each solver is read as an optimality gap: the percent its
      distance sits above the best-known plan for that same problem, with
      the truck-count gap printed next to it — a gap printed alone invites
      distance-only conclusions. Family results sit next to the 56-instance
      mean because one average would hide the shape: C2 instances and R1
      instances fail differently. The next section climbs the solver
      ladder rung by rung.

      **Business summary:** The 56 days are not alike — tight or wide
      windows, bunched or spread maps — so each solver is read per family,
      not as one average.
    figures: [eda_instance_map]
  - id: training
    text_md: |
      **The ladder, rung by rung.** Mean gap to best-known falls 316.95%
      (random legal plans) → 71.64% (greedy nearest neighbor) → 18.31%
      (capacity-aware savings merges) → 13.63% (tuned 2-opt) → **4.23%**
      for the adaptive large-neighborhood search, at roughly one second per
      instance. The solver-profile figure shows every rung; the gap figure
      shows each instance. Every rung's plan is feasible and checked — the
      rungs differ in distance, not legality.

      **Where the wins are.** The search tops the ladder on distance for
      52 of 56 instances; its fleet-first twin wins the other 4. Under the
      benchmark's fleet-ranks-first convention it wins 38 of 56 (twin 5,
      naive solvers 13 by using more trucks at far worse distance). No
      solver beats the best-known fleet size: +3.73 vehicles on average.

      **Trucks and distance trade at a tenth of a point.** Re-weighting the
      search to favor fleet size costs +0.07 points of mean gap and buys
      −0.07 mean vehicles — measured, so a fleet-first client can take that
      deal.

      **Sometimes the reference loses.** The search undercuts 8 published
      references (best: RC202 at −3.85%). The honest residuals are C2
      6.50%, C203 19.48% and C103 11.67%.

      **The exact solver plays a different role.** Given the search's plan
      as a head start, a state-of-the-art exact solver ties on all 56 at
      about ten times the runtime — and from scratch, at the same ten-
      second budget, it finds no feasible plan on any of them. Only small
      cases carry proofs: a 25-customer C101 is certified optimal in 2.9 s,
      a 5-customer case in 0.1 s.

      **Tuning's honest negatives.** Randomized restarts never pay (the
      search keeps k=1); tuning 2-opt moves the mean gap only 13.75% →
      13.63%; move budgets saturate at about twenty accepted moves.

      The figures read at three zooms: the solver-profile figure shows
      distance per instance — the spread is the ladder; the gap figure
      re-plots it as percent above best-known, where ALNS hugs zero; the
      route-map figure draws the C101 plan itself. The next section frames
      what ships to a dispatch team.

      **Business summary:** From a random legal day to 4.23% of best-known
      in about a second per problem; the fleet-first variant trades a tenth
      of a point for 0.07 fewer trucks.
    figures: [solver_profile, gap_pct, route_map_C101]
    metrics_keys: [randomized, clarke_wright, two_opt, two_opt_tuned, alns, alns_fleet, ortools_cp]
  - id: evaluation
    text_md: |
      **For a dispatch team, this answers the first question of any routing
      job: how close a transparent, seeded heuristic gets, and at what
      cost.** The deliverable at 100-customer scale is the search's plan:
      feasible by construction, about a second per problem, both criteria
      on the label. The distance gap and the fleet gap travel together.
      The exact solver earns its place in a different role, as the
      certifier of small subproblems rather than a competitor at scale;
      the 25-customer proof is its credential. The evaluation-contract
      diagram shows how runs become numbers. All eight solvers run all 56
      instances at seed 42. The validator drops any infeasible plan before
      scoring, two criteria feed the search plan, and a separate branch
      has the exact solver certifying small cases. Seeded means a
      dispatcher can replay a run and get the same plan — auditability is
      a feature here, not overhead. Runtime is printed next to every
      number: a gap without its runtime is half a claim. The hinted
      exact-solver probe ties on gap at about ten times the runtime, which
      is exactly the trade the pairing exposes. The next section reads the
      measured record — means, spread, and the limits that travel with
      them.

      ```mermaid
      flowchart LR
        subgraph METRICS["two criteria, always together"]
          GAP["gap to best-known"]
          VEH["vehicle delta"]
        end
        subgraph SHIP["what ships"]
          PLAN["search plan, ~1 s"]
          CERT["exact solver:<br/>certifies small cases"]
        end
        V["all 8 solvers x 56 instances,<br/>seed 42 - feasible plans only"] --> GAP --> PLAN
        V --> VEH --> PLAN
        V --> CERT
      ```

      **Business summary:** For dispatch: take the search plan — feasible,
      seeded, a second per problem, both criteria on the label; take the
      exact solver to certify small cases.
    figures: []
  - id: results
    text_md: |
      What the measured numbers support — and what they do not. The three
      figures in this section each answer a different doubt: the
      family-gap figure — does
      the mean hide spread?; the runtime-gap figure — what do the gaps cost
      in time?; the convergence figure — does the search visibly improve?
      Read them in that order before trusting any average; each doubt maps
      to a bullet below.

      - These are means over 56 instances, not a claim that every problem
        carries a 4.23% gap or +3.73 trucks; the per-instance spread
        reaches 19.48% (C203). The family-gap figure shows the spread by
        family.
      - Best-known references are not proven optima — only the certified
        small cases support an optimality statement.
      - Euclidean textbook routes omit street networks, traffic and dynamic
        re-optimization; a plan 4.23% above reference on the map is not
        4.23% above on the road.
      - Runtimes come from one shared, load-sensitive machine: context, not
        stable benchmarks. The runtime-gap figure pairs the two anyway.
      - The convergence figure shows the search on C101: distance falls
        1,046.5 → 860.2 (−17.8%) over 120 iterations.

      The conclusions hold the full record — exact per-instance tables, the
      ladder definition, the protocol, and the reproduction commands.

      **Business summary:** Read the mean with its spread: 4.23% average,
      worst residual 19.48%, eight references beaten — and runtimes from
      one shared machine.
    figures: [family_gap, pareto_gap_runtime, alns_convergence_C101]
  - id: conclusions
    text_md: |
      ## Results summary

      Across the 56 standard 100-customer days, the tuned adaptive large-
      neighborhood search returns a feasible, machine-checked plan within
      4.23% of the best published distance — 3.73 more trucks than
      best-known — in about a second per problem. What held up:
      tuned on a 6-instance subset, the search still won on distance for
      52 of 56 instances and undercut 8 references outright.
      What did not: no solver closed the fleet gap; the worst residual
      stays large (C203 at 19.48%). The exact solver added nothing: given
      the search's plan it tied at ten times the runtime; from scratch
      at the same budget it found no feasible plan. The evidence supports
      serving the seeded search plan; the exact solver certifies small
      cases.

      ## Key concepts

      - **Optimality gap** — how far a plan's distance sits above the
        best-known published plan.
      - **Best-known solutions** — the shortest plans the literature has
        published: reference points, not proven optima.
      - **ALNS** — adaptive large-neighborhood search: destroy part of a
        plan, repair it, adapt operator weights over segments.
      - **Fleet-first ranking** — the field ranks a smaller fleet ahead of
        a shorter distance; distance and truck count stay together.

      ## Exact numbers

      Headline: mean gap 4.23%, 95% CI 3.1–5.3 points — deterministic given
      the seed, so the interval reads as spread, not sampling uncertainty.
      Terms: **time window**, the allowed arrival clock-time at a customer;
      **best-known solutions**, the shortest published plans — reference
      points, not proven optima.

      **Ladder definition** (seeded, deterministic):

      ```mermaid
      flowchart LR
          A["randomized"] --> B["nearest_neighbor"]
          B --> C["clarke_wright"]
          C --> D["two_opt"]
          D --> E["two_opt_tuned (HPO)"]
          E --> F["alns"]
          E --> G["alns_fleet"]
          F --> H["hinted CP-SAT"]
          F --> I["unhinted CP-SAT"]
      ```

      - `randomized` / `nearest_neighbor`: feasible floor; greedy insertion.
      - `clarke_wright`: savings merges gated on capacity and windows.
      - `two_opt` (+ `two_opt_tuned` HPO arm): feasible intra-route 2-opt
        and inter-route 2-opt* moves.
      - `alns`: random/worst/Shaw destroy, regret-2 repair, segment-adapted
        weights, annealing acceptance.
      - `alns_fleet`: same search, incumbents on distance + 10,000 ×
        vehicles (fleet-first).
      - `ortools_cp` / `ortools_cp_unhinted`: CP-SAT at a 10 s/instance
        budget, hinted / no hint, no fallback.

      **Headline table** (means over 56 instances; Δ gap vs
      `nearest_neighbor`; run ids in `reports/metrics.json`):

      | solver | mean gap | mean veh Δ | Δ gap vs nn | mean runtime |
      |---|---|---|---|---|
      | randomized (floor) | 316.95% | +11.09 | +245.31 points | <10 ms |
      | nearest_neighbor | 71.64% | +6.75 | — | <10 ms |
      | clarke_wright | 18.31% | +5.79 | −53.33 points | <10 ms |
      | two_opt_tuned (HPO) | 13.63% | +5.79 | −58.01 points | <10 ms |
      | **alns (HPO-tuned)** | **4.23%** | **+3.73** | **−67.41 points** | **~1.1 s** |
      | **alns_fleet (vehicles-first)** | **4.30%** | **+3.66** | −67.34 points | ~1.1 s |
      | ortools_cp (hinted, 10 s) | 4.23% | +3.73 | −67.41 points | 12.0 s |
      | ortools_cp_unhinted (10 s) | no feasible plan on any of 56 | — | — | 13.1 s |

      **Record** (per-instance tables in `reports/results.md`; references:
      best-known registry + SINTEF TOP supplement, 42 omitted cases):

      | finding | record |
      |---|---|
      | distance | ALNS wins 52/56 intra-ladder on distance; `alns_fleet` wins the other 4 — the fleet-first path lands in different, occasionally better-distance optima |
      | vehicles first | under the benchmark convention (fleet size, then distance) ALNS wins 38/56, `alns_fleet` 5/56, naive solvers 13 by using fewer vehicles at far worse distance; no solver beats best-known fleet size (+3.73 mean, +3.66 fleet-first) |
      | fleet-first trade | the hierarchical objective (penalty 10,000/vehicle) buys −0.07 mean vehicles for +0.07 points of mean gap — measured, not assumed; both criteria stay reported per instance |
      | negative gaps | ALNS undercuts 8 published references (best RC202 −3.85%); residual gaps include C2 6.50%, C203 19.48% and C103 11.67% |
      | HPO negatives | 24 seeded trials tune 2-opt on all 56 instances and 12 tune ALNS on a 6-instance subset (winner: segment 100, reaction 0.5, uniform init weights, persisted to `params.yaml` as `alns_best`); restarts do not pay (k=1); budgets saturate at ≤~20 accepted moves |
      | exact solver | hinted CP-SAT: status UNKNOWN on all 56 at 100 customers, incumbents unchanged at ~10× the runtime; unhinted at the equal 10 s budget: no feasible plan, no incumbent on any instance; the tie was a head-start artifact — certified optimal only in small cases: the 25-customer C101 prefix at 191.8 in 2.9 s (2-opt hint 286.3 → 191.8, −33%) and a 5-customer case in 0.1 s |

      **Success criteria record:**

      | criterion | target | verification |
      |---|---|---|
      | feasibility | exactly-once service, capacity + time windows | `RoutePlan` validator + route simulation |
      | quality | distance % and vehicle Δ vs best-known | registry + SINTEF TOP supplement |
      | transparency | seeded, deterministic, auditable search | fixed seed, no hidden state |
      | speed | full benchmark and HPO in about 90 s | per-solver wall time |
      | legibility | feasible randomized floor in every chart | construction/search deltas |

      ## Protocol

      - **Benchmark:** the 56 Solomon 100-customer instances (C1, C2, R1,
        R2, RC1, RC2), seed 42; all eight solvers, all instances.
      - **Metrics:** gap: percent above the best-known reference distance;
        vehicle delta: fleet-count difference vs the reference fleet;
        runtimes: wall-clock on a shared machine.
      - **Exact-solver arms:** hinted CP-SAT starts from the ALNS plan under
        10 s/instance; unhinted gets the same budget, no hint, no fallback.
      - **Tuning records:** 24 seeded 2-opt trials on all 56 instances; 12
        ALNS trials on a 6-instance subset; winners in `params.yaml`
        (`solver_best`, `alns_best`).

      ## Limits

      - Means over 56 instances hide per-instance spread (worst C203:
        19.48%) and vehicle trade-offs.
      - Best-known references are not proven optima; only the two certified
        small cases support an optimality statement.
      - Euclidean textbook routes omit street networks, traffic and dynamic
        re-optimization.
      - Runtimes come from one shared, load-sensitive machine — context,
        not stable benchmarks.
      - Evidence is 100-customer scale; larger Gehring–Homberger instances
        and solver-as-a-service remain deferred.

      ## Revision notes

      - Committed run at seed 42: plans in `reports/solutions.json`, metrics
        in `reports/metrics.json`; per-instance tables in `reports/results.md`.
      - Tuned knobs in `params.yaml` (`solver_best`: 50 iterations, best
        acceptance, tail exchange, restarts 1; `alns_best`: segment 100,
        reaction 0.5, uniform init weights).
      - The unhinted CP-SAT arm is recorded per instance (status + runtime)
        in both reports, as the honest equal-budget comparison.

      ## Reproduce

      ```bash
      cd projects/06-routing-optimization
      uv run python -m routing_optimization.cli all   # download + solve + evaluate
      # or staged:
      uv run python -m routing_optimization.cli download  # fetch Solomon archive -> data/raw
      uv run python -m routing_optimization.cli solve     # -> reports/solutions.json
      uv run python -m routing_optimization.cli evaluate  # -> reports/{results.md,metrics.json,figures/}
      ```

      Tests: `uv run pytest -q` (offline, hypothesis property tests
      included).

      **Business summary:** The ladder stands: 4.23% mean gap, +3.73
      trucks, a second a day, eight references beaten — with an honest
      label on what best-known means.
    figures: []
    metrics_keys: [randomized, clarke_wright, two_opt, two_opt_tuned, alns, alns_fleet, ortools_cp]
roadmap:
  - status: delivered
    text: Full 56-instance ALNS ladder — 4.23% mean best-known gap, +3.73 mean vehicle delta.
  - status: delivered
    text: Hinted CP-SAT probe — no 100-customer gains; two small cases certified optimal.
  - status: delivered
    text: Fleet-first ALNS — −0.07 vehicles for +0.07 points gap; unhinted CP-SAT produced no feasible plan.
figure_captions:
  eda_instance_map: >-
    C101 customer locations colored by time-window width, with the depot starred.
    Narrow windows are scattered through the geographic cluster, so the clock constrains visit order.
  pareto_gap_runtime: >-
    Mean runtime against mean gap to published best-known distance over 56 instances;
    annotations show mean vehicle deltas. The hinted CP-SAT probe ties ALNS at about
    10× the runtime; the fleet-first ALNS arm (alns_fleet) lands beside ALNS.
  solver_profile: >-
    Total distance per instance for all eight ladder solvers. Savings construction removes most
    of the randomized floor; ALNS has a single-digit mean gap to best-known on every family.
  alns_convergence_C101: >-
    ALNS best-found distance and adapted destroy-operator weights on C101.
    Distance falls 1,046.5 → 860.2 (−17.8%) over 120 iterations.
  gap_pct: >-
    Per-instance distance gap to published best-known for every solver. ALNS averages
    4.23% over 56 instances versus 13.63% for tuned 2-opt and undercuts 8 references.
  family_gap: >-
    Mean distance gap and vehicle-count delta to best-known by Solomon family.
    ALNS averages +1.00 to +6.75 vehicles by family, so distance-only comparisons are incomplete.
  route_map_C101: >-
    The feasible ALNS C101 plan uses 11 routes and 860.21 distance, 3.77% above
    the published best-known 828.94. This 100-customer case is not certified optimal.
