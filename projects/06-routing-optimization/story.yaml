    text: Full 56-instance ALNS ladder — 4.23% mean best-known gap and +3.73 mean vehicle delta.
  - status: delivered
    text: Hinted CP-SAT probe — no 100-customer gains; two small cases certified optimal.
  - status: delivered
    text: Fleet-first ALNS (hierarchical objective; −0.07 mean vehicles at +0.07 pp gap, wins 4/56 on distance) and equal-budget unhinted CP-SAT (no feasible plan on any instance).
  - status: deferred
    text: Larger Gehring–Homberger instances and solver-as-a-service deployment.
