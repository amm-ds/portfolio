project_id: 06-routing-optimization
sections:
- id: background
  text_md: |
    Last-mile and field-service routing is one of the few places where a few
    percent of travel distance translates directly into fuel, driver hours and
    CO₂ — every day, on every route. The vehicle routing problem with time
    windows (VRPTW) is its canonical form: a fleet leaves a depot, must serve
    every customer inside a promised time window, respects vehicle capacity,
    and comes home. It is also one of the hardest combinatorial problems in
    practice — 100 customers already have more candidate solutions than any
    computer can enumerate.

    Clients usually ask two questions: *how good is a quick, transparent
    heuristic, and what would a heavier optimizer buy us?* This project answers
    the first question honestly and gives the second a measurable baseline.

    **Business implication:** last-mile routing is a direct cost lever — every
    percent of distance is fuel, vehicle hours and CO₂, so even single-digit
    routing improvements compound into a material annual saving.
  figures: []
  metrics_keys: []
- id: objectives
  text_md: |
    Serve all customers exactly once, within capacity and every time window,
    while minimizing total distance — and prove it. Every solution is
    machine-validated (exactly-once service, capacity, time windows) before it
    is reported.

    Quality is measured as the optimality gap against published best-known
    solutions on standard Solomon benchmark instances, not against our own
    yesterday's run. The engineering targets: deterministic, seeded solvers a
    client can audit line by line; total benchmark runtime in seconds; a
    randomized-feasible reference that makes the value of constraint-aware
    construction visible; and a small, reproducible HPO loop that tunes the
    improvement stage without hiding what the search actually found.

    **Business implication:** the deliverable is not a route plan, it is a
    *verifiable quality number* — a stated optimality gap that procurement can
    hold any future optimizer (ours or a vendor's) accountable to.
  figures: []
  metrics_keys: [randomized, clarke_wright, two_opt, two_opt_tuned]
- id: data
  text_md: |
    Real benchmark data: the Solomon VRPTW 100-customer instances (CVRPLIB),
    the standard reference this literature has used since 1987. We run a
    curated 10-instance subset spanning the three problem families —
    clustered (C1), random (RC1) and mixed — each with 100 customers whose
    coordinates, demand, time window and service time are pinned by the
    instance file.

    **Datasets:**

    - [CVRPLIB Solomon VRPTW benchmark](https://amm-ds.github.io/portfolio/data-registry/cvrplib-solomon/)
      — academic benchmark, free to use with citation; downloaded from the
      SINTEF TOP mirror as one sha256-pinned archive (snapshot card in
      `data/raw/dataset_card.json`). 56 classic 100-customer instances exist;
      this showcase runs 10 of them, with the curated published best-known
      values used as the gap-table reference.

    Data-quality gates (null rates, ranges vs fleet capacity) halt the
    pipeline loudly on any anomaly.

    **Business implication:** using a public, citation-backed benchmark means
    every quality claim in this case study can be re-checked by the client's
    own team against literature values — no trust-us slide required.
  figures: []
  metrics_keys: []
- id: eda
  text_md: |
    Geography only tells half the story. On C101 the customers form tight
    spatial clusters — but the color scale below shows how narrow their time
    windows are (width = due − ready). Narrow windows constrain the *order* in
    which nearby customers may be visited, which is why this instance is easy
    to serve with few vehicles yet hard to keep short: the routing is dictated
    by the clock more than by the map.

    The depot (star) sits inside the cluster, and the tightest windows are
    scattered across it — no simple geographic sweep can respect them.

    **Business implication:** this is why "draw neat geographic territories"
    underperforms in practice — the binding constraint is the delivery
    promise window, so any tooling must optimize the clock and the map
    together.
  figures: [eda_instance_map]
  metrics_keys: []
- id: training
  text_md: |
    There is no model fitting here — "training" is construction, improvement,
    and tuning the improvement stage. The problem is specified as pydantic
    models (`Customer`, `Problem`, `RoutePlan`, `TwoOptTuning`) so every
    solver speaks the same contract. Four deterministic, hand-written solvers,
    Euclidean distances, all seeded:

    1. **randomized** — shuffle customers with the run seed, pack them in that
       order into capacity/time-window-feasible routes, repair any route whose
       return-to-depot leg breaks the horizon. No local search; the flat
       reference that answers "what would blind feasibility cost?"
    2. **nearest_neighbor** — greedy nearest-feasible insertion, seeded by the
       earliest-due customer.
    3. **clarke_wright** — Clarke–Wright savings with capacity and full-route
       time-window feasibility checks on every merge.
    4. **two_opt** — first-improvement 2-opt (intra-route reversals + 2-opt*
       tail exchanges) applied to the better construction plan, accepting only
       moves that keep every route feasible.

    On top of that, a seeded random search (24 trials) tunes the improvement
    stage: move budget 50–500, first- vs best-improvement acceptance,
    tail-exchange on/off, and a best-of-k randomized-restart portfolio
    (k = 1..8). Objective: mean distance across the 10 instances. The winner
    is persisted to `params.yaml` and reported as **two_opt_tuned**.

    **Business implication:** the search itself taught that randomized
    restarts don't pay — measurement beats intuition, and a 24-trial,
    seconds-long HPO already eliminates two popular "obvious" investments.
  figures: []
  metrics_keys: [randomized, clarke_wright, two_opt, two_opt_tuned]
- id: evaluation
  text_md: |
    Each solver runs on every instance; distances are compared against the
    published best-known values and reported as gap %. Every route plan passes
    the hard validator (all customers exactly once, capacity respected) plus a
    full time-window simulation before it reaches the table.

    Runtimes are per-instance wall time (mean ≤ 13 ms even for the tuned run;
    the whole benchmark including HPO finishes in ≈ 3 s). The route map shows
    the best C101 plan, the solver profile shows the full ladder per instance,
    and the convergence curves show the 2-opt descent move by move — where the
    tuned and untuned runs coincide (C101) and where best-improvement
    acceptance escapes the untuned local optimum (RC105).

    **Business implication:** because evaluation is cheap and fully
    reproducible, it can run inside CI on every change — optimization quality
    becomes a guarded regression metric, not a one-off report.
  figures: [route_map_C101, solver_profile, convergence_C101, convergence_RC105]
  metrics_keys: [randomized, clarke_wright, two_opt, two_opt_tuned]
- id: results
  text_md: |
    Real run, seed 42 — the solver ladder (means over the 10-instance subset):

    | solver | mean distance | mean gap | mean vehicles | mean runtime |
    |---|---|---|---|---|
    | randomized | 4055.76 | 302.86 % | 24.6 | 0.9 ms |
    | nearest_neighbor | 1805.55 | 69.16 % | 18.2 | 1.4 ms |
    | clarke_wright | 1339.13 | 24.62 % | 15.7 | 3.7 ms |
    | two_opt (untuned) | 1289.91 | 19.55 % | 15.7 | 5.9 ms |
    | **two_opt_tuned (HPO)** | **1284.15** | **19.08 %** | 15.7 | 12.9 ms |

    Key findings:

    - The chosen config: move budget 50, best-improvement acceptance, 2-opt +
      2-opt* tail exchanges, restarts best-of-1. Tuning is worth −5.76 mean
      distance (−0.45 gap points) over the untuned run, winning on 5/10
      instances (best: RC105 −19.10, gap 17.85 % → 16.69 %).
    - Constraint-aware construction remains the big lever: randomized →
      savings is −2765.85 distance (−68.2 %); 2-opt adds −49.22; tuning adds
      the final −5.76.
    - Honest negatives, kept on the record: randomized restarts never pay
      (the search itself chose k=1) and the move budget saturates (≤ ~20
      accepted moves) — bigger budgets and more restarts are not where the
      value is.
    - Standing caveat: on RC105 the naive baselines exceed the stated
      25-vehicle fleet (randomized 30, nearest-neighbor 26) — reported, not
      hidden; distance stays valid and the vehicle count flags the hard
      instance.
    - Best per-instance tuned gap: 8.94 % (RC104); worst: 29.24 % (C102).

    **Business implication:** 19 % above published optima with transparent,
    line-by-line auditable heuristics beats a black-box "AI" whose gap nobody
    can state — you get a quality number you can defend in a cost review, and
    a clear price list for what further sophistication would buy.
  figures: [gap_pct]
  metrics_keys: [randomized, clarke_wright, two_opt, two_opt_tuned]
- id: conclusions
  text_md: |
    Feasibility is cheap; constraint-aware construction is where the value
    is. A fully auditable, seeded heuristic stack — construction + 2-opt + a
    24-trial HPO — reaches a mean gap of 19.08 % to solutions published by
    tuned ALNS/tabu metaheuristics, in milliseconds, with every route
    machine-validated. That is the speed-to-value story: a baseline this cheap
    and this honest gives any heavier optimizer a concrete bar it must clear
    to justify its complexity.

    Where the remaining gap lives: the ~19 % left on the table is mostly
    time-window-aware *sequencing* — deciding which customer joins which
    route and in what order. 2-opt neighborhoods only reverse or swap pieces
    of existing routes; they cannot re-sequence across routes the way
    insertion, relocation, or ALNS destroy-and-repair moves can. Closing
    toward single digits needs that richer neighborhood (roadmap), and the
    HPO framework from this wave carries over directly to tune its operator
    weights.

    Lessons: (1) validate feasibility in code, never by inspection; (2)
    benchmark against published optima, or "improvements" are unverifiable;
    (3) keep a randomized feasible baseline in the chart — without it the 68 %
    construction win is invisible; (4) demand negative results from HPO: here
    it proved restarts and bigger budgets are not where the value is.

    **Business implication:** the roadmap is now evidence-priced — a
    metaheuristic track is justified only against a measured 19.08 % bar, and
    the same harness will show within hours whether it clears it.
  figures: []
  metrics_keys: [randomized, clarke_wright, two_opt, two_opt_tuned]
