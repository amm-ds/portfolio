key_concepts:
  - "**Optimality gap:** the percentage by which a plan's distance exceeds the best-known published distance."
  - "**Best-known solutions:** the shortest published plans. They are references, not proven optima."
  - "**ALNS:** adaptive large-neighborhood search removes and reinserts stops, then adapts operator weights over search segments."
  - "**Fleet-first ranking:** a smaller fleet ranks ahead of a shorter distance. Always read distance and truck count together."
figure_captions:
  eda_instance_map: >-
    C101 customer locations use color to show time-window width; the star marks the depot.
    Narrow windows are scattered through the geographic cluster, so the clock constrains visit order.
  pareto_gap_runtime: >-
    Mean runtime plotted against mean gap to published best-known distance over 56 instances.
    Annotations show mean vehicle deltas. Hinted CP-SAT ties ALNS at about 10× the runtime;
    the fleet-first ALNS arm (alns_fleet) lands beside ALNS.
  solver_profile: >-
    Route-distance distributions for all eight ladder solvers over 56 instances.
    Boxes show medians and interquartile ranges; points show instance outliers.
    Savings construction removes most of the randomized floor.
  frontier_gap_time: >-
    Median gap to best-known over elapsed wall-clock time for ALNS and single-worker CP-SAT.
    Both start from the same Clarke-Wright construction across all 56 instances, with a 30 s cap.
  gap_pct: >-
    Distance-gap distributions to published best-known for every solver over 56 instances.
    Boxes show medians and interquartile ranges; points show instance outliers. ALNS averages
    4.23% versus 13.63% for tuned 2-opt and undercuts 8 references.
  family_gap: >-
    Mean distance gap and vehicle-count delta to best-known by Solomon family.
    ALNS averages +1.00 to +6.75 vehicles by family, so distance-only comparisons are incomplete.
  route_map_C101: >-
    The feasible ALNS C101 plan uses 11 routes and 860.21 distance, 3.77% above
    the published best-known 828.94. This 100-customer case is not certified optimal.
