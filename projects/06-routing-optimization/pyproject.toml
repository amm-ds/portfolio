[project]
name = "06-routing-optimization"
version = "0.1.0"
description = "Portfolio project 06-routing-optimization."
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "plotly>=5.24",
    "polars>=1.9",
    "numpy>=2.1",
    "portfolio-core",
    "portfolio-eval",
]

[project.scripts]
routing_optimization = "routing_optimization.cli:app"

[tool.uv.sources]
portfolio-core = { workspace = true }
portfolio-eval = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/routing_optimization"]
