id: hierarchy-explorer
title: hierarchy explorer
hook: Pick a node in the Labour or TourismSmall hierarchy, pick one of the
  committed rolling origins, and slide across the horizon — the raw global
  LightGBM drifts away from its children while MinT reconciliation snaps the
  curves back into an exactly-coherent tree, total down to every bottom series.
project: 02-demand-forecasting
group: plan operations
skills: [hierarchical time series, forecast reconciliation, MinT]
modes: [browser]
hero:
  label: total-level rmae, lgbm_global+MinT vs seasonal naive (committed
    wave-23a hierarchical track)
  value: Labour 0.297, TourismSmall 0.869 — MinT repairs the incoherent ML
    base forecast on both hierarchies
  ci: per-level rmae and coherence are copied verbatim from the committed
    reports_hier/metrics.json; the payload build re-runs the scoring and
    drift-guards every carried scalar at 1e-9 before writing
scenarios:
  - name: base
    controls: {group: "Labour", node: "['Total']", origin: "2019-04-01"}
  - name: reconciled-gap
    controls: {group: "Labour", node: "['New South Wales']", origin: "2019-04-01"}
  - name: tourism
    controls: {group: "TourismSmall", node: "nsw-hol", origin: "2005-12-31"}
payload:
  path: reports/hier_demo_payload.json
  schema_version: 1
  required_keys:
    - demo
    - project
    - groups
    - catalog
    - evaluation_metadata
