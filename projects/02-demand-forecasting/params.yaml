# Multi-step (direct multi-horizon) track — protocol direct_multihorizon_v1:
# one direct model per horizon h on the FULL h = 1..14 lattice (every window
# day is a real direct-h fit — no interpolated display points), weekly
# rolling origins capped at 20 (the last multistep_test_origins are scored
# once; the earlier ones select).
