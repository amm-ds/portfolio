[project]
name = "02-demand-forecasting"
version = "0.1.0"
description = "Portfolio project 02-demand-forecasting."
requires-python = ">=3.12"
dependencies = [
    "scikit-learn>=1.5",
    "torch>=2.4",
    "optuna>=4.0",
    "typer>=0.12",
    "plotly>=5.24",
    "polars>=1.9",
    "numpy>=2.1",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "statsmodels>=0.14",
    "threadpoolctl>=3.0",
    "portfolio-core",
    "portfolio-eval",
]

[project.scripts]
demand_forecasting = "demand_forecasting.cli:app"

[tool.uv.sources]
portfolio-core = { workspace = true }
portfolio-eval = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demand_forecasting"]
