id: forecast-workbench
title: demand forecast workbench
hook: Pick a store-product series, pick a rolling origin — early, middle, or the
  frozen test window — stretch the horizon, and stress the recent demand;
  watch the champion, the challenger, the band, and the baseline respond.
project: 02-demand-forecasting
group: plan operations
skills: [time series forecasting, prediction intervals, demand classification]
modes: [browser, live]
hero:
  label: frozen test-window MAE (origin-4 holdout), champion vs strongest floor
  value: 9.54 vs 11.32 seasonal-naive (-15.7%)
  ci: no run clears MASE 1 on the frozen test window — lgbm_tuned is closest at 1.076,
    champion hgb_tuned 1.078
live_endpoints:
  - method: POST
    path: /projects/02-demand-forecasting/forecast
    label: live what-if scoring
    cost: free-local
scenarios:
  - name: base
    controls: {series: "United Kingdom|85123A", origin: "test", horizon: 7, spike: 1.0}
  - name: sparse-series
    controls: {series: "United Kingdom|84077", origin: "test", horizon: 7, spike: 1.0}
  - name: early-origin
    controls: {series: "United Kingdom|85123A", origin: "early", horizon: 7, spike: 1.0}
  - name: spike
    controls: {series: "United Kingdom|85123A", origin: "test", horizon: 7, spike: 1.5}
payload:
  path: reports/demo_payload.json
  schema_version: 2
  required_keys:
    - demo
    - project
    - track
    - catalog
    - scalars
    - origins_meta
    - evaluation_metadata
    - dataset_metadata
