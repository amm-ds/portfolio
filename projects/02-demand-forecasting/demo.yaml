id: forecast-workbench
title: demand forecast workbench
hook: Pick a store-product series, pick one of the three scored weekly origins,
  slide the true horizon h across the direct h-step forecasts, and shock the
  recent demand; watch the routed pipeline, the zero baseline, and — on the
  15 erratic series — the boosted per-horizon model respond.
project: 02-demand-forecasting
group: plan operations
skills: [time series forecasting, prediction intervals, demand classification]
modes: [browser, live]
hero:
  label: multi-step pooled MAE over the scored origins, routed pipeline vs all-HGB
  value: 7.47 routed vs 11.71 all-HGB — the routed pipeline leads
  ci: routing lumpy series away from the boosted model wins +4.0 MAE [3.3, 4.8]
    (95% paired bootstrap over series x scored origins; 98.6% of series are lumpy;
    pooled rmae 0.649)
live_endpoints:
  - method: POST
    path: /projects/02-demand-forecasting/forecast
    label: live what-if scoring
    cost: free-local
scenarios:
  - name: base
    controls: {series: "United Kingdom|85123A", origin: "2010-11-19", horizon: 7, shock: 1}
  - name: lumpy-series
    controls: {series: "United Kingdom|84077", origin: "2010-11-19", horizon: 7, shock: 1}
  - name: early-origin
    controls: {series: "United Kingdom|85123A", origin: "2010-11-05", horizon: 7, shock: 1}
  - name: demand-shock
    controls: {series: "United Kingdom|85123A", origin: "2010-11-19", horizon: 7, shock: 2}
payload:
  path: reports/demo_payload.json
  schema_version: 3
  required_keys:
    - demo
    - project
    - track
    - catalog
    - class_scoreboard
    - horizon_growth
    - peak_capture
    - payload_revision
    - bands
    - decision
    - evaluation_metadata
    - dataset_metadata
    - catalog_summary
