id: forecast-workbench
title: demand forecast workbench
hook: Pick one of 48 committed M5 store-product series, overlay all 8 candidates
  from the seasonal naive to the screened ensemble on the scored-once
  competition window — curves, member envelope and per-series WAPE respond.
project: 02-demand-forecasting
group: plan operations
skills: [time series forecasting, prediction intervals, demand classification]
modes: [browser]
hero:
  label: official WRMSSE
  value: 0.6161 vs 0.8929
  ci: −31.0% on the competition window (m5_full_v1, horizon 28)
scenarios:
  - name: base
    controls: {models: "seasonal_naive,lgbm", horizon: 28}
  - name: full-horizon-ensemble
    controls:
      models: "seasonal_naive,auto_ets,lgbm,lgbm_tweedie,lgbm_pool_store,lgbm_pool_storecat,lgbm_pool_dept,convex_ensemble"
      horizon: 28
  - name: pooled-compare
    controls: {models: "seasonal_naive,lgbm,lgbm_pool_store,lgbm_pool_storecat,lgbm_pool_dept,convex_ensemble", horizon: 28}
  - name: short-window
    controls: {models: "seasonal_naive,convex_ensemble", horizon: 7}
payload:
  path: reports_m5_full/demo_payload.json
  schema_version: 4
  required_keys:
    - demo
    - project
    - protocol
    - catalog
    - groups
    - origins
    - evaluation_metadata
