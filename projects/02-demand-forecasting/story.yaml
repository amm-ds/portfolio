project_id: 02-demand-forecasting
short_version: "Walmart M5 at full scale: 30,490 series scored once on the competition window under the official 42,840-node hierarchical WRMSSE. A stability-screened ensemble of pooled LightGBM fits reaches 0.6161 vs the naive floor's 0.8929 (−31.0%) — in the competition winner's ballpark."
sections:
- id: background
  text_md: |
    **The full Walmart M5 panel, scored with the competition's own ruler.**
    The project forecasts daily unit sales for all 30,490 Walmart store-item
    series over 1,969 days. Every candidate is then graded by the official
    WRMSSE — a revenue-weighted error across all 42,840 nodes of the
    store-category-item tree — on the last 28 days, and scored once. A
    screened blend of pooled LightGBM fits lands at 0.6161 against the
    seasonal-naive floor's 0.8929: −31.0% on the same scale the M5 contest
    reports.

    ```mermaid
    graph LR
      P["M5 panel: 30,490 series<br/>x 1,969 days"] --> F["Leakage-safe features"]
      F --> C["8 candidates<br/>naive, LightGBM, AutoETS"]
      C --> S["Stability screen<br/>2 selection origins"]
      S --> E["Convex ensemble"]
      E --> T["Final 28 days<br/>scored once, official WRMSSE"]
    ```

    One pipeline carries the full panel from raw sales to a single blended
    forecast. Only the final arrow touches the scored-once window.

    **Business summary:** Walmart's full M5 panel, scored once under the
    official 42,840-node WRMSSE: a screened pooled-LightGBM ensemble cuts
    error to 0.6161 vs the 0.8929 seasonal-naive floor (−31.0%).
  figures: []
- id: objectives
  text_md: |
    **The goal is a forecast a replenishment planner can defend, not a model
    file.** The question: at full scale, where does a learned model beat the
    simple seasonal rule — and how much complexity does that win actually
    buy? The candidate funnel gives the answer in one picture.

    ```mermaid
    flowchart LR
      N["seasonal_naive floor"] --> G["global LightGBM<br/>+ Tweedie arm"]
      G --> PL["pooled fits<br/>store, storecat, dept"]
      PL --> ETS["per-series AutoETS"]
      ETS --> SC["Stability screen:<br/>mean + 1.0 std"]
      SC --> BL["convex_ensemble<br/>3 members, simplex weights"]
      BL --> R["WRMSSE, bias, per-level<br/>zero-day, scored once"]
    ```

    Read the funnel top to bottom: every candidate, from the floor to the
    pooled fits, answers to the same stability screen and the same single
    scoring pass — nothing is selected on the test window, and no gap is
    quoted without its supporting metrics alongside.

    Success means:

    - Beat the seasonal-naive floor where the data support it, at full scale.
    - Keep every lag and feature strictly in the past; score the final window once.
    - Report error, bias, and quiet-day behaviour, per level and per class.
    - State plainly where the simple rule still wins.

    **Business summary:** The objective is a defensible full-scale forecast:
    every candidate passes one stability screen and one scored-once grading
    under the official WRMSSE, with bias and quiet-day metrics alongside.
  figures: []
- id: data
  text_md: |
    **One dataset, the whole panel, one contract.** The headline track is
    the Walmart M5 accuracy competition panel:

    - 30,490 daily store-item series (10 stores, 3 categories, 7
      departments), 2011-01-29 to 2016-06-19, 47,649,940 rows, 59.5% of
      them zero-demand days.
    - Sha256-pinned from the Nixtla `datasetsforecast` mirror of the
      competition archive; cite Makridakis et al., IJF 2022.
    - The hierarchy aggregates the bottom series bottom-up through 12
      levels — 42,840 nodes in total — and the evaluation weights every
      level equally, revenue-weighted within.

    The evaluation contract diagram fixes the split discipline: choose on
    the past, score once on the future.

    ```mermaid
    graph LR
      S["Choose on past:<br/>origins 2016-05-08 + 2016-05-15"] --> T["Score once: origin 2016-05-22<br/>competition window, 28 days"] --> C["Committed headlines:<br/>WRMSSE, bias, per level"]
    ```

    Read the contract as three stops. Two selection origins choose the
    ensemble members and weights; the third — the last 28 days of the panel,
    the competition window itself — scores every candidate exactly once.
    Random splits were rejected outright: with daily panels they leak the
    future into training, and any gap quoted without that discipline would be
    unverifiable. With the panel pinned, what does it look like inside?

    **Business summary:** One contract: all 30,490 M5 series through a
    42,840-node hierarchy, two origins to choose on, one competition window
    scored once.
  figures: []
- id: eda
  text_md: |
    **Why one global model is not enough.** The panel is dominated by
    intermittent demand, and the judging rules were set to match:

    - Classified by Syntetos-Boylan ADI/CV² (thresholds 1.32 / 0.49) on
      the real history up to the last selection origin, 27,736 of 30,490
      series — 91% — are intermittent; only 2,754 are dense.
    - Nearly six in ten panel days sell nothing at all.
    - Choose on the past, score once on the future, and keep the seasonal
      naive as the floor.
    - Report the quiet-day share explicitly — on zero-actual days the
      floor's forecast is right 66.6% of the time against the ensemble's
      57.3%.

    The sample-series figure shows what that means for a forecaster: the
    top-units series has a strong weekly shape the models can learn, the
    hardest intermittent series is zero for weeks at a time, and even the
    mid-volume series wobbles around quiet days. Full-scale forecasting is
    decided on those quiet days, so every result below carries them in
    view.

    **Business summary:** The panel is 91% intermittent — 27,736 of 30,490
    series, 59.5% zero days — so quiet days decide accuracy and the floor
    still wins them.
  figures: [m5_full_sample_series]
- id: training
  text_md: |
    **Eight candidates, one screen, one blend.** The panel runs eight
    candidates:

    - The floor is the seasonal-naive rule.
    - A global LightGBM model fits all 30,490 series at once (`mlforecast`
      recursive: lags plus 7/14/21/28-day rolling means, calendar, price,
      SNAP, and event features; the tuned config in `params.yaml`; seed 42).
    - A `Tweedie` twin swaps in a count-friendly loss for sparse demand.
    - Three pooled arms fit one booster each per store (10 groups), per
      store×category cell (30), and per department (7) — the winning
      solution's recipe at three groupings.
    - Per-series `AutoETS` closes the list; the convex ensemble is built
      from the pool.

    ```mermaid
    graph LR
      P["6 pool candidates"] --> Q["per-origin WRMSSE<br/>2 selection origins"]
      Q --> R["rank by mean<br/>+ 1.0 population std"]
      R --> M["best three:<br/>pool_storecat, pool_store, pool_dept"]
      M --> W["simplex grid, step 0.05<br/>minimise same screen"]
      W --> E["convex_ensemble<br/>weights 0.60/0.10/0.30"]
    ```

    Every fit is seeded or closed-form, and the pooled arms visit their
    groups in a fixed order, so a re-run rebuilds the same bytes.
    Selection never reads the test origin: the screen and the weight grid
    see the two selection origins only.

    The pooling panel puts the top-units series under the rival fits: on one
    erratic series the curves sit within noise of each other — the pooling
    edge is a panel-level property, and the official WRMSSE across all
    42,840 nodes is where it shows.

    The full run takes about 12.9 hours on one machine — the price of
    scoring the real panel. How is the winner graded? The next section
    defines the ruler.

    **Business summary:** Eight candidates — floor, global and Tweedie
    LightGBM, three pooled fits, AutoETS, screened ensemble — chosen by mean
    + 1.0×std on two selection origins, never the test window.
  figures: [m5_full_pooling_panel]
- id: evaluation
  text_md: |
    **Metrics match decisions.** The headline is the official WRMSSE: each
    node's error is scaled by its own train-window volatility, weighted by
    revenue, and averaged with equal total weight per level across all
    42,840 nodes. Side metrics keep the headline honest:

    - Bottom WAPE for volume-scaled error.
    - Bias for direction.
    - The spread of the per-origin score for stability.
    - The per-level split — where the hierarchical win is made.
    - Zero-day accuracy for the quiet days that dominate the panel.

    That is the competition's own ruler, so the fair comparison is the one
    the contest reports: improvement over its benchmark. The winner
    improved −22.4% over the best benchmark
    ([Makridakis et al., IJF 2022](https://doi.org/10.1016/j.ijforecast.2021.11.013)).

    ```mermaid
    graph LR
      F["Bottom forecasts: 30,490 series"] --> A["Aggregate bottom-up<br/>through 12 levels"]
      A --> N["Per-node RMSSE<br/>vs train volatility"]
      N --> W["Revenue weights<br/>equal total per level"]
      W --> O["WRMSSE + per-level<br/>+ zero-day, scored once"]
    ```

    Follow the aggregation: the tree does the adding up, the metric does
    the judging, and the scoring pass runs once.

    The per-level figure shows where the win is made. The blend's margin
    is broadest at the aggregate levels — 0.350 on total sales against the
    floor's 0.560 — while at item level the learned candidates cluster
    between 1.04 and 1.15 and the floor sits at 1.38–1.39, because
    series-level noise dominates there. Read the bars level by level: the
    gap between the blend and the floor widens toward the top of the tree.

    What these numbers do not show: savings. Stockouts, promotions, and
    returns sit outside the model, so no safety-stock or cost claim
    follows. Where does the ranking land?

    **Business summary:** Evaluation grades every candidate once under the
    official revenue-weighted WRMSSE — the competition's own ruler — with
    bottom WAPE, bias, stability, per-level, and zero-day metrics around it.
  figures: [m5_full_per_level_wrmsse]
- id: results
  text_md: |
    **The headline ranking is in the ranked-bars figure: convex ensemble
    0.6161, best single 0.6217, floor 0.8929** on the scored-once competition
    window. Read the bars as a full-scale reversal, not a blowout:

    - The three pooled arms (0.6217 / 0.6313 / 0.6575) all land ahead of
      the global model (0.6601) — at 30,490 series, one fit per store,
      cell, or department beats a single global fit, the inverse of the
      subset-era finding, where pooling starved each fit.
    - The Tweedie arm posts 0.6473 and AutoETS 0.7093.
    - The blend keeps the pooled edge — 0.60 store×category + 0.10 store +
      0.30 department — for a −31.0% cut against the floor.

    And the honest gap: on zero-actual days the floor stays right 66.6% of
    the time against the ensemble's 57.3%. Full scale does not fix quiet
    days; it prices them into the hierarchy.

    The spike-capture refinement round, stated as measured. The erratic
    quadrant — dense yet violent series — received its own candidate: the
    pooled fit re-trained with each series' best sales days up-weighted,
    swappable in wherever the past windows preferred it. On a capped
    development window the swap won its quadrant (erratic win-rate 0.845
    against the floor, vs the blend's 0.839) but cost too much everywhere
    else: pooled WRMSSE 0.621 against the blend's 0.601, twice the noise
    band. The adoption gate rejected it, the committed champion stands, and
    the full-panel re-run is scheduled — a designed negative result, not a
    hidden one.

    **Business summary:** Final ranking: ensemble 0.6161 vs the 0.8929 floor
    (−31.0%); pooled fits beat the global model at full scale, with the win
    made at aggregate levels, not item level.
  figures: [m5_full_candidate_ranking]
- id: conclusions
  text_md: |
    ## Results summary

    On the full Walmart M5 panel — 30,490 series through a 42,840-node
    hierarchy, scored once on the competition window — the
    stability-screened convex ensemble posts an official WRMSSE of 0.6161
    against the seasonal-naive floor's 0.8929 (−31.0%), on the same scheme
    the competition reports (its winner: −22.4% over benchmark) — in the
    winning ballpark at full scale. See the
    [full evaluation report](https://amm-ds.github.io/portfolio/projects/02-demand-forecasting/)
    or [try the live demo](https://amm-ds.github.io/portfolio/demos/forecast-workbench/).

    ## What the experiment taught

    - Pooling won at full scale: one fit per store, store-by-category cell, or
      department beat a single global fit — the inverse of the subset-era
      finding, where pooling starved each fit.
    - The stability screen did its job: mean + 1.0×std over the two selection
      origins picked a stable three-member blend, not a lucky one.
    - Scored-once discipline was the price of a believable headline: choose on
      two origins, grade exactly once on the competition window.
    - Full scale does not fix quiet days: on zero-actual days the floor stays
      right 66.6% of the time against the ensemble's 57.3%.
    - Spike amplitude is not free at full scale: a spike-capture arm won the
      erratic quadrant on a capped window yet over-forecasted the panel
      (pooled WRMSSE 0.621 vs 0.601, twice the noise band), so the adoption
      gate kept the committed blend — measured, rejected, reported.
    - The remaining debt is priced, not hidden: a thin screen, no bootstrap CIs,
      and unmodeled stockouts bound what the −31.0% claim means.

    ## Exact numbers

    Headline candidates on the scored-once test origin (official hierarchical
    WRMSSE; vs floor = relative cut; stability = population std over the 2
    selection origins; `lgbm` is the global single-fit model):

    | candidate | official WRMSSE | vs floor | bottom WAPE | bias | stability |
    |---|---|---|---|---|---|
    | **convex_ensemble (champion)** | **0.6161** | **−31.0%** | **0.7633** | **+0.0328** | **0.0001** |
    | lgbm_pool_store (best single) | 0.6217 | −30.4% | 0.7641 | +0.0265 | 0.0126 |
    | lgbm | 0.6601 | −26.1% | 0.7626 | +0.0041 | 0.0210 |
    | auto_ets | 0.7093 | −20.6% | 0.7710 | −0.0063 | 0.0161 |
    | seasonal_naive (floor) | 0.8929 | — | 0.9159 | −0.0120 | 0.0108 |

    Ensemble composition: lgbm_pool_storecat × 0.60 + lgbm_pool_store × 0.10 +
    lgbm_pool_dept × 0.30 — the best three of the six-candidate pool by the
    stability screen (mean + 1.0 × population std of the per-origin official
    WRMSSE over the 2 selection origins), weights on a 0.05 simplex grid
    minimising the same screen.

    ## Protocol

    - Full M5 panel (protocol `m5_full_v1`): 30,490 bottom series × 1,969 days;
      hierarchy of 12 levels, 42,840 revenue-weighted nodes.
    - Origins: 3 weekly (7-day spacing) — 2016-05-08 and 2016-05-15 select;
      2016-05-22 (the competition window) scores once; horizon 28 days, at least
      1,096 training days.
    - Candidates: 8 — seasonal_naive floor; global LightGBM (mlforecast recursive,
      tuned committed config, seed 42); Tweedie-loss twin; pooled fits per store
      (10 groups), per store×category (30), per department (7); per-series
      AutoETS; stability-screened convex ensemble.
    - Classes and metrics: Syntetos-Boylan ADI/CV² (1.32 / 0.49) — 2,754 dense,
      27,736 intermittent; official hierarchical WRMSSE, bottom WAPE, bias,
      stability, per-level WRMSSE, zero-day accuracy. Runtime: 46,509 s — about
      12.9 hours on one machine, deterministic on re-run.

    ## Limits

    - Thin selection screen: ensemble members and weights were chosen on only 2
      selection origins, and no bootstrap CIs exist — the −31.0% cut is not
      interval-bounded.
    - On zero-actual days the floor still wins — 66.6% vs 57.3% accuracy — full
      scale prices intermittency into the hierarchy; it does not remove it.
    - The demo band is the per-day min/max envelope of the blend members — an
      envelope, not a calibrated prediction interval.
    - Neural global models (N-HiTS, TFT, Chronos-class foundation models) are
      not benchmarked — a documented next step, not a hidden one.
    - Stockouts, promotions, and returns are unmodeled — no savings or
      safety-stock claim.

    ```mermaid
    graph LR
      Q{"Full-panel, hierarchical M5 demand?"}
      Q -->|"yes"| E["Convex ensemble<br/>of pooled fits"]
      E --> X["Weekly reforecast<br/>floors + scored-once windows"]
    ```

    **Business summary:** The full-panel ensemble lands at 0.6161 against
    the 0.8929 floor (−31.0% on the official scheme), with a thin selection
    screen, no bootstrap CIs, quiet days still owned by the floor.
  figures: []
key_concepts:
  - "**Official hierarchical WRMSSE** — the competition's own metric: every node's error is scaled by its train-window volatility, revenue-weighted, and averaged with equal total weight per level across all 42,840 nodes."
  - "**Multi-level pooling** — fitting one LightGBM per store, per store×category cell, or per department shares strength across similar series; at full scale it beats one global fit."
  - "**Tweedie loss** — a compound-Poisson-style likelihood for intermittent counts, adopted from the winning solution as a diversity arm."
  - "**Stability-screened selection** — picking ensemble members by mean + 1.0×std of the per-origin score over the selection origins, so a stable blend beats a lucky one."
  - "**Intermittent-demand reality** — 91% of the panel's series are intermittent and 59.5% of days are zero; quiet days decide full-scale accuracy and the floor still wins them."
  - "**Scored-once evaluation** — candidates are chosen on past origins and graded exactly once on the competition window, because random splits leak the future into training."
