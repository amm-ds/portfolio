  m5:win_rate: "M5 per-series wins against seasonal naive on the scored test origins: ensemble 88.8% pooled, 88.6% dense, and 89.8% intermittent. Candidates span 82.8–88.8%, so the pooled margin and per-series coverage tell different parts of the result."
  m5:band_calibration: "M5 per-series scaled split-conformal 80% bands on scored test origins. LightGBM covers 77.7% at 13.535 units mean width (76.9% dense / 80.6% intermittent); the ensemble covers 77.7% at 13.342, slightly below target."
  m5:horizon_growth: "Horizon-wise MAE on the scored test origins: error grows sub-linearly with horizon, and at h=28 the committed LightGBM sits 0.85 units per day below the seasonal naive (5.61 vs 6.46)."
  uci:multistep_routing: "Routing effect per class on scored origins — all-HGB MAE minus routed MAE, 95% paired bootstrap CI over series and origins: erratic +22.88 [11.83, 35.21] and lumpy +3.98 [3.34, 4.76]. Positive values mean routing helps."
  eda_series_overview: "Four representative daily series from the seeded synthetic CI hierarchy—not M5 or UCI. Each combines a slow trend with a weekly cycle, the structures the fast-path models must capture."
  eda_units_distribution: "Daily units pooled over the 24 synthetic CI series. The wide, right-skewed levels explain why one global mean scores MAE 31.8 and why series-aware features are tested."
  hpo_history: "Seeded 56-trial Optuna history for sklearn HGB on the synthetic track: CV MAE improves modestly from 8.619 (default) to 8.529 (best). This tuning result is not attributed to M5 or UCI."
  hpo_importance: "Hyperparameter importance for the same synthetic HGB study. Regularization dominates, with the top two parameters carrying 66% of search importance."
  uci:fold_stability: "Out-of-fold MAE for the UCI nowcast ladder, with the frozen test window marked. All models degrade on later folds, exposing drift before deployment."
