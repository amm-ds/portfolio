project_id: 02-demand-forecasting
short_version: "M5 full panel: 30,490 series, one scored test origin (final 28 days) with official 42,840-node WRMSSE. Pooled LightGBM ensemble: 0.6161 vs seasonal-naive 0.8929 (−31.0%); no bootstrap interval bounds the result; quiet days favor the floor."
sections:
- id: background
  text_md: |
    **How far can a learned forecaster beat the simple weekly rule on
    Walmart's full M5 panel?** The M5 data covers 30,490 daily sales series,
    one per item-store, over 1,969 days. LightGBM is a machine-learning method
    combining decision trees. This project blends several LightGBM models into
    one forecast at full scale.

    The official score is WRMSSE, or weighted root mean squared scaled error.
    It measures error across 42,840 products and product groups (nodes) in a
    hierarchy of totals and subtotals. Higher-revenue nodes carry more weight.
    The seasonal-naive floor repeats last week's sales per weekday.

    ```diagram 02-m5-pipeline
    ```

    Follow the diagram from raw sales to one forecast. Its final block scores
    the last 28 days once: the blend reaches an official WRMSSE of 0.6161
    against the floor's 0.8929, a 31.0% error reduction.

    **Business summary:** On the full M5 panel, the blend cuts official WRMSSE
    against the seasonal-naive floor.
  figures: []
- id: objectives
  text_md: |
    **The goal is a forecast that a replenishment planner can defend.** A
    replenishment planner decides how much stock to reorder. The test is not
    whether a complex model can win once. It is whether that model beats the
    simple seasonal rule across the full panel under a fair, repeatable test.

    ```diagram auto-02-demand-forecasting-1
    ```

    Read the diagram from left to right. Every candidate follows the same
    route. A stability screen prefers candidates with low, consistent error at
    two earlier cutoff dates. The final window cannot influence that choice.
    The last block pairs the headline score with checks for over-forecasting,
    under-forecasting, hierarchy level, and quiet days.

    Success means:

    - Beat the seasonal-naive floor at full scale where past data supports it.
    - Build every model input from information available before the forecast date.
    - Choose on the past and score the final window once.
    - Report where the simple rule still wins.

    **Business summary:** The diagram sets one test for every candidate:
    stable selection on past data, one final WRMSSE score, and supporting
    checks for direction, hierarchy level, and quiet days.
  figures: []
- id: data
  text_md: |
    **The complete panel, with a fixed time split.** Before the evaluation
    contract shown below, the input is the full Walmart M5 accuracy panel:

    - 30,490 daily store-item series across 10 stores, 3 categories, and 7
      departments. The dates run from 2011-01-29 to 2016-06-19, with
      47,649,940 rows and 59.5% zero-demand days.
    - The source is the Nixtla `datasetsforecast` mirror of the competition
      archive. A pinned SHA-256 checksum, a digital fingerprint of the files,
      keeps the source fixed. See [Makridakis et al., IJF
      2022](https://doi.org/10.1016/j.ijforecast.2021.11.013) and the
      [dataset card](https://amm-ds.github.io/portfolio/data-registry/m5-nixtla-mirror/).
    - The hierarchy adds the bottom series up through 12 levels, producing
      42,840 nodes. Evaluation gives each level equal total weight and uses
      revenue weights within it.

    ```diagram auto-02-demand-forecasting-2
    ```

    Apply the diagram's three stops to every series in that panel. An origin
    is a cutoff date that separates training history from the days being
    forecast. The origins on 2016-05-08 and 2016-05-15 select ensemble members
    and weights. The origin on 2016-05-22 starts the final 28-day competition
    window, which scores every candidate exactly once.

    This separation blocks random splits, which could mix future information
    into training and make the reported gap unverifiable.

    **Business summary:** All 30,490 series pass through the diagram's same
    contract: two past origins for selection and one 28-day competition window
    for final scoring.
  figures: []
- id: eda
  text_md: |
    **Most series have long quiet stretches.** Intermittent demand means that
    sales occur only occasionally. The Syntetos-Boylan rule classifies these
    patterns with two measures. ADI, or average demand interval, is the typical
    gap between nonzero sales. CV², or squared coefficient of variation,
    measures how much nonzero sales vary around their average.

    Using thresholds of 1.32 for ADI and 0.49 for CV² on history up to the last
    selection origin, 27,736 of 30,490 series are intermittent. That is 91%.
    Only 2,754 are dense, meaning they sell regularly. Across the panel, 59.5%
    of days have zero demand.

    The sample-series figure makes these panel-wide patterns concrete. Look at
    all three panels:

    - The top-units series has a strong weekly shape that a model can learn.
    - The hardest intermittent series stays at zero for weeks.
    - The mid-volume series fluctuates around quiet days.

    Those visible quiet stretches explain why zero-day accuracy needs a separate
    check. On days with zero actual sales, zero-day accuracy is 66.6% for the
    floor against 57.3% for the ensemble. That caveat is not visible in the
    three ensemble forecast curves, so it must sit beside the headline result.

    **Business summary:** The sample figure shows the challenge behind the
    counts: 91% of series are intermittent and 59.5% of days are zero. Quiet
    days still favor the floor.
  figures: [m5_full_sample_series]
- id: training
  text_md: |
    **Eight candidates, one selection rule, one blend.** The candidates are:

    - The seasonal-naive floor.
    - One global LightGBM fit across all 30,490 series. Recursive forecasting
      extends the forecast day by day using earlier predictions. The `mlforecast`
      inputs are lags, meaning past sales values; 7/14/21/28-day rolling means;
      calendar, price, and event inputs; and SNAP, an indicator for days when
      food-assistance purchases are allowed. The tuned settings use seed 42,
      which fixes random choices.
    - A `Tweedie` twin. Tweedie loss is a training objective suited to sparse
      counts with many zeros.
    - Three pooled fits, which share training data across related series. There
      is one per store (10 groups), one per store×category cell (30), and one
      per department (7). Each grouping pools related series at a different level.
    - Per-series `AutoETS`, an automated exponential-smoothing method that
      weights older and recent observations differently. The eighth candidate
      is the convex ensemble, a blend whose non-negative weights sum to one.

    ```diagram auto-02-demand-forecasting-3
    ```

    Follow the selection diagram from left to right. Six eligible candidates
    receive WRMSSE scores at two selection origins. They are ranked by mean
    score plus 1.0 times the standard deviation, which measures variation
    between origins. The best three enter a 0.05 weight grid and become the
    0.60/0.10/0.30 ensemble. Neither selection step reads the test origin.

    The code shows the key order: combine bottom-level forecasts first, then
    score that blend across the hierarchy. Member scores are never averaged.

    ```python
    def _screen(vals: np.ndarray) -> float:
        vals = np.asarray(vals, dtype=float)
        return float(np.mean(vals) + ENSEMBLE_STABILITY_LAMBDA * np.std(vals))

    def _blend_wrmsse_per_origin(
        member_preds: list[np.ndarray],
        weights_w: np.ndarray,
        origin_ctx: dict[int, dict[str, Any]],
    ) -> np.ndarray:
        out = np.empty(len(origin_ctx))
        for k, o in enumerate(origin_ctx):
            combo = np.zeros_like(member_preds[0][k])
            for wi, p in zip(weights_w, member_preds, strict=True):
                combo += wi * p[k]
            out[k] = origin_ctx[o]["wrmsse_fn"](combo)
        return out
    ```

    This [selection code](https://github.com/amm-ds/portfolio/blob/main/projects/02-demand-forecasting/src/demand_forecasting/m5_full.py)
    uses fixed seeds or direct statistical solutions and a fixed group order,
    so a re-run produces the same bytes.

    In `m5_full_pooling_panel`, compare signed bias and zero-day accuracy across
    all eight candidates on the scored-once full panel. Positive bias means
    over-forecasting; a zero-day forecast below 0.5 counts as correct. The floor
    leads quiet-day accuracy at 66.6%, versus 57.3% for the blend, so the pooling
    win in official WRMSSE does not mean every operational check improves. The
    complete diagrammed run takes about 12.9 hours on one machine.

    **Business summary:** The selection diagram chooses three pooled fits from
    eight candidates by mean + 1.0×std at two past origins. It never uses the
    test window.
  figures: [m5_full_pooling_panel]
- id: evaluation
  text_md: |
    **One official score, with checks for different decisions.** WRMSSE compares
    forecast error with each node's usual variation in training data. Revenue
    weights give higher-revenue nodes more influence. Each level carries equal
    total weight across all 42,840 nodes. Lower is better.

    Supporting metrics show what the headline hides:

    - Bottom WAPE, or weighted absolute percentage error, divides total absolute
      error by total actual volume for the individual store-item series.
    - Bias is average signed error, showing whether forecasts run high or low.
    - Per-origin spread measures stability between selection cutoffs.
    - Per-level scores locate the gain within the hierarchy.
    - Zero-day accuracy measures performance on days with no sales.

    ```diagram auto-02-demand-forecasting-4
    ```

    Follow the diagram from the 30,490 bottom forecasts through all 12 levels.
    At each node, RMSSE, or root mean squared scaled error, compares forecast
    error with training-history variation. Revenue weights then produce the
    single WRMSSE score on one final pass.

    The supported comparison is internal: every candidate uses this same metric,
    hierarchy, and scored-once window. No competition-winner or leaderboard
    equivalence is claimed because this project does not evaluate an external run.

    In the per-level figure, compare the blend and floor bars at each level.
    The blend's margin is broadest at aggregate levels: total-sales WRMSSE is
    0.350 for the blend against the floor's 0.560. At item level, learned
    candidates cluster between 1.04 and 1.15 while the floor sits at 1.38–1.39
    because series-level noise dominates. The widening bars toward the top show
    where the win comes from.

    Neither the diagram nor the figure measures savings. Stockouts, promotions,
    and returns sit outside the model, so no safety-stock or cost claim follows.

    **Business summary:** The evaluation diagram scores every candidate once
    with official WRMSSE. The per-level figure locates the gain, while WAPE,
    bias, stability, and zero-day checks expose different failure modes.
  figures: [m5_full_per_level_wrmsse]
- id: results
  text_md: |
    **The ranked-bars figure gives the final official-WRMSSE result: convex
    ensemble 0.6161, best single 0.6217, floor 0.8929** on the scored-once
    competition window.
    Compare the bars directly:

    - The three pooled arms score 0.6217 / 0.6313 / 0.6575. All beat the global
      model's 0.6601, so one fit per store, cell, or department works better
      than a single global fit across 30,490 series.
    - The Tweedie arm scores 0.6473 and AutoETS scores 0.7093.
    - The blend combines 0.60 store×category + 0.10 store + 0.30 department.
      Its 0.6161 score is a 31.0% reduction against the floor.

    The overall bars do not show the remaining quiet-day weakness. On
    zero-actual days, zero-day accuracy stays with the floor: 66.6% against
    the ensemble's 57.3%. Full scale prices those days into the hierarchy but
    does not fix them.

    A separate measured experiment tested spike capture for the erratic quadrant,
    meaning dense series with severe swings. The pooled fit gave each series'
    best sales days more influence during training and could replace the usual
    fit where past windows preferred it. On a capped development window, meaning
    a smaller past-only evaluation, the swap won its erratic quadrant against
    the floor.

    The wider result did not hold up: the pooled fit scored twice the noise
    band worse than the blend on WRMSSE. An adoption gate, a rule that rejects
    a candidate
    when the wider result worsens, rejected it. This arm is absent from the
    ranking figure because its evidence comes only from that capped window. Its
    full-panel performance remains unproven, and the final ensemble stays 0.6161.

    **Business summary:** The ranking figure shows the ensemble at 0.6161 versus
    the 0.8929 floor, a 31.0% reduction. Pooled fits beat the global model, with
    the gain concentrated at aggregate levels.
  figures: [m5_full_candidate_ranking]
- id: conclusions
  text_md: |
    ## Results summary

    The closing diagram summarizes the practical choice: for full-panel,
    hierarchical M5 demand, use a convex ensemble of pooled fits and weekly
    reforecasting with the same floor and scored-once windows. The exact evidence
    and limits below define what that choice supports.

    Across 30,490 series and a 42,840-node hierarchy, the ensemble's official
    WRMSSE is 0.6161 against the seasonal-naive floor's 0.8929 on the scored-once
    competition window. That is a 31.0% reduction on the competition's scheme.
    This is an internal baseline comparison, not evidence of leaderboard rank or
    equivalence to the competition winner. See the
    [full evaluation report](https://amm-ds.github.io/portfolio/projects/02-demand-forecasting/)
    or [try the live demo](https://amm-ds.github.io/portfolio/demos/forecast-workbench/).

    ## What the experiment taught

    - The diagram's pooled ensemble is supported at full scale: fits per store,
      store-by-category cell, or department beat one global fit.
    - Its stability screen selected a three-member blend by mean + 1.0×std over
      two selection origins, rather than rewarding one lucky origin.
    - Its scored-once windows keep the headline believable: choose on two origins
      and grade exactly once on the competition window.
    - The full-panel choice still loses on quiet days. On zero-actual days,
      zero-day accuracy stays with the floor: 66.6% against the ensemble's 57.3%.
    - Spike capture remains a measured negative result. It won the erratic
      quadrant on a capped window but over-forecasted the wider panel, with
      a pooled-WRMSSE setback of twice the noise band. The adoption gate
      rejected it, so no full-panel improvement is claimed.
    - The 31.0% reduction has bounded support. The screen uses only two origins,
      no bootstrap confidence intervals exist, and stockouts are unmodeled.

    ## Exact numbers

    Headline candidates on the scored-once test origin. Official hierarchical
    WRMSSE is defined above; vs floor is the relative reduction; stability is the
    population standard deviation over the 2 selection origins; `lgbm` is the
    global single-fit model.

    | candidate | official WRMSSE | vs floor | bottom WAPE | bias | stability |
    |---|---|---|---|---|---|
    | **convex_ensemble (champion)** | **0.6161** | **−31.0%** | **0.7633** | **+0.0328** | **0.0001** |
    | lgbm_pool_store (best single) | 0.6217 | −30.4% | 0.7641 | +0.0265 | 0.0126 |
    | lgbm | 0.6601 | −26.1% | 0.7626 | +0.0041 | 0.0210 |
    | auto_ets | 0.7093 | −20.6% | 0.7710 | −0.0063 | 0.0161 |
    | seasonal_naive (floor) | 0.8929 | — | 0.9159 | −0.0120 | 0.0108 |

    The diagram's ensemble composition is lgbm_pool_storecat × 0.60 +
    lgbm_pool_store × 0.10 + lgbm_pool_dept × 0.30. These are the best three of
    the six-candidate pool by the stability screen: mean + 1.0 × population std
    of per-origin official WRMSSE over the 2 selection origins. Weights on a 0.05
    simplex grid, meaning non-negative weights summing to one in steps of 0.05,
    minimize the same screen.

    ## Protocol

    - Full M5 panel (protocol `m5_full_v1`): 30,490 bottom series × 1,969 days;
      hierarchy of 12 levels, 42,840 revenue-weighted nodes.
    - Origins: 3 weekly cutoffs with 7-day spacing. The 2016-05-08 and 2016-05-15
      origins select; 2016-05-22 starts the competition window and scores once.
      The horizon is 28 days, with at least 1,096 training days.
    - Candidates: 8. Seasonal_naive floor; global LightGBM (mlforecast recursive,
      tuned settings, seed 42); Tweedie-loss twin; pooled fits per store
      (10 groups), per store×category (30), per department (7); per-series
      AutoETS; stability-screened convex ensemble.
    - Classes and metrics: Syntetos-Boylan ADI/CV² (1.32 / 0.49), with 2,754 dense
      and 27,736 intermittent series; official hierarchical WRMSSE, bottom WAPE,
      bias, stability, per-level WRMSSE, and zero-day accuracy. Runtime is 46,509
      seconds, about 12.9 hours on one machine. A re-run reproduces the output.

    ## Limits

    - The selection screen is thin. Members and weights use only 2 selection
      origins. No bootstrap CIs, meaning resampling-based confidence intervals,
      exist, so the 31.0% reduction has no interval bound.
    - On zero-actual days the floor still wins, 66.6% versus 57.3% accuracy.
      Full scale prices intermittency into the hierarchy but does not remove it.
    - The demo band is the per-day minimum/maximum envelope of the blend members.
      It shows their spread, not a calibrated prediction interval with measured
      coverage.
    - N-HiTS and TFT are neural-network forecasting architectures. Chronos-class
      foundation models are large pretrained forecasting models. None is
      benchmarked, so their results remain unproven.
    - Stockouts, promotions, and returns are unmodeled. The diagram's weekly
      reforecasting choice therefore supports no savings or safety-stock claim.

    ```diagram auto-02-demand-forecasting-5
    ```

    **Business summary:** The closing diagram's pooled ensemble reaches 0.6161
    against the 0.8929 floor, a 31.0% reduction on the official scheme. Use it
    for full-panel, weekly-reforecast M5 demand, and re-check the choice where
    quiet-day accuracy outranks aggregate WRMSSE or once bootstrap intervals
    bound the gap.
  figures: []
key_concepts:
  - "**Official hierarchical WRMSSE**: The competition metric scales each node's error by train-window volatility, applies revenue weights, and averages with equal total weight per level across all 42,840 nodes."
  - "**Multi-level pooling**: One LightGBM fit per store, store×category cell, or department shares information across similar series. At full scale, these fits beat one global fit."
  - "**Tweedie loss**: A training objective based on a compound-Poisson-style likelihood for intermittent counts, used as a diverse candidate in the internal model comparison."
  - "**Stability-screened selection**: Members are chosen by mean + 1.0×std of per-origin scores across the selection origins, favoring a stable blend over a lucky one."
  - "**Intermittent demand**: Sales occur only occasionally. This describes 91% of the panel's series, while 59.5% of days are zero. Quiet days strongly affect accuracy, and the floor still wins them."
  - "**Scored-once evaluation**: Candidates are chosen on past origins and graded exactly once on the competition window. Random splits could leak future information into training."
