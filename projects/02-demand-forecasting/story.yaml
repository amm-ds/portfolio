project_id: 02-demand-forecasting
short_version: 'M5 full panel: 30,490 series, one scored test origin (final 28 days) with official 42,840-node WRMSSE. Pooled
  LightGBM ensemble: 0.6211 vs seasonal-naive 0.8929 (−30.4%); level 95% CI [0.5588, 0.6974]; quiet days favor the
  floor.'
sections:
- id: background
  text_md: |
    **How far can a learned forecaster beat last week's sales on Walmart's full `M5` panel?**
    The panel tracks `30,490` daily item-store series over `1,969` days, scored across `42,840` hierarchy nodes by `WRMSSE` (revenue-weighted error).

    ```diagram 02-m5-pipeline
    ```

    Follow the pipeline in three steps:

    - **Pool & fit:** Compare eight candidates, including five `LightGBM` fits, on nine past origins.
    - **Blend & hold out:** Select three pooled members, although the winning weights leave only two active; reserve the final `28` days for the headline.
    - **Outcome:** The blend reaches `0.6211` `WRMSSE` versus `0.8929` for `seasonal_naive` (`−30.4%`).

    Next, we set the contract behind that score ([Objectives →](#sec-objectives)).

    **In plain terms:** Across 30,490 Walmart product series, a 95/5 blend of two pooled models cuts forecast error by 30.4% compared with repeating last week's sales.
  figures: []
- id: objectives
  text_md: |
    **A replenishment planner must be able to defend the forecast.** The model must beat a simple seasonal rule across the full panel. The test must be repeatable. One lucky split is not enough.

    ```diagram auto-02-demand-forecasting-1
    ```

    Nine earlier cutoffs select members and weights. Their rule combines mean error and variation. The final window does not affect that choice. A later challenger gate did reread the test window. We disclose that exception and its negative result.

    | target | committed result |
    |---|---|
    | Beat the seasonal-naive floor | `0.6211` versus `0.8929` `WRMSSE` |
    | Use only information available before each forecast | Lags, rolling features, and dated origins |
    | Separate selection from the headline | `9` selection origins plus `1` test origin |
    | Report where the floor still wins | Zero-day accuracy: `66.6%` floor, `57.2%` blend |

    Next, we pin the panel and its time splits so every candidate faces the same input ([Data →](#sec-data)).

    **In plain terms:** Nine past dates choose the model and one final 28-day window supplies the headline. The checks cover both revenue-weighted error and quiet zero-sale days.
  figures: []
- id: data
  text_md: |
    **The complete panel has a fixed time split.** The input is the full Walmart `M5` accuracy panel:

    - `30,490` daily store-item series across `10` stores, `3` categories, and `7` departments. Dates run from 2011-01-29 to 2016-06-19, with `47,649,940` rows and `59.5%` zero-demand days.
    - The source is the Nixtla `datasetsforecast` mirror of the competition archive. A pinned `SHA-256` checksum keeps the source fixed. See [Makridakis et al., IJF 2022](https://doi.org/10.1016/j.ijforecast.2021.11.013) and the [dataset card](https://amm-ds.github.io/portfolio/data-registry/m5-nixtla-mirror/).
    - The hierarchy aggregates the bottom series through `12` levels, producing `42,840` nodes. Each level receives equal total weight, with revenue weights within it.

    ```diagram auto-02-demand-forecasting-2
    ```

    An origin is a cutoff between training history and the next `28` forecast days. Nine weekly origins from 2016-03-20 through 2016-05-15 select ensemble members and weights. The origin on 2016-05-22 starts the final competition window used for the champion's headline score. This dated separation prevents random splits from mixing future information into training.

    Next, we audit intermittent demand and the quiet-day risk it creates ([EDA →](#sec-eda)).

    **In plain terms:** All 30,490 Walmart product series follow one timeline: nine past cutoffs choose the blend, and the final 28 days measure its headline result.
  figures: []
- id: eda
  text_md: |
    **Most series have long quiet stretches.** Intermittent demand means that
    sales occur only occasionally. The Syntetos-Boylan rule classifies these
    patterns with two measures. ADI, or average demand interval, is the typical
    gap between nonzero sales. CV², or squared coefficient of variation,
    measures how much nonzero sales vary around their average.

    Using thresholds of `1.32` for ADI and `0.49` for CV² on history up to the last
    selection origin, `27,736` of `30,490` series are intermittent. That is 91%.
    Only `2,754` are dense, meaning they sell regularly. Across the panel, `59.5%`
    of days have zero demand.

    The `m5_full_sample_series` figure makes the panel-wide patterns concrete
    at the series level: the top-units
    series has a strong weekly shape that a model can learn, the hardest
    intermittent series stays at zero for weeks, and the mid-volume example is
    smooth with no zero days.

    Those quiet stretches explain why zero-day accuracy needs a separate
    check. On days with zero actual sales, zero-day accuracy is `66.6%` for the
    floor against `57.2%` for the ensemble. That caveat is not visible in
    aggregate error metrics, so it must sit beside the headline result.

    The quiet-stretch caveat frames the candidate design. The eight
    candidates and the stability screen come next ([Training →](#sec-training)).

    **In plain terms:** 91% of products sell only sporadically and nearly 60% of all days have zero sales—making quiet days hard to beat with complex models.
  figures: [m5_full_sample_series]
- id: training
  text_md: |
    **Eight candidates share one selection rule.** They do not share one forecasting strategy. Five candidates use `LightGBM`. The others are the seasonal floor, `AutoETS`, and the convex ensemble.

    - The global `LightGBM` fit spans all `30,490` series and forecasts recursively, feeding earlier predictions into later days. Its inputs include lags `1/7/14/21/28`. Rolling means use windows `7/28/56/84`. Rolling standard deviations use `7/28` at lag `1` and `7` at lag `7`. Other inputs are an expanding mean, calendar fields, price, events, and food assistance. The tuned settings use seed `42`.
    - A `Tweedie` twin uses an objective suited to sparse counts with many zeros.
    - Three pooled fits share rows within each store (`10` groups), store×category cell (`30`), or department (`7`). Each pooled arm fits one model per forecast horizon. The global arm instead feeds its predictions back recursively. Their score gap therefore mixes grouping with strategy. It does not isolate pooling.
    - Per-series `AutoETS` supplies a statistical challenger. The eighth candidate is the convex ensemble, whose non-negative weights sum to one.

    ```diagram auto-02-demand-forecasting-3
    ```

    Six eligible candidates receive `WRMSSE` scores at nine selection origins. The rank is mean score plus `1.0` times the score spread. The best three enter a `0.05` weight grid. This produces the `0.95/0.00/0.05` ensemble. Selection never reads the test origin.

    The code combines bottom-level forecasts before scoring that blend across the hierarchy; it never averages member scores.

    ```python
    def _screen(vals: np.ndarray) -> float:
        vals = np.asarray(vals, dtype=float)
        return float(np.mean(vals) + ENSEMBLE_STABILITY_LAMBDA * np.std(vals))

    def _blend_wrmsse_per_origin(
        member_preds: list[np.ndarray],
        weights_w: np.ndarray,
        origin_ctx: dict[int, dict[str, Any]],
    ) -> np.ndarray:
        out = np.empty(len(origin_ctx))
        for k, o in enumerate(origin_ctx):
            combo = np.zeros_like(member_preds[0][k])
            for wi, p in zip(weights_w, member_preds, strict=True):
                combo += wi * p[k]
            out[k] = origin_ctx[o]["wrmsse_fn"](combo)
        return out
    ```

    This [selection code](https://github.com/amm-ds/portfolio/blob/main/projects/02-demand-forecasting/src/demand_forecasting/m5_full.py) uses fixed seeds and a fixed group order. Its statistical solutions are direct. A rerun therefore produces the same bytes.

    In `m5_full_pooling_panel`, positive bias means over-forecasting and a zero-day forecast below `0.5` counts as correct. The floor leads quiet-day accuracy at `66.6%`, versus `57.2%` for the blend. The committed metadata records `1,348,530.6` seconds of summed runtime. It does not support a single-machine wall-clock estimate.

    Next, we use the official score and supporting checks to locate the gain ([Evaluation →](#sec-evaluation)).

    **In plain terms:** Nine past dates select three pooled candidates, but one receives zero weight. The shipped forecast is therefore a 95/5 blend of two models, chosen without reading the final 28 days.
  figures: [m5_full_pooling_panel]
- id: evaluation
  text_md: |
    **One official score needs several supporting checks.** `WRMSSE` scales each node's error by its past spread. Higher-sales nodes weigh more. All `12` levels carry equal weight across `42,840` nodes. Lower is better.

    Bottom `WAPE` divides total error by total actual sales. Bias shows whether forecasts run high or low. Origin spread tracks selection stability. Per-level scores locate gains. Zero-day accuracy checks days with no sales.

    ```diagram auto-02-demand-forecasting-4
    ```

    The `30,490` bottom forecasts aggregate through all `12` levels. At each node, root mean squared scaled error compares error with past variation. Revenue weights then produce one `WRMSSE` score. Every candidate uses the same metric, hierarchy, and final window. We claim no external leaderboard equivalence.

    `m5_full_per_level_wrmsse` separates relative and absolute gains. At total level, the blend scores `0.314` against the floor's `0.560`. That is a `43.9%` relative cut and an absolute gap of `0.246`. The item-store level has the largest absolute gap, about `0.341`. At the three item-grain levels, learned candidates score between `1.04` and `1.15`. The floor sits at `1.38`–`1.39`.

    Neither the diagram nor the figure measures savings. Stockouts, promotions, and returns sit outside the model. No safety-stock or cost claim follows.

    Next, we compare the final ranking with the two measured challengers and their rejection gates ([Results →](#sec-results)).

    **In plain terms:** The blend beats last week's sales overall, but not at every level or on every check. The largest proportional gain is at company total; the largest absolute gain is at item-store level.
  figures: [m5_full_per_level_wrmsse]
- id: results
  text_md: |
    **The blend leads the best single fit by under `0.001` `WRMSSE`.** On the competition window, `m5_full_candidate_ranking` gives convex ensemble `0.6211`, best single `0.6219`, and floor `0.8929` official `WRMSSE`.

    - The three pooled arms score `0.6219` / `0.6225` / `0.6459`, ahead of the global model's `0.6601`. Because the pooled arms are direct and the global arm recursive, this comparison does not isolate pooling as the cause.
    - The Tweedie arm scores `0.6473` and `AutoETS` scores `0.7093`.
    - The blend combines `0.95` store×category + `0.00` store + `0.05` department. Its edge over the best single is about `1.3` times the routed arm's `0.000644` noise band. The single fit also has slightly better bottom `WAPE` (`0.7617` versus `0.7623`) and bias (`+0.0177` versus `+0.0222`).

    A spike-capture variant for erratic series was rejected twice: on development (`+0.0204` `WRMSSE`) and on the test window (`+0.0025`, CI `[0.0018, 0.0031]`, about `3.9` times the noise band). That test-window check was a second use of the window; the headline model did not change.

    A later `Huber` variant never reached the test window. Screening stopped it after the first of nine selection origins, at `0.8683` against `0.7409` for the champion. Neither challenger appears in the main candidate ranking; only spike capture has a full test result, while the `Huber` claim is limited to that one origin.

    Next, we consolidate the exact values, protocol exceptions, and limits behind the recommendation ([Conclusions →](#sec-conclusions)).

    **In plain terms:** A 95/5 blend of two pooled models cuts overall error by 30.4% against last week's sales, but its edge over the best single model is tiny. Two attempts to improve erratic products were rejected.
  figures: [m5_full_candidate_ranking]
- id: conclusions
  text_md: |
    ## Results summary

    **Use the screened pooled blend for this internal full-panel baseline, with its quiet-day and selection limits attached.** Across `30,490` series and `42,840` hierarchy nodes, official `WRMSSE` is `0.6211` against the seasonal-naive floor's `0.8929` on the competition window. This is not evidence of external leaderboard rank. See the [full evaluation report](https://amm-ds.github.io/portfolio/projects/02-demand-forecasting/) or [try the live demo](https://amm-ds.github.io/portfolio/demos/forecast-workbench/). The demo and sample curves show the scored `0.6211` blend; they previously carried an earlier `0.6161` blend with weights `0.60/0.10/0.30` from a superseded run.

    ## What the experiment taught

    - Three direct pooled fits beat the recursive global fit, but that comparison changes grouping and forecasting strategy together.
    - The nine-origin stability screen selected three members; zero weight on one makes the result an effectively two-model `95/5` blend.
    - The blend's edge of under `0.001` over the best single is marginal, and the single fit has slightly better bottom `WAPE` and bias.
    - The floor remains better on zero-actual days. Full-scale `WRMSSE` does not remove that operational trade-off.
    - Spike capture was rejected on the test window, whose second use is explicitly disclosed. The later `Huber` arm failed on its first selection origin and never reached test.

    ## Limits

    - Members and weights use nine selection origins. The headline blend level carries a seeded node-bootstrap interval of `[0.5588, 0.6974]` over the `42,840` nodes (`2,000` resamples, `headline_interval.json`); the `30.4%` reduction against the floor has no paired interval. The separate spike-capture challenger does have a paired interval of `[0.00178, 0.00307]` for its regression. On the nine earlier origins used to select it, the blend beat the floor every time, by `23.6%` to `41.6%`; those origins are not independent tests. On the nine earlier origins used to select it, the blend beat the floor every time, by `24%` to `42%`; those origins are not independent tests.
    - On zero-actual days the floor still wins, `66.6%` versus `57.2%` accuracy. Scaling the hierarchy does not solve intermittent demand.
    - The demo band is the per-day minimum/maximum envelope of blend members, not a calibrated prediction interval with measured coverage.
    - `N-HiTS`, `TFT`, and Chronos-class foundation models are not benchmarked. Stockouts, promotions, and returns are unmodeled, so no savings or safety-stock claim follows.

    ```diagram auto-02-demand-forecasting-5
    ```

    ## Exact numbers

    Headline candidates on the test origin. Vs floor is the relative reduction; stability is population standard deviation over nine selection origins; `lgbm` is the recursive global fit.

    | candidate | official WRMSSE | vs floor | bottom WAPE | bias | stability |
    |---|---|---|---|---|---|
    | **convex_ensemble (champion)** | **0.6211** | **−30.4%** | **0.7623** | **+0.0222** | **0.0538** |
    | lgbm_pool_store (best single) | 0.6219 | −30.3% | 0.7617 | +0.0177 | 0.0549 |
    | lgbm | 0.6601 | −26.1% | 0.7626 | +0.0041 | 0.0347 |
    | auto_ets | 0.7093 | −20.6% | 0.7710 | −0.0063 | 0.0525 |
    | seasonal_naive (floor) | 0.8929 | — | 0.9159 | −0.0120 | 0.0577 |

    The ensemble is `lgbm_pool_storecat × 0.95 + lgbm_pool_store × 0.00 + lgbm_pool_dept × 0.05`. These are the best three of six eligible candidates by mean + `1.0 ×` population standard deviation over nine origins. A `0.05` simplex grid minimizes the same screen.

    ## Protocol

    - Full `M5` panel: `30,490` bottom series × `1,969` days; `12` hierarchy levels and `42,840` revenue-weighted nodes.
    - Origins: `10` weekly cutoffs with `7`-day spacing. Nine origins from 2016-03-20 through 2016-05-15 select; 2016-05-22 starts the `28`-day test window. Minimum training history is `1,096` days.
    - Candidates: eight total, with five `LightGBM` fits. The global arm is recursive; pooled arms are direct. `AutoETS`, `seasonal_naive`, and the convex ensemble complete the set.
    - Metrics: official hierarchical `WRMSSE`, bottom `WAPE`, bias, stability, per-level `WRMSSE`, and zero-day accuracy. Syntetos-Boylan thresholds `1.32` / `0.49` identify `2,754` dense and `27,736` intermittent series.
    - Runtime metadata records `1,348,530.6` seconds of summed compute. No supported single-machine wall-clock duration is committed; a rerun reproduces the output.

    **In plain terms:** A 95/5 blend of two pooled models cuts overall Walmart forecast error by 30.4%. The gain over one good model is tiny, and last week's sales still handle quiet days better.
  figures: []
key_concepts:
- '**Official hierarchical WRMSSE**: The competition metric scales each node''s error by train-window volatility, applies revenue weights, and averages with equal total weight per level across all 42,840 nodes.'
- '**Multi-level pooling**: Direct LightGBM fits per store, store×category cell, or department beat the recursive global fit; the comparison does not isolate pooling from forecasting strategy.'
- '**Tweedie loss**: A training objective based on a compound-Poisson-style likelihood for intermittent counts, used as a diverse candidate in the internal model comparison.'
- '**Stability-screened selection**: Members are chosen by mean + 1.0×std of per-origin scores across nine selection origins, favoring a stable blend over a lucky one.'
- '**Intermittent demand**: Sales occur only occasionally. This describes 91% of the panel''s series, while 59.5% of days are zero. Quiet days strongly affect accuracy, and the floor still wins them.'
- '**Test-window disclosure**: The champion is selected on nine past origins and scored on the final window. A later challenger gate reread that window and is reported separately.'
