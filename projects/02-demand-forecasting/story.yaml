project_id: 02-demand-forecasting
sections:
  - id: background
    text_md: |
      A retailer needs a trustworthy daily unit forecast for every
      store-product combination; those numbers drive replenishment, so every
      point of forecast error is working capital or lost sales. The project
      studies both demand regimes honestly — and they behave oppositely:

      - **Dense daily demand** (Walmart M5 subset — food items in 3 stores,
        16% zero-day share): trend, a pronounced weekly rhythm, and real
        exogenous signal (price, SNAP, events) — the regime where a global
        gradient-boosted model demonstrably beats the seasonal-naive floor.
      - **Sparse intermittent demand** (UCI Online Retail II — 89% zero
        share): demand arrives in bursts that a simple average cannot
        anticipate, and the honest measurement is that the flat/zero
        forecast stays the ceiling.

      Both regimes share the structures that make naive forecasting fail —
      and make a careless evaluation lie: levels differ widely across series,
      so one global average fits none of them, and a random train/test split
      lets a model memorise adjacent days and masks drift. The study
      therefore walks the full path from raw panel to validated model on both
      panels: data contracts and quality gates, shift-only lag features, naive
      reference floors, seeded HPO, a neural candidate, hierarchical
      reconciliation, and embargoed rolling-origin backtests with frozen,
      scored-once test windows. The full design log lives in `README.md` and
      `DESIGN.md`.

      **Business summary:** Every replenishment decision — how much to
      order, when, and for which store — is only as good as the demand
      forecast behind it, and this retailer plans 24 store-product
      combinations daily. Size safety stock on an unvalidated number and
      the error surfaces as stockouts (lost sales) or overstock (cash
      sitting on shelves). That is why the forecast is validated against
      the simplest alternatives a planner could use by hand before any
      model is trusted, so the number that drives orders has evidence
      behind it.

  - id: objectives
    text_md: |
      The engagement succeeds when all of the following hold, each checked
      by a concrete artefact in the repo:

      - **Beat naive floors by a wide, quantified margin** — a 10-run ladder
        in `reports/metrics.json` (seeded CI path) and
        `reports_uci/metrics.json` (real track), anchored on `naive_mean`,
        `naive_last` and `seasonal_naive`.
      - **No feature leakage** — lag features built with `shift` only, with
        exact-value unit tests on hand-built series.
      - **Evaluation that survives drift** — embargoed expanding-window
        `TimeSeriesCV` (4 folds, 7-day purge gap) with per-fold stability
        reported alongside the pooled numbers.
      - **One deployable artefact for the hierarchy** — global models with
        one-hot series identity; unknown series handled gracefully.
      - **Production-grade model choice** — seeded Optuna HPO judged on the
        same folds; the un-tuned run stays in the ladder for comparison.
      - **Hierarchy-consistent forecasts** — MinT-lite reconciliation with a
        property-tested coherence guarantee.

      **Business summary:** The deliverable is a defensible number, not a
      model file. A planning meeting should be able to act on one sentence —
      we beat the strongest simple baseline on real transactions, and here
      is the exact protocol that proves it — because every objective is
      tied to a concrete artefact in the repository that anyone can re-run.
      If the evidence cannot survive a skeptical reviewer, the engagement
      has not succeeded, however sophisticated the model.

  - id: data
    text_md: |
      Three tracks run through the identical discipline (leakage-safe
      features, rolling origins, frozen scored-once test windows; stages in
      `dvc.yaml`, config in `params.yaml`):

      - **Primary — Walmart M5 accuracy-track subset** (protocol
        `m5_direct_v1`, wave 24): 600 daily store-item series (top-3 stores
        CA_3/CA_1/TX_2 × top-200 items by volume), 2011-01-29..2016-06-19,
        16% zero-day share, built offline from the Nixtla `datasetsforecast`
        mirror and frozen with sha256 pins (`data_m5/`, PROVENANCE.md).
        [Makridakis et al., IJF 2022](https://www.sciencedirect.com/science/article/pii/S0169207021001722)
        — research use with attribution per competition terms.
      - **Secondary — UCI Online Retail II** (run with `--data-source uci`):
        [dataset card](https://amm-ds.github.io/portfolio/data-registry/uci-online-retail-ii/),
        free for research (Chen, Gallino & Li 2012, *Management Science*).
        Checksum-pinned download (sha256 in `params.yaml`), parsed with a
        dependency-free XLSX streamer: 525,461 sales lines from the 2009-2010
        sheet aggregated to the top 8 countries × top 200 products over 374
        days — 405,416 rows with an 89% zero share, genuinely intermittent
        demand. Returns and cancellations are excluded, and documented.
      - **CI path — seeded synthetic retail hierarchy**
        (`synthetic://retail_hierarchy`, seed 42, byte-identical anywhere):
        730 days × 4 stores × 6 products = 17,520 rows with injected trend,
        weekly seasonality and noise. Clearly labelled as the fast offline
        path — CI and demos must run without network — while still
        exercising the full production machinery: a `DatasetContract`
        identity card with SHA-256 checksum and DQ gates for null rate,
        range and freshness.

      The hierarchy the models forecast over:

      ```mermaid
      graph LR
          T[Total demand] --> S0[store_0] & S1[store_1] & S2[store_2] & S3[store_3]
          S0 --> S0P[6 products]
          S1 --> S1P[6 products]
          S2 --> S2P[6 products]
          S3 --> S3P[6 products]
      ```

      **Business summary:** Any result quoted here can be regenerated from
      a clean copy of the repository in minutes, on an ordinary laptop. A
      synthetic dataset with the same shape as the retail problem is the
      default, so the whole pipeline runs offline with no network or
      licenses involved. The real transaction data sits one flag away
      behind a checksum-pinned download, so the demo path and the
      production path are literally the same code.

  - id: eda
    text_md: |
      `eda_series_overview` shows the two structural components any model
      must capture: a slow upward trend, stronger in higher-indexed stores,
      and a regular weekly cycle with weekends clearly separated from
      weekdays.

      `eda_units_distribution` is wide and right-skewed across the hierarchy
      — store-product levels differ by design — which is why a single global
      mean is such a poor predictor (MAE 31.8) and why the models receive a
      series-identity feature instead of being pooled blindly.

      On the real track the picture sharpens further: with 89% zero rows,
      the intermittent-demand problem is visible in the distribution long
      before any accuracy number is computed.

      **Business summary:** The two patterns that break naive forecasting
      — a steady upward trend and a weekly rhythm, where weekdays and
      weekends differ systematically — are visible in the raw data before
      any model is built. On the real transaction track the picture is
      sharper still: 89% of rows are zero, so demand arrives in bursts
      that a simple average cannot anticipate. The commercial case for a
      better forecast therefore rests on a chart a client can see, not on
      a promise in a slide deck.
    figures: [eda_series_overview, eda_units_distribution]

  - id: training
    text_md: |
      Ten runs, one per algorithmic rung, all through the identical
      embargoed backtest:

      ```mermaid
      graph LR
          N1[naive_mean] --> N2[naive_last]
          N2 --> SN[seasonal_naive]
          SN --> E[ets]
          E --> R[ridge]
          R --> H[hgb]
          H --> HT[hgb_tuned]
          HT --> X[xgb_tuned]
          X --> L[lgbm_tuned]
          L --> TN[temporal_net]
      ```

      - `naive_mean` / `naive_last` — the floors every other run must beat.
      - `seasonal_naive` (lag-7) and `ets` — per-series damped-trend
        Holt-Winters with a documented, tested fallback chain to seasonal
        naive for short or failing series.
      - `ridge` — linear model in a scaled sklearn Pipeline with one-hot
        series identity.
      - `hgb` / `hgb_tuned` / `xgb_tuned` / `lgbm_tuned` — gradient
        boosting, HPO-tuned by seeded Optuna studies (56 trials for the
        sklearn HGB, 25 each for the mirrors), objective = CV MAE over the
        same folds; `hpo_history` and `hpo_importance` show the search
        converging on regularised, smaller-tree configs.
      - `temporal_net` — a hand-written PyTorch model (series embeddings +
        MLP, own Adam, gradient clipping, early stopping).

      All learners are global — one artefact covers the whole hierarchy —
      and MinT-lite reconciliation (scalar shrinkage grid-estimated on the
      embargoed previous fold) adjusts store-product forecasts toward the
      store level by a data-chosen weight `w`.

      **Business summary:** Ten candidate models, from a simple average
      to a hand-built neural network, were compared under one identical
      evaluation protocol designed so no model can peek at the future.
      Leakage — letting information from after the forecast date slip into
      training — is the most common way forecasting projects flatter
      themselves, and it is ruled out here by construction and by unit
      tests. The model that ships won on measured evidence under that
      protocol, not on novelty or fashion.
    figures: [hpo_history, hpo_importance]

  - id: evaluation
    text_md: |
      Validation uses the platform's `TimeSeriesCV`: four expanding-window
      origins with a 7-day purge (embargo) gap between each training window
      and its validation block, so no date block straddles train and
      validation. The protocol is a frozen holdout
      (`rolling_origin_holdout_v1`, audit hardening): the LAST origin is the
      test window (2010-10-01..2010-12-09 on the UCI track) — the champion
      is selected on origins 1..n-1 only, every candidate is scored exactly
      once on the test window, and the committed headline metrics are those
      test-window numbers. Preprocessing is fit within each fold's training
      window (models, scaler, MASE seasonal denominator, conformal widths);
      the full protocol — including the machine-checkable
      `selection_used_origins` vs `test_origin` — is emitted to
      `evaluation_metadata.json`, and the pre-holdout pooled values are kept
      under `legacy_pooled_*`. Metrics are MAE, RMSE, MAPE (reported, not
      decision-grade at ~89% zeros), MASE, bias, zero-safe WAPE, per-fold
      MAEs and per-horizon (h=1..14) MAE/MASE; nothing is reported
      in-sample. The lag-feature table `features.parquet` holds 17,184 rows.

      ```mermaid
      flowchart LR
          F[features.parquet] --> C[date-aligned origins]
          C --> T[fit origins 1..n-1]
          T --> S[select champion]
          S --> G[7-day embargo gap]
          G --> V[score test window once]
          V --> M[committed headline metrics]
          M --> P[per-fold stability check]
      ```

      Per-fold MAE is tracked in the `fold_stability` figure (the test
      window is marked) so drift and instability stay visible before
      deployment; `reports/report.html` collects the full run. A property
      test shuffles the test window's actuals and asserts the selection
      result does not move — the protocol is enforced, not just documented.
      Since wave 19 the multi-step protocol `direct_multihorizon_v1` rides
      along on the UCI track (see results) — direct per-horizon models on 20
      weekly origins with the same frozen-holdout discipline (16 selection
      origins, the last 4 scored once, routing and band widths calibrated on
      the selection origins only). Since wave 24 the headline protocol is
      `m5_direct_v1` on the M5 subset: 10 weekly rolling origins (8 selection
      + the last 2 scored once), 28-day horizon, ensemble weights and the
      conformal band calibrated on the selection origins only.

      **Business summary:** The evaluation mimics real use: the model is
      trained only on past data, then asked to forecast the next block of
      days, four times over, with a 7-day embargo gap so no date straddles
      both sides — and the final block is kept strictly out of the model
      choice, exactly as a held-back quarter would be. This answers the
      question a buyer should actually ask — will the model survive next
      quarter, not just last week — because it prices in drift, the slow
      change in demand patterns over time, and it prices it in without
      letting the answer leak into which model gets shipped. Stability is
      reported per fold, so a model that wins on average but wobbles on
      recent data is visible before it reaches production.
    figures: [uci:fold_stability]

  - id: results
    text_md: |
      **Headline — the M5 dense track** (protocol `m5_direct_v1`, committed
      in `reports_m5/`). 600 daily store-item series (463 dense + 137
      intermittent by Syntetos-Boylan ADI/CV²), 10 weekly rolling origins —
      the last 2 (2016-05-10, 2016-05-17) scored once on the 28-day horizon.
      The champion is a convex ensemble of the three best selection-WAPE
      candidates (lgbm × 0.45 + auto_ets × 0.45 + auto_ces × 0.10, weights
      grid-fit on a 0.05 simplex over the selection origins only):

      | candidate | test WAPE | test WRMSSE | win rate vs naive |
      |---|---|---|---|
      | seasonal_naive (floor) | 0.603 | 0.762 | — |
      | auto_ets | 0.503 | 0.611 | 88.2% |
      | lgbm | 0.495 | 0.599 | 88.8% |
      | **convex_ensemble** | **0.491** | **0.597** | **90.2%** |

      The ensemble beats the seasonal-naive floor by **−0.112 WAPE** (95%
      paired cluster bootstrap CI **[−0.122, −0.102]**; lgbm −0.108, a 17.9%
      relative cut, CI [−0.120, −0.0965]) and −0.165 WRMSSE (CI [−0.176,
      −0.155]) — and it wins in BOTH volume classes (dense 0.568→0.464,
      intermittent 0.749→0.604 test WAPE), the mirror image of the sparse
      panel below. The per-series scaled split-conformal 80% band covers 77.9%
      of test actuals at 13.53 units mean width (target 80% — slightly
      under-covering, stated as measured; balanced across volume classes,
      dense 77.2% / intermittent 80.4%). What separates the candidates on
      dense demand is
      the pooled margin, not per-series coverage: every serious candidate
      clears the floor on 82.8–90.2% of series. Full tables:
      `reports_m5/metrics.json` + `probabilistic.json`.

      **Rolling next-week service** (h≤7 pooled over ALL 10 origins — the
      deployment shape: each week the model is re-run, only the first week
      is consumed, later weeks roll forward; the 8 selection origins are
      included, so this is the operational service number, not a held-out
      estimate): convex_ensemble next-week WAPE **0.4250** vs the floor's
      **0.5442** (lgbm **0.4322**, rmae 0.794), paired-bootstrap gaps
      lgbm **−0.1120** (CI [−0.1200, −0.1047]) / ensemble **−0.1192** (CI
      [−0.1271, −0.1113]) — and at h≤7 every candidate beats the floor in
      BOTH volume classes, measured not asserted (ensemble rmae dense
      0.776 / intermittent 0.796). The weekly error blocks on the scored
      test origins grow wk1 **0.4158** → wk4 **0.5612** (1.35× week 1; the
      floor degrades 1.22× the same way) — week 1 carries 27.6% of the
      champion's absolute-error reduction, which is why the next-week number
      is the service headline and the 28-day table is the month view.

      **Secondary — the UCI sparse track.** Headline numbers there are the
      real UCI track (1,084 intermittent series), scored on the frozen test
      window — 2010-10-01..2010-12-09, the holiday
      quarter; MAE/MASE lead, MAPE is not decision-grade at 89% zeros. The
      champion was selected on origins 1..3 only. `forecast_vs_actual` shows
      the champion against the strongest naive:

      | run | MAE | MASE | Δ MAE vs sn | Δ MASE vs sn |
      |---|---|---|---|---|
      | naive_mean | 12.48 | 1.382 | +1.15 | +0.072 |
      | naive_last | 11.51 | 1.331 | +0.18 | +0.021 |
      | seasonal_naive | 11.32 | 1.310 | 0.00 | 0.000 |
      | ets | 11.47 | 1.338 | +0.15 | +0.028 |
      | ridge | 12.38 | 1.395 | +1.06 | +0.085 |
      | hgb | 9.57 | 1.085 | −1.76 | −0.225 |
      | **hgb_tuned ← best** | **9.55** | **1.078** | **−1.78** | **−0.232** |
      | xgb_tuned | 9.80 | 1.118 | −1.52 | −0.192 |
      | lgbm_tuned | 9.41 | 1.076 | −1.91 | −0.234 |
      | temporal_net | 11.77 | 1.305 | +0.45 | −0.005 |

      Δ vs seasonal_naive (sn) per row — negative beats "same day last week".
      No run dips below MASE 1.0 on this window: the MASE scale is the naive's
      own in-sample error from a quieter period, so the seasonal-naive itself
      scores 1.310 here and parity must be read on the Δ column, not the 1.0
      line — itself a finding (last-fold drift, priced in and visible in
      `fold_stability`).

      The synthetic CI ladder (`metrics_bars`, split into MAE+RMSE and
      MASE-scale-reference panels so unit-mixing metrics never share an axis;
      MAPE
      stays tabulated with its zero-demand caveat) is the mirror image: ETS
      wins outright on the synthetic test window (MAE 8.92, MASE 0.932) —
      clean trend plus weekly seasonality is exactly its class; among ML
      runs `temporal_net` edges `lgbm_tuned` (9.244 vs 9.341, noise-level),
      `hgb_tuned` 9.472.

      - **The ranking reversal survived revalidation — in both directions.**
        The old pooled ladder claimed the synthetic ML champion dropped to
        fourth on real data; on the one-shot test window `lgbm_tuned` posts
        the best MAE of all runs (9.409, ahead of the selection champion
        9.545 — a 1.4% gap inside the fold spread, so the protocol's pick
        stands), while the synthetic overall champion `ets` ranks 6th on
        real data (11.471). Neither pooled nor single-window rankings should
        be read as more than what they are.
      - **ETS breaks on intermittent demand** — it loses to its own seasonal
        naive on UCI (11.47 vs 11.32); 89% zeros violate its
        smooth-seasonality assumption (fallback chain documented and tested).
      - **HPO earns a modest, real gain** — 56 seeded trials moved the
        sklearn HGB 8.619 → 8.529 (−1.0%) pooled over all folds (legacy,
        `hpo_history`).
      - **Reconciliation pays off on the real hierarchy** — w=0.75 this run,
        incoherence 536.7 → 134.2 (×(1−w) exactly, property-tested), store
        MAE 749.1 → 719.8; synthetic chose w=0.00 this run — the fold-4-drifting
        parent is not trusted (store-level HGB refit jitters run-to-run
        within the documented OpenMP tolerance; numbers from the latest
        canonical run).
      - **Probabilistic bands — coverage AND width on the test window**
        (target 80%): the quantile band covers 0.73 synthetic / 0.92 UCI
        (pooled); the zero-aware conformal band covers the h=1..14 horizon
        set at 0.741 on synthetic (avg width 26.5 units — verdict
        *optimistic*, it under-covers) and 0.861 on UCI — but with avg width
        0.00 units, because the champion's median sits on the zero atom for
        ~100% of test rows: the "conservative" UCI verdict is a degenerate
        band, not a useful one, stated on the figure whose buttons drop it
        (`probabilistic_band`).
      - **Multi-step track (wave 19 rebuild + wave 20 peak candidates + wave
        21 LightGBM arms / ensemble / win rates, now the
        PRIMARY headline, `direct_multihorizon_v1`)**: the nowcast "14-day"
        number was 14 one-day-ahead predictions — the rebuild fits one direct
        model per horizon h ∈ {1..14} (the full window lattice) on 20 weekly
        origins (16
        select, 4 scored once, no embargo gap), every feature aged ≥ h days at
        target−h (calendar + a 9-column peak block — 7/14/28d rolling
        mean/max, days-since-last-nonzero, 28d non-zero count, 28d peak ratio
        — + wave-21 price/trading-cycle features + aged lags, taint-tested).
        ADI/CV² classes: 15 erratic + 1,069
        lumpy of 1,084 series — the wave-21 router (chosen on selection
        origins only, property-tested; wave 22 widens the statistical side to
        ma_28 + the ADIDA pair) gives lumpy series the statistical
        methods PLUS six peak-capable ML candidates: `hgb_tweedie` (tweedie
        deviance, variance power 1.5, tuned on the selection origins),
        `hurdle_hgb` (P(sale) classifier × log1p-size regressor,
        zero-corrected on the selection origins — identity won, tested not
        assumed), the LightGBM arms `lgbm_tweedie` / `hurdle_lgbm` (HPO'd on
        the selection origins), `peak_weighted_hgb` (peak-day-weighted, weight
        2.0 chosen on the selection origins), and the honestly-losing
        `lgbm_poisson` (its exp link overflows on ~11% of cells — literal
        +inf before the finite-prediction guard maps non-finite cells to the
        per-series training max; evaluated, kept in every table, 107.17 pooled
        MAE vs zero 9.28); the 15 erratic series choose among the direct HGB
        and the same ML pool. Lumpy champion vs floor: 6.09 vs 11.07 MAE at
        h=7 (95% paired-bootstrap CI [−7.74, −2.88]), 5.80 vs 10.64 at h=14 —
        routing beats the unrouted all-HGB ladder by 3.98 MAE (CI [3.34,
        4.76]); the ML candidates stay close on pooled lumpy MAE (routed 6.61
        < ensemble_convex 6.74 < hurdle 7.07 < peak-weighted 7.30 <
        hurdle_lgbm 7.62 < lgbm_tweedie 7.62 < hgb_tweedie 7.77 — every gap vs
        routed CI excludes zero) — reported plainly. All 15 erratic series
        route to the ML candidates (10 hurdle, 3 peak-weighted, 2 tweedie).
        On erratic, peak-day MAE falls from 367.3 (zero) to 278.7–295.1
        across the ML candidates (routed 285.6); on lumpy tweedie cuts
        peak-day MAE to 28.1 (vs zero 33.7) while its top-5 day-ranking
        recall drops to 0.44 vs the flat 0.88 — magnitude vs timing, both
        measured with paired-bootstrap CIs in the `peak_capture` block. Wave
        21 adds the per-series beats-floor win rate: even the champion beats
        the floor on only 21.89% of lumpy series at h=7 (CI [19.55, 24.32];
        erratic 60.0%) — the pooled win rides on magnitude, not coverage.
        Error grows with the true horizon (pooled MAE 0.08 → 6.40, h=1 →
        h=14; the sawtooth is weekday composition — weekly origins fix each
        horizon's weekday). Per-horizon bands: coverage AND width per h,
        pooled 0.918 → *conservative* (sparse P(sale)+ladder bands, no
        collapsing band; the ML candidates carry their own conformal bands,
        pooled 0.909). Order-up-to simulation (τ=0.90; holding 0.25,
        stockout 4.0): erratic 1.422 vs 1.510 cost/unit champion-vs-floor;
        lumpy 2.874 vs 2.777 the other way — MAE-optimal routing over-orders
        at high τ on spike-driven demand; simulation, no savings claims.
      - **Wave 22 — the audit's "missing baselines and better metrics" round
        arrived and the honest answer is that the sparse ceiling holds**:
        the missing moving-average baseline (`ma_28`, 9.94 pooled MAE) and
        the ADIDA temporal-aggregation pair (9.98 / 10.73), plus
        `routed_reconciled` (country-aggregate seasonal-naive anchoring,
        9.97) all land BEHIND the zero forecast (9.28) — the panel's weekly
        structure is too weak to beat "mostly zero" at series level, so the
        router keeps 945 of 1,069 lumpy series on zero and sends only 18 to
        an ADIDA variant. That matches the independent
        collapseindex/online-retail-forecast benchmark on the same dataset,
        where the seasonal naive wins — two pipelines, one conclusion. The
        metric layer got better even where the models didn't: rmae (champion
        0.649 vs the floor's 1.000), per-candidate M5-convention rmsse
        (routed 0.520 pooled), and a newsvendor order-quantile cost layer
        (holding 1.0 / stockout 3.0 per unit-day, assumption stated) that
        prices the over-ordering story: at q=0.90 the router pays +0.127 per
        unit-demand on lumpy (CI excludes zero) and only wins erratic at
        q=0.95 (−0.137).
      - **Model ranking changed vs the nowcast track, as the audit
        expected**: the multi-step leaderboard is led by the routed pipeline
        (7.47 pooled MAE, rmae 0.649), then `ensemble_convex` (7.59),
        `hurdle_hgb` (7.91), `peak_weighted_hgb` (8.14) and `zero` (9.28) —
        rank-1-vs-2 gap CI [−0.180, −0.068] excludes zero; the wave-22
        candidates (ma_28 9.94, routed_reconciled 9.97, adida_tsb 9.98,
        adida_sba 10.73) all sit behind zero — evaluated and reported, not
        hidden — and `lgbm_poisson` (107.17) sits last.
        "Mostly zero, sometimes a peak-capable model on the series that show
        spikes on the selection origins" is the honest sparse champion on this
        panel.
      - **Wave 24 — the M5 pivot: the headline moved to the regime where ML
        wins** (protocol `m5_direct_v1`, committed M5 subset — 600 series,
        top-3 stores × top-200 items, 16% zeros). 10 weekly rolling origins,
        8 selection + 2 scored once (2016-05-10/17, 28-day horizon), 8
        candidates from seasonal_naive to a global LightGBM (no
        series-identity feature) and a selection-fitted convex ensemble
        (auto_ets × 0.67 + auto_ces × 0.33). The ensemble beats the naive
        floor by −0.105 WAPE (CI [−0.115, −0.095]) and −0.157 WRMSSE (CI
        [−0.168, −0.147]) in BOTH volume classes (dense 0.568→0.470,
        intermittent 0.749→0.616) — while the UCI sparse panel below keeps
        its honest opposite verdict (zero stays the ceiling). The old
        workbench demo was rebuilt on this track (churn-style payload,
        `cli demo-payload-m5`).

      **Business summary:** Two decisions, two regimes, both measured. On
      dense daily demand (M5) the answer is clear: replace "same day last
      week" with the pooled ensemble — a −11.2-point WAPE gap whose 95%
      bootstrap CI excludes zero, won in both volume classes, at a 90.2%
      per-series win rate. On sparse intermittent demand (UCI) the answer is
      the honest opposite: keep the flat/zero forecast, because even the
      champion beats the floor on barely a fifth of lumpy series and the
      winning config does not transfer across regimes. What is delivered is
      an honest measurement of both regimes and its limits — the 80% band
      sits at 77.9% coverage on M5 (just under target), safety-stock policy
      needs the newsvendor layer, and no savings are claimed.
    figures: [m5:wape_bars, m5:wrmsse_bars, m5:class_comparison, m5:win_rate, m5:band_calibration, uci:metrics_bars, uci:forecast_vs_actual, uci:probabilistic_band, uci:multistep_error_vs_horizon, uci:multistep_class_scoreboard, uci:multistep_routing, uci:multistep_band_calibration, uci:multistep_peak_capture, uci:multistep_candidate_comparison, uci:multistep_peak_day_scatter]
    metrics_keys: [naive_mean, naive_last, seasonal_naive, ets, ridge, hgb, hgb_tuned, xgb_tuned, lgbm_tuned, temporal_net]
  - id: conclusions
    text_md: |
      - **On dense daily demand, ML earns its complexity — measure the
        regime, don't assume it** — on the M5 subset the selection-fitted
        convex ensemble beats the seasonal-naive floor by −0.112 WAPE (CI
        [−0.122, −0.102]) in both volume classes; on the UCI sparse panel
        the same discipline says the zero forecast wins. The model is not
        the deliverable — the measurement of which regime you are in is.
      - **Global models with series identity work** — one deployable
        artefact covers the hierarchy; shared seasonality and trend transfer
        across series.
      - **Leakage-proof features and a frozen holdout are the real product**
        — shift-only lags, calendar encodings, an embargoed rolling-origin
        backtest, and a final window that is scored once and never read for
        selection make every claim auditable (the property test shuffles the
        test window and asserts the pick does not move).
      - **Seeded Optuna HPO is a repeatable production step** (`cli hpo`,
        resumable) — configs tuned on one demand regime behave differently
        on another; re-tune on the target panel and judge on a held-back
        window before shipping.
      - **Reconciliation guarantees coherence, not accuracy** — the gain is
        bounded by how much the parent model can be trusted (w=0.00
        synthetic vs 0.60 on UCI); the verdict is per candidate, never
        blanket. (The wave-23 Nixtla hierarchical track that confirmed the
        same law with proper MinT was removed in the wave-24 pivot; the
        decision record stays in DESIGN.md §M.)
      - **The honest limit for inventory planning**: the 80% band is not yet
        usable on intermittent demand (zero-width conformal band on the real
        test window), stockouts and promotions are not modelled, and
        product-level effects are pooled into a global model — so these
        numbers support a pilot decision, not a safety-stock policy, and no
        savings claim is made from them.

      **Results quality:** on the M5 headline the ensemble's −0.112 WAPE gap
      has a 95% CI that excludes zero in both volume classes — the strongest
      result this repo ships — with the 80% band just under target (77.9%
      coverage). On the UCI sparse track: acceptable-with-caveats — the champion runs at 0.843
      relative MAE of the seasonal-naive floor (MASE 1.078 vs the naive's own
      1.310) on the frozen test window, but no run dips below MASE 1.0 there
      (the holiday window is harder than the average fold), the margin over
      the next-best run is inside fold noise, the 80%
      bands land at 0.741 (synthetic, too narrow) and 0.861-with-zero-width
      (UCI, degenerate) against the 0.80 target, and the winning config does
      not transfer across demand regimes. Each caveat is measured above, not
      suspected.

      Limits: gains over persistence are stable but bounded (~9 units
      residual test-window MAE on the synthetic ladder); the neural model is
      competitive but not champion on small tabular lag features; later
      folds drift upward for every model — the
      `docs/runbooks/drift-response.md` runbook turns that into a monitored
      retraining trigger rather than a surprise. Full detail:
      `README.md`, `DESIGN.md`, `reports/report.html`.

      **Business summary:** The value delivered is precision about the
      decision, not a model file: which model wins, by exactly how much,
      against a window it never saw — and, just as important, where it stops
      winning, since the champion's edge is bounded by day-over-day noise and
      its uncertainty band is not yet production-grade for intermittent
      demand. Every caveat in the conclusions is measured, from the band
      missing its target to the winning configuration failing to transfer
      across demand regimes. For a client, the forecast-versus-actual and
      fold-stability charts are the first two things to look at, because
      they show both the gain and its limits in a single view.
    figures: []
    metrics_keys: [naive_last, hgb, hgb_tuned]
