figure_captions:
  m5:wape_bars: "Test-origin pooled WAPE per candidate (protocol m5_direct_v1) — the convex ensemble leads at 0.491 vs the seasonal-naive floor's 0.603; the per-series statistical candidates now trail the tuned global LightGBM (0.495)."
  m5:wrmsse_bars: "Test-origin WRMSSE per candidate with the documented seasonal-naive-28 denominator — the ensemble's 0.597 vs the floor's 0.762; the deliberate deviation from the official M5 lag-1 denominator is stated in evaluation_metadata.json."
  m5:class_comparison: "Test WAPE by volume class (dense 463 / intermittent 137) — the models win in BOTH classes on the M5 subset (dense 0.568→0.464, intermittent 0.749→0.604), the mirror image of the UCI sparse panel where the zero forecast stays the ceiling."
  m5:win_rate: "Per-series win rate vs the seasonal-naive floor on the test origins — the ensemble clears the floor on 90.2% of series (dense 90.1%, intermittent 90.5%); every serious candidate lands in the 82.8–90.2% band."
  m5:band_calibration: "Per-series scaled split-conformal 80% band on the test origins — empirical coverage per horizon day against the 0.80 target with the committed scaled band widths; lgbm covers 77.9% at 13.53 units mean width (dense 77.2% / intermittent 80.4%), slightly under-covering and stated as measured."
  eda_series_overview: Four representative store-product daily series from the seeded synthetic hierarchy. Each carries a slow upward trend plus a regular weekly cycle — the two structures any model must capture.
  eda_units_distribution: Histogram of daily units pooled over all 24 store-product series of the synthetic panel. The wide, right-skewed spread is why one global mean predicts poorly (MAE 31.8) and why models receive a series-identity feature.
  hpo_history: Objective value (CV MAE) of every trial in the 56-trial seeded Optuna study on the sklearn HGB, with the running best overlaid. The search converges on regularised small-tree configs and buys a modest, real gain (best 8.529 vs 8.619 default).
  hpo_importance: Hyperparameter importance (fANOVA) over the same seeded study. Regularisation knobs dominate — the top two parameters carry 66% of the search importance.
  uci:fold_stability: Out-of-fold MAE per CV origin for every run in the ladder, with the test window marked after the dashed line. All models degrade on later folds — trend drift the embargoed expanding-window backtest prices in before deployment.
  uci:metrics_bars: "The run ladder in two panels — MAE + RMSE in units (left) and MASE (right) — scored on the final holdout window, so unit-mixing metrics never share an axis. MAPE stays tabulated (not drawn): with ~89% zero-demand days near-zero actuals inflate it. MASE divides by the seasonal-naive's in-sample error from a quieter period — on the UCI test window the naive itself lands at 1.310, so the 1.0 gridline is not parity (no run dips below it there); on synthetic only ETS does."
  uci:forecast_vs_actual: The champion's day-by-day forecast against actuals and the strongest naive floor on two representative series, test window — on UCI hgb_tuned clears seasonal_naive by 15.7% MAE. The residual gap after the naive floor is day-over-day noise.
  uci:multistep_error_vs_horizon: Multi-step error by TRUE horizon (direct per-horizon models, scored origins) — MAE in units on the left panel, MASE on the right, so unit-incompatible metrics never share an axis. Error grows with h; the sawtooth is weekday composition (weekly origins fix each horizon's weekday — h=1 is always a Saturday on the UCI panel).
  uci:multistep_class_scoreboard: Champion vs floor MAE per demand class at h=7 and h=14 (units) with a second panel for the champion-minus-floor gap and its 95% paired cluster-bootstrap CI — the lumpy gap CIs exclude zero, the erratic ones span it.
  uci:multistep_routing: Routing effect per class — all-HGB MAE minus routed MAE (units), 95% bootstrap whiskers. Sparse classes sit well above zero; boosted trees overfit intermittent series, statistical methods do not.
  uci:multistep_band_calibration: Per-horizon band calibration on the scored origins — empirical coverage vs the 80% target on the left, average width in units on the right. Verdicts per h; sparse rows carry P(sale)+quantile-ladder bands that cannot collapse to zero width.
  uci:multistep_peak_capture: Peak capture per class — per-candidate peak_recall and peak_mae differences vs the zero forecast with 95% paired bootstrap CIs. On erratic every candidate cuts peak-day error by ~60 units vs zero; on lumpy tweedie trades top-5 day-ranking recall for smaller error on the days peaks actually happen.
  uci:multistep_candidate_comparison: Pooled-over-h MAE per class for the peak-capable candidates (tweedie / hurdle) vs the routed pipeline and zero — bars on the left, candidate-minus-routed gap with 95% CI on the right. The flat methods keep pooled lumpy MAE; hurdle wins erratic outright.
  uci:multistep_peak_day_scatter: Forecast vs actual on each scored window's top-decile demand day (lumpy class), one panel per candidate, dotted parity line. The zero candidate hugs the bottom — the structural miss the peak-capable candidates were built for; tweedie visibly tracks the diagonal on the days that matter.
  uci:probabilistic_band: Actuals vs the p50 forecast with the zero-aware 80% conformal band on two high-volume series, test window. The band covers the h=1..14 horizon set at 0.861 on UCI (target 0.80) but with zero width — the median sits on the zero atom — while on synthetic it covers 0.741 at 26.5 units average width (under-covering); the figure states coverage and width.
