  m5_full_per_level_wrmsse: "Per-level official WRMSSE on the test window — convex ensemble vs seasonal-naive floor vs best single (lgbm_pool_store), with equal total weight per level. The blend's edge is broadest at the aggregate levels the competition weights most; at item level the learned candidates cluster near 1.04–1.15 while the floor sits near 1.39."
