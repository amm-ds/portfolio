project_id: 02-demand-forecasting
sections:
  - id: background
    text_md: |
      A retailer sells six products across four stores and needs a trustworthy
      daily unit forecast for every store-product combination — 24 series in
      total. These forecasts drive replenishment: systematically under-forecast
      a trending product and shelves go empty, over-forecast and cash sits in
      unsold stock.

      Demand here is not flat: every series carries a slow upward trend and a
      pronounced weekly rhythm, and the level differs widely between stores and
      products. That structure is exactly what makes forecasting interesting —
      and what makes a careless evaluation lie to you, because a random
      train/test split lets the model memorise adjacent days and masks drift.

      This case study builds the full path from raw panel to validated model:
      data contracts and quality gates, leakage-safe features, naive reference
      baselines, and an embargoed expanding-window backtest that reports
      stability alongside accuracy.

  - id: objectives
    text_md: |
      Deliver per-series, one-day-ahead unit forecasts that measurably beat
      naive baselines, with an evaluation a client can trust rather than a
      single lucky holdout number.

      Concrete goals: (1) a global model that handles all 24 series as one
      deployable artefact; (2) features built exclusively from information
      available before the forecast day — no shift, no leakage; (3) an honest
      backtest — expanding training windows, a 7-day embargo between train and
      validation, metrics pooled over out-of-fold predictions only; (4) every
      accuracy claim anchored against naive floors so "better" is quantified,
      not asserted.

  - id: data
    text_md: |
      The panel is generated by the platform's seeded `retail_hierarchy`
      generator: 730 days × 4 stores × 6 products = 17,520 rows of daily units
      with injected trend, weekly seasonality and noise (seed 42 — byte-
      identical on any machine, so results reproduce exactly and CI runs
      offline).

      Seeded synthetic data is a deliberate choice for the showcase: it
      exercises the full production machinery — `DatasetContract` identity card
      with SHA-256 checksum, DQ gates for null rate, range and freshness — with
      zero network dependency. A real-data track (UCI Online Retail II,
      checksum-pinned via `portfolio_core.io.fetch`) is designed and documented
      in DESIGN.md; the swap point is a single function, `data.py::build_panel`,
      with every downstream module unchanged.

  - id: eda
    text_md: |
      The series overview shows the two structural components that any
      competent model must capture: a slow upward trend (stronger in higher-
      indexed stores) and a regular weekly wave, with weekends clearly
      separated from weekdays.

      The units distribution is wide and right-skewed across the hierarchy —
      store-product levels differ by design — which is why a single global
      mean is such a poor predictor and why the models receive a series
      identity feature instead of being pooled blindly.
    figures: [eda_series_overview, eda_units_distribution]

  - id: training
    text_md: |
      Four models, one per algorithmic rung: `naive_mean` (a single global
      train-mean number), `naive_last` (per-series persistence — yesterday's
      units), `ridge` (a linear model in a scaled sklearn Pipeline with one-hot
      series identity), and `hgb` (HistGradientBoostingRegressor on the same
      features).

      All learners are global: one artefact covers the whole hierarchy, series
      identity enters as a one-hot feature with `handle_unknown="ignore"`, and
      shared seasonality/trend effects transfer across series. Features are lag
      values (1, 7 and 14 days) built with `shift` — never the current row —
      plus calendar encodings; rows with undefined lags are dropped, never
      imputed. Training is validated inside a leakage-proof time-CV from
      portfolio-core, not on random splits.

  - id: evaluation
    text_md: |
      Validation uses the platform's `TimeSeriesCV`: four expanding-window
      folds over the 716 dated feature rows with a 7-day embargo between each
      training window and its validation block, folds mapped to rows so no date
      straddles the split. Every model — including the naives — runs through
      the identical backtest.

      Metrics are the platform standard for regression (MAE, RMSE, MAPE),
      pooled over all out-of-fold predictions across folds and all 24 series;
      nothing is reported in-sample. Per-fold MAE is tracked alongside the
      pooled numbers so instability and drift stay visible.

  - id: results
    text_md: |
      Pooled out-of-fold results (seed 42, 4 folds × 24 series). Gradient
      boosting wins with MAE 8.62 units (RMSE 12.18, MAPE 11.4%), the linear
      ridge baseline is close behind (MAE 9.12), and both clear the naive
      floors decisively: persistence (`naive_last`) sits at MAE 14.48 and the
      global mean at 31.76.

      Quantified against the stronger naive: hgb cuts MAE by 40.5% and MAPE by
      7.8 percentage points; ridge by 37.0%. Persistence fails because it
      cannot see weekday structure or anticipate trend — a Monday forecast made
      from Sunday's number starts with a built-in weekly error.

      The per-fold view shows all models degrading gently on the last fold as
      the trend lifts demand, with the improvement ratio stable at 38.8–41.1%
      in every fold — drift inflates naive and learned errors alike. The
      residual ~8.6-unit MAE is mostly day-over-day noise: that is the plateau
      a deeper model would have to beat, not the trend.
    figures: [metrics_bars]
    metrics_keys: [naive_mean, naive_last, ridge, hgb]

  - id: conclusions
    text_md: |
      What works: global models with series identity give one deployable
      artefact for the whole hierarchy; shift-only lag features plus calendar
      encodings are enough to beat persistence by two-fifths of its error; and
      an embargoed expanding-window backtest with naive floors makes the
      improvement auditable.

      The honest caveat: gains over persistence are stable across folds but
      bounded by noise — later folds drift upward for every model, which is
      exactly what a random split would have hidden. Watch the fold-stability
      curve in production, not just the headline MAE.

      Roadmap: Optuna hyperparameter search for the boosted model (dependency
      already declared), a neural sequence model to test whether the noise
      floor can actually be lowered, a real-data track on UCI Online Retail II,
      and hierarchical reconciliation so store, product and total forecasts
      agree arithmetically.
    figures: [fold_stability, forecast_vs_actual]
    metrics_keys: [naive_last, ridge, hgb]
