project_id: 02-demand-forecasting
short_version: "One honest protocol, two demand regimes: on dense Walmart M5 daily sales a tuned ensemble cuts forecast error to 49% vs 60% for the seasonal-naive baseline; on sparse 89%-zero retail demand the winner is the opposite—mostly-zero routing for 945 of 1,069 lumpy series."
sections:
- id: background
  text_md: |
    **One honest protocol, two demand regimes.** On dense Walmart M5 daily
    sales an ensemble cuts forecast error to 49% of demand versus 60% for
    the seasonal-naive baseline; on sparse, mostly-zero retail demand the
    winner flips — a router that forecasts zero for 945 of 1,069 lumpy
    series. The architecture diagram shows both tracks and the one protocol
    they share.

    ```mermaid
    graph LR
      M5["Dense M5: 600 series"] -->|"ensemble wins, 0.491"| HB["Frozen holdout, scored once"]
      U["Sparse UCI: 89% zeros"] -->|"zero: 945 of 1,069"| HB
    ```

    Read the two tracks into the shared node on the right: each regime is
    scored once on a frozen holdout under identical rules — only the winner
    differs, and the edges say who wins where.

    M5 gives 600 daily series; UCI Online Retail II gives 405,416 rows, 89%
    of them zero.

    **Business summary:** This section introduces the two regimes and their
    opposite winners: an ensemble cuts dense Walmart error from 60% to 49%;
    a router forecasts zero for 945 of 1,069 lumpy series.
  figures: []
- id: objectives
  text_md: |
    **The goal is a forecast a planner can defend, not a model file.** The
    question: where does a learned model beat a simple rule — and where does it
    lose? The routing decision diagram gives the answer in one picture.

    ```mermaid
    graph LR
      S["New demand series"] --> M{"Classify by<br/>ADI and CV2"}
      M -->|"smooth or erratic"| D["Dense track<br/>boosters + ensemble"]
      M -->|"intermittent or lumpy"| L["Sparse track<br/>intermittent methods"]
      D --> B1["Beat naive floor<br/>or stay simple"]
      L --> B2["Zero by default<br/>model peaks that pay"]
      B1 --> R["Error, coverage, width<br/>+ bootstrap intervals"]
      B2 --> R
      R --> P["No savings claim<br/>without cost check"]
    ```

    Read it at the router first: every series is classified by ADI (average
    inter-demand interval) and CV² (squared variability), and the class —
    not the algorithm — picks the track: smooth series get global boosted
    models and the ensemble, intermittent ones get methods built for
    mostly-zero demand. Each track then answers to the
    same two bosses: beat the seasonal-naive floor or stay simple, and
    report every gap with an interval. The last node is the discipline: no
    inventory-savings claim without a cost check at the end. One global
    champion was never the plan; the regime diagnosis itself is the
    reusable result.

    Success means:

    - Beat mean, last-value, and seasonal-naive rules where the data support it,
      with an interval on the gap.
    - Use past-only lags and frozen test windows, scored once — never random
      splits.
    - Reconcile a store hierarchy with property-tested math, without assuming
      that helps accuracy.
    - Report band coverage and width alike, including zero-width bands and cases
      where the simple rule stays better.

    Which datasets make the two regimes concrete?

    **Business summary:** This section sets the goals: beat simple rules where
    data allows, use past-only lags scored once, reconcile the hierarchy, and
    put a range on every gap.
  figures: []
- id: data
  text_md: |
    **Three datasets share one pipeline, not one conclusion.** M5 (primary): 600
    daily store-item series — CA_3, CA_1, and TX_2 stores crossed with the
    top-200 items — spanning 2011-01-29 to 2016-06-19 with 16% zero days,
    sha256-pinned from the Nixtla datasetsforecast mirror; cite Makridakis et
    al., IJF 2022. UCI Online Retail II (secondary): the top 8 countries crossed
    with the top 200 products over 374 days — 405,416 rows, 89% zeros, returns
    excluded; Chen, Gallino & Li 2012. Synthetic (CI only): a seeded panel of 730
    days, 4 stores, and 6 products with injected trend and weekly seasonality —
    pipeline evidence, not real-world evidence. Every track carries a dataset
    contract, quality gates, and DVC stages.

    The evaluation contract diagram fixes the split discipline every track
    obeys: choose on the past, score once on the future.

    ```mermaid
    graph LR
      S["Choose on the past:<br/>UCI origins 1-3, M5 8 of 10"] --> T["Score once:<br/>UCI 4th origin, 7-day embargo;<br/>M5 2 origins, 28-day horizon"] --> C["Committed headlines:<br/>pooled metrics, bootstrap intervals"]
    ```

    Read the contract as three stops. Selection origins choose the model;
    test origins score it exactly once, behind a 7-day embargo on UCI and a
    28-day horizon on M5; only then do numbers become committed headlines.
    Random splits were rejected outright: with daily time series they leak
    the future into training, and any gap quoted without that discipline
    would be unverifiable.

    With the datasets pinned, what do they look like inside?

    **Business summary:** This section fixes the datasets and rules: M5 Walmart
    sales, UCI online retail (89% zeros), a synthetic panel. Models are chosen
    on the past and scored once on the future.
  figures: []
- id: eda
  text_md: |
    **Why one global mean fails.** The synthetic panel mixes trend, weekly
    season, and wide, skewed levels. The series overview and units
    distribution figures show why one pooled average fails. UCI shows the
    opposite problem: 89% zero rows. M5 sits between: its 600 series split
    into 463 dense and 137 intermittent by ADI (average inter-demand
    interval) and CV² (squared variability). So every result below is by
    class; the class comparison figure holds those numbers.

    Read the figures in that order. The series overview draws four
    representative daily series from the seeded synthetic hierarchy — the
    trend-plus-weekly structure the fast-path models must capture, and
    nothing claimed as real-panel evidence. The units distribution shows a
    wide, right-skewed spread of daily units: one pooled mean scores MAE
    31.8 on that panel, which is why series-aware features are tested
    instead of assumed. The class comparison figure keeps the M5 split
    honest: 463 dense and 137 intermittent series, reported separately
    everywhere below.

    EDA also set the judging rules: choose on the past, score once on the
    future, keep baselines as floors, and put a paired bootstrap interval on
    every gap. Data this different is why one champion was never the plan —
    so where does each regime's champion come from?

    **Business summary:** This section profiles the data: M5's 600 series
    split into 463 dense and 137 intermittent, while UCI is 89% zeros. That
    split orders every result below.
  figures: [eda_series_overview, eda_units_distribution, m5:class_comparison]
- id: training
  text_md: |
    M5 evaluates **11 candidates** — seasonal naive, three statistical baselines,
    automatic ETS and CES, gradient boosting with a pure-L2 arm, and two
    three-member ensembles — and the ensemble wins on dense data. Pooled test
    WAPE (error as a share of demand) is 0.491 versus 0.603 for the seasonal
    naive, and MASE (error relative to that baseline, 1.0 means no improvement)
    improves in step; per-series, 88.8% pooled / 88.6% dense / 89.8% intermittent
    series improve. Exact tables live in the conclusions.

    Tuning was seeded and cheap: the HPO history and importance figures show
    the 56-trial synthetic HGB study, where regularization dominates and the
    best trial cuts cross-validation error only modestly — small, honest
    gains, not a leaderboard. Read the history figure as a mostly-flat
    curve: the default already works, and the search buys single-digit
    hundredths. The importance figure explains why, with the top two
    parameters carrying 66% of search importance. Tuning ran on the
    synthetic panel rather than on M5 so the study stays cheap and
    repeatable; the modest delta is the honest price of that choice.

    Sparse UCI inverts the answer. The selection champion posts 9.545 MAE (mean
    absolute error) against the seasonal naive's 11.323, and no run reaches MASE
    1.0. The routing effect figure shows what routing adds on scored origins:
    the router forecasts zero for 945 of 1,069 lumpy series and reserves
    peak-capable models for the rest. Cost-aware routing at a 0.90 service
    level moves 67 of those series back to models, pays +0.57 lumpy MAE, and
    wins the newsvendor cost comparison — a measured trade-off, not an
    assertion.

    Do these gains survive honest grading?

    **Business summary:** This section trains and selects the forecasters: on
    dense Walmart sales the ensemble cuts error from 60% to 49%; on sparse
    retail orders the winner forecasts zero for 945 of 1,069 lumpy series.
  figures: [hpo_history, hpo_importance, uci:multistep_routing]
- id: evaluation
  text_md: |
    **Metrics match decisions.** MAE drives selection; WAPE headlines the dense
    track; MASE keeps the sparse track comparable; every gap carries a paired
    bootstrap interval. Each metric answers one question, so none is allowed
    to stand in for the others: MAE is the selector because a planner can
    audit it row by row, WAPE scales error by demand, and MASE divides by
    the seasonal naive's error, so 1.0 means no improvement over the floor.

    Error is not flat, and the evaluation figures say so. Start with the
    fold stability figure: every UCI model degrades on later folds — drift
    exposed before deployment, not after. Then the horizon growth figure:
    M5 error climbs **0.4136→0.5636** from week 1 to week 4, which is why
    the service number is reforecast weekly instead of trusted for a month.
    The win rate figure bounds the ensemble's edge: 88.8% of series improve
    against the seasonal naive and the rest are flat or worse — coverage,
    not perfection.

    For planning: dense, M5-like demand plans with the ensemble; sparse, UCI-like
    demand plans with the router. Neither supports an inventory-savings claim;
    both support a pilot.

    Where does all of this land in one ranking?

    **Business summary:** This section grades the candidates on both tracks:
    88.8% of M5 series improve under the ensemble, weekly error grows across the
    28-day horizon, and all UCI models degrade on later folds.
  figures: [uci:fold_stability, m5:horizon_growth, m5:win_rate]
  metrics_keys: [naive_mean, naive_last, seasonal_naive, ets, ridge, hgb, hgb_tuned, xgb_tuned, lgbm_tuned, temporal_net]
- id: results
  text_md: |
    **The headline ranking is in the WAPE bars figure: convex ensemble 0.491,
    committed global LightGBM 0.498, seasonal naive 0.603** on the pooled,
    scored-once 28-day test. Read the bars as a tight race, not a blowout:
    the ensemble and the single booster sit within 0.007 of each other, and
    both sit far below the seasonal rule. The band calibration figure shows
    the cost of honesty: 80% bands that cover 77.7% — slightly under
    target rather than tuned to look exact. The multi-step error figure
    carries the sparse track, with MAE and MASE on separate axes so
    incompatible units never share one; the sawtooth in
    that figure is weekday composition across weekly origins, not
    instability.

    **What these numbers do not show: savings.** Stockouts, promotions, and
    returns are unmodeled, so no safety-stock or cost claim follows — the
    newsvendor layer is a measuring stick, not a P&L. Later-horizon error
    grows on both tracks, and the synthetic ladder shows mechanics only, not
    real-world accuracy. Regime transfer is unproven — what wins dense loses
    sparse. And UCI zeros may be closed days rather than true zero demand,
    which no model here can tell apart.

    What survives into the final record?

    **Business summary:** This section states the final ranking: ensemble
    0.491, LightGBM 0.498, seasonal rule 0.603. The 80% prediction bands
    cover 77.7% of outcomes, and no savings claim is made.
  figures: [m5:wape_bars, m5:band_calibration, uci:multistep_error_vs_horizon]
  metrics_keys: [naive_mean, naive_last, seasonal_naive, ets, ridge, hgb, hgb_tuned, xgb_tuned, lgbm_tuned, temporal_net]
- id: conclusions
  text_md: |
    ## Results summary

    On dense Walmart M5 daily sales — 600 series, frozen 28-day scored-once
    test — the convex ensemble posts test WAPE 0.491 against 0.603 for the
    seasonal-naive floor, a −0.1125 [−0.1228, −0.1026] gap, with 88.8% of
    series improving. On sparse UCI Online Retail II — 405,416 rows, 89%
    zeros — no run reaches MASE 1.0; the router forecasts zero for 945 of
    1,069 lumpy series. See the
    [full evaluation report](https://amm-ds.github.io/portfolio/projects/02-demand-forecasting/)
    or [try the live demo](https://amm-ds.github.io/portfolio/demos/forecast-workbench/).

    ## Exact numbers

    M5 candidates on the frozen 28-day scored-once test (pooled; WRMSSE is the
    competition-scale weighted error):

    | M5 candidate | test WAPE | test WRMSSE | win rate vs naive |
    |---|---|---|---|
    | seasonal_naive | 0.603 | 0.762 | — |
    | auto_ets | 0.503 | 0.611 | 88.2% |
    | lgbm | 0.498 | 0.596 | 87.8% |
    | **convex_ensemble** | **0.491** | **0.596** | **88.8%** |

    M5 headline:

    - Headline gaps: WAPE −0.1125 [−0.1228, −0.1026], WRMSSE −0.1659 [−0.1772,
      −0.1552] (ensemble); WAPE −0.1057 [−0.1184, −0.0935] (LightGBM).
    - By class (test WAPE), naive → ensemble: dense 0.568 → 0.464, intermittent
      0.749 → 0.603.
    - Next-week service WAPE: ensemble 0.4233 vs naive 0.5442 (gap −0.1208
      [−0.1288, −0.1130]); weekly blocks grow 0.4136 (week 1) → 0.5636 (week 4).
    - Bands: LightGBM covers 77.7% at 13.535 units mean width (**76.9% dense /
      80.6% intermittent**); ensemble 77.7% at 13.342.
    - Pure-L2 arm: 0.4905 WAPE / 0.5952 WRMSSE vs the WAPE blend's 0.4907 /
      0.5958 — inside bootstrap noise; ensemble_l2 is the pooled-test-WRMSSE
      champion; lgbm_l2 bitwise-identical to lgbm.

    Sparse UCI track:

    - Selection champion (tuned boosting): 9.545 MAE / 1.078 MASE vs seasonal
      naive 11.323 / 1.310; no run reaches MASE 1.0; auto ETS loses to the floor
      (11.471).
    - Multi-horizon routing: lumpy h=7 MAE 6.09 vs floor 11.07 (gap [−7.74,
      −2.88]); beats the floor on 21.89% of lumpy series [19.55, 24.32]; router
      assigns zero to 945 of 1,069 lumpy series; routed pooled MAE 7.47 vs
      zero's 9.28.
    - Zero-aware band: predicted-zero rows take [0, history 80th percentile];
      coverage 92.5% on the last fold (93.0% over h=1..14) at 6.01 units mean
      width vs the old zero-width band's 85.8% at 0.00.
    - Cost-aware routing at q=0.90: 878 of 1,069 lumpy series to zero (+0.57
      lumpy MAE [0.40, 0.78]); lumpy newsvendor 2.168 vs 2.213 per unit-demand
      ([−0.079, −0.016]); pooled MAE 7.47 → 8.13 [0.43, 0.92].
    - Routing-level self-check, selection origins: 4.53M (cost rule) vs 4.72M
      (MAE rule).
    - Reconciliation: shrinkage w=0.50, incoherence 447.2→223.6, store MAE
      746.0→731.0.

    ## Protocol

    - M5 (m5_direct_v1): 10 weekly origins (8 selection, 2 test), 28-day horizon,
      ≥1,096 training days.
    - Classes: Syntetos-Boylan ADI/CV² (thresholds 1.32 / 0.49) on each series'
      history up to the last selection origin — 463 dense, 137 intermittent.
    - UCI nowcast ladder (rolling_origin_holdout_v1): 4 expanding origins, 7-day
      embargo; origins 1–3 select, origin 4 (holiday window) scores once.
    - UCI multi-step (direct_multihorizon_v1): 20 weekly origins (16 selection,
      4 test), models for h=1..14.
    - Metrics: MAE = mean |actual − forecast| over scored cells; WAPE = pooled
      absolute error over pooled demand; MASE = error vs seasonal naive; WRMSSE
      = the M5 competition scale.
    - Gaps: paired cluster bootstrap over series, 2,000 replications (seeds
      53–56 headline, 2044 class/routing, 8843 win rates, 9644–9763 cost-aware).
    - Newsvendor: holding 1.0 / stockout 3.0 per unit per day, headline service
      level q=0.90 — documented assumptions, no savings claims.

    ## Limits

    - The 80% M5 bands cover 77.7%.
    - Stockouts, promotions, returns, and safety stock are unmodeled — no
      savings or safety-stock claim until validated on the target panel.
    - Later-horizon error grows on both tracks; reforecast weekly.
    - The synthetic ladder shows mechanics only, not real-world accuracy.
    - Regime transfer is unproven: what wins dense loses sparse; UCI zeros may
      be closed days, not true zero demand.
    - Lumpy routing gain is magnitude, not coverage — 21.89% of lumpy series
      beat the floor.
    - Cost-aware routing pays only at q=0.90 on lumpy demand; a wash at
      q=0.80/0.95 and on erratic demand.

    ## Revision notes

    - Wave 20: direct multi-horizon protocol (20 weekly origins, models for
      h=1..14) and peak-capable candidates.
    - Wave 21: per-class win rates with bootstrap CIs; hurdle/ensemble
      candidates.
    - Wave 22: MA/ADIDA/reconciled baselines, rmae/rmsse reporting, newsvendor
      layer (holding 1.0 / stockout 3.0, headline q=0.90).
    - Wave 23: replaced the degenerate zero-width nowcast band (median on the
      zero atom for 75,880 of 75,880 test-window rows) with the sparse-history
      interval; priced cost-aware routing on the scored origins (numbers above).
    - Wave 24: committed the M5 headline track.
    - Wave 26: rolling next-week service measurement (across all origins, not a
      new holdout).
    - Wave 27: expanded the M5 booster feature space.
    - Wave 28: L1/L2 comparison arms (lgbm_l2 bitwise-identical to lgbm;
      ensemble_l2 minimises selection WRMSSE).

    Full development history: [git history](https://github.com/amm-ds/portfolio/commits/main/projects/02-demand-forecasting)

    ## Reproduce

    `uv run python -m demand_forecasting.cli all` —
    [reproduce in the repository](https://github.com/amm-ds/portfolio/tree/main/projects/02-demand-forecasting)
    · [full evaluation report](https://amm-ds.github.io/portfolio/projects/02-demand-forecasting/).

    ```mermaid
    graph LR
      Q{"Zero-share + ADI<br/>regime diagnosis"}
      Q -->|"dense, M5-like"| E["Convex ensemble"]
      Q -->|"sparse, UCI-like"| R["Mostly-zero router"]
      Q -->|"unknown or mixed"| V["Pilot first"]
      E --> X["Frozen windows, floors, intervals;<br/>no transfer claim across regimes"]
      R --> X
      V --> X
    ```

    **Business summary:** This section records the final numbers, protocol,
    limits, and reproduction steps. Dense M5 demand is served by the
    0.491-error ensemble; sparse UCI demand by the mostly-zero router —
    regime diagnosis, not one champion, is the reusable result.
  figures: []
  metrics_keys: [naive_last, hgb, hgb_tuned]
key_concepts:
  - "**ADI/CV² regime diagnosis** — classifying each series by inter-demand interval and squared variability, not the algorithm choice, decides which track a series belongs to."
  - "**Frozen origins, scored once** — candidates are chosen on past origins and scored exactly once on future ones, because random splits leak the future into training."
  - "**Paired bootstrap intervals** — every quoted gap carries a 95% range over series, so a win is reported as a range rather than a point."
  - "**Mostly-zero routing** — on lumpy demand the best forecast is often exactly zero, with peak-capable models reserved for the few series whose peaks repay them."
  - "**Newsvendor cost check** — routing changes are priced at a stated service level before any savings language; here the trade pays only at q=0.90."
  - "**Coverage reported with width** — honest bands state both how often they cover and how wide they are: the LightGBM bands cover 77.7% at a 13.535-unit mean width, under target rather than tuned to look exact."
