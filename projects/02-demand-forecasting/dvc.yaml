stages:
  prepare:
    cmd: uv run python -m demand_forecasting.cli prepare
    deps:
      - src/demand_forecasting
      - params.yaml
    outs:
      - data/panel.parquet
      - data/dataset.json
  features:
    cmd: uv run python -m demand_forecasting.cli features
    deps:
      - src/demand_forecasting
      - params.yaml
      - data/panel.parquet
    outs:
      - data/features.parquet
  hpo:
    cmd: uv run python -m demand_forecasting.cli hpo
    deps:
      - src/demand_forecasting
      - params.yaml
      - data/features.parquet
    outs:
      - data/hpo_best.json
      - data/hpo_best_xgb.json
      - data/hpo_best_lgbm.json
      - data/hpo_study.db
  train:
    cmd: uv run python -m demand_forecasting.cli train
    deps:
      - src/demand_forecasting
      - params.yaml
      - data/features.parquet
    outs:
      - data/models.pkl
  evaluate:
    cmd: uv run python -m demand_forecasting.cli evaluate
    deps:
      - src/demand_forecasting
      - params.yaml
      - data/panel.parquet
      - data/features.parquet
    outs:
      - reports/report.html
      - reports/figures
      - reports/evaluation_metadata.json

    metrics:
      - reports/metrics.json

  serving:
    cmd: uv run python -m demand_forecasting.cli build-serving
    deps:
      - src/demand_forecasting
      - params.yaml
      - data/models.pkl
      - data/hpo_best.json
      - data/hpo_best_xgb.json
      - data/hpo_best_lgbm.json
      - data/features.parquet
    outs:
      - reports/models/serving

  demo_payload:
    cmd: uv run python -m demand_forecasting.cli demo-payload --data-source uci --reports-dir reports --metrics-dir reports_uci
    deps:
      - src/demand_forecasting
      - params.yaml
      - data_uci/features.parquet
      - reports_uci/metrics.json
      - reports_uci/probabilistic.json
      - reports_uci/evaluation_metadata.json
      - reports_uci/dataset_metadata.json
    outs:
      - reports/demo_payload.json