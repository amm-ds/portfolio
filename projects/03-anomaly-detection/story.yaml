key_concepts:
- '**Alert-budget stream:** Deduplicated alert episodes capped at one page per series per 24 h, turning 1,609 raw IsolationForest rolling+residual alerts into 80 pages.'
- '**Rank-average ensemble:** The mean of each minute''s normalized ranks under IsolationForest, LOF, and OCSVM; it wins the budgeted rolling comparison at the frozen default.'
- '**Event-aware range-F1:** A balance of event precision and recall that counts a labelled window as detected once one alert lands inside it.'
- '**Past-only splits:** Each series trains on its first 70% and scores a later span once, so no test incident leaks into fitting, tuning, or champion selection.'
- '**Windows touched:** The raw share of labelled windows hit, reported apart from range recall''s mean over all 12 series, including zeros for train-only series.'
- '**Synthetic ladder:** A seeded stream that checks pipeline mechanics; its large residual-feature gains never appeared on NAB.'
- '**Operating point:** The threshold-budget and cooldown pair chosen on training data alone; adoption needs +0.05 on validation and exactly one test evaluation, with transfer checked rather than assumed.'
figure_captions:
  eda_signals_overview: Two days (2,880 minutes) of the seeded synthetic stream. CPU, memory, and latency follow a repeating
    daily cycle; injected anomalies appear as simultaneous CPU+latency spikes.
  telemetry_flags: Synthetic test-window flags at the fixed 2% alert budget, compared with ground-truth anomalous minutes.
    The flags track simultaneous CPU+latency spikes; this is not a NAB result.
  hpo_importance: 'One-Class Support Vector Machine tuning on synthetic train-only validation: gamma, the boundary-width setting,
    carries 99% of importance, moving from the failing `scale` default to 0.0131. The best HPO objective is 0.126, distinct from champion-selection PR-AUC.'
  pr_curves: Pointwise precision-recall curves on the synthetic test window, with the 1.89% prevalence floor. Tuned OCSVM
    was frozen by selection PR-AUC 0.1514 before this test AP 0.136 was measured; these curves do not select the champion
    or measure event-window recall.
  range_pr: NAB event-aware precision-recall across score-quantile thresholds. Range-PR area is 0.804 versus a 16-seed no-skill
    band of 0.228 [0.081, 0.401]. At 2% of the stream, precision is 0.527 and recall over evaluable windows is 0.944; these
    are threshold-sweep values, not the fixed-budget raw headline's range precision or twelve-series range recall.
  threshold_sweep: 'Tuned OCSVM synthetic test-window precision and recall across alert budgets, with the fixed 2% point marked:
    17 of 120 flags hit injected anomalies, 14.2% precision. This is point-level load, not 17 distinct anomalies.'
  adaptive_stream: 'Tuned IsolationForest synthetic test-window outcomes for fixed and adaptive thresholds: 120 alerts, 18 true positives, and 102
    false positives fixed; 113, 17, and 96 adaptive. Precision/recall are 0.150/0.159 fixed and 0.150/0.150 adaptive. The
    right panel shows drift z for all five chunks against the trigger at 1.0; none fires. Separately, the same synthetic-calibrated
    rule fires on 31 of 120 real NAB chunks, so adaptive thresholds remain rejected for the headline operating point.'
  nab_timelines: 'Six representative NAB test windows: amber bands are labelled events and pink crosses are IsolationForest
