project_id: 03-anomaly-detection
sections:
  - id: background
    text_md: |
      Operations teams watch CPU, memory, and latency telemetry to catch
      incidents before users do. The expensive failures are the silent ones:
      a latency creep that turns into an outage, a CPU saturation that burns
      an autoscaling budget — each missed minute is paid for later, in
      multiples.

      Labeled incident history rarely exists, and anomalies are rare (order of
      2% of minutes). That combination — unlabeled, imbalanced, streaming —
      makes anomaly detection a genuinely hard, unsupervised problem. This
      project shows how three standard detectors behave on it, and how to
      evaluate them without fooling yourself.

      The economics that frame every design choice below:

      | event | typical cost shape |
      |---|---|
      | missed incident | outage minutes × user impact + recovery, paid in multiples of the warning window |
      | false page | engineer minutes × alert fatigue, erodes trust until real pages get ignored |
      | detector retraining | cheap here — the full pipeline with 90 HPO trials runs in ~75 s |

      **Business implication:** every missed incident has a cost, and every
      false page has one too — the question is which detector minimises the
      total at a fixed alert budget.

  - id: objectives
    text_md: |
      Compare three detector families — IsolationForest, Local Outlier Factor
      (LOF), and One-Class SVM — on the same telemetry stream, honestly.

      What "honest" means concretely:

      - **Time-ordered split:** detectors train on the past only (first 70% of
        the timeline) and are scored on a later window, so metrics reflect
        deployment conditions rather than memorization.
      - **Fixed a-priori threshold:** the alert threshold is the assumed 2%
        contamination quantile — never tuned against ground truth.
      - **Seeded random baseline:** anything that cannot beat coin-flip has no
        business alerting anyone at 3 a.m.
      - **Untuned vs. tuned rows:** every family is reported with and without
        HPO, so tuning gains (or lack of them) are visible per family.

      **Business implication:** these rules are what make the comparison
      shoppable — a client can re-run the same harness on their own telemetry
      and get numbers that mean the same thing.
    metrics_keys: [random, isolation_forest]

  - id: data
    text_md: |
      **Datasets**

      - **Synthetic telemetry (default):** the stream used throughout is
        synthetic and seeded (n = 20 000 one-minute rows, seed 42) — daily
        seasonality plus noise on three channels (`cpu`, `mem`, `latency_ms`),
        with 2% of minutes injected as anomalies (a CPU step of +30–50 points
        and a 2–5× latency multiplier at random timestamps). This is the
        default because evaluation must be *graded*: the injected ground truth
        lets us compute honest ROC-AUC/PR-AUC, and the seedable generator
        regenerates bit-identical data offline in every CI run — no network,
        no drift between environments. The generator lives in the shared
        platform (`portfolio_core.synthetic`).
      - **NSL-KDD (optional real-data track):** the [NSL-KDD data
        registry](https://amm-ds.github.io/portfolio/data-registry/nsl-kdd/)
        entry (UNB/CIC research benchmark, cleaned network-flow records with
        attack categories) is the planned real-data swap-in. It drops into the
        same `DatasetContract` shape, but it is *not* the default: licensing
        and download steps make it unsuitable for graded CI evaluation, so it
        stays an opt-in track behind the contract.

      A versioned `DatasetContract` (checksum, source, license, snapshot date)
      travels with whichever dataset is active, and the ground-truth
      `is_anomaly` / attack label is used for **evaluation only** — no
      detector ever sees it.

      **Business implication:** a reproducible, graded default plus a
      contract-shaped real-data track means the evaluation harness is
      production-shaped from day one — swapping synthetic for client telemetry
      is a config change, not a rebuild.

  - id: eda
    text_md: |
      The raw signals (below, first two days) show clean daily seasonality:
      CPU and memory trace smooth sinusoids, latency wanders around 120 ms.
      Injected anomalies (pink markers) appear as sharp, simultaneous spikes
      in CPU and latency while memory stays on its seasonal path — the
      signature of a resource incident rather than sensor noise.

      The EDA question that decides this project: are anomalies *spread out*
      or *clustered* in feature space? k-nearest-neighbor distances answer it:
      anomalies sit far from normal points (≈ 18.9 vs. ≈ 8.5) but at uniform
      spacing *among themselves* — a compact, self-similar cluster. Keep that
      fact in mind for the results.

      **Business implication:** this single EDA fact predicts which detector
      families will fail before any training budget is spent — that is the
      kind of analysis that saves a client from deploying the wrong tool.
    figures: [eda_signals_overview]

  - id: training
    text_md: |
      Feature engineering is pure polars ETL: the three raw signals plus a
      rolling mean and rolling standard deviation per signal over 10-minute
      and 60-minute windows (12 engineered columns). The first `window − 1`
      rows, which lack a full window, are dropped so detectors train on a
      complete-case matrix.

      All three detectors fit on the **first 70% of the timeline only** —
      13 958 rows — and each family then gets its own hyperparameter study:
      ~30 trials of seeded TPE with median pruning, maximizing PR-AUC on the
      last 20% of the train window as validation. IsolationForest searches
      tree count and row/feature subsampling; LOF searches neighborhood size;
      One-Class SVM searches `nu` and the RBF `gamma` on log scales. The
      test window is never touched during search, and tuned detectors refit
      on the full train window before scoring. Data-quality gates (null rate
      ≤ 1% per column, CPU and memory within [0, 100], latency > 0) run before
      anything trains and halt the pipeline loudly on violation.

      ```mermaid
      flowchart LR
          A[raw telemetry<br/>n = 20 000] --> B[DQ gates<br/>nulls, ranges, freshness]
          B --> C[rolling features<br/>mean/std, windows 10 + 60]
          C --> D[train window<br/>first 70% = 13 958 rows]
          D --> E[fit window 80%<br/>untuned detectors]
          D --> F[validation 20%<br/>30 seeded TPE trials]
          F --> G[best params<br/>per family]
          E --> H[tuned refit<br/>full train window]
          G --> H
      ```

      **Business implication:** tuning and validation run entirely on past
      data with leakage-proof splits — so the detector you deploy is the
      detector you measured, and retraining on a client's own history does
      not silently change the guarantees.
    figures: [telemetry_flags, hpo_importance]

  - id: evaluation
    text_md: |
      Each detector — untuned and tuned — scores the 5 983 test-window rows;
      a seeded random baseline (uniform scores, same seed) anchors the
      comparison. Ranking quality is measured by ROC-AUC and PR-AUC — PR-AUC
      matters more at this prevalence (1.89%), where a naive "everything is
      normal" classifier already scores 0.019.

      Binary alert flags use one fixed operating point per model: the top 2%
      of its scores (the assumed contamination quantile). No threshold was
      tuned against the ground-truth labels at any point. The threshold-sweep
      figure shows what the champion's precision/recall curve looks like
      across alert budgets, with the 2% budget marked.

      ```mermaid
      flowchart TD
          A[anomaly score<br/>test-window minute] --> B{score >= threshold?<br/>top 2% quantile, fixed a priori}
          B -->|yes| C[page on-call<br/>flagged minute]
          B -->|no| D[stay silent]
          C --> E[count TP / FP<br/>vs. injected ground truth]
          D --> E
          E --> F[ROC-AUC + PR-AUC<br/>vs. random baseline]
      ```

      **Business implication:** reporting AUC *and* the precision/recall at a
      stated alert budget is what makes these numbers negotiable with a
      client — "at 120 pages per window you catch ~15% of incidents" is a
      staffing conversation, not a vanity metric.

  - id: results
    text_md: |
      The full run ladder on the held-out window (ROC-AUC / PR-AUC): random
      baseline 0.509 / 0.019; untuned LOF 0.527 / 0.019 and untuned One-Class
      SVM 0.337 / 0.024; tuned LOF 0.505 / 0.025 and **tuned One-Class SVM
      0.906 / 0.136**; untuned IsolationForest 0.916 / 0.124 and tuned
      0.917 / 0.121.

      **Honest winner:** by ROC-AUC, `isolation_forest_tuned` (0.917); by
      PR-AUC — the metric that matters at 1.9% prevalence — `ocsvm_tuned`
      (0.136), +0.40 over random and +0.57 over its own untuned version.
      IsolationForest was already near-optimal untuned (tuning moved ROC-AUC
      by +0.001).

      Key findings:

      - **OCSVM rescued by tuning (0.34 → 0.91 ROC-AUC):** the default
        `gamma="scale"` failed, but the study found `gamma=0.013` (parameter
        importance 0.99) — a ~6× tighter kernel whose boundary carves the
        anomaly blob out instead of folding it in.
      - **LOF not rescued — structural blindness:** its best neighborhood
        size saturated at the search cap (200) and test ROC-AUC went down
        (0.527 → 0.505). LOF compares each point only to its local
        neighborhood, so inside a self-similar anomaly cluster every point
        looks normal (median LOF ≈ 1.11 on test anomalies vs ≈ 1.09 on
        normals). No neighborhood size fixes a method that never looks
        outward.
      - **Fixed-2%-budget operating point ties:** at the fixed alert budget the
        three top detectors each flag 120 test minutes at ~15% recall / ~14%
        precision. AUC/PR-AUC measure ranking quality; a production deployment
        would pick the operating point from the sweep curve against an
        alerting budget, not from AUC alone.

      The engineering guardrails behind these numbers: fixed contamination for
      every run (untuned and tuned), HPO validated on a slice of the train
      window only, and sklearn-1.9-safe score replication so train-time and
      test-time scoring stay consistent.

      **Business implication:** One-Class SVM went from worst to contender
      after tuning — the lesson is that defaults, not algorithms, are often
      the problem; a cheap, disciplined HPO pass should precede any "this
      model doesn't work" verdict.
    figures: [roc_curves, pr_curves, score_distribution, threshold_sweep]
    metrics_keys:
      [random, isolation_forest, lof, ocsvm, isolation_forest_tuned, lof_tuned, ocsvm_tuned]

  - id: conclusions
    text_md: |
      The takeaways, in short:

      - **Detector families make different bets.** Density- and boundary-based
        methods assume anomalies are sparse and dissimilar to everything; when
        incidents arrive as a repeated, self-similar signature, partitioning
        methods (IsolationForest) or residual/context-aware features still see
        them. Choosing a detector without checking that assumption is how
        silent incidents ship to production.
      - **Tuning is verdict-changing — but only sometimes.** One-Class SVM
        went from below-chance (0.337) to PR-AUC champion (0.136) because one
        scale-sensitive knob (`gamma`) was wrong by default; LOF stayed at
        chance because its failure is structural, not hyperparametric. HPO is
        cheap here (90 seeded trials in about a minute), so the honest move is
        to run it and report both outcomes.
      - **A random baseline keeps everyone honest.** At 2% prevalence,
        near-chance models can look plausible on accuracy; the seeded random
        row in every metrics table makes "beating chance" the admission fee.
      - **Guardrails make results trustworthy.** DQ gates that halt the
        pipeline, a time-ordered split, validation inside the train window
        only, and a fixed (untuned) threshold mean the reported numbers are
        ones a client can plan an alerting budget around.

      Roadmap:

      - Streaming detection with adaptive thresholds (score-drift monitoring,
        budget-aware operating-point updates between scheduled retrains).
      - Residual/contextual features (rolling-median baselines, seasonal
        adjustment) that de-cluster repeated incident signatures.
      - NSL-KDD production track: real network-flow telemetry behind the same
        dataset contract, replacing the synthetic default for graded
        evaluation on live-shaped data.

      **Business implication:** the deliverable is not "a model with 0.92
      AUC" — it is an evaluation harness that tells you *when to distrust the
      model*, what tuning changed and why, and what a given alert budget buys;
      that is what de-risks putting anomaly detection on a client's critical
      path.
    metrics_keys: [ocsvm_tuned, isolation_forest_tuned, random]
