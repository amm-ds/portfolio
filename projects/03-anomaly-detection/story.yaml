project_id: 03-anomaly-detection
short_version: "On NAB at a fixed 2% alert budget, IsolationForest catches 16 of 17 incident windows but fires 1,609 alerts. A one-page-per-day cap cuts that to 80 pages; a rank-average ensemble halves the load again at higher recall — page the alert stream, not the detector score."
sections:
- id: background
  text_md: |
    **The detector catches 16 of 17 incidents — and raises 1,609 alerts
    doing it.** The stage is the Numenta Anomaly Benchmark (NAB): twelve
    series — AWS CloudWatch, traffic, known-cause failures — with
    labelled windows. At a fixed 2% alert budget on the nine evaluable
    series, IsolationForest touches 16 of 17 windows. Pointwise PR-AUC
    is 0.527; event-aware range-F1 is 0.157. The system diagram shows
    the fix: page the deduplicated stream, not the raw score.

    ```diagram 03-detection-pipeline
    ```

    Trace the path: the detector scores every minute against a
    train-anchored top-2% threshold, then the budget stage — dedup, a
    24 h cap — shrinks the stream before a person sees it. That cap is
    the story: 1,609 alerts become 80 pages. What keeps both numbers
    honest?

    **Business summary:** The detector finds 16 of 17 NAB incidents but
    fires 1,609 alerts; one page per series per day cuts that to 80 at
    small recall cost.
  figures: []
- id: objectives
  text_md: |
    **The benchmark must make false positives as visible as misses.**
    Anomaly detection is too often graded as one area-under-curve number
    on shuffled splits. That hides what an on-call engineer actually
    feels — alert storms and silent misses. So four controls were fixed
    before any detector ran, and the measurement-contract diagram lays
    them out as three gates: past-only splits, a frozen operating point
    with a seeded random floor, and two metric families kept apart. The
    common shortcut — tuning the alert threshold until the test labels
    look good — stays out by design.

    ```diagram auto-03-anomaly-detection-1
    ```

    Read the left gate first: training takes the first 70% of each
    series, the hyperparameter search gets only the last 20% of that
    training span, and the later window is scored once. The middle gate
    fixes the threshold at the top 2% of training scores, the assumed
    contamination budget, before any scoring happens. The right gate
    splits the reading: pointwise ROC-AUC and PR-AUC rank every minute,
    while event-aware range precision, recall, and F1 count a window as
    detected once one alert lands inside it.

    - Train on the first 70% of each series. Score a later window. Never the same data.
    - Fix the threshold at the assumed 2% contamination budget. Never tune it on test labels.
    - Report untuned and tuned detectors against a seeded random baseline.
    - Keep two metric families apart. Pointwise ranking uses ROC-AUC and
      PR-AUC, area-under-curve scores. Event-aware range scores count a
      window as detected once one alert lands inside it.

    With the contract fixed, the next question is which data can carry
    headline evidence under it.

    **Business summary:** Four fixed rules keep the comparison honest:
    past-only training, a frozen threshold, a seeded random floor, and
    pointwise metrics apart from event-aware ones.
  figures: []
  metrics_keys: [random, isolation_forest]
- id: data
  text_md: |
    **Real incident windows headline. Synthetic data only checks
    mechanics.** Three sources were pinned because they answer three
    different questions. NAB (primary) is twelve single-metric series
    from AWS CloudWatch, traffic, and known-cause failures. Labels come
    from `combined_windows.json`. Nine series have test events in the
    scored span; three hold every label inside the training span. Those
    three are excluded, not counted as misses — scoring them would
    require a model fit on its own incidents. The synthetic path is a
    seeded 20,000-row one-minute CPU/memory/latency stream with 2%
    injected anomalies: fully reproducible, but trivially separable, so
    it shows pipeline mechanics, not real precision. The NSL-KDD probe is
    a pinned network-flow test set whose 56.9% prevalence blocks any
    comparison with rare telemetry. Labels are used for evaluation only. See the
    [NAB dataset card](https://amm-ds.github.io/portfolio/data-registry/nab/).

    ```diagram auto-03-anomaly-detection-2
    ```

    The data-lineage diagram shows the three sources and what each is
    allowed to claim. The NAB series lead: the twelve
    series hit one decision — do labelled windows fall in the scored span?
    Nine say yes and carry the headline; three say no and leave the study.
    The synthetic and probe sources stay humble behind it: synthetic rows
    feed mechanics and tuning checks, the probe flow checks the contract
    only — neither carries a headline claim.

    **Business summary:** NAB's nine evaluable series carry the headline; a
    synthetic stream checks the pipeline; the NSL-KDD probe checks the
    contract; labels never train a model.
  figures: []
- id: eda
  text_md: |
    **The synthetic anomalies form a blob; the real ones hide in plain
    sight.** Start with the signals-overview figure: two days (2,880
    minutes) of the seeded stream. CPU, memory, and latency follow a
    clear daily cycle, and every injected anomaly spikes CPU and latency
    at once while memory keeps its seasonal path. The blob is tight —
    mean distance to the 20 nearest neighbours (k-NN) is ≈20.5 against
    ≈9.5 for normal rows — which is exactly why a local detector can
    still rate inner blob points as normal: the failure that shows up
    later in LOF is visible here first.

    NAB shows the opposite problem. The score-distribution figure splits
    IsolationForest scores into in-window and outside-window minutes;
    the two histograms overlap so much that no tested threshold
    separates incidents from normal traffic. Pointwise quality is real
    but thin; the open question is what it costs a person.

    The judging rules: one past-only parameter search, one fixed top-2%
    threshold, three scored alert streams. Raw pages every
    above-threshold minute. Deduped pages each burst once, at its peak
    score. Budgeted allows one page per series per 24 h. On-call load is
    measured.

    So the sweep that follows asks: does any detector family make the
    overlap problem go away?

    **Business summary:** Injected anomalies form one blob that fools
    local detectors; real NAB scores overlap too much for a clean
    threshold; all results below use three alert streams.
  figures: [eda_signals_overview, nab_score_distribution]
- id: training
  text_md: |
    **Finding 1 — the ensemble wins the sweep; no single family does.** The
    family × feature sweep (4 families × 2 feature sets, untuned, one
    threshold) finds one winner: the **rank-average ensemble**, which scores
    every minute by the mean of its normalized ranks under IsolationForest,
    LOF, and OCSVM. Pointwise PR-AUC spans 0.515–0.577 across the grid; no
    single family escapes its old band (0.515–0.574). Diverse failure modes —
    partition, local density, boundary — combine only where members
    disagree, which is exactly where single detectors are fragile. Raw
    range recall spans 0.688–0.750 with 1,003–3,586 alerts emitted. The
    telemetry-flags figure shows the budget's synthetic flags tracking the
    simultaneous CPU+latency spikes ground truth marks.

    **Fusion core — normalize ranks, not incompatible raw scores.** Each
    detector contributes the same scale before the average is taken.

    ```python
    def _ranks(scores: np.ndarray) -> np.ndarray:
        order = np.argsort(scores, kind="stable")
        out = np.empty(len(scores), dtype=float)
        out[order] = np.arange(len(scores), dtype=float)
        return out / max(len(scores) - 1, 1)

    members = [fit_detector(d, x_fit, config) for d in BASE_DETECTORS]

    def score_ensemble(x: np.ndarray) -> np.ndarray:
        return np.mean([_ranks(member(x)) for member in members], axis=0)
    ```

    Excerpt from [nab_sweep.py](https://github.com/amm-ds/portfolio/blob/main/projects/03-anomaly-detection/src/anomaly_detection/nab_sweep.py).

    **Finding 2 — budgeting the page stream fixes load without
    retraining.** Episode dedup plus the 24 h cap cuts pages twenty- to
    thirty-three-fold across all eight cells. Range-F1 rises in each. The headline
    cell drops 1,609 → 80 pages. Range recall falls 0.729 → 0.562.
    Range-F1 rises 0.157 → 0.315. On the like-for-like rolling cells the
    ensemble posts 35 pages at range-F1 0.533 against IsolationForest's
    66 pages at 0.388, holding recall at 0.604 in both.

    **Finding 3 — the winning candidate needs no tuning.** Each training
    window splits 80/20. Candidate (budget, cooldown) points score the
    budgeted stream on six validation windows, five series. IsolationForest
    adopts (0.5%, 24 h; validation range-F1 0.318 vs 0.237) and transfers:
    pages fall 66 → 33 and 80 → 46, range-F1 to 0.433 and 0.382. The
    ensemble's surface is the mirror image: dead flat (best gain +0.010 at
    (1%, 12 h)), so the default stands — the one committed test pass
    confirms 35 pages at range-F1 0.533. The operating-point-surface figure
    carries both: one line per threshold budget, the ring on the documented
    (2%, 24 h) default. The tuning-importance figure shows gamma at 99% of
    OCSVM's search. LOF's flat surface (+0.042 at best) keeps
    the default. OCSVM's
    marginal adoption (0.5%, 72 h; +0.056) fails on test (−0.043/+0.033
    range-F1). Six windows cannot certify a peak whose neighbours average
    0.168 against its 0.206; sub-0.1 gains are noise.

    **The synthetic ladder disagrees.** Untuned IsolationForest scores
    0.9158 ROC-AUC / 0.1239 PR-AUC on the 5,983-row window; prevalence is
    1.89%, so PR-AUC nears zero despite strong ranking. Tuned
    IsolationForest leads ROC-AUC (0.9171), tuned OCSVM PR-AUC (0.1355),
    random scores 0.5091 / 0.0194. Rolling-median residuals shatter the
    blob: IsolationForest jumps to 0.9999 / 0.9960, but the gain never
    appears on NAB. The NSL-KDD probe (0.8877 / 0.8979) stays a probe at
    56.9% prevalence.

    Which stream pages a person? The evaluation grades that.

    **Business summary:** Switching single detectors is not worth it;
    combining them is. The rank-average ensemble halves the like-for-like
    paged load at the frozen default — 35 pages at range-F1 0.533 — and the
    budget layer stays the deployed artifact.
  figures: [telemetry_flags, hpo_importance, nab_tune_surface]
- id: evaluation
  text_md: |
    **Budget the alert stream — and combine the detectors.** The
    evaluation asks three questions, and the three figures keep them
    apart. Question one: which detector ranks anomalous minutes best?
    The precision-recall curves figure answers it on the synthetic
    window against its 1.9% prevalence floor — look for how little the
    curves lift above that floor; tuned OCSVM leads average precision at
    0.136. A ranking is not a page policy. Question two: what does the
    fixed operating point cost? The threshold-sweep figure marks the 2%
    point on synthetic data: 115 flags, precision and recall both about
    15% (14.8%), seventeen hits on anomalous minutes — point load, not seventeen
    incidents. Question three: can the threshold adapt to drift? The
    streaming-simulation figure says no for now: synthetic-calibrated
    median/IQR triggers fire on 31 of 120 real NAB chunks, too twitchy
    for the headline.

    On NAB the measured trade: one page per incident per day costs
    0.13–0.25 of range recall and buys twenty- to thirty-fold fewer
    pages. Range-F1 rises in every sweep cell. The rank-average ensemble
    then halves the like-for-like load again — 66 → 35 pages, range-F1
    0.388 → 0.533, recall unchanged at 0.604 — and needs no tuning: its
    validation surface is flat. Tuning still halves IsolationForest's
    pages where it transfers. What remains is on-call capacity versus
    recall cost — a staffing call.

    **The detector layer itself was challenged and held.** Three
    refinements ran against the committed recipe on identical windows —
    conformal p-values against each hour-of-week context's non-anomalous
    train scores, rank fusion of IsolationForest and LOF, and the same
    fusion after per-context normalization — behind one adoption gate:
    precision at the budget and range-F1 must both improve while coverage
    holds at 16 of 17. None clears it. Calibration spends the budget
    before scoring: a forty-minute context makes the conformal grid
    bottom out near p = 0.049, and the pooled 2% quantile lands there,
    firing 2,546 alerts at the 2% face budget with precision and
    range-F1 both down. Fusion lifts precision at the budget to 0.650
    and range-F1 to 0.403 while halving raw alerts — and loses two of
    seventeen windows doing it, one on a known-cause failure series. The
    committed detector stands, published as a designed negative result.

    From here, the evidence is read panel by panel.

    **Business summary:** Budget the pages, then combine the detectors:
    35 pages instead of 1,609, each incident paged about once a day,
    at 0.13–0.25 recall cost.
  figures: [pr_curves, range_pr, adaptive_stream]
- id: results
  text_md: |
    **What the evidence shows, panel by panel.** The timeline-panels
    figure holds six representative NAB windows: amber bands are labelled
    events, pink crosses alerts, 897 alerts in all. Read any panel
    bottom-up: find the amber band first, then count how many crosses
    land inside it versus outside — the outside crosses are an on-call
    engineer's night. The nyc_taxi timeline figure zooms the hardest
    series: 3 of 4 windows touched, range recall 0.750, pointwise PR-AUC
    0.462, 179 alerts, the miss left visible rather than averaged away.
    The alert-budget figure then prices the trade: range-F1 against the
    alert budget per NAB group. Only IsolationForest sits on that curve —
    it is a budget dial, not a detector ranking.

    The range-PR figure answers the threshold question directly. Sweeping
    the alert threshold over the score quantiles — under the project's own
    window matching, not pointwise labels — the champion's range-PR area is
    **0.804** against a 16-seed random band at **0.228 [0.081, 0.401]**: the
    ranking is real, not prevalence restated. At the operating points an
    on-call team actually lives at, precision at a fixed alert budget reads
    **0.680** (0.5% of the stream), **0.632** (1%), **0.527** (2%), and
    **0.234** (5%), recall 0.944 across the evaluable windows. The no-skill
    precision at 2% is 0.082 [0.063, 0.105] — the champion pages six times
    more precisely than chance while still touching nearly every window.

    **The candidate that changes the recommendation is a number, not a
    panel.** The sweep's rank-average ensemble posts budgeted range
    precision 0.553 on the rolling cell — pages still miss half the
    time, but the miss rate roughly halves against IsolationForest's
    0.347 — while cutting pages 66 → 35 at equal recall. The panels above
    stay IsolationForest because the headline pass keeps the frozen
    single-family convention; the family answer lives in the sweep
    tables.

    **What this does not show: production readiness.** Range precision
    stays low: 0.107 fixed budget, 0.306 budgeted; pages still mostly
    fire outside incidents. Adaptive thresholds fired on 31 of 120 real
    NAB chunks — too twitchy for the headline. The NSL-KDD probe does not
    establish transfer; the synthetic stream shows no real precision. No
    claim covers multivariate detectors, drifted telemetry, or
    unattended paging. And a detector-layer refinement round failed its
    adoption gate in both directions: context calibration fired 2,546
    alerts at a 2% face value, and the rank fusion that halved raw
    alerts while lifting range-F1 to 0.403 dropped incident coverage to
    14 of 17. The metrics moved; the incidents did not forgive it.

    The full records behind every number — exact tables, protocol,
    limits, and reproduction — sit in the conclusions.

    **Business summary:** Panels show false alarms crowding real
    incidents; the budget curve prices recall versus load. Use it to set
    an alert budget, not to auto-page.
  figures: [nab_timelines, nab_timeline_nyc_taxi, nab_alert_budget]
  metrics_keys: [random, isolation_forest, lof, ocsvm, isolation_forest_tuned, lof_tuned, ocsvm_tuned]
- id: conclusions
  text_md: |
    ## Results summary

    At a fixed 2% alert budget on nine of NAB's 12 series,
    IsolationForest with rolling+residual features touches 16 of 17
    labelled windows and fires 1,609 alerts (pointwise PR-AUC 0.527;
    range-F1 0.157). Episode dedup plus a one-page-per-series-per-day cap
    cuts that to 80 pages at range-F1 0.315 (range recall 0.729 → 0.562);
    train-side tuning halves it again to 46 pages at range-F1 0.382. The
    rank-average ensemble of the three detector families beats every
    single-family point at the frozen default — 35 pages at range-F1
    0.533, recall 0.604 — and its flat validation surface means no
    tuning is warranted. Sub-0.1 range-F1 differences across six
    validation windows read as noise. A refinement ablation at the same
    budget — context-calibrated thresholds, IF+LOF rank fusion, and
    normalized fusion — then cleared none of its adoption conditions, so
    the committed detector stands (ablation table below). [full evaluation report](https://amm-ds.github.io/portfolio/projects/03-anomaly-detection/)

    ## What the experiment taught

    - No single detector family beat the headline recipe — the
      rank-average ensemble did: at the frozen default it pages 35 times
      at range-F1 0.533, versus 80 pages at 0.315 for the headline
      IsolationForest cell, at higher recall (0.604 versus 0.562).
      Switching families was not worth it; combining them was.
    - Episode dedup plus the 24 h page cap cut pages twenty- to thirty-fold in
      every sweep cell and raised range-F1 each time.
    - Train-side tuning transferred for IsolationForest (80 → 46 pages) but not
      for OCSVM: six validation windows cannot certify a peak. The
      ensemble's flat surface (+0.010 at best) certified the default
      instead.
    - The synthetic ladder disagreed with NAB: residual-feature gains never
      transferred, so synthetic evidence stays mechanics-only.
    - Detector-layer refinement is not free: conformal context calibration
      spent about 2.4 times the face alert budget before any scoring (the
      p-value grid on forty-minute contexts bottoms out near 0.049), and
      IF+LOF rank fusion reached range-F1 0.403 only by dropping to 14 of
      17 windows. Measured against the gate, the committed detector stands;
      the cheapest load cut remains the page layer, not the detector score.
    - Range precision stays the limiting factor (0.107 fixed budget;
      0.306 for the IsolationForest headline cell, 0.553 for the champion
      ensemble on the rolling cell): the artifact is an alert-budget dial,
      not a detector ranking.

    ## Exact numbers

    NAB headline (fixed 2% budget, IsolationForest with rolling+residual features,
    scored once per series):

    | NAB group | pointwise PR-AUC | range-F1 | windows touched (alerts emitted) |
    |---|---|---|---|
    | realTraffic | 0.728 | 0.310 | 5/5 (188) |
    | realKnownCause | 0.438 | 0.074 | 8/9 (1,289) |
    | realAWSCloudwatch | 0.404 | 0.088 | 3/3 (132) |
    | **overall** | **0.527** | **0.157** | **16/17 (1,609)** |

    Range-PR sweep + no-skill controls (threshold sweep over score quantiles,
    window matching throughout; artifact `reports/nab_metrics.json → no_skill`):

    | measure | champion | no-skill band (16 seeds) |
    |---|---|---|
    | range-PR area | **0.804** | 0.228 [0.081, 0.401] |
    | precision at 0.5% of stream | 0.680 | — |
    | precision at 1% of stream | 0.632 | — |
    | precision at 2% of stream (recall 0.944) | 0.527 | 0.082 [0.063, 0.105] |
    | precision at 5% of stream | 0.234 | — |
    | no-skill recall at 2% | — | 0.885 [0.806, 0.962] |

    Sweep cells, raw → budgeted stream (alerts | range recall | range-F1):

    | sweep cell | alerts | range recall | range-F1 |
    |---|---|---|---|
    | isolation_forest + rolling | 1,864 → 66 | 0.729 → 0.604 | 0.154 → 0.388 |
    | isolation_forest + rolling_residual | 1,609 → 80 | 0.729 → 0.562 | 0.157 → 0.315 |
    | ensemble + rolling | 1,157 → 35 | 0.729 → 0.604 | 0.485 → 0.533 |
    | ensemble + rolling_residual | 1,003 → 45 | 0.729 → 0.562 | 0.316 → 0.365 |
    | lof + rolling_residual | 3,586 → 122 | 0.750 → 0.542 | 0.088 → 0.200 |

    Budgeted stream, default → tuned: isolation_forest + rolling 66 → 33 pages,
    range-F1 0.388 → 0.433; isolation_forest + rolling_residual 80 → 46, range-F1
    0.315 → 0.382; the ensemble, lof, and ocsvm cells keep their defaults
    (ensemble: 35 and 45 pages at range-F1 0.533 and 0.365).

    Detector-layer ablation, identical windows (raw stream at the 2% budget;
    pages = deduped + 24 h cap; artifact `reports/nab_refinement.json`):

    | candidate | alerts (raw → pages) | precision@budget | range-F1 | windows touched | PR-AUC |
    |---|---|---|---|---|---|
    | isolation_forest (committed) | 1,609 → 80 | 0.512 | 0.157 | 16/17 | 0.527 |
    | if_calibrated | 2,546 → 103 | 0.490 | 0.148 | 16/17 | 0.522 |
    | fusion_if_lof | 786 → 41 | 0.650 | 0.403 | 14/17 | 0.587 |
    | fusion_if_lof_norm | 887 → 52 | 0.637 | 0.391 | 15/17 | 0.573 |

    Synthetic window (5,983 test rows, 1.89% prevalence): untuned IsolationForest
    0.9158 ROC-AUC / 0.1239 PR-AUC; tuned IsolationForest 0.9171 ROC-AUC; tuned
    OCSVM 0.1355 PR-AUC; random 0.5091 / 0.0194; rolling-median residual features
    lift IsolationForest to 0.9999 / 0.9960 without NAB transfer. NSL-KDD probe:
    0.8877 / 0.8979 at 56.9% test prevalence.

    ## Protocol

    - Splits: train on the first 70% of each series; score the later span
      once; the hyperparameter slice is the last 20% of training (~30
      seeded TPE trials, past-only).
    - Threshold: train-anchored top-2% quantile of each series' scores —
      the assumed contamination budget — fixed before scoring; no label tuning.
    - Event rule: a labelled window counts as detected when at least one
      alert lands inside it; range precision is measured over alerts
      outside windows; range recall is the mean over all 12 series, with
      the three window-less series counting as zero — the raw detected
      fraction is reported separately as windows touched.
    - Streams: raw (every above-threshold minute pages); deduped
      (contiguous runs page once at the run's max-score minute); budgeted
      (deduped plus at most one page per series per 24 h).
    - Tune stage: inner 80/20 split of each series' training window;
      budget grid 0.5–8%, cooldown grid 6–72 h; objective is mean budgeted
      range-F1 over all 12 series × both feature sets (24 runs per point);
      adoption needs +0.05 over the documented (2%, 24 h) default; six
      validation windows across five series; exactly one test pass per family
      (four families).
    - Refinement stage (`nab-refine`): candidates scored on identical windows
      against an in-artifact baseline; adoption requires precision at the
      budget and range-F1 to improve while windows touched holds at 16/17;
      calibration references are the non-anomalous train scores of each
      hour-of-week context (thin contexts fall back to the series-global
      set, then to the committed raw cut).

    ## Limits

    - Range precision stays the limiting factor (0.107 fixed budget; 0.306
      budgeted for the IsolationForest headline, 0.553 for the champion
      ensemble on the rolling cell): even the champion fires roughly half
      its pages outside incidents. This supports alert-budget design — not
      unattended paging or adaptive-threshold rollout — until real-data
      precision and drift calibration improve.
    - Synthetic anomalies are trivially separable: the residual fix's huge
      synthetic gain does not transfer to NAB, and the synthetic stream
      cannot show real precision.
    - NSL-KDD is a probe, not transfer evidence: 56.9% prevalence,
      labelled split, unseen attack categories, flow semantics.
    - No claim for multivariate detectors or drifted telemetry.
    - The refinement ablation is deliberately single-config: one fusion
      pair, one context granularity, one budget. A production pass could
      revisit coarser contexts or train-side selection — under the same
      adoption gate.

    ```diagram auto-03-anomaly-detection-3
    ```

    **Business summary:** The committed recipe: rank-average ensemble of
    the three families at the documented default (2%, 24 h) — 35 pages at
    range-F1 0.533, recall 0.604 — with no tuning required; all of it
    reproducible.
  figures: [threshold_sweep]
