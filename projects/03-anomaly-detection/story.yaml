project_id: 03-anomaly-detection
sections:
  - id: background
    text_md: |
      Operations teams watch CPU, memory, and latency telemetry to catch
      incidents before users do. The expensive failures are the silent ones:
      a latency creep that turns into an outage, a CPU saturation that burns
      the autoscaling budget — each missed minute is paid for later, in
      multiples. Labeled incident history rarely exists and anomalies are rare
      (order of 2% of minutes); unlabeled, imbalanced, and streaming, this is
      anomaly detection at its hardest. The full design rationale lives in
      `DESIGN.md`.

      The economics that frame every choice below:

      | event | typical cost shape |
      |---|---|
      | missed incident | outage minutes × user impact + recovery, paid in multiples of the warning window |
      | false page | engineer minutes × alert fatigue, erodes trust until real pages get ignored |
      | detector retraining | cheap here — the full pipeline with 90 HPO trials runs in ~80 s |

      **Business implication:** every missed incident has a cost, and every
      false page has one too — the question is which detector minimizes the
      total at a fixed alert budget.

  - id: objectives
    text_md: |
      Compare three detector families — IsolationForest, Local Outlier Factor
      (LOF), and One-Class SVM — on the same telemetry stream under rules that
      make the comparison like-for-like:

      - **Time-ordered split:** detectors train on the past only (first 70%
        of the timeline) and are scored on a later window, so metrics reflect
        deployment conditions rather than memorization.
      - **Fixed a-priori threshold:** alerts fire at the assumed 2%
        contamination quantile — never tuned against ground truth.
      - **Seeded random baseline:** anything that cannot beat coin-flip has no
        business paging anyone at 3 a.m.
      - **Untuned vs. tuned rows:** every family is reported with and without
        HPO, so tuning gains (or the lack of them) are visible per family.
      - **Event-based metrics on real data:** on NAB, PR-AUC and range-F1
        lead — a labelled window counts as detected when at least one alert
        falls inside it.

      **Business implication:** these rules are what make the comparison
      shoppable — a client can re-run the same harness on their own telemetry
      and get numbers that mean the same thing.
    metrics_keys: [random, isolation_forest]

  - id: data
    text_md: |
      The primary track is real data: a bounded subset of 12 series from the
      [Numenta Anomaly Benchmark](https://github.com/numenta/NAB) spanning
      AWS CloudWatch metrics, traffic sensors, and known-cause system
      failures — each fetched as a checksum-pinned CSV with labelled anomaly
      windows from `combined_windows.json` (dataset card:
      [NAB registry](https://amm-ds.github.io/portfolio/data-registry/nab/),
      import manifest: `data-registry/imports/nab.json`; cite Ahmad, Lavin,
      Purdy & Agha 2017, Neurocomputing).

      - **NAB — real-data track (default `data_source`):** headlines the
        evaluation; its labelled windows make event-based scoring possible.
      - **Synthetic telemetry — the seeded CI / fast path:** a generator
        (n = 20 000 one-minute rows, seed 42) with 2% injected anomalies
        across daily-seasonality CPU/memory/latency channels. It regenerates
        bit-identical offline in every CI run and answers pipeline questions
        fast — but its anomalies are trivially separable, so it cannot rank
        detectors on real-world precision.
      - **NSL-KDD — secondary real-data track:** the [NSL-KDD data
        registry](https://amm-ds.github.io/portfolio/data-registry/nsl-kdd/)
        entry (UNB/CIC network-flow benchmark) behind the same
        `DatasetContract` shape — a transfer probe, caveats stated below.

      Ground-truth labels are used for **evaluation only** — no detector ever
      sees them.

      **Business implication:** real data headlines and the synthetic stream
      is labelled the fast path — a client sees both the real-world numbers
      and the reproducible harness that produced them.

  - id: eda
    text_md: |
      The raw signals in `eda_signals_overview` (below, first two days) show
      clean daily seasonality: CPU and memory trace smooth sinusoids, latency
      wanders around 120 ms. Injected anomalies appear as sharp, simultaneous
      spikes in CPU and latency while memory stays on its seasonal path — the
      signature of a resource incident rather than sensor noise.

      The EDA question that decides this project: are anomalies *spread out*
      or *clustered* in feature space? k-nearest-neighbor distances answer it:
      anomalies sit far from normal points (≈ 18.9 vs. ≈ 8.5) but at uniform
      spacing *among themselves* — a compact, self-similar cluster. Hold that
      fact; it predicts the results.

      **Business implication:** this single EDA fact predicts which detector
      families will fail before any training budget is spent — that is the
      kind of analysis that saves a client from deploying the wrong tool.
    figures: [eda_signals_overview]

  - id: training
    text_md: |
      Feature engineering is pure polars ETL: three raw signals plus rolling
      mean and standard deviation per signal over 10- and 60-minute windows
      (12 engineered columns); warm-up rows lacking a full window are dropped
      for a complete-case matrix.
      All three detectors fit on the **first 70% of the timeline only** —
      13 958 rows — and each family gets its own study: ~30 seeded TPE trials
      with median pruning, maximizing PR-AUC on the last 20% of the train
      window. IsolationForest searches tree count and subsampling; LOF
      neighborhood size; One-Class SVM searches `nu` and the RBF `gamma` on
      log scales. The test window is never touched during search; tuned
      detectors refit on the full train window before scoring. DQ gates (null
      rate ≤ 1% per column, CPU/memory within [0, 100], latency > 0) run
      before anything trains and halt the pipeline on violation.
      `telemetry_flags` shows the test-window flags the champion
      produces; `hpo_importance` shows what the search moved.

      ```mermaid
      flowchart LR
          A[raw telemetry<br/>n = 20 000] --> B[DQ gates<br/>nulls, ranges, freshness]
          B --> C[rolling features<br/>mean/std, windows 10 + 60]
          C --> D[train window<br/>first 70% = 13 958 rows]
          D --> E[fit window 80%<br/>untuned detectors]
          D --> F[validation 20%<br/>30 seeded TPE trials]
          F --> G[best params<br/>per family]
          E --> H[tuned refit<br/>full train window]
          G --> H
      ```

      **Business implication:** tuning and validation run entirely on past
      data with leakage-proof splits — so the detector you deploy is the
      detector you measured, and retraining on a client's own history does
      not silently change the guarantees.
    figures: [telemetry_flags, hpo_importance]

  - id: evaluation
    text_md: |
      Each detector — untuned and tuned — scores the 5 983 test-window rows,
      with a seeded random baseline (uniform scores, same seed) anchoring the
      comparison. Ranking quality is ROC-AUC and PR-AUC; `pr_curves` overlays
      both against the prevalence floor. PR-AUC matters more at this
      prevalence (1.89%), where a naive "everything is normal" classifier
      already scores 0.019.

      Binary alert flags use one fixed operating point per model: the top 2%
      of its scores (the assumed contamination quantile), never tuned against
      ground truth. `threshold_sweep` traces the champion's precision/recall
      across alert budgets with the 2% point marked — the operating point is
      a staffing dial, not a mystery.

      ```mermaid
      flowchart TD
          A[anomaly score<br/>test-window minute] --> B{score >= threshold?<br/>top 2% quantile, fixed a priori}
          B -->|yes| C[page on-call<br/>flagged minute]
          B -->|no| D[stay silent]
          C --> E[count TP / FP<br/>vs. injected ground truth]
          D --> E
          E --> F[ROC-AUC + PR-AUC<br/>vs. random baseline]
      ```

      On NAB the same discipline is enforced event-first: threshold sweeps
      exist (`nab_alert_budget`), adaptive thresholding re-anchors on drift,
      and series with no evaluable test events are excluded from aggregates —
      never scored as misses.

      **Business implication:** reporting AUC *and* the precision/recall at a
      stated alert budget is what makes these numbers negotiable with a
      client — "at 120 pages per window you catch ~15% of incidents" is a
      staffing conversation, not a vanity metric.
    figures: [pr_curves, threshold_sweep]

  - id: results
    text_md: |
      The headline is real data: NAB, event-based metrics, 9 of 12 series
      evaluable (the other 3 have all labelled windows inside the train
      split; excluded from aggregates, not scored as misses):

      | family | PR-AUC | range-F1 | events (alerts) |
      |---|---|---|---|
      | realTraffic | 0.728 | 0.310 | 5/5, 188 |
      | realKnownCause | 0.438 | 0.074 | 8/9, 1 289 |
      | realAWSCloudwatch | 0.404 | 0.088 | 3/3, 132 |
      | **overall** | **0.527** | **0.157** | **16/17, 1 609** |

      The champion finds most real events (range recall 0.729), but the
      firehose is the finding: 1 609 alerts for 16 windows, range precision
      0.107. `nab_timelines` shows per-series true vs.
      detected windows; `nab_score_distribution` and `nab_alert_budget` show
      the budget curve. The adaptive median/IQR drift trigger, calibrated on
      synthetic, fires on 31 of 120 real chunks (`adaptive_stream`) — too
      twitchy; recalibration is on the roadmap.

      The seeded synthetic stream stays the CI / fast path, and the
      synthetic-to-real drop is why: injected anomalies are trivially
      separable, so the seeded track demonstrates pipeline mechanics, HPO
      behavior, and detector-family failure modes — but cannot expose the
      property clients pay for, precision at real anomaly rarity. Held-out
      window ladder (ROC-AUC / PR-AUC): random 0.509 / 0.019; LOF 0.527 /
      0.019; OCSVM 0.337 / 0.024; tuned LOF 0.505 / 0.025; **tuned OCSVM
      0.906 / 0.136**; IsolationForest 0.916 / 0.124, tuned 0.917 / 0.121 —
      see `roc_curves` and `score_distribution`. Tuning rescued OCSVM:
      `gamma=0.013` replaced the failed `gamma="scale"` default (parameter
      importance 0.99), a ~6× tighter kernel that carves the anomaly blob
      out instead of folding it in. LOF was not rescued: its best
      neighborhood size saturated at the search cap (200) and test ROC-AUC
      fell 0.527 → 0.505 — inside a self-similar anomaly cluster every point
      looks normal to a purely local method. Rolling-median residuals
      de-cluster that blob (0.9158 → 0.9999 ROC-AUC). Exact values in
      `reports/metrics.json`, `reports/nab_metrics.json`, and
      `reports/report.html`.

      **Business implication:** the champion finds most real events, so the
      next dollar goes to alert budgeting and event deduplication — at 1 609
      alerts for 16 windows, more AUC is not the problem to solve.
    figures:
      - nab_timelines
      - nab_score_distribution
      - nab_alert_budget
      - roc_curves
      - score_distribution
      - adaptive_stream
    metrics_keys:
      [random, isolation_forest, lof, ocsvm, isolation_forest_tuned, lof_tuned, ocsvm_tuned]

  - id: conclusions
    text_md: |
      The takeaways:

      - **Detector families make different bets.** Density- and boundary-based
        methods assume anomalies are sparse and dissimilar to everything; when
        incidents arrive as a repeated, self-similar signature, partitioning
        methods (IsolationForest) and residual/context-aware features still
        see them. Choosing a detector without checking that assumption is how
        silent incidents ship to production.
      - **Tuning is verdict-changing — but only sometimes.** One-Class SVM
        went from below-chance (0.337) to PR-AUC champion (0.136) because one
        scale-sensitive knob (`gamma`) was wrong by default; LOF stayed at
        chance because its failure is structural, not hyperparametric. HPO is
        cheap (90 seeded trials, ~80 s), so the right move is to run it
        and report both outcomes.
      - **Point metrics flatter; event metrics tell the truth.** The
        synthetic track's 0.916 PR-AUC collapsed to 0.527 on NAB once scoring
        counted windows instead of minutes — methodology, not more modeling,
        is what surfaced the false-positive firehose.
      - **Guardrails make results trustworthy.** DQ gates that halt the
        pipeline, a time-ordered split, validation inside the train window
        only, a fixed (untuned) threshold, and a seeded random baseline mean
        the reported numbers are ones a client can plan an alert budget
        around.

      Full analysis in `DESIGN.md`; runnable detail in `README.md`.

      **Business implication:** the deliverable is not "a model with 0.92
      AUC" — it is an evaluation harness that tells you *when to distrust the
      model*, what tuning and features changed and why, and what a given
      alert budget buys; that is what de-risks putting anomaly detection on a
      client's critical path.
    metrics_keys: [ocsvm_tuned, isolation_forest_tuned, random]
roadmap:
  - status: delivered
    text: NAB real-data primary track — 12 checksum-pinned series with event-based metrics; headline PR-AUC 0.527 / range-F1 0.157 (16/17 events at 0.107 range precision) versus synthetic 0.916.
  - status: delivered
    text: Adaptive-threshold streaming — drift-aware simulation on synthetic (zero events) and NAB (31/120 chunks trigger recalibration); machinery unit-tested.
  - status: delivered
    text: Rolling-median residual features — residual probe lifts IsolationForest 0.9158 → 0.9999 ROC-AUC (PR-AUC 0.996) by de-clustering the anomaly blob.
  - status: delivered
    text: NSL-KDD real-data track — checksum-pinned fetch of 125,973 network-flow records; champion transfers at 0.8817 ROC-AUC / 0.8916 PR-AUC.
  - status: remaining
    text: Attack the false-positive firehose on NAB — per-series alert budgets, event deduplication, per-family thresholds; range precision 0.107 is the problem to solve.
  - status: remaining
    text: Recalibrate the adaptive drift trigger on real data — the median/IQR z tuned on synthetic fires on 31/120 NAB chunks; needs a higher threshold or a variance-normalised statistic.
  - status: deferred
    text: Production streaming integration — needs a real event source; deferred until a client engagement supplies live-shaped traffic.
  - status: deferred
    text: NSL-KDD hardening — one-hot categoricals, per-attack-category breakdown, and a literature-protocol comparison table; engagement-dependent.
