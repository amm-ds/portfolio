project_id: 03-anomaly-detection
short_version: "On NAB at a fixed 2% alert budget, IsolationForest catches 16 of 17 labelled incident windows but fires 1,609 alerts. Deduplication plus a one-page-per-day cap cuts that to 80 pages at modest recall cost—page the alert stream, not the detector score."
sections:
- id: background
  text_md: |
    **The detector catches 16 of 17 incidents—and raises 1,609 alerts doing it.**
    At a 2% alert budget on nine evaluable NAB series, IsolationForest touches 16
    of 17 labelled windows (range recall 0.729), fires 1,609 pages; pointwise
    PR-AUC 0.527, range-F1 0.157.

    **Data.** Twelve Numenta Anomaly Benchmark series (Ahmad et al. 2017, nine
    evaluable), a seeded 20,000-row synthetic CI stream, an NSL-KDD probe.

    **Limits.** Nine usable NAB series, no multivariate transfer; synthetic anomalies
    trivially separable; the NSL-KDD probe runs at 56.9% prevalence, not real
    rarity.

    **In plain terms:** it finds the incidents, then buries on-call—about 95 pages per
    incident. One page per incident per day cuts the load twenty-fold for modest
    recall cost.
- id: objectives
  text_md: |
    **The benchmark must make false positives as visible as misses.** Four controls:

    - Train on the first 70% of time; score a later window—never the same data.
    - Fix the alert threshold at the assumed 2% contamination budget; do not tune it
      against test labels.
    - Report untuned and tuned detectors against a seeded random baseline.
    - Separate pointwise ranking (ROC-AUC, PR-AUC) from event-aware range
      precision/recall: a window counts as detected when one alert
      lands inside it; mean-over-series range recall is not the raw fraction of
      windows touched.
  metrics_keys: [random, isolation_forest]
- id: data
  text_md: |
    **Real incident windows headline; synthetic data only checks mechanics.** NAB: 12
    checksum-pinned univariate series across AWS CloudWatch, traffic, and known-cause
    failures, labelled by `combined_windows.json`; nine have evaluable test
    events; three have all labelled windows inside the training span and are
    excluded, not misses. Synthetic CI path: 20,000 seeded one-minute
    CPU/memory/latency rows with 2% injected anomalies—bit-reproducible but
    trivially separable, so it cannot show real precision. NSL-KDD probe: a
    checksum-pinned network-flow transfer test on the same contract;
    56.9% prevalence and flow semantics prevent comparison with rare
    telemetry incidents. Labels are used for evaluation only.
- id: eda
  text_md: |
    **The synthetic anomalies form a blob—a pattern that predicts a specific failure.**
    Injected anomalies spike CPU and latency together while memory keeps its seasonal
    path; their mean k-NN distance is ≈20.5 versus ≈9.5 for normal rows. Points inside
    can look normal to a local-density detector while the cluster sits far from normal
    telemetry. That diagnosis describes the injected data, not NAB; the sweep shows
    the residual fix does not transfer.

    **How we judged it.** All detectors get one past-only search (~30 seeded TPE
    trials on the last 20% of training), one fixed top-2% threshold, three scored
    alert streams: raw (every above-threshold minute pages),
    deduped (runs page once at the max-score minute), budgeted (one page
    per series per 24 h). On-call load is measured, not asserted.
  figures: [eda_signals_overview, nab_score_distribution]
- id: training
  text_md: |
    budget, IsolationForest touches 16 of 17 labelled NAB windows, emitting 1,609
    alerts—the observed load. Overlap-weighted range recall is 0.729, precision 0.107,
    range-F1 0.157, pointwise PR-AUC 0.527. The family × feature sweep (three families ×
    two feature sets, untuned, same threshold) finds no winner: pointwise PR-AUC spans
    0.515–0.574 (best: LOF rolling+residual; IsolationForest rolling alone 0.565;
    headline recipe 0.527), raw range recall 0.688–0.750, 1,609–3,586 alerts.

    **Finding 2—budgeting the page stream fixes load without retraining.**
    Episode dedup plus the 24 h per-series cap cuts pages twenty- to thirty-fold
    across all six cells and *raises* range-F1 in each—most raw pages re-alerted the
    same burst minutes. The headline recipe drops
    1,609 → 80 pages; range recall falls 0.729 → 0.562, range-F1 rises
    0.157 → 0.315. The limit: the recall cost (≈0.11–0.25 by cell) is the
    price; the right cap depends on on-call capacity, which the data
    cannot choose.

    **Finding 3—train-side operating-point tuning transfers for one family.**
    Each series' training window splits 80/20; candidate (budget, cooldown) points
    score on the budgeted stream over six validation windows (five series).
    IsolationForest adopts (0.5%, 24 h; validation F1 0.318 vs 0.237) and one test pass
    transfers: pages fall 66 → 33 (rolling), 80 → 46 (rolling_residual), range-F1 up
    in both cells (0.388 → 0.433, 0.315 → 0.382) at ≈0.08–0.10 range recall. LOF's
    validation surface is flat (+0.042 best); the default stands. OCSVM's marginal
    adoption (0.5%, 72 h; +0.056) **fails to transfer** (−0.043/+0.033
    range-F1): six validation windows cannot certify a peak whose grid neighbours
    average 0.168 vs its 0.206. Sub-0.1 gains on six windows are noise-shaped; the
    24 h cap, now validated, holds for LOF and OCSVM.

    **The synthetic ladder tells a different story.** Untuned IsolationForest
    scores 0.9158 ROC-AUC / 0.1239 PR-AUC on the 5,983-row window (prevalence
    1.89%, so PR-AUC nears zero despite strong ROC-AUC); tuned IsolationForest
    leads ROC-AUC 0.9171, tuned OCSVM PR-AUC 0.1355, random 0.5091 / 0.0194,
    LOF near chance (0.5054 / 0.0254). Tuning
    rescues OCSVM by swapping its failing `scale` gamma for 0.013, not LOF's
    local-density blindness. Rolling-median residuals break up the
    blob—IsolationForest jumps to 0.9999 / 0.9960—but the gain does not appear on NAB:
    the diagnosis is synthetic-specific. The NSL-KDD probe reaches 0.8817 / 0.8916,
    but its 56.9% prevalence, labelled split, and unseen attack
    categories make it a probe, not transfer evidence.
  figures: [telemetry_flags, hpo_importance, nab_tune_surface]
- id: evaluation
  text_md: |
    **Deploy the alert-budget layer, not a different detector.** No family is worth
    switching to (PR-AUC 0.515–0.574); the win
    is operational: one page per incident per day costs 0.13–0.25 of range recall,
    buys 16–30× fewer pages; range-F1 rises in every cell and tuning halves pages
    again. The remaining decision: on-call capacity versus the cap's recall cost.

    **Business summary:** page 16 of 17 incidents once daily, not ~95 times
    each: 1,609 alerts (range-F1 0.157) become 80 budgeted pages (0.315); the tuned
    point halves that again (46 pages, 0.382). Until precision improves, this
    supports alert-budget design—not unattended paging.
  figures: [pr_curves, threshold_sweep, adaptive_stream]
- id: results
  text_md: |
    **What this does not show: production readiness.** Range precision stays low (0.107
    at fixed budget, 0.306 on the budgeted stream), so pages still mostly
    fire outside incidents. Adaptive median/IQR thresholds, calibrated on synthetic
    data, fired on 31 of 120 real NAB chunks—too twitchy; the headline stays
    fixed. The NSL-KDD probe does not establish transfer, and the synthetic stream
    cannot show real precision at all. No claim is made for multivariate detectors,
    drifted telemetry, or unattended paging.
  figures: [nab_timelines, nab_timeline_nyc_taxi, nab_alert_budget]
  metrics_keys: [random, isolation_forest, lof, ocsvm, isolation_forest_tuned, lof_tuned, ocsvm_tuned]
- id: conclusions
  text_md: |
    **Detection without a page budget is not a deployable result.** Exact records behind
    every number above:

    | NAB group | pointwise PR-AUC | range-F1 | windows touched (alerts emitted) |
    |---|---|---|---|
    | realTraffic | 0.728 | 0.310 | 5/5 (188) |
    | realKnownCause | 0.438 | 0.074 | 8/9 (1,289) |
    | realAWSCloudwatch | 0.404 | 0.088 | 3/3 (132) |
    | **overall** | **0.527** | **0.157** | **16/17 (1,609)** |

    | sweep cell (raw → budgeted) | alerts | range recall | range-F1 |
    |---|---|---|---|
    | isolation_forest + rolling | 1,864 → 66 | 0.729 → 0.604 | 0.154 → 0.388 |
    | isolation_forest + rolling_residual | 1,609 → 80 | 0.729 → 0.562 | 0.157 → 0.315 |
    | lof + rolling | 3,263 → 109 | 0.750 → 0.542 | 0.086 → 0.213 |
    | lof + rolling_residual | 3,586 → 122 | 0.750 → 0.542 | 0.088 → 0.200 |
    | ocsvm + rolling | 2,412 → 87 | 0.688 → 0.521 | 0.086 → 0.281 |
    | ocsvm + rolling_residual | 2,253 → 91 | 0.688 → 0.438 | 0.102 → 0.214 |

    | cell, budgeted stream | alerts (default → tuned) | range-F1 (default → tuned) |
    |---|---|---|
    | isolation_forest + rolling | 66 → 33 | 0.388 → 0.433 |
    | isolation_forest + rolling_residual | 80 → 46 | 0.315 → 0.382 |
    | lof + rolling | 109 → 109 | 0.213 → 0.213 |
    | lof + rolling_residual | 122 → 122 | 0.200 → 0.200 |
    | ocsvm + rolling | 87 → 35 | 0.281 → 0.237 |
    | ocsvm + rolling_residual | 91 → 35 | 0.214 → 0.247 |

    **Run and wave record.** Wave 15 (nab-tune) added train-side operating-point
    selection per detector family on inner-split validation alone: IsolationForest's
    adopted (0.5%, 24 h) point transfers to test; LOF keeps the default; OCSVM's marginal
    adoption fails to transfer. Three NAB series are excluded because all labelled
    windows fall inside their training spans—not counted as misses. The nyc_taxi series
    touches 3 of 4 windows (range recall 0.750, pointwise PR-AUC 0.462, 179 alerts); the
    six representative timeline panels in `nab_timelines` contain 897 alerts. Pointwise
    metrics on the synthetic window: ROC-AUC measures overall ranking while PR-AUC
    exposes the 1.89% prevalence floor; the threshold sweep shows recall and precision
    both ≈15% at 120 synthetic flags—the operating point, not AUC alone, sets on-call
    load. Range recall is the mean over all 12 series (the three window-less series count
    as zero); the raw detected fraction is reported separately as windows touched.

    **Reproduce.**
    `uv run python -m anomaly_detection.cli all` (synthetic pipeline),
    `uv run python -m anomaly_detection.cli nab` (NAB headline track, 12 series),
    `uv run python -m anomaly_detection.cli nab-sweep` (detector × feature sweep + alert budgets),
    `uv run python -m anomaly_detection.cli nab-tune` (train-side operating-point selection + one test pass).
    Artifacts: `reports/nab_metrics.json`, `reports/nab_sweep.json`, `reports/nab_tune.json`,
    `reports/metrics.json`, `reports/residual_probe.json`, `reports/nsl_probe.json`.
roadmap:
- status: delivered
  text: "NAB event-aware evaluation, synthetic detector/HPO ladder, residual probe, and separate pointwise versus event reporting."
- status: delivered
  text: "Adaptive streaming and NSL-KDD transfer probes, with 31/120 over-triggering and high-prevalence caveats retained."
- status: delivered
  text: "NAB detector-family × feature sweep (PR-AUC 0.515–0.574, no winner) plus episode dedup and a 24 h per-series budget: 1,609→80 pages, range-F1 0.157→0.315."
- status: delivered
  text: "Train-side operating-point tuning (nab-tune): per-family budget/cooldown chosen on inner-split train validation (6 windows, 5 series), one NAB test pass. IsolationForest adopts (0.5%, 24h), transferring (80->46 pages, F1 0.315->0.382); LOF keeps the default; OCSVM's adopted point fails to transfer."
- status: deferred
  text: "No unattended paging or adaptive-threshold rollout until real-data precision and drift calibration improve."
figure_captions:
  eda_signals_overview: "Two days (2,880 minutes) of the seeded synthetic stream. CPU, memory, and latency follow daily seasonality; injected anomalies appear as simultaneous CPU+latency spikes."
  telemetry_flags: "Synthetic test-window flags at the fixed 2% alert budget, compared with ground-truth anomalous minutes. The flags track simultaneous CPU+latency spikes; this is not a NAB result."
  hpo_importance: "One-Class SVM tuning on synthetic train-only validation: gamma carries 99% of importance, moving from the failing `scale` default to 0.0131 (best validation PR-AUC 0.126)."
  pr_curves: "Pointwise precision-recall curves on the synthetic test window, with the 1.9% prevalence floor. Tuned OCSVM leads AP at 0.136; these curves do not measure event-window recall."
  threshold_sweep: "Synthetic precision and recall across alert budgets, with the fixed 2% point marked: 120 flags, about 15% recall and 14% precision, including 17 hits on anomalous minutes. This is point-level load, not 17 incidents."
  adaptive_stream: "Adaptive versus fixed thresholds in streaming simulation. Synthetic-calibrated median/IQR drift detection fires on 31 of 120 real NAB chunks, so it remains too twitchy for the headline operating point."
  nab_timelines: "Six representative NAB test windows: amber bands are labelled events and pink crosses are IsolationForest alerts. These panels contain 897 alerts; nyc_taxi misses one window while the other five series touch theirs."
  nab_timeline_nyc_taxi: "The NAB nyc_taxi test window downsampled to every second minute: 3 of 4 labelled windows touched, range recall 0.750, pointwise PR-AUC 0.462, and 179 alerts emitted. The miss remains visible rather than averaged away."
  nab_score_distribution: "IsolationForest scores across evaluable NAB series, split by in-window versus outside-window minutes. Their overlap explains why no tested threshold cleanly separates incidents from normal traffic."
  nab_alert_budget: "Event-aware range-F1 by NAB benchmark group across alert budgets. Only IsolationForest is evaluated here; the curve exposes the trade-off between event detection and false-alert load, not a cross-detector ranking."
  nab_tune_surface: "Train-side operating-point selection surfaces: validation range-F1 of the budgeted alert stream vs per-series cooldown, one line per threshold budget, per detector family. The ring is the documented (2%, 24 h) default; only IsolationForest's (0.5%, 24 h) adoption clears the 0.05 margin and transfers to test."
