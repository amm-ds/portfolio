project_id: 03-anomaly-detection
short_version: "On NAB at a fixed 2% alert budget, IsolationForest catches 16 of 17 incident windows but fires 1,609 alerts. A one-page-per-day cap cuts that to 80 pages; a rank-average ensemble halves the load again at higher recall — page the alert stream, not the detector score."
sections:
- id: background
  text_md: |
    **The detector catches 16 of 17 incidents, but raises 1,609 alerts.**
    The Numenta Anomaly Benchmark (NAB) is a labelled time-series benchmark.
    It uses twelve cloud, traffic, and known-cause failure series; nine have
    scored incidents. IsolationForest finds unusual points
    by isolating them with random splits. At a fixed 2% alert budget, it
    touches 16 of 17 windows. Pointwise PR-AUC, the area under the
    precision-recall curve, measures minute ranking: 0.527. Event-aware
    range-F1 combines event precision and recall: 0.157.

    ```diagram 03-detection-pipeline
    ```

    Follow the diagram from scores to pages. The threshold uses the top 2%
    of training scores. Deduplication groups each alert burst; the cap allows
    one page per series per 24 hours. This cuts 1,609 raw alerts to 80 pages.

    **Business summary:** The detector finds 16 of 17 NAB incidents but
    fires 1,609 alerts; one page per series per day cuts that to 80 at
    small recall cost.
  figures: []
- id: objectives
  text_md: |
    **The benchmark must show false alarms and misses together.** Anomaly
    detection flags measurements that differ from expected behavior. One
    score on shuffled data can hide alert storms and missed incidents. The
    diagram shows three gates. They set four controls before any detector
    runs.

    ```diagram auto-03-anomaly-detection-1
    ```

    Read the diagram from left to right:

    - **Past-only data:** Train on the first 70% of each series. The
      hyperparameter search and synthetic champion selection use only the
      last 20% of that training span. Freeze the champion by validation
      PR-AUC, then score the later window once.
    - **Frozen operating point:** Set the threshold at the top 2% of training
      scores. This is the assumed contamination budget. It is the expected
      share of anomalies. Never tune it on test labels.
    - **Seeded random floor:** Compare untuned and tuned detectors with a
      random baseline. A fixed seed makes that baseline repeat. This shows
      whether ranking beats chance.
    - **Separate metric families:** ROC-AUC means area under the receiver
      operating characteristic curve. It ranks minutes by true-positive and
      false-positive rates. PR-AUC measures minute-level precision and
      recall. Range precision, recall, and F1 look at whole events. A window
      counts as detected when at least one alert lands inside it.

    The left gate prevents future information from leaking into training.
    The middle gate fixes the operating cost before evaluation. The right
    gate separates minute ranking from incident detection. Together, these
    gates block the shortcut of choosing a threshold because it flatters the
    test labels.

    **Business summary:** Four fixed rules keep the comparison honest:
    past-only training, a frozen threshold, a seeded random floor, and
    pointwise metrics apart from event-aware ones.
  figures: []
  metrics_keys: [random, isolation_forest]
- id: data
  text_md: |
    **Real incident windows carry the evidence. Synthetic data only checks
    mechanics.** The data-lineage diagram assigns a clear job to each
    source:

    ```diagram auto-03-anomaly-detection-2
    ```

    - **NAB is primary.** Its twelve series each contain one measurement
      over time from cloud monitoring, traffic, or known-cause failures.
      Labels come from `combined_windows.json`. Nine series have events in
      the scored span. Three have every label inside the training span, so
      they leave the evaluation rather than count as misses. Scoring them
      would require fitting a model on its own incidents.
    - **The synthetic stream checks mechanics.** It contains 20,000 seeded
      one-minute rows with 2% injected anomalies. Its signals are central
      processing unit (CPU) use, memory use, and latency, meaning response
      delay. The anomalies are easy to separate, so this stream cannot show
      real-world precision.
    - **NSL-KDD is only a contract probe.** This pinned network-security
      dataset contains network-flow records. Its 56.9% prevalence, meaning
      the share of anomalous rows, is far above rare telemetry rates. It
      cannot support a transfer claim.

    Follow the NAB branch in the diagram first. Its split between nine
    evaluable and three excluded series explains the denominator behind the
    incident results. Then follow the synthetic and probe branches. Both end
    at mechanics or contract checks, not headline evidence. Train-side labels
    guide tuning and selection; test labels are reserved for final scoring.
    See the [NAB dataset card](https://amm-ds.github.io/portfolio/data-registry/nab/).

    **Business summary:** NAB's nine evaluable series carry the headline; a
    synthetic stream checks the pipeline; the NSL-KDD probe checks the
    contract; labels never fit the unsupervised detector parameters.
  figures: []
- id: eda
  text_md: |
    **The synthetic anomalies form a tight cluster; real anomalies hide in
    normal traffic.** In `eda_signals_overview`, look at two days, or 2,880
    minutes, of the seeded stream. CPU, memory, and latency follow a daily
    cycle. Each injected anomaly spikes CPU and latency together, while
    memory keeps its usual path. The tight cluster explains a later failure:
    its mean distance to the 20 nearest neighbours (k-NN) is ≈20.5, versus
    ≈9.5 for normal rows. Points inside that cluster can still look locally
    normal. Local Outlier Factor (LOF) is a detector that compares each
    point's local density with its neighbours, so this pattern matters.

    In `nab_score_distribution`, compare the two histograms. One shows
    IsolationForest scores inside labelled windows; the other shows scores
    outside them. Their heavy overlap means no tested threshold cleanly
    separates incidents from normal traffic. The figure supports modest
    pointwise ranking quality, but also warns that ranking alone does not
    show the human cost.

    The two figures motivate three measured alert streams under one
    past-only parameter search and one fixed top-2% threshold:

    - **Raw:** every above-threshold minute pages.
    - **Deduped:** each continuous burst pages once at its peak score.
    - **Budgeted:** deduplication plus at most one page per series per 24 h.

    Comparing these streams turns score quality into measured on-call load.

    **Business summary:** Injected anomalies form one blob that fools
    local detectors; real NAB scores overlap too much for a clean
    threshold; all results below use three alert streams.
  figures: [eda_signals_overview, nab_score_distribution]
- id: training
  text_md: |
    **Finding 1: the ensemble wins the sweep; no single family does.** The
    sweep compares four detector families with two feature sets, all untuned
    at one threshold. Rolling features summarize recent behavior; residual
    features measure departures from a rolling median. The **rank-average
    ensemble** averages each minute's normalized rank, or relative position
    on a shared 0-to-1 scale, under IsolationForest, LOF, and One-Class
    Support Vector Machine (OCSVM). OCSVM learns a boundary around normal
    data. Use the four panels in `nab_tune_surface` to compare these families
    at the ringed default. The measured sweep gives pointwise PR-AUC of
    0.515–0.577 across the grid, while single families span 0.515–0.574.
    Raw range recall spans 0.688–0.750, with 1,003–3,586 alerts. Combining
    partition, local-density, and boundary detectors helps where their
    failure modes differ. Separately, `telemetry_flags` shows synthetic flags
    tracking the CPU+latency spikes in ground truth; it is not NAB evidence.

    **Fusion core: normalize ranks, not incompatible raw scores.** This puts
    every detector on the same scale before averaging.

    ```python
    def _ranks(scores: np.ndarray) -> np.ndarray:
        order = np.argsort(scores, kind="stable")
        out = np.empty(len(scores), dtype=float)
        out[order] = np.arange(len(scores), dtype=float)
        return out / max(len(scores) - 1, 1)

    members = [fit_detector(d, x_fit, config) for d in BASE_DETECTORS]

    def score_ensemble(x: np.ndarray) -> np.ndarray:
        return np.mean([_ranks(member(x)) for member in members], axis=0)
    ```

    Excerpt from [nab_sweep.py](https://github.com/amm-ds/portfolio/blob/main/projects/03-anomaly-detection/src/anomaly_detection/nab_sweep.py).

    **Finding 2: budgeting pages cuts load without retraining.** At the
    ringed (2%, 24 h) setting in `nab_tune_surface`, deduplication plus the
    cap cuts pages twenty- to thirty-three-fold across all eight cells and
    raises range-F1 in each. The headline cell drops 1,609 → 80 pages;
    recall falls 0.729 → 0.562 and range-F1 rises 0.157 → 0.315. On
    like-for-like rolling cells, the ensemble gives 35 pages at range-F1
    0.533 versus IsolationForest's 66 at 0.388. Recall is 0.604 for both.

    **Finding 3: the winner needs no tuning.** In `nab_tune_surface`, each
    line is a threshold budget, each horizontal position is a cooldown, and
    the ring marks the (2%, 24 h) default. An inner 80/20 training split
    supplies six validation windows across five series. IsolationForest
    adopts (0.5%, 24 h), with validation range-F1 0.318 versus 0.237, and
    transfers: pages fall 66 → 33 and 80 → 46, with range-F1 reaching 0.433
    and 0.382. The ensemble surface is nearly flat, with best gain +0.010 at
    (1%, 12 h), so its default stays. One held-out test evaluation confirms
    35 pages at range-F1 0.533. LOF's best gain is +0.042, so its default
    also stays. OCSVM's marginal adoption at (0.5%, 72 h; +0.056) fails on
    test, changing range-F1 by −0.043/+0.033. Six windows cannot certify a
    peak whose neighbours average 0.168 against its 0.206; sub-0.1 gains are
    noise. In `hpo_importance`, look for gamma, OCSVM's boundary-width
    setting, carrying 99% of the search importance.

    **Synthetic results do not transfer.** `telemetry_flags` and
    `hpo_importance` are mechanics checks. On 2,791 validation rows (2.15%
    anomalies), tuned OCSVM wins selection PR-AUC 0.1514 versus tuned
    IsolationForest 0.1330, freezing the champion before test scoring. On
    5,983 test rows (1.89% anomalies), untuned IsolationForest scores 0.9158
    ROC-AUC / 0.1239 PR-AUC. Tuned IsolationForest reaches 0.9171 ROC-AUC,
    tuned OCSVM reaches 0.1355 PR-AUC, and random scores 0.5091 / 0.0194.
    Rolling-median residuals lift IsolationForest to 0.9999 / 0.9960, but not
    on NAB. NSL-KDD remains 0.8877 / 0.8979 at 56.9% prevalence.

    **Business summary:** Switching single detectors is not worth it;
    combining them is. At the frozen default, the rank-average ensemble
    halves like-for-like paged load to 35 pages at range-F1 0.533. The
    budget layer remains the recommended artifact.
  figures: [telemetry_flags, hpo_importance, nab_tune_surface]
- id: evaluation
  text_md: |
    **Budget the alert stream and combine the detectors.** The three figures
    separate minute ranking, incident ranking, and response to changing
    behavior. None is a page policy by itself.

    In `pr_curves`, compare each synthetic curve with the 1.89% prevalence
    floor, which is the random level set by the anomaly share. Average
    precision (AP) summarizes precision across recall levels. Tuned OCSVM,
    already selected on validation, leads test AP at 0.136. This value did not
    select it; the small lift above the floor also warns against treating
    minute ranking as incident detection.

    In `range_pr`, precision and recall describe matched incident windows,
    not individual minutes. The threshold sweep uses score quantiles,
    meaning cutoffs at selected score percentiles. Look at the champion's
    range-PR area of **0.804** against the 16-seed random band of **0.228
    [0.081, 0.401]**. This gap supports real event ranking rather than
    prevalence restated. At fixed alert budgets, precision is **0.680** at
    0.5% of the stream, **0.632** at 1%, **0.527** at 2%, and **0.234** at
    5%. Recall at 2% is 0.944 across evaluable windows, while no-skill
    precision is 0.082 [0.063, 0.105]. The champion is about six times as
    precise as chance there and touches nearly every window.

    The `range_pr` operating points also frame the measured paging trade.
    One page per incident per day costs 0.13–0.25 of range recall and gives
    twenty- to thirty-fold fewer pages. Range-F1 rises in every sweep cell.
    The ensemble then cuts like-for-like load from 66 → 35 pages and raises
    range-F1 from 0.388 → 0.533, with recall unchanged at 0.604. Its flat
    validation surface supports keeping the default. Tuning also halves
    IsolationForest's pages where it transfers. The remaining choice is
    on-call capacity versus recall cost.

    In `adaptive_stream`, compare fixed and adaptive alert, true-positive, and
    false-positive counts, then read the per-chunk drift statistic against its
    trigger line. Drift means a change in normal behavior over time. The adaptive
    rule uses the median and interquartile range (IQR), the spread of the middle
    half of scores. No drift trigger fires on the five synthetic chunks shown;
    fixed precision/recall are 0.150/0.159 versus 0.150/0.150 adaptive. Separately,
    synthetic-calibrated triggers fire on 31 of 120 real NAB chunks. The figure
    therefore supports rejecting adaptive thresholds for now, not claiming drift
    readiness.

    **The detector alternatives fail a measured adoption gate.** Conformal
    p-values estimate how unusual a point is relative to reference scores.
    Calibration by hour-of-week context, IsolationForest+LOF rank fusion,
    and context-normalized fusion must each improve precision at the budget
    and range-F1 while holding coverage at 16 of 17. None succeeds on
    identical windows. Forty-minute contexts make the conformal grid bottom
    out near p = 0.049; the pooled 2% quantile lands there and fires 2,546
    alerts at the 2% face budget, with precision and range-F1 both down.
    Fusion reaches precision 0.650 and range-F1 0.403 while halving raw
    alerts, but loses two of seventeen windows, including one on a
    known-cause failure series. These measured trade-offs keep the original
    detector in place; the exact comparison appears in Conclusions.

    **Business summary:** Budget the pages, then combine the detectors:
    35 pages instead of 1,609, each incident paged about once a day,
    at 0.13–0.25 recall cost.
  figures: [pr_curves, range_pr, adaptive_stream]
- id: results
  text_md: |
    **Read the evidence panel by panel.** In `nab_timelines`, amber bands
    mark labelled incidents and pink crosses mark IsolationForest alerts.
    The six representative NAB panels contain 897 alerts. Find each amber
    band, then compare crosses inside it with those outside. Inside crosses
    support incident detection; outside crosses show the on-call burden.

    The `nyc_taxi` panel keeps the hardest series visible inside that matrix:
    3 of 4 windows are touched, range recall is 0.750, pointwise PR-AUC is
    0.462, and 179 alerts are emitted. Its missed window remains visible rather
    than being duplicated in a second timeline or hidden in an average.

    In `nab_alert_budget`, follow range-F1 as the alert budget changes for
    each NAB group. The curve prices incident detection against false-alert
    load. It contains only IsolationForest, so use it as a budget dial, not
    a detector ranking.

    **The best ensemble is not drawn in those single-family panels.** Its
    measured budgeted range precision on the rolling cell is 0.553, versus
    IsolationForest's 0.347. Pages still miss incidents about half the time,
    but that miss rate roughly halves while pages fall 66 → 35 at equal
    recall. The alert-budget figure supplies the single-family baseline;
    the exact sweep table in Conclusions supplies the ensemble comparison.

    **The panels do not show production readiness.** The many crosses
    outside amber bands match the low range precision: 0.107 at fixed
    budget and 0.306 after budgeting. Adaptive thresholds separately fired
    on 31 of 120 real NAB chunks, so they remain too twitchy. The NSL-KDD
    probe does not establish transfer, and the synthetic stream cannot show
    real precision. No result covers multivariate detectors, meaning models
    that use several signals at once, drifted telemetry, or unattended
    paging. Context calibration also fired 2,546 alerts at a 2% face value.
    Rank fusion halved raw alerts and lifted range-F1 to 0.403, but dropped
    coverage to 14 of 17. These failures reinforce the visual warning:
    better alert counts alone do not establish reliable incident coverage.

    **Business summary:** Panels show false alarms crowding real
    incidents; the budget curve prices recall versus load. Use it to set
    an alert budget, not to auto-page.
  figures: [nab_timelines, nab_alert_budget]
  metrics_keys: [random, isolation_forest, lof, ocsvm, isolation_forest_tuned, lof_tuned, ocsvm_tuned]
- id: conclusions
  text_md: |
    ## Results summary

    The exact tables below support the final recommendation. At a fixed 2%
    alert budget on nine of NAB's 12 series, IsolationForest with rolling
    and residual features touches 16 of 17 labelled windows and fires 1,609
    alerts. Pointwise PR-AUC is 0.527 and range-F1 is 0.157. Episode
    deduplication plus a one-page-per-series-per-day cap cuts load to 80
    pages at range-F1 0.315, while range recall falls 0.729 → 0.562.
    Train-side tuning reduces this to 46 pages at range-F1 0.382.

    The sweep table shows the rank-average ensemble beating every
    single-family point at the frozen default: 35 pages at range-F1 0.533
    and recall 0.604. Its flat validation surface does not justify tuning.
    Treat sub-0.1 range-F1 differences across six validation windows as
    noise. The ablation table also shows that context-calibrated thresholds,
    IsolationForest+LOF rank fusion, and normalized fusion all fail at least
    one adoption condition. The original detector therefore remains the
    baseline. See the [full evaluation report](https://amm-ds.github.io/portfolio/projects/03-anomaly-detection/).

    ## What the experiment taught

    - **Combine families rather than switch between them.** The sweep table
      shows the ensemble at 35 pages and range-F1 0.533, versus 80 pages and
      0.315 for headline IsolationForest. Recall is higher at 0.604 versus
      0.562.
    - **Budget the page stream.** The raw-to-budgeted columns show the 24 h
      cap cutting pages twenty- to thirty-fold in every sweep cell and
      raising range-F1 each time.
    - **Trust transfer, not a validation peak.** The tuned results show
      IsolationForest moving from 80 → 46 pages, while OCSVM does not
      transfer. Six validation windows cannot certify a peak. The ensemble's
      flat surface, with +0.010 at best, supports its default.
    - **Keep synthetic evidence in its lane.** The synthetic measurements
      below show residual-feature gains that never transfer to NAB. They
      support pipeline mechanics only.
    - **Check incident coverage when refining detectors.** The ablation table
      shows conformal context calibration spending about 2.4 times the face
      alert budget before scoring. Its p-value grid on forty-minute contexts
      bottoms out near 0.049. IsolationForest+LOF fusion reaches range-F1
      0.403 only by dropping to 14 of 17 windows. The page layer remains the
      cheapest measured load cut.
    - **Keep precision in the decision.** Range precision is 0.107 at fixed
      budget, 0.306 for headline IsolationForest, and 0.553 for the champion
      ensemble on the rolling cell. The result is an alert-budget dial, not
      proof of unattended paging.

    ## Exact numbers

    NAB headline (fixed 2% budget, IsolationForest with rolling+residual features,
    scored once per series):

    | NAB group | pointwise PR-AUC | range-F1 | windows touched (alerts emitted) |
    |---|---|---|---|
    | realTraffic | 0.728 | 0.310 | 5/5 (188) |
    | realKnownCause | 0.438 | 0.074 | 8/9 (1,289) |
    | realAWSCloudwatch | 0.404 | 0.088 | 3/3 (132) |
    | **overall** | **0.527** | **0.157** | **16/17 (1,609)** |

    Range-PR sweep + no-skill controls (threshold sweep over score quantiles,
    window matching throughout; artifact `reports/nab_metrics.json → no_skill`):

    | measure | champion | no-skill band (16 seeds) |
    |---|---|---|
    | range-PR area | **0.804** | 0.228 [0.081, 0.401] |
    | precision at 0.5% of stream | 0.680 | — |
    | precision at 1% of stream | 0.632 | — |
    | precision at 2% of stream (recall 0.944) | 0.527 | 0.082 [0.063, 0.105] |
    | precision at 5% of stream | 0.234 | — |
    | no-skill recall at 2% | — | 0.885 [0.806, 0.962] |

    Sweep cells, raw → budgeted stream (alerts | range recall | range-F1):

    | sweep cell | alerts | range recall | range-F1 |
    |---|---|---|---|
    | isolation_forest + rolling | 1,864 → 66 | 0.729 → 0.604 | 0.154 → 0.388 |
    | isolation_forest + rolling_residual | 1,609 → 80 | 0.729 → 0.562 | 0.157 → 0.315 |
    | ensemble + rolling | 1,157 → 35 | 0.729 → 0.604 | 0.485 → 0.533 |
    | ensemble + rolling_residual | 1,003 → 45 | 0.729 → 0.562 | 0.316 → 0.365 |
    | lof + rolling_residual | 3,586 → 122 | 0.750 → 0.542 | 0.088 → 0.200 |

    Budgeted stream, default → tuned: isolation_forest + rolling 66 → 33 pages,
    range-F1 0.388 → 0.433; isolation_forest + rolling_residual 80 → 46, range-F1
    0.315 → 0.382; the ensemble, lof, and ocsvm cells keep their defaults
    (ensemble: 35 and 45 pages at range-F1 0.533 and 0.365).

    Detector-layer ablation, identical windows (raw stream at the 2% budget;
    pages = deduped + 24 h cap; artifact `reports/nab_refinement.json`).
    Here `precision@budget` means precision at the fixed alert allowance:

    | candidate | alerts (raw → pages) | precision@budget | range-F1 | windows touched | PR-AUC |
    |---|---|---|---|---|---|
    | isolation_forest (baseline) | 1,609 → 80 | 0.512 | 0.157 | 16/17 | 0.527 |
    | if_calibrated | 2,546 → 103 | 0.490 | 0.148 | 16/17 | 0.522 |
    | fusion_if_lof | 786 → 41 | 0.650 | 0.403 | 14/17 | 0.587 |
    | fusion_if_lof_norm | 887 → 52 | 0.637 | 0.391 | 15/17 | 0.573 |

    Synthetic window (5,983 test rows, 1.89% prevalence): untuned IsolationForest
    0.9158 ROC-AUC / 0.1239 PR-AUC; tuned IsolationForest 0.9171 ROC-AUC; tuned
    OCSVM 0.1355 PR-AUC; random 0.5091 / 0.0194; rolling-median residual features
    lift IsolationForest to 0.9999 / 0.9960 without NAB transfer. NSL-KDD probe:
    0.8877 / 0.8979 at 56.9% test prevalence. In `threshold_sweep`, the marked
    2% point adds the point-level view: 115 flags, about 15% precision and
    recall (14.8%), and 17 hits on anomalous minutes, not 17 incidents.

    ## Protocol

    - **Splits:** Train on the first 70% of each series and score the later
      span once. The hyperparameter and champion-selection slice is the last
      20% of training. Select the synthetic champion by validation PR-AUC and
      freeze it before test scoring. Roughly 30 seeded Tree-structured Parzen
      Estimator (TPE) trials guide the past-only search by learning from
      earlier trials.
    - **Threshold:** Fix the train-anchored top-2% quantile of each series'
      scores before scoring. This is the assumed contamination budget, with
      no label tuning.
    - **Event rule:** A labelled window counts as detected when at least one
      alert lands inside it. Range precision is measured over alerts outside
      windows. Range recall is the mean over all 12 series, with the three
      window-less series counting as zero. The raw detected fraction is
      reported separately as windows touched.
    - **Streams:** Raw pages every above-threshold minute. Deduped pages each
      contiguous run once at its maximum-score minute. Budgeted adds at most
      one page per series per 24 h.
    - **Tune stage:** Use an inner 80/20 split of each series' training
      window. The budget grid is 0.5–8% and the cooldown grid is 6–72 h. The
      objective is mean budgeted range-F1 over all 12 series × both feature
      sets, or 24 runs per point. Adoption needs +0.05 over the documented
      (2%, 24 h) default, six validation windows across five series, and
      exactly one test evaluation per family, across four families.
    - **Refinement stage (`nab-refine`):** Score candidates on identical
      windows against the baseline stored in the artifact. Adoption requires
      precision at the budget and range-F1 to improve while windows touched
      holds at 16/17. Calibration references are non-anomalous training
      scores for each hour-of-week context. Thin contexts fall back to the
      series-global set, then to the original raw cutoff.

    ## Limits

    - Range precision remains the limiting factor: 0.107 at fixed budget,
      0.306 budgeted for headline IsolationForest, and 0.553 for the champion
      ensemble on the rolling cell. Even the champion fires roughly half its
      pages outside incidents. This supports alert-budget design, not
      unattended paging or adaptive-threshold rollout, until real-data
      precision and drift calibration improve.
    - Synthetic anomalies are easy to separate. The residual fix's large
      synthetic gain does not transfer to NAB, and the synthetic stream
      cannot show real precision.
    - NSL-KDD is a probe, not transfer evidence. Its 56.9% prevalence,
      labelled split, unseen attack categories, and network-flow semantics
      differ from the NAB setting.
    - No result supports multivariate detectors or drifted telemetry.
    - The refinement ablation deliberately tests one configuration: one
      fusion pair, one context granularity, and one budget. A production
      study could revisit coarser contexts or train-side selection under the
      same adoption gate. That remains unproven here.

    The final diagram connects these limits to the decision path: use the
    protocol to protect the measurement, the exact tables to choose the
    operating point, and the precision limits to rule out unattended paging.

    ```diagram auto-03-anomaly-detection-3
    ```

    **Business summary:** Use the rank-average ensemble of the three families
    at the documented default (2%, 24 h): 35 pages at range-F1 0.533 and
    recall 0.604, with no tuning required. Every reported result is
    reproducible.
  figures: [threshold_sweep]
