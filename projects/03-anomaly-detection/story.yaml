project_id: 03-anomaly-detection
short_version: 'NAB (9 series): IsolationForest touches 16/17 incidents with 1,609 raw alerts. One fit per series; no-skill
  = 16 seeded baselines. Budgeting cuts to 80 pages; like-for-like, the ensemble halves 66 budgeted pages to 35 at recall
  0.604, range-F1 0.533. NAB score not reported.'
sections:
- id: background
  text_md: |
    **How do you page on alerts without drowning on-call in false alarms?**
    On nine `NAB` series, `IsolationForest` hits `16/17` events yet fires `1,609` raw alerts. Minute `PR-AUC` (`0.527`) hides alert storms that whole-event `range-F1` (`0.157`) exposes.

    ```diagram 03-detection-pipeline
    ```

    Follow the flow in three steps:

    - **Score:** Fit `IsolationForest`, `LOF`, and `OCSVM` per series. Average their ranks on rolling features.
    - **Cap pages:** Merge each burst into one alert and cap volume at `1` page per series per `24 h`. For `IsolationForest` with rolling+residual features, that takes `1,609` raw alerts to `80` pages.
    - **Outcome:** On rolling features, the ensemble cuts load from `66` to `35` pages. It holds `0.604` recall, `0.533` `range-F1`, and `0.553` range precision.

    The hero shows the `IsolationForest` alert problem. The recommended path averages `IsolationForest`, `LOF`, and `OCSVM` ranks before the same page budget.

    Next, four rules keep the test fair ([Objectives →](#sec-objectives)).

    **In plain terms:** Combining three detectors cuts on-call pages nearly in half (from 66 to 35) while catching the same share of real incidents, though almost half of alerts are still false alarms.
  figures: []
- id: objectives
  text_md: |
    **The benchmark must show false alarms and misses together.** Anomaly
    detection flags measurements that differ from expected behavior. One
    score on shuffled data can hide alert storms and missed incidents. The
    diagram shows three gates. They set four controls before any detector
    runs.

    ```diagram auto-03-anomaly-detection-1
    ```

    Read the diagram from left to right:

    - **Past-only data:** Train on the first `70%` of each series. The hyperparameter search and synthetic champion selection use only the last `20%` of that training span. Freeze the champion by validation `PR-AUC`, then score the later window once.
    - **Frozen operating point:** Set the threshold at the top `2%` of training scores. This is the assumed `contamination` budget, or expected share of anomalies. Never tune it on test labels.
    - **Seeded random floor:** Compare untuned and tuned detectors with a `random` baseline. A fixed seed makes that baseline repeat and proves whether ranking beats chance.
    - **Separate metric families:** `ROC-AUC` and `PR-AUC` rank individual minutes, while `range precision`, `range recall`, and `range-F1` score whole incident windows (a window counts as caught when at least `1` alert lands inside it).

    The left gate prevents future information from leaking into training.
    The middle gate fixes the operating cost before evaluation. The right
    gate separates minute ranking from incident detection. Together, these
    gates block the shortcut of choosing a threshold because it flatters the
    test labels.

    Those four controls decide which data sources can carry headline
    evidence. Next, the lineage diagram assigns each source its job
    ([Data →](#sec-data)).

    **In plain terms:** Four fixed rules keep the test fair: train only on past data, lock the alert rate before testing, compare against random guessing, and judge whole incidents rather than isolated minutes.
  figures: []
  metrics_keys: [random, isolation_forest]
- id: data
  text_md: |
    **Real incident windows carry the evidence. Synthetic data only checks mechanics.** Each source has one job:

    ```diagram auto-03-anomaly-detection-2
    ```

    - **`NAB` is primary.** Its `12` series track cloud monitoring, traffic, or known failures. Labels come from `combined_windows.json`. Nine series have events in the scored span. The other three have labels only in training. Each contributes zero to the twelve-series range-recall mean; none disappears from the denominator.
    - **The synthetic stream checks mechanics.** It has `20,000` seeded one-minute rows. Injected anomalies make up `2%` across `cpu`, `mem`, and `latency_ms`. They are easy to separate, so this stream cannot prove real-world precision.
    - **`NSL-KDD` is only a contract probe.** This pinned network-flow dataset has `56.9%` anomalies. That is far above rare telemetry rates, so it cannot support a transfer claim.

    Train-side labels guide tuning and selection; test labels are reserved for final scoring. See the [NAB dataset card](https://amm-ds.github.io/portfolio/data-registry/nab/).

    Next, we use the synthetic and real-score figures to motivate three measured alert streams ([EDA →](#sec-eda)).

    **In plain terms:** Nine real monitoring streams carry the main incident results. Three train-only streams still count as zero in the twelve-stream recall average; synthetic and network data only test pipeline mechanics.
  figures: []
- id: eda
  text_md: |
    **Synthetic anomalies are easy to separate. Real anomalies overlap normal traffic.** In `eda_signals_overview`, each channel has its own scale. The channels are `cpu`, `mem`, and `latency_ms`. Two days contain `2,880` minutes. Each injected anomaly spikes `cpu` and `latency_ms` together. Memory keeps its usual path. The mean distance to the `20` nearest neighbours is `≈20.5` for anomalies. Normal rows average `≈9.5`. This gap indicates sparseness, not a tight cluster. The later `LOF` failure has a different cause. Even spacing inside each blob makes local density look normal.

    In `nab_score_distribution`, `IsolationForest` scores overlap heavily inside and outside labelled windows. No tested threshold cleanly separates incidents from normal traffic.

    The figures motivate three measured alert streams under one past-only search and one fixed top-`2%` score threshold:

    - **Raw:** every above-threshold minute pages.
    - **Deduped:** each continuous burst pages once at its peak score.
    - **Budgeted:** deduplication plus at most `1` page per series per `24 h`.

    Next, we test rank blending and page caps across the full sweep ([Training →](#sec-training)).

    **In plain terms:** Synthetic spikes are easy to spot, but real incident scores overlap normal traffic. We therefore test three ways to group and cap alerts rather than trusting a score threshold alone.
  figures: [eda_signals_overview, nab_score_distribution]
- id: training
  text_md: |
    **Blending ranks and capping pages beats tuning any single model.**
    Raw scores from different models sit on different scales. Averaging raw numbers lets one loud model win. Below we test four model types on two feature sets (`rolling` and `rolling+residual`) at a fixed `2%` threshold, then add the page budget.

    Each part of the `NAB` sweep tests one lever:

    - **Rank blending wins on budgeted event scoring, not minute ranking:** We average `[0, 1]` ranks across `IsolationForest`, `LOF`, and `OCSVM`. Minute `PR-AUC` is `0.566–0.577` for the ensemble and `0.515–0.574` for single models, a negligible edge. The useful gain appears after budgeting: on rolling features, the ensemble drops from `66` to `35` pages and raises `range-F1` from `0.388` to `0.533` at equal `0.604` recall.
    - **Page caps cut load with no refit:** At the ringed `(2%, 24 h)` mark in `nab_tune_surface`, merging bursts and capping at `1` page per day cuts load `20–33×` and raises `range-F1` in every cell. For `IsolationForest` with rolling+residual features, that means `1,609` to `80` pages and `range-F1` `0.157` to `0.315`.
    - **Tuning trades recall for fewer pages:** On the `80/20` inner split (`6` windows across `5` series), the ensemble's best change is `+0.010`, below the `+0.05` adoption margin, so its `(2%, 24 h)` default stays. Tuned `IsolationForest` at `(0.5%, 24 h)` cuts rolling pages `66` to `33` but lowers recall `0.604` to `0.500`; rolling+residual falls `80` to `46` pages while recall drops `0.562` to `0.479`. Tuned `OCSVM` at `(0.5%, 72 h)` cuts rolling/rolling+residual pages from `87/91` to `35/35`, but recall falls by `0.229/0.125`; test `range-F1` changes by `−0.043/+0.033`.
    - **Synthetic runs check mechanics only:** Tuned `OCSVM` is the synthetic champion, with selection `PR-AUC` `0.1514` versus tuned `IsolationForest` `0.1330`. Its test `PR-AUC` is `0.1355` versus tuned `IsolationForest` `0.1208` and random `0.0194`. The separate `OCSVM` HPO objective is `0.126`; it is not the selection metric. `NSL-KDD` remains a `56.9%`-prevalence contract check (`0.8877` `ROC-AUC` / `0.8979` `PR-AUC`).

    ```python
    def _ranks(scores: np.ndarray) -> np.ndarray:
        order = np.argsort(scores, kind="stable")
        out = np.empty(len(scores), dtype=float)
        out[order] = np.arange(len(scores), dtype=float)
        return out / max(len(scores) - 1, 1)

    members = [fit_detector(d, x_fit, config) for d in BASE_DETECTORS]

    def score_ensemble(x: np.ndarray) -> np.ndarray:
        return np.mean([_ranks(member(x)) for member in members], axis=0)
    ```

    Excerpt from [nab_sweep.py](https://github.com/amm-ds/portfolio/blob/main/projects/03-anomaly-detection/src/anomaly_detection/nab_sweep.py). Below, `telemetry_flags`, `hpo_importance`, and `nab_tune_surface` show the channel flags, HPO weight, and cooldown sweep. The next section splits minute rank from event rank ([Evaluation →](#sec-evaluation)).

    **In plain terms:** Blending three detectors and capping alerts cuts pages from 66 to 35 without extra tuning. Tuning one detector can cut pages further, but it catches fewer incidents.
  figures: [telemetry_flags, hpo_importance, nab_tune_surface]
- id: evaluation
  text_md: |
    **Minute ranking, incident detection, and drift response answer different questions.** None of the three figures is a page policy by itself.

    In `pr_curves`, the `1.89%` synthetic prevalence sets the random floor. Tuned `OCSVM`, already frozen on validation, leads test average precision at `0.136`. That small lift does not establish incident detection.

    In `range_pr`, `IsolationForest` has range-PR area `0.804` against the `16`-seed random band `0.228` [`0.081`, `0.401`]. At fixed alert budgets, its precision is `0.680` at `0.5%`, `0.632` at `1%`, `0.527` at `2%`, and `0.234` at `5%`. Recall at `2%` is `0.944` across evaluable windows, while no-skill precision is `0.082` [`0.063`, `0.105`]. This is the `IsolationForest` threshold sweep, not the rank ensemble.

    Deduplication plus one page per series per day costs `0.13`–`0.25` of range recall and yields `20–33×` fewer pages. Range-F1 rises in every sweep cell. On the same rolling features, the ensemble cuts load from `66` to `35` pages and raises `range-F1` from `0.388` to `0.533` at unchanged `0.604` recall. Separately tuned `IsolationForest` cuts rolling pages to `33`, but recall falls to `0.500`.

    In `adaptive_stream`, tuned `IsolationForest` fires no drift trigger on the five synthetic chunks; fixed precision/recall are `0.150/0.159` versus `0.150/0.150` adaptive. Separately, synthetic-calibrated triggers fire on `31` of `120` real `NAB` chunks. This supports rejecting adaptive thresholds for now, not claiming drift readiness.

    **Detector alternatives fail different adoption conditions.** Context calibration emits `2,546` raw alerts at the nominal `2%` budget and fails precision and `range-F1`. `IsolationForest`+`LOF` fusion reaches precision `0.650` and `range-F1` `0.403`, but covers only `14/17` windows and therefore fails coverage. The original detector remains the baseline.

    Next, we inspect alert timelines and keep the ensemble comparison on identical cells ([Results →](#sec-results)).

    **In plain terms:** Capping alerts cuts volume by 20–33 times but loses 0.13–0.25 of incident recall. On the same rolling setup, blending three detectors cuts pages from 66 to 35 without losing recall.
  figures: [pr_curves, range_pr, adaptive_stream]
- id: results
  text_md: |
    **False alarms still crowd real incidents.** In `nab_timelines`, amber bands mark labelled incidents and pink crosses mark `IsolationForest` alerts. The six representative `NAB` panels contain `897` alerts. Crosses inside bands support detection; those outside show the on-call burden.

    The `nyc_taxi` panel is the only displayed series with a missed window: `3/4` windows are touched, range recall is `0.750`, pointwise `PR-AUC` is `0.462`, and `179` alerts are emitted. The panel supports that visible-miss observation, not a ranking of series difficulty.

    `nab_alert_budget` contains only `IsolationForest`, grouped by `NAB` family. It is an alert-budget dial, not a detector ranking.

    **Those single-family panels do not draw the recommended rank ensemble.** On the same rolling budgeted cell, its range precision is `0.553` versus `IsolationForest` `0.347`. Thus the share of pages outside incidents falls from `65.3%` to `44.7%`, a relative reduction of about `32%`, while pages fall `66` to `35` at equal `0.604` recall. This is fewer false alarms, not a halving of missed incidents.

    Production readiness remains unresolved: adaptive thresholds are too twitchy, `NSL-KDD` does not establish transfer, and synthetic data cannot show real precision. Context calibration and fusion also fail their respective precision and coverage gates.

    Next, we give the exact tables and the decision path that these panels cannot show ([Conclusions →](#sec-conclusions)).

    **In plain terms:** The ensemble cuts false-alarm pages from about 65% to 45% of all pages and halves page volume at equal recall. Human review is still required.
  figures: [nab_timelines, nab_alert_budget]
  metrics_keys: [random, isolation_forest, lof, ocsvm, isolation_forest_tuned, lof_tuned, ocsvm_tuned]
- id: conclusions
  text_md: |
    ## What the experiment taught

    The exact tables below support the final recommendation. At a fixed `2%` alert budget on `9` of `NAB`'s `12` series, `IsolationForest` with `rolling+residual` features touches `16/17` labelled windows and fires `1,609` alerts (`PR-AUC 0.527`, `range-F1 0.157`). Episode deduplication plus a `1`-page-per-series-per-`24 h` cap cuts load to `80` pages (`range-F1 0.315`, range recall `0.729 -> 0.562`). Tuned `IsolationForest` reduces this to `46` pages (`range-F1 0.382`).

    The sweep table shows the rank-average `ensemble` beating every single-family point at the frozen default: `35` pages at `range-F1 0.533` and recall `0.604`. Across `6` validation windows on `5` series, its best gain of `+0.010` stays below the `+0.05` adoption margin, so the default remains. The ablation table also shows that `if_calibrated`, `fusion_if_lof`, and `fusion_if_lof_norm` all fail at least one adoption condition, so the original detector remains the baseline. See the [full evaluation report](https://amm-ds.github.io/portfolio/projects/03-anomaly-detection/).

    - **Combine families on identical cells.** The rolling ensemble records `35` pages and `range-F1` `0.533`, versus `66` pages and `0.388` for rolling `IsolationForest`; both hold recall at `0.604`.
    - **Budget the page stream.** The `24 h` cap cuts pages `20–33×` and raises `range-F1` in every sweep cell, while reducing range recall by `0.13`–`0.25`.
    - **Report the tuning trade-off.** Tuned `IsolationForest` moves from `66` to `33` rolling pages while recall falls `0.604` to `0.500`; rolling+residual moves `80` to `46` while recall falls `0.562` to `0.479`. The ensemble's `+0.010` validation change does not justify a new default.
    - **Keep synthetic evidence in its lane.** Residual-feature gains do not transfer to `NAB`; they support pipeline mechanics only.
    - **Name the failed gate.** Calibration fails precision and `range-F1`. Both fusions pass precision but fail the `16/17` coverage requirement, at `14/17` and `15/17`.
    - **Keep precision in the decision.** The `0.527` threshold-sweep precision has a series bootstrap `95%` `CI` of `[0.230, 0.811]` (`2,000` resamples, seed `42`). That interval lies wholly above the no-skill band `[0.063, 0.105]`, but remains wide across nine series. It supports an alert-budget dial, not unattended paging. The official `NAB` score is not reported: it requires the official scorer and an application profile. These tables use the project's window semantics instead.

    ## Limits

    - Range precision remains the limiting factor: `0.107` at fixed budget,
      `0.306` budgeted for headline `IsolationForest`, and `0.553` for the rank
      ensemble on the rolling cell. Even the rank ensemble fires roughly half its
      pages outside incidents. This supports alert-budget design, not
      unattended paging or adaptive-threshold rollout, until real-data
      precision and drift calibration improve.
    - Synthetic anomalies are easy to separate. The residual fix's large
      synthetic gain does not transfer to `NAB`, and the synthetic stream
      cannot show real precision.
    - `NSL-KDD` is a probe, not transfer evidence. Its `56.9%` prevalence,
      labelled split, unseen attack categories, and network-flow semantics
      differ from the `NAB` setting.
    - No result supports multivariate detectors or drifted telemetry.
    - The refinement ablation deliberately tests one configuration: one
      fusion pair, one context granularity, and one budget. A production
      study could revisit coarser contexts or train-side selection under the
      same adoption gate. That remains unproven here.


    ## Exact numbers

    `NAB` headline (fixed `2%` budget, `IsolationForest` with rolling+residual features,
    scored once per series):

    | NAB group | pointwise PR-AUC | range-F1 | windows touched (alerts emitted) |
    |---|---|---|---|
    | realTraffic | 0.728 | 0.310 | 5/5 (188) |
    | realKnownCause | 0.438 | 0.074 | 8/9 (1,289) |
    | realAWSCloudwatch | 0.404 | 0.088 | 3/3 (132) |
    | **overall** | **0.527** | **0.157** | **16/17 (1,609)** |

    Range-PR sweep + no-skill controls (threshold sweep over score quantiles,
    window matching throughout; artifact `reports/nab_metrics.json → no_skill`).
    The range-PR result uses one deterministic `IsolationForest` fit per series; the no-skill band is `16`
    seeded random baselines (per Lyu 2026, preprint: report the number of runs;
    single unreplicated source):

    | measure | IsolationForest (1 run/series) | no-skill band (16 seeds) |
    |---|---|---|
    | range-PR area | **0.804** | 0.228 [0.081, 0.401] |
    | precision at 0.5% of stream | 0.680 | — |
    | precision at 1% of stream | 0.632 | — |
    | precision at 2% of stream (recall 0.944) | 0.527 | 0.082 [0.063, 0.105] |
    | precision at 5% of stream | 0.234 | — |
    | no-skill recall at 2% | — | 0.885 [0.806, 0.962] |

    Sweep cells, raw → budgeted stream (alerts | range recall | `range-F1`):

    | sweep cell | alerts | range recall | range-F1 |
    |---|---|---|---|
    | isolation_forest + rolling | 1,864 → 66 | 0.729 → 0.604 | 0.154 → 0.388 |
    | isolation_forest + rolling_residual | 1,609 → 80 | 0.729 → 0.562 | 0.157 → 0.315 |
    | ensemble + rolling | 1,157 → 35 | 0.729 → 0.604 | 0.485 → 0.533 |
    | ensemble + rolling_residual | 1,003 → 45 | 0.729 → 0.562 | 0.316 → 0.365 |
    | lof + rolling_residual | 3,586 → 122 | 0.750 → 0.542 | 0.088 → 0.200 |

    Budgeted stream, default → tuned: `isolation_forest + rolling` moves `66` → `33` pages, `range-F1` `0.388` → `0.433`, and recall `0.604` → `0.500`; `isolation_forest + rolling_residual` moves `80` → `46` pages, `range-F1` `0.315` → `0.382`, and recall `0.562` → `0.479`. Tuned `ocsvm` cuts rolling/rolling+residual pages from `87/91` to `35/35`, with recall losses of `0.229/0.125`. The ensemble, `lof`, and `ocsvm` cells keep their defaults.

    Detector-layer ablation, identical windows (raw stream at the `2%` budget;
    pages = deduped + `24 h` cap; artifact `reports/nab_refinement.json`).
    Here `precision@budget` is the refinement artifact's macro mean over series at the fixed alert allowance. It differs from the `0.527` `range_pr` value, which comes from the threshold sweep in `nab_metrics.json`; these are distinct artifacts and aggregations:

    | candidate | alerts (raw → pages) | precision@budget | range-F1 | windows touched | PR-AUC |
    |---|---|---|---|---|---|
    | isolation_forest (baseline) | 1,609 → 80 | 0.512 | 0.157 | 16/17 | 0.527 |
    | if_calibrated | 2,546 → 103 | 0.490 | 0.148 | 16/17 | 0.522 |
    | fusion_if_lof | 786 → 41 | 0.650 | 0.403 | 14/17 | 0.587 |
    | fusion_if_lof_norm | 887 → 52 | 0.637 | 0.391 | 15/17 | 0.573 |

    Synthetic window (`5,983` test rows, `1.89%` prevalence): untuned `IsolationForest`
    `0.9158` `ROC-AUC` / `0.1239` `PR-AUC`; tuned `IsolationForest` `0.9171` `ROC-AUC`; tuned
    `OCSVM` `0.1355` `PR-AUC`; random `0.5091` / `0.0194`; rolling-median residual features
    lift `IsolationForest` to `0.9999` / `0.9960` without `NAB` transfer. `NSL-KDD` probe:
    `0.8877` / `0.8979` at `56.9%` test prevalence. In `threshold_sweep`, the marked
    `2%` point adds the tuned `OCSVM` point-level view: 17 of 120 flags hit injected anomalies,
    `14.2%` precision, not 17 distinct anomalies.

    ## Protocol

    - **Splits:** Train on the first `70%` of each series and score the later
      span once. The hyperparameter and champion-selection slice is the last
      `20%` of training. Select the synthetic champion by validation `PR-AUC` and
      freeze it before test scoring. Exactly `30` seeded Tree-structured Parzen
      Estimator (TPE) trials guide the past-only search by learning from
      earlier trials.
    - **Threshold:** Fix the train-anchored top-2% quantile of each series'
      scores before scoring. This is the assumed contamination budget, with
      no label tuning.
    - **Event rule:** A labelled window counts as detected when at least one
      alert lands inside it. Range precision divides alerts inside windows by
      all alerts. Range recall is the mean over all `12` series, with the three
      train-only series counting as zero. The raw detected fraction is reported
      separately as windows touched.
    - **Streams:** Raw pages every above-threshold minute. Deduped pages each
      contiguous run once at its maximum-score minute. Budgeted adds at most
      one page per series per 24 h.
    - **Tune stage:** Use an inner `80/20` split of each series' training
      window. The budget grid is 0.5–`8%` and the cooldown grid is 6–72 h. The
      objective is mean budgeted `range-F1` over all 12 series × both feature
      sets, or 24 runs per point. Adoption needs `+0.05` over the documented
      (`2%`, `24 h`) default, six validation windows across five series, and
      exactly one test evaluation per family, across four families.
    - **Refinement stage (`nab-refine`):** Score candidates on identical
      windows against the baseline stored in the artifact. Adoption requires
      precision at the budget and `range-F1` to improve while windows touched
      holds at 16/17. Calibration references are non-anomalous training
      scores for each hour-of-week context. Thin contexts fall back to the
      series-global set, then to the original raw cutoff.

    The diagram connects the limits to the decision path: use the
    protocol to protect the measurement, the exact tables to choose the
    operating point, and the precision limits to rule out unattended paging.
    ```diagram auto-03-anomaly-detection-3
    ```

    **In plain terms:** Blend all three detectors and cap alerts at one per series per day—this cuts on-call load to 35 pages with no extra tuning, though human review is still needed because nearly half of alerts are false alarms.

  figures: [threshold_sweep]
