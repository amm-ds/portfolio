key_concepts:
- "**Alert-budget stream** — the deployed artifact: deduplicated episodes capped at one page per series per 24 h, turning 1,609 raw alerts into 80 pages."
- "**Rank-average ensemble** — scores each minute by the mean of its normalized ranks under IsolationForest, LOF, and OCSVM; it wins the sweep at the frozen default without recalibration or tuning."
- "**Event-aware range-F1** — scores a labelled window detected once one alert lands inside it, measuring what an on-call engineer feels."
- "**Past-only splits** — each series trains on its first 70% and scores a later span once, so no incident leaks into fitting or tuning."
- "**Windows touched** — the raw share of labelled windows hit, reported apart from range recall's mean over all 12 series."
- "**Synthetic ladder** — a seeded stream that checks pipeline mechanics; its huge residual-feature gains never appeared on NAB."
- "**Operating point** — the (threshold budget, cooldown) pair chosen on training data alone; adoption needs +0.05 and one transferring test pass."
figure_captions:
  eda_signals_overview: "Two days (2,880 minutes) of the seeded synthetic stream. CPU, memory, and latency follow daily seasonality; injected anomalies appear as simultaneous CPU+latency spikes."
  telemetry_flags: "Synthetic test-window flags at the fixed 2% alert budget, compared with ground-truth anomalous minutes. The flags track simultaneous CPU+latency spikes; this is not a NAB result."
  hpo_importance: "One-Class SVM tuning on synthetic train-only validation: gamma carries 99% of importance, moving from the failing `scale` default to 0.0131 (best validation PR-AUC 0.126)."
  pr_curves: "Pointwise precision-recall curves on the synthetic test window, with the 1.9% prevalence floor. Tuned OCSVM leads AP at 0.136; these curves do not measure event-window recall."
  threshold_sweep: "Synthetic precision and recall across alert budgets, with the fixed 2% point marked: 115 flags, about 15% precision and recall (14.8%), including 17 hits on anomalous minutes. This is point-level load, not 17 incidents."
  adaptive_stream: "Adaptive versus fixed thresholds in streaming simulation. Synthetic-calibrated median/IQR drift detection fires on 31 of 120 real NAB chunks, so it remains too twitchy for the headline operating point."
  nab_timelines: "Six representative NAB test windows: amber bands are labelled events and pink crosses are IsolationForest alerts. These panels contain 897 alerts; nyc_taxi misses one window while the other five series touch theirs."
  nab_timeline_nyc_taxi: "The NAB nyc_taxi test window downsampled to every second minute: 3 of 4 labelled windows touched, range recall 0.750, pointwise PR-AUC 0.462, and 179 alerts emitted. The miss remains visible rather than averaged away."
  nab_score_distribution: "IsolationForest scores across evaluable NAB series, split by in-window versus outside-window minutes. Their overlap explains why no tested threshold cleanly separates incidents from normal traffic."
  nab_alert_budget: "Event-aware range-F1 by NAB benchmark group across alert budgets. Only IsolationForest is evaluated here; the curve exposes the trade-off between event detection and false-alert load, not a cross-detector ranking."
  nab_tune_surface: "Train-side operating-point selection surfaces: validation range-F1 of the budgeted alert stream vs per-series cooldown, one line per threshold budget, per detector family (four panels). The ring is the documented (2%, 24 h) default. Only IsolationForest's (0.5%, 24 h) adoption clears the 0.05 margin and transfers to test; the ensemble's flat surface (+0.010 at best) keeps the default — the winning candidate needs no tuning."
