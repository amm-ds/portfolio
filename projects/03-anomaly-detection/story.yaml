key_concepts:
- "**Alert-budget stream:** Deduplicated alert episodes capped at one page per series per 24 h, turning 1,609 raw alerts into 80 pages."
- "**Rank-average ensemble:** The mean of each minute's normalized ranks under IsolationForest, LOF, and OCSVM; it wins the sweep at the frozen default without recalibration or tuning."
- "**Event-aware range-F1:** A balance of event precision and recall that counts a labelled window as detected once one alert lands inside it."
- "**Past-only splits:** Each series trains on its first 70% and scores a later span once, so no test incident leaks into fitting, tuning, or champion selection."
- "**Windows touched:** The raw share of labelled windows hit, reported apart from range recall's mean over all 12 series."
- "**Synthetic ladder:** A seeded stream that checks pipeline mechanics; its large residual-feature gains never appeared on NAB."
- "**Operating point:** The threshold-budget and cooldown pair chosen on training data alone; adoption needs +0.05 and one transferring test evaluation."
figure_captions:
  eda_signals_overview: "Two days (2,880 minutes) of the seeded synthetic stream. CPU, memory, and latency follow a repeating daily cycle; injected anomalies appear as simultaneous CPU+latency spikes."
  telemetry_flags: "Synthetic test-window flags at the fixed 2% alert budget, compared with ground-truth anomalous minutes. The flags track simultaneous CPU+latency spikes; this is not a NAB result."
  hpo_importance: "One-Class Support Vector Machine tuning on synthetic train-only validation: gamma, the boundary-width setting, carries 99% of importance, moving from the failing `scale` default to 0.0131 (best validation PR-AUC 0.126)."
  pr_curves: "Pointwise precision-recall curves on the synthetic test window, with the 1.89% prevalence floor. Tuned OCSVM was frozen by validation PR-AUC 0.151 before this test AP 0.136 was measured; these curves do not select the champion or measure event-window recall."
  threshold_sweep: "Synthetic precision and recall across alert budgets, with the fixed 2% point marked: 115 flags, about 15% precision and recall (14.8%), including 17 hits on anomalous minutes. This is point-level load, not 17 incidents."
  adaptive_stream: "Synthetic test-window outcomes for fixed and adaptive thresholds: 120 alerts, 18 true positives, and 102 false positives fixed; 113, 17, and 96 adaptive. Precision/recall are 0.150/0.159 fixed and 0.150/0.150 adaptive. The right panel shows drift z for all five chunks against the trigger at 1.0; none fires. Separately, the same synthetic-calibrated rule fires on 31 of 120 real NAB chunks, so adaptive thresholds remain rejected for the headline operating point."
  nab_timelines: "Six representative NAB test windows: amber bands are labelled events and pink crosses are IsolationForest alerts. These panels contain 897 alerts; nyc_taxi misses one window while the other five series touch theirs. This matrix is the single timeline presentation; the nyc_taxi miss is not repeated in a separate figure."
  nab_score_distribution: "IsolationForest scores across evaluable NAB series, split by in-window versus outside-window minutes. Their overlap explains why no tested threshold cleanly separates incidents from normal traffic."
  nab_alert_budget: "Event-aware range-F1 by NAB benchmark group across alert budgets. Only IsolationForest is evaluated here; the curve exposes the trade-off between event detection and false-alert load, not a cross-detector ranking."
  nab_tune_surface: "Train-side operating-point selection surfaces: validation range-F1 of the budgeted alert stream vs per-series cooldown, one line per threshold budget, per detector family (four panels). The ring is the documented (2%, 24 h) default. Only IsolationForest's (0.5%, 24 h) adoption clears the 0.05 margin and transfers to test; the ensemble's flat surface (+0.010 at best) keeps the default, so the winning candidate needs no tuning."
