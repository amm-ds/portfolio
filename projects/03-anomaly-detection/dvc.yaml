stages:
  prepare:
    cmd: uv run python -m anomaly_detection.cli prepare
    deps:
      - src/anomaly_detection
      - params.yaml
    outs:
      - data/raw.parquet
      - data/dataset_contract.json
  validate:
    cmd: uv run python -m anomaly_detection.cli validate
    deps:
      - src/anomaly_detection
      - params.yaml
      - data/raw.parquet
    outs:
      - reports/dq_report.html
  features:
    cmd: uv run python -m anomaly_detection.cli features
    deps:
      - src/anomaly_detection
      - params.yaml
      - data/raw.parquet
    outs:
      - data/features.parquet
  train:
    cmd: uv run python -m anomaly_detection.cli train
    deps:
      - src/anomaly_detection
      - params.yaml
      - data/features.parquet
    outs:
      - data/models
  tune:
    cmd: uv run python -m anomaly_detection.cli tune
    deps:
      - src/anomaly_detection
      - params.yaml
      - data/features.parquet
    outs:
      - data/models_tuned
  evaluate:
    cmd: uv run python -m anomaly_detection.cli evaluate
    deps:
      - src/anomaly_detection
      - params.yaml
      - data/raw.parquet
      - data/features.parquet
      - data/models
      - data/models_tuned
    outs:
      - reports/report.html
      - reports/figures
    metrics:
      - reports/metrics.json
  detect:
    cmd: uv run python -m anomaly_detection.cli detect --adaptive
    deps:
      - src/anomaly_detection
      - params.yaml
      - data/features.parquet
      - data/models
      - data/models_tuned
    outs:
      - reports/detect.json
  residuals:
    cmd: uv run python -m anomaly_detection.cli residuals
    deps:
      - src/anomaly_detection
      - params.yaml
      - data/raw.parquet
    outs:
      - reports/residual_probe.json
  nsl:
    cmd: uv run python -m anomaly_detection.cli nsl
    deps:
      - src/anomaly_detection
      - params.yaml
    outs:
      - data/nsl
      - reports/nsl_probe.json
  nab:
    cmd: uv run python -m anomaly_detection.cli nab
    deps:
      - src/anomaly_detection
      - params.yaml
    outs:
      - data/nab
      - reports/nab_metrics.json
