[project]
name = "03-anomaly-detection"
version = "0.1.0"
description = "Portfolio project 03-anomaly-detection."
requires-python = ">=3.12"
dependencies = [
    "scikit-learn>=1.5",
    "typer>=0.12",
    "plotly>=5.24",
    "polars>=1.9",
    "numpy>=2.1",
    "portfolio-core",
    "portfolio-eval",
]

[project.scripts]
anomaly_detection = "anomaly_detection.cli:app"

[tool.uv.sources]
portfolio-core = { workspace = true }
portfolio-eval = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anomaly_detection"]
