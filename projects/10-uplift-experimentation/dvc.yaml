stages:
  prepare:
    cmd: uv run python -m uplift_experimentation.cli prepare --params-file params.yaml
    deps:
      - src/uplift_experimentation/
      - params.yaml
    params:
      - seed
      - hillstrom_source
      - hillstrom_sha256
      - treatment_segment
      - control_segment
    outs:
      - data/raw/hillstrom.csv
      - data/hillstrom.parquet
      - data/hillstrom_multi.parquet
      - data/dataset_contract.json
      - reports/segment_summary.json
      - reports/figures/eda_segment_profile.html
      - reports/figures/eda_segment_profile.json

  train:
    cmd: uv run python -m uplift_experimentation.cli train --params-file params.yaml
    deps:
      - src/uplift_experimentation/
      - params.yaml
      - data/hillstrom.parquet
      - data/hillstrom_multi.parquet
    params:
      - seed
      - cv_folds
      - treatment_segment
      - control_segment
    outs:
      - data/scores.parquet
      - data/scores_multi.parquet

  evaluate:
    cmd: uv run python -m uplift_experimentation.cli evaluate --params-file params.yaml
    deps:
      - src/uplift_experimentation/
      - params.yaml
      - data/scores.parquet
      - data/scores_multi.parquet
    params:
      - cuped_covariate
      - cuped_extra_covariates
      - alpha
      - power
      - revenue_per_conversion
      - cost_per_email
      - bootstrap_reps
      - cost_grid
      - budget_fractions
      - policy_budget
      - n_deciles
    outs:
      - reports/report.html
      - reports/figures/qini_curves.html
      - reports/figures/qini_curves.json
      - reports/figures/qini_per_arm.html
      - reports/figures/qini_per_arm.json
      - reports/figures/uplift_by_decile.html
      - reports/figures/uplift_by_decile.json
      - reports/figures/profit_frontier.html
      - reports/figures/profit_frontier.json
      - reports/figures/profit_frontier_multi_arm.html
      - reports/figures/profit_frontier_multi_arm.json
      - reports/figures/recommended_arm_distribution.html
      - reports/figures/recommended_arm_distribution.json
      - reports/figures/cost_sensitivity.html
      - reports/figures/cost_sensitivity.json
      - reports/figures/cuped_variance.html
      - reports/figures/cuped_variance.json

    metrics:
      - reports/metrics.json

  demo_payload:
    cmd: uv run python -m uplift_experimentation.cli demo-payload --params-file params.yaml
    deps:
      - src/uplift_experimentation/
      - data/scores_multi.parquet
      - reports/metrics.json
    params:
      - seed
      - bootstrap_reps
      - revenue_per_conversion
      - cost_per_email
      - policy_budget
    outs:
      - reports/demo_payload.json
