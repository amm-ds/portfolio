[project]
name = "10-uplift-experimentation"
version = "0.1.0"
description = "Portfolio project 10-uplift-experimentation: retention uplift modeling & experimentation (CUPED, power analysis, T/X-learners, Qini, profit policies) on the Hillstrom email dataset."
requires-python = ">=3.12"
dependencies = [
    # uplift meta-learners + propensity/response models are hand-rolled on sklearn
    # (DESIGN.md: no causallib/causalml dependency, fully CI-runnable)
    "scikit-learn>=1.5",
    "typer>=0.12",
    "plotly>=5.24",
    "polars>=1.9",
    "numpy>=2.1",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "portfolio-core",
    "portfolio-eval",
]

[project.scripts]
uplift_experimentation = "uplift_experimentation.cli:app"

[tool.uv.sources]
portfolio-core = { workspace = true }
portfolio-eval = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uplift_experimentation"]
