seed: 42

# Data
hillstrom_source: http://minethatdata.com/Kevin_Hillstrom_MineThatData_E-MailAnalytics_DataMiningChallenge_2008.03.20.csv
hillstrom_sha256: 0e5893329d8b93cefecc571777672028290ab69865718020c78c7284f291aece
treatment_segment: Mens E-Mail
control_segment: No E-Mail
# Campaign cost model (documented in DESIGN.md):
# - revenue_per_conversion: measured mean spend among converters (~$114 AOV),
#   i.e. REVENUE per incremental conversion — margin would subtract COGS,
#   which the snapshot does not expose; configurable for a real engagement
# - cost_per_email: marginal send cost of an ESP-delivered campaign
revenue_per_conversion: 114.0
cost_per_email: 0.01

# Bootstrap uncertainty (Qini coefficient + profit-at-budget CIs, paired across
# policies so model-vs-model differences share the same row resamples)
bootstrap_reps: 1000

# Cost-sensitivity sweep: profit-maximizing targeting fraction and the
# mail-everyone break-even as cost_per_email rises
cost_grid:
- 0.005
- 0.01
- 0.02
- 0.05
- 0.1
- 0.2
- 0.3
- 0.5

# CUPED
cuped_covariate: log_history
# Additional strictly pre-treatment covariates for the multivariate CUPED read
# (additive; the univariate read above keeps its current metrics keys/values)
cuped_extra_covariates:
- recency

# Uplift models (5-fold cross-fitting gives out-of-fold scores for the Qini read)
cv_folds: 5

# Power analysis
alpha: 0.05
power: 0.8

# Policy recommendation
budget_fractions:
- 0.05
- 0.1
- 0.15
- 0.2
- 0.25
- 0.3
- 0.4
- 0.5
- 0.6
- 0.7
- 0.8
- 0.9
- 1.0
policy_budget: 0.25
n_deciles: 10
