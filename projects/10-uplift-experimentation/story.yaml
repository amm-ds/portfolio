project_id: 10-uplift-experimentation
short_version: >-
  On 64,000-customer randomized email data, uplift targeting beat random
  targeting by +$2,812 (+69%) at a 25% send budget, CI [+$718, +$4,767]; at
  $0.01 per email, mailing everyone still wins. Targeting pays when sending
  is costly. Data: Hillstrom MineThatData, March 2008.
figure_captions:
  eda_segment_profile: >-
    Arm sizes, outcomes, and pre-period spend across Mens (21,307), Womens
    (21,387), and control (21,306). Mean prior spend is about $242 per arm;
    emails lift visits in both arms, but conversion rises materially only for
    Mens (0.57% control to 1.25%).
  uplift_by_decile: >-
    Predicted versus empirical treated−control conversion uplift by T-learner
    decile. Ordering is broadly useful but non-monotone, and predicted
    magnitudes run about 2× hot, so treat the ranking as coarse.
  cost_sensitivity: >-
    Best targeting-fraction profit versus mail-everyone as send cost sweeps
    $0.01–$0.50. Mail-everyone wins on raw profit at $0.01; top-25% overtakes
    above the ≈$0.30 break-even and reaches $1,618 versus −$4,777 at $0.50.
  qini_curves: >-
    Incremental conversions by targeted fraction with 95% paired-bootstrap
    bands. Response-minus-T Qini difference CI [−8.18, 9.52] spans zero; the
    separate T-versus-random profit-at-budget CI [+$718, +$4,767] is positive.
  profit_frontier: >-
    Incremental profit by mailed share at $114 revenue per conversion and
    $0.01 per email. Unconstrained mail-everyone maximizes raw profit at
    $16,103; within a 25% budget, T-learner beats random by +$2,812 (+69%).
  cuped_variance: >-
    CUPED with log prior-year spend leaves ATE unchanged and removes only
    0.08% of conversion variance versus 0.52% for visit. Adding recency gives
    0.12% / 0.95%; the covariate has little signal for the rare conversion.
  qini_per_arm: >-
    Empirical per-arm Qini curves on randomized arm-versus-control pairs. Mens
    Qini is 12.03 with CI [−0.47, 24.21] spanning zero; Womens is 3.37
    [−6.78, 13.75], also not established.
  profit_frontier_multi_arm: >-
    Model-estimated multi-arm profit frontier, not realized counterfactuals.
    At 25% budget, best-arm estimates $35.5k versus $29.5k single-arm Mens and
    $16.6k random; unconstrained mail-everyone-Mens leads raw profit at $49.8k
    until sends cost ≈$0.31.
  recommended_arm_distribution: >-
    Per-customer argmax over Mens uplift, Womens uplift, and no send: Mens
    76.0%, Womens 20.2%, none 3.8%. This is a model-based channel-choice list,
    not a second broadcast or a validated arm-assignment policy.
sections:
  - id: background
    text_md: |
      **Targeting pays when sending is costly.** On 64,000 randomized email
      customers, a model ranking by measured lift beat random targeting by
      +$2,812 (+69%) profit at a 25% send budget, CI [+$718, +$4,767]. At
      $0.01 per email, mailing everyone still made the most ($16,103)—the edge
      appears only under a send budget or higher cost.

      Data: the real Hillstrom MineThatData campaign (March 2008),
      checksum-pinned.

      Limits: "profit" is revenue minus send cost only—no margin, no
      fatigue—one historical campaign cannot guarantee future
      results.

      **In plain terms:** uplift asks "who buys *because of* the email?" not
      "who buys anyway?". The answer pays only when sends are expensive
      or the list must be trimmed—otherwise, send to everyone.
  - id: objectives
    text_md: |
      **The question: does ranking customers by modeled uplift beat simpler
      policies at a fixed 25% send budget — and where does that advantage
      disappear?** The anchor is the randomized assignment: because customers
      were allocated to arms by chance, the email's effect is measurable
      without modeling assumptions, and the models only reorder customers
      inside that anchor.

      - Verify the randomization and estimate the campaign effect before
        modeling.
      - Attach paired-bootstrap uncertainty to every policy comparison.
      - Test whether a variance-reduction adjustment (CUPED) sharpens the
        estimate.
      - Compare response, T-learner, and X-learner rankings against random
        and mail-everyone baselines on profit, and stress-test the verdict
        against send cost.
  - id: data
    text_md: |
      **Randomized assignment is why the numbers mean what they say.** The
      checksum-pinned March 2008 snapshot holds 64,000 customers with
      recency, prior-year spend, merchandise flags, channel, and
      visit/conversion/spend outcomes; upstream drift fails the sha256 gate,
      and provenance is linked in
      [data-registry/hillstrom](https://amm-ds.github.io/portfolio/data-registry/hillstrom/).

      The primary read keeps the Mens-email and no-email arms (42,613
      customers) so the comparison is unambiguous; the full three-arm frame
      supports per-arm reads and channel-choice planning. The column mapping
      lives under Details.
  - id: eda
    text_md: |
      **How we judged it: check the randomization first, then trust small
      differences only with wide intervals.** The three arms look alike
      before the campaign — about $242 mean prior spend in each — so the
      design did its job. Both emails lifted store visits (18.3% and 15.1%
      vs 10.6% without); only the Mens email lifted purchases (1.25% vs 0.88%
      and 0.57%). Purchases are rare — about 0.9% baseline — so small gaps
      need honest uncertainty, and the two emails are read separately rather
      than pooled. The per-arm table is under Details.
    figures: [eda_segment_profile, recommended_arm_distribution]
  - id: training
    text_md: |
      **What we found, with every score computed out-of-fold.** Five-fold
      cross-fitting means the model scoring a customer never trained on that
      customer, so rankings cannot grade their own homework.

      ```mermaid
      flowchart LR
          A[pre-treatment features] --> R[response model]
          A --> T[T-learner]
          T --> X[X-learner]
          R --> O[out-of-fold scores]
          X --> O
          T --> O
      ```

      Three ways to rank customers. A *response model* scores who is likely
      to buy, so it chases "sure things" who would buy anyway. *Uplift*
      modeling targets the incremental purchase instead: the T-learner fits
      one model per arm and scores treated-minus-control; the X-learner
      imputes each arm's effect and combines the two propensity-weighted.
      Base learners are gradient boosting over pre-treatment features only.

      The randomized anchor is solid: Mens conversion is 1.25% versus 0.57%
      control — an average treatment effect of +0.68 percentage points
      (SE 0.09). The experiment is comfortably powered: 3,063 customers per
      arm are needed at the standard 5% significance and 80% power; 21,306
      are available. The CUPED adjustment — using pre-campaign spend to soak
      up noise — leaves the effect unchanged and removes only 0.08% of
      conversion variance (0.52% for visits), a useful negative finding.

      Policy verdicts, each with 1,000 paired bootstraps (the same resampled
      customers for every policy, so differences are fair):

      - *Qini* — area between the ranking curve and random — measures ranking
        quality. At a 25% send budget the T-learner earns $6,838 [$4,430,
        $9,370] against $4,026 for random: **+$2,812 (+69%), CI [+$718,
        +$4,767], entirely positive**, capturing about 61 of the ~145
        incremental conversions (42%) with a quarter of the sends. Its Qini
        of 12.03 [0.77, 24.39] trails the response model's 13.01 [1.83,
        24.36] — but the response-minus-T difference CI [−8.18, 9.52] spans
        zero, so that curve ranking is **not established**.
      - That is budget efficiency, not the profit maximum: at $0.01 per email
        mail-everyone earns $16,103 and T-minus-full-mail is −$9,265
        [−$13,125, −$5,808]. The verdict flips with cost — the
        profit-maximizing share drops below "everyone" near $0.20 per email,
        and above ≈$0.30 the T-learner list beats mail-everyone outright
        ($1,618 vs −$4,777 at $0.50).
      - Per-arm reads are humbler than the two-arm read: the Mens per-arm
        Qini of 12.03 [−0.47, 24.21] spans zero, Womens is 3.37 [−6.78,
        13.75]. Best-channel planning favors Mens for 76.0% of customers,
        Womens 20.2%, none 3.8%; that money is model-estimated ($35.5k at
        25% budget vs $16.6k random), not randomized, and predicted deciles
        run about 2× hot — planning values, not a validated policy.
        Mail-everyone-Mens still leads unconstrained profit at $49.8k until
        sends cost ≈$0.31.
    figures: [cuped_variance, profit_frontier_multi_arm]
  - id: evaluation
    text_md: |
      **What it means: adopt targeted sending only when sends are budgeted or
      costly; otherwise mail everyone.** The randomized basis makes the
      budgeted comparison credible and its interval is entirely positive; the
      unestablished parts are the Qini ranking between models and either
      per-arm Qini, so the decision rests on profit at the stated budget and
      cost threshold, not curve area.

      **Business summary:** the deployable claim is budgeted efficiency —
      +69% versus random targeting at a 25% budget, CI [+$718, +$4,767]. At
      $0.01 per email, mail everyone instead (−$9,265). Margin, fatigue
      costs, and prospective performance remain unmeasured: the next spend is
      a fresh randomized holdout, not a rollout.
    figures: [uplift_by_decile, cost_sensitivity]
  - id: results
    text_md: |
      **What this does not show.** "Profit" is revenue ($114 per conversion)
      minus send cost — no COGS, no margin, no fatigue from repeated contact.
      One March 2008 campaign cannot establish what a future campaign will
      do. The per-arm Qini intervals span zero, the response-versus-T Qini
      ranking is unsettled, and all multi-arm money is model-estimated
      planning value, not a randomized outcome. The X-learner trails here,
      but that is specific to this strong-overlap, near-constant-propensity
      regime — not a general ranking of learners.
    figures:
      [qini_curves, profit_frontier, qini_per_arm]
    metrics_keys: [response, t_learner, x_learner, random, treat-everyone]
  - id: conclusions
    text_md: |
      **Established: the small Mens effect and the budgeted T-learner
      advantage over random at 25% budget. Unestablished: the
      response-versus-T Qini ranking and either per-arm Qini.** Claim the
      budgeted profit comparison, not a universal Qini winner or a full-mail
      recommendation. CUPED's tiny reduction and the X-learner's weak result
      remain useful negative findings. Revalidate prospectively on a fresh
      randomized holdout with real margin and fatigue costs before any
      rollout.

      ### Exact policy results

      Seed 42, out-of-fold; profit = incremental conversions × $114 revenue −
      mailed × $0.01 send cost.

      | policy | Qini [95% CI] | profit @25% [95% CI] | Δ profit vs random |
      |---|---|---|---|
      | response | 13.01 [1.83, 24.36] | $4,881 [$2,246, $7,386] | +$856 |
      | **T-learner** | **12.03 [0.77, 24.39]** | **$6,838 [$4,430, $9,370]** | **+$2,812** |
      | X-learner | 5.90 [−5.45, 17.48] | $4,564 [$2,150, $7,306] | +$539 |
      | random | 0.0 | $4,026 | — |
      | treat-everyone | 0.0 | full-mail $16,103 | — |

      Paired difference intervals (1,000 seeded row bootstraps reusing each
      resample across policies; T-learner vs random at budget [+$718,
      +$4,767] is entirely positive):

      | comparison | 95% CI | spans zero? |
      |---|---|---|
      | response − T-learner, Qini | [−8.18, 9.52] | yes — ranking not established |
      | response − T-learner, profit @25% | [−$3,617, −$48] | no — favors T |
      | T-learner − X-learner, profit @25% | [−$323, $4,343] | yes |
      | T-learner − mail-everyone, profit | [−$13,125, −$5,808] | no — favors full mail |

      ### Cost sensitivity (send cost sweep)

      | send cost | profit-maximizing share | best profit | mail-everyone |
      |---|---|---|---|
      | $0.01 | 100% | $16,103 | $16,103 |
      | $0.10 | 100% | $12,268 | $12,268 |
      | $0.20 | 90% | $8,065 | $8,007 |
      | $0.30 | 90% | $4,230 | $3,745 |
      | $0.50 | 25% | $1,618 | −$4,777 |

      Analytic break-even ≈$0.30 per email. The top-25% list captures about
      61 of 145 incremental conversions (42%) using one quarter of the sends.

      ### EDA and experiment tables

      | segment | n | visit rate | conversion rate | mean prior spend |
      |---|---|---|---|---|
      | Mens E-Mail | 21,307 | 0.183 | 0.0125 | ~$243 |
      | Womens E-Mail | 21,387 | 0.151 | 0.0088 | ~$243 |
      | No E-Mail | 21,306 | 0.106 | 0.0057 | ~$241 |

      | cost parameter | value | meaning |
      |---|---|---|
      | `revenue_per_conversion` | $114 | mean spend among converters; revenue, not margin |
      | `cost_per_email` | $0.01 | marginal send cost only |
      | policy budget | 25% | maximum share mailed by the budgeted policy |
      | base conversion rate | ~0.9% | rare-outcome regime |

      | project column | source | role |
      |---|---|---|
      | treatment | segment | Mens = 1, control = 0 |
      | conversion | conversion | primary outcome (~0.9% base) |
      | visit / spend | visit / spend | secondary outcomes |
      | `log_history` | history | feature + CUPED covariate |
      | recency, mens, womens, newbie | same | numeric/binary features |
      | channel, zip_code | same | categorical features |

      ### Per-arm and multi-arm reads (exact)

      Mens per-arm (randomized arm-vs-control pairs, 21,307 + 21,306): Qini
      12.03 [−0.47, 24.21], incremental conversions at full send 145.0
      [107.97, 181.88]. Womens (21,387 + 21,306): Qini 3.37 [−6.78, 13.75],
      incremental 66.5 [33.10, 104.69]. Policy money is model-estimated from
      summed predicted uplift: best-arm $35,514 [35.1k, 36.0k] at 25% budget
      versus single-arm-Mens $29,487 and random $16,563; paired model-based
      differences exclude zero. Unconstrained mail-everyone-Mens leads at
      $49,819 until the ≈$0.31 model-estimated break-even. No randomized
      assignment realizes the recommended mix, so these stay planning values.

      ### Reproduce

      ```bash
      uv run python -m uplift_experimentation.cli all   # minutes, end-to-end
      uv run dvc repro                                  # the same, staged
      ```
roadmap:
  - status: delivered
    text: Hillstrom experimentation stack — RCT validation, power/CUPED, T/X-learners, paired-bootstrap policy CIs, and cost-sensitivity grid on the pinned snapshot.
  - status: deferred
    text: Prospective validation of the budgeted policy on a fresh randomized campaign holdout — requires a new live campaign; not derivable from the 2008 snapshot.
  - status: deferred
    text: Replace revenue-minus-send-cost profit with measured margin and fatigue costs before deployment — needs per-order margin and contact-fatigue data the snapshot does not carry.
  - status: deferred
    text: Empirical evaluation of the recommended multi-arm channel mix — requires randomizing per-customer arm assignment; until then the mix stays a model-estimated planning value.
  - status: deferred
    text: Revisit CUPED only with stronger pre-treatment covariates; current gains are negligible.
