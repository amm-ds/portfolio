project_id: 10-uplift-experimentation
figure_captions:
  eda_segment_profile: >-
    Arm sizes, outcomes, and pre-period spend across Mens (21,307), Womens
    (21,387), and control (21,306). Mean prior spend is about $242 per arm;
    emails lift visits in both arms, but conversion rises materially only for
    Mens (0.57% control to 1.25%).
  uplift_by_decile: >-
    Predicted versus empirical treated−control conversion uplift by T-learner
    decile. Ordering is broadly useful but non-monotone, and predicted
    magnitudes run about 2× hot, so treat the ranking as coarse.
  cost_sensitivity: >-
    Best targeting-fraction profit versus mail-everyone as send cost sweeps
    $0.01–$0.50. Mail-everyone wins on raw profit at $0.01; top-25% overtakes
    above the ≈$0.30 break-even and reaches $1,618 versus −$4,777 at $0.50.
  qini_curves: >-
    Incremental conversions by targeted fraction with 95% paired-bootstrap
    bands. Response-minus-T Qini difference CI [−8.18, 9.52] spans zero; the
    separate T-versus-random profit-at-budget CI [+$718, +$4,767] is positive.
  profit_frontier: >-
    Incremental profit by mailed share at $114 revenue per conversion and
    $0.01 per email. Unconstrained mail-everyone maximizes raw profit at
    $16,103; within a 25% budget, T-learner beats random by +$2,812 (+69%).
  cuped_variance: >-
    CUPED with log prior-year spend leaves ATE unchanged and removes only
    0.08% of conversion variance versus 0.52% for visit. Adding recency gives
    0.12% / 0.95%; the covariate has little signal for the rare conversion.
  qini_per_arm: >-
    Empirical per-arm Qini curves on randomized arm-versus-control pairs. Mens
    Qini is 12.03 with CI [−0.47, 24.21] spanning zero; Womens is 3.37
    [−6.78, 13.75], also not established.
  profit_frontier_multi_arm: >-
    Model-estimated multi-arm profit frontier, not realized counterfactuals.
    At 25% budget, best-arm estimates $35.5k versus $29.5k single-arm Mens and
    $16.6k random; unconstrained mail-everyone-Mens leads raw profit at $49.8k
    until sends cost ≈$0.31.
  recommended_arm_distribution: >-
    Per-customer argmax over Mens uplift, Womens uplift, and no send: Mens
    76.0%, Womens 20.2%, none 3.8%. This is a model-based channel-choice list,
    not a second broadcast or a validated arm-assignment policy.
sections:
  - id: background
    text_md: |
      **At a 25% send budget, the T-learner earns +$2,812 (+69%) versus random
      with a positive 95% paired-bootstrap CI [+$718, +$4,767]; unconstrained
      mail-everyone still maximizes profit at $0.01/email, and the Mens per-arm
      Qini CI [−0.47, 24.21] spans zero.**

      Data: real Hillstrom MineThatData email data — 64,000 customers in a
      March 2008 randomized campaign, sha256-pinned from the author's site and
      published for research use without a formal license file; attribute
      MineThatData/Hillstrom.

      Limits: "profit" is revenue ($114 per conversion) minus send cost only,
      with no COGS or margin; multi-arm policy money is model-estimated
      planning value, and one 2008 snapshot cannot establish prospective
      campaign performance.

      Response models rank customers by purchase likelihood and concentrate on
      "sure things" the campaign cannot create; randomized assignment plus
      uplift modeling targets incremental conversions instead.

      The Hillstrom campaign supplies 64,000 customers across Mens, Womens, and
      no-email arms. The primary decision uses Mens versus control; the secondary
      multi-arm read asks which channel to recommend.

      | cost parameter | value | meaning |
      |---|---|---|
      | `revenue_per_conversion` | $114 | mean spend among converters; revenue, not margin |
      | `cost_per_email` | $0.01 | marginal send cost only |
      | policy budget | 25% | maximum share mailed by the budgeted policy |
      | base conversion rate | ~0.9% | rare-outcome regime |

      **Business summary:** Targeting only creates value under a constraint.
      At $0.01/email, mailing everyone maximizes raw profit ($16,103); the
      T-learner's advantage appears at a 25% send budget (+$2,812 vs random,
      CI [+$718, +$4,767]) and above the ≈$0.30/email break-even.
  - id: objectives
    text_md: |
      **The objective is a budgeted send policy: maximize profit at a 25% send
      fraction, with paired-bootstrap uncertainty attached to every policy
      comparison.**

      - Check randomization and estimate the treatment effect before modeling.
      - Measure CUPED variance reduction from strictly pre-treatment covariates.
      - Size the experiment at alpha 0.05 and power 0.8.
      - Compare response, T-learner, and X-learner policies against random,
        treat-everyone, and no-campaign baselines using out-of-fold Qini and
        profit with paired-bootstrap intervals.
      - Separate unconstrained profit maximization from efficiency at a 25%
        send budget, and recommend on the budgeted money metric.
  - id: data
    text_md: |
      **Randomized assignment identifies the treatment effect without modeling
      assumptions; the learners only rank customers within that anchor.** The
      checksum-pinned March 2008 snapshot contains recency, prior-year spend,
      merchandise flags, zip class, newbie status, channel, visit, conversion,
      and spend. Upstream drift fails the sha256 gate; provenance is linked in
      [data-registry/hillstrom](https://amm-ds.github.io/portfolio/data-registry/hillstrom/).

      The primary frame keeps Mens E-Mail and No E-Mail (42,613 customers) so
      the treatment estimand is unambiguous. The full 64,000-customer frame
      supports secondary per-arm scores and best-arm planning.

      | project column | source | role |
      |---|---|---|
      | treatment | segment | Mens = 1, control = 0 |
      | conversion | conversion | primary outcome (~0.9% base) |
      | visit / spend | visit / spend | secondary outcomes |
      | `log_history` | history | feature + CUPED covariate |
      | recency, mens, womens, newbie | same | numeric/binary features |
      | channel, zip_code | same | categorical features |
  - id: eda
    text_md: |
      **Randomization is balanced, but the conversion signal is small and
      arm-specific.** Mean prior spend is about $242 in every arm. Emails raise
      visits strongly, while only Mens shows a material conversion increase.

      | segment | n | visit rate | conversion rate | mean prior spend |
      |---|---|---|---|---|
      | Mens E-Mail | 21,307 | 0.183 | 0.0125 | ~$243 |
      | Womens E-Mail | 21,387 | 0.151 | 0.0088 | ~$243 |
      | No E-Mail | 21,306 | 0.106 | 0.0057 | ~$241 |

      That rare, asymmetric outcome motivates power analysis, cautious
      intervals, and separate per-arm reads rather than assuming both emails
      behave alike.
    figures: [eda_segment_profile]
  - id: training
    text_md: |
      **Every evaluated score is out-of-fold.** Five-fold cross-fitting keeps a
      row's evaluation prediction separate from any model trained on that row.

      ```mermaid
      flowchart LR
          A[pre-treatment features] --> R[response model]
          A --> T[T-learner]
          T --> X[X-learner]
          R --> O[out-of-fold scores]
          X --> O
          T --> O
      ```

      The response model fits treated outcomes only; the T-learner scores
      mu1 − mu0; the X-learner imputes per-arm effects before a
      propensity-weighted combination. Base learners are HistGradientBoosting
      inside a one-hot ColumnTransformer. The regularized logistic propensity
      is clipped to [0.05, 0.95]. Implementation trade-offs are in `DESIGN.md`.
  - id: evaluation
    text_md: |
      **Qini diagnoses ranking; profit at the stated budget drives the policy.**
      Both are computed out-of-fold, with paired uncertainty.

      - **Qini:** sort by score and plot incremental conversions by targeted
        fraction; the coefficient is area above the random line in conversion
        units.
      - **Profit frontier:** `profit(f) = inc(f) × $114 − mailed(f) × $0.01`.
        Full-mail answers the unconstrained raw-profit question; the 25% point
        answers the fixed-budget efficiency question. They are not interchangeable.
      - **Paired uncertainty:** 1,000 seeded row bootstraps reuse each resample
        across policies. Difference intervals determine whether comparisons
        span zero.
      - **Cost sensitivity:** recompute the profit-maximizing fraction and the
        mail-everyone comparison across send costs, including analytic break-even.
      - **Deciles:** compare predicted ordering with empirical arm contrasts;
        random and treat-everyone have Qini 0 by construction.
    figures: [uplift_by_decile, cost_sensitivity]
  - id: results
    text_md: |
      **The experiment is precise enough for the ATE, but model-ranking evidence
      is mixed.** Mens conversion is 1.253% versus 0.573% control: ATE +0.68pp,
      SE 0.09pp. Power analysis requires 3,063 customers per arm at alpha 0.05
      and power 0.8; 21,306 are available.

      CUPED leaves ATE unchanged and removes only 0.08% of conversion variance
      (0.52% for visit). Adding recency reaches 0.12% / 0.95%: prior spend is a
      weak covariate for this rare outcome, not an automatic variance win.

      | policy | Qini [95% CI] | profit @25% [95% CI] | Δ profit vs random |
      |---|---|---|---|
      | response | 13.01 [1.83, 24.36] | $4,881 [$2,246, $7,386] | +$856 |
      | **T-learner** | **12.03 [0.77, 24.39]** | **$6,838 [$4,430, $9,370]** | **+$2,812** |
      | X-learner | 5.90 [−5.45, 17.48] | $4,564 [$2,150, $7,306] | +$539 |
      | random | 0.0 | $4,026 | — |
      | treat-everyone | 0.0 | full-mail $16,103 | — |

      The budgeted T-versus-random profit delta is **+$2,812 (+69%), 95% CI
      [+$718, +$4,767]**, entirely positive. The top-25% list captures about 61
      of 145 incremental conversions (42%) using one quarter of the sends.

      **That is budget efficiency, not the unconstrained profit maximum.** At
      $0.01/email, mail-everyone earns $16,103, and T-minus-full-mail is
      −$9,265 [−$13,125, −$5,808]. The profit-maximizing fraction drops below
      full mail around $0.20/email; above the ≈$0.30 analytic break-even,
      top-25% beats mail-everyone. At $0.50, the values are $1,618 and −$4,777.

      Response-minus-T Qini difference CI [−8.18, 9.52] spans zero, so curve-area
      ranking is not established. Response-minus-T budget-profit difference CI
      [−$3,617, −$48] favors T; T-minus-X profit CI [−$323, $4,343] spans zero.
      The X-learner trails in this strong-overlap, near-constant-propensity
      regime; that is not a universal learner ranking.

      **Per-arm and multi-arm reads carry different uncertainty.** The empirical
      Mens per-arm Qini is 12.03 **[−0.47, 24.21]**, spanning zero even though
      its point estimate matches the two-arm T-learner. Womens is 3.37
      [−6.78, 13.75], also spanning zero. These per-arm intervals must not be
      replaced by the separate two-arm interval above.

      Best-arm recommendations are Mens 76.0%, Womens 20.2%, none 3.8%. Policy
      money is model-estimated from summed predicted uplift: $35.5k [35.1k,
      36.0k] at 25% budget versus $29.5k single-arm and $16.6k random; paired
      model-based differences exclude zero. No randomized assignment realizes
      the recommended mix, and deciles run about 2× hot, so these are planning
      values. Unconstrained mail-everyone-Mens still leads at $49.8k until sends
      cost ≈$0.31.

      **Business summary:** Adopt the T-learner top-25% list only under a send
      budget or higher send cost — it does not beat mail-everyone at $0.01
      (−$9,265, CI below zero), and the response-vs-T Qini ranking is not
      established. The per-arm and multi-arm numbers are planning values, not
      validated policies.
    figures:
      [qini_curves, profit_frontier, cuped_variance, qini_per_arm,
       profit_frontier_multi_arm, recommended_arm_distribution]
    metrics_keys: [response, t_learner, x_learner, random, treat-everyone]
  - id: conclusions
    text_md: |
      **The established claims are the small Mens ATE and the budgeted
      T-learner advantage over random at 25% budget; the unestablished ones are
      the response-versus-T Qini ranking and either per-arm Qini.** Claim the
      budgeted profit comparison, not a universal Qini winner or a full-mail
      recommendation.

      At $0.01/email, mailing everyone makes more raw profit; targeting creates
      value by concentrating conversions under a send constraint or higher send
      cost. CUPED's tiny reduction and the X-learner's weak result remain useful
      negative findings. Multi-arm channel choice stays model-estimated until a
      randomized policy is evaluated.

      **Results quality: acceptable with caveats.** Revalidate prospectively on
      a fresh randomized holdout with real margin and fatigue costs. Use profit
      intervals for the stated constraint, retain out-of-fold evaluation, and do
      not turn one historical snapshot into a deployment guarantee.

      **Business summary:** The deployable claim today is budgeted efficiency
      (+69% vs random at 25% budget, CI entirely positive). Margin, fatigue
      costs, and prospective performance remain unmeasured — the next spend is
      a fresh randomized holdout, not a rollout.
roadmap:
  - status: delivered
    text: Hillstrom experimentation stack — RCT validation, power/CUPED, T/X-learners, paired-bootstrap policy CIs, and cost-sensitivity grid on the pinned snapshot.
  - status: deferred
    text: Prospective validation of the budgeted policy on a fresh randomized campaign holdout — requires a new live campaign; not derivable from the 2008 snapshot.
  - status: deferred
    text: Replace revenue-minus-send-cost profit with measured margin and fatigue costs before deployment — needs per-order margin and contact-fatigue data the snapshot does not carry.
  - status: deferred
    text: Empirical evaluation of the recommended multi-arm channel mix — requires randomizing per-customer arm assignment; until then the mix stays a model-estimated planning value.
  - status: deferred
    text: Revisit CUPED only with stronger pre-treatment covariates; current gains are negligible.
