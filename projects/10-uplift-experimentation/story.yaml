project_id: 10-uplift-experimentation
headline: >-
  The recommended top-25% T-learner targeting list earns +$2,812 (+69%) profit
  vs random at equal budget (95% paired-bootstrap CI [+$718, +$4,767] —
  established), with out-of-fold Qini 12.03 [0.77, 24.39], while the Qini
  curve-area ranking between policies is not established (paired CI
  [−8.18, 9.52] spans zero).
data_note: >-
  Real data: the Hillstrom MineThatData email-marketing benchmark (64,000
  customers, March 2008 randomized campaign), fetched sha256-pinned from the
  author's site and published by the author for research use — no formal
  license file; attribute MineThatData/Hillstrom.
limits: >-
  Does not show margin — profit is revenue ($114 per conversion) minus send
  cost only, no COGS in the snapshot — and the multi-arm best-arm money
  figures are model-estimated planning values, not realized counterfactuals.
figure_captions:
  eda_segment_profile: >-
    Arm sizes, visit/conversion rates and mean pre-period spend for the
    three Hillstrom arms (Mens E-Mail 21,307 / Womens E-Mail 21,387 /
    No E-Mail 21,306 of 64,000). Randomization holds — mean prior spend is
    ~$242 in every arm — and the emails lift visits in both arms but
    conversion only in the Mens arm (0.57% → 1.25% on a ~0.9% base).
  uplift_by_decile: >-
    Mean predicted uplift vs the empirical treated−control conversion
    contrast per decile for the T-learner (decile 1 = highest scores). The
    broad ordering holds — top decile 1.1pp vs 0.3pp at the bottom — but
    predicted magnitudes run about 2× hot and the empirical curve is
    non-monotone, so treat the ranking as coarse.
  cost_sensitivity: >-
    Profit of the best targeting fraction vs mail-everyone as the send cost
    sweeps $0.01–$0.50 (log scale); the dotted line is the analytic
    break-even at ≈$0.30/email. At $0.01 mail-everyone wins on raw profit;
    above ≈$0.30 the top-25% policy overtakes (at $0.50: $1,618 vs
    −$4,777).
  qini_curves: >-
    Incremental conversions vs the fraction of customers targeted, per
    policy, with 95% paired-bootstrap bands. The response model's curve
    area leads, but its paired difference CI spans zero — the ranking is
    not established; T-learner's profit advantage is.
  profit_frontier: >-
    Incremental profit vs the share of customers emailed, per policy,
    under the cost model ($114 revenue per conversion, $0.01 per email);
    the star marks the recommended top-25% point. Mail-everyone is the
    profit maximum at $0.01/email ($16,103); at a 25% budget the T-learner
    beats random by +$2,812 (+69%).
  cuped_variance: >-
    Outcome variance before and after CUPED adjustment with the log1p
    prior-year-spend covariate, for conversion (primary) and visit
    (secondary). CUPED leaves the ATE unchanged but removes only 0.08% of
    conversion variance vs 0.52% for visit — prior spend barely predicts a
    ~1% event. Adding recency alongside (multivariate read) reaches 0.12% /
    0.95% — covariate selection is the design decision.
  qini_per_arm: >-
    Empirical Qini curves for the per-arm cross-fitted T-learners on the
    randomized arm-vs-control pairs; the Mens-arm fit reproduces the
    committed two-arm T-learner curve exactly (same score stream), so the
    duplicated overlay was dropped from the figure. Mens ranks
    (Qini 12.03); the Womens arm's conversion ranking (3.37, CI spanning
    zero) is not established.
  profit_frontier_multi_arm: >-
    Multi-arm profit frontier at $114 revenue per conversion and $0.01 per
    email, model-estimated: incremental conversions are summed predicted
    uplift over the targeted set (no counterfactual claim). The best-arm
    policy (star, 25% budget) earns $35.5k vs $29.5k single-arm Mens and
    $16.6k random; mail-everyone-mens leads on raw profit ($49.8k) until
    sends cost ≈$0.31/email.
  recommended_arm_distribution: >-
    Per-customer recommended arm under argmax(uplift_mens, uplift_womens, 0):
    Mens 76.0%, Womens 20.2%, none 3.8% (both scores ≤ 0 or tied). The
    Womens email is chosen only where its estimated uplift beats the Mens
    alternative — a channel-choice list, not a second broadcast.
sections:
  - id: background
    text_md: |
      Marketing analytics has a seductive failure mode: build the best model
      of who will convert, then market to its top scorers. That targets
      *sure things* — customers who would convert anyway — and ignores
      *persuadables*, the only people a campaign can actually create. The
      decision is not "who will buy?" but "who buys *because of us*?" — a
      counterfactual question that only a randomized design plus an uplift
      model (one scoring the *extra* conversions a campaign causes per
      customer, not who would convert anyway) can answer.

      This project runs the full experimentation stack on the canonical
      Hillstrom email benchmark: a 2008 randomized campaign of 64,000
      customers split across a Mens E-Mail arm, a Womens E-Mail arm, and a
      no-email control. The decision on the table: who gets the next send,
      and what is it worth in money rather than clicks.

      | cost parameter | value | meaning |
      |---|---|---|
      | `revenue_per_conversion` | $114 | measured mean spend among converters — revenue, not margin (no COGS in the snapshot) |
      | `cost_per_email` | $0.01 | marginal ESP send cost |
      | policy budget | 25% | share of customers the targeting policy may mail |
      | base conversion rate | ~0.9% | the regime where naive targeting wastes budget |

      **Business summary:** Marketing analytics has a seductive failure
      mode: build the best model of who will convert, then market to its
      top scorers — which targets the sure things who would convert
      anyway and ignores the persuadables, the only people a campaign
      can actually create. The real question is counterfactual — who
      buys because of us? — and answering it needs a randomized
      experiment plus an uplift model that scores the extra conversions
      a campaign causes per customer. Campaign profit is then a
      concentration problem: spend the fixed budget on the customers
      with the highest incremental conversion probability. The
      deliverable is a targeting list plus a defensible dollar figure,
      not a leaderboard score.
  - id: objectives
    text_md: |
      - **Read the experiment before modeling:** arm sizes, balance on
        pre-period covariates, and the difference-in-means effect with its
        standard error — before any modeling.
      - **Reduce variance with CUPED** using a strictly pre-treatment
        covariate (prior-year spend), and *measure* how much variance it
        actually removes rather than assuming the textbook win.
      - **Size the experiment:** customers per arm required for the measured
        effect at alpha 0.05 and power 0.8, against the customers actually
        available.
      - **Compare three targeting policies** on out-of-fold scores — the
        marketing-practice response model, a T-learner, and an X-learner —
        against the naive baselines (random, treat-everyone, no-campaign) on
        Qini curves and on profit under the campaign cost model, each with a
        paired-bootstrap CI.
      - **Recommend a budget-constrained policy** with an expected
        incremental-profit delta vs random and the real limits of
        predicting conversions at a 1% base rate.

      **Business summary:** Every artefact in this project answers a
      question a campaign owner actually asks. Is the effect real — read
      directly from the randomized design with its standard error before
      any modeling. Is the sample big enough — a power calculation
      sized against the customers actually available. Who do I mail —
      three targeting policies compared honestly, each with paired
      confidence intervals. And what do I get for it — the
      recommendation is the profit maximum at the budget, chosen on
      money with the ranking diagnostic secondary.
  - id: data
    text_md: |
      Hillstrom email marketing dataset (Kevin Hillstrom's MineThatData
      challenge, March 2008): 64,000 customers with pre-treatment attributes
      (recency, prior-year spend `history` plus its binning, mens/womens
      merchandise flags, zip code class, newbie flag, channel) and outcomes
      (visit, conversion, spend). Fetched checksum-pinned from the author's
      site through the platform's `io.fetch` — the sha256 gate fails loudly
      if the upstream snapshot drifts (see
      [data-registry/hillstrom](https://amm-ds.github.io/portfolio/data-registry/hillstrom/)).

      The primary read is the two-arm frame — Mens E-Mail (treatment) vs
      No E-Mail (control), 42,613 customers after dropping the Womens E-Mail
      arm from the modeling frame. A two-arm treatment keeps every estimand
      unambiguous. The full three-arm frame (64,000 customers, per-arm
      assignment indicators) is also prepared and backs the secondary
      multi-treatment read — per-arm uplift scores and the best-arm
      channel-choice policy.

      | project column | Hillstrom source | role |
      |---|---|---|
      | treatment | segment | 1 = Mens E-Mail, 0 = No E-Mail |
      | conversion | conversion | primary outcome (~0.9% base) |
      | visit / spend | visit / spend | secondary outcomes |
      | `log_history` | history | numeric feature + CUPED covariate |
      | recency, mens, womens, newbie | same | numeric/binary features |
      | channel, zip_code | same | categorical features |

      **Business summary:** The dataset is the canonical Hillstrom email
      benchmark: 64,000 customers from a 2008 randomized campaign,
      fetched checksum-pinned so any drift in the upstream snapshot
      fails loudly. The primary read uses the two clearest arms — the
      Mens E-Mail treatment versus the no-email control, 42,613
      customers — keeping every estimate unambiguous. The full three-arm
      frame is prepared alongside and powers the multi-arm read: per-arm
      uplift scores against the shared control and a per-customer
      channel-choice policy, presented as a secondary, model-estimated
      capability. Because this is
      the dataset every uplift paper benchmarks against, the results are
      directly comparable to the literature, and a client can replicate
      every number on their own randomized holdout with the same code.
  - id: eda
    text_md: |
      Randomization holds: the three arms are near-identical on pre-period
      spend (~$242 mean history in each arm), so outcome contrasts attribute
      to the campaign, not to assignment bias — visible arm-by-arm in
      `eda_segment_profile`. The outcomes tell the classic Hillstrom story:
      the emails move **visits** strongly (10.6% control vs 15.1% Womens /
      18.3% Mens) but **conversion** only in the Mens arm (0.57% vs 0.88% /
      1.25%) on a ~0.9% base rate — a rare event that dominates every
      downstream design choice.

      | segment | n | visit rate | conversion rate | mean prior spend |
      |---|---|---|---|---|
      | Mens E-Mail | 21,307 | 0.183 | 0.0125 | ~$243 |
      | Womens E-Mail | 21,387 | 0.151 | 0.0088 | ~$243 |
      | No E-Mail | 21,306 | 0.106 | 0.0057 | ~$241 |

      **Business summary:** Randomization holds: the arms are
      near-identical on pre-period spend (~$242 mean in each arm), so
      outcome contrasts attribute to the campaign rather than to
      assignment bias — and that balance is verified, not assumed. The
      outcome pattern is the classic one for this benchmark: emails move
      visits strongly (10.6% control vs 18.3% Mens) but conversions only
      in the Mens arm (0.57% vs 1.25%) on a base rate of roughly 1%.
      That rarity is what makes the money question — who converts
      because of us? — statistically hard, and it is exactly why the
      variance-reduction and power machinery comes next.
    figures: [eda_segment_profile]
  - id: training
    text_md: |
      Three targeting policies are fit on the two-arm frame, all hand-rolled
      on sklearn (no causallib/causalml — `DESIGN.md` records the trade-off):

      ```mermaid
      flowchart LR
          A[pre-treatment features] --> R[response model]
          A --> T[T-learner]
          T --> X[X-learner]
          R --> O[out-of-fold scores]
          X --> O
          T --> O
      ```

      The response model is a classifier fit on the treated arm only;
      the T-learner fits mu1 and mu0 separately and scores mu1 − mu0;
      the X-learner imputes per-arm effects D1, D0 before the
      propensity-weighted combination below.

      Base learners are HistGradientBoosting inside a one-hot
      ColumnTransformer; the X-learner combines its two effect regressors as
      g(x)·tau0 + (1−g(x))·tau1 with a regularized logistic propensity
      clipped to [0.05, 0.95]. Every score is **out-of-fold** from 5-fold
      cross-fitting: the evaluation read never sees a prediction from a model
      that saw the row, so policy comparisons are not confounded by
      overfitting — the standard mistake that makes in-sample Qini curves
      look informative when they are not.

      **Business summary:** Three targeting policies are fit entirely
      on standard, hand-written code — no black-box causal libraries —
      so every step is auditable line by line. Each policy scores the
      extra conversions a campaign causes per customer, and every score
      is out-of-fold: produced by a model that never saw the customer it
      scores, so policy comparisons cannot be flattered by
      overfitting. Nothing in the targeting policy is a black box a
      client cannot interrogate, which matters because these lists
      drive real send decisions.
  - id: evaluation
    text_md: |
      All 42,613 customers scored out-of-fold; three policies plus the
      random, treat-everyone, and no-campaign baselines, judged two ways.

      - **Qini curve / coefficient.** Sorted by score, the
        curve plots incremental conversions at each targeted fraction f. The
        coefficient — the area between the policy curve and the random line —
        is the uplift analogue of AUROC, in conversion units.
      - **Profit frontier.** profit(f) = inc(f)·$114 −
        mailed(f)·$0.01, with $114 = `revenue_per_conversion` (mean spend
        among converters; no COGS in the snapshot, so profit = revenue −
        send cost). The recommendation is the argmax at the 25% budget —
        chosen on money, with the Qini curve as the diagnostic.
      - **Paired uncertainty.** Every number carries a 95% CI from a paired
        row bootstrap (n=1000, seeded) of out-of-fold scores: one shared
        row-resample per replication, so differences are paired on identical
        resamples. Rankings are stated on the difference CI — spanning zero
        means not established.
      - **Cost sensitivity.** The profit-maximizing
        fraction is recomputed across a sweep of `cost_per_email` vs
        mail-everyone profit, plus the analytic break-even send cost —
        the answer to "at what cost does targeting beat mailing everyone?",
        plotted in `cost_sensitivity`.
      - **Baselines and deciles (`uplift_by_decile`).** Random and
        treat-everyone sit on the random line by construction (Qini 0) —
        their profit curves are the bar any model must clear; the decile
        figure cross-checks predicted ordering against the empirical arm
        contrast slice by slice.

      **Business summary:** Policies are judged two ways: the Qini
      curve — incremental conversions at each targeted fraction, the
      uplift analogue of a ranking quality score — and the profit
      frontier, which prices each targeting level under the campaign
      cost model ($114 revenue per conversion, $0.01 per email). The
      recommendation comes from the profit frontier at the 25% budget,
      with the Qini curve as the diagnostic, and every number carries a
      95% confidence interval from a paired bootstrap. A
      cost-sensitivity sweep answers the practical question — at what
      send cost does targeting beat mailing everyone? So the evaluation
      answers who do I mail and what is it worth in conversions and
      dollars, not abstract scores.
    figures: [uplift_by_decile, cost_sensitivity]
  - id: results
    text_md: |
      Treated 1.253% vs control 0.573% → ATE **+0.68pp**, SE 0.09pp — real,
      small, exactly the regime where targeting discipline pays. CUPED
      (`cuped_variance`, log prior-year spend covariate) leaves the ATE
      unchanged but removes only
      **0.08% of conversion variance** (0.52% on visit) — prior spend barely
      predicts a ~1% event: CUPED is as good as its covariate.
      Power: **3,063 customers/arm** at alpha 0.05 / power 0.8 vs 21,306
      available — decisive; it plans the next campaign.

      Policy ladder (out-of-fold, `revenue_per_conversion` $114,
      $0.01/email; 95% CIs from a paired row bootstrap, n=1000, seeded; Δ
      columns vs random at the same 25% budget — Qini in conversions,
      profit in dollars; bold row = recommended policy):

      | policy | Qini [95% CI] | profit @ 25% budget [95% CI] | Δ Qini vs random | Δ profit vs random |
      |---|---|---|---|---|
      | response model | 13.01 [1.83, 24.36] | $4,881 [$2,246, $7,386] | +13.01 | +$856 |
      | **T-learner ← best** | **12.03 [0.77, 24.39]** | **$6,838 [$4,430, $9,370]** | **+12.03** | **+$2,812** |
      | X-learner | 5.90 [−5.45, 17.48] | $4,564 [$2,150, $7,306] | +5.90 | +$539 |
      | random | 0.0 | $4,026 | — | — |
      | treat-everyone | 0.0 | — (full-mail $16,103) | — | — |

      Findings (`qini_curves`, `profit_frontier`):

      - **At $0.01/email, mail-everyone is the profit maximum ($16,103).**
        The uplift model's value is **concentration**: the top-25% T-learner
        delivers ~61 of ~145 incremental conversions (≈42%) from a quarter
        of the list, beating random at equal budget +$2,812 (+69%).
      - **Cost sensitivity:** profit-max drops below full-mail by
        ≈$0.20/email; above ≈$0.30/email (analytic break-even c\* ≈ $0.2999)
        top-25% beats mail-everyone — at $0.50: $1,618 vs −$4,777.
      - **Ranking verdict:** the paired Qini-difference CI (response − T) is
        [−8.18, 9.52] and **spans zero — the curve-area ranking is NOT
        established**; the paired profit-difference CI is [−$3,617, −$48],
        entirely below zero — **T-learner's profit advantage IS
        established**. Single-policy CIs overlap; trust the paired
        difference.
      - The response model posts the highest Qini area but the lowest budget
        profit — policy is chosen on the money.
      - The X-learner trails: near-constant propensity and strong overlap
        leave its second stage only variance to recover — regime-specific,
        not general.

      Multi-arm read (`qini_per_arm`, `profit_frontier_multi_arm`,
      `recommended_arm_distribution`) — the new channel-choice capability,
      secondary to the committed two-arm comparison. Each arm is scored
      against the shared control with a cross-fitted T-learner, and a
      best-arm policy recommends argmax(uplift_mens, uplift_womens, 0) per
      customer (no send on ties or non-positive scores: Mens 76.0% /
      Womens 20.2% / none 3.8%). Policy-level numbers are MODEL-ESTIMATED —
      summed predicted uplift, planning values that rank policies rather
      than forecast dollars (predicted magnitudes run ~2× hot); only the
      per-arm Qini contrasts are empirical. Per-arm Qini: Mens 12.03
      (identical to the committed binary T-learner by construction),
      Womens 3.37 [−6.78, 13.75] — spans zero, not established, consistent
      with the weak Womens conversion lift in EDA. Best-arm profit at the
      25% budget: $35.5k [35.1k, 36.0k] model-estimated vs $29.5k
      single-arm and $16.6k random (paired differences exclude zero);
      mail-everyone-mens still leads on raw profit ($49.8k) until sends
      cost ≈$0.31/email — the same fatigue threshold as the two-arm read.

      **Business summary:** The campaign effect is real but small — +0.68
      percentage points on conversion with a standard error of 0.09 —
      exactly the regime where targeting discipline pays. The honest
      headline on ranking: the curve-quality ranking between models is
      not established (its confidence interval spans zero), but the
      profit ranking is — the T-learner's targeting beats random mailing
      by +$2,812 at the 25% budget, a paired difference entirely below
      zero. And the decision pivots on send cost: at $0.01 per email,
      mailing everyone remains the profit maximum ($16,103) because
      extra sends are nearly free, while above roughly $0.30 per email
      the top-25% targeting list overtakes it. So the deliverable is a
      defensible targeting list with dollar figures, honest uncertainty
      ranges, and the machinery to re-derive all of it on the client's
      own randomized campaign. The multi-arm extension adds the
      channel-choice question — which email, per customer — with the same
      honesty: its profit figures are model-estimated planning numbers,
      anchored on the per-arm randomized contrasts, and the per-customer
      recommendation (Mens for 76% of the list, Womens for 20%, no send
      for 4%) is the deliverable a campaign owner can act on directly.
    figures:
      [qini_curves, profit_frontier, cuped_variance, qini_per_arm,
       profit_frontier_multi_arm, recommended_arm_distribution]
    metrics_keys: [response, t_learner, x_learner, random, treat-everyone]
  - id: conclusions
    text_md: |
      The full stack — randomization checks, CUPED, power analysis, uplift
      meta-learners, Qini, profit frontier — composes into one operating
      decision:

      - **Effect before model:** +0.68pp with SE 0.09pp comes from the
        design, not any learner; a model cannot rescue an underpowered
        read.
      - **Covariates are the CUPED story:** 0.08% vs 0.52% is not a
        formula failure — it measures the covariate's signal; measure it,
        don't assume the textbook number.
      - **Out-of-fold or it didn't happen:** cross-fitted scores keep the
        Qini read unbiased; in-sample uplift curves are decoration.
      - **Choose policies on the money:** Qini explains, profit decides —
        the response model's curve area would mislead a budget owner, and
        its paired CI spans zero, so only the profit ranking is claimed.
      - **Predicting is not changing:** response ranking targets sure
        things; uplift ranking targets persuadables. At a 1% base rate
        the difference is noise management.
      - **Channel choice is a model-estimated extension:** the multi-arm
        read composes the same per-arm learners into a best-arm policy,
        but with no randomized assignment realizing the recommended mix,
        its money figures are planning numbers — the per-arm randomized
        contrasts (Mens established, Womens not) are the causal anchor.
      - **No live demo, by design this wave:** an interactive
        uplift-simulator demo was removed as a half-wired orphan; the
        evidence stands on the randomized experiment read above and the
        static `qini_curves` figure, and a properly wired demo may land in
        a future wave.

      **Results quality: acceptable with caveats.** The ATE is precise
      (SE 0.09pp) and the profit ranking is established by paired CIs; the
      Qini ranking is not, and everything rests on one 2008 snapshot — a
      practitioner re-runs the stack on their own randomized holdout and
      picks the policy on profit CIs, not curve area.

      **Business summary:** Hand this framework a client's randomized
      campaign extract and it returns a targeting policy, its expected
      dollar delta, and the sample-size math for the next experiment —
      only the cost model and the data source change. The caveats travel
      with it: the effect must be read from the design before any model
      is trusted, out-of-fold scoring is non-negotiable, and only the
      profit ranking — not the curve-quality ranking — is claimed as
      established. Choosing policies on the money, with paired
      confidence intervals, is the habit that transfers. Full rationale
      lives in `DESIGN.md`, reproduction in `README.md`, model disclosure
      in `MODEL_CARD.md`, the rendered
      run in `reports/report.html`, and the machine-readable numbers in
      `reports/metrics.json`.
