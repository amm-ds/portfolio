project_id: 10-uplift-experimentation
short_version: >-
  On 64,000-customer randomized email data, uplift targeting beat random
  targeting by +$2,812 (+69%) at a 25% send budget, CI [+$718, +$4,767]; at
  $0.01 per email, mailing everyone still wins. Targeting pays when sending
  is costly. Data: Hillstrom MineThatData, March 2008.
figure_captions:
  eda_segment_profile: >-
    Arm sizes, outcomes, and pre-period spend across Mens (21,307), Womens
    (21,387), and control (21,306). Mean prior spend is about $242 per arm;
    emails lift visits in both arms, but conversion rises materially only for
    Mens (0.57% control to 1.25%).
  uplift_by_decile: >-
    Predicted versus empirical treated−control conversion uplift by T-learner
    decile. Ordering is broadly useful but non-monotone, and predicted
    magnitudes run about 2× hot, so treat the ranking as coarse.
  cost_sensitivity: >-
    Best targeting-fraction profit versus mail-everyone as send cost sweeps
    $0.01–$0.50. Mail-everyone wins on raw profit at $0.01; top-25% overtakes
    above the ≈$0.30 break-even and reaches $1,618 versus −$4,777 at $0.50.
  qini_curves: >-
    Incremental conversions by targeted fraction with 95% paired-bootstrap
    bands. Response-minus-T Qini difference CI [−8.18, 9.52] spans zero; the
    separate T-versus-random profit-at-budget CI [+$718, +$4,767] is positive.
  profit_frontier: >-
    Incremental profit by mailed share at $114 revenue per conversion and
    $0.01 per email. Unconstrained mail-everyone maximizes raw profit at
    $16,103; within a 25% budget, T-learner beats random by +$2,812 (+69%).
  cuped_variance: >-
    CUPED with log prior-year spend leaves ATE unchanged and removes only
    0.08% of conversion variance versus 0.52% for visit. Adding recency gives
    0.12% / 0.95%; the covariate has little signal for the rare conversion.
  qini_per_arm: >-
    Empirical per-arm Qini curves on randomized arm-versus-control pairs. Mens
    Qini is 12.03 with CI [−0.47, 24.21] spanning zero; Womens is 3.37
    [−6.78, 13.75], also not established.
  profit_frontier_multi_arm: >-
    Model-estimated multi-arm profit frontier, not realized counterfactuals.
    At 25% budget, best-arm estimates $35.5k versus $29.5k single-arm Mens and
    $16.6k random; unconstrained mail-everyone-Mens leads raw profit at $49.8k
    until sends cost ≈$0.31.
  recommended_arm_distribution: >-
    Per-customer argmax over Mens uplift, Womens uplift, and no send: Mens
    76.0%, Womens 20.2%, none 3.8%. This is a model-based channel-choice list,
    not a second broadcast or a validated arm-assignment policy.
sections:
  - id: background
    text_md: |
      **Who buys because of the email — not who buys anyway.** On 64,000
      customers randomized into email arms, ranking by measured lift beat
      random targeting by +$2,812 (+69%) profit at a 25% send budget, CI
      (95% confidence interval) [+$718, +$4,767]. At $0.01 per email,
      mailing everyone still earned the most ($16,103) — the edge appears
      only under a budget or a higher send cost. Data: the real Hillstrom
      MineThatData campaign, March 2008, checksum-pinned.

      ```mermaid
      flowchart LR
          C{"send cost and budget"} -->|"cheap, no cap"| E["mail everyone: $16,103"]
          C -->|"capped or costly"| T["rank by uplift: +69% at 25%"]
          E --> V["profit at the stated cost"]
          T --> V
          V --> R["revalidate on a fresh<br/>holdout per campaign"]
      ```

      Read the targeting-decision diagram as a route map: cheap, uncapped
      sends go to everyone; capped or costly sends rank by uplift; every
      new campaign revalidates on a fresh holdout first.

      Is the +69% edge real? The next section sets the judging rules.

      **Business summary:** On one real 2008 campaign, targeting the top
      quarter by measured lift beat random mailing by 69% at that budget;
      at a penny per email, mailing everyone still paid more.
    figures: []
  - id: objectives
    text_md: |
      **The question: does ranking customers by modeled uplift beat simpler
      policies at a 25% send budget — and where does the edge disappear?**
      Customers were placed in arms by chance, so the email effect is
      measurable with no modeling at all; models only reorder customers
      within it.

      The checklist, with the rejected shortcut behind each step:

      - Check the randomization first: if the arms differed before the
        campaign, nothing downstream is believable. Estimate the plain
        campaign effect before any model exists.
      - Put a paired-bootstrap confidence interval on every policy gap,
        reusing the same resampled customers for every policy. Unpaired
        intervals are easier but cannot rank policies honestly.
      - Test whether a noise-reduction tweak (CUPED) sharpens the read.
        Variance tricks are cheap, so the only question is whether they
        move the estimate or just the standard error.
      - Rank customers three ways — response, T-learner, X-learner — and
        judge each list on profit against random and mail-everyone.
        Ranking metrics like Qini are reported, but profit at the stated
        budget is the verdict. That is the decision the business
        actually faces.
      - Stress-test the verdict against send cost: $0.01 per email is one
        channel's price in 2008, not a law of nature.

      The measurement contract diagram fixes how policies are judged.

      ```mermaid
      flowchart LR
          subgraph ANCHOR["anchor: randomized assignment"]
              A["Mens / Womens / control<br/>21,307 / 21,387 / 21,306"]
          end
          subgraph SCORES["scores - out of fold only"]
              direction LR
              S1["response model"] --- S2["T-learner"] --- S3["X-learner"]
          end
          subgraph JUDGE["judging"]
              P["profit = conversions x $114<br/>- sends x cost"] --> B["1,000 paired bootstraps,<br/>same resample every policy"]
          end
          ANCHOR --> SCORES --> JUDGE
          JUDGE --> V["verdict at $0.01-$0.50 per email"]
      ```

      Read the measurement contract diagram as a pipeline. The randomized
      anchor feeds three scorers, all fit out of fold so no model grades
      its own homework. The judging box turns scores into profit and
      attaches 1,000 paired bootstraps. The verdict node states the
      send-cost range the conclusion covers.

      What data carries this contract? The next section walks the
      snapshot.

      **Business summary:** The goal was a fair policy race: check the
      assignment, rank customers three ways, and judge each list on profit,
      cost, and an honest interval.
    figures: []
  - id: data
    text_md: |
      **Randomized assignment is why the numbers mean what they say.** The
      checksum-pinned March 2008 snapshot holds 64,000 customers with
      recency, prior-year spend, merchandise flags, and channel, plus visit,
      conversion, and spend outcomes. Upstream drift fails the sha256 gate.
      Provenance: [data-registry/hillstrom](https://amm-ds.github.io/portfolio/data-registry/hillstrom/).

      The build is one pinned snapshot, then two analysis frames. The
      primary read keeps the Mens and no-email arms (42,613) so the
      comparison stays unambiguous — one email, one holdout. The full
      three-arm frame supports per-arm reads and channel planning, where
      both emails are judged separately. Column roles are fixed at load:
      segment becomes the treatment indicator, conversion is the primary
      outcome with visit and spend alongside, and only pre-treatment
      columns — log spend history, recency, merchandise flags, channel,
      zip — may touch the models. That last rule is leakage control:
      anything recorded after the send would let a model cheat.

      ```mermaid
      flowchart LR
          subgraph RAW["pinned snapshot"]
              H["64,000 customers<br/>sha256-gated"]
          end
          subgraph FRAMES["analysis frames"]
              direction LR
              T["two-arm read<br/>Mens + control, 42,613"] --- F["three-arm frame<br/>per-arm reads"]
          end
          subgraph MAP["column roles"]
              direction LR
              M["treatment, conversion<br/>visit, spend"] --- X["log_history, recency<br/>mens, womens, newbie, channel, zip"]
          end
          RAW --> T
          RAW --> F
          T --> MAP
          F --> MAP
      ```

      The lineage diagram shows how the snapshot becomes analysis frames.
      Read it left to right: the pinned snapshot feeds both frames, and
      each frame declares its columns. When a later section quotes a
      number, the frame it came from matters — two-arm for the headline
      policy race, three-arm for per-arm reads.

      Do the arms actually look equal before the campaign? The next
      section checks.

      **Business summary:** One pinned 2008 snapshot of 64,000 customers,
      checksum-checked, with a two-arm main read and a three-arm frame for
      side questions.
    figures: []
  - id: eda
    text_md: |
      **Check the randomization first, then trust small differences only
      with wide intervals.** The three arms look alike before the
      campaign: about 21,300 customers and about $242 mean prior spend in
      each. Prior spend is the strongest baseline available, so a broken
      randomization would show there first — it does not; the design did
      its job. The segment-profile figure carries the check: read the
      pre-period panel first, where the bars should be near-identical,
      then the outcome panels, which are anything but.

      Both emails lifted store visits: 18.3% Mens and 15.1% Womens,
      against 10.6% with none. Purchases moved less: 1.25% Mens, 0.88%
      Womens, 0.57% control — only the Mens email clearly converts, a
      gap of 0.68 percentage points on a 0.57% base. Purchases are rare,
      near 0.9% baseline, so small gaps need honest intervals before
      anyone acts on them.

      The two emails are read separately, never pooled. Pooling would
      double the sample and narrow every interval, but it would average
      a converting email with a non-converting one and could call both
      a win or both a loss. Two clean reads beat one precise smear.

      With the anchor verified, the modeling question opens: who exactly
      should get the email? The next section builds the three rankings.

      **Business summary:** The randomization held — the groups started
      equal — and the first honest read is: the Mens email moved visits
      and purchases, the Womens email visits only.
    figures: [eda_segment_profile]
  - id: training
    text_md: |
      **Every score below was computed out of fold.** Five-fold
      cross-fitting means the model scoring a customer never saw that
      customer, so a ranking cannot grade its own homework.

      Three ways to rank. A response model scores who is likely to buy, so
      it chases "sure things" who would buy anyway. Uplift models target the
      added purchase instead: the T-learner fits one model per arm and
      scores treated-minus-control; the X-learner imputes each arm's
      effect, combined propensity-weighted. Base learners: gradient
      boosting on pre-treatment features only.

      The anchor read is solid: Mens conversion 1.25% vs 0.57% control, an
      average treatment effect of +0.68 percentage points (SE 0.09); power
      is ample (sizing in conclusions). The CUPED adjustment
      (pre-campaign spend soaking up noise) leaves the effect unchanged and
      cuts only 0.08% of conversion variance, 0.52% for visits; the CUPED
      variance figure shows the tiny gains — adding recency gives 0.12% /
      0.95%.

      Policy verdicts, each with 1,000 paired bootstraps on the same
      resampled customers:

      - The Qini curve (area between the ranking curve and random) says how
        well a list sorts buyers. At a 25% budget the T-learner earns
        $6,838 [$4,430, $9,370] vs $4,026 random: **+$2,812 (+69%), CI
        [+$718, +$4,767], entirely positive** — about 61 of ~145 incremental
        conversions (42%) at a quarter of the sends. Its Qini 12.03 [0.77,
        24.39] trails the response model's 13.01 [1.83, 24.36], but the gap
        CI [−8.18, 9.52] spans zero — that ranking is not established.
      - Budget efficiency is not the profit maximum: at $0.01 per email
        mail-everyone earns $16,103, and T-minus-full-mail is −$9,265
        [−$13,125, −$5,808]. The verdict flips with cost: the best share
        drops below "everyone" near $0.20; above ≈$0.30 the T-list wins
        outright ($1,618 vs −$4,777 at $0.50).
      - Per-arm reads are humbler. The multi-arm profit-frontier figure and
        the recommended-arm distribution figure carry them: Mens Qini 12.03
        [−0.47, 24.21] and Womens 3.37 [−6.78, 13.75] both span zero;
        best-channel planning favors Mens for 76.0% of customers (Womens
        20.2%, none 3.8%), estimating $35.5k at the 25% budget vs $16.6k
        random — model-estimated money, deciles about 2× hot.
        Mail-everyone-Mens still leads unconstrained profit at $49.8k until
        sends cost ≈$0.31.

      **Business summary:** The T-learner list wins at a 25% budget —
      +$2,812 (+69%) over random — mail-everyone wins at penny sends, and
      the CUPED and per-arm reads came back mostly empty.
    figures: [cuped_variance, profit_frontier_multi_arm, recommended_arm_distribution]
  - id: evaluation
    text_md: |
      **Use targeted sends only when sends are budgeted or costly; otherwise
      mail everyone.** The budgeted gap rests on random assignment, so it
      is credible: its interval is entirely positive. What stays open: the
      Qini ranking across models, and either per-arm Qini. The decision
      rests on profit at the stated budget and cost, and this section is
      where both get stress-tested.

      Treat the ranking as coarse. The decile figure compares predicted
      and real uplift across ten equal groups: read the leftmost decile
      first — that is who a targeted send reaches at a small budget —
      then scan right for monotone decline. The order is broadly useful
      but non-monotone, and predicted sizes run about 2× hot: good
      enough to sort a mailing list, not to promise any one customer an
      effect.

      The cost-sensitivity figure carries the stress test, sweeping the
      send cost from $0.01 to $0.50. Mail-everyone wins raw profit at
      $0.01; the best targeting share drops below everyone near $0.20;
      above ≈$0.30 the top-25% list wins outright — $1,618 versus
      −$4,777 at $0.50. The sweep matters because $0.01 is one
      channel's price in 2008, and margins only get thinner once
      fatigue and COGS count.

      Which claims survive the stress test? The next section separates
      the established from the unproven.

      **Business summary:** The deployable claim is budgeted efficiency:
      +69% versus random at a 25% budget, CI [+$718, +$4,767]. At $0.01 per
      email, mail everyone.
    figures: [uplift_by_decile, cost_sensitivity]
  - id: results
    text_md: |
      **Established: the small Mens effect and the budgeted T-learner win
      over random. Not established: the response-versus-T Qini ranking and
      either per-arm Qini.** The Qini curves figure carries the ranking.
      Read it as a race down the mailing list: the horizontal axis is the
      targeted fraction, the vertical axis is incremental conversions
      captured so far, each curve is one ranking, and the random diagonal
      is the floor. A good curve bows up and away from the diagonal; the
      area between them is the Qini coefficient. The 95% paired-bootstrap
      bands are the honest part — look for whether they separate the
      curves. They do not: response-minus-T is [−8.18, 9.52], spanning
      zero.

      The profit-frontier figure carries the money: at $114 per
      conversion and $0.01 per email, mail-everyone tops raw profit at
      $16,103, since sends are nearly free; at the 25% budget the
      T-learner curve beats random by +$2,812 (+69%), CI [+$718,
      +$4,767]. The per-arm Qini figure shows both arm curves — Mens
      12.03 [−0.47, 24.21], Womens 3.37 [−6.78, 13.75] — and both span
      zero.

      Not shown here: "profit" is revenue minus send cost — no
      COGS, no margin, no fatigue from repeat contact. One March 2008
      campaign cannot speak for the next one. All multi-arm money is
      model-estimated, not a randomized outcome. The X-learner trails
      here, but only in this strong-overlap, near-constant-propensity
      regime — a statement about this dataset, not the method.

      The exact records behind these numbers — every interval, the
      power read, the cost grid — live in the conclusions.

      **Business summary:** The solid findings are the Mens effect and the
      +69% budgeted win over random; model rankings, per-arm effects, and
      all multi-arm money stay unproven or model-estimated.
    figures:
      [qini_curves, profit_frontier, qini_per_arm]
    metrics_keys: [response, t_learner, x_learner, random, treat-everyone]
  - id: conclusions
    text_md: |
      ## Results summary

      On 64,000 randomized customers from one real 2008 campaign, ranking by
      modeled uplift beat random targeting by +$2,812 (+69%) profit at a 25%
      send budget, with 95% CI [+$718, +$4,767] lying entirely above zero.
      That edge survived honest evaluation: scores were computed out of
      fold, and paired bootstraps put the whole interval above random. The
      Mens email's small effect (+0.68 percentage points on a 0.57% base)
      held up too. What did not: the response-versus-T-learner ranking (Qini
      gap CI [−8.18, 9.52] spans zero), both per-arm Qini reads, and the
      X-learner. And at $0.01 per email, mailing everyone still earned the
      most ($16,103); the targeting edge appears only under a budget or
      above roughly $0.30 per send. The evidence supports ranking by
      measured lift when sends are budgeted or costly, revalidated on a
      fresh holdout for each new campaign.

      ## Key concepts

      - **Uplift vs response modeling** — a response model chases sure
        things who would buy anyway; uplift scores the added purchase the
        email causes.
      - **T-learner and X-learner** — one model per arm scored
        treated-minus-control (T), or imputed effects combined
        propensity-weighted (X).
      - **Paired bootstrap policy intervals** — the same resampled customers
        score every policy, so profit gaps get honest, comparable confidence
        intervals.
      - **Qini coefficient** — the area between a ranking curve and random
        targeting, measuring how well a list sorts buyers.
      - **CUPED** — adjusting on pre-campaign spend to soak up noise; here
        it left the estimate unchanged and cut almost no conversion
        variance.
      - **Cost-sweep break-even** — the send cost (≈$0.30) above which
        targeted sending beats mailing everyone.

      ## Exact numbers

      Seed 42 (global split + cross-fitting); policy intervals come from
      1,000 paired row bootstraps of out-of-fold scores — seed 1041
      (two-arm), seed 2041 (multi-arm). Profit = incremental conversions ×
      $114 − mailed × send cost.

      | policy | Qini [95% CI] | profit @25% [95% CI] | Δ vs random |
      |---|---|---|---|
      | response | 13.01 [1.83, 24.36] | $4,881 [$2,246, $7,386] | +$856 |
      | **T-learner** | **12.03 [0.77, 24.39]** | **$6,838 [$4,430, $9,370]** | **+$2,812** |
      | X-learner | 5.90 [−5.45, 17.48] | $4,564 [$2,150, $7,306] | +$539 |
      | random | 0.0 | $4,026 | — |
      | treat-everyone | 0.0 | full-mail $16,103 | — |

      Paired differences (the same resample across policies):

      | comparison | 95% CI | spans zero? |
      |---|---|---|
      | response − T-learner, Qini | [−8.18, 9.52] | yes — ranking not established |
      | response − T-learner, profit @25% | [−$3,617, −$48] | no — favors T |
      | T-learner − X-learner, profit @25% | [−$323, $4,343] | yes |
      | T-learner − random, profit @25% | [+$718, +$4,767] | no — favors T |
      | T-learner − mail-everyone, profit | [−$13,125, −$5,808] | no — favors full mail |

      Cost sweep (profit-maximizing share / best profit, mail-everyone in
      brackets): $0.01 → 100% / $16,103 [$16,103]; $0.10 → 100% / $12,268
      [$12,268]; $0.20 → 90% / $8,065 [$8,007]; $0.30 → 90% / $4,230
      [$3,745]; $0.50 → 25% / $1,618 [−$4,777]. Analytic break-even ≈$0.30
      per email. The top-25% list captures about 61 of 145 incremental
      conversions (42%) with a quarter of the sends.

      Experiment tables:

      | segment | n | visit rate | conversion rate | mean prior spend |
      |---|---|---|---|---|
      | Mens E-Mail | 21,307 | 0.183 | 0.0125 | ~$243 |
      | Womens E-Mail | 21,387 | 0.151 | 0.0088 | ~$243 |
      | No E-Mail | 21,306 | 0.106 | 0.0057 | ~$241 |

      ATE +0.68 percentage points (SE 0.09). Power: 3,063 customers per arm
      needed at 5% significance and 80% power; 21,306 available. CUPED with
      log prior-year spend: conversion variance −0.08%, visit −0.52%, ATE
      unchanged; adding recency gives −0.12% / −0.95%.

      Per-arm reads (randomized arm-vs-control pairs): Mens Qini 12.03
      [−0.47, 24.21], incremental conversions at full send 145.0 [107.97,
      181.88]; Womens Qini 3.37 [−6.78, 13.75], incremental 66.5 [33.10,
      104.69]. Multi-arm reads are model-estimated: best-arm $35,514 [35.1k,
      36.0k] at the 25% budget versus single-arm-Mens $29,487 and random
      $16,563; recommended shares Mens 76.0% / Womens 20.2% / none 3.8%;
      unconstrained mail-everyone-Mens leads at $49,819 until sends cost
      ≈$0.31. Predicted deciles run about 2× hot against empirical uplift.

      Cost model: $114 revenue per conversion (mean spend among converters —
      not margin), $0.01 send cost, 25% policy budget, ~0.9% base
      conversion.

      Column roles: treatment ← segment (Mens = 1, control = 0); conversion
      ← conversion (primary outcome); visit and spend ← same; `log_history`
      ← history (feature + CUPED covariate); recency, mens, womens, newbie ←
      same; channel and zip_code ← same.

      ## Protocol

      - Anchor: randomized assignment on the pinned March 2008 snapshot;
        the primary read keeps Mens + control (42,613) so the contrast is
        unambiguous; the three-arm frame supports per-arm reads.
      - Scores: five-fold cross-fitting — every customer is scored by a
        model that never saw them; gradient boosting on pre-treatment
        features only.
      - Metrics: Qini is the area between the ranking curve and random
        targeting; profit is incremental conversions × $114 minus mailed ×
        send cost; paired differences reuse the same 1,000 row bootstraps.
      - Power: two-proportion test at 5% significance and 80% power.
      - CUPED: variance reduction with log prior-year spend, recency added
        in the multivariate arm.

      ## Limits

      - "Profit" is revenue minus send cost — no COGS, no margin, no
        contact fatigue.
      - One campaign (March 2008) cannot guarantee future results; the next
        spend needs a fresh randomized holdout.
      - Per-arm Qini intervals span zero; the response-versus-T ranking is
        unsettled; multi-arm money is model-estimated and predicted
        magnitudes run about 2× hot.
      - The X-learner's weak result is regime-specific (strong overlap,
        near-constant propensity), not a general ranking of learners.
      - Prospective validation, measured margin and fatigue costs,
        randomized multi-arm evaluation, and stronger CUPED covariates are
        all blocked by the snapshot — they need a new live campaign,
        per-order margin, contact-fatigue data, randomized arm assignment,
        and richer pre-treatment covariates the 2008 file does not carry.

      ## Revision notes

      **Committed run (seed 42):** the two-arm ladder — response, T-learner,
      X-learner, random, treat-everyone — was scored once out-of-fold on the
      pinned snapshot; policy intervals come from 1,000 paired bootstraps
      (seed 1041) and the cost sweep from the committed grid.

      **Multi-arm layer (added later):** per-arm Qini reads on the
      randomized arm-vs-control pairs (empirical), plus a model-estimated
      channel-planning read — best-arm profit, recommended shares, and the
      ≈$0.31 break-even — carried with an explicit "model-estimated, not
      realized counterfactuals" label (bootstrap seed 2041).

      ## Reproduce

      ```bash
      uv run python -m uplift_experimentation.cli all   # minutes, end-to-end
      uv run dvc repro                                  # the same, staged
      ```

      ```mermaid
      flowchart LR
          S{"next send decision"} -->|"costly or budgeted"| T["rank by T-learner<br/>+69% vs random"]
          S -->|"sends at $0.01"| E["mail everyone<br/>$16,103 profit"]
          T --> V["revalidate each campaign"]
          E --> V
          V --> R["evidence upgrade:<br/>fresh randomized holdout"]
      ```

      **Business summary:** Rank by measured lift only when sends are
      budgeted or costly: +$2,812 (+69%) over random at a 25% budget, CI
      [+$718, +$4,767]. At $0.01 per email, mail everyone — $16,103.
    figures: []
roadmap:
  - status: delivered
    text: "Built the Hillstrom stack: RCT validation, power/CUPED checks, T/X-learners, paired-bootstrap policy CIs, cost sweep."
