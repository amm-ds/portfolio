project_id: 10-uplift-experimentation
sections:
  - id: background
    text_md: |
      Marketing analytics has a seductive failure mode: build the best
      possible model of who will convert, then market to its top scorers.
      That targets *sure things* — customers who would convert anyway — and
      ignores *persuadables*, the only people a campaign can actually create.
      Worse, at real base rates a response model will happily target customers
      whose purchase probability the campaign *lowers*. The decision is not
      "who will buy?" but "who buys *because of us*?" — a counterfactual
      question that only a randomized design plus an uplift model can answer.

      This project runs the full experimentation stack on the canonical
      Hillstrom email benchmark: a 2008 randomized campaign of 64,000
      customers split across a Mens E-Mail arm, a Womens E-Mail arm, and a
      no-email control. The decision on the table: who gets the next wave,
      and what is that worth in money rather than clicks.

      | cost parameter | value | meaning |
      |---|---|---|
      | revenue per conversion | $114 | measured mean spend among converters — revenue, not margin (COGS not in the snapshot) |
      | cost per email | $0.01 | marginal ESP send cost |
      | policy budget | 25% | share of customers the next wave may target |
      | base conversion rate | ~0.9% | the regime where naive targeting wastes budget |

      **Business implication:** campaign profit is a concentration problem —
      spend the fixed budget on the customers whose incremental conversion
      probability is highest, and the deliverable is a targeting list plus a
      defensible dollar figure, not a leaderboard AUC.
  - id: objectives
    text_md: |
      - Read the randomized experiment honestly: arm sizes, balance on
        pre-period covariates, and the difference-in-means effect with its
        standard error — before any modeling.
      - Reduce variance with CUPED using a strictly pre-treatment covariate
        (prior-year spend), and *measure* how much variance it actually
        removes rather than assuming the textbook win.
      - Size the experiment: required customers per arm for the measured
        effect at alpha 0.05 and power 0.8, against the customers actually
        available.
      - Compare three targeting policies on out-of-fold scores — the
        marketing-practice response model, a T-learner, and an X-learner —
        against the naive baselines (random, treat-everyone, no-campaign) on
        Qini curves and on profit under the campaign cost model.
      - Recommend a budget-constrained targeting policy with an expected
        incremental-profit delta vs random, and state the honest limits of
        predicting conversions at a 1% base rate.

      **Business implication:** every artifact below answers a question a
      campaign owner actually asks: is the effect real, is the sample big
      enough, who do I mail, and what do I get for it.
  - id: data
    text_md: |
      Hillstrom email marketing dataset (Kevin Hillstrom's MineThatData
      challenge, March 2008): 64,000 customers with pre-treatment attributes
      (recency, prior-year spend `history` plus its binning, mens/womens
      merchandise flags, zip code class, newbie flag, channel) and outcomes
      (visit, conversion, spend). Fetched checksum-pinned from the author's
      site through the platform's `io.fetch` — the sha256 gate fails loudly
      if the upstream snapshot drifts (see
      [data-registry/hillstrom](https://github.com/amm-ds/portfolio/tree/main/docs/data-registry/hillstrom.md)).

      The primary read is the two-arm frame — Mens E-Mail (treatment) vs
      No E-Mail (control), 42,613 customers after dropping the Womens E-Mail
      arm, which stays in EDA and could later back a per-customer channel
      choice. A two-arm treatment keeps every estimand unambiguous.

      | project column | Hillstrom source | role |
      |---|---|---|
      | treatment | segment | 1 = Mens E-Mail, 0 = No E-Mail |
      | conversion | conversion | primary outcome (~0.9% base) |
      | visit / spend | visit / spend | secondary outcomes |
      | log_history | history | numeric feature + CUPED covariate |
      | recency, mens, womens, newbie | same | numeric/binary features |
      | channel, zip_code | same | categorical features |

      **Business implication:** the dataset every uplift paper benchmarks
      against — a client can replicate every number here against their own
      randomized holdout using the same code.
  - id: eda
    text_md: |
      Randomization holds: the three arms are near-identical on pre-period
      spend (~$242 mean history in each arm), so outcome contrasts are
      attributable to the campaign, not to assignment bias. The outcomes tell
      the classic Hillstrom story: the emails move **visits** strongly (10.6%
      in control vs 15.1% Womens / 18.3% Mens) but **conversion** only in the
      Mens arm (0.57% control vs 0.88% Womens / 1.25% Mens) on a ~0.9% base
      rate — a rare event that dominates every downstream design choice.

      | segment | n | visit rate | conversion rate | mean prior spend |
      |---|---|---|---|---|
      | Mens E-Mail | 21,307 | 0.183 | 0.0125 | ~$243 |
      | Womens E-Mail | 21,387 | 0.151 | 0.0088 | ~$243 |
      | No E-Mail | 21,306 | 0.106 | 0.0057 | ~$241 |

      **Business implication:** balance is verified, not assumed — and a ~1%
      conversion base rate means the money question ("who converts because of
      us?") is statistically hard, which is exactly why the variance-reduction
      and power machinery comes next.
    figures: [eda_segment_profile]
  - id: training
    text_md: |
      Three targeting policies are fit on the two-arm frame, all hand-rolled
      on sklearn (no causallib/causalml — DESIGN.md records the trade-off):

      ```mermaid
      flowchart LR
          A[pre-treatment features] --> R[response model:<br/>classifier on treated arm only]
          A --> T[T-learner:<br/>mu1, mu0 separately<br/>score = mu1 - mu0]
          T --> X[X-learner:<br/>imputed effects D1, D0<br/>+ propensity-weighted combo]
          R --> O[out-of-fold scores<br/>5-fold cross-fitting]
          X --> O
          T --> O
      ```

      Base learners are HistGradientBoosting inside a one-hot
      ColumnTransformer; the X-learner combines its two effect regressors as
      g(x)·tau0 + (1−g(x))·tau1 with a regularized logistic propensity clipped
      to [0.05, 0.95]. Every score is **out-of-fold** from 5-fold
      cross-fitting: the evaluation read never sees a prediction from a model
      that saw the row, so policy comparisons are not confounded by
      overfitting — the standard mistake that makes in-sample Qini curves look
      informative when they are not.

      **Business implication:** the models are auditable line-by-line; nothing
      in the targeting policy is a black box a client cannot interrogate.
  - id: evaluation
    text_md: |
      Protocol: out-of-fold scores on all 42,613 customers, three policies
      plus three naive baselines (random, treat-everyone, no-campaign), judged
      two ways.

      **Qini curve / coefficient.** Customers are sorted by score; at each
      targeted fraction f the curve plots n_t(f)·[rate_treated(f) −
      rate_control(f)] — incremental conversions — against f. The Qini
      coefficient is the area between the policy curve and the random line:
      the uplift analogue of AUROC, in conversion units.

      **Profit frontier.** Under the campaign cost model,
      profit(f) = inc(f)·$114 − mailed(f)·$0.01 — where $114 is revenue per
      conversion (mean spend among converters; the snapshot exposes no COGS,
      so profit is revenue minus send cost, not true margin). The recommended
      policy is the argmax of profit at the 25% budget — chosen on money,
      with the Qini curve as the diagnostic that explains the choice.

      **Uncertainty is paired.** Every model number carries a 95% CI from a
      paired row bootstrap of the out-of-fold scores (n=1000, seeded): one
      shared row-resample per replication across policies, so model-vs-model
      differences are paired on identical resamples. Qini curves are drawn
      with bootstrap bands; model-ranking statements are made on the CI of
      the difference, not on point estimates — when that interval spans zero
      the ranking is reported as not established.

      **Cost sensitivity.** The profit-maximizing targeting fraction is
      recomputed for a sweep of cost_per_email against the mail-everyone
      profit, plus the analytic break-even send cost at the policy budget —
      the direct answer to "at what cost does targeting beat mailing
      everyone?"

      **Baselines as first-class citizens.** Random and treat-everyone sit on
      the random line by construction (Qini 0); their profit curves are the
      honest bar any model must clear. The decile figure cross-checks that
      predicted ordering tracks the empirical arm contrast slice by slice.

      **Business implication:** the evaluation answers "who do I mail and what
      is it worth" directly — both metrics are denominated in conversions and
      dollars, not abstract scores.
    figures: [qini_curves, uplift_by_decile, profit_frontier, cost_sensitivity]
  - id: results
    text_md: |
      Experiment read (conversion): treated 1.253% vs control 0.573%, ATE
      **+0.68pp**, SE 0.09pp — real, small, exactly the regime where targeting
      discipline pays.

      CUPED (covariate log1p prior-year spend): adjusted ATE +0.00680 vs
      +0.00681 naive — unbiased by construction — but only **0.08% of
      conversion variance removed**: prior spend barely predicts a ~1% event.
      On the visit outcome the same machinery removes **0.52%**. The lesson is
      the point: CUPED is exactly as good as its covariate, so covariate
      selection is a design decision, not a formula to paste.

      Power: for the measured +0.68pp at alpha 0.05 / power 0.8, the analytic
      two-proportion formula requires **3,063 customers per arm**; 21,306 are
      available — the read is decisive, and the formula doubles as a planning
      tool for the next campaign (MDE at this size: ~±0.26pp).

      Policy ladder (out-of-fold, revenue $114/conversion, $0.01/email; 95% CIs
      from a paired row bootstrap of the out-of-fold scores, n=1000):

      | policy | Qini [95% CI] | profit @ 25% budget [95% CI] | delta vs random |
      |---|---|---|---|
      | response model | 13.01 [1.83, 24.36] | $4,881 [$2,246, $7,386] | +$856 |
      | **T-learner** | **12.03 [0.77, 24.39]** | **$6,838 [$4,430, $9,370]** | **+$2,812** |
      | X-learner | 5.90 [−5.45, 17.48] | $4,564 [$2,150, $7,306] | +$539 |
      | random | 0.0 | $4,026 | — |
      | treat-everyone | 0.0 | — (full-mail $16,103) | — |

      Key findings:

      - **Honest headline: at $0.01/email, mail-everyone is the profit maximum
        ($16,103 vs $6,838 for the top-25% policy). The uplift model's value
        is concentration** — the top-25% T-learner policy delivers ~61 of the
        ~145 total incremental conversions (≈42%) while mailing a quarter of
        the list, and vs random at the same budget it earns +$2,812 (+69%):
        ~61 conversions from 10,653 emails vs ~36 at random.
      - **Cost sensitivity:** the profit-maximizing fraction drops below
        full-mail by ≈$0.20/email, and the top-25% policy beats mail-everyone
        on profit above **≈$0.30 per email** (analytic break-even) — the
        fatigue / list-wear regime, where targeting is the difference between
        profit and loss.
      - **Ranking verdict, with the interval:** the response model's Qini area
        is nominally higher, but the 95% CI on the paired Qini difference
        (response − T-learner) is [−8.18, 9.52] and **spans zero — the
        curve-area ranking is not established**. What is established is the
        money: the paired profit-at-budget difference CI is [−$3,617, −$48],
        entirely below zero. Overlapping single-policy CIs understate the
        separation; the paired difference is the honest read.
      - Qini area and budget profit disagree for the response model (highest
        area, lowest budget profit) — the policy is chosen on the money.
      - The X-learner trails here: near-constant propensity and strong overlap
        give its second stage nothing to recover, only variance. Regime-
        specific, not a general verdict.
      - Predicting conversions is not changing them: the decile check shows
        the predicted ordering only roughly tracking empirical uplift at this
        base rate — the same lesson as Project 05's fairness finding on the
        retention side.

      **Business implication:** a defensible targeting list with a dollar
      figure, plus the machinery to re-derive it on the client's own
      randomized holdout.
    figures: [qini_curves, profit_frontier, cost_sensitivity, cuped_variance]
    metrics_keys: [response, t_learner, x_learner, random, treat-everyone]
  - id: conclusions
    text_md: |
      The full stack — randomization checks, honest effect read, CUPED, power
      analysis, uplift meta-learners, Qini, profit frontier — composes into
      one operating decision, and each layer earns its place:

      - **Effect before model:** +0.68pp with SE 0.09pp comes from the design,
        not from any learner; a model cannot rescue an underpowered read (the
        power formula says what effect size is even visible).
      - **Covariates are the CUPED story:** 0.08% vs 0.52% variance reduction
        is not a formula failure — it measures how much signal the covariate
        carries. Measure it; do not assume the textbook number.
      - **Out-of-fold or it didn't happen:** cross-fitted scores keep the
        Qini read honest; in-sample uplift curves are decoration.
      - **Choose policies on the money, state rankings with intervals:** Qini
        explains, profit decides — the response model's curve area would
        mislead a budget owner here. And the Qini ranking itself is stated
        with its paired-bootstrap CI: it spans zero for response vs T-learner,
        so only the profit ranking is claimed.
      - **Predicting is not changing:** response ranking targets sure things;
        uplift ranking targets persuadables. At a 1% base rate the difference
        is honest noise management, not magic.

      **Business implication:** hand this framework a client's randomized
      campaign extract and it returns a targeting policy, its expected dollar
      delta, and the sample-size math for the next experiment — with only the
      cost model and the fetch URL to change.
roadmap:
  - status: delivered
    text: >-
      CUPED variance reduction — shipped, verified: measured on the snapshot
      with the strictly pre-period log_history covariate (conversion 0.08%,
      visit 0.52%); ATE unchanged by construction; synthetic-covariate unit
      tests prove the machinery (theta exactness, mean preservation).
  - status: delivered
    text: >-
      Power analysis — shipped, verified: analytic two-proportion formula
      (stdlib z-quantiles, no scipy) requires 3,063 per arm for the measured
      +0.68pp at alpha 0.05 / power 0.8 vs 21,306 available; exactness unit-
      tested against a hand calculation.
  - status: delivered
    text: >-
      Uplift meta-learners — shipped, verified: T-learner beats the response
      baseline (+$2,812 vs +$856 profit delta at 25% budget) and the X-learner
      (+$539) on out-of-fold scores; T/X rank a synthetic uplift segment
      correctly in unit tests.
  - status: delivered
    text: >-
      Real Hillstrom snapshot — shipped, verified: author's-site CSV
      sha256-pinned through portfolio_core.io.fetch, DQ gates (nulls, ranges,
      segment vocabulary), DatasetContract, dataset card + dvc import-url
      manifest in the registry.
  - status: remaining
    text: >-
      Multi-arm policy — choose WHICH email (Mens vs Womens) per customer, not
      just whether to send: the dropped third arm already supports it; needs a
      per-channel uplift model and a channel-switching cost model.
  - status: delivered
    text: >-
      Bootstrap CIs + cost sensitivity — shipped: paired row bootstrap
      (n=1000, seeded) over out-of-fold scores; per-policy 95% CIs on Qini
      and profit-at-budget, paired difference CIs, Qini figure bands, and a
      cost sweep with the ≈$0.30/email break-even. Unit-tested.
  - status: remaining
    text: >-
      Model-based CUPED covariate — a control-arm outcome model as covariate
      (documented industry variant) removes more variance than raw spend; kept
      out to stay on the spec's pre-period-covariate read, noted as forward
      work.
  - status: deferred
    text: >-
      Causal forests (grf/econml) — parked: heavyweight deps for a showcase
      whose point is auditable meta-learners; revisit if a client engagement
      needs non-parametric CATEs beyond HistGB capacity.
