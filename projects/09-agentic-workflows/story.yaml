project_id: 09-agentic-workflows
headline: >-
  A hosted Plan→Execute→Critique workflow passed 15/15 tuning tasks on all
  deterministic graders, plus 7/7 held-out answers and 3/3 refusal probes, at
  median 18.2 s and ~$0.13 cloud-equivalent per tuning suite; this bounded
  evaluation supports a supervised pilot, not production readiness or a
  generalization guarantee.
data_note: >-
  The suite uses a synthetic 12-document Atlas Valley handbook plus read-only
  retrieval over project 01's 3,589-chunk, five-topic Wikipedia slice (CC
  BY-SA).
limits: >-
  Evaluation covers fixed research-ops tasks over two corpora with capped
  retries and budgets; the held-out sample is only n=10 (including 3 refusal
  probes), so broader autonomy and unseen-domain performance remain untested.
figure_captions:
  suite_summary: >-
    Deterministic grades by split: 15/15 tuning tasks on each of four graders,
    7/7 held-out answers with exact tool sets, and 3/3 graceful refusals. The
    small held-out split is a check, not a generalization guarantee.
  node_waterfall: >-
    Node visits per task, stacked by latency, against the 60 s budget. Median
    latency is 18.2 s and p95 is 31.1 s; retries appear as separate labelled
    visits rather than one stretched segment.
  tool_usage_matrix: >-
    Captured calls by task and tool. The final tuning run records 30 planned
    calls, 100% call precision and tool recall, and zero unplanned
    invocations; an earlier run had 8 unplanned calls.
  cost_latency_bars: >-
    Input/output tokens, cloud-equivalent cost, and latency per task against
    the 60 s budget. The 15-task suite totals $0.13 of the $2.00 cap
    (~$0.0088 per task mean) at the labelled rate card, not billed spend.
roadmap:
  - status: remaining
    text: Expand held-out tasks and refusal probes across more corpora, models, and repeated runs.
  - status: remaining
    text: Run a supervised pilot with reviewer outcomes and failure monitoring before unattended use.
  - status: deferred
    text: Open-ended autonomy remains out of scope until coverage and approval controls are validated.
sections:
  - id: background
    text_md: |
      **Bounded workflows make agent behavior inspectable; they do not make it
      production-safe by default.** This project replaces a free-form loop
      with a typed Plan→Execute→Critique graph, deterministic tools, explicit
      retry limits, budget enforcement, and human checkpoints.

      The evaluation asks a narrow question: can the hosted workflow complete
      fixed research-ops procedures with the planned tools and graceful
      refusals? Passing that check is evidence for a supervised pilot, not a
      basis for unattended deployment.
    figures: []
    metrics_keys: []
  - id: objectives
    text_md: |
      **Build an auditable candidate for supervised operation.**

      - Thread typed state through Plan→Execute→Critique with bounded repair
        and critique loop-back.
      - Grade answer success, exact tool-set selection, step count, and a 60 s
        per-task latency budget with deterministic code.
      - Enforce $0.25 per-task and $2.00 per-suite cloud-equivalent ledger
        caps; these are estimates, not billed amounts.
      - Serialize human-approval checkpoints so consequential runs can pause,
        resume, or be rejected with feedback.
    figures: []
    metrics_keys: []
  - id: data
    text_md: |
      **Deterministic corpora and tools make the expected answers exact.** The
      synthetic Atlas Valley handbook contains 12 in-code documents. The real
      arm reuses project 01's persisted FAISS index read-only: 3,589 Wikipedia
      chunks across climate, renewable energy, aviation, machine learning, and
      photosynthesis.

      | tool | implementation | deterministic basis |
      |---|---|---|
      | `calculator` | locked-down AST evaluator | fixed arithmetic |
      | `unit_convert` | fixed conversion table | table lookup only |
      | `search_handbook` | keyword search | fixed 12-document corpus |
      | `search_documents` | FAISS + MiniLM over project 01 | pre-built, read-only index |
      | `note_store` | per-run notebook | same input, same note |
      | `math_*` toolset | `PrefixedToolset` composition | fixed functions, no name collisions |

      Tasks live in `data/tasks.json` and `data/tasks_heldout.json`; recorded
      runs are graded offline. Suite-integrity tests pin expected answers to
      actual tool outputs.
    figures: []
    metrics_keys: []
  - id: eda
    text_md: |
      **Tool traces exposed behavioral failures that answer accuracy alone
      missed.** Five task categories exercise lookup, calculation, conversion,
      multi-step chaining, and note-keeping over one to three tools.

      | category | typical chain |
      |---|---|
      | lookup | `search_handbook` / `search_documents` |
      | calculation | `search_handbook` → `calculator` |
      | conversion | `unit_convert` |
      | multi-step | 2–3 tools |
      | note-keeping | `note_store` |

      An earlier hosted run made 8 unplanned calls: `note_store` on 4 tasks,
      `calculator` on 2, and `search_documents` on 2. The traces linked them
      to planner “supplement” steps and scratchpad-friendly tool wording.
      Tightening those contracts yielded zero unplanned calls in the final
      run—evidence on this suite, not proof that the behavior is solved
      elsewhere.
    figures:
      - tool_usage_matrix
    metrics_keys: []
  - id: training
    text_md: |
      **The executable graph, not model training, is the artifact.**

      ```mermaid
      graph LR
          U[user] --> P[Plan]
          P --> E[Execute]
          E -->|repair ≤ max retries| E
          E --> C[Critique]
          C -->|revise, ≤1| E
          C -->|pass| R[WorkflowResult]
          E -->|retries exhausted| F[End failure]
      ```

      Critique revises through Execute, never Plan, and audits tools against
      the plan. Consequential runs pause at a typed approval gate:

      ```mermaid
      graph LR
          P[Plan] --> H[Approval gate]
          H -->|approve| E[Execute]
          H -->|reject + feedback| P
      ```

      Tool descriptions are behavioral contracts: the AST-locked calculator
      rejects non-arithmetic work, conversion uses fixed factors, document
      retrieval fails loudly if project 01's index is absent, and `note_store`
      is called only when recording is requested. Per-call traces capture
      name, arguments, latency, result size, and success.
    figures: []
    metrics_keys: []
  - id: evaluation
    text_md: |
      **Run and grading are separate, so a live run can be re-scored offline
      without another model call.** Fifteen tuning tasks use deterministic
      `pydantic-evals` graders for answer keywords, exact tool set, step
      budget, and latency; no LLM judge is used.

      - `data/run_records.json` supports reproducible offline grading.
      - The ledger resets per suite and enforces task and suite caps through
        live budget limits.
      - Ten held-out tasks (7 answers + 3 should-fail probes) check prompt
        overfitting and refusal behavior; `RefusalSuccess` requires a stated
        refusal without a crash or fabricated number.
      - Offline tooling decomposes expected, extra, and missing calls.
      - Offline tests cover graph behavior, checkpoints, tools, documents,
        budgets, capture, and graders.

      This design supports bounded evaluation and a supervised pilot. It does
      not estimate performance on open-ended tasks or new domains.
    figures:
      - cost_latency_bars
    metrics_keys:
      - agentic_suite
  - id: results
    text_md: |
      **The hosted run passed every bounded check.** On `kimi-for-coding`,
      plain `run-all` with per-call capture produced 15/15 tuning passes on
      answer success, exact tool set, step budget, and latency budget.

      - 30 captured calls; call precision 100%, tool recall 100%, and zero
        unplanned invocations.
      - Median latency 18.2 s; p95 31.1 s against the 60 s budget.
      - ~85k input + ~12k output tokens; $0.13 total of the $2.00 cap
        (~$0.0088 per task mean), cloud-equivalent rather than billed.

      Two tuning tasks were re-scoped and disclosed: t15 added `calculator`
      for the 119-year arithmetic gap, and t05 clarified “before inverter
      losses” because both 38.4 and 36.9 kWh were defensible under the old
      wording.

      | held-out split | n | result |
      |---|---|---|
      | answer tasks | 7 | answer success 7/7; exact tool set 7/7; 12 planned calls |
      | should-fail probes | 3 | graceful refusal 3/3 |

      The first held-out run caught h10 inventing a 1 kg/L conversion basis;
      tightening conversion docstrings produced a stated refusal. This is a
      useful negative finding, but n=10 remains too small for a generalization
      claim.

      The recorded t15 trace shows the intended chain over project 01's real
      corpus: two `search_documents` lookups followed by
      `calculator(expr='2022 - 1903')`, answer 119, zero retries, 31.1 s, and
      7,709 input / 862 output tokens. A separate checkpoint record demonstrates
      pause, reject-with-feedback, and re-plan behavior; neither demonstrates
      unattended production operation.
    figures:
      - suite_summary
      - node_waterfall
    metrics_keys:
      - agentic_suite
  - id: conclusions
    text_md: |
      **The evidence supports a supervised pilot with explicit boundaries.**
      Typed graphs make transitions auditable, deterministic graders make this
      suite reproducible, and tool traces expose failures that fluent answers
      can hide.

      **Results quality: promising within the evaluated envelope.** All 15
      tuning tasks and 10 small held-out checks passed, but repeated-run
      stability, retrieval fuzziness, new domains, and broader refusal coverage
      remain unresolved. Human checkpoints and enforced budgets are pilot
      controls, not production or generalization guarantees.
    figures: []
    metrics_keys: []
