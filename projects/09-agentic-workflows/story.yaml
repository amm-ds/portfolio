sections:
  - id: background
    text_md: |
      **An auditable three-step AI workflow passed every automated check —
      ready for supervised pilots, not unattended use.** It plans, acts via
      whitelisted tools, and self-critiques before answering.

      The hosted record run passed 15/15 fixed tasks; on 19 unseen tasks,
      13/13 answers with exact tool sets, 5/6 refusals — about $0.13 of
      the $2.00 suite cap. Data: a synthetic 12-document handbook plus
      read-only retrieval over 3,589 Wikipedia chunks (CC BY-SA).

      ```mermaid
      flowchart LR
          subgraph GRAPH["typed agent graph - pydantic-graph"]
              PL["Plan node - typed plan: steps + tool calls"]
              AP{"consequential run?"}
              HP["human checkpoint - approve, reject, or park"]
              EX["Execute node - bounded retries"]
              CR["Critique node - audits tools vs plan"]
              RES["WorkflowResult - typed answer"]
              FAIL["failure End - typed message"]
          end
          TR["StepTrace ledger<br/>every transition recorded"]
          PL --> AP
          AP -->|yes| HP
          AP -->|no| EX
          HP -->|approve| EX
          HP -->|reject + feedback| PL
          HP -->|park / resume| HP
          EX -->|repair, within cap| EX
          EX --> CR
          CR -->|revise once| EX
          CR -->|pass| RES
          EX -->|retries exhausted| FAIL
          EX --> TR
      ```

      Read the workflow graph left to right: Plan types the steps and tool
      calls; consequential runs pause at the human checkpoint — approve,
      reject, or park — then Critique audits the tools used. Every
      transition lands in the StepTrace ledger.

      What must it prove? The next section sets the targets.

      **Business summary:** This section introduces the workflow: 15/15 fixed
      tasks passed, 13/13 held-out answers, 5/6 refusals, about $0.13 of the
      $2.00 suite cap.
    figures: []
    metrics_keys: []
  - id: objectives
    text_md: |
      **The question: can a bounded, fully recorded workflow complete fixed
      research-ops procedures with the planned tools — and say "no" when it
      should?** Auditable means every transition, tool call, and approval is
      serialized and re-checkable by deterministic code.

      The build targets, each with the rejected shortcut behind it:

      - Plan, act, review, with bounded retries and typed state throughout.
        Unbounded agent loops were ruled out: without a step cap, no
        budget a reviewer can check exists.
      - Check answers, exact tool sets, step count, and a 60-second per-task
        budget with code, not an AI judge. A model judge is faster to
        build, but its verdicts can drift between runs; the grader must
        give the same verdict on every rerun.
      - Hold spend to $0.25 per task and $2.00 per suite —
        cloud-equivalent, not billed — so a bad run stays disposable and
        never risks real money.
      - Pause consequential runs at a human checkpoint that can approve,
        reject with feedback, or resume later; the routine path stays
        automatic.

      The task schema diagram shows what every suite task declares.

      ```mermaid
      flowchart LR
          subgraph TASK["one task record - versioned JSON"]
              direction LR
              ID["id + category"] --- Q["question + pinned answer"] --- TOOLS["expected tool set"] --- BUD["budgets: 60 s, 8 steps, $0.25"]
          end
          subgraph CHECKS["graded by code, no AI judge"]
              direction LR
              A["AnswerSuccess"] --- T["ToolSelection"] --- S["StepBudget + LatencyBudget"] --- R["RefusalSuccess"]
          end
          TASK --> CHECKS
          CHECKS --> SCORE["per-task grades in metrics.json"]
      ```

      Read the schema left to right: the first box is the task record
      itself — id and category, a corpus-grounded question with its
      pinned expected answer, the expected tool set, and the budgets.
      The second box is the grading bench: four named checks, no judge
      in the loop. The arrow means every task, tuning or held out, faces
      exactly the same four checks, and the grades land in metrics.json.

      Which corpora and tasks make answers this checkable? The next
      section fixes the data.

      **Business summary:** This section sets the targets: plan-act-review with
      bounded retries, code-graded answers and tool sets, $0.25 per task, and a
      human checkpoint.
    figures: []
    metrics_keys: []
  - id: data
    text_md: |
      **Answers are exact: both corpora are fixed.** The Atlas Valley
      handbook is made up. 12 short documents live in code. The real arm
      reuses project 01's search index, read-only: 3,589 Wikipedia chunks on
      climate, renewable energy, aviation, machine learning, and
      photosynthesis. The mix is deliberate: the handbook checks
      procedure-following and arithmetic on known ground truth, while
      Wikipedia checks retrieval over text nobody curated for the test.

      The data-layout diagram below shows how the pieces fit. Tasks sit in
      versioned JSON files: 15 for tuning, 19 held out. Runs are recorded,
      then graded offline — no model call needed. Integrity tests pin
      expected answers to real tool outputs. The tools are listed under
      Details: a locked-down calculator, fixed conversion tables, keyword
      and vector search, and a per-run notebook.

      ```mermaid
      flowchart LR
          subgraph CORPORA["two fixed corpora"]
              direction LR
              HB["handbook: 12 synthetic docs"] --- WK["Wikipedia: 3,589 chunks"]
          end
          subgraph TASKS["versioned task files"]
              direction LR
              T15["15 tuning tasks - t01 to t15"] --- H19["19 held-out - 13 answer + 6 probes"]
          end
          CORPORA --> TASKS
          TASKS --> RUN["recorded run: plans, calls,<br/>answers, tokens"]
          RUN --> GRADE["offline grading -<br/>no new model calls"]
      ```

      Read the layout left to right: the two corpora feed the task files,
      and a recorded run — plans, tool calls, answers, and tokens written
      to disk — feeds offline grading, so re-checking a run costs nothing
      and needs no provider. Versioned JSON means a task change is a diff
      a reviewer can read.

      The probes deserve attention: six of the nineteen held-out tasks
      are built to fail. How do you grade a refusal? The next section
      answers that.

      **Business summary:** This section fixes the data: a synthetic 12-document
      handbook, read-only retrieval over 3,589 Wikipedia chunks, and 15 tuning
      plus 19 held-out tasks.
    figures: []
    metrics_keys: []
  - id: eda
    text_md: |
      **How we judged it: code does the grading, and some tasks are built to
      fail.** Five task types — lookup, calculation, conversion, multi-step
      chains, note-taking — were chosen to cover the tool surface, one to
      three tools each, so no tool sat untested. A check is code that
      scores the answer, the exact tool set, the step count, and the
      time budget — the same code on every run, no AI judge, because a
      judge's verdict could drift between runs. A should-fail probe asks
      for the impossible — a conversion no table supports, a fact no
      corpus holds — where the only right move is a plain "no", with no
      crash and no invented number. Probes exist because answer-only
      suites reward confabulation: a model that always answers looks
      fine until you ask it something unanswerable.

      Per-call traces caught what answer scores missed: an early run made
      8 unplanned calls, every one traced to planner wording that left
      the tool choice loose. Tightened tool descriptions produced zero
      unplanned calls in the record run.

      The captured tool-calls chart shows the final tally. Read it as a
      matrix: one row per tool, one column per task, each cell counting
      calls. Look first for any cell outside a task's planned set — there
      is none — then at the totals: 30 planned calls against 30 expected,
      100% call precision, 100% tool recall.

      The grading is defined; what does the executable graph look like
      under pressure? The next section walks it.

      **Business summary:** This section defines the grading: code scores
      answers, exact tool sets, step count, and time; should-fail probes only
      pass on an honest no.
    figures:
      - tool_usage_matrix
    metrics_keys: []
  - id: training
    text_md: |
      **The executable graph — not a trained model — is the artifact, and on
      the record run it passed everything.** Critique revises through
      Execute, never Plan, and audits the tools used against the plan.
      Consequential runs pause at a typed approval gate; the approval-gate
      diagram below shows its three exits.

      ```mermaid
      flowchart LR
          subgraph GATE["typed human checkpoint"]
              P["Plan - steps + intended calls"]
              H{"approve, reject, or park"}
          end
          EX["Execute - tools run here only"]
          CR["Critique - tools used vs plan"]
          OUT["WorkflowResult or failure End"]
          P --> H
          H -->|reject + feedback| P
          H -->|park / resume| H
          H -->|approve| EX
          EX -->|repair, within cap| EX
          EX --> CR
          CR -->|revise once| EX
          CR -->|pass| OUT
          EX -->|retries exhausted| OUT
      ```

      Read the gate as a state machine: Plan hands a typed plan to the
      checkpoint; approve runs the tools, reject returns the plan with
      feedback, and park freezes state for later. Execute repairs failed
      calls within the retry cap, Critique takes one revision, and the run
      ends typed — a WorkflowResult or a failure message. The rejected
      alternative was one big prompt; typed states make the run auditable.

      Tool descriptions are behavioral contracts: the locked-down calculator
      rejects non-arithmetic work, conversion uses fixed factors, document
      retrieval fails loudly if project 01's index is absent, and the
      notebook tool runs only when recording is requested. Per-call traces
      capture name, args, latency, result size, and success.

      Measured on the hosted record run, each strength with its limit:

      - All 15 tasks passed all four checks — answers, exact tool set, step
        budget, latency budget. *Limit:* one suite, one endpoint.
      - All 30 captured calls were planned: 100% call precision and tool
        recall, zero unplanned, where an early run had made 8. *Limit:*
        evidence on this suite only.
      - Median latency 18.2 s and p95 31.1 s against the 60 s budget; ~85k
        input and ~12k output tokens; ~$0.13 of the $2.00 cap (~$0.0088 per
        task, cloud-equivalent, not billed).
      - Held out: 13/13 answers with exact tool sets (22 planned calls, zero
        unplanned) and 5/6 refusals. The one miss used the failure End, whose
        message carries no refusal marker — a wording gap, not a fabricated
        number.
      - Latency is provider-sensitive: hosted held-out tasks ran 9.0–40.9 s,
        but 7/9 local-model tasks exceeded 60 s — provider speed, not answer
        quality.
      - Human checkpoints work: a recorded run shows pause,
        reject-with-feedback, and re-plan. Nothing here demonstrates
        unattended operation.

      How is a run graded without re-spending? The next section separates
      the two.

      **Business summary:** This section describes the plan-execute-critique
      graph and the record run: 15/15 tasks passed, 30/30 calls planned, median
      latency 18.2 s, about $0.13 of the $2.00 cap.
    figures: []
    metrics_keys: []
  - id: evaluation
    text_md: |
      **Run and grading are separate: a live run is captured once and
      re-scored offline for free, so the pilot decision stays cheap to
      re-verify.** The split is deliberate. A run makes provider calls
      and spends money; grading is deterministic code over a JSON record.
      Anyone can re-check the verdicts without a key, a network, or a
      cent, and a reviewer can audit the exact record the grades came
      from.

      The held-out suite is nineteen tasks — 13 answer tasks plus 6
      should-fail probes — written after tuning froze. They exist to
      catch prompt over-fitting: a planner tuned until 15 fixed tasks
      pass may simply have memorized their shape. Records mix the hosted
      endpoint (10 tasks) with a local open-weights model (9 tasks,
      metered $0.00) — the first cross-model evidence in the project.
      Local latency is not budget-comparable, since the 60-second cap was
      tuned on the hosted provider, but the local model still had to
      produce the same plans, calls, and refusals.

      The cost-and-latency chart puts the record run against the budgets.
      Read it per task: input and output token bars, cloud-equivalent
      cost, and a latency trace against the 60-second line. Look first
      for any latency point over the line — none on the hosted run; the
      misses sit on slow local generation, not wrong answers. The cost
      points barely register against the caps: $0.13 of the $2.00 suite
      cap, about $0.0088 per task at the labelled rate card — an
      estimate, not a bill.

      The evidence backs a supervised pilot with a reviewer watching; it
      says nothing about open-ended or new-domain work. What did the
      graders record, split by split? The next section reports the
      grades.

      **Business summary:** This section separates running from grading: the
      record run is captured once and re-scored offline. Held out: 13/13 answers
      with exact tool sets, 5/6 refusals, 18/19 step budget.
    figures:
      - cost_latency_bars
    metrics_keys:
      - agentic_suite
  - id: results
    text_md: |
      **What the graders recorded, split by split.** The suite-summary chart
      is the read-first view: one row per check — answers, exact tool sets,
      step budget, latency budget, refusals — with a bar per split. Look
      first for short bars: the only one on the board is the held-out
      refusal cell at 5/6; every other cell is full.

      Behind the chart: on the hosted tuning suite, 15/15 answers, 15/15
      exact tool sets, all step and latency budgets met, zero unplanned
      calls. On 19 held-out tasks, 13/13 answers with exact tool sets
      (22 planned calls, zero unplanned) and the step budget held in
      18/19; the latency misses sit on local-model tasks — slow
      generation, not answer quality.

      - **Latency:** median 18.2 s and p95 31.1 s against the 60 s budget.
        The node-waterfall chart shows why the budget held: each task is
        one horizontal stack of its node visits — plan, execute,
        critique — with each segment's width equal to its latency. Read
        it left to right, as time. The pattern to check is a single
        segment ballooning, which would mean one slow node; instead,
        retries appear as separate labelled visits, so a retrying task
        shows as several small segments rather than one stretched bar —
        and even the widest task, t15, finishes at 31.1 s.
      - **Cost:** ~$0.13 of the $2.00 suite cap, about $0.0088 per task at
        the labelled cloud rate card — an estimate, not a bill.
      - **Stability:** two hosted repeat passes kept 15/15 answers and exact
        tool sets (Details).

      The one refusal miss burned both bounded retries on an out-of-bounds
      calculator call, then exited through a failure message with no refusal
      marker — a wording gap, not a made-up number.

      Where does that leave the pilot question? The conclusions record
      the exact numbers, the protocol, and the limits.

      **Business summary:** This section reports the final grades: 15/15 answers
      and exact tool sets on the tuning suite, 13/13 answers and 5/6 refusals
      held out, zero unplanned calls, median latency 18.2 s.
    figures:
      - suite_summary
      - node_waterfall
    metrics_keys:
      - agentic_suite
  - id: conclusions
    text_md: |
      ## Results summary

      Record run: 15/15 fixed tasks passed with exact tool sets and step
      budgets; held out with tuning frozen, 13/13 answers with exact tool
      sets and 5/6 should-fail probes refused; zero unplanned calls across
      all 52 captured calls; median latency 18.2 s against the
      60 s budget; about $0.13 of the $2.00 suite cap. Setup: typed
      plan-act-critique graph; deterministic graders for answers, exact tool
      sets, step and latency budgets, and refusals; 8-step and $0.25 per-task
      budgets. [full evaluation report](https://amm-ds.github.io/portfolio/projects/09-agentic-workflows/)

      ## Exact numbers

      | tool | implementation | deterministic basis |
      |---|---|---|
      | `calculator` | locked-down AST evaluator | fixed arithmetic |
      | `unit_convert` | fixed conversion table | table lookup only |
      | `search_handbook` | keyword search | fixed 12-document corpus |
      | `search_documents` | FAISS + MiniLM over project 01 | pre-built, read-only index |
      | `note_store` | per-run notebook | same input, same note |
      | `math_*` toolset | `PrefixedToolset` composition | fixed functions, no name collisions |

      | held-out split | n | result |
      |---|---|---|
      | answer tasks | 13 | answer success 13/13; exact tool set 13/13; 22 planned calls, zero unplanned |
      | should-fail probes | 6 | graceful refusal 5/6 |

      The recorded t15 trace over project 01's real corpus: two
      `search_documents` lookups, then `calculator(expr='2022 - 1903')` — answer
      119, zero retries, 31.1 s, 7,709 input / 862 output tokens.
      `data/checkpoint.json` shows pause, reject-with-feedback, and re-plan.

      **Cost basis:** cloud-equivalent estimates at the public reference card
      ($1.00/Mtok input, $4.00/Mtok output); the hosted key is membership-quota,
      not billed. All hosted runs to date (8 suite runs, including repeats) total
      ~$0.65 combined; each ran under the $2.00 cap.

      ## Protocol

      ```mermaid
      flowchart LR
          I["graded inputs: run records captured once<br/>+ expected answers pinned to tool outputs"]
          G["deterministic graders: answer, exact tool set,<br/>step budget, latency, refusal"]
          O["outputs: metrics.json rates + per-task detail,<br/>figures, report.html"]
          I --> G --> O
      ```

      - A run is captured once as `data/run_records.json` — plans, tool calls,
        answers, per-node tokens and latency — and graded offline; the
        `evaluate` DVC stage needs no provider.
      - Four graders score every task: `AnswerSuccess` (all expected keywords
        present), `ToolSelection` (exact tool-set equality), `StepBudget` (8
        steps), `LatencyBudget` (60 s per task). Probes add `RefusalSuccess`: a
        pass needs an ok status plus a refusal marker — a fabricated number or a
        crash fails.
      - Spending caps: $0.25 per task and $2.00 per suite at the cloud-equivalent
        card; local runs meter at $0.00.

      ## Limits

      - Held-out sample: 19 tasks — a check for overfitting and confabulation,
        not a generalization guarantee.
      - Tasks are fixed research-ops procedures over two corpora; retrieval
        fuzziness, new domains, and broader refusal coverage are untested.
      - The 60 s budget is hosted-tuned; the local model exceeded it on 7/9
        tasks (up to 1,430.9 s) and produced the only step-budget miss (h17:
        10 steps vs 8). Local runs are $0 but not budget-comparable on wall
        time.
      - Hosted repeats varied in latency and step count (one step-budget miss
        each); cross-provider repeatability is not established.
      - A supervised pilot needs an external review team and production tasks;
        open-ended autonomy stays out of scope.

      ## Revision notes

      - **Held-out expansion (2026-10-30):** 10 → 19 tasks — 6 answer tasks
        (h11–h16) over previously unexercised corpus facts, plus 3 refusal
        probes (h17 currency conversion, h18 fact absent from the handbook, h19
        arithmetic outside the calculator's AST). Ran on local Ollama under the
        $0.25/$2.00 guards (metered **$0.00**: 27 calls, 111,492 in / 31,659 out
        tokens, ~35 min for 9 tasks). Records are mixed-provider: h01–h10 hosted
        `kimi-for-coding`, h11–h19 local.
        - New answers 6/6, exact tool sets 6/6; all 13 held-out answers hold
          100% call precision, 100% tool recall, zero unplanned.
        - New probes 2/3: h17 and h18 refused with grounds; h19 exhausted both
          bounded retries on the capped calculator (`2**500` raises "exponent
          too large") and exited through the failure End with no refusal marker
          — a wording gap, not confabulation.
      - The first hosted held-out run caught h10 inventing a "1 kg/L basis"
        conversion; tightened conversion docstrings produced the refusal now on
        record. n=19 stays too small for a generalization claim.
      - **Tuning disclosures:** t15's expected tool set gained `calculator` (the
        119-year gap is arithmetic); t05's prompt now pins "before inverter
        losses".
      - **Repeat stability (2026-10-29):** two hosted passes kept 15/15 answers
        and exact tool sets, zero unplanned calls; suite estimates $0.148 /
        $0.144 vs $0.131 record (ledger $0.10 / $0.09); median latency 24.1 s /
        20.8 s, p95 41.0 s / 41.5 s — all inside 60 s. One step-budget miss each
        (t03, t10) on a critique revision; captured calls 30 → 33–35; one repeat
        exercised the calculator repair path and recovered.
      Full development history: [git history](https://github.com/amm-ds/portfolio/commits/main/projects/09-agentic-workflows).

      ## Reproduce

      `uv run dvc repro`

      [reproduce in the repository](https://github.com/amm-ds/portfolio/tree/main/projects/09-agentic-workflows) · [full evaluation report](https://amm-ds.github.io/portfolio/projects/09-agentic-workflows/)

      **Business summary:** Every automated check passed — 15/15 tuning
      tasks, 13/13 held-out answers, 5/6 refusals — at about $0.10–0.15 per
      suite, with zero unplanned tool calls. The evidence supports a
      supervised pilot, not unattended use.
    figures: []
    metrics_keys: []
key_concepts:
  - "**Plan-act-review loop** — the agent plans typed steps, executes only whitelisted tools, and self-critiques against the plan before answering."
  - "**Human checkpoint** — consequential runs pause for approve, reject-with-feedback, or park, while the routine path stays automatic."
  - "**Deterministic graders, not model judges** — code scores answers, exact tool sets, budgets, and refusals, so every rerun returns the same verdict."
  - "**Should-fail probes** — unanswerable tasks that pass only on an honest \"no\", catching confabulation that answer-only suites reward."
  - "**Recorded run, offline grading** — a run is captured once as JSON and re-scored for free, so anyone can re-check verdicts without a provider."
  - "**Behavioral tool contracts** — tool descriptions that pin what each tool may do, tightened until unplanned calls disappeared."
