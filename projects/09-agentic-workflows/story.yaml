project_id: 09-agentic-workflows
short_version: >-
  An auditable plan-act-review AI workflow with fixed tools and budgets passed
  all automated checks: 15/15 fixed tasks, 13/13 unseen answers, 5/6
  should-fail probes, ~$0.13 per suite. Ready for supervised pilots, not
  unattended use. Data: synthetic handbook, real Wikipedia chunks.
figure_captions:
  suite_summary: >-
    Deterministic grades by split: 15/15 tuning tasks on each of four graders;
    held-out answers 13/13 on answers and exact tool sets; should-fail probes
    5/6 graceful refusals. Held-out records mix the hosted run (h01-h10) with
    the local-Ollama expansion wave (h11-h19, metered $0) — the step/latency
    misses sit on local tasks, whose generations exceed the hosted-tuned 60 s
    budget. The held-out split is a check, not a generalization guarantee.
  node_waterfall: >-
    Node visits per task, stacked by latency, against the 60 s budget. Median
    latency is 18.2 s and p95 is 31.1 s; retries appear as separate labelled
    visits rather than one stretched segment.
  tool_usage_matrix: >-
    Captured calls by task and tool. The final tuning run records 30 planned
    calls, 100% call precision and tool recall, and zero unplanned
    invocations; an earlier run had 8 unplanned calls.
  cost_latency_bars: >-
    Input/output tokens, cloud-equivalent cost, and latency per task against
