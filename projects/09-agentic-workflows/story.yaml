project_id: 09-agentic-workflows
roadmap:
  - status: delivered
    text: >-
      Multi-step agent graphs — shipped, verified: Plan→Execute→Critique on
      pydantic-graph over typed WorkflowState with bounded retries and one
      Critique loop-back; the graph machinery is covered by 62 offline tests.
  - status: delivered
    text: >-
      Workflow evaluation harness — shipped, verified: 15-task suite with
      deterministic graders (answer success, exact tool-set, step budget,
      latency budget); evaluate runs fully offline from data/run_records.json.
  - status: delivered
