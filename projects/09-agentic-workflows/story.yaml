    text: "Repeat hosted stability evidence — two full tuning-suite passes on kimi-for-coding kept 15/15 answers and exact tool sets with zero unplanned calls; one step-budget excursion caught by graders (Results)."
  - status: remaining
    text: Expand held-out tasks and refusal probes across more corpora and models.
  - status: remaining
    text: Run a supervised pilot with reviewer outcomes and failure monitoring before unattended use — needs a review team and production tasks.
  - status: deferred
    text: Open-ended autonomy remains out of scope until coverage and approval controls are validated.
