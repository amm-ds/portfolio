project_id: 09-agentic-workflows
roadmap:
  - status: delivered
    text: >-
      Multi-step agent graphs — shipped, verified: Plan→Execute→Critique on
      pydantic-graph over typed WorkflowState with bounded retries and one
      Critique loop-back; the graph machinery is covered by 73 offline tests.
  - status: delivered
    text: >-
      Workflow evaluation harness — shipped, verified: 15-task tuning suite
      plus a 10-task held-out set (3 designed-to-fail refusal probes), all
      graded by deterministic evaluators; evaluate runs fully offline from
      data/run_records.json.
  - status: delivered
    text: >-
      Human-in-the-loop checkpointing — shipped, verified: typed ApprovalRequest
      plus full state serialize to data/checkpoint.json; CLI resumes with
      approve or reject-with-feedback (re-plan, then Execute).
  - status: delivered
    text: >-
      Cross-project agent evaluation on real retrieval corpora — shipped,
      verified: search_documents queries 01's Wikipedia FAISS index read-only;
      suite task t15 grades a two-article multi-hop lookup with the same
      deterministic graders.
  - status: remaining
    text: >-
      Parallel map/fork execution across plan steps (pydantic-graph Fork/Join)
      to cut per-task wall clock further now that hosted latency is ~20 s.
sections:
  - id: background
    text_md: |
      Single-shot agents are the demo; workflows are the product. This project
      extends the agentic-AI flagship into multi-step, stateful workflows —
      planning, tool orchestration, bounded retries, self-critique, and human
      checkpoints — with the same typed contracts and evaluation discipline as
      the rest of the platform. The question is not whether an LLM can answer,
      but whether it can be trusted through a multi-step procedure.

      - **Explicit graphs over free-form loops** — a pydantic-graph
        Plan→Execute→Critique workflow makes every transition, retry bound, and
        loop-back auditable code instead of prompt folklore.
      - **Deterministic grading** — a 15-task tuning suite graded by offline,
        code-level evaluators turns "the agent works" into per-task pass rates a
      client can inspect; a 10-task held-out set guards against prompt
      overfitting.
      - **Bounded autonomy** — retries are capped, latency and cost budgets are
        enforced per task and per suite by the spend ledger, and consequential
        actions pause at a human checkpoint whose state is serialized to disk.

      The result is an agent stack that fails loudly and measurably rather than
      fluently.

      **Business implication:** a client deciding where agents may run
      unsupervised needs evidence, not a demo — graded outcomes against explicit
      budgets, with a checkpoint pattern for the actions that carry real cost.
    figures: []
    metrics_keys: []
  - id: objectives
    text_md: |
      - **Typed multi-step graphs with recoverable failures** — typed state
        threaded through Plan→Execute→Critique; validation failures take a
        bounded repair path, never an unbounded retry loop.
      - **Step-level evaluation criteria with per-run budgets** — answer
        success, exact tool-set selection, step budget, and a 180 s per-task
        latency budget, accumulated per node with per-node step traces.
      - **Auditable human-in-the-loop** — a checkpoint node serializes the full
        typed state to disk so a human can approve, reject with feedback, or
        audit the run after the fact.
      - **Deterministic grading** — graders are code-level and run fully
        offline; no LLM judge, no vibes. Cost is a labelled
        cloud-equivalent estimate enforced by ledger caps ($0.25 per task,
        $2.00 per suite), never a billed amount.

      **Business implication:** the deliverable is an operating decision — which
      tasks the workflow may run end-to-end, which need a human checkpoint, and
      what each run costs — with every claim backed by a recorded run.
    figures: []
    metrics_keys: []
  - id: data
    text_md: |
      Two corpora back the suite. The synthetic domain is a "research ops"
      world: the Atlas Valley field-station handbook, 12 in-code documents
      covering fuel, solar, water, batteries, comms, caches, and cold storage.
      The real-data arm reuses project 01's Wikipedia slice: 3,589 chunks over
      five topics (climate, renewable energy, aviation, machine learning,
      photosynthesis), retrieved through 01's persisted FAISS index — read-only,
      no re-indexing. Every tool is deterministic, so every ground truth in the
      suite is exact and the whole evaluation runs offline. Tasks and expected
      answers live in `data/tasks.json` (tuning) and `data/tasks_heldout.json`
      (held-out); graded run records land in `data/run_records.json`.

      | tool | implementation | why it is deterministic |
      |---|---|---|
      | `calculator` | locked-down AST evaluator | fixed arithmetic, no model call |
      | `unit_convert` | fixed conversion table | table lookup only |
      | `search_handbook` | keyword search over 12 docs | corpus is in code |
      | `search_documents` | FAISS + MiniLM over 01's index | pre-built index, read-only |
      | `note_store` | per-run in-memory notebook | same input, same note |
      | `math_*` toolset | composed via `PrefixedToolset` | two toolsets, zero name collisions |

      **Business implication:** determinism is what makes agent quality
      measurable — the client is not buying fluency, they are buying correct
      procedures, and these corpora pin correctness to code.
    figures: []
    metrics_keys: []
  - id: eda
    text_md: |
      The corpus is small and fully enumerable, which is the point: five task
      categories exercise one to three tools each, and expected answers are
      pinned to actual tool outputs by suite-integrity tests (synthetic tasks)
      and `tests/test_documents.py` (the real-corpus t15/h02 facts) — ground
      truths cannot silently drift from the domain.

      | category | what it exercises | typical chain |
      |---|---|---|
      | lookup | retrieval (handbook + real corpus) | `search_handbook` / `search_documents` |
      | calculation | doc-grounded arithmetic | `search_handbook` → `calculator` |
      | conversion | unit translation | `unit_convert` |
      | multi-step | chained tool calls | 2–3 tools |
      | note-keeping | notebook state | `note_store` |

      Per-call tool traces make over-calling visible as `tool_usage_matrix`.
      On an earlier hosted run `note_store` fired on 4 tasks that never asked
      for it and `search_documents` on 2 — the exact-set miss driver grading
      recorded. The traces also showed *why*: the planner added "supplement"
      steps, and `note_store`'s docstring invited scratchpad use. The final run
      shows zero unplanned calls — the matrix is the x-ray that made the fix
      verifiable.

      **Business implication:** category composition shows a client exactly
      where agent risk concentrates — with hosted reliability the failures
      left are behavioral (extra-tool noise), not infrastructure.
    figures: [tool_usage_matrix]
    metrics_keys: []
  - id: training
    text_md: |
      The workflow *is* the artifact — a pydantic-graph
      Plan→Execute→Critique→End over typed `WorkflowState`, one agent per
      node; `agent_architecture` renders this graph. Critique `revise` loops
      back to **Execute** (never Plan) and audits the tools used against the
      plan; the human gate re-enters the graph at Execute (approve) or Plan
      (reject + feedback).

      ```mermaid
      flowchart LR
          A[user request] --> P[Plan]
          P --> E[Execute<br/>tools + bounded repair]
          E -->|repair ≤ max_execute_retries| E
          E -->|retries exhausted| F[End<br/>failure]
          E --> C[Critique<br/>self-check]
          C -->|revise, ≤1| E
          C -->|pass| R[WorkflowResult]
      ```

      **Tool design — each tool is a contract, not a convenience:**

      - `calculator` is AST-locked: only numeric literals and operators survive
        parsing — cross-unit questions must go to `unit_convert`, not an
        invented density.
      - `search_documents` mounts 01's FAISS index read-only — observable,
        never mutable; a missing index fails loudly.
      - `PrefixedToolset` lets independently authored toolsets share one agent
        — math helpers join as `math_*`, zero collisions (unit-tested).
      - Traces turned docstrings into behavioral contracts: `note_store` said
        "working memory" and ran unrequested on 4 tasks; rewording it, banning
        planner "supplements", and giving Critique the plan/tools audit removed
        all 8 unplanned calls — wording is behavior.

      **Toolset** (traced per call: name, args, latency, size, ok):

      | tool | signature | does | guardrail | use when | this run |
      |---|---|---|---|---|---|
      | `calculator` | `(expr) -> float` | AST arithmetic | no names/calls; exp ≤ 64 | arithmetic | 11 / 11 (0 unplanned) |
      | `unit_convert` | `(value, from, to) -> float` | fixed-table conversion | dimension match; no invented factors | convert units | 3 / 3 |
      | `search_handbook` | `(query, top_k=3) -> list[str]` | keyword search, 12 docs | corpus in code | station facts | 13 / 13 |
      | `search_documents` | `(query, top_k=3) -> list[str]` | dense retrieval, 01's FAISS | read-only index | real-corpus lookup | 2 / 2 |
      | `note_store` | `(ctx, action, note="") -> list[str]` | per-run notebook | no empty appends | "record" requested | 1 / 1 |
    figures: [agent_architecture]
    metrics_keys: []
  - id: evaluation
    text_md: |
      Fifteen tuning tasks graded by `pydantic-evals` with deterministic
      evaluators: answer success (all expected keywords present), tool selection
      (exact tool-set match), step budget, and a 180 s per-task latency budget.
      Token usage is accumulated per node (`StepTrace`); cost is a labelled
      cloud-equivalent estimate at the reference card, enforced by the spend
      ledger. Code lives in `evals.py` (suite + grading), `figures.py`
      (builders) and `report.py` (report/metrics) after the audit-P1 split.

      - **Run and evaluate are separate DVC stages** — `run` needs a live
        model; `evaluate` is fully offline from `data/run_records.json`, so a
        run is paid for once and graded reproducibly forever.
      - **No LLM judge** — grading is code, which means the same run always
        yields the same scores.
      - **Budget wiring** — the ledger resets at suite start, caps the suite at
        $2.00, and a $0.25 per-task cap aborts a task mid-run; `budget_limits`
        rides every live call.
      - **Held-out set** — `run-all --heldout` / `evaluate --heldout` grade 10
        unseen tasks (7 answer + 3 designed-to-fail probes) into
        `metrics.json detail.heldout`; probes grade `RefusalSuccess` (no crash,
        stated refusal), not keywords.
      - **Trajectory decomposition** — `detail.tooling` decomposes the
        exact-set score offline: per-tool expected vs extra calls and unused
        expected slots.
      - **Tests** — 73 offline tests cover the graph, HITL, tools, documents,
        budget paths, tool capture, eval machinery, and the held-out graders.

      **Business implication:** deterministic, offline grading is what makes an
      agent's quality a contract term rather than a demo impression.
    figures: [cost_latency_bars]
    metrics_keys: [agentic_suite]
  - id: results
    text_md: |
      Hosted run on `kimi-for-coding`, plain `run-all`, per-call capture on:
      **15/15 ok, and all four graders 15/15 — answers, exact tool set, step
      budget, latency budget.**

      - tool selection **15/15** exact-set (from 8/15 two waves ago): 30
        captured calls, call precision **100%**, tool recall **100%** — zero
        unplanned calls (the previous run had 8)
      - latency: median **18.2 s**, p95 31.1 s — far under the 180 s budget
        (`node_waterfall`)
      - tokens: ~85k in + ~12k out; ledger total **$0.086** of the $2.00 cap
        (~$0.009 per task cloud-equivalent)

      Two tasks were honestly re-scoped while tuning — disclosed, not silent
      grader edits: t15's expected set gained `calculator` (the 119-year gap is
      arithmetic the suite itself demands elsewhere), and t05's prompt now pins
      "before inverter losses" (both 38.4 and 36.9 kWh were defensible readings
      of the old wording).

      **Held-out set** (audit finding 6): 10 unseen tasks over the same
      corpora, run only after the tuning set was clean. Small by design — n=10
      with 3 should-fail — it checks what the tuning set cannot: prompt
      overfitting, and failure behavior.

      | split | n | result |
      |---|---|---|
      | answer tasks | 7 | answer success 7/7, exact tool set 7/7, 12 calls all planned |
      | should-fail probes | 3 | graceful refusal 3/3 (no crash, no fabricated number) |

      The probes matter: the first held-out run caught h10 confabulating ("40 kg
      ≈ 40 L via a 1 kg/L basis"); tightening the conversion docstrings turned
      it into a stated refusal. A pass-only suite can never see that failure
      class.

      **Business implication:** ~$0.01 cloud-equivalent and ~18 s per task with
      enforced budgets make graded agents an operating tier — checkpoints make
      them delegable.
    figures: [per_task_grading, node_waterfall]
    metrics_keys: [agentic_suite]
  - id: conclusions
    text_md: |
      Three lessons generalize beyond this domain:

      - **Explicit graphs buy auditability** — every transition, retry, and
        loop bound is code, and the same typed state that drives execution
        serializes verbatim into the human-checkpoint file.
      - **Deterministic graders make agent quality measurable** — answer
        success and exact tool-set selection surfaced real behavior differences
        between a flaky local 32B and a hosted coding model without an LLM
        judge — and then verified the fix.
      - **Tool docstrings are behavioral contracts** — the 8/15 exact-set miss
        was caused by wording ("working memory", planner "supplements"), not by
        model capability; per-call traces located it, prompt/docstring surgery
        removed it, and the held-out set confirmed the fix generalizes.

      The machinery is trustworthy — 73 tests cover the graph, HITL, tools,
      documents, budget paths, tool capture, eval harness, and held-out graders.

      **Results quality: strong on answers, tool discipline, and budgets.**
      15/15 on every grader under enforced cost caps is production-grade; the
      held-out set adds the honest caveat (n=10, 3 probes) that this verifies
      generalization on unseen prompts and refusal behavior, not just the
      tuning tasks. The residual risks are known: retrieval fuzziness on the
      real corpus and probe coverage, both addressed by more data, not more
      machinery.

      **Business implication:** adopt this pattern when actions are
      consequential and auditable — human checkpoints for irreversible steps,
      enforced budgets for everything else — and treat local 32B reasoning as a
      profiling environment, not a serving tier.
    figures: []
    metrics_keys: []
