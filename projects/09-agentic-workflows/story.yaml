project_id: 09-agentic-workflows
short_version: >-
  Auditable plan-act-review workflow with typed outcomes and hard deadlines.
  Legacy single runs: 15/15 fixed, 13/13 unseen answers, 5/6 refusals;
  ~$0.13/tuning suite. Live held-out (2026-11-19): 13/13 answers, 6/6
  live-grader refusals (h19: calculator-guard error), 19/19 budgets.
figure_captions:
  suite_summary: >-
    Each row is one automated check. Each bar shows passes out of the tasks
    in one split: 15 tuning tasks, 13 held-out answer tasks, or 6 should-fail
    probes. Compare bars within each row. A shorter bar marks a failed check;
    here, the held-out refusal bar stops at 5/6.
  node_waterfall: >-
    Each horizontal stack is one task. Segments show time spent in each
    workflow node; the record run needed no retries, so no retry segments
    render. Compare total length with the 60 s budget. Median latency on the
    15-task tuning suite is 18.2 s. The p95 latency, meaning 95% of tasks
    finished within this time, is 31.1 s.
  tool_usage_matrix: >-
    Rows are tools, columns are tasks, and cells count captured calls. Look
    for calls outside each task's planned tool set. The final tuning run has
    30 planned calls, 100% call precision and tool recall, and zero unplanned
    calls.
  cost_latency_bars: >-
    For each task, bars show input and output tokens, estimated
    cloud-equivalent cost, and latency against the 60 s budget. The 15-task
    suite totals $0.13 of the $2.00 cap (~$0.0088 per task mean) at the
    labelled rate card, not billed spend.
sections:
  - id: background
    text_md: |
      **Legacy tuning passed 15/15 fixed tasks; held-out did not pass every
      check.** The workflow suits supervised pilots, not unattended use. It
      plans, uses approved tools, and reviews its work. Auditable means a
      reviewer can reconstruct each step.

      Held-out results were 13/13 answers, 5/6 refusals, 18/19 step budgets,
      and 12/19 latency budgets. Tuning cost about $0.13 of the $2.00 cap,
      not billed spend. Data: a synthetic 12-document handbook and 3,589
      Wikipedia passages under CC BY-SA. Typed outcomes, no-evidence
      stopping, and deadline enforcement have deterministic tests and a live
      confirmation (2026-11-19: 6/6 live-grader refusals; h19 a
      calculator-guard error).

      ```diagram 09-agent-loop
      ```

      Plan records steps and tools. Consequential runs pause for human review.
      Critique audits tool use; StepTrace records every transition.

      **Business summary:** Legacy results: 15/15 fixed tasks, 13/13 held-out
      answers, 5/6 refusals, and about $0.13 of the $2.00 cap.
    figures: []
    metrics_keys: []
  - id: objectives
    text_md: |
      **Can a bounded, fully recorded workflow complete fixed
      research-operations procedures with planned tools and refuse impossible
      requests?** Bounded means steps, time, and spend have explicit limits.
      Fully recorded means deterministic code can recheck every transition,
      tool call, and approval. Deterministic code gives the same output for
      the same input.

      The targets are:

      - Plan, act, and review with bounded retries and typed state. Typed
        state means each piece of run data has a required format. A step cap
        replaces an open-ended agent loop with a budget reviewers can check.
      - Enforce a 60-second per-task wall-clock deadline and grade answers,
        exact tool sets, step count, and latency with code, not an AI judge.
        The same record must receive the same verdict on every rerun.
      - Cap cloud-equivalent spend at $0.25 per task and $2.00 per suite.
        Cloud-equivalent cost uses listed provider prices; it is not billed
        spend.
      - Pause consequential runs at a human checkpoint. A reviewer can
        approve, reject with feedback, or resume later. Routine runs stay
        automatic.

      The task schema diagram shows how these targets become testable. A
      schema is the required structure of a record.

      ```diagram auto-09-agentic-workflows-1
      ```

      In the task-record box, find the id, category, corpus-grounded question,
      pinned expected answer, expected tool set, and budgets. Corpus-grounded
      means the answer comes from the provided documents. The grading-bench
      box lists four named checks, with no AI judge. Follow the arrow from
      tasks to grades: tuning and held-out tasks face the same checks, and
      results land in `metrics.json`.

      **Business summary:** Targets: plan-act-review with bounded retries,
      code-graded answers and tool sets, $0.25 per task, and a human
      checkpoint.
    figures: []
    metrics_keys: []
  - id: data
    text_md: |
      **Both document collections are fixed, so expected answers are exact.**
      A corpus is a document collection. The synthetic Atlas Valley handbook
      has 12 short documents written for the experiment. The real-data side
      reuses project 01's search index in read-only mode, which prevents
      changes to the source. It has 3,589 Wikipedia chunks, or small passages,
      on climate, renewable energy, aviation, machine learning, and
      photosynthesis.

      The handbook checks procedures and arithmetic against known answers.
      Wikipedia checks retrieval, meaning the finding of relevant passages,
      over text not curated for this test. The [Wikipedia dataset
      card](https://amm-ds.github.io/portfolio/data-registry/wikipedia/)
      records the source and license.

      The diagram shows how data becomes a grade.

      ```diagram auto-09-agentic-workflows-2
      ```

      Follow the corpora into versioned JSON task files: 15 for tuning and 19
      held out. JSON is a text format for structured records. Versioning makes
      each task change reviewable. Next, follow a recorded run into offline
      grading. The run saves plans, tool calls, answers, and tokens, which are
      pieces of text processed by the model. Offline grading reuses that file
      without a model call or provider. Integrity tests check the pinned
      answers. They compare each answer with real tool output.

      The tools under Details are deliberately restricted: a locked-down
      calculator, fixed conversion tables, keyword and vector search, and a
      per-run notebook. Vector search finds passages by meaning. It uses
      numbers to compare text, not just exact words. In the diagram's held-out
      split, six of the 19 tasks are built to fail.

      **Business summary:** The data: a synthetic 12-document handbook,
      read-only retrieval over 3,589 Wikipedia chunks, and 15 tuning plus
      19 held-out tasks.
    figures: []
    metrics_keys: []
  - id: eda
    text_md: |
      **Code grades every run, and six tasks are built to fail.** The suite
      design targets four risks:

      - Five task types cover the tool surface: lookup, calculation,
        conversion, multi-step chains, and note-taking. Each uses one to
        three tools, so no tool sits untested.
      - Code scores the answer, exact tool set, step count, and time budget.
        Unlike an AI judge, it gives the same verdict on every rerun.
      - Six should-fail probes request an unsupported conversion or a fact
        absent from the corpus. The only correct response is a plain "no",
        without a crash or invented number.
      - Answer-only suites can reward confabulation, meaning an invented
        answer. Probes test whether the workflow refuses instead.

      The grading diagram shows how those design choices become a verdict.

      ```diagram auto-09-agentic-workflows-3
      ```

      Follow a task into the same four checks used for tuning and held-out
      splits. Then inspect the probe box. A pass requires a typed refused
      status (or ok in a legacy record) and a refusal marker, which is a
      recorded signal that the workflow declined. A fabricated number, failed
      or deadline status, or crash fails. This visible path supports grading
      honesty as well as accuracy, and makes re-grading a captured run stable.

      Answer scores cannot reveal extra tool calls, so use the tool-usage
      matrix as a second check. Each row is a tool, each column a task, and
      each cell a call count. Look for calls outside a task's planned set:
      there are none. The record run has 30 planned calls against 30 expected,
      with 100% call precision and 100% tool recall. Call precision is the
      share of actual calls that were planned. Tool recall is the share of
      planned calls that occurred.

      **Business summary:** The grading: code scores answers, exact tool
      sets, step count, and time; should-fail probes pass only on an honest
      no.
    figures:
      - tool_usage_matrix
    metrics_keys: []
  - id: training
    text_md: |
      **The deliverable is an executable graph, not a trained model.** No
      model parameters are learned. The graph is a fixed network of steps that
      controls Plan, Execute, and Critique. Critique revises through Execute,
      never Plan, and audits tool use against the plan. Consequential runs
      pause at a typed approval gate.

      ```diagram auto-09-agentic-workflows-4
      ```

      Read the gate as a state machine, where the current state determines the
      next allowed step. Plan hands a typed plan to the checkpoint. Approval
      runs the tools, rejection returns the plan with feedback, and parking
      freezes state for later. Execute retries failed calls within the cap,
      and Critique takes one revision. Empty search evidence and terminal tool
      failures end as typed refusals; the task deadline cancels an over-time
      run. Every exit is a structured `WorkflowResult` with an ok, refused,
      failed, or deadline_exceeded status. These visible states support
      bounded, auditable control that one large prompt would not expose.

      **Checkpoint resume is a state transition, not a prompt instruction.**
      The saved checkpoint drives the next graph entry point:

      ```python
      state = checkpoint.state
      if decision.approved:
          graph = build_workflow_graph(ExecuteNode)
          return await graph.run(
              state=state,
              deps=WorkflowDeps(model=resolved_model, notebook=Notebook()),
              inputs=ExecuteNode(),
          )

      state.critique_feedback = decision.feedback or (
          "The reviewer rejected the plan without comments; reconsider the approach."
      )
      state.steps_taken.append("checkpoint: rejected → re-plan")
      graph = build_workflow_graph(PlanNode)
      return await graph.run(
          state=state,
          deps=WorkflowDeps(model=resolved_model, notebook=Notebook()),
          inputs=PlanNode(),
      )
      ```

      In this [hitl.py
      excerpt](https://github.com/amm-ds/portfolio/blob/main/projects/09-agentic-workflows/src/agentic_workflows/hitl.py),
      the approved branch resumes at Execute. The rejection branch stores
      feedback and records the re-plan before returning to Plan, matching the
      diagram.

      Tool descriptions are behavioral contracts, or rules for allowed use.
      At the diagram's Execute node, the calculator rejects non-arithmetic
      work, conversion uses fixed factors, retrieval fails loudly if project
      01's index is absent, and the notebook runs only when recording is
      requested. Per-call traces capture name, arguments, latency, result
      size, and success.

      The following measurements apply to the graph path shown above. The
      diagram identifies the work being measured; the numbers come from the
      recorded runs. Each strength has a limit:

      - All 15 tuning tasks passed all four checks: answers, exact tool set,
        step budget, and latency budget. *Limit:* one suite, one endpoint,
        meaning one hosted model service.
      - All 30 captured calls were planned: 100% call precision and tool
        recall, with zero unplanned calls. *Limit:* evidence on this suite
        only.
      - Median latency, the middle task time, was 18.2 s. The p95 latency,
        within which 95% of tasks finished, was 31.1 s against the 60 s
        budget. Usage was ~85k input and ~12k output tokens, costing ~$0.13
        of the $2.00 cap (~$0.0088 per task, cloud-equivalent, not billed).
      - Held out (legacy recorded run): 13/13 answers with exact tool sets, 22
        planned calls, zero unplanned calls, and 5/6 refusals. The legacy h19
        miss exhausted a capped calculator call and returned a failure message
        without a refusal marker; no number was fabricated. A 2026-11-19 live
        run confirms the contracts: 13/13 answers; 6/6
        refusals under the live grader, with h19 a calculator-guard error;
        19/19 budgets — see the [live confirmation](https://github.com/amm-ds/portfolio/blob/main/collaboration/reviews/20261118-live-confirmation/comparison.md).
      - Latency depends on the provider. Hosted held-out tasks ran 9.0–40.9
        s, but 7/9 local-model tasks exceeded 60 s. The difference is provider
        speed, not answer quality. Overall held-out latency passed 12/19.
      - A recorded run demonstrates pause, reject-with-feedback, and re-plan.
        Nothing here demonstrates unattended operation.

      **Business summary:** The legacy tuning run passed 15/15 tasks with
      30/30 calls planned, median latency 18.2 s, and about $0.13 of the
      $2.00 cap. Held-out failures remain visible; the 2026-11-19 live run
      confirms 6/6 refusals under the live grader (h19 a calculator-guard
      error) and 19/19 budgets.
    figures: []
    metrics_keys: []
  - id: evaluation
    text_md: |
      **Running and grading are separate. A live run is captured once, then
      re-scored offline for free.** This separation has three benefits:

      - A run makes provider calls and can spend money. Grading is
        deterministic code over a JSON record, so rechecking needs no key,
        network, or spend.
      - A reviewer can audit the exact record behind the grades, not a
        summary.
      - Anyone can challenge the pilot verdict without paying for another
        run.

      The capture-and-grade diagram shows this audit path.

      ```diagram auto-09-agentic-workflows-5
      ```

      Follow the run into a single JSON capture, then into repeated offline
      grading. The dotted line connects the saved record to its grades. It
      shows why rechecking uses the same evidence without another provider
      call.

      The held-out suite contains 19 tasks: 13 answer tasks and 6 should-fail
      probes, written after tuning froze. It tests prompt overfitting, which
      means adapting to known test shapes instead of new tasks. Records mix a
      hosted endpoint for 10 tasks with a local open-weights model for 9.
      Open weights are publicly available model parameters that can run on
      local hardware. Local runs meter at $0.00. This is cross-model evidence,
      but local latency is not budget-comparable because the 60-second cap
      was tuned on the hosted provider. The local model still had to produce
      the same plans, calls, and refusals.

      Use the cost-and-latency chart to compare the same record run with its
      budgets. For each task, inspect input and output token bars,
      cloud-equivalent cost, and latency against the 60-second line. No hosted
      latency point crosses that line. The misses come from slow local
      generation, not wrong answers. Cost stays at $0.13 of the $2.00 suite
      cap, about $0.0088 per task at the labelled rate card. This is an
      estimate, not a bill.

      Together, the audit path and budget evidence support a supervised pilot
      with a reviewer watching. They do not establish open-ended or new-domain
      performance.

      **Business summary:** Runs are captured once and re-scored offline for
      free. Held out: 13/13 answers with exact tool sets, 5/6 refusals, 18/19
      step budgets, and 12/19 latency budgets.
    figures:
      - cost_latency_bars
    metrics_keys:
      - agentic_suite
  - id: results
    text_md: |
      **The legacy graders recorded refusal, step, and latency failures.** Start
      with the suite-summary chart. Its visible short bar is held-out refusal
      at 5/6; tuning and held-out answer/tool bars are full. The chart does not
      plot held-out step or latency results, which passed 18/19 and 12/19.

      Read across the answer and tool rows for the split-level results. The
      hosted tuning suite has 15/15 answers, 15/15 exact tool sets, all step
      and latency budgets met, and zero unplanned calls. Across 19 held-out
      tasks, it has 13/13 answers with exact tool sets, 22 planned calls, and
      zero unplanned calls. Latency misses occur on local-model tasks because
      of slow generation, not answer quality.

      The short refusal bar corresponds to one specific legacy failure. The
      task used both bounded retries on an out-of-bounds calculator call, then
      exited with a failure message lacking a refusal marker. No number was
      made up. The replacement typed-refusal behavior is covered offline and
      confirmed by the 2026-11-19 live run: 6/6 under the live grader, with
      h19 a calculator-guard error.

      Next, use the node-waterfall chart to inspect time within the tasks that
      passed the suite-summary latency check:

      - **Latency:** Median latency is 18.2 s and p95 latency is 31.1 s
        against the 60 s budget. Each task is a horizontal stack of Plan,
        Execute, and Critique visits. Segment width shows elapsed time. Look
        for one segment ballooning, which would identify a slow node. The
        record run needed no retries, so only planned node visits render.
        Even the p95 task, t15, finishes at 31.1 s.
      - **Cost:** For the same passing tasks, cost is ~$0.13 of the $2.00
        suite cap, about $0.0088 per task at the labelled cloud rate card.
        The suite chart records passes rather than dollar amounts; this is a
        measured-run estimate, not a bill.
      - **Stability:** Two hosted repeat passes kept 15/15 answers and exact
        tool sets (Details). These repeats are separate from the single-run
        bars and do not establish cross-provider repeatability.

      **Business summary:** Final grades: 15/15 answers and exact tool sets on
      the tuning suite; 13/13 answers and 5/6 refusals held out; zero
      unplanned calls; median latency 18.2 s.
    figures:
      - suite_summary
      - node_waterfall
    metrics_keys:
      - agentic_suite
  - id: conclusions
    text_md: |
      ## Results summary

      The legacy record run passed 15/15 fixed tasks with exact tool sets and
      step budgets. With tuning frozen, held-out results were 13/13 answers
      with exact tool sets, 5/6 should-fail probes refused, 18/19 step budgets,
      and 12/19 latency budgets. Across all 52 captured calls, none was
      unplanned. Median tuning latency was 18.2 s against the 60 s budget.
      Estimated cost was about $0.13 of the $2.00 suite cap. The setup uses a
      typed plan-act-critique graph, deterministic graders, an 8-step budget,
      an enforced 60 s task deadline, and a $0.25 per-task spending cap. See the [full
      evaluation report](https://amm-ds.github.io/portfolio/projects/09-agentic-workflows/).

      ## What the experiment taught

      - Deterministic grading caught behavior that answer scores missed.
      - Tightened tool descriptions eliminated unplanned calls in the record
        run: 30/30 planned calls, 100% call precision, and 100% tool recall.
      - Should-fail probes exposed one legacy refusal miss after a terminal
        calculator failure, not confabulation. Typed refusal, no-evidence, and
        deadline exits now have offline regressions; live efficacy is unmeasured.
      - Budgets depend on the provider. The local model exceeded the hosted
        60 s cap on 7/9 tasks. Local runs cost $0 but are not
        budget-comparable.
      - Held-out checks guard against overfitting, but the sample of 19 tasks
        is a check, not a guarantee of generalization to new tasks.
      - Two hosted repeat passes kept 15/15 answers and exact tool sets, but
        repeats varied in latency and step count.

      ## Exact numbers

      The tool table defines the fixed capabilities behind those results. AST
      means abstract syntax tree, a structured representation that lets the
      calculator permit arithmetic only. FAISS is a vector-search library.
      MiniLM converts text into numeric vectors for meaning-based search.
      `PrefixedToolset` groups tools under distinct names.

      | tool | implementation | deterministic basis |
      |---|---|---|
      | `calculator` | locked-down AST evaluator | fixed arithmetic |
      | `unit_convert` | fixed conversion table | table lookup only |
      | `search_handbook` | keyword search | fixed 12-document corpus |
      | `search_documents` | FAISS + MiniLM over project 01 | pre-built, read-only index |
      | `note_store` | per-run notebook | same input, same note |
      | `math_*` toolset | `PrefixedToolset` composition | fixed functions, no name collisions |

      | held-out split | n | result |
      |---|---|---|
      | answer tasks | 13 | answer success 13/13; exact tool set 13/13; 22 planned calls, zero unplanned |
      | should-fail probes | 6 | graceful refusal 5/6 |

      The recorded t15 trace over project 01's real corpus makes one result
      concrete: two `search_documents` lookups, then
      `calculator(expr='2022 - 1903')`, producing answer 119 with zero retries
      in 31.1 s. The same trace used 7,709 input and 862 output tokens.
      `data/checkpoint.json` shows pause, reject-with-feedback, and re-plan.

      **Cost basis:** Cloud-equivalent estimates use the public reference card
      at $1.00/Mtok input and $4.00/Mtok output. Mtok means one million tokens.
      The hosted key uses membership quota, not billed spend. Every hosted run
      stayed under the $2.00 suite cap. Per-run usage is recorded in `reports/`.

      ## Protocol

      Use the protocol diagram to connect the summary above to the stored run
      and its grades. It shows the process for reproducing the verdicts, not
      independent evidence of new-task performance.

      ```diagram auto-09-agentic-workflows-6
      ```

      - Follow the capture step: a run is saved once as
        `data/run_records.json`, including plans, tool calls, answers, per-node
        tokens, and latency. It is then graded offline. The `evaluate` DVC
        stage needs no provider. DVC is the repository's data and pipeline
        versioning tool.
      - Follow the grading step: answer tasks use four graders and probes use
        refusal, step, and latency graders. `AnswerSuccess` requires an ok
        status and all expected keywords. `ToolSelection` requires exact
        tool-set equality. `StepBudget` allows 8 steps. The runner enforces
        the 60 s task deadline and `LatencyBudget` grades recorded duration.
        `RefusalSuccess` requires a refused status (ok for legacy records)
        plus a refusal marker. A fabricated number, failure, deadline, or crash fails.
      - Spending caps are $0.25 per task and $2.00 per suite at the
        cloud-equivalent card. Local runs meter at $0.00.

      ## Limits

      - The terminal-outcome and deadline changes have deterministic offline
        tests and one live confirmation (2026-11-19): 6/6 refusals under the
        live grader, with h19 a calculator-guard error. Both runs are single
        runs of 19 tasks, so all published rates remain single-run records.
      - The held-out sample has 19 tasks. It checks overfitting and
        confabulation, but does not guarantee generalization.
      - Tasks are fixed research-operations procedures over two corpora.
        Retrieval fuzziness, new domains, and broader refusal coverage are
        untested.
      - The 60 s budget is hosted-tuned. The local model exceeded it on 7/9
        tasks, up to 1,430.9 s, and produced the only step-budget miss: h17
        took 10 steps against the limit of 8. Local runs cost $0 but are not
        comparable on wall time, meaning elapsed real time.
      - Hosted repeats varied in latency and step count, with one step-budget
        miss each. Cross-provider repeatability is not established.
      - A supervised pilot needs an external review team and production tasks.
        Open-ended autonomy stays out of scope.

      **Business summary:** The record run passed 15/15 tuning tasks and
      13/13 held-out answers, with 5/6 refusals, at about $0.10–0.15 per
      suite and zero unplanned calls. The evidence supports a supervised
      pilot, not unattended use.
    figures: []
    metrics_keys: []
key_concepts:
  - "**Plan-act-review loop:** The agent plans structured steps, uses only pre-approved tools, and checks its work against the plan before answering."
  - "**Human checkpoint:** Consequential runs pause for approval, rejection with feedback, or later review. Routine runs stay automatic."
  - "**Deterministic graders, not model judges:** Code scores answers, exact tool sets, budgets, and refusals, so the same record always gets the same verdict."
  - "**Should-fail probes:** Unanswerable tasks pass only on an honest \"no\", exposing invented answers that answer-only suites can reward."
  - "**Recorded run, offline grading:** A run is saved once as JSON and re-scored for free, without another provider call."
  - "**Behavioral tool contracts:** Tool descriptions state what each tool may do and make unplanned calls visible in per-call traces."
