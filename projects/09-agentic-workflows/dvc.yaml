stages:
  prepare:
    cmd: uv run python -m agentic_workflows.cli prepare
    deps:
      - src/agentic_workflows
      - params.yaml
    outs:
      - data/tasks.json

  run:
    cmd: uv run python -m agentic_workflows.cli run-all
    deps:
      - data/tasks.json
      - src/agentic_workflows
      - params.yaml
    outs:
      - data/run_records.json

  evaluate:
    cmd: uv run python -m agentic_workflows.cli evaluate
    deps:
      - data/run_records.json
      - data/tasks.json
      - src/agentic_workflows
      - params.yaml
    outs:
      # reports/report.html is intentionally NOT a DVC out: it is committed to
      # git (the showcase API serves it at /projects/<id>/report) — tracking it
      # in both places makes dvc commit refuse to record hashes.
      - reports/figures
    metrics:
      - reports/metrics.json

  evaluate_kimi:
    cmd: uv run python -m agentic_workflows.cli run-all --records-path data/kimi_run_records.json && uv run python -m agentic_workflows.cli run-all --heldout --records-path data/kimi_heldout_records.json && uv run python -m agentic_workflows.cli evaluate --records-path data/kimi_run_records.json --reports-dir reports/kimi-for-coding && uv run python -m agentic_workflows.cli evaluate --heldout --records-path data/kimi_heldout_records.json --reports-dir reports/kimi-for-coding && uv run python -m agentic_workflows.cli compare-challenger
    deps:
      - data/tasks.json
      - data/tasks_heldout.json
      - src/agentic_workflows
      - params.yaml
    outs:
      - data/kimi_run_records.json
      - data/kimi_heldout_records.json
      - reports/kimi-for-coding
      - reports/figures/kimi_workflow_comparison.json
    metrics:
      - reports/kimi_comparison.json
