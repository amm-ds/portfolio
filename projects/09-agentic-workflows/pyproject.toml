[project]
name = "09-agentic-workflows"
version = "0.1.0"
description = "Portfolio project 09-agentic-workflows."
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "plotly>=5.24",
    "polars>=1.9",
    "numpy>=2.1",
    "pydantic-ai>=2.55",
    "pydantic-evals>=2.55",
    "portfolio-core",
    "portfolio-eval",
]

[project.scripts]
agentic_workflows = "agentic_workflows.cli:app"

[tool.uv.sources]
portfolio-core = { workspace = true }
portfolio-eval = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_workflows"]
