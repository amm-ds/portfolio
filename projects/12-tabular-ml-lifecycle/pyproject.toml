[project]
name = "12-tabular-ml-lifecycle"
version = "0.1.0"
description = "Portfolio project 12-tabular-ml-lifecycle."
requires-python = ">=3.12"
dependencies = [
    "scikit-learn>=1.5",
    "typer>=0.12",
    "plotly>=5.24",
    "numpy>=2.1",
    "pandas>=2.0",
    "optuna>=4.0",
    "lightgbm>=4.0",
    "torch>=2.4",
    "pyyaml>=6.0",
    "portfolio-core",
    "portfolio-eval",
]

[project.scripts]
tabular_ml_lifecycle = "tabular_ml_lifecycle.cli:app"

[tool.uv.sources]
portfolio-core = { workspace = true }
portfolio-eval = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tabular_ml_lifecycle"]
