key_concepts:
- '**Seasonal-naive floor:** predict the count at the same hour last week. Every candidate must beat this simple baseline,
  with an interval on the gain.'
- '**Frozen test window:** each candidate receives one final-window score. Every modeling choice uses validation; ablation
  test scores are post-freeze diagnostics.'
- '**Positional lags:** past-only shifts over the observed sequence. They make the treatment of missing hours explicit in
  the feature contract.'
- '**Feature-selection record:** mutual information and a ridge permutation probe inform selection; the committed run drops atemp
  and keeps temp despite atemp having slightly higher mutual information.'
- '**Hand-written training loop:** the PyTorch MLP exposes seeded initialization, Huber loss, early stopping, and per-epoch
  evidence of overfitting.'
- '**Paired block bootstrap:** resample the same intact day/week blocks for both models to test sensitivity to hourly serial
  dependence.'
figure_captions:
  rentals_by_hour_season: Mean rentals by hour, with one panel per season. Compare peak timing and height. The commuter double
    peak persists; spring is the lowest panel and winter peaks near summer, reflecting UCI label quirks.
  temp_vs_rentals: Rentals versus temperature, colored by season. Compare equal temperatures across colors. Ridership rises
    within a season's band, but the same temperature can map to different demand by season.
  correlation_heatmap: Correlation heatmap for numeric features and rentals. Stronger colors indicate closer movement together.
    temp and atemp are near-duplicates (r = 0.99), so pruning drops atemp and keeps temp.
  mi_lollipop: Mutual-information ranking of 16 candidate features on the training window. Longer stems mean more information.
    Grey stems mark pruned fields; the committed run drops atemp despite its slightly higher MI, and past-count lags dominate.
  mlp_loss_curves: Per-epoch train and validation MAE for the PyTorch MLP, with the best epoch marked. Training falls early then plateaus near 20–21
    while validation stalls, exposing the gap that regularization controls address.
  learning_curves: Validation MAE versus training-set fraction for tuned LightGBM and the MLP. LightGBM still descends at the full fraction and the MLP is non-monotone;
    these curves do not establish a row-count ceiling or early-stopping benefit.
  model_comparison: One frozen test MAE per candidate, with the seasonal-naive floor as the dashed grey reference. Compare
    points with that reference. The served model is the validation leader, never the lowest test-score selector.
  residual_heatmap: Served-model mean residuals (actual minus forecast, in rentals) by hour x season and hour x weather situation
    on the frozen test window, on one shared diverging scale centered at zero. Red means over-forecast and blue means under-forecast;
    compare colors across both panels to locate structured misses.
  residual_vs_fitted: Residual versus fitted value on the test window. Read vertical spread from left to right. Spread widens
    with predicted demand; mean residual is +9.2 overall and +28.6 for fitted 300–600, indicating under-forecast bias.
  ablation_dotplot: MLP regularization ablation (2x2x2) on validation MAE, with teal marking the shipped configuration. Compare
    the lowest validation point with teal. Early stopping matters; variant test scores appear separately as post-freeze diagnostics.
  bootstrap_ci: Three histograms of 2,000 paired resamples each — hourly rows, 24-hour blocks, and 168-hour blocks — for the
    served-model vs floor MAE gain on the frozen test window. The 95% CIs are [52.5, 63.1], [44.2, 71.8], and [38.8, 73.4].
    Wider block intervals show serial-dependence sensitivity, not model-selection variance.
