project_id: 12-tabular-ml-lifecycle
headline: "Champion the tabular MLP (PyTorch) cuts hourly rental forecasting error to 25.4 MAE from 83.2 for the seasonal-naive floor on the scored-once 8-week test window (95% bootstrap CI 52.5-63.1 rentals/hour, excluding zero)."
data_note: "Real UCI Bike Sharing hour.csv (17,379 hourly rows, Capital Bikeshare 2011-2012, sha256-pinned) plus a seeded synthetic CI twin; time-based split."
limits: "The test window is scored once per candidate and no modeling choice used it; lags are positional around ~1% missing hours; one city, two seasons."
short_version: |
  Real UCI Capital Bikeshare hourly demand (17,379 rows): a seeded ladder from
  seasonal-naive to LightGBM and a hand-written PyTorch MLP reaches 25.4 MAE on the
  scored-once 8-week test vs 83.2 for the floor - a 57.8/hour gain (95% CI 52.5-63.1);
  validation picked the MLP.
sections:
  - id: background
    text_md: |
      **The deliverable is one number: bike rentals next hour.** A fleet team
      uses it to place bikes. The study follows one table from source checks
      to a final forecast. It pins the data, splits records by time, uses only
      past information, and compares models of increasing complexity.

      The starting point is a seasonal-naive forecast: the count at the same
      hour last week. The final challenger is a multi-layer perceptron (MLP),
      a neural network for tables, trained in PyTorch, a Python neural-network
      library.

      Follow `12-lifecycle-pipeline` from input to test. It shows how quality
      checks and validation choices protect the final 8-week test window,
      which is scored once.

      ```diagram 12-lifecycle-pipeline
      ```

      **Business summary:** On real Capital Bikeshare hourly data, the measured
      challenger must beat the seasonal-naive floor on that window, with
      uncertainty attached to the gain.
    figures: []
  - id: objectives
    text_md: |
      **Three checks decide whether the forecast is useful.** Read
      `auto-12-tabular-ml-lifecycle-1` as a sequence: establish the floor,
      compare candidates fairly, then inspect the remaining errors.

      - **Beat the floor.** A candidate must improve on "same hour last week".
        The estimated gain needs an interval that excludes zero, not just a
        promising average.
      - **Compare model families fairly.** A linear model fits straight-line
        relationships. Boosted trees combine many small decision trees that
        correct earlier errors. The MLP learns more flexible patterns from the
        same tabular features.
      - **Locate the errors.** A residual is the actual count minus the
        forecast. Residual maps show whether misses cluster by hour, season,
        or weather.

      The diagram also ties these checks to four safeguards on one fixed split:

      - The final 8 weeks form the test set and are scored exactly once.
      - Every candidate uses a fixed random seed, so its run can be repeated.
      - Loss curves track error during training. Learning curves show how scores
        change with more rows. Controlled on/off comparisons test
        regularization, methods that discourage overfitting. Overfitting means
        learning training noise in a way that hurts predictions on new data.
      - A paired bootstrap confidence interval (CI) estimates a plausible range
        for the gain by resampling the same rows for both models.

      ```diagram auto-12-tabular-ml-lifecycle-1
      ```

      **Business summary:** Success means a reproducible margin over the
      seasonal-naive floor on the scored-once 8-week window, a fair model
      comparison, and residual maps that locate the remaining error.
    figures: []
  - id: data
    text_md: |
      **One real series and one synthetic twin feed the same time-based pipeline.**
      Follow `auto-12-tabular-ml-lifecycle-2` from each input to the shared
      checks and split. The real input is the University of California, Irvine
      (UCI) Bike Sharing series: 17,379 hourly rows for Capital Bikeshare in
      Washington D.C. during 2011-2012. A pinned SHA-256 checksum, a fixed
      fingerprint for the downloaded file, verifies the source. The
      [dataset contract](https://amm-ds.github.io/portfolio/data-registry/bike-sharing/)
      records those details. The seeded synthetic twin recreates the same
      columns offline for continuous integration (CI), meaning automated tests
      that run without network access.

      ```diagram auto-12-tabular-ml-lifecycle-2
      ```

      Two facts visible in this data path shape the features. First, `casual`
      and `registered` sum to the target, so both are dropped at load. Using
      them would cause target leakage: giving the model answer-derived fields
      that would not be available for a real forecast. Second, 165 hours are
      missing in the January 2011 outage pattern, about 1% of rows. Lag
      features, which carry counts from earlier observations, therefore shift
      positions in the observed sequence rather than assume a perfect hourly
      grid. The data-quality gate allows at most 2% missing rows.

      The diagram ends with three time-ordered partitions. Training uses the
      earliest 14,523 rows after the lag warm-up. Validation uses the next 8
      weeks to choose models and settings. The final 8 weeks, or 1,344 rows,
      remain the scored-once test window.

      **Business summary:** A verified real series and an offline test twin
      support the same pipeline. Answer-derived columns never become features,
      and the time split protects the final test window.
    figures: []
  - id: eda
    text_md: |
      **The figures show a commuter pattern whose size changes by season.** In
      `rentals_by_hour_season`, compare the four panels. Each has a morning
      peak at 08h and an evening peak at 17-18h. Winter is flatter and lower,
      so both hour and season matter.

      In `temp_vs_rentals`, compare points at the same temperature but with
      different season colors. Rentals generally rise with temperature within
      a season, yet equal temperatures can have different demand across
      seasons. Temperature alone cannot stand in for the calendar.

      In `correlation_heatmap`, look for the strongest color contrasts. The
      correlation coefficient `r` measures how closely two numeric fields move
      together. Here `temp` and `atemp`, meaning feels-like temperature, reach
      r = 0.99. They are near-duplicates, so the later feature rule must remove
      one.

      These patterns set four judging rules:

      - Mean absolute error (MAE) comes first. It is the average absolute miss
        in rentals per hour, matching the business unit.
      - Root mean squared error (RMSE) is secondary. It penalizes large misses
        more heavily than small ones.
      - Mean absolute percentage error (MAPE) uses a denominator floored at 1
        rental. Without that floor, near-zero hours would dominate the score.
      - Every candidate must beat the seasonal-naive floor.

      **Business summary:** The figures reveal persistent commute peaks,
      seasonal changes in scale, and duplicate temperature fields. MAE remains
      the primary measure, with a floored MAPE and a seasonal-naive comparator.
    figures: [rentals_by_hour_season, temp_vs_rentals, correlation_heatmap]
  - id: training
    text_md: |
      **All 26 data-quality (DQ) checks pass before fitting a model.** The
      `mi_lollipop` figure then shows feature selection on the training window.
      Mutual information (MI) measures how much a feature reveals about the
      target, in units called nats. The three past-count lags rank first at
      MI 0.89 / 0.76 / 0.71 nats, followed by the cyclical hour pair, two fields
      that represent the repeating hour as a circle. Longer stems indicate
      higher MI. Grey stems mark fields pruned as the lower-MI member of a
      correlated pair.

      A second check, permutation importance, measures the validation MAE
      increase after shuffling one feature. The probe is ridge, a linear model
      that penalizes large coefficients. It agrees with the MI ranking. The
      correlated-pair rule resolves the heatmap's near-duplicate at
      |r| = 0.987: `atemp` drops and `temp` stays. Fifteen of 16 candidate
      features enter the model ladder.

      Every run uses a fixed seed. LightGBM uses deterministic settings, meaning
      identical inputs produce identical outputs, and one processing thread.
      The forest uses one job, and the MLP uses one thread with seeded
      shuffling. These controls make the training diagnostics repeatable.

      - **Seasonal-naive floor:** validation MAE is 88.7 rentals.
      - **Ridge:** validation MAE reaches 68.9. A random forest, which averages
        many decision trees, reaches 39.5. Their scores show substantial
        learnable signal around the lags.
      - **LightGBM:** this boosted-tree library is tuned with Optuna, a
        hyperparameter search tool. Hyperparameters are settings chosen before
        training. The seeded study finishes 50/50 trials within 240 s, using
        validation MAE and median pruning to stop weak trials. It selects
        LightGBM at 34.4.
      - **Hand-written MLP:** an 8-dimensional embedding turns the raw hour
        into eight learned numeric values beside standardized features, which
        are rescaled to comparable ranges. AdamW adjusts the network weights.
        Dropout 0.2 randomly hides units during training, and weight decay
        1e-4 penalizes large weights. Huber loss reduces the influence of very
        large errors in standardized-target space. Early stopping halts after
        validation stops improving and keeps the best checkpoint among 47
        epochs, complete passes through the training data. It reaches 34.2.

      Read `mlp_loss_curves` at the marked best epoch. Training loss keeps
      falling while validation stalls, showing why the controls are needed.
      In `learning_curves`, compare the tuned tree and MLP as the training
      fraction grows. Both flatten near the full set, so adding rows alone is
      unlikely to remove the remaining error.

      The regularization ablation, a controlled comparison with settings turned
      on or off, supports early stopping: every early-stopping-off row worsens
      validation MAE. Dropout and weight decay sit within noise on this window.
      The results section's dot plot shows that comparison.

      **Checkpoint on validation and restore the best state.** Patience stops
      the loop after no improvement; it does not choose the final weights.

      ```python
      if val_mae < best_val:
          best_val = val_mae
          self.history.best_epoch = epoch + 1
          best_state = {
              k: v.clone() for k, v in self.model.state_dict().items()
          }
          patience_left = mlp.patience
      elif early_stopping:
          patience_left -= 1
          if patience_left <= 0:
              break

      if best_state is not None and early_stopping:
          self.model.load_state_dict(best_state)
      ```

      The excerpt from [mlp.py](https://github.com/amm-ds/portfolio/blob/main/projects/12-tabular-ml-lifecycle/src/tabular_ml_lifecycle/mlp.py)
      shows the checkpoint rule behind the loss-curve interpretation.

      **Business summary:** Validation selects the tabular MLP at 34.2 MAE
      against the floor's 88.7. The training figures expose overfitting and
      diminishing returns from more rows, while the ablation supports early
      stopping.
    figures: [mi_lollipop, mlp_loss_curves, learning_curves]
    metrics_keys: [seasonal_naive, ridge, random_forest, lightgbm_hpo, mlp]
  - id: evaluation
    text_md: |
      **The measurement chain is fixed before the test scores appear.** Follow
      `auto-12-tabular-ml-lifecycle-3` from validation selection to one test
      score per candidate. No test number feeds a modeling choice. The diagram
      then pairs each champion row with the same floor row for 2,000 bootstrap
      resamples. This interval reflects hour-to-hour row noise, not data volume
      or model-selection uncertainty.

      ```diagram auto-12-tabular-ml-lifecycle-3
      ```

      In `model_comparison`, compare each MAE bar with the dashed
      seasonal-naive reference. The floor scores 83.2 and the champion 25.4.
      The average gain is 57.8 rentals/hour, with 95% CI [52.5, 63.1], which
      excludes zero. MAPE stays high for every candidate because hourly counts
      approach zero at 4h. The denominator floor of 1 rental limits that effect,
      but MAE remains the primary measure.

      In `residual_heatmap`, read the hour-by-season panel beside the
      hour-by-weather panel. Spring rush hours (7-8h, 17h) are over-forecast by
      up to 59 rentals. Winter morning peaks are under-forecast by up to 51.
      Clear-weather mornings (w1-w2 at 8h) need roughly 40 more bikes than the
      model predicts. These clusters locate error that a single average hides.

      In `residual_vs_fitted`, compare vertical spread across the predicted
      demand level. The spread widens as fitted values rise, so high-demand
      hours have larger absolute misses. The points remain centered on zero,
      so the figure shows no global bias to correct.

      This protocol prevents test-driven selection. One test window confirms
      the validation choice, but it does not guarantee deployment performance.

      **Business summary:** The tabular MLP beats the floor by 57.8
      rentals/hour (95% CI 52.5-63.1, excluding zero) on an untouched test
      window. The residual figures locate the remaining error by rush hour,
      season, and weather.
    figures: [model_comparison, residual_heatmap, residual_vs_fitted]
  - id: results
    text_md: |
      **Separate the candidate ledger from the regularization evidence.** Use
      the exact table for model scores and `ablation_dotplot` for the effects
      of switching MLP controls on or off. The ablation figure does not
      establish the champion-versus-floor margin.

      - The table records the decision-relevant margin: **83.2 → 25.4 test MAE,
        or 57.8 rentals/hour, with 95% CI [52.5, 63.1]** against the
        seasonal-naive floor. Validation chose the champion before this single
        test confirmation. The CI covers row noise only.
      - In `ablation_dotplot`, look for the lowest validation point and compare
        it with the teal shipped configuration. A dropout-off row reaches 32.1,
        about 2 rentals better, which is inside row noise. The pre-registered
        configuration, meaning the one fixed before final scoring, therefore
        stands. All four early-stopping-off rows worsen validation MAE. Test
        scores are recorded once per variant and never select a variant.
      - The table also shows a statistical dead heat between MLP and LightGBM.
        Validation selects the MLP at 34.2 versus 34.4. On the test pass,
        LightGBM's MAE is 0.06 rentals lower, while the MLP has better RMSE at
        39.3 versus 40.2. The MLP remains the deliverable because its training
        loop and controls are visible and measured.
      - Neither the table nor the ablation figure measures transfer. The study
        covers one city and two seasons, with holidays reduced to binary flags,
        meaning simple yes/no indicators. Use on another fleet or regime is
        plausible but unproven.

      Exact numbers (run ids in `reports/metrics.json`):

      | candidate | val MAE | test MAE | test RMSE | test MAPE % |
      |---|---|---|---|---|
      | seasonal naive (floor) | 88.7 | 83.2 | 134.0 | 153.2 |
      | ridge | 68.9 | 51.1 | 77.8 | 86.4 |
      | random forest | 39.5 | 26.3 | 45.7 | 25.7 |
      | LightGBM (Optuna HPO) | 34.4 | 25.4 | 40.2 | 27.4 |
      | tabular MLP (PyTorch) | 34.2 | 25.4 | 39.3 | 33.7 |

      Champion vs floor: +57.8 rentals/hour point estimate, 2,000 paired
      bootstrap resamples, 95% CI [52.5, 63.1], significant_95 = true.

      **Business summary:** The tabular MLP champion reaches 25.4 test MAE
      against the 83.2 floor, with bootstrap support. The ablation figure
      supports early stopping, and the remaining structured error leaves room
      to improve rush-hour forecasts.
    figures: [ablation_dotplot]
  - id: conclusions
    text_md: |
      ## Results summary

      In `bootstrap_ci`, look at the histogram of paired improvements and the
      interval bounds. The tabular MLP records 25.4 test MAE against 83.2 for
      the seasonal-naive floor. The gain is 57.8 rentals/hour with a 95% paired
      bootstrap CI of [52.5, 63.1] over the scored-once 8-week window. The
      interval excludes zero. Validation MAE chose the champion at 34.2 before
      the test window confirmed it once. This figure quantifies row noise; it
      does not measure selection variance or deployment transfer.
      [Full evaluation report](https://amm-ds.github.io/portfolio/projects/12-tabular-ml-lifecycle/).

      ## What the experiment taught

      - The floor is the first model to build. The `bootstrap_ci` interval on
        the gain, not the point estimate alone, is the ship/no-ship signal.
      - Feature selection agreed across three lenses. Mutual information ranked
        past-count lags first, validation permutation importance agreed, and
        correlated-pair pruning resolved the r = 0.987 temp/atemp duplicate by
        rule.
      - On these tabular features, the tuned boosted tree and hand-written MLP
        are effectively tied. The MLP remains the deliverable because its loop,
        controls, and per-epoch evidence are explicit.
      - The ablation separates the load-bearing control, early stopping, from
        dropout and weight decay effects that sit within noise.
      - Positional lags around 1% missing hours are a stated convention. The
        data contract records it, and the gate bounds the missing fraction.

      ## Exact numbers

      Test window: the final 8 weeks of the 2011-2012 hourly series (1,344 rows),
      scored once per candidate. MAE/RMSE in rentals/hour.

      | candidate | val MAE | test MAE | test RMSE | test MAPE |
      |---|---|---|---|---|
      | seasonal-naive floor | 88.65 | 83.20 | 134.02 | 153.2% |
      | ridge | 68.87 | 51.09 | 77.78 | 86.4% |
      | random forest | 39.50 | 26.32 | 45.67 | 25.7% |
      | lightgbm_hpo | 34.40 | 25.37 | 40.21 | 27.4% |
      | mlp (champion) | 34.22 | 25.43 | 39.32 | 33.7% |

      Champion-vs-floor MAE gap: 57.77 rentals/hour, 95% paired bootstrap CI
      [52.49, 63.07] over 2,000 resamples. The interval shown in `bootstrap_ci`
      excludes zero. LightGBM hyperparameter optimization (HPO) completed 50/50
      Optuna trials inside the 240 s budget, with best validation MAE 34.397.
      For the MLP ablation (validation/test MAE), every es=off row runs to the
      150-epoch cap and scores worse (27.37 vs 24.96 test MAE). The best
      validation row is dropout-off + es-on (32.13/24.96), about 2 rentals
      inside noise, so the pre-registered configuration stands.

      ## Protocol

      - **Split:** the final 8 weeks (1,344 rows) are scored once. The previous
        8 weeks are validation for HPO, early stopping, champion selection, and
        ablation. Training uses everything earlier, 14,523 rows after the
        168-row lag warm-up. Lag features read only the past. The UCI zip is
        SHA-256-gated, the 165 real missing hours are bounded by a 2% DQ gate,
        and lags are positional.
      - **Judging:** MAE in rentals/hour is primary, RMSE secondary, and MAPE
        is floored at 1 rental. The seasonal-naive floor is the comparator.
      - **Uncertainty:** 2,000 paired bootstrap resamples of the per-row MAE
        difference produce the CI in `bootstrap_ci`. It prices row noise, not
        selection.
      - **Synthetic twin:** the same-schema, seeded generator supports CI
        evidence only and never substitutes for real-data results.
      - **Compute:** seed 42 throughout; train stage 50.8 s plus evaluate 0.5 s
        on a 16-core arm64 laptop, with torch pinned to one thread.

      ## Limits

      - Model selection, early stopping, and the ablation choice used validation
        only. The test window is scored once per candidate, so no test-set
        optimism is hiding in the picks. The margin is still a single-window
        confirmation, not a deployment guarantee.
      - Lags are positional. Around the 165 missing hours, "same hour last
        week" drifts by an hour of wall-clock time.
      - MAPE denominators are floored at 1 rental. Near-zero hours keep MAPE
        high for every candidate, so read MAE first.
      - One city, two seasons, and holiday effects as binary flags limit the
        evidence. Transfer is plausible, not measured.
      - The MLP vs LightGBM test-MAE gap (25.43 vs 25.37) sits inside noise.
        The champion label comes from validation, not a neural-network victory.

      **Business summary:** The MLP's measured gain over the seasonal-naive
      floor has bootstrap support on one protected test window. The result is
      useful evidence for this dataset, with explicit limits on noise, missing
      hours, and transfer.
    figures: [bootstrap_ci]
roadmap:
  - status: delivered
    text: "Built the reproducible pipeline: sha256-pinned UCI ingest, 26 DQ gates, time-based split with a scored-once test window, seeded synthetic CI twin."
  - status: delivered
    text: "Engineered leakage-safe features (cyclical encodings, past-only lags) with MI + permutation + correlation-pruned selection written into a feature contract."
  - status: delivered
    text: "Ran the seeded ladder — seasonal naive, ridge, random forest, LightGBM with time-budgeted Optuna HPO, hand-written PyTorch MLP — and selected the champion on validation."
  - status: delivered
    text: "Measured the champion vs floor gap with 2,000 paired bootstrap CIs on the scored-once test window; CI excludes zero."
  - status: delivered
    text: "Shipped overfitting-control artifacts: per-epoch MLP loss curves, learning curves, 2x2x2 regularization ablation, residual slices by hour/season/weather."
key_concepts:
  - "**Seasonal-naive floor:** predict the count at the same hour last week. Every candidate must beat this simple baseline, with an interval on the gain."
  - "**Scored-once test window:** the final 8 weeks are read exactly once per candidate. Every modeling choice uses validation instead."
  - "**Positional lags:** past-only shifts over the observed sequence. They make the treatment of missing hours explicit in the feature contract."
  - "**Three-lens feature selection:** mutual information, validation permutation importance, and correlated-pair pruning must agree before a feature enters the model."
  - "**Hand-written training loop:** the PyTorch MLP exposes seeded initialization, Huber loss, early stopping, and per-epoch evidence of overfitting."
  - "**Paired bootstrap CIs:** resample the same rows together across models so the confidence interval reflects hour noise, not data volume."
figure_captions:
  rentals_by_hour_season: Mean rentals by hour, with one panel per season. Compare peak timing and height. The commuter double peak persists while winter peaks are lower, so season and hour both belong in the model.
  temp_vs_rentals: Rentals versus temperature, colored by season. Compare equal temperatures across colors. Ridership rises within a season's band, but the same temperature can map to different demand by season.
  correlation_heatmap: Correlation heatmap for numeric features and rentals. Stronger colors indicate closer movement together. temp and atemp are near-duplicates (r = 0.99), so pruning drops atemp and keeps temp.
  mi_lollipop: Mutual-information ranking of 16 candidate features on the training window. Longer stems mean more information. Grey stems mark the lower-MI member of a pruned correlated pair, and the three past-count lags dominate.
  mlp_loss_curves: Per-epoch train and validation MAE for the PyTorch MLP, with the best epoch marked. Training keeps improving while validation stalls, exposing the overfitting gap that regularization controls address.
  learning_curves: "Validation MAE versus training-set fraction for tuned LightGBM and the MLP. Both curves flatten toward the full set, indicating that feature information, not row count, is the immediate ceiling."
  model_comparison: "One scored-once test MAE per candidate, with the seasonal-naive floor as the dashed grey reference. Compare bar heights with that reference. The champion is the validation leader, never the lowest test-score selector."
  residual_heatmap: Champion residuals by hour x season and hour x weather situation. Darker or lighter slices locate structured misses and show where a future feature could help.
  residual_vs_fitted: Residual versus fitted value on the test window. Read vertical spread from left to right. Spread widens with predicted demand while remaining centered on zero, indicating larger high-demand misses without global bias.
  ablation_dotplot: "MLP regularization ablation (2x2x2) on validation MAE, with teal marking the shipped configuration. Compare the lowest validation point with teal. The dropout-off leader is inside row noise, while early stopping clearly matters."
  bootstrap_ci: Histogram of 2,000 paired bootstrap resamples of the MAE improvement over the floor. The 95% CI excludes zero. This interval prices row noise, not model-selection variance.
