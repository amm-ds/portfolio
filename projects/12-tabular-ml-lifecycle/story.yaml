project_id: 12-tabular-ml-lifecycle
headline: The served LightGBM — validation-selected under the corrected v2 recipe (timestamp lags, `atemp`
  kept) — cuts hourly rental forecasting error to 23.8 MAE from 73.0 for the seasonal-naive floor on the
  frozen 8-week test window (gain 49.2; hourly 95% bootstrap CI 44.4-54.0; week-block sensitivity 33.0-63.8,
  both excluding zero). v2 fixes two disclosed v1 defects; the v1 run (served MLP 25.43) is kept under
  `previous_runs.v1`.
data_note: Real UCI Bike Sharing hour.csv (17,379 hourly rows, Capital Bikeshare 2011-2012, sha256-pinned) plus a seeded synthetic
  CI twin; time-based split.
limits: Validation made every modeling choice; ablation test scores are post-freeze diagnostics. Hourly errors are serially
  dependent. v2 fixed the two disclosed v1 defects — the v1 pruning rule dropped `atemp`, and v1 lags shifted
  positionally across missing hours; the v1 run is preserved under `previous_runs.v1`. One city over two
  years/four seasons.
short_version: |
  Real UCI Capital Bikeshare hourly demand (17,379 rows): the validation-selected
  LightGBM reaches 23.8 test MAE vs 73.0 for the seasonal-naive floor (v2 recipe:
  timestamp lags, `atemp` kept). The 49.2/hour gain has hourly 95% CI 44.4-54.0
  and week-block sensitivity 33.0-63.8.
sections:
- id: background
  text_md: |
    **Can a learned model beat last week's bike rentals on a protected `8`-week test window?**
    We compare linear, tree, and neural models (`Ridge`, `RandomForest`, `LightGBM`, `MLP`) on real hourly `Capital Bikeshare` data against a `seasonal_naive` floor (`73.0` `MAE`).

    ```diagram 12-lifecycle-pipeline
    ```

    Follow the lifecycle in three steps:

    - **Clean split:** Strip answer-derived columns and lock the final `8`-week window out of training and tuning.
    - **Compare fairly:** Tune each model family on past validation data and pick the model on validation before touching test; LightGBM wins there (`31.9` vs the `MLP`'s `35.1`).
    - **Outcome:** The served LightGBM cuts test error from `73.0` to `23.8` rentals/hour (`−49.2` `MAE`), with block intervals as sensitivity analyses.

    Next, the three checks behind the verdict ([Objectives →](#sec-objectives)).

    **In plain terms:** On real hourly bike-share data, a boosted-tree model cuts prediction error from 73 to 24 bikes per hour compared with repeating last week's numbers, even on a protected 8-week test window.
  figures: []
- id: objectives
  text_md: |
    **Three checks decide whether the forecast is useful.** Read
    `auto-12-tabular-ml-lifecycle-1` as a sequence: establish the floor,
    compare candidates fairly, then inspect the remaining errors.

    - **Beat the floor.** A candidate must improve on "same hour last week".
      The estimated gain needs an interval that excludes zero, not just a
      promising average.
    - **Compare model families fairly.** A linear model fits straight-line
      relationships. Boosted trees combine many small decision trees that
      correct earlier errors. The `MLP` learns more flexible patterns from the
      same tabular features.
    - **Locate the errors.** A residual is the actual count minus the
      forecast. Residual maps show whether misses cluster by hour, season,
      or weather.

    The diagram also ties these checks to four safeguards on one fixed split:

    - The final 8 weeks form the test set, with one score per candidate;
      ablation test scores are post-freeze diagnostics, not selectors.
    - Every candidate uses a fixed random seed, so its run can be repeated.
    - Loss curves track error during training. Learning curves show how scores
      change with more rows. Controlled on/off comparisons test
      regularization, methods that discourage overfitting. Overfitting means
      learning training noise in a way that hurts predictions on new data.
    - Paired bootstrap confidence intervals (CIs) estimate a plausible range
      for the gain by resampling the same hours or intact day/week blocks for
      both models.

    ```diagram auto-12-tabular-ml-lifecycle-1
    ```

    The checks need one protected series. The real input, the
    twin, and the time split define it ([Data →](#sec-data)).

    **In plain terms:** Beat the simple 'same hour last week' baseline by a clear, reproducible margin on a frozen 8-week test window and map where remaining errors happen.
  figures: []
- id: data
  text_md: |
    **One real series and one synthetic twin feed the same time-based pipeline.**
    Follow `auto-12-tabular-ml-lifecycle-2` from each input to the shared
    checks and split. The real input is the University of California, Irvine
    (UCI) Bike Sharing series: `17,379` hourly rows for `Capital Bikeshare` in
    Washington D.C. during 2011-2012. A pinned `SHA-256` checksum, a fixed
    fingerprint for the downloaded file, verifies the source. The
    [dataset contract](https://amm-ds.github.io/portfolio/data-registry/bike-sharing/)
    records those details. The seeded synthetic twin recreates the same
    columns offline for continuous integration (`CI`), meaning automated tests
    that run without network access.

    ```diagram auto-12-tabular-ml-lifecycle-2
    ```

    Two facts visible in this data path shape the features. First, `casual`
    and `registered` sum to the target, so both are dropped at load. Using
    them would cause target leakage: giving the model answer-derived fields
    that would not be available for a real forecast. Second, `165` hours are
    missing, mostly in early 2011 plus a `36`-hour gap on `2012-10-29/30` inside
    validation. Under the committed v2 recipe, lag features join on the exact
    wall-clock hour (`timestamp - h`) and are `NaN` when that hour is missing;
    rows with unknown lags leave the training and validation windows, while the
    frozen test window keeps every row with those few lag cells median-imputed
    from training. The data-quality gate allows at most `2%` missing rows.

    The diagram ends with three time-ordered partitions. Training uses the
    earliest `14,273` rows after the lag warm-up and the complete-case drop.
    Validation uses the next 8 weeks (`1,301` rows) to choose models and
    settings. The final 8 weeks, or `1,344` rows, remain the frozen test window.

    The split protects the window. The three EDA figures and the
    judging rules are presented next ([EDA →](#sec-eda)).

    **In plain terms:** A verified bike-share dataset and an offline test twin share one pipeline; leakage columns are stripped out and the final 8 weeks stay untouched until final scoring.
  figures: []
- id: eda
  text_md: |
    **The figures show a commuter pattern whose size changes by season.** In
    `rentals_by_hour_season`, compare the four panels. Each has a morning
    peak at `08h` and an evening peak at 17-18h. The lowest panel is labelled spring; winter peaks near summer's height.
    UCI codes run one season early: `spring` covers December 21–March 20 and
    `winter` covers September 23–December 20. Both hour and season still matter.

    In `temp_vs_rentals`, compare points at the same temperature but with
    different season colors. Rentals generally rise with temperature within
    a season, yet equal temperatures can have different demand across
    seasons. Temperature alone cannot stand in for the calendar.

    In `correlation_heatmap`, look for the strongest color contrasts. The
    correlation coefficient `r` measures how closely two numeric fields move
    together. Here `temp` and `atemp`, meaning feels-like temperature, reach
    r = 0.99. They are near-duplicates, so the later feature rule must remove
    one.

    The judging contract uses four measures:

    - Mean absolute error (`MAE`) comes first. It is the average absolute miss
      in rentals per hour, matching the business unit.
    - Root mean squared error (`RMSE`) is secondary. It penalizes large misses
      more heavily than small ones.
    - Mean absolute percentage error (`MAPE`) uses a denominator floored at 1
      rental. Without that floor, near-zero hours would dominate the score.
    - Every candidate must beat the seasonal-naive floor.

    The judging rules are set. The feature selection and the model
    ladder are laid out next ([Training →](#sec-training)).

    **In plain terms:** Clear weekday rush-hour peaks, seasonal swings, and duplicate temperature columns stand out immediately, so average hourly error against last week's demand is the main yardstick.
  figures: [rentals_by_hour_season, temp_vs_rentals, correlation_heatmap]
- id: training
  text_md: |
    **All 26 data-quality (DQ) checks pass before fitting a model.** The
    `mi_lollipop` figure then shows feature selection on the training window.
    Mutual information (MI) measures how much a feature reveals about the
    target, in units called nats. The three past-count lags rank first at
    MI `1.00` / `0.88` / `0.78` nats, followed by the cyclical hour pair, two fields
    that represent the repeating hour as a circle. Longer stems indicate
    higher MI. Grey stems mark pruned fields. The committed v2 rule keeps the
    higher-`MI` member of a correlated pair: `atemp` (`0.161` nats) stays and
    `temp` (`0.153`) drops.

    A second check, permutation importance, measures the validation `MAE`
    increase after shuffling one feature. The probe is ridge, a linear model
    that penalizes large coefficients. It identifies the same lag set but orders `lag_24` and `lag_168` differently
    from `MI`. Fifteen of 16 candidate features enter the model ladder after
    correlated-pair pruning.

    Every run uses a fixed seed. `LightGBM` uses deterministic settings, meaning
    identical inputs produce identical outputs, and one processing thread.
    The forest uses one job, and the `MLP` uses one thread with seeded
    shuffling. These controls make the training diagnostics repeatable.

    - **Seasonal-naive floor:** validation `MAE` is 62.4 rentals.
    - **Ridge:** validation `MAE` reaches 56.6. A random forest, which averages
      many decision trees, reaches 36.2. Their scores show substantial
      learnable signal around the lags.
    - **`LightGBM`:** this boosted-tree library is tuned with `Optuna`, a
      hyperparameter search tool. Hyperparameters are settings chosen before
      training. The study runs `50` trials or `240 s`, whichever comes first,
      using validation `MAE` and median pruning. It selects `LightGBM` at 31.9.
    - **Hand-written `MLP`:** an 8-dimensional hour embedding feeds hidden
      layers `64→32`, beside standardized numeric features. AdamW uses learning
      rate `1e-3`; batches contain `256` rows. Dropout 0.2 randomly hides units,
      weight decay 1e-4 penalizes large weights, and Huber loss reduces the
      influence of very large errors in standardized-target space. Early stopping
      uses patience `10`, an epoch cap of `150`, and best-state restore. The
      candidate run executes `26` epochs and restores epoch `16`. It reaches 35.1.

    Read `mlp_loss_curves` at the marked best epoch. Training loss falls early and then plateaus around `21`, while validation
    stalls; this gap motivates the regularization controls.
    In `learning_curves`, compare the tuned tree and `MLP` as the training
    fraction grows. Both curves are non-monotone at the full fraction,
    so these curves do not establish a row-count ceiling or test early stopping.

    The regularization ablation, a controlled comparison with settings turned
    on or off, supports early stopping: every early-stopping-off row worsens
    validation MAE. The dropout-off, weight-decay-off row improves validation `MAE`
    to `29.5`, about `5.6` rentals below the shipped configuration; it becomes a
    next-round candidate. These ablation comparisons are point estimates without intervals.
    The results section's dot plot shows that comparison.

    **Checkpoint on validation and restore the best state.** Patience stops
    the loop after no improvement; it does not choose the final weights.

    ```python
    if val_mae < best_val:
        best_val = val_mae
        self.history.best_epoch = epoch + 1
        best_state = {
            k: v.clone() for k, v in self.model.state_dict().items()
        }
        patience_left = mlp.patience
    elif early_stopping:
        patience_left -= 1
        if patience_left <= 0:
            break

    if best_state is not None and early_stopping:
        self.model.load_state_dict(best_state)
    ```

    The excerpt from [mlp.py](https://github.com/amm-ds/portfolio/blob/main/projects/12-tabular-ml-lifecycle/src/tabular_ml_lifecycle/mlp.py)
    shows the checkpoint rule behind the loss-curve interpretation.

    Validation selects LightGBM. The fixed measurement chain
    behind the test scores is documented next ([Evaluation →](#sec-evaluation)).

    **In plain terms:** Validation picks LightGBM at 31.9 bikes/hour error versus 62.4 for repeating last week; the separate ablation shows that turning early stopping off hurts every paired variant.
  figures: [mi_lollipop, mlp_loss_curves, learning_curves]
  metrics_keys: [seasonal_naive, ridge, random_forest, lightgbm_hpo, mlp]
- id: evaluation
  text_md: |
    **The measurement chain is fixed before the test scores appear.** Follow
    `auto-12-tabular-ml-lifecycle-3` from validation selection to one test
    score per candidate. No test number feeds a modeling choice. The diagram
    pairs the served-model row — the one candidate validation selected to
    serve — with the same floor row for `2,000` bootstrap resamples. Hourly
    resampling gives the primary interval; intact 24-hour
    and 168-hour blocks test sensitivity to serial dependence. All three use
    the same test window and none measures model-selection uncertainty.

    ```diagram auto-12-tabular-ml-lifecycle-3
    ```

    In `model_comparison`, compare each `MAE` point with the dashed
    seasonal-naive reference. The floor scores 73.0 and the served LightGBM 23.8.
    The average gain is 49.2 rentals/hour. The hourly `95%` `CI` is [44.4, 54.0];
    day-block and week-block sensitivity intervals are [37.4, 61.2] and
    [33.0, 63.8]. All exclude zero. `MAPE` stays high for every candidate because
    hourly counts approach zero at 4h. The denominator floor of 1 rental limits
    that effect, but `MAE` remains the primary measure.

    In `residual_heatmap`, read the hour-by-season panel beside the
    hour-by-weather panel. Late-December holiday-week hours (the UCI `spring` code)
    are over-forecast by up to `61` rentals at `17h`.
    UCI `winter` mornings (November to December 20) are under-forecast by up to `32` at `7h`.
    Bad-weather evenings (w3 at `19h`) are over-forecast by up to `45`, while clear
    midday hours (w2 at `12h`) are under-forecast by up to `35`. These clusters
    locate error that a single average hides.

    In `residual_vs_fitted`, compare vertical spread across the predicted
    demand level. The spread widens as fitted values rise, so high-demand
    hours have larger absolute misses. Mean residual (actual minus fitted) is `+4.3` rentals and median is `+1.4`;
    for fitted values `300–600`, the mean is `+13.7`. The model under-forecasts
    on average, especially in that high-demand band.

    This protocol prevents test-driven selection. One test window confirms
    the validation choice, with wider block intervals showing why hourly
    resampling alone understates serial-dependence uncertainty. Neither
    guarantees deployment performance.

    The chain is fixed. The ledger table and the ablation evidence
    follow ([Results →](#sec-results)).

    **In plain terms:** On the protected 8-week test window, the boosted-tree model cuts error by 49.2 bikes per hour (with uncertainty ranges clearly above zero), and error maps pinpoint rush-hour and weather gaps.
  figures: [model_comparison, residual_heatmap, residual_vs_fitted]
- id: results
  text_md: |
    **The served LightGBM cuts error from 73.0 to 23.8 rentals/hour on the
    corrected v2 recipe; v1 remains for comparison.** Use the exact table for
    model scores and `ablation_dotplot` for validation effects of switching
    `MLP` controls on or off. The ablation figure does not establish the
    served-model-versus-floor margin.

    - The table records the decision-relevant margin: **73.0 → 23.8 test `MAE`,
      or 49.2 rentals/hour** against the seasonal-naive floor. Validation chose
      the served model before test confirmation.
    - v2 fixes two disclosed v1 defects: pruning now keeps `atemp` (the
      higher-information member of the `temp`/`atemp` pair), and lags join by
      timestamp instead of drifting across missing hours. The corrected `MLP`
      is worse than v1's (`27.16` vs `25.43`); the corrected LightGBM is better
      (`23.76` vs `25.37`) and is now the served model. The v1 run is preserved
      under `previous_runs.v1` in `reports/metrics.json`, and the paired v1→v2
      comparison with intervals stays in `reports/sensitivity_pruning_lags.json`.
    - In `ablation_dotplot`, look for the lowest validation point and compare
      it with the teal shipped configuration. The dropout-off, weight-decay-off
      row reaches `29.5`, about `5.6` rentals better; it becomes a next-round
      candidate. The configuration fixed in `params.yaml` before the ablation
      still stands by protocol, not because it won the ablation. All four
      early-stopping-off rows worsen validation MAE. Variant test scores are
      recorded separately as post-freeze diagnostics and never select a variant.
    - The table also shows LightGBM ahead of the `MLP` under v2. Validation
      selects LightGBM at `31.9` versus `35.1`, and the paired validation
      interval (`MLP` − LightGBM `+3.2` [CI `+1.8`, `+4.5`]) excludes zero — no
      tie. On the test pass LightGBM leads on `MAE` (`23.8` vs `27.2`) and the
      `MLP` holds the better `MAPE` (`47.7%` vs `53.3%`); LightGBM also has the
      better `RMSE` (`37.1` vs `40.4`).
    - Neither the table nor the ablation figure measures transfer. The study
      covers one city over two years and four seasons, with holidays reduced
      to binary flags, meaning simple yes/no indicators. Use on another fleet
      or regime is plausible but unproven.

    The exact candidate table and intervals appear in Conclusions; lineage uses
    `_meta.git_sha` in `reports/metrics.json`.

    The evidence is recorded. The exact tables and protocol
    are kept in the conclusions ([Conclusions →](#sec-conclusions)).

    **In plain terms:** The served LightGBM achieves 23.8 bikes/hour test error versus 73.0 for repeating last week, with rush-hour peaks leaving the clearest room for future improvement.
  figures: [ablation_dotplot, sensitivity_pruning_lags]
- id: conclusions
  text_md: |
    ## What the experiment taught

    In `bootstrap_ci`, compare the hourly, day-block and week-block histograms
    and interval bounds. The served LightGBM records 23.8 test `MAE` against 73.0
    for the seasonal-naive floor. The gain is 49.2 rentals/hour with an hourly
    `95%` `CI` of [44.4, 54.0], day-block [37.4, 61.2], and week-block [33.0, 63.8]
    over the frozen 8-week window. All exclude zero. Validation `MAE` chose
    LightGBM at 31.9 before its test score. The block panels quantify sensitivity
    to serial dependence on the same window; they do not measure selection
    variance, provide new confirmation data, or establish deployment transfer.
    [Full evaluation report](https://amm-ds.github.io/portfolio/projects/12-tabular-ml-lifecycle/).

    - The floor is the first model to build. The `bootstrap_ci` intervals on
      the gain, not the point estimate alone, are the ship/no-ship evidence.
    - Mutual information and the ridge permutation probe select the same lag set
      but order two lags differently. The v2 correlated-pair rule keeps `atemp`
      and drops `temp`, matching `atemp`'s slightly higher `MI`; the v1 rule did
      the opposite, and the paired v1→v2 record (`sensitivity_pruning_lags`)
      prices both defects per candidate.
    - On these tabular features under v2, the tuned boosted tree beats the
      hand-written `MLP` on validation (`31.9` vs `35.1`, interval excludes
      zero) and on test (`23.8` vs `27.2`). The `MLP` stays in the ladder as a
      candidate with its loop, controls, and per-epoch evidence explicit.
    - Every early-stopping-off row worsens validation `MAE`. The dropout-off,
      weight-decay-off row reaches `29.5` validation — below the served
      LightGBM's `31.9` — so it is a real next-round candidate, but it is a
      post-freeze diagnostic: it was never a selection input, and its `23.4`
      test score does not make it the served model.
    - Residuals depend on the regime: fitted values `300–600` under-forecast by
      `+13.7` rentals on average, while the late-December holiday week is
      over-forecast. This motivates calendar-event features.
    - Date-aware lags cost the `MLP` and the positional floor differently: the
      corrected floor drops to `73.0` from `83.2`, so the v2 gain (`49.2`) is
      smaller than v1's (`57.8`) even though the served model improved.

    ## Limits

    - Model selection and early stopping used validation only; the ablation
      configuration was fixed in `params.yaml` beforehand. Ablation test scores are post-freeze diagnostics,
      not selection evidence. The margin is still a single-window confirmation,
      not a deployment guarantee.
    - Hourly errors are serially dependent. Day/week block intervals are wider
      than the hourly interval; they are sensitivity analyses, not independent
      confirmations.
    - v2 fixed the two disclosed v1 defects: the v1 pruning rule dropped
      `atemp`, and v1 lags shifted positionally, drifting up to 36 hours after
      the October 2012 gap. The v1 run is preserved under `previous_runs.v1`;
      the corrected `MLP` is worse than v1's (`27.16` vs `25.43`), the
      corrected LightGBM better (`23.76` vs `25.37`).
    - `MAPE` denominators are floored at 1 rental. Near-zero hours keep `MAPE`
      high for every candidate, so read `MAE` first.
    - One city over two years/four seasons, and holiday effects as binary flags,
      limit the evidence. Mean residual is `+4.3`, so under-forecast bias and the
      late-December holiday week remain open. Transfer is plausible, not measured.
    - The best ablation row (dropout-off, weight-decay-off) beats the served
      LightGBM on validation (`29.5` vs `31.9`) but was never a selection
      candidate; promoting it requires its own frozen-protocol run.

    ## Exact numbers

    Test window: the final 8 weeks of the 2011-2012 hourly series (`1,344` rows),
    one score per candidate. MAE/RMSE in rentals/hour.

    | candidate | val MAE | test MAE | test RMSE | test MAPE |
    |---|---|---|---|---|
    | seasonal-naive floor | 62.4 | 73.0 | 120.0 | 129.9% |
    | ridge | 56.6 | 48.7 | 72.2 | 101.1% |
    | random forest | 36.2 | 26.1 | 42.4 | 62.5% |
    | lightgbm_hpo (served) | 31.94 | 23.76 | 37.10 | 53.3% |
    | mlp | 35.13 | 27.16 | 40.42 | 47.7% |

    The MLP-LightGBM validation difference is decisive, not a tie: paired bootstrap on
    validation `MAE` (`MLP` − `LightGBM`) gives `+3.19` with `95%` `CI` [`+1.79`, `+4.54`]
    (`2,000` seeded resamples, `metrics.json:validation_tie_interval`) — the
    interval excludes zero in LightGBM's favor, so LightGBM is the served artifact.

    Served-model-vs-floor `MAE` gap: `49.21` rentals/hour over `2,000` paired resamples
    per method. Hourly `95%` `CI` [`44.43`, `53.99`]; 24-hour block [`37.37`, `61.16`];
    168-hour block [`33.00`, `63.84`]. Every interval excludes zero. `LightGBM` HPO
    runs `50` `Optuna` trials or `240 s`, whichever comes first; `learning_curves`
    records best validation `MAE` `31.939`. The `MLP` epoch cap is `150`; per-variant
    epoch counts are not committed. Every early-stopping-off ablation row worsens validation `MAE`. The best validation row is
    dropout-off + weight-decay-off + early-stopping-on (`29.52` validation, `23.4` post-freeze test
    diagnostic), about 5.6 validation rentals below the shipped configuration;
    no test diagnostic selects a variant.

    ## Protocol

    - **Split:** the final 8 weeks (`1,344` rows) receive one score per candidate.
      The previous 8 weeks are validation for HPO, early stopping, and model
      selection; the shipped ablation configuration is fixed in `params.yaml`
      before the ablation. Training uses everything
      earlier, `14,273` rows after the 168-row lag warm-up and the complete-case
      drop, and never reads test.
      Post-freeze evaluation refits deterministic ablation variants to record
      test diagnostics. Lag features read only the past, joined on
      `timestamp - h` under the v2 recipe. The UCI zip is
      SHA-256-gated, and the 165 real missing hours are bounded by a `2%` DQ gate.
      Most gaps are in early 2011; a 36-hour gap on 2012-10-29/30 lies inside
      validation, where `NaN`-lag rows leave the fitting windows.
    - **Judging:** `MAE` in rentals/hour is primary, `RMSE` secondary, and `MAPE`
      is floored at 1 rental. The seasonal-naive floor is the comparator.
    - **Uncertainty:** `2,000` paired hourly resamples produce the primary `CI`;
      paired non-overlapping 24-hour and 168-hour block resamples provide
      serial-dependence sensitivity in `bootstrap_ci`. All use the same test
      window and do not measure selection variance.
    - **Synthetic twin:** the same-schema, seeded generator supports `CI`
      evidence only and never substitutes for real-data results.
    - **Compute:** seed 42 throughout; train stage `61.2 s` plus evaluate `18.5 s`
      on a recorded 16-core arm64 host, with torch pinned to one thread. Evaluation
      includes the eight deterministic post-freeze ablation refits.

    **In plain terms:** Keep LightGBM—it beats repeating last week by 49.2 bikes per hour on the protected 8-week test window, and any future challenger must beat it under the exact same time-split rules.

  figures: [bootstrap_ci]
