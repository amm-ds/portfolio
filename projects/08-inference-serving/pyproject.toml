[project]
name = "08-inference-serving"
version = "0.1.0"
description = "Portfolio project 08-inference-serving: LLM inference & serving benchmark over local Ollama (llama.cpp vs MLX runners)."
requires-python = ">=3.12"
dependencies = [
    # async load driver against Ollama's OpenAI-compatible endpoint (direct import)
    "httpx>=0.27",
    "typer>=0.12",
    "plotly>=5.24",
    "portfolio-core",
    "portfolio-eval",
]

[project.scripts]
inference_serving = "inference_serving.cli:app"

[tool.uv.sources]
portfolio-core = { workspace = true }
portfolio-eval = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inference_serving"]
