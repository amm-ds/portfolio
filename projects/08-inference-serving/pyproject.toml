[project]
name = "08-inference-serving"
version = "0.1.0"
description = "Portfolio project 08-inference-serving."
requires-python = ">=3.12"
dependencies = [
    # add project-specific deps here (keep them minimal and justified)
    "typer>=0.12",
    "plotly>=5.24",
    "polars>=1.9",
    "numpy>=2.1",
    "portfolio-core",
    "portfolio-eval",
]

[project.scripts]
inference_serving = "inference_serving.cli:app"

[tool.uv.sources]
portfolio-core = { workspace = true }
portfolio-eval = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inference_serving"]
