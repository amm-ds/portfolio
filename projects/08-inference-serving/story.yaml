project_id: 08-inference-serving
short_version: >-
  One laptop, five LLM serving setups, 760 requests, zero failures. The 4-bit
  MoE records 0.81 s p95 latency (0.63 s median) at about $0.12 per 1M output
  tokens (electricity only). Reuse the harness to re-measure target hardware.
figure_captions:
  quality_quant: >-
    A compact pass/fail table for the bounded quality guardrail at concurrency
    1 — a saturated smoke check: every arm ties at 1.00, so it does not
    establish quality. PASS means all 40 responses in that cell follow the
    Answer schema or contain the required keywords, respectively. The 4-bit,
    QAT-int4, and Q8_0 arms pass both checks with zero failures.
  latency_concurrency: >-
    Latency is the time a request takes. The points show p95, the time within
    which 95% of responses finish, at concurrency 1/2/4/8. Error bars span the
    committed p50–p99 values, from the median to the 99th percentile. Qwen3.6
    rises from 0.81 s at c=1 to 7.80 s at c=8. This near-linear pattern
    describes this machine and run only.
  toks_per_s: >-
    Mean time to first token (TTFT) and aggregate output throughput across
    concurrency 1/2/4/8. TTFT is the wait before the first text arrives;
    aggregate tok/s is total output tokens divided by cell wall time. The
    3B-active mixture-of-experts model serves about 7× the tok/s of dense
    qwen3:32b on this machine, while TTFT rises under load.
  engine_panel: >-
    MLX and llama.cpp are runners, the software that serves a model. For
    Gemma4:31b at c=1, MLX 4-bit reaches 18.8 tok/s and 2.47 s p95 versus
    llama.cpp Q8_0 at 6.4 tok/s and 7.12 s. Quantization and packaging differ
    together, so this compares combinations, not engines in isolation.
roadmap:
  - status: shipped
    title: "Standardized the task across all arms."
    detail: "8 schema-checked prompts with keyword checklists."
  - status: shipped
    title: "Committed the full grid without failures."
    detail: "19 cells and 760 requests on one quiet machine."
  - status: shipped
    title: "A silent config error was caught before the runs."
    detail: "Reasoning disabled before the committed runs."
  - status: shipped
    title: "Re-derived every published value offline."
