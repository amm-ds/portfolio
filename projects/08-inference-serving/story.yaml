project_id: 08-inference-serving
figure_captions:
  quality_quant: >-
    Schema-valid rate and keyword quality rate for every quantization and
    engine arm (4-bit, QAT-int4, Q8_0) at concurrency 1. All arms hold
    schema validity at 1.00 — quantization costs serving headroom, not
    structured-output reliability.
  latency_concurrency: >-
    p95 latency vs concurrency (1/2/4/8) for the primary models on the
    local Ollama endpoint, one line per model+runner. The MoE arm stays in
    single-digit seconds through c=8 (qwen3.6: 0.81 s → 7.80 s), with p95
    ≈ linear in concurrency.
  toks_per_s: >-
    Aggregate output tok/s per model and concurrency level. Throughput is
    flat-to-declining as concurrency rises — decode is memory-bandwidth
    bound — and the 3B-active MoE still serves ~7× the tok/s of dense
    qwen3:32b.
  engine_panel: >-
    p95 latency and output tok/s for the two engine-plus-packaging arms of
    gemma4:31b at c=1 (llama.cpp Q8_0 vs MLX 4-bit) on Apple Silicon. MLX
    runs 2.9× the tok/s (18.8 vs 6.4) at a third of the p95 (2.47 s vs
    7.12 s) — quant is confounded with packaging, so this names the best
    combination, not the faster engine alone.
roadmap:
  - status: delivered
    text: >-
      Async benchmark harness on the local Ollama endpoint (ADR-0004):
      per-cell latency/TTFT/tok/s, <45 min default.
  - status: delivered
    text: >-
      llama.cpp vs MLX on Apple Silicon (same model family; runner
      auto-detected via /api/ps); quant confound labelled.
  - status: delivered
    text: >-
      Quant quality check (Q8_0 vs QAT-int4, one runner) + cost-per-1M-token
      view on declared electricity assumptions.
sections:
  - id: background
    text_md: |
      Running language models in production is a serving problem before it is
      a modeling problem: latency percentiles, throughput, memory footprint,
      and cost per token decide whether a use case ships at all. The headline
      from measuring the portfolio's real serving stack instead of quoting
      vendor numbers: the 4-bit mixture-of-experts (MoE) arm serves locally
      at ~$0.12 per 1M output tokens with single-digit-second p95 through
      concurrency 8.

      - **Measured, not quoted:** the benchmark target is the same local
        Ollama OpenAI-compatible endpoint every LLM project ships against
        (ADR-0004, `docs/architecture/adr/0004-llm-provider-abstraction.md` —
        no redundant gateway), so the numbers describe real traffic, not a
        lab proxy.
      - **Decisions it feeds:** local-vs-cloud serving economics, model and
        quantization choice under a latency target (SLO), and concurrency
        sizing for interactive workloads.

      The task is fixed and bounded so the benchmark can be re-run, not just
      read.

      **Business summary:** Running a language model in production is a
      serving decision before it is a modeling one: latency percentiles,
      throughput, and cost per token decide whether a use case ships at
      all. A client weighing local hardware against a cloud API should
      start from measurements on the stack that would actually run the
      workload — not vendor rate cards, and not leaderboard claims about
      model quality. The headline from measuring this portfolio's real
      serving stack: the 4-bit mixture-of-experts arm (a model that
      activates only a few billion of its parameters per request) serves
      locally at about $0.12 per 1M output tokens, with
      single-digit-second p95 latency (the slowest 5% of requests)
      holding through concurrency 8.
  - id: objectives
    text_md: |
      - **Characterize the frontier:** per-cell p50/p95/p99 latency, TTFT,
        aggregate and per-request output tok/s, schema-valid rate, keyword
        quality rate, and failures across model × engine × concurrency.
      - **Compare engines head-to-head:** llama.cpp (GGUF) vs MLX
        (safetensors) on Apple Silicon, same model family, with the quant
        confound labelled.
      - **Compare quantizations on one runner:** quality and latency side by
        side, not folklore about 4-bit degradation.
      - **Publish a cost view with declared assumptions:** $0 API spend,
        amortized electricity, and a labelled hypothetical cloud rate card.

      Success is a reproducible set of numbers tied to serving
      configurations, not a leaderboard rank.

      **Business summary:** The deliverable is an operating decision,
      not a leaderboard rank: which model and compression (quantization)
      arm meets the client's latency target — the service-level
      objective, the maximum response time users will tolerate — at what
      cost per token. Every metric is traceable to a concrete serving
      configuration: model, engine, concurrency level, and declared cost
      assumptions. The table reads as a menu of deployment options, each
      with its own measured price and latency, rather than an abstract
      quality contest.
  - id: data
    text_md: |
      No dataset is downloaded: the benchmark task is fixed and synthetic — 8
      general-knowledge prompts (capital of France, boiling point of water,
      DNA structure, …), each carrying a keyword set for a tiny answer-quality
      check.

      - **Validated output contract:** every model answers the same prompts
        under the same pydantic `Answer` schema (one-sentence answer,
        confidence in [0,1], citation), `temperature 0`, bounded
        `max_tokens`, and reasoning disabled, so decode is bounded and
        comparable across models.
      - **Where it lives:** the `prepare` stage materializes the suite into
        `data/prompts.json`; recorded runs land in `data/bench_run.json`.

      A fixed task is what makes different models directly comparable.

      **Business summary:** No proprietary dataset is involved: the
      benchmark task is fixed and small — 8 general-knowledge prompts,
      each with a keyword checklist for answer quality — and every model
      answers under an identical output contract (same schema,
      temperature 0, bounded length). A fixed, synthetic task is what
      makes different models directly comparable, because nothing about
      the input can favor one over another. A client can re-run the
      identical task on their own hardware and get numbers comparable
      cell-for-cell with these — the benchmark is portable, not a
      one-off demo.
  - id: eda
    text_md: |
      Exploratory analysis is the smoke pass that keeps the harness from
      mis-measuring serving-land behavior before any timing starts.

      - **`json_schema` is honored:** the endpoint accepts
        `response_format` with a validated schema, so schema-valid rate is
        measurable per cell instead of guessed from prose.
      - **Reasoning defaults burn budget:** qwen3.6 defaults to thinking
        mode, which silently exhausted the bounded token budget (0 valid
        answers); fixed with `reasoning_effort: none` (`low` for gpt-oss) so
        decode stays bounded.
      - **Quality check parses across arms:** the `quality_quant` figure
        shows schema-valid and keyword rates holding across quantization
        arms — the harness measures answer quality identically everywhere.

      These are facts about the serving layer, not about model intelligence.

      **Business summary:** Before any timing starts, the harness
      verifies it is measuring what it thinks: that the endpoint honors
      structured-output schemas, and that the quality check parses every
      answer the same way. That smoke pass caught a real trap — one
      model silently defaults to extended reasoning mode, which exhausted
      the bounded token budget and produced zero valid answers. A naive
      harness would have reported that model as broken; in fact
      per-model reasoning defaults are part of the true cost of serving,
      and accounting for them is what makes the latency numbers honest.
    figures:
      - quality_quant
  - id: training
    text_md: |
      There is no training; "methods" is the serving configuration. Ollama
      0.40.x picks the runner from the model artifact — GGUF → llama.cpp,
      MLX safetensors → Apple's MLX engine — verified via the `runner` field
      of `/api/ps` (no runner-override env on this build; MLX arrives via
      `-mlx` tags). The bench harness pipeline:

      ```mermaid
      graph LR
          S[prompt suite] --> D[async load driver]
          D -->|concurrency 1-8| E[Ollama endpoint]
          E -->|llama.cpp / MLX| A[validated Answer schema]
          A --> M[cell metrics]
          M -->|p50, p95, tok/s| R[report + figures]
      ```

      The fixed suite is scored by an async httpx driver against the
      Ollama endpoint, validated into the `Answer` schema, aggregated into
      per-cell metrics, and rendered as report plus figures.

      | model | architecture | quant | runner |
      |---|---|---|---|
      | qwen3.6:35b-a3b-q4_K_M | 3B-active MoE | Q4_K_M | llama.cpp |
      | gpt-oss:20b | dense | MXFP4 | llama.cpp |
      | gemma4:31b | dense | 4-bit MLX | MLX |
      | qwen3:32b (`--full`) | dense | — | llama.cpp |
      | gemma4 q8_0 / -qat (`--full`) | dense | Q8_0 / QAT-int4 | llama.cpp |

      - **Engine is packaging:** the meaningful comparison is same-family
        manifests with the quant confound labelled.
      - **Missing cell, recorded:** no MLX build exists for qwen3.6:35b-a3b
        (conversion fails on switch-expert weights) — a data point, not
        silently skipped.

      Rationale lives in `DESIGN.md`; stages are `prepare` → `bench` →
      `report`.

      **Business summary:** There is no model training here — the
      "methods" are the serving configurations, and each row of the
      table is one deployment option: model file, compression format,
      and inference engine. Swapping engine or quantization is a
      manifest change, not a re-architecture, so switching arms costs
      hours, not a project. Where an arm does not exist — there is no
      MLX build for the MoE model — that is recorded as a data point
      rather than silently skipped, because a missing option is
      information a buyer needs.
  - id: evaluation
    text_md: |
      Cells are (model, engine, concurrency) with concurrency 1/2/4/8 under
      an asyncio semaphore; each cell repeats the 8-prompt suite 5 times (40
      requests) with a cooldown between cells.

      | dimension | setup |
      |---|---|
      | cell | model × engine × concurrency 1/2/4/8, 5 repeats of the 8-prompt suite |
      | driver | async httpx streaming against `/v1/chat/completions`, `json_schema` response_format |
      | latency | nearest-rank p50/p95/p99, mean TTFT |
      | throughput | aggregate tok/s (tokens over cell wall time) + per-request tok/s |
      | quality | schema-valid rate, keyword quality rate, failures |

      The `latency_concurrency` figure plots the per-cell p95 this protocol
      produces. The bounded default (3 models × 3 concurrency levels)
      finishes in under 45 minutes; `--full` adds the dense qwen3:32b
      baseline, concurrency 2, and the quant/engine cells.

      **Business summary:** Each measurement cell — one model, one
      engine, one concurrency level — repeats the fixed prompt suite
      five times and records latency percentiles, throughput, and answer
      quality per cell. The bounded default benchmark finishes in under
      45 minutes, and the full grid in a few hours, on a single machine.
      That makes the protocol cheap enough to run inside a client
      proof-of-concept: verifying a latency target on the client's actual
      hardware becomes an afternoon task, not a project, and it can be
      repeated after any infrastructure change.
    figures:
      - latency_concurrency
  - id: results
    text_md: |
      19 cells, **760 requests, 0 failures** — the 4-bit MoE arm holds
      single-digit-second p95 through concurrency 8, and quantization costs
      serving headroom, not answer quality. The catch: all numbers are a
      single **author run** (Ollama 0.40.4, Apple-Silicon Mac, 128 GB unified
      memory), not committed to the repo — regenerate on your hardware with
      `bench --full && report` (`reports/metrics.json`, `reports/report.html`).

      - **Engine:** MLX ≈ 2.9× GGUF tok/s on this machine (gemma4:31b, c=1);
        quant confounded, so `engine_panel` reads as engine+packaging, not a
        pure runner race. In plain words: the two engines ran on differently
        compressed model files, so the figure names the best
        engine-plus-format combination, not the faster engine alone.
      - **Latency:** MoE arms keep single-digit-second p95 that grows
        gracefully — qwen3.6 goes 0.81 s (c=1) → 7.80 s (c=8) — with p95
        ≈ linear in concurrency on every arm.
      - **Throughput:** decode on unified memory is bandwidth-bound —
        `toks_per_s` is flat or declining with concurrency, batching hides
        latency rather than multiplying throughput; the 3B-active MoE still
        serves ~7× the tok/s of dense qwen3:32b.
      - **Quality:** 4-bit arms hold schema validity at essentially the same
        rate as Q8_0 — quantization costs serving headroom, not
        structured-output reliability.

      **Business summary:** The decision this supports is local versus
      cloud serving under an interactive latency target, and the numbers
      answer it directly: the 4-bit MoE arm keeps single-digit-second
      p95 through concurrency 8, going from 0.81 s at one concurrent
      user to 7.80 s at eight. Cost sits at roughly $0.12 per 1M output
      tokens on declared electricity assumptions (100 W draw,
      $0.30 per kWh) — zero API spend. And compression is not the risk
      it is often assumed to be: the 4-bit arms hold answer quality at
      essentially the same rate as the uncompressed baseline, so
      quantization trades headroom, not reliability. The honest caveat:
      these are a single author run on one machine — a worked example to
      regenerate on your own hardware, not a guarantee.
    figures:
      - toks_per_s
      - engine_panel
  - id: conclusions
    text_md: |
      Three lessons generalize beyond this benchmark:

      - **Measure the layer you ship:** the OpenAI-compatible endpoint is both
        product surface and benchmark target, so the numbers apply to real
        traffic with no translation layer.
      - **Engine choice is packaging, not runtime:** the meaningful
        comparison is same-family manifests with the quant confound
        labelled — and a missing engine build is a data point, not a gap
        to paper over.
      - **Bounded structured tasks make models comparable:** schema-valid
        rate collapses "it usually works" into a number, and per-model
        reasoning-effort defaults are a serving concern, not a modeling one.

      **Results quality: acceptable with caveats.** The cells are internally
      consistent — 0 failures, quality 1.00 everywhere — but this is one
      author run on one machine; a practitioner re-runs `bench --full` on
      their own hardware and treats these numbers as a worked example, not
      a guarantee.

      **Business summary:** The framework transfers to a client decision
      unchanged: same fixed task, same measurement protocol, same
      declared-assumption cost labels — only the hardware and the
      latency target change. What the client inherits is a way of
      deciding, not a set of answers: measure the endpoint that will
      actually be shipped, label what is confounded (engine versus
      compression), and record missing options as data points. The
      caveat travels with it — the published numbers are one machine's
      run, so the first step on client hardware is always to regenerate
      them, which the harness is built to make easy.
