project_id: 08-inference-serving
short_version: >-
  One laptop, one run: five LLM serving setups, 760 requests, zero failures.
  A 4-bit mixture-of-experts model answers in 0.81 s per request at about
  $0.12 per 1M output tokens (electricity only). The reusable asset is the
  harness for re-measuring any stack on target hardware.
figure_captions:
  quality_quant: >-
    Schema-valid and keyword quality rates at concurrency 1 for 4-bit,
    QAT-int4, and the quantized Q8_0 baseline. Every arm scores 1.00 on both
    checks in this run; this bounded task does not establish broader model
    quality.
  latency_concurrency: >-
    p95 latency at concurrency 1/2/4/8, with error bars spanning committed
    p50–p99 values. Qwen3.6 rises from 0.81 s at c=1 to 7.80 s at c=8; the
    near-linear pattern describes this machine and run only.
  toks_per_s: >-
    Aggregate output tok/s by model and concurrency, with ±1σ per-request
    error bars over each 40-request cell. Throughput is flat-to-declining as
    concurrency rises, and the 3B-active MoE serves about 7× the tok/s of
    dense qwen3:32b on this machine.
  engine_panel: >-
    Gemma4:31b at c=1: MLX 4-bit reaches 18.8 tok/s and 2.47 s p95 versus
    llama.cpp Q8_0 at 6.4 tok/s and 7.12 s. Quantization and packaging differ
    together, so this compares combinations, not engines in isolation.
roadmap:
  - status: delivered
    text: "Full-grid raw record committed: 760 requests, percentiles re-aggregated offline from it."
sections:
  - id: background
    text_md: |
      **One laptop, one run.** Five ways to serve local language models were
      timed on one quiet 128 GB MacBook (Ollama 0.40.4): 760 requests, 19
      cells, zero failures. The winner — a 4-bit "mixture-of-experts" model —
      answers in 0.81 s at single-user load, makes 7× the tokens per second
      of the dense 32B option, and costs about $0.12 per 1M output tokens in
      electricity. The catch: one machine, one run — these numbers are not
      portable.

      The harness is the real asset; the benchmark pipeline diagram below
      shows how prompts turn into records.

      ```mermaid
      flowchart LR
          subgraph SUITE["fixed task suite"]
              P1["8 general-knowledge prompts"]
              P2["keyword checklist per prompt"]
              P3["enforced Answer schema"]
          end
          subgraph DRIVER["async load driver"]
              SEM["semaphore: concurrency 1 / 2 / 4 / 8"]
              COOL["cooldown between cells"]
          end
          subgraph ENDPOINT["local Ollama 0.40.4"]
              OAI["/v1/chat/completions with json_schema"]
              RUN["runner auto-selected from artifact: llama.cpp or MLX"]
          end
          subgraph RECORD["per-request record"]
              LAT["latency + time-to-first-token"]
              TOK["output tokens per second"]
              VAL["schema-valid + keyword score"]
          end
          SUITE --> DRIVER
          DRIVER -->|streaming httpx| OAI
          OAI --> RUN
          RUN --> RECORD
          RECORD --> CELL["cell aggregates: 40 requests"]
          CELL --> REP["metrics.json + report.html + figures"]
      ```

      **Business summary:** This section introduces the benchmark: five setups,
      760 requests, zero failures, and a 4-bit model answering in 0.81 s per
      request.
    figures: []
    metrics_keys: []
  - id: objectives
    text_md: |
      **The question: which local serving setup — model, engine, quant —
      should serve this workload class?** The answer must come from
      recorded runs, not vendor numbers.

      The study had to capture the full trade-off space:

      - Latency: p50, p95, and p99, plus time-to-first-token. Throughput:
        per request and in total. Quality: schema-valid answers and keyword
        hits. Failures: counted, never ignored.
      - Concurrency levels 1 through 8.
      - Engines compared with the packaging they ship in. Quants compared on
        one runner, against a quantized baseline.
      - Cost: power only, at stated assumptions, plus a labelled cloud
        rate card.

      The measurement contract diagram below fixes what a cell is and what
      gets recorded.

      ```mermaid
      flowchart LR
          subgraph CELL["one cell: model x engine x quantization x concurrency"]
              M["model artifact tag"]
              Q["quantization: Q4_K_M / Q8_0 / QAT-int4 / MXFP4 / 4-bit MLX"]
              C["concurrency rung: 1 / 2 / 4 / 8"]
          end
          subgraph METRICS["recorded per cell over 40 requests"]
              L["p50 / p95 / p99 latency + mean TTFT"]
              T["aggregate + per-request tok/s"]
              V["schema-valid rate, keyword quality, failures"]
          end
          subgraph RULES["comparison rules"]
              R1["engines ride their packaging - label the confound"]
              R2["quantizations on one runner + quantized baseline"]
              R3["cost = measured tok/s x declared 100 W x $0.30 per kWh"]
              R4["cloud rate card labelled hypothetical, not a quote"]
          end
          CELL --> METRICS
          METRICS --> RULES
          RULES --> VERDICT["verdict from recorded trade-offs"]
      ```

      **Business summary:** This section lists the study targets. It records
      latency, throughput, quality, and failures at concurrency 1 through 8,
      plus cost from measured tokens and stated power draw.
    figures: []
    metrics_keys: []
  - id: data
    text_md: |
      The task is fully synthetic. 8 general-knowledge prompts are built
      locally. Each prompt carries a keyword checklist. Each answer must
      match a fixed schema: one sentence, a confidence score, a citation.
      Temperature is 0. The token budget is bounded. Reasoning is off.
      Nothing is downloaded, so no license applies.

      Every cell answers the same prompts under the same rules. So cells
      compare directly. Timings, though, stay machine-specific. The
      request-schema diagram below shows one benchmark call, end to end.

      ```mermaid
      flowchart LR
          subgraph PROMPT["prompt record - data/prompts.json"]
              Q["general-knowledge question"]
              K["keyword checklist"]
              S["Answer schema: sentence + confidence + citation"]
          end
          subgraph REQUEST["request envelope, identical every call"]
              TEMP["temperature 0"]
              BUDGET["bounded max output tokens"]
              REASON["reasoning disabled"]
              MODEL["model tag + concurrency rung"]
          end
          subgraph PARSE["scoring"]
              A["Answer pydantic model"]
              P["one parser scores every arm"]
          end
          PROMPT --> REQUEST
          REQUEST -->|POST /v1/chat/completions| A
          A --> P
          P --> SCORES["schema-valid + keyword quality rates"]
      ```

      The committed evidence: `data/prompts.json` (prompts),
      `data/bench_run.json` (raw full grid), `reports/metrics.json`,
      `reports/report.html`, and the figures. The published percentiles
      re-aggregate offline from the raw record. No re-run needed.

      **Business summary:** This section defines the task: 8 general-knowledge
      prompts, each with a keyword checklist and a fixed answer schema, so every
      setup answers the same questions under the same rules.
    figures: []
    metrics_keys: []
  - id: eda
    text_md: |
      Before trusting any timing, the first pass checked the answers
      themselves. All 760 responses parse against the Answer schema. All 760
      carry their prompt's keywords. The schema-valid rate is 1.00 in every
      cell, and so is the keyword quality rate. The quality-by-quantization
      chart shows the three quantization arms tied at 1.00 on both checks.

      A smoke pass caught one config bug early. A model defaulted to long
      "thinking" and burned its token budget, scoring zero valid answers.
      Reasoning was switched off; the runs were repeated. That fix is what
      makes quality scores comparable across arms. One parser scores every
      arm, so the checker itself can't create fake gaps.

      **Business summary:** This section checks answers before timings: all 760
      responses match the schema and keyword checklists, scoring 1.00 in every
      cell. A smoke pass caught one model's silent reasoning mode before the
      runs.
    figures:
      - quality_quant
    metrics_keys: []
  - id: training
    text_md: |
      There is no training step — the "method" is the serving setup, and the
      findings are measurements. Five setups were compared on one endpoint:
      the 4-bit 3B-active mixture-of-experts model, a dense 20B in MXFP4, a
      dense 31B in 4-bit MLX packaging, a dense 32B at full precision, and a
      quantized pair (Q8_0 and QAT-int4) on one runner. The serving-grid
      diagram below shows how models, quants, and runners were combined; the
      tokens-per-second chart shows what the grid measured.

      ```mermaid
      flowchart LR
          subgraph MODELS["five serving setups"]
              A["qwen3.6:35b-a3b - 3B-active MoE, Q4_K_M"]
              B["gpt-oss:20b - dense, MXFP4"]
              C["gemma4:31b - dense, 4-bit MLX"]
              D["qwen3:32b - dense, full precision"]
              E["gemma4:31b - Q8_0 / QAT-int4 cells"]
          end
          subgraph RUNNERS["runner auto-selection by Ollama"]
              G["GGUF artifact goes to llama.cpp"]
              X["safetensors -mlx tag goes to MLX"]
          end
          subgraph GRID["measurement grid"]
              C1["concurrency rungs 1 / 2 / 4 / 8"]
              C2["5 suite repeats = 40 requests per cell"]
          end
          MODELS --> RUNNERS
          RUNNERS --> GRID
          GRID --> OUT["latency, throughput, quality, cost per cell"]
          MODELS -.-> NOTE["no MLX build for the MoE - recorded, not forced"]
      ```

      Each strength below is paired with its limit:

      - **Latency:** the 4-bit MoE answers in 0.81 s (p95) with one request
        in flight, 7.80 s at 8. The slowdown is near-linear, so one fast
        cell can't speak for the rest. *Limit:* this machine, this run.
      - **Throughput:** tok/s holds flat-to-declining as load rises, and the
        MoE makes 7× the tok/s of the dense 32B. *Limit:* per-request speed
        still falls as concurrency grows.
      - **Engine + packaging:** the MLX 4-bit build hits 18.8 tok/s vs 6.4
        for llama.cpp Q8_0 at concurrency 1 — about 2.9×. *Limit:* quant and
        packaging differ together, so this is a combo test, not an engine
        test.
      - **Bounded quality:** every arm — the quantized Q8_0 baseline
        included — scored 1.00 on both checks. *Limit:* a tiny task can't
        prove quants never hurt quality.
      - **Cost:** the winner lands near $0.12 per 1M output tokens, from
        measured tok/s and declared 100 W / $0.30-per-kWh assumptions.
        *Limit:* electricity only — no metered wall power, no hardware
        amortization.

      **Business summary:** This section compares the five serving setups. The
      4-bit MoE model answers in 0.81 s, makes 7× the dense 32B's tokens per
      second, and matches every arm at 1.00 quality.
    figures:
      - toks_per_s
    metrics_keys: []
  - id: evaluation
    text_md: |
      On this machine, the 4-bit MoE model is the serving choice. It gives
      sub-second answers at single-user load, the best throughput measured,
      perfect bounded-task quality, and the lowest electricity cost per
      million tokens. The latency-versus-concurrency chart shows the
      near-linear slowdown — 0.81 s with one request in flight, 7.80 s with
      eight — so the verdict weighs the whole ladder, not one fast cell.

      What transfers is the procedure, not the values. Record latency,
      throughput, quality, and cost on the endpoint that will ship. Then pick
      the winner from that record. A later repeat under heavy background
      load hurt only the llama.cpp path — quiet hardware is a prerequisite
      for trusting repeats (the attempt sits under revision notes in
      Details).

      **Business summary:** This section names the winner — the 4-bit MoE model —
      and shows latency rising from 0.81 s at one request to 7.80 s at eight;
      only the procedure transfers, not the values.
    figures:
      - latency_concurrency
    metrics_keys: []
  - id: results
    text_md: |
      Measured on the committed run, in one place:

      - **Winning cell:** qwen3.6:35b-a3b-q4_K_M at concurrency 1 — p50/p95
        latency (the median and 95th-percentile response times) of
        0.63/0.81 s, mean time-to-first-token 0.071 s, 67.7 output tok/s,
        both quality rates at 1.00, zero failures.
      - **Engine panel:** at concurrency 1 on one model family, the chart
        shows the MLX-packaged 4-bit build at 18.8 tok/s and 2.47 s p95
        against 6.4 tok/s and 7.12 s for llama.cpp Q8_0 — about 2.9×, with
        the packaging confound labelled.
      - **Concurrency:** tok/s stays flat-to-declining while per-request
        speed falls; the dense 32B slides from 5.06 s p95 at one request to
        31.27 s at eight.
      - **Quality:** every arm scored 1.00 on both checks — a bounded task,
        so no broad quant-quality claim follows.
      - **Cost:** about $0.12 per 1M output tokens for the winner,
        electricity only; the cloud rate card stays a labelled hypothetical.

      **Business summary:** This section lists the committed results: the
      winner's 0.63/0.81 s median/p95 latency and 67.7 tok/s, a 2.9×
      MLX-over-llama.cpp packaging gap, and cost near $0.12 per 1M output
      tokens.
    figures:
      - engine_panel
    metrics_keys: []
  - id: conclusions
    text_md: |
      The deliverable is the harness; the published numbers are a worked
      example from one machine.

      ## Exact numbers

      Hardware: one quiet Apple-silicon MacBook, 128 GB unified memory,
      macOS 26.5 (arm64); serving stack Ollama 0.40.4; committed run
      2026-10-15 (`--full` grid). The evidence-lineage diagram below shows
      how the raw record flows to the published aggregates without
      re-running anything.

      ```mermaid
      flowchart LR
          subgraph RAW["committed raw inputs"]
              BR["data/bench_run.json - 760 requests, 19 cells"]
              PR["data/prompts.json - 8 prompts + checklists"]
          end
          subgraph OFFLINE["offline re-aggregation - no re-run"]
              RP["report stage"]
              AG["percentiles + tok/s re-derived per cell"]
          end
          subgraph PUB["published evidence"]
              MJ["reports/metrics.json"]
              FIG["reports/figures"]
              HTML["reports/report.html"]
          end
          RAW --> RP
          RP --> AG
          AG --> MJ
          AG --> FIG
          AG --> HTML
      ```

      | model | architecture | quant | runner |
      |---|---|---|---|
      | qwen3.6:35b-a3b-q4_K_M | 3B-active MoE | Q4_K_M | llama.cpp |
      | gpt-oss:20b | dense | MXFP4 | llama.cpp |
      | gemma4:31b | dense | 4-bit MLX | MLX |
      | qwen3:32b (`--full`) | dense | — | llama.cpp |
      | gemma4 q8_0 / -qat (`--full`) | dense | Q8_0 / QAT-int4 | llama.cpp |

      All 19 cells: schema-valid rate 1.00, keyword quality rate 1.00,
      zero failures. Per-cell values, rounded to 4 decimals (p50/p95/p99
      latency s, mean TTFT s, aggregate tok/s):

      | cell | c=1 | c=2 | c=4 | c=8 |
      |---|---|---|---|---|
      | qwen3.6:35b-a3b-q4_K_M p50 / p95 / p99 | 0.6315 / 0.8114 / 1.0078 | 1.3988 / 1.8211 / 2.0091 | 3.4733 / 3.8625 / 3.9619 | 7.1800 / 7.7998 / 7.9760 |
      | qwen3.6 mean TTFT | 0.0712 | 0.7331 | 2.5054 | 5.7291 |
      | qwen3.6 aggregate tok/s | 67.73 | 63.58 | 52.26 | 50.24 |
      | gpt-oss:20b p50 / p95 / p99 | 1.0473 / 1.6364 / 1.7818 | 2.0879 / 2.5926 / 2.7205 | 4.2215 / 4.7989 / 4.9566 | 8.3082 / 9.0396 / 9.1073 |
      | gpt-oss aggregate tok/s | 36.78 | 38.96 | 39.52 | 39.96 |
      | qwen3:32b p50 / p95 / p99 | 3.4228 / 5.0589 / 5.8823 | 6.7456 / 8.5239 / 9.2255 | 14.2829 / 16.3139 / 16.8144 | 28.6865 / 31.2659 / 32.3851 |
      | qwen3:32b aggregate tok/s | 9.56 | 10.01 | 9.59 | 9.37 |
      | gemma4:31b (MLX) p50 / p95 / p99 | 1.9084 / 2.5182 / 2.6776 | 3.8429 / 4.4537 / 4.7797 | 7.3723 / 8.2812 / 8.5824 | 14.4563 / 16.0621 / 16.5970 |
      | gemma4:31b (MLX) aggregate tok/s | 17.58 | 17.91 | 18.42 | 18.54 |
      | gemma4:31b-mlx c=1 p50 / p95 / p99 | 1.8084 / 2.4748 / 3.2160 | — | — | — |
      | gemma4:31b-mlx c=1 tok/s | 18.79 | — | — | — |
      | gemma4:31b-it-q8_0 c=1 p50 / p95 / p99 | 5.1557 / 7.1172 / 8.5988 | — | — | — |
      | gemma4:31b-it-q8_0 c=1 tok/s | 6.43 | — | — | — |
      | gemma4:31b-it-qat c=1 p50 / p95 / p99 | 3.4758 / 4.6887 / 4.9065 | — | — | — |
      | gemma4:31b-it-qat c=1 tok/s | 9.83 | — | — | — |

      Engine comparisons are engine-plus-packaging comparisons. No MLX build
      exists for qwen3.6:35b-a3b — conversion fails on switch-expert weights;
      that missing cell is recorded rather than silently omitted.

      ## Protocol

      | dimension | setup |
      |---|---|
      | cell | concurrency 1/2/4/8; 5 suite repeats = 40 requests |
      | driver | async httpx streaming against `/v1/chat/completions` with `json_schema` |
      | pacing | async semaphore per rung, cooldown between cells |
      | latency | nearest-rank p50/p95/p99 and mean TTFT |
      | throughput | aggregate tok/s over cell wall time plus per-request tok/s |
      | quality | schema-valid rate, keyword quality rate, failures |
      | cost | measured tok/s × declared 100 W draw × $0.30/kWh; cloud card hypothetical |

      The bounded default (3 models × 3 rungs) targets under 45 minutes;
      `--full` adds qwen3:32b, concurrency 2, and the quant/engine cells.

      ## Limits

      - **Portability:** one machine, one Ollama build, one author run; the
        absolute numbers describe this hardware and are not portable, and a
        quiet machine is a prerequisite (the 2026-10-30 repeat under
        co-tenant load degraded llama.cpp cells 10–30× — see revision
        notes).
      - **Cost completeness:** the $0.12-per-1M figure is electricity only
        at declared assumptions; measured wall power needs a wall-power
        meter (not available), and hardware amortization is excluded, so
        this is not a total cost of ownership.
      - **Engine causality:** engine differences are confounded with
        packaging and quantization — no same-quant cross-runner pair exists
        for these models, and the missing MLX build for the MoE was
        recorded, not forced.
      - **Quality generality:** perfect bounded-task scores do not show that
        quantization never affects model quality.
      - **Repeat grid:** re-measurement on quiet, dedicated hardware is deferred
        until access exists; quantization-matched engine isolation waits on
        suitable builds.

      ## Revision notes

      - **Committed run (2026-10-15):** full-grid raw record
        `data/bench_run.json` — 19 cells, 760 requests, Ollama 0.40.4, zero
        failures; the published percentiles re-aggregate offline via `report`.
      - **Repeat attempt (2026-10-30):** the same 11-cell bounded shape (440
        requests) ran under Ollama 0.40.12 while a virtual machine and background
        jobs co-ran. Quality held — every cell kept schema-valid and keyword
        rates at 1.00 — but llama.cpp latency cells were 10–30× slower (mean
        TTFT reached 44 s on the qwen3.6 c=8 cell), the gpt-oss c=8 cell hit ten
        180 s read timeouts, and the MLX cells matched their committed cells.
        The gap is co-tenant memory-bandwidth contention on the llama.cpp path,
        not the 0.40.12 build. Raw record: `data/bench_run_repeat.json`.
      - **Results quality: acceptable with caveats.** The aggregate cells are
        internally consistent for this bounded task, and the raw 760-request
        record is committed for independent re-aggregation; one quiet-machine
        run cannot establish portable latency, throughput, quality, or cost.

      ## Reproduce

      ```bash
      uv sync
      uv run dvc repro   # stages: prepare -> bench -> report
      # or directly:
      uv run python -m inference_serving.cli prepare
      uv run python -m inference_serving.cli bench --full
      uv run python -m inference_serving.cli report
      ```

      **Business summary:** This section records the final grid, protocol,
      limits, and reproduction commands: 19 cells, 760 requests, zero failures,
      and the 4-bit MoE model leading every measured dimension on this machine.
    figures: []
    metrics_keys: []
