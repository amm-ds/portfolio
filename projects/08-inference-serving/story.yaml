project_id: 08-inference-serving
short_version: One laptop, five LLM serving setups, 760 requests, zero failures. The 4-bit MoE records 0.81 s p95 latency
  (0.63 s median) at about $0.12 per 1M output tokens (electricity only). Reuse the harness to re-measure target hardware.
figure_captions:
  quality_quant: 'A compact pass/fail table for the bounded quality guardrail at concurrency 1 — a saturated smoke check:
    every arm ties at 1.00, so it does not establish quality. PASS means all 40 responses in that cell follow the Answer schema
    or contain the required keywords, respectively. The MLX, QAT-int4, and Q8_0 arms pass both checks with zero failures.'
  latency_concurrency: Latency is the time a request takes. The points show p95, the time within which 95% of responses finish,
    at concurrency 1/2/4/8. Error bars span the committed p50–p99 values, from the median to the 99th percentile. Qwen3.6
    rises from 0.81 s at c=1 to 7.80 s at c=8. This near-linear pattern describes this machine and run only.
  toks_per_s: Mean time to first token (TTFT) and aggregate output throughput across concurrency 1/2/4/8. TTFT is the wait
    before the first text arrives; aggregate tok/s is total output tokens divided by cell wall time. The 3B-active mixture-of-experts
    model serves about 7× the tok/s of dense qwen3:32b on this machine, while TTFT rises under load.
  engine_panel: MLX and llama.cpp are runners, the software that serves a model. For Gemma4:31b at c=1, MLX (unrecorded quantization) reaches
    18.8 tok/s and 2.47 s p95 versus llama.cpp Q8_0 at 6.4 tok/s and 7.12 s. Quantization and packaging differ together, so
    this compares combinations, not engines in isolation.
roadmap:
- status: shipped
  title: Standardize the task across all arms
  detail: 8 schema-checked prompts with keyword checklists.
- status: shipped
  title: Commit the full measurement grid
  detail: 760 requests across the grid on one quiet machine, zero failures.
- status: shipped
  title: Catch a silent config error pre-run
  detail: Thinking hit the 128-token cap; reasoning is none/low by model.
- status: shipped
  title: Re-derive every published value offline
  detail: Percentiles recomputed from the raw record before publishing.
- status: next
  title: Validate the choice on shipping hardware
  detail: 'Gate: quiet target hardware, matched-quant runners, and a graded task.'
key_concepts:
- '**Latency percentiles:** p50 is the median response time, p95 is the time within which 95% finish, and p99 is the 99th-percentile
  time. Together they reveal delays that a mean can hide.'
- '**Packaging confound:** the runner and quantization change together, so the 2.9× gap compares combinations rather than
  engines alone.'
- '**Bounded-task quality guardrail:** perfect schema and keyword scores make the timing comparisons fair, but do not prove
  that quantization never hurts quality.'
- '**Measurement portability:** absolute results describe one quiet laptop and one serving stack; the harness should be rerun on
  the hardware that will ship.'
- '**Electricity-only cost:** the $0.12-per-1M estimate uses measured tok/s and declared power assumptions. It excludes metered
  wall power and hardware.'
sections:
- id: background
  text_md: |
    **One laptop, five local AI setups, `760` requests, zero failures.**
    We benchmarked five local `LLM` serving setups on a quiet `128 GB` MacBook (`Ollama 0.40.4`) across `19` cells at concurrency rungs `1/2/4/8` (plus single-request packaging arms).

    ```diagram 08-serving-benchmark
    ```

    Follow the benchmark in three steps:

    - **Same prompts & schema:** Run `8` fixed prompts under one strict answer schema across all `760` requests.
    - **Sweep load (`1/2/4/8`):** Measure `p95` latency, median time, tokens/s, and failure rate at every concurrency level.
    - **Outcome:** A `4`-bit `MoE` (`3B` active params) is fastest at `0.81 s` `p95` (`0.63 s` median, `7×` the dense `32B` output tok/s, `~$0.12` per `1M` output tokens); quality was not compared beyond a saturated format check.

    Next, the measurement contract behind each cell ([Objectives →](#sec-objectives)).

    **In plain terms:** On a 128 GB MacBook, a compact 4-bit model generated about 7× as many tokens per second as the 32B arm and answered about 6× faster at p95; all arms tied only on a saturated format-and-keyword check.
  figures: []
  metrics_keys: []
- id: objectives
  text_md: |
    **Goal: choose the model, runner, and quantization for this workload on
    this laptop.** Vendor numbers describe other hardware and tasks, so the
    choice needs recorded local runs.

    Use the measurement contract diagram as the study checklist. Its first
    node defines a cell as one model, quantization, and concurrency rung,
    with 40 requests. Its record and comparison nodes require four views:

    - **Speed:** `p50`, `p95`, and `p99` latency, plus time to first token (TTFT),
      the wait before the first text arrives. Throughput is output tokens
      per second, measured per request and across the whole cell.
    - **Load:** concurrency rungs `1/2/4/8` test whether a setup that is
      fast for one user slows for several.
    - **Quality and failures:** schema-valid answers follow the requested
      structure, keyword hits contain required terms, and every failure is
      counted.
    - **Cost:** electricity only, under stated assumptions. The cloud rate
      card is a labelled hypothetical, not a quote.

    The comparison node also keeps runner and packaging together, and tests
    quantization on one runner against a quantized baseline. The final node
    draws a verdict from these recorded trade-offs rather than hiding them
    in one score.

    ```diagram auto-08-inference-serving-1
    ```

    Four views need a fixed task. The shared request schema and
    its checks fix it ([Data →](#sec-data)).

    **In plain terms:** Measure speed, response time, answer quality, and errors at 1, 2, 4, or 8 simultaneous users, plus estimated electricity cost per million tokens.
  figures: []
  metrics_keys: []
- id: data
  text_md: |
    The request-schema diagram shows the shared task. Synthetic means made
    locally. The 8 synthetic prompts ask general-knowledge questions and need no
    download or external license. The separately downloaded models retain their own licenses. Each prompt lists required keywords.
    Each answer has one sentence, a confidence score, and a citation. This
    fixed layout is the schema.

    The request envelope fixes temperature at `0`, caps answers at `128`
    tokens, and names the model and concurrency rung. Reasoning effort is `none`
    for qwen3.6 and `low` for gpt-oss, as recorded in `params.yaml`.

    ```diagram auto-08-inference-serving-2
    ```

    The diagram's last step scores each answer. One Answer model in Pydantic
    checks the layout. Pydantic is a Python library for data checks. One
    deterministic parser applies the same rules to all 760 responses.
    Deterministic means the same input gets the same result. This stops the
    checker from making false gaps between setups. Free-form text would not
    allow the same checks.

    All cells use these rules, so they can be compared. Timings still depend
    on the machine. The diagram's records map to `data/prompts.json`,
    `data/bench_run.json`, `reports/metrics.json`, `reports/report.html`, and
    the figures. Published percentiles are recalculated offline from the raw
    record. No new run is needed.

    The schema gives every setup the same task. The quality
    guardrail table makes timings comparable ([EDA →](#sec-eda)).

    **In plain terms:** Eight fixed local prompts, keyword checks, and one strict answer format give every AI setup the exact same test.
  figures: []
  metrics_keys: []
- id: eda
  text_md: |
    Read the quality-by-quantization table before any timing chart. For each
    of the three quantization arms, PASS means all 40 responses in that cell
    met the schema or keyword check. This visible tie reflects the full-grid
    checks: all 760 responses follow the Answer schema and contain their
    prompt's keywords, with both rates at `1.00` in every cell.

    Treat the table as a guardrail, not a general quality verdict. It shows
    that the setups handled this small, bounded task equally well. It does
    not prove that quantization never hurts quality on other tasks.

    One safeguard sits behind the clean table. A preliminary smoke pass found
    that one model used long reasoning chains, exhausted its token budget,
    and returned zero valid answers in its cell. Setting reasoning to `none` for qwen3.6, with the recorded `low` override
    for gpt-oss, and repeating the affected runs made the displayed scores comparable.

    The same deterministic parser produces every result. Human grading could
    drift across 760 responses. A model judge would add another unmeasured
    model. Neither method is used, so the checker itself does not create
    artificial differences.

    The guardrail clears the timing comparison. The serving grid
    and the throughput figure build on it ([Training →](#sec-training)).

    **In plain terms:** All 760 responses followed the required answer format and passed every keyword check (100%) once hidden reasoning text was turned off for a fair race.
  figures: [quality_quant]
  metrics_keys: []
- id: training
  text_md: |
    No model is trained here. The method is the serving setup, and the
    findings are measurements.

    Follow the serving-grid diagram from left to right. It combines five
    setups: a 4-bit `MoE` with 3B active parameters, a 20B `MoE` in MXFP4, a dense 31B on MLX with unrecorded quantization,
    a dense 32B with unrecorded quantization, and a
    Q8_0/QAT-int4 pair on one runner. On that same runner, QAT-int4 reaches `9.83`
    tok/s versus `6.43` for Q8_0, a `53%` throughput gain at concurrency 1. Here, 3B-active means about 3 billion
    parameters participate per token. MXFP4 is a compact 4-bit floating-point format. No committed artifact
    establishes precision for the plain gemma4:31b or qwen3:32b tags.

    The diagram shows `Ollama` routing each model artifact to llama.cpp or MLX,
    the two serving runners. Each then enters the measurement grid:
    concurrency rungs `1/2/4/8` and five suite repeats per cell; quant and engine arms run only at concurrency 1. The dotted
    box records a real limit. The registry has no MLX tag for the `MoE`; an
    earlier conversion attempt failed on switch-expert weights, so that cell is
    absent rather than forced.

    ```diagram auto-08-inference-serving-3
    ```

    The TTFT-and-throughput figure shows two load responses. Read each line
    across the concurrency rungs: mean time to first token rises while
    aggregate tok/s is flat or slightly rising for gpt-oss and gemma4 MLX, and
    falls about `26%` for qwen3.6. That pattern is consistent with serialized
    decoding, but the run does not isolate memory bandwidth, batching, or another
    cause. The `MoE` reaches about `7×` the dense 32B's rate. The figure does not
    show stable per-request speed: that still falls as concurrency grows.

    **Benchmark core: limit concurrency at the client and measure the whole
    cell.** This code implements the diagram's measurement step. An asyncio
    semaphore is a gate that limits active requests. Wall time spans every
    request in the cell.

    ```python
    semaphore = asyncio.Semaphore(concurrency)
    rng = random.Random(seed)
    jobs = [(p, rep) for rep in range(cfg.repeats) for p in PROMPTS]
    rng.shuffle(jobs)

    async def guarded(prompt: BenchPrompt, rep: int) -> RequestRecord:
        async with semaphore:
            return await chat_once(
                client, cfg, model, prompt, rep,
                reasoning_effort=reasoning_effort, notes=notes,
            )

    start = time.perf_counter()
    records = list(await asyncio.gather(*(guarded(p, rep) for p, rep in jobs)))
    wall_time_s = time.perf_counter() - start
    cell = build_cell(
        records, model=model, engine=engine,
        concurrency=concurrency, wall_time_s=wall_time_s,
    )
    return cell, records
    ```

    Excerpt from [bench.py](https://github.com/amm-ds/portfolio/blob/main/projects/08-inference-serving/src/inference_serving/bench.py).

    The grid sets the throughput leader. The latency-versus-concurrency
    chart marks the portability limit ([Evaluation →](#sec-evaluation)).

    **In plain terms:** The compact 4-bit model generates about 7× as many tokens per second as the 32B arm, though every setup slows down as more users ask at once.
  figures: [toks_per_s]
  metrics_keys: []
- id: evaluation
  text_md: |
    On this machine, the 4-bit `MoE` model is the fastest setup measured; choosing it for serving assumes its answers are good enough, which this run does not test. The
    latency-versus-concurrency chart shows the load-sensitive part of that
    verdict. Read the x-axis as one, two, four, or eight requests in flight.
    Each point is `p95` latency, and each whisker spans the committed `p50`–`p99`
    range.

    Follow the `MoE` line rather than only its fastest point. It starts at
    `0.81` s for one request and rises near-linearly to `7.80` s at eight. Each
    added request therefore brings a similar delay. The chart supports a
    sub-second single-user choice, but not a claim of flat latency under
    load.

    The chart also marks the portability limit. Its values come from one
    quiet machine and should be re-measured on the endpoint that will ship.

    Use one chart per dimension instead of a single summary score. This
    preserves the trade-offs that a score would hide. The transferable asset
    is the procedure: record latency, throughput, quality, and cost, then
    choose from those measurements.

    The chart bounds the verdict. The engine panel then compares two
    packaging combinations ([Results →](#sec-results)).

    **In plain terms:** The compact 4-bit model wins on this MacBook, yet its 95th-percentile wait time rises from 0.8 seconds for 1 user to 7.8 seconds for 8 simultaneous users; re-measure on your own hardware.
  figures: [latency_concurrency]
  metrics_keys: []
- id: results
  text_md: |
    The engine panel shows one comparison within the committed run. For
    Gemma4:31b at concurrency 1, read the throughput bars first and the `p95`
    latency bars second. MLX with unrecorded quantization reaches 18.8 tok/s and `2.47` s, while
    llama.cpp Q8_0 reaches 6.4 tok/s and `7.12` s. The panel therefore shows
    about `2.9×` the throughput for the MLX-packaged combination.

    Keep the comparison at that level. Quantization and packaging change
    together, so the figure does not isolate an engine effect. It compares
    two serving combinations, not MLX and llama.cpp under otherwise identical
    conditions. The conclusions retain the full grid, exact values, and
    limits.

    The panel keeps the comparison honest. The exact tables and
    protocol are listed in the conclusions ([Conclusions →](#sec-conclusions)).

    **In plain terms:** Two different serving packages differed by 2.9× in speed, which reflects the full packaging stack rather than a pure engine-only speedup.
  figures: [engine_panel]
  metrics_keys: []
- id: conclusions
  text_md: |
    The evidence-lineage diagram below is the reading guide for this section.
    Follow the raw request records into the published aggregates. Every
    measured value and reference table below comes from that path, without
    another run.

    ## Results summary

    On one quiet `128 GB` Apple-silicon MacBook with macOS 26.5 arm64 and
    `Ollama` 0.40.4, `qwen3.6:35b-a3b-q4_K_M` delivered the leading measured
    result. This 3B-active `MoE` uses Q4_K_M, a 4-bit quantization format. At
    concurrency 1, it measured `0.81` s `p95` latency, `0.63` s median latency, and
    `67.73` output tok/s. Both bounded-task quality rates were `1.00` across 760
    requests, with zero failures. Estimated cost was about `$0.12` per 1M output
    tokens for electricity only.
    [full evaluation report](https://amm-ds.github.io/portfolio/projects/08-inference-serving/)

    ## What the evidence shows

    - **Packaging matters:** the raw-to-aggregate path gives the MLX build
      (unrecorded quantization) about `2.9×` the tok/s of llama.cpp Q8_0. This is a combination
      effect, not an isolated engine result.
    - **The active `MoE` leads this run:** it produces `7×` the dense 32B's tokens
      per second at `0.81` s p95.
    - **Bounded-task quality held:** all 19 cells scored 1.00. This makes the
      timing comparisons fair, but proves nothing broader about quality.
    - **Portability stays limited:** one machine and one serving stack support
      these absolute values; the transferable asset is the measurement harness.
    - **The harness transfers:** record every request, recalculate aggregates
      offline, and re-measure on the machine that will ship. The absolute
      values do not transfer.

    ## Limits

    - **Portability:** one machine, one `Ollama` build, and one author run support
      only these absolute values. An uncommitted repeat observation under co-tenant
      load is excluded from every numeric and causal claim.
    - **Cost completeness:** the $0.12-per-1M estimate is electricity only at
      declared assumptions. Wall power was not measured because a meter was
      unavailable. Hardware amortization, the purchase cost spread over its
      useful life, is excluded. This is not total cost of ownership. Project 13 assumes 65 W for a lighter CPU load on the same class of laptop; neither wattage is measured.
    - **Engine causality:** packaging and quantization confound engine
      differences. No same-quant cross-runner pair exists for these models; the
      missing MLX tag and failed conversion attempt were recorded rather than forced.
    - **Quality generality:** perfect bounded-task scores do not show that
      quantization never affects model quality.
    - **Unproven repeats:** re-measurement on quiet, dedicated hardware waits
      for access. Quantization-matched engine isolation waits for suitable
      builds.

    ## Exact numbers

    The diagram starts with the committed 2026-10-15 `--full` grid on one quiet
    Apple-silicon MacBook. Hardware is `128 GB` unified memory, shared by the
    central and graphics processors, with macOS 26.5 on the arm64 processor
    architecture. `Ollama` 0.40.4 is the serving stack.

          ```diagram auto-08-inference-serving-4
          ```

    The first reference table maps each model name in the evidence path to its
    architecture, quantization, and runner.

    | model | architecture | quant | runner |
    |---|---|---|---|
    | qwen3.6:35b-a3b-q4_K_M | 3B-active MoE | Q4_K_M | llama.cpp |
    | gpt-oss:20b | MoE | MXFP4 | llama.cpp |
    | gemma4:31b | dense | not recorded | MLX |
    | qwen3:32b (`--full`) | dense | not recorded | llama.cpp |
    | gemma4 q8_0 / -qat (`--full`) | dense | Q8_0 / QAT-int4 | llama.cpp |

    All 19 cells derived from the raw record have schema-valid rate `1.00`,
    keyword quality rate `1.00`, and zero failures. The next table keeps selected cells, rounded to 4 decimals; all `19`
    cells remain in `reports/metrics.json`: p50/p95/p99 latency in
    seconds, mean TTFT in seconds, and aggregate tok/s.

    | cell | c=1 | c=2 | c=4 | c=8 |
    |---|---|---|---|---|
    | qwen3.6:35b-a3b-q4_K_M p50 / p95 / p99 | 0.6315 / 0.8114 / 1.0078 | 1.3988 / 1.8211 / 2.0091 | 3.4733 / 3.8625 / 3.9619 | 7.1800 / 7.7998 / 7.9760 |
    | qwen3.6 mean TTFT | 0.0712 | 0.7331 | 2.5054 | 5.7291 |
    | qwen3.6 aggregate tok/s | 67.73 | 63.58 | 52.26 | 50.24 |
    | qwen3:32b p50 / p95 / p99 | 3.4228 / 5.0589 / 5.8823 | 6.7456 / 8.5239 / 9.2255 | 14.2829 / 16.3139 / 16.8144 | 28.6865 / 31.2659 / 32.3851 |
    | qwen3:32b aggregate tok/s | 9.56 | 10.01 | 9.59 | 9.37 |
    | gemma4:31b-mlx c=1 p50 / p95 / p99 | 1.8084 / 2.4748 / 3.2160 | — | — | — |
    | gemma4:31b-mlx c=1 tok/s | 18.79 | — | — | — |
    | gemma4:31b-it-q8_0 c=1 p50 / p95 / p99 | 5.1557 / 7.1172 / 8.5988 | — | — | — |
    | gemma4:31b-it-q8_0 c=1 tok/s | 6.43 | — | — | — |
    | gemma4:31b-it-qat c=1 p50 / p95 / p99 | 3.4758 / 4.6887 / 4.9065 | — | — | — |
    | gemma4:31b-it-qat c=1 tok/s | 9.83 | — | — | — |

    The tables also preserve a missing combination. The registry has no MLX tag
    for qwen3.6:35b-a3b; an earlier conversion attempt failed on switch-expert
    weights, the parameters used by this `MoE` design. The cell is recorded as
    missing, not silently omitted. Engine comparisons remain
    engine-plus-packaging comparisons.

    ## Protocol

    - **Cell construction:** model × quant × concurrency rung (1/2/4/8), with
      5 suite repeats = 40 requests. Async HTTPX streaming uses a Python web
      client to receive tokens as they arrive. Requests go to
      `/v1/chat/completions` with `json_schema` enforcing the answer structure,
      semaphore pacing, and a cooldown pause between cells.
    - **Metric definitions:** nearest-rank p50/p95/p99 latency selects observed
      response times at each percentile. With `n = 40`, p99 is the maximum observation. TTFT is averaged across requests.
      Aggregate tok/s uses total output over cell wall time. Schema-valid rate,
      keyword quality rate, and failures are recorded per cell.
    - **Cost estimate:** divide `1M` tokens by measured tok/s to obtain hours,
      then multiply by declared `0.1 kW` draw and `$0.30/kWh`. The cloud rate card stays a labelled
      hypothetical. The bounded default (3 models × 3 rungs) targets under 45
      minutes; `--full` adds qwen3:32b, concurrency 2, and the quant/engine
      cells.

    **In plain terms:** Across 760 local requests with zero errors, the compact 4-bit model is the fastest option on this laptop with a tie on the saturated format-and-keyword check—wait times still grow under concurrency, and broader accuracy is unmeasured.
  figures: []
  metrics_keys: []
