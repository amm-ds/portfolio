stages:
  prepare:
    cmd: uv run python -m inference_serving.cli prepare
    deps:
      - src/inference_serving
      - params.yaml
    outs:
      - data/prompts.json

  bench:
    cmd: uv run python -m inference_serving.cli bench --full
    deps:
      - src/inference_serving
      - params.yaml
      - data/prompts.json
    outs:
      - data/bench_run.json

  report:
    cmd: uv run python -m inference_serving.cli report
    deps:
      - src/inference_serving
      - params.yaml
      - data/bench_run.json
    outs:
      - reports/report.html
      - reports/figures
    metrics:
      - reports/metrics.json
