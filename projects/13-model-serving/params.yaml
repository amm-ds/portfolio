# Model API serving & Docker deployment — experiment 13.
# The served model is the LightGBM re-derived from experiment 12's committed
# v2 recipe (timestamp lags, keep-higher-MI pruning, seeded HPO, seed 42).
seed: 42
data_source: uci
uci_source: https://archive.ics.uci.edu/static/public/275/bike+sharing+dataset.zip
uci_sha256: b70182d0d0508e9abbb79306ce5c0cec34869000f8220175ac83d11dbe845401
val_weeks: 8
test_weeks: 8
lag_hours:
- 1
- 24
- 168
corr_threshold: 0.9
ridge_alpha: 1.0
# Experiment 12's committed v2 recipe (its params.yaml).
lag_mode: timestamp
pruning_rule: keep_higher_mi
# Experiment 12's committed v2 test MAE for the served LightGBM
# (reports/metrics.json, scored once). The train stage re-derives the recipe
# and must land within reproduction_tolerance — the reproduction check is
# part of the artifact. The v2 MLP (12's validation runner-up) is the cited
# comparison; it is not re-trained here.
champion_expected_test_mae: 23.76360139335002
comparison_mlp_test_mae: 27.161182233265468
reproduction_tolerance: 0.05
lgbm:
  n_estimators: 1500
  early_stopping: 50
  hpo_trials: 50
  hpo_time_budget_s: 240
onnx_opset: 15
parity_tolerance: 0.0001
probe_grid_n: 512
serve:
  host: 127.0.0.1
  port: 8137
  ready_timeout_s: 60
bench:
  concurrency_levels:
  - 1
  - 4
  - 16
  - 64
  requests_per_concurrency: 300
  warmup_requests: 20
  repeats: 3
  batch_sizes:
  - 1
  - 8
  - 32
  - 128
  batch_requests_per_size: 60
  request_timeout_s: 30
  rss_probes: 3
cost:
  usd_per_kwh: 0.30
  system_load_watts: 65.0
data_dir: data
reports_dir: reports
image_repo: portfolio-model-serving
image_tag: "13"
