key_concepts:
  - "**Reproduction gate** — the served artifact must be the champion: same pinned data, recipe, and seed reproduce the committed test MAE exactly before anything is exported."
  - "**Parity gate** — an export is only an artifact after it matches native predictions on a fixed probe grid within tolerance; absolute plus relative float32 terms."
  - "**Paired benchmarking** — both backends consume byte-identical seeded request streams, so latency deltas attribute to the backend, not the load."
  - "**Scored-once discipline, applied to serving** — warm-up excluded, median of repeats, honest n/a cells: benchmark statistics you can re-derive from committed records."
  - "**The image is the deliverable** — measured size breakdown (venv, torch, unused CUDA), COPY-time ownership, healthcheck-gated readiness: deployment truths a build reveals."
  - "**Cost with declared assumptions** — measured throughput times a stated wattage and $/kWh: an honest estimate with its inputs written down, never a fake precision number."
figure_captions:
  latency_concurrency_lines: Per-request latency vs concurrency for both backends — median of 3 repeats, shaded band = repeat min/max on the p95. Single-request p50 is ~2 ms; the curve bends where one shared CPU saturates.
  batch_throughput_curve: The batch endpoint under saturation — throughput scales ~linearly with batch size while per-request latency stays flat (queue-dominated). ~56k rows/s at size 128 on both backends.
  backend_comparison_slope: Paired p50 latency per concurrency cell, native on the left, ONNX on the right; the x-label is the ONNX/native ratio. Gaps inside ~20% read as scheduling noise on a shared CPU.
  footprint_cost_bars: "Three honest footprints: fresh-process RSS (298 vs 318 MB), the measured 6.5 GB image broken into base, venv, and model, and the electricity cost per 1k predictions at the committed concurrency-16 basis (65 W, $0.30 per kWh, declared)."
