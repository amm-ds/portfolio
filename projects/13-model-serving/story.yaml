- status: shipped
  title: Reproduce the champion; gate the export
  detail: Parity max-abs of 7.2e-07 sits orders inside the gate.
- status: shipped
  title: Pass both backends through load testing
  detail: 4,320 requests per backend finished with zero errors.
- status: shipped
