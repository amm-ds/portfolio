project_id: 13-model-serving
headline: 'The served tabular MLP from experiment 12 ships as a small FastAPI service: native torch vs ONNX Runtime measured
  under the same seeded load — 1.6 ms p50 single-request (native/ONNX p95 2.0/1.9 ms, p99 2.2 ms; n = 300 requests/cell), a ~950 req/s throughput
  knee, a measured 6.5 GB image whose slim-build delta implicates torch and unused CUDA libraries, and about $0.000012 electricity per
  1k predictions on a laptop.'
data_note: Served MLP re-derived from experiment 12's committed recipe (UCI Bike Sharing hourly, sha256-pinned) — the identical
  frame hash reproduces the committed 25.4316 test MAE to the last digit before serving begins.
limits: 'Single laptop, no GPU, one uvicorn worker, one model: absolute numbers, paired native-vs-ONNX deltas, and curve shapes
  are host-specific observations, not demonstrated transfer; localhost latency has no network term; the wattage behind the
  cost line is a declared assumption, not a measurement.'
short_version: |
  Project 12's MLP (25.4316 test MAE) is rebuilt and exported to ONNX behind a
  7.2e-07 parity gate. One FastAPI schema serves both backends. Paired tests:
  1.6 ms p50, ~950 req/s knee, ~56k rows/s batched; image 6.5 GB, or 291 MB
  ONNX-only.
sections:
- id: background
  text_md: |
    **What does it take to turn a trained model into software other systems can call?**
    This study ships the selected hourly bike-rental `MLP` from project `12` behind a `FastAPI` service, comparing `PyTorch` and ONNX Runtime under a warmed, paired benchmark (`300` requests per cell).

    ```diagram 13-serving-pipeline
    ```

    Follow the serving path in three steps:

    - **Rebuild & match:** Reproduce the model's `25.4316` mean absolute error (MAE) and gate ONNX export on `7.2e-07` max-abs parity.
    - **Serve & probe:** Wrap both backends in one `FastAPI` service with schema checks and readiness probes.
    - **Measure load:** Record `1.6 ms` `p50` (native/`ONNX` `p95` `2.0/1.9 ms`), `~950 req/s` knee, `~56k rows/s` batched, and a `291 MB` `ONNX` image.

    Next, the three gates that protect the results ([Objectives →](#sec-objectives)).

    **In plain terms:** We packaged the bike-rental model from project 12 into a live web service that answers in under 2 milliseconds, handles about 950 requests per second, and shrinks the server image from 6.5 GB to 291 MB.
  figures: []
- id: objectives
  text_md: |
    **Three gates protect the results.** The same pinned data, recipe, and
    seed 42 must first reproduce experiment 12's committed test `MAE` (mean
    absolute error). The portable `ONNX` export must then match the native
    `PyTorch` model within `1e-4` maximum absolute difference on `512` fixed
    probe rows. Only after those checks does the paired serving benchmark begin.

    ```diagram auto-13-model-serving-1
    ```

    The diagram's measurement gate uses four checks:

    - Reproduction: derived test `MAE` stays within tolerance of 12's committed 25.4316.
    - Parity: `ONNX` matches native within 1e-4 max-abs on 512 seeded probe rows.
    - Paired benchmarking: both backends receive identical request bytes. Warm-up is excluded, and each cell reports the median of `3` repeats.
    - Container evidence: measure image size, fresh-process memory, and electricity cost with declared assumptions.

    The identical recipe and feature contract show how the rebuilt served model
    clears the first gate ([Data →](#sec-data)).

    **In plain terms:** We first check that the portable model matches the original, then give both versions the same requests so their speed, memory, and cost comparisons are fair.
  figures: []
- id: data
  text_md: |
    **The same recipe rebuilds the served model.** Experiment 12 selected the
    tabular `MLP` by validation `MAE` on the UCI Machine Learning Repository's
    Bike Sharing hourly dataset
    ([dataset card](https://amm-ds.github.io/portfolio/data-registry/bike-sharing/)).
    Validation `MAE` selects the model; the final `25.4316` `MAE` comes from
    the last 8-week test window, scored once.

    The diagram compares the original and rebuilt paths. Both use the same
    pinned zip, seed 42, cyclical time features, and past-only count lags.
    Both also use the same learned hour embedding and hand-written training loop.

    ```diagram auto-13-model-serving-2
    ```

    The matching frame checksum confirms identical data. The same apparent-
    temperature field `atemp` is pruned at correlation `r = 0.9873`. The rebuilt
    model matches the test `MAE` digit for digit.

    The request schema then enforces that feature selection. Raw hour
    feeds the embedding index, and the 15 selected numeric fields feed the
    main network. `atemp` is absent because the selection rule removed it.

    With the rebuild verified, one probe grid can test export correctness and
    later drive the benchmark ([EDA →](#sec-eda)).

    **In plain terms:** The service uses exactly the same bike-rental inputs as project 12, reproduces its average error of 25.43 rentals per hour, and rejects malformed requests automatically.
  figures: []
- id: eda
  text_md: |
    **One probe grid tests correctness and later drives the benchmark.** The
    diagram shows `512` seeded rows. They span every hour, weather situations `1`–`4`, cyclical terms in
    `[-1, 1]`, and lags up to `800`. These legal ranges
    match the dataset's quality gates. A legal request stays within the range
    seen by the saved training scaler.

    `ONNX Runtime` executes the portable graph. Its measured output gap from
    native torch is `7.15e-07` on the standardized scale. That is about `140×`
    inside the `1e-4` absolute tolerance. The implemented gate is
    `limit = tolerance + 1e-5 × max(1, max|native_scaled|)`. The relative term
    allows for rounding as output magnitude grows. Here the absolute term dominates.

    ```diagram auto-13-model-serving-3
    ```

    The gate applies on the standardized scale. Multiplying by `y_std` gives a
    maximum end-to-end gap of `0.0001237` rentals. This tiny gap does not change
    a prediction at useful rental precision. The schema also rejects bad hours,
    weather codes, and missing fields. These requests receive `HTTP 422` responses.

    The guarded service turns that verified export into a warmed, observable
    API ([Training →](#sec-training)).

    **In plain terms:** The original and portable models differ by at most 0.00012 rentals on the final prediction scale, the checks are repeatable, and bad inputs return clear errors.
  figures: []
- id: training
  text_md: |
    **Training produces a guarded service.** Fitting the model takes `2.4 s`
    in the committed run. Training saves the `PyTorch` weights and architecture
    metadata. The `ONNX` export uses opset `17` and a dynamic batch axis so one
    graph accepts different batch sizes. The pipeline stops unless reproduction
    and parity both pass.

    ```diagram auto-13-model-serving-4
    ```

    On the service side of the diagram, `Pydantic` validates each request against
    the feature bounds. The API provides `POST /predict`, `POST /predict/batch`, `/health`, and
    `/ready`. Readiness turns on only after warm-up rows pass through the backend. Every response carries
    a request id for tracing, and errors use structured envelopes instead
    of stack traces.

    The `--backend native|onnx` flag is the only difference between the two
    deployments shown. The compose healthcheck and benchmark harness both wait
    for `/ready`,
    so they measure a warmed service.

    **Readiness core: warm the real backend before accepting traffic.** The
    code below implements the diagram's readiness gate. Startup fails on
    non-finite model output, and readiness follows successful inference.

    ```python
    def warmup(self, n: int = 16) -> None:
        hour = np.arange(n, dtype=np.int64) % self._hour_cardinality
        zeros = np.zeros((n, len(self.numeric_cols)), dtype=np.float32)
        scaled = self._predict_scaled(
            hour, ((zeros.astype(np.float64) - self.x_mean) / self.x_std)
        )
        if not np.all(np.isfinite(scaled)):
            raise RuntimeError(f"{self.backend} warm-up produced non-finite output")
        self.ready = True

    @asynccontextmanager
    async def _lifespan(app: FastAPI) -> AsyncIterator[None]:
        loader: ModelLoader = app.state.loader
        loader.warmup()
        yield
    ```

    Excerpts from [model.py](https://github.com/amm-ds/portfolio/blob/main/projects/13-model-serving/src/model_serving/service/model.py) and [app.py](https://github.com/amm-ds/portfolio/blob/main/projects/13-model-serving/src/model_serving/service/app.py).

    One paired protocol now measures that warmed service from three angles
    ([Evaluation →](#sec-evaluation)).

    **In plain terms:** One web service runs both model backends behind automatic parity checks and health probes so traffic only arrives once the model is warmed up.
  figures: []
- id: evaluation
  text_md: |
    **The three figures below come from one paired protocol.** An asynchronous
    driver starts each real service, waits for `/ready`, and excludes warm-up
    work. It sweeps `1/4/16/64` simultaneous clients with `300` requests per cell
    and `3` repeats, then reports medians. Both backends receive the same probe-
    grid bytes. The explicit multi-row batch endpoint uses sizes `1/8/32/128`.

    In `latency_concurrency_lines`, follow both curves as concurrency rises.
    Single-request `p50` is `1.6 ms` on both backends; native/`ONNX` `p95` is
    `2.0/1.9 ms`. Throughput reaches a knee near `950 req/s` around concurrency
    `4`, where adding clients stops improving completed requests per second.
    Beyond it, driver and service likely contend for one CPU. At `64` clients,
    native/`ONNX` `p50` is `65.4/63.1 ms` and `p95` is `0.249/0.210 s`.

    In `batch_throughput_curve`, compare the rising throughput with the
    flatter per-request latency. Throughput grows roughly linearly with
    batch size and reaches `55.8k` native and `57.5k` `ONNX` rows/s at size `128`.
    This tests the explicit batch
    endpoint; it does not implement or demonstrate dynamic request batching.
    The chart does not isolate queueing from computation.

    In `backend_comparison_slope`, compare each paired native and `ONNX` point.
    Across the four concurrency cells, `ONNX` leads c64 throughput by `13.8%`
    and `p50` differs by at most `4.0%`; the other throughput gaps are smaller.
    Batch results are not ties: `ONNX` throughput is `15.4%` higher at b8 and
    `11.2%` higher at b32, while native is `12.5%` higher at b1. Identical
    requests isolate serving behavior, but do not prove these host-specific
    gaps are noise.

    The measured ledger keeps these backend differences and host caveats
    attached ([Results →](#sec-results)).

    **In plain terms:** A typical single request finishes in 1.6 milliseconds, with 95% finishing within 1.9–2.0 milliseconds. Throughput peaks near 950 requests per second, and the largest batches process about 56,000 rows per second.
  figures: [latency_concurrency_lines, batch_throughput_curve, backend_comparison_slope]
- id: results
  text_md: |
    **The measured ledger keeps its caveats attached.** Every number traces
    to `reports/metrics.json`; the footprint and cost figure adds the resource
    evidence behind the deployment choice.

    - Gates: reproduction exact (`25.4316` vs `25.4316`); parity max-abs 7.2e-07 on 512 probe rows, tolerance 1e-4.
    - Latency: `p50` `1.6 ms` single-request on both backends; `p95` under `6 ms` through concurrency 4; `p99` `2.2 ms` at c=1; native/`ONNX` `p50` is `65.4/63.1 ms` at 64 clients, where the shared CPU is likely saturated. n = 300 requests per cell, nearest-rank percentiles, median of 3 repeats.
    - Throughput: concurrency-4 medians are `933` native and `970` `ONNX` req/s;
      throughput sags at `16` clients, then partially recovers at `64`. The
      explicit benchmark does not enable dynamic request batching, so the sag is
      not a batching artifact. Single-worker event-loop or client/server CPU
      contention is a hypothesis, not an isolated cause. `ONNX` is `13.8%` ahead
      at c64 throughput and concurrency `p50` differs by at most `4.0%`; zero errors
      occur across `4,320` requests per backend.
    - Batch: `55.8k` native and `57.5k` `ONNX` rows/s at size `128`; backend
      throughput spreads reach `15.4%` in the batch grid, so no all-cell tie is claimed.

    In `footprint_cost_bars`, compare the memory bars, image components,
    and cost panel. RSS, or resident set size, is the memory held by a
    running process. Fresh-process RSS is `298` native versus `318` `ONNX` MB.
    The full image measures `6.5 GB`: `145 MB` base, `6,192 MB` virtual
    environment, and `1 MB` model. The slim environment is only `149 MB`; that
    delta supports torch and its bundled CUDA libraries as the likely source of
    the extra weight, but no per-package size breakdown was measured. This CPU service never loads CUDA.

    The same figure's image comparison includes the ONNX-only slim image
    (`Dockerfile.slim`, `docker-slim` command). It measures `291 MB` against
    `6,466` MB, or `22.2×` smaller, with a `149 MB` venv. Its smoke test checks
    `/ready` and one contract-shaped prediction in a running container,
    recorded in `reports/docker_slim.json`.

    The measured `6.5 GB` bar is the fixed build, down from the `12.8 GB`
    pre-fix counterfactual recorded in `DESIGN.md`. The environment stays at its
    final path because script interpreter paths are absolute; setting ownership
    during `COPY` avoids a later `chown -R` copying that large layer.

    The cost panel shows about `$0.000012` per 1k predictions at the committed
    concurrency-16 basis. It uses median-of-repeats throughput on this host
    with declared assumptions of 65 W (watts) and `$0.30` per kWh. The
    throughput peak sits at concurrency 4.

    The compose smoke test also passes: a healthcheck-gated dependency lets
    the one-shot smoke service request a real prediction from the API.

    The study leaves out TLS and authentication, multi-worker or
    multi-replica serving, and GPU serving. TLS encrypts network traffic,
    authentication checks identity, and extra workers or replicas run more
    service copies. The slim image ships beside the full image. Torch imports
    sit behind the native backend, so `ONNX` never loads them. The slim build
    pins six locked dependencies plus portfolio-core `--no-deps`; the enforced
    prediction-parity check covers the exported model before this `ONNX`-only
    runtime is built.

    The exact tables and protocol make every ledger value reproducible
    ([Conclusions →](#sec-conclusions)).

    **In plain terms:** Both versions typically answer in 1.6 milliseconds and cost about $0.000012 of electricity per 1,000 predictions under the stated assumptions. The lightweight container is 291 MB instead of 6.5 GB.
  figures: [footprint_cost_bars]
- id: conclusions
  text_md: |
    ## Results summary

    The summary diagram below connects each deployment stage to its result.
    Experiment 12's served `MLP` reproduces exactly, `ONNX` parity is gated at
    7.2e-07 max-abs, and single-request `p50` is 1.6 ms. The load curve reaches
    a ~950 req/s knee, while batching reaches ~56k rows/s. The measured full
    image is 6.5 GB. Electricity costs `~$0.000012` per 1k predictions under
    declared assumptions. [full evaluation report](https://amm-ds.github.io/portfolio/projects/13-model-serving/)

    ```diagram auto-13-model-serving-5
    ```

    ## What the experiment taught

    Each lesson below maps to a stage in the summary diagram.

    - The export gate is non-negotiable. An `ONNX` graph needs comparison with
      native predictions on a fixed grid before it counts as a verified
      artifact. Here that comparison is an enforced pipeline stage.
    - Absolute parity tolerances can need a relative float32 term. Kernel-order
      noise scales with output magnitude, so a purely absolute gate sized for
      small outputs can become too tight as outputs grow.
    - Paired payloads matter more than identical settings alone. Both
      backends saw the same byte stream, so the small saturated-cell deltas
      (`13.8%` at c64 throughput; concurrency `p50` within `4.0%`) are measured
      host-specific deltas, not a universal backend ranking.
    - Image measurement exposes hidden costs. The CPU tabular model carries
      CUDA libraries it never loads, and a `chown` after `COPY` doubled the
      venv layer until measurement revealed it.

    ## Limits

    These limits apply to every result in the table and summary diagram.

    - Single laptop, no GPU, one worker, shared CPU: absolute numbers, paired
      deltas, curve shapes, the concurrency-4 knee, and batch amortization
      are host-specific observations, not demonstrated transfer. Committed
      concurrency-4 medians span 933–970 req/s across the two backends.
      High-concurrency cells likely include contention, so they do not isolate pure service capacity.
      Re-measure with the paired harness on the target deployment.
    - No TLS, auth, multi-worker or GPU path. The paired harness needs both
      backends; a CPU-only torch native image remains a separate variant.
    - The NVIDIA/CUDA stack inside the full image is never loaded by
      this CPU service. The ONNX-only slim image (`Dockerfile.slim`, `291 MB`,
      smoke-passed) is the built answer. Stripping the stack from the
      *native* image remains a separate variant.
    - Cost is electricity-only at a declared 65 W and `$0.30` per kWh. There is
      no wall meter or amortized hardware. Re-derive the number on your
      hardware before quoting it.

    ## Exact numbers

    The table gives the expert reference values behind the summary diagram.
    The `p99` is the latency that `99%` of requests stay within. `ONNX` backend,
    median of 3 repeats; 300 requests per concurrency level (20 warm-up
    excluded) and 60 per batch size; zero errors in every cell.

    | cell | p50 | p95 | p99 | throughput |
    |---|---|---|---|---|
    | concurrency 1 | 1.6 ms | 1.9 ms | 2.2 ms | 612 req/s |
    | concurrency 4 | 3.9 ms | 4.7 ms | 5.7 ms | 970 req/s (knee) |
    | concurrency 16 | 26.1 ms | 66.2 ms | 94.9 ms | 470 req/s |
    | concurrency 64 | 63.1 ms | 209.8 ms | 290.9 ms | 715 req/s |
    | batch 1 | 65.1 ms/req | — | — | 513 rows/s |
    | batch 8 | 48.5 ms/req | — | — | 5,104 rows/s |
    | batch 32 | 51.0 ms/req | — | — | 18,674 rows/s |
    | batch 128 | 65.3 ms/req | — | — | 57,451 rows/s |

    Fresh-process RSS is `298` native versus `318` `ONNX` MB. Concurrency cells
    are close, but batch throughput differs by up to `15.4%`; no all-cell tie is
    claimed. Reproduction: the derived test `MAE` equals experiment 12's committed
    value to the last digit (`25.43163249606178`, abs diff 0.0). Parity: 7.15e-07
    max-abs on the standardized network output over 512 seeded probe rows, inside
    the 1e-4 gate.

    ## Protocol

    These controls produced the table and the summary diagram's measurements.

    - Reproduction: same pinned zip (`sha256` gate), same recipe and seed 42;
      scored once on the frozen 8-week test window.
    - Parity: 512-row seeded probe grid; max-abs on raw network output;
      gate enforced before benchmark or docker stages run.
    - Benchmark: both backends run as separate service processes behind the
      same `FastAPI` app on byte-identical seeded request streams (seed 42).
      The saturated-cell deltas are paired, not incidental. Warm-up is
      excluded, with 300 requests per concurrency cell (1/4/16/64), median
      of 3 repeats, batch sizes 1/8/32/128 saturated, and fresh-process RSS
      probed three times per backend. The benchmark stage runs in 25.1 s.
    - Docker: repo-root build context, frozen uv lockfile, non-root,
      healthcheck-gated readiness, compose smoke on /health /ready /predict.
      The lockfile fixes package versions, and the service runs without
      administrator rights.

    **In plain terms:** Check that the portable model matches the original, warm up the server before accepting traffic, and use the 291 MB runtime when a small container matters more than the measured backend differences.
  figures: []
