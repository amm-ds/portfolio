key_concepts:
- '**Reproduction gate:** The same pinned data, recipe, and seed must reproduce the served model''s committed test MAE exactly
  before export.'
- '**Parity gate:** The export must match native predictions on a fixed probe grid within an absolute plus relative float32
  tolerance.'
- '**Paired benchmarking:** Both backends receive byte-identical seeded request streams, so the load cannot explain latency
  differences.'
- '**Scored-once discipline for serving:** Exclude warm-up, report the median of repeats, keep honest n/a cells, and preserve
  re-derivable records.'
- '**The image is the deliverable:** Measure base, venv, and model layers, infer framework weight from a slim build,
  set ownership during COPY, and gate traffic on readiness.'
- '**Cost with declared assumptions:** Combine measured throughput with stated wattage and $/kWh. This is an estimate with
  visible inputs, not false precision.'
figure_captions:
  latency_concurrency_lines: Per-request latency versus concurrency for both backends. Points are medians of 3 repeats, and
    the shaded band shows the repeat minimum and maximum for p95. Single-request p50 is 2.0 ms native and 2.4 ms ONNX; native
    p95 is 2.9 ms. The curves bend where the shared CPU likely saturates.
  batch_throughput_curve: The batch endpoint under saturation. Throughput scales ~linearly with batch size while
    per-request latency stays comparatively flat; queueing and computation are not separated. At size 128 native reaches 28.2k rows/s and ONNX 40.9k rows/s.
  backend_comparison_slope: Paired p50 latency for each concurrency cell, with native on the left and ONNX on the right. The
    x-label is the ONNX/native ratio. Native leads every concurrency cell; batch cells are outside this plot.
  footprint_cost_bars: 'Three measured or declared footprints: fresh-process RSS (213 vs 113 MB), the measured 1,060 MB image
    split into base, venv, and model, and estimated electricity cost per 1k predictions at the committed concurrency-16 basis
    (65 W, $0.30 per kWh, declared).'
