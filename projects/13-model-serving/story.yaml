project_id: 13-model-serving
headline: 'The champion tabular MLP from experiment 12 ships as a small FastAPI service: native torch vs ONNX Runtime measured
  under the same seeded load — 1.6 ms p50 single-request (p95 2.0 ms, p99 2.2 ms; n = 300 requests/cell), a ~950 req/s throughput
  knee, a measured 6.5 GB image whose venv is mostly torch and unused CUDA libraries, and about $0.000012 electricity per
  1k predictions on a laptop.'
data_note: Champion MLP re-derived from experiment 12's committed recipe (UCI Bike Sharing hourly, sha256-pinned) — the identical
  frame hash reproduces the committed 25.4316 test MAE to the last digit before serving begins.
limits: 'Single laptop, no GPU, one uvicorn worker, one model: absolute numbers, paired native-vs-ONNX deltas, and curve shapes
  are host-specific observations, not demonstrated transfer; localhost latency has no network term; the wattage behind the
  cost line is a declared assumption, not a measurement.'
short_version: |
  Experiment 12's champion MLP (25.4316 test MAE) is re-derived, exported to
  ONNX behind a hard parity gate (7.2e-07 max-abs), and served two ways from
  one FastAPI schema. Seeded paired tests: 1.6 ms p50, ~950 req/s knee, ~56k
  rows/s batched; image 6.5 GB, mostly unused CUDA.
sections:
- id: background
  text_md: |
    **What does it take to turn a trained model into software other systems can call?**
    This study ships the champion hourly bike-rental `MLP` from project `12` behind a `FastAPI` service, comparing `PyTorch` and ONNX Runtime under a warmed, paired benchmark (`300` requests per cell).

    ```diagram 13-serving-pipeline
    ```

    Follow the serving path in three steps:

    - **Rebuild & match:** Reproduce the `25.4316` `MAE` model and gate ONNX export on `7.2e-07` max-abs parity.
    - **Serve & probe:** Wrap both backends in one `FastAPI` service with schema checks and readiness probes.
    - **Measure load:** Record `1.6 ms` `p50` (`2.0 ms` `p95`), `~950 req/s` knee, `~56k rows/s` batched, and a `291 MB` `ONNX` image.

    Next, the three gates that protect the results ([Objectives →](#sec-objectives)).

    **In plain terms:** We packaged the bike-rental model from project 12 into a live web service that answers in under 2 milliseconds, handles about 950 requests per second, and shrinks the server image from 6.5 GB to 291 MB.
  figures: []
- id: objectives
  text_md: |
    **Three gates protect the results.** Follow their order in the diagram.
    First reproduce the champion. Next verify export parity. Then measure
    serving. Mean absolute error (`MAE`) is the average prediction error.
    Test `MAE` uses data held back for a final check. The same pinned data,
    recipe, and seed must reproduce experiment 12's committed test MAE.
    A seed is a fixed start value that makes random choices repeatable.

    `ONNX`, or Open Neural Network Exchange, is a portable model format.
    Parity means the `ONNX` export and native torch model make the same
    predictions. Native torch is the original `PyTorch` implementation.
    Maximum absolute difference, or max-abs, is the largest gap between
    paired outputs. The hard gate requires max-abs within 1e-4 on a fixed
    probe grid. This grid is a reusable set of test inputs.

    ```diagram auto-13-model-serving-1
    ```

    The diagram's measurement gate uses four checks:

    - Reproduction: derived test `MAE` stays within tolerance of 12's committed 25.4316.
    - Parity: `ONNX` matches native within 1e-4 max-abs on 512 seeded probe rows.
    - Paired benchmarking: both backends receive identical request bytes. A backend is the software that runs the model. Warm-up is excluded. Each cell reports the median, or middle result, of 3 repeats.
    - Container evidence: measure image size, fresh-process memory, and electricity cost with declared assumptions.

    The gates need a rebuilt champion; next, the identical recipe and
    feature contract ([Data →](#sec-data)).

    **In plain terms:** First prove the exported model gives the exact same predictions as training, then measure response time, memory, and cost fairly across both serving engines.
  figures: []
- id: data
  text_md: |
    **The same recipe rebuilds the champion.** Experiment 12 selected the
    tabular `MLP` by validation `MAE` on the UCI Machine Learning Repository's
    Bike Sharing hourly dataset
    ([dataset card](https://amm-ds.github.io/portfolio/data-registry/bike-sharing/)).
    Validation `MAE` measures error on data used to choose a model. The final
    score was `25.4316` `MAE` on the last 8-week test window, scored once.

    The diagram compares the original and rebuilt paths. Both use the same
    pinned zip, seed 42, cyclical features, and past-only lags. Cyclical
    features represent repeating patterns such as hours. Lags are earlier
    values used as inputs. Both also use the same hour-embedding `MLP` and
    hand-written training loop. An embedding converts an hour category into
    numbers the network can learn from.

    ```diagram auto-13-model-serving-2
    ```

    The matching frame checksum in the diagram confirms identical data. A
    checksum is a fingerprint for a file or data frame. The same feature
    pair is pruned: `atemp`, the apparent-temperature field, drops at
    r = 0.987. Here r is the correlation coefficient, which measures how
    closely two fields move together. The rebuilt model matches the test
    `MAE` digit for digit.

    The diagram's request contract follows that feature selection. A request
    schema lists the required fields and their allowed values. Raw hour
    feeds the embedding index, and the 15 selected numeric fields feed the
    main network. `atemp` is absent because the selection rule removed it.

    The rebuild is verified; next, the probe grid that tests correctness
    and drives the benchmark ([EDA →](#sec-eda)).

    **In plain terms:** The serving pipeline locks the exact bike-rental features and 25.43 bikes/hour accuracy from project 12 and rejects malformed requests automatically.
  figures: []
- id: eda
  text_md: |
    **One probe grid tests correctness and later drives the benchmark.** The
    diagram shows 512 seeded rows spanning every hour, weather situations
    1-4, cyclical terms in [-1, 1], and lags up to 800. These legal ranges
    match the dataset's quality gates. A legal request therefore stays
    within the envelope seen by the scaler during training. A scaler is a
    saved transformation that puts features on the training scale.

    `ONNX Runtime` is software that executes `ONNX` models. On raw network
    output, its measured max-abs deviation from native torch is 7.2e-07,
    three orders inside the 1e-4 gate. The tolerance combines an absolute
    term with a small relative float32 term. Float32 is a 32-bit number
    format used by the model. The relative term allows for kernel-order
    noise, meaning tiny rounding changes caused by calculation order, as
    output size grows. A purely absolute gate could misfire on ill-scaled
    models. Here the absolute term dominates.

    ```diagram auto-13-model-serving-3
    ```

    Read the diagram's two outcomes together. The export gap on the rentals
    scale is 1.2e-04, which is floating-point noise rather than changed
    behavior. The schema also rejects out-of-range hours, bad weather codes,
    and missing fields with the standard 422 response. HTTP 422 means the
    API understood the request but its contents failed validation.

    The grid passes parity; next, the guarded service and its readiness
    gate ([Training →](#sec-training)).

    **In plain terms:** Exported predictions match training within 0.000001 (less than one-millionth of a bike), benchmarks are repeatable, and bad inputs return clean errors.
  figures: []
- id: training
  text_md: |
    **Training produces a guarded service.** Fitting
    the champion takes seconds on this data size. Training saves the native
    state_dict, which contains the `PyTorch` model weights. It also saves an
    architecture json file. `JSON` is a text format for structured data, used
    here to describe the model. The `ONNX` export uses opset 17, the version
    of `ONNX` operations used here. Dynamic batch allows one exported model
    to accept different batch sizes. The pipeline stops unless reproduction
    and parity both pass.

    ```diagram auto-13-model-serving-4
    ```

    On the service side of the diagram, Pydantic checks each request against
    the feature bounds. Pydantic is a Python library for validating data.
    The API provides `POST /predict`, `POST /predict/batch`, `/health`, and
    `/ready`. Readiness means the service can accept traffic. It turns on
    only after warm-up rows pass through the backend. Every response carries
    a request id for tracing, and errors use structured envelopes instead
    of stack traces.

    The `--backend native|onnx` flag is the only difference between the two
    deployments shown. A healthcheck is an automatic service status probe.
    The compose healthcheck and benchmark harness both wait for `/ready`,
    so they measure a warmed service.

    **Readiness core: warm the real backend before accepting traffic.** The
    code below implements the diagram's readiness gate. Inference means the
    model is making a prediction. Startup fails on non-finite output, such
    as an infinite value, and readiness follows successful inference.

    ```python
    def warmup(self, n: int = 16) -> None:
        hour = np.arange(n, dtype=np.int64) % self._hour_cardinality
        zeros = np.zeros((n, len(self.numeric_cols)), dtype=np.float32)
        scaled = self._predict_scaled(
            hour, ((zeros.astype(np.float64) - self.x_mean) / self.x_std)
        )
        if not np.all(np.isfinite(scaled)):
            raise RuntimeError(f"{self.backend} warm-up produced non-finite output")
        self.ready = True

    @asynccontextmanager
    async def _lifespan(app: FastAPI) -> AsyncIterator[None]:
        loader: ModelLoader = app.state.loader
        loader.warmup()
        yield
    ```

    Excerpts from [model.py](https://github.com/amm-ds/portfolio/blob/main/projects/13-model-serving/src/model_serving/service/model.py) and [app.py](https://github.com/amm-ds/portfolio/blob/main/projects/13-model-serving/src/model_serving/service/app.py).
    The service is warmed; next, the three figures from one paired
    protocol ([Evaluation →](#sec-evaluation)).

    **In plain terms:** One web service runs both model backends behind automatic parity checks and health probes so traffic only arrives once the model is warmed up.
  figures: []
- id: evaluation
  text_md: |
    **The three figures below come from one paired protocol.** An async
    driver is a test program that can send overlapping requests. It starts
    each real service, waits for `/ready`, and sends warm-up work that no
    cell counts. It sweeps concurrency 1/4/16/64 with 300 requests per cell
    and three repeats, then reports medians. Concurrency is the number of
    simultaneous clients. Both backends receive the same probe-grid bytes.
    The batch endpoint, which processes several rows in one request, uses
    sizes 1/8/32/128.

    In `latency_concurrency_lines`, follow both curves as concurrency rises.
    Latency is the time one request takes. The `p50` is the median latency,
    and `p95` is the latency that `95%` of requests stay within. Single-request
    `p50` is about `2 ms` for both backends. Throughput is completed requests
    per second, written req/s. It reaches a knee near 950 req/s around
    concurrency 4. A knee is where more concurrency stops improving
    throughput. Beyond it, the driver and service share one CPU, or central
    processing unit. At 64 clients, `p50` is about `63 ms` and `p95` about `0.21` s.

    In `batch_throughput_curve`, compare the rising throughput with the
    flatter per-request latency. Throughput grows roughly linearly with
    batch size and reaches about 56k rows/s on both backends at size 128.
    Rows/s counts prediction rows per second. This tests the explicit batch
    endpoint; it does not implement or demonstrate dynamic request batching.
    The chart does not isolate queueing from computation.

    In `backend_comparison_slope`, compare each paired native and `ONNX`
    point. `ONNX` leads the c64 throughput cell by `13.8%` and ties elsewhere;
    `p50` medians differ by at most 4%. Because the requests match, these
    small gaps read as scheduling noise on a shared CPU, not a different
    model.

    The protocol is paired; next, the measured ledger with its caveats
    ([Results →](#sec-results)).

    **In plain terms:** Single requests finish in 1.6 milliseconds typical (2.0 ms for 95% of requests), throughput saturates near 950 requests/second, and batched scoring hits 56,000 rows/second.
  figures: [latency_concurrency_lines, batch_throughput_curve, backend_comparison_slope]
- id: results
  text_md: |
    **The measured ledger keeps its caveats attached.** Every number traces
    to `reports/metrics.json`. The first four bullets restate the gate and
    load-test evidence shown above. The footprint and cost figure below
    supplies the visual check for resource use and price.

    - Gates: reproduction exact (`25.4316` vs `25.4316`); parity max-abs 7.2e-07 on 512 probe rows, tolerance 1e-4.
    - Latency: `p50` `1.6 ms` single-request on both backends; `p95` under `6 ms` through concurrency 4; `p99` `2.2 ms` at c=1; `p50` about `63 ms` at 64 clients where the shared CPU saturates. n = 300 requests per cell, nearest-rank percentiles, median of 3 repeats.
    - Throughput: peak near 970 req/s at concurrency 4 on both backends
      (median 933 native / 970 `ONNX`); throughput sags at 16 clients, then
      partially recovers at 64. No dynamic batching is enabled to explain
      that shape; `ONNX` is `13.8%` ahead at the c64 throughput cell and `p50`
      medians differ by at most `4%`; zero errors
      occur across `4,320` requests per backend.
    - Batch: ~56k rows/s at size 128 on both backends, with flat per-request latency under saturation.

    In `footprint_cost_bars`, compare the memory bars, image components,
    and cost panel. RSS, or resident set size, is the memory held by a
    running process. Fresh-process RSS is 298 vs 318 MB. The full image
    measures `6.5 GB`: `145 MB` base, `6.2 GB` venv, and `1 MB` model. A venv, or
    virtual environment, holds the service's Python packages. Torch and its
    bundled CUDA libraries dominate it. This CPU service never loads them.

    The same figure's image comparison includes the ONNX-only slim image
    (`Dockerfile.slim`, `docker-slim` command). It measures `291 MB` against
    `6,466` MB, or `22.2×` smaller, with a `149 MB` venv. Its smoke test checks
    `/ready` and one contract-shaped prediction in a running container,
    recorded in `reports/docker_slim.json`. A smoke test is a basic check
    that the running service responds correctly.

    The measured `6.5 GB` bar is the fixed build. The venv stays at its final
    path because its shebangs, or interpreter paths in scripts, are absolute.
    A later `chown -R` copied that layer before the fix.

    The cost panel shows about `$0.000012` per 1k predictions at the committed
    concurrency-16 basis. It uses median-of-repeats throughput on this host
    with declared assumptions of 65 W (watts) and `$0.30` per kWh. The
    throughput peak sits at concurrency 4.

    The compose smoke test also passes: a healthcheck-gated dependency lets
    the one-shot smoke service request a real prediction from the API.

    The study leaves out TLS and authentication, multi-worker or
    multi-replica serving, and GPU serving. TLS encrypts network traffic,
    authentication checks identity, and extra workers or replicas run more
    service copies. The slim image ships beside the full image. Torch imports
    sit behind the native backend, so `ONNX` never loads them. The slim build
    pins six locked dependencies plus portfolio-core `--no-deps`; the parity
    gate supports dropping the framework safely.

    The ledger stands; next, the exact tables and protocol
    ([Conclusions →](#sec-conclusions)).

    **In plain terms:** Both backends deliver ~2 ms response times and cost roughly $0.000012 per 1,000 predictions; the biggest practical difference is container size (291 MB lightweight vs 6.5 GB full).
  figures: [footprint_cost_bars]
- id: conclusions
  text_md: |
    ## Results summary

    The summary diagram below connects each deployment stage to its result.
    Experiment 12's champion `MLP` reproduces exactly, `ONNX` parity is gated at
    7.2e-07 max-abs, and single-request `p50` is 1.6 ms. The load curve reaches
    a ~950 req/s knee, while batching reaches ~56k rows/s. The measured full
    image is 6.5 GB. Electricity costs `~$0.000012` per 1k predictions under
    declared assumptions. [full evaluation report](https://amm-ds.github.io/portfolio/projects/13-model-serving/)

    ```diagram auto-13-model-serving-5
    ```

    ## What the experiment taught

    Each lesson below maps to a stage in the summary diagram.

    - The export gate is non-negotiable. An `ONNX` graph needs comparison with
      native predictions on a fixed grid before it counts as a verified
      artifact. Here that comparison is an enforced pipeline stage.
    - Absolute parity tolerances need a relative float32 term. Kernel-order
      noise scales with output magnitude, so a purely absolute gate can be
      too tight on ill-scaled outputs or too loose on good ones.
    - Paired payloads matter more than identical settings alone. Both
      backends saw the same byte stream, so the small saturated-cell deltas
      (`13.8%` only at the c64 throughput cell; `p50` medians within `4%`) read
      as scheduling noise, not capability.
    - Image measurement exposes hidden costs. The CPU tabular model carries
      CUDA libraries it never loads, and a `chown` after `COPY` doubled the
      venv layer until measurement revealed it.

    ## Exact numbers

    The table gives the expert reference values behind the summary diagram.
    The `p99` is the latency that `99%` of requests stay within. `ONNX` backend,
    median of 3 repeats; 300 requests per concurrency level (20 warm-up
    excluded) and 60 per batch size; zero errors in every cell.

    | cell | p50 | p95 | p99 | throughput |
    |---|---|---|---|---|
    | concurrency 1 | 1.6 ms | 1.9 ms | 2.2 ms | 612 req/s |
    | concurrency 4 | 3.9 ms | 4.7 ms | 5.7 ms | 970 req/s (knee) |
    | concurrency 16 | 26.1 ms | 66.2 ms | 94.9 ms | 470 req/s |
    | concurrency 64 | 63.1 ms | 209.8 ms | 290.9 ms | 715 req/s |
    | batch 1 | 65.9 ms/req | — | — | 513 rows/s |
    | batch 8 | 53.0 ms/req | — | — | 5,104 rows/s |
    | batch 32 | 56.4 ms/req | — | — | 18,674 rows/s |
    | batch 128 | 73.1 ms/req | — | — | 57,451 rows/s |

    Native tracks `ONNX` within noise at every cell (fresh-process RSS 298 vs
    `318 MB`). Reproduction: the derived test `MAE` equals experiment 12's committed
    value to the last digit (`25.43163249606178`, abs diff 0.0). Parity: 7.15e-07
    max-abs on the standardized network output over 512 seeded probe rows, inside
    the 1e-4 gate. Image: `6.47` GB (`145 MB` base, `6.2 GB` venv, `1 MB` model). Cost:
    $1.15e-05 per 1k predictions at the committed concurrency-16 basis, at the declared
    65 W and `$0.30` per kWh.

    ## Protocol

    These controls produced the table and the summary diagram's measurements.

    - Reproduction: same pinned zip (`sha256` gate), same recipe and seed 42;
      scored once on the frozen 8-week test window. `SHA-256` is a checksum
      that detects file changes.
    - Parity: 512-row seeded probe grid; max-abs on raw network output;
      gate enforced before benchmark or docker stages run.
    - Benchmark: both backends run as separate service processes behind the
      same `FastAPI` app on byte-identical seeded request streams (seed 42).
      The saturated-cell deltas are paired, not incidental. Warm-up is
      excluded, with 300 requests per concurrency cell (1/4/16/64), median
      of 3 repeats, batch sizes 1/8/32/128 saturated, and fresh-process RSS
      probed three times per backend. The benchmark stage runs in 25.1 s.
    - Docker: repo-root build context, frozen uv lockfile, non-root,
      healthcheck-gated readiness, compose smoke on /health /ready /predict.
      The lockfile fixes package versions, and non-root means the service
      runs without administrator rights.

    ## Limits

    These limits apply to every result in the table and summary diagram.

    - Single laptop, no GPU, one worker, shared CPU: absolute numbers, paired
      deltas, curve shapes, the concurrency-4 knee, and batch amortization
      are host-specific observations, not demonstrated transfer. Committed
      concurrency-4 medians span 933–970 req/s across the two backends.
      High-concurrency cells measure contention, not pure service capacity.
      Re-measure with the paired harness on the target deployment.
    - No TLS, auth, multi-worker or GPU path. The paired harness needs both
      backends, so a torch-free native image is future work.
    - The NVIDIA/CUDA stack inside the full image is never loaded by
      this CPU service. The ONNX-only slim image (`Dockerfile.slim`, `291 MB`,
      smoke-passed) is the built answer. Stripping the stack from the
      *native* image remains a separate variant.
    - Cost is electricity-only at a declared 65 W and `$0.30` per kWh. There is
      no wall meter or amortized hardware. Re-derive the number on your
      hardware before quoting it.

    **In plain terms:** Always verify exported predictions match training, warm up the server before taking traffic, and pick the lightweight 291 MB runtime when small containers matter more than tiny speed differences.
  figures: []
