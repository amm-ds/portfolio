[project]
name = "13-model-serving"
version = "0.1.0"
description = "Portfolio project 13-model-serving."
requires-python = ">=3.12"
dependencies = [
    "scikit-learn>=1.5",
    "typer>=0.12",
    "plotly>=5.24",
    "numpy>=2.1",
    "pandas>=2.0",
    "torch>=2.4",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "onnx>=1.17",
    "onnxruntime>=1.17",
    "portfolio-core",
    "portfolio-eval",
]

[project.scripts]
model_serving = "model_serving.cli:app"

[tool.uv.sources]
portfolio-core = { workspace = true }
portfolio-eval = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_serving"]
