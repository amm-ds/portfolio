project_id: 01-rag-agent
short_version: "Grounding-hardened cited QA over 593 Wikipedia articles. S3 hybrid retrieval reaches 0.946 recall@5. Judge sample: reviewer-agent audit 30/30; owner hand-label pending. Final 120-question pass: F1 0.909, precision 0.952, faithfulness 0.872, 1/120 unsupported."
sections:
- id: background
  text_md: |
    **When every answer has a citation, what can still go wrong?**
    A model can still misread a source or invent a detail between two quoted lines. This system answers questions strictly from 593 pinned Wikipedia articles. It cites each claim or refuses when evidence is missing.

    ```diagram 01-rag-pipeline
    ```

    The pipeline pairs CPU search with a check-and-repair loop that trims or drops weak claims.

    - **Result:** Across 120 test questions, 104 answers pass (`F1 0.9091`), and only 1 keeps an unsupported claim.
    - **Screen, not proof:** Checks cut bad claims, yet small test sets and single-model judging still limit certainty.
    - **Scope:** Scores cover this 593-article slice, not open-web readiness.

    **In plain terms:** The system answers from checked passages or declines honestly, cutting unsupported answers to 1 in 120 on a fixed test set. [Next: Objectives →](#sec-objectives)
  figures: []
- id: objectives
  text_md: |
    **Answer with evidence or refuse honestly, and never guess.**
    Every question follows one clear contract before it can return text to a reader.

    ```diagram auto-01-rag-agent-1
    ```

    Questions outside the 593 articles get a safe refusal. In-corpus questions must clear claim checks within a strict budget.

    - **Support floor:** Each claim needs at least `0.6` support from its passage. Weak claims get two repair tries before they are dropped.
    - **Search target:** Put a right article in the top 5 at least 60% of the time (`recall@5 >= 0.60`).
    - **Cost and privacy:** Keep answer cost at or under `$0.01` per query. Search runs on CPU, and users can pick local or hosted models.
    - **Why not a bigger model:** Larger models still invent links between claims and would break the cost cap.

    | Target | Goal | Final test result |
    |---|---|---|
    | Retrieval `recall@5` (92 answerable) | >= 0.60 | **0.9457** |
    | Unanswerable refusals | high recall | **24 / 28** |
    | Answer cost (agent + verify) | <= $0.01 / query | **$0.0084 / query** |
    | Speed (`p50` / `p95`, n = 120) | bounded | **16.5 s / 40.5 s** |

    **In plain terms:** The system chooses honest refusals and source checks over fluent guesses, meeting its search and cost goals. [Next: Data →](#sec-data)
  figures: []
- id: data
  text_md: |
    **A small, pinned corpus makes every claim easy to check.**
    Rather than indexing all of Wikipedia, we freeze a compact slice so every score maps to the exact same bytes.

    ```diagram auto-01-rag-agent-2
    ```

    DVC tracks each file from raw scan to chunk index. Source dates and licenses sit in the [data registry](https://amm-ds.github.io/portfolio/data-registry/wikipedia/).

    - **Five topics:** Climate, Renewable energy, Aviation, Machine learning, and Photosynthesis. Each holds up to 120 pages plus key anchor titles.
    - **12,000-character cap:** Every page fits in one model prompt, keeping checks fast and repeatable.
    - **Clean inputs:** Empty or oversized pages fail before indexing. SHA-256 hashes lock each split against drift.
    - **Balanced test mix:** Splits mix single-page, multi-page, and unanswerable questions to test search, synthesis, and refusal together.

    | Question set | Size (single / multi / abstain) | Role | Reads |
    |---|---:|---|---|
    | Tuning set | 65 (44 / 11 / 10) | Search & prompt tuning | Multiple |
    | Earlier gate set | 55 (32 / 10 / 13) | Early full-loop gate | Consumed |
    | Final test set (`final_v3`) | 120 (68 / 24 / 28) | Final search & loop test | >1 (consumed) |

    **In plain terms:** Locking a 593-page corpus and a 120-question test mix ensures every score traces back to the exact same text. [Next: EDA →](#sec-eda)
  figures: []
- id: eda
  text_md: |
    **Topic counts stay even; page lengths do not.**
    Before we tune search, we inspect the corpus so no single topic can hide weak recall in an average score.

    - **Even topics (102–125 pages):** All five subjects sit in a tight band, keeping overall scores honest.
    - **Hard length cap:** Page lengths show a long tail that stops at 12,000 characters, bounding prompt size and cost.
    - **Checked anchor pages:** Because the Wikipedia dump is not sorted by topic, naive sampling would pull minor side pages. Every anchor title and test question was checked directly against the slice.

    | Corpus stat | Value |
    |---|---|
    | Total indexed pages | 593 |
    | Pages per topic | 102–125 |
    | Maximum page length | 12,000 characters |

    **In plain terms:** Early checks proved balanced topic coverage and capped page sizes before any model ran. [Next: Training →](#sec-training)
  figures: [eda_corpus_composition]
- id: training
  text_md: |
    **Smart ranking beats a bigger model.**
    Multi-hop questions need both exact word matches and semantic search, plus a guard so one page does not crowd out the rest.

    - **Title-prefixed chunks (`S1`):** Adding the page title to every chunk keeps isolated paragraphs clear.
    - **Hybrid RRF blend (`S2`):** Blending FAISS vector search with BM25 word search via Reciprocal Rank Fusion (`k = 60`) catches both names and paraphrases.
    - **Rerank and page cap (`S3`):** A cross-encoder reorders the pool, and a 2-chunk-per-page cap keeps the top 5 diverse (`0.9457` vs `0.9239` `recall@5`).
    - **What tuning ruled out:** 200-, 400-, and 800-token chunks tied at `0.831` `recall@5` on 65 tuning questions, so 200 tokens won on cost. MiniLM (80 MB) tied BGE-small and edged `MRR@5` (`0.808` vs `0.805`) on CPU; reranking lifted `MRR@5` from `0.718` to `0.808`.

    ```python
    def search(self, query: str, top_k: int | None = None) -> list[Citation]:
        k = top_k or self.config.top_k
        n_candidates = min(len(self.chunks), k * self.config.rerank_multiplier)
        vector = self._embed_query(query)

        if self.config.fusion_rrf:
            pool = min(len(self.chunks), max(n_candidates, self.config.rrf_pool_size))
            _, dense_ids = self.index.search(vector, pool)
            dense = [self.chunks[int(i)].chunk_id for i in dense_ids[0] if int(i) >= 0]
            bm25 = self._bm25_index().ranking(query)[:pool]
            fused = reciprocal_rank_fusion([dense, bm25], k=60)
            candidates = [self._by_id[cid] for cid in fused[:n_candidates] if cid in self._by_id]
        else:
            _, ids = self.index.search(vector, n_candidates)
            candidates = [self.chunks[int(i)] for i in ids[0] if int(i) >= 0]

        if self.rerank_fn is not None and len(candidates) > k:
            scores = np.asarray(
                self.rerank_fn(query, [c.text for c in candidates]), dtype=np.float32
            )
            order = np.argsort(-scores)
            candidates = [candidates[int(i)] for i in order]

        if self.config.max_per_article and self.config.max_per_article > 0:
            candidates = self._cap_per_article(candidates, k)

        return [self._to_citation(c) for c in candidates[:k]]
    ```

    Excerpt from [index.py](https://github.com/amm-ds/portfolio/blob/main/projects/01-rag-agent/src/rag_agent/index.py). Note: `chunk_size_sweep` and `model_comparison` show tuning history; `retrieval_ladder` plots the final `R0 -> S3` tournament.

    **In plain terms:** Adding page titles to chunks, mixing word and vector search, and capping chunks per page lifted final recall to 94.6% on CPU. [Next: Evaluation →](#sec-evaluation)
  figures: [retrieval_ladder, chunk_size_sweep, model_comparison]
- id: evaluation
  text_md: |
    **Auditable means every claim points to text a person can check.**
    Because one metric can miss subtle errors, our test rules stack simple baselines, three judges, and hard tool limits.

    ```diagram auto-01-rag-agent-3
    ```

    - **Chance floors:** Seeded random (`0.031` recall@5) and word-match (`0.677` recall@5) baselines anchor how hard the task is.
    - **Three-judge screen:** A rubric judge tags failure modes, RAGAS scores answer quality, and a claim verifier checks the `0.6` support floor with up to two repairs.
    - **Audited judge calibration:** Earlier judges passed 44% of bad claims. The rebuilt `judge_v2` set scored `30/30` (`Wilson 95% [0.8865, 1.0]`) in a reviewer-agent audit (`owner_sample_validated.json`), with owner hand-labelling pending.
    - **Hard agent rails:** Caps of 12 requests, 16 tool calls, and 200k input tokens stop runaway loops, while checkpoints save token spend.
    - **Open limits:** Generation, verification, and judging all use `kimi-for-coding` (a cross-judge check is pending), and `final_v3` was read more than once (`R0`, `S3` gate, validation, E2E pass), so it is now consumed.

    | Check | Role | Model | Audit status |
    |---|---|---|---|
    | Claim verifier | Passage support (`>= 0.6`) | `kimi-for-coding` | 30/30 agent audit (owner pending) |
    | Rubric judge | Answer vs. abstain class | `kimi-for-coding` | Calibrated on `judge_v2` |
    | RAGAS suite | Faithfulness & relevance | `kimi-for-coding` | Library v0.3.1 (tuning pass) |

    **In plain terms:** Every answer faces search baselines, tool caps, and a 30/30 agent-audited verifier, with single-model judging openly noted. [Next: Results →](#sec-results)
  figures: [latency_histogram, kimi_generation_comparison, fusion_arm_comparison]
- id: results
  text_md: |
    **104 of 120 questions answered or refused cleanly, with 1 unsupported answer.**
    The final 120-question run hits `0.9091` F1 and `0.9524` precision, showing strong grounding alongside a few conservative empty answers.

    ```diagram auto-01-rag-agent-4
    ```

    - **Overall accuracy:** `F1 0.9091` (`precision 0.9524`, `recall 0.8696`) and `86.7%` accuracy (`Wilson 95% [0.7944, 0.9162]`) across `60/68` single-hop, `20/24` multi-hop, and `24/28` unanswerable rows.
    - **Grounding lift:** Only **1 of 120 answers** kept an unsupported claim (down from `17/65` during tuning). At claim level, `148/150` judged claims passed and `159` survived after repairs (`mean support 0.9739`).
    - **Remaining misses:** `10` answerable rows returned empty answers (`11/92` missed counting 1 retrieval miss; `8` cited no key page), and `4` unanswerable rows hit the tool limit.
    - **Cost and speed:** Answers cost `$1.014` (`$0.0084/query`, under the `$0.01` cap); judging raised total spend to `$1.458` (`$0.0121/query`), at `p50 16.5 s` / `p95 40.5 s`.

    | Final pass metric (`final_v3`, n = 120) | Value |
    |---|---:|
    | F1 / Precision / Recall | **0.9091** / 0.9524 / 0.8696 |
    | Overall accuracy (Wilson 95% CI) | **0.8667** `[0.7944, 0.9162]` |
    | Faithfulness (n = 92 answerable, 95% CI) | **0.8717** `[0.8092, 0.9304]` |
    | Retrieval `recall@5` (n = 92 answerable) | **0.9457** (vs 0.9239 R0) |
    | Outcomes (correct / empty / budget / unsupported / miss) | **104 / 10 / 4 / 1 / 1** |
    | Answer cost / Total with judge | **$0.0084** / **$0.0121** per query |

    **In plain terms:** Grounding rules cut bad answers to 1 in 120 and stayed under `$0.01` per query; next work targets the 10 false empty answers. [Next: Conclusions →](#sec-conclusions)
  figures: [final_outcome, failure_taxonomy, verify_funnel]
- id: conclusions
  text_md: |
    ## Results summary

    Pairing hybrid title-anchored search (`0.9457` recall@5) with a bounded verify-and-repair loop yields `0.9091` F1 and `0.9524` precision on the 120-question final set (`reports/final_v3_e2e/f1_summary.json`). Across 166 drafted claims, 16 failed rule checks, 150 were judged (148 supported), 11 repaired, and 7 dropped (`159` kept).

    ## What the experiment taught

    - **Search ranking beats model size:** Title prefixes, dense + BM25 RRF fusion, reranking, and a 2-chunk page cap lifted `all-articles@5` on every development split.
    - **Checks bound harm; they do not remove risk:** Grounding rules cut unsupported answers sharply, yet single-model judging and empty answers remain open limits.
    - **The test contract is reusable:** Seeded floors, pre-set gates, saved checkpoints, and cost meters transfer cleanly to new tasks.

    ## Limits

    - **Consumed final set:** `final_v3` was read more than once (`R0`, `S3` gate, validation, E2E pass); a fresh sealed set (`final_v4`) is needed next.
    - **Single-model judging and pending labels:** Generation, checks, and judging all use `kimi-for-coding`, and owner hand-labelling on the 30-claim sample is pending.
    - **Bounded scope:** Numbers cover 593 capped Wikipedia pages; broad-corpus readiness is unmeasured.

    ## Exact numbers

    Tuning-pass retrieval configurations (65 tuning questions, `reports/metrics.json`):

    | Retrieval configuration | recall@5 | recall@10 | MRR@5 |
    |---|---|---|---|
    | MiniLM, 200-token chunks | **0.831** | 0.846 | **0.808** |
    | lexical word match (baseline) | 0.677 | 0.754 | 0.500 |
    | seeded random (chance floor) | 0.031 | 0.046 | 0.018 |

    Tuning-pass generation comparison (65 tuning questions):

    | Generation metric | Incumbent | Selected `kimi-for-coding` |
    |---|---:|---:|
    | rubric faithfulness | 0.5504 | **0.6209** |
    | rubric answer relevance | 0.5573 | **0.6458** |
    | rubric context recall | 0.9636 | 0.9636 |
    | RAGAS faithfulness | — | **0.7337 [0.6562, 0.8131]** |
    | RAGAS answer relevancy | 0.8775 | **0.8602** |
    | RAGAS context precision / recall | — | 0.7609 / 0.9826 |

    - Selected 65-question tuning taxonomy: 46 correct / 17 unsupported / 2 retrieval-miss / 0 format failures (`p50 25.888 s`, `p95 108.836 s`, `$0.000906/query` generation).
    - Earlier gated sealed pass (55 questions): 44 correct / 9 unsupported / 1 retrieval-miss / 1 format failure (`0.80`, CI `[0.69, 0.89]`; `12/13` refusals; `$1.95` cloud-equivalent; `p50 24.443 s`, `p95 126.811 s`).
    - Earlier stress sets (30 questions each, before final S3 + loop hardening): original stress `16/30` (`0.53`, CI `[0.37, 0.70]`); frozen re-run `22/30` (`0.733`, 5 unsupported); set B `19/30` (`0.633`, 9 unsupported); set C `10/30` (`20` empty); set D `17/30` (`9` unsupported).

    ## Measured alternatives

    - **S3 vs R0 on `final_v3` (92 answerable):** `recall@5` rose `0.9239 -> 0.9457`; `multi-hop recall@5` rose `0.7917 -> 0.8333`; `all-articles@5` reached `0.8804`.
    - **`fusion_arm_comparison` (reranking off):** Dense and RRF tied at `0.831` on 65 tuning questions; on the 15-question sealed raw layer, RRF trailed dense (`0.533` vs `0.600`), showing fusion alone needed title-anchored chunks and reranking.

    ## Protocol

    - Floors: seeded random and lexical word-match search per configuration.
    - Judges: rubric taxonomy, RAGAS `0.3.1`, and per-claim verification (`0.6` support floor, `<= 2` repairs).
    - Cost: public rate card estimates at `$1.00/Mtok` input, `$4.00/Mtok` output, `30%` cached reads.

    **In plain terms:** S3 hybrid search, an audited verifier, and bounded tool rails lift final F1 to 0.9091 with 1 unsupported answer in 120; next requires owner sample labelling, a cross-judge check, and a fresh `final_v4` test set. [Full evaluation report →](https://amm-ds.github.io/portfolio/projects/01-rag-agent/)
  figures: [retrieval_funnel]
key_concepts:
  - "**Seeded floors:** Random and word-match rankings anchor every headline, so a score cannot merely restate how easy the task is."
  - "**Sealed held-out set:** A fresh question set is written after tuning freezes and scored once to prevent tuning overfit."
  - "**Claim support floor:** Each claim needs support of 0.6 or better from its cited passage; otherwise it is repaired at most twice, dropped, or the answer abstains."
  - "**Three separate judges:** Rubric taxonomy, RAGAS, and per-claim verification catch different failures; no single score represents answer quality."
  - "**Cloud-equivalent cost metering:** A public rate card turns token use into estimated dollars under a hard budget cap."
  - "**Verification bounds harm; it does not eliminate risk:** Grounding checks cut unsupported answers dramatically, yet single-model judging and empty-answer abstentions remain open limits."
