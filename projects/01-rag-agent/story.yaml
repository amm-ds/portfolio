- id: results
  text_md: |
    **These numbers do not show broad-corpus readiness.** The corpus is one
    Wikipedia slice, and the sealed drop to 0.600 recall@5 says the tuning
    headline will not carry over to noisier collections. The
    hosted-versus-local gap is a hint, not a controlled comparison.

    Two figures carry the reading. The HPO frontier figure plots recall@k
    against estimated input tokens per query; start at the starred point —
    the 200-token, top-3, rerank-on setup — which reaches recall@5 0.831 at
    ≈800 input tokens per query. Everything up and left of it is weaker or
    pricier, and nothing on the frontier buys grounding; the starred point,
    not the frontier's right edge, is the committed configuration. The failure
    taxonomy figure shows the bill: 44 correct, 18 unsupported-claim, 2
    retrieval-miss, and 1 format failure out of 65 hosted answers.
    Unsupported claims outnumber every other failure combined — grounding,
    not retrieval volume, is the debt to pay.

    Showcase chat stays opt-in: hosted answers cost real money, and the
    committed traces — an unsupported answer scored at faithfulness 0.2, a
    multi-hop grounding failure, a support-floor abstention — show failure
    instead of hiding it. No quality claim is made for any corpus beyond
    this one.

    What exactly survives into the record?

    **Business summary:** Of 65 hosted answers, 44 are correct, 18 keep
    unsupported claims, 2 miss retrieval, 1 fails format — and the accuracy
    claim stops at this corpus.
  figures: [retrieval_hpo_frontier, failure_taxonomy]
  metrics_keys:
  - retrieval_chunks_200
  - retrieval_random_chunks_200
  - retrieval_model_minilm_chunks_200
  - retrieval_rerank_on_chunks_200
  - rag_agent
- id: conclusions
  text_md: |
    ## Results summary

    On 65 tuning questions, the committed setup — 200-token chunks, MiniLM
    embeddings, cross-encoder rerank — reaches recall@5 0.831 and MRR@5 0.808
    against a 0.677 word-match floor; the sealed 15-question pass drops to
    0.600. The hosted pass kept unsupported claims in 18 of 65 answers; RAGAS
    faithfulness 0.685 [0.605, 0.760], refusal accuracy 0.900 [0.70, 1.0]. The
    corpus is 593 Wikipedia articles capped at 12,000 characters. See the
    [full evaluation report](https://amm-ds.github.io/portfolio/projects/01-rag-agent/).

    ## What the experiment taught

    - Retrieval was the solved half: chunk size, embedding model, and reranking
      were settled by measurement — no bigger model was needed.
    - Generation was the bottleneck: 18 of 65 hosted answers kept unsupported
      claims, and verification bounded the harm rather than removing it.
    - The sealed set earned its keep: tuning headlines (recall@5 0.831) did not
      repeat on fresh questions (0.600).
    - Small local-model gains sat inside judge noise; abstention, not repair,
      carried the verify gains.
    - The reusable deliverable is the measurement contract itself: seeded floors,
      three judges, a sealed set, and cost meters.

    ## Exact numbers

    Retrieval configurations on the 65 tuning questions:

    | Retrieval configuration | recall@5 | recall@10 | MRR@5 |
    |---|---|---|---|
    | MiniLM, 200-token chunks | **0.831** | 0.846 | **0.808** |
    | lexical word match | 0.677 | 0.754 | 0.500 |
    | seeded random | 0.031 | 0.046 | 0.018 |

    | Verify-on provider pass | Failure taxonomy | RAGAS faithfulness |
    |---|---|---|
    | local qwen3.6-q4, 30-question subset | 15 correct / 14 unsupported / 1 format | 0.606 |
    | hosted kimi-for-coding, all 65 | 44 correct / 18 unsupported / 2 retrieval-miss / 1 format | 0.685 [0.605, 0.760] |

    - Sealed held-out pass (15 questions: 8 single-hop, 2 multi-hop, 5
      unanswerable; hosted pass dated 2026-10-18): recall@5 0.600, recall@10
      0.667, MRR@5 0.567 (random floor 0.022); rubric-judge faithfulness 0.62
      [0.45, 0.79] (n=10 answerable); 5/5 correct refusals; 66 calls, $0.25
      cloud-equivalent, 47% cached.
    - Hosted RAGAS, tuning pass: relevancy 0.878, context precision 0.760;
      refusal accuracy 0.900 [0.70, 1.0], cite-when-expected 0.964 [0.909,
      1.000], false-abstention rate 0.036 [0.00, 0.09].
    - Hosted tuning pass: p50 23 s, p95 175 s per answer; $3.58 cloud-equivalent
      over 922 calls (agent 64 / RAGAS 605 / verify 125 / judge 128), 79.6% of
      input tokens cached.

    ```mermaid
    graph LR
      subgraph Draft["Hosted answer pass"]
        A["Agent draft"] --> J["Rubric + RAGAS judges"]
      end
      subgraph Verify["Verify loop, per claim"]
        SP{"Support at or above 0.6<br/>vs cited chunk?"}
        SP -->|"yes: keep claim"| OUT["Audited answer"]
        SP -->|"no: remove text"| AB{"Answer coherent?"}
        AB -->|"yes"| RD["Re-draft, max 2 repairs"]
        AB -->|"no"| REF["Abstain"]
        RD --> SP
      end
      A --> SP
      S15["Sealed 15-question set,<br/>scored once"] --> OUT
      REF --> OUT
    ```

    ## Protocol

    - Tuning: 65 questions (44 single-hop, 11 multi-hop, 10 unanswerable) drive
      selection; sealed: 15 (8 single-hop, 2 multi-hop, 5 unanswerable), written
      after tuning froze, scored once per pass.
    - Floors: seeded random and word-match search, scored per configuration.
    - Judges: rubric judge (failure taxonomy), hosted RAGAS (faithfulness,
      relevancy), claim verifier (per-claim support vs cited chunk, abstains
      below 0.6, at most 2 repairs); intervals are the judges' 95% ranges.
    - Cost: cloud-equivalent rate-card at the kimi-k2.8-preview card
      ($1.00/Mtok input, $4.00/Mtok output, cached reads 30%).

    ## Limits

    - Judge noise at n=30 matches the local A/B deltas; local repair quality is
      weak — verify gains come mainly via abstention.
    - The HPO grid is small; MiniLM's tie with BGE-small holds at 593 articles.
    - The sealed drop says tuning numbers do not repeat on fresh questions.
    - Grounding and repair improvement is deferred — blocked on a fresh external
      corpus (the registry holds only this Wikipedia slice); no broad-corpus
      claim and no always-on chat: held-out retrieval drops, and live hosted
      calls need a cost budget.

    **Business summary:** Final state: recall@5 0.831 on tuning questions,
    0.600 sealed; 18 of 65 hosted answers kept unsupported claims — retrieval
    is solved, grounding is not; the measurement contract is the deliverable.
  figures: []
key_concepts:
  - "**Seeded floors** — every headline is scored against random and word-match rankings, so it can never restate how easy the task is."
  - "**Sealed held-out set** — a second question set written only after tuning froze and scored once, so tuning numbers cannot be overfit."
  - "**Claim support floor** — each drafted claim must be backed by its cited passage at 0.6 or better, or it is cut, repaired at most twice, or the answer abstains."
  - "**Three separate judges** — rubric taxonomy, RAGAS, and per-claim verification catch different failure modes, so no single score speaks for answer quality."
  - "**Cloud-equivalent cost metering** — a public rate card turns token use into dollars and puts a hard cap on every pass."
  - "**Auditable is not trustworthy** — every answer traces to a readable passage, yet 18 of 65 still kept unsupported claims; verification bounds the harm, it does not remove it."
