project_id: 01-rag-agent
headline: "On 65 tuning questions, retrieval recall@5 is 0.831 and hosted RAGAS
  faithfulness 0.685 [0.605, 0.760], but 18 answers still contain unsupported
  claims; sealed 15-question recall falls to 0.600."
data_note: "The corpus is 593 articles (≈3.5 MB) from English Wikipedia dump
  `20231101.en`, CC BY-SA 3.0 / GFDL with attribution required."
limits: "Evidence is bounded to this homogeneous Wikipedia slice: held-out
  retrieval drops to 0.600, grounding remains imperfect, and hosted/local
  provider comparisons use different question counts and judges."
sections:
- id: background
  text_md: |
    **Citations make an answer auditable; they do not make hallucinations
    impossible.** This project attacks silent fabrication with retrieval tools,
    structured citations, and a verification loop—and reports the unsupported
    claims that still survive.

    The pipeline is deliberately inspectable: a checksum-pinned Wikipedia
    slice, CPU retrieval, and an agent whose only corpus access is
    `search_documents` and `read_excerpt`. Quality comes from measured
    retrieval, generation, and abstention behavior, not from a persuasive demo.
- id: objectives
  text_md: |
    **The goal is a useful answer with evidence, or a calibrated refusal.** The
    acceptance criteria are concrete:

    - Return schema-valid `AnalysisResult(summary, citations, confidence)`;
      invalid output fails loudly after bounded retries.
    - Reach retrieval recall ≥0.60, cite relevant evidence when available, and
      abstain on questions outside the corpus.
    - Measure end-to-end latency and cost; the operating target is ≤$0.01 per
      query, while the full hosted evaluation is metered separately.

    Retrieval is CPU-only. With local Ollama, prompts and corpus excerpts stay
    on the machine; with an OpenAI-compatible hosted provider they leave it.
    `evaluate --offline` runs retrieval-only CI without either provider.
- id: data
  text_md: |
    **A small, known corpus makes every claim reproducible.** The bounded scan
    collects five topics—Climate, Renewable energy, Aviation, Machine learning,
    and Photosynthesis—with at most 120 patterned articles per topic plus
    exact-title anchors: 593 articles in total.

    Null-rate and length gates stop bad input. DVC tracks the transformations,
    and `data/raw/dataset_contract.json` pins the derived corpus by sha256.
    Source, snapshot, license, and attribution are recorded in the
    [data registry](https://amm-ds.github.io/portfolio/data-registry/wikipedia/).
- id: eda
  text_md: |
    **The scan changed the corpus design.** Topic coverage is near-balanced
    (≈102–125 articles), while article length is right-skewed; a 12,000-character
    cap bounds embedding cost.

    More importantly, dump order is not topical: naive quotas fill with
    peripheral pages, and several expected flagship titles are absent from this
    dump. Exact-title anchors and evaluation questions were therefore checked
    against the collected corpus rather than assumed to exist.
  figures: [eda_corpus_composition]
- id: training
  text_md: |
    **Retrieval quality comes from ranking discipline, not a larger model.** The
    chosen path is MiniLM embeddings → exact FAISS search → cross-encoder rerank
    → agent draft → claim verification → cited answer or abstention.

    | Choice | Measured reason on this corpus |
    |---|---|
    | 200-token, paragraph-aware chunks | recall@5 0.831 at ≈800 input tokens/query for top-3 |
    | MiniLM (80 MB, CPU) | ties BGE-small at recall@5 0.831 |
    | Cross-encoder rerank | MRR@5 0.718 → 0.808; recall@5 unchanged |
    | Exact FAISS `IndexFlatIP` | exact search is inexpensive at 593 articles |

    Hosted and local providers share one code path. The hosted 65-question
    evaluation metered $3.58 in **cloud-equivalent rate-card cost**, not billed
    spend; local API cost is $0, but local compute and latency are not free.
  figures: [retrieval_funnel]
- id: evaluation
  text_md: |
    **Three different evaluators answer three different questions.** Retrieval
    HPO uses a 65-question golden set (44 single-hop, 11 multi-hop, 10
    unanswerable) with seeded-random and deterministic lexical floors.

    - The **rubric judge** scores answer-level faithfulness and drives the
      failure taxonomy; the provider model is the default and `JUDGE=keyword`
      is the deterministic CI/fallback floor.
    - Optional **RAGAS** separately scores faithfulness, relevancy, and context
      metrics with the active provider; its values are not interchangeable with
      rubric-judge scores.
    - The **claim verifier** checks drafted claims against cited chunks, repairs
      or drops unsupported text (≤2 repair calls), and abstains below 0.6 support.

    A sealed 15-question set (8 single-hop, 2 multi-hop, 5 unanswerable), written
    after tuning froze, gets retrieval plus one verify-on agent/rubric-judge
    pass—deliberately no RAGAS. Latency, tokens, and per-phase hosted estimates
    persist in `reports/metrics.json` and `reports/cost_telemetry.json`.
  figures: [chunk_size_sweep, latency_histogram]
  metrics_keys:
  - retrieval_chunks_200
  - retrieval_random_chunks_200
  - retrieval_lexical_chunks_200
  - retrieval_model_minilm_chunks_200
  - retrieval_model_bge_small_chunks_200
  - retrieval_rerank_on_chunks_200
  - retrieval_rerank_off_chunks_200
  - rag_agent
- id: results
  text_md: |
    **Retrieval beats both naive floors; generation remains the bottleneck.**

    | Retrieval configuration | recall@5 | recall@10 | MRR@5 |
    |---|---|---|---|
    | MiniLM, 200-token chunks | **0.831** | 0.846 | **0.808** |
    | lexical word match | 0.677 | 0.754 | 0.500 |
    | seeded random | 0.031 | 0.046 | 0.018 |

    | Verify-on provider pass | Failure taxonomy | RAGAS faithfulness |
    |---|---|---|
    | local qwen3.6-q4, 30-question subset | 15 correct / 14 unsupported / 1 format | 0.606 |
    | hosted kimi-for-coding, all 65 | 44 correct / 18 unsupported / 2 retrieval-miss / 1 format | 0.685 [0.605, 0.760] |

    The provider gap is directional, not controlled: question counts and judge
    models differ. Hosted relevancy is 0.878, refusal accuracy 0.900, and
    cite-when-expected 0.964 [0.909, 1.000]. Latency is p50 23 s / **p95 175 s**;
    the tail is driven by a runaway tool loop stopped by the token guard.

    The full hosted evaluation used 922 calls and metered **$3.58
    cloud-equivalent** across agent, RAGAS, verification, and rubric judging;
    79.6% of input reads were cached. This was membership-quota usage, never a
    billed $3.58. A first pass stopped cleanly at the $3.04 USD cap.

    **The sealed set is the warning against over-reading the tuning result:**
    recall@5 0.600 and MRR@5 0.567 (random floor 0.022), rubric-judge
    faithfulness 0.62 [0.45, 0.79], and 5/5 correct refusals. Its 66-call hosted
    pass metered $0.25 cloud-equivalent; it did not run RAGAS.

    Live showcase chat is disabled by default (`RAG_CHAT_ENABLED=1` opts in).
    The page instead quotes committed traces, including a correct cited answer,
    an unsupported answer with faithfulness 0.2, a multi-hop grounding failure,
    a support-floor abstention, and a correct refusal on an unanswerable question.
  figures: [model_comparison, retrieval_hpo_frontier, failure_taxonomy]
  metrics_keys:
  - retrieval_chunks_200
  - retrieval_random_chunks_200
  - retrieval_model_minilm_chunks_200
  - retrieval_rerank_on_chunks_200
  - rag_agent
- id: conclusions
  text_md: |
    **The transferable result is the measurement discipline, not a claim of
    solved grounding.** Tool restrictions and citations help audit answers, but
    18 of 65 hosted answers still kept unsupported claims.

    - Local verify-on A/B moved unsupported answers 18→14 and correct answers
      12→15, mainly through removal and abstention; RAGAS faithfulness moved
      0.651→0.606 with overlapping intervals, so no improvement is claimed.
    - Judge noise at n=30, weak local repair quality, a small HPO grid, and the
      bounded corpus all limit generalization. MiniLM's tie with BGE-small is
      evidence at this scale only.
    - Typed outputs, naive floors, sealed evaluation, and explicit cost/latency
      telemetry are the reusable engineering controls. Full traces and metrics
      remain in `reports/` for inspection.
roadmap:
- status: delivered
  text: "Reproducible retrieval, provider seam, verify-on answers, separate rubric/RAGAS judges, sealed evaluation, and metered cost/latency."
- status: remaining
  text: "Improve grounding and repair quality, then re-measure on noisier corpora; current local A/B mainly gains through abstention."
- status: deferred
  text: "No broad-corpus quality claim or always-on public chat: held-out retrieval drops and live hosted calls need an explicit cost budget."
figure_captions:
  eda_corpus_composition: "The bounded Wikipedia corpus: articles per topic and word-length distribution across all 593 articles. Coverage is near-balanced; the long tail is truncated at 12,000 characters."
  retrieval_funnel: "Across 65 golden questions, 975 embedding candidates narrow to 195 reranked passages; 54 questions retain a relevant article in the final top-3. Reranking improves rank quality, not recall@5."
  chunk_size_sweep: "Retrieval recall for 200/400/800-token chunks against seeded-random and lexical floors on the 65-question set. All three sizes tie at recall@5 0.831; 200 tokens minimizes context cost."
  latency_histogram: "Per-answer latency for the hosted 65-question run: p50 23 s and p95 175 s. The tail is driven by a runaway tool loop stopped by the token guard."
  model_comparison: "MiniLM and BGE-small tie at recall@5 0.831 on the 65-question set; MiniLM has slightly higher MRR@5 (0.808 vs 0.805). The smaller CPU model is therefore the measured default here."
  retrieval_hpo_frontier: "Recall@k against estimated input tokens per query across chunk sizes and top-k values. The starred 200-token/top-3/rerank-on configuration reaches recall@5 0.831 at ≈800 input tokens."
  failure_taxonomy: "Hosted 65-question outcomes under the rubric-judge taxonomy: 44 correct, 18 unsupported-claim, 2 retrieval-miss, and 1 format failure. Grounding, not retrieval volume, is the main remaining failure mode."
