- id: results
  text_md: |
    **These figures do not show broad-corpus readiness.** Both describe one
    Wikipedia slice. The sealed 55-question pass has 44 correct answers and
    refusal accuracy 0.92. Noisier collections are unmeasured. Its expansion
    questions passed an answerability gate, so the retrieval results are
    consistency checks, not stress tests.

    Start with the HPO frontier. HPO means hyperparameter optimization, the
    systematic comparison of configuration settings. The figure plots recall@k,
    the chance of a relevant article in the top k results, against estimated
    input tokens per query. Look at the starred 200-token, top-3, rerank-on
    setup. It reaches recall@5 0.831 at ≈800 input tokens per query. Other
    frontier points are weaker or pricier. None measures grounding. The starred
    point, not the frontier's right edge, is the committed configuration.

    Next, read the failure taxonomy. Among 65 selected-provider answers, it
    shows 46 correct, 17 unsupported-claim, 2 retrieval-miss, and 0 format
    failures. Unsupported claims outnumber every other failure combined. The
    remaining debt is grounding, not retrieval volume.

    The traces behind those failure bars stay visible in opt-in showcase chat.
    Hosted answers cost real money. The committed examples include an
    unsupported answer with faithfulness 0.2, a multi-hop grounding failure,
    and a support-floor abstention. They expose failure instead of hiding it.

    The unsupported-claim bar also guides the claim-level reading. Five
    unsupported-claim answers drafted claims at 0.74 first-check support,
    against 0.93 for correct answers. Across 42 verified answers, 258 claims
    had 16 repairs and 11 drops. Mean answer support is 0.98. The verifier
    bounds, repairs, and abstains; it does not turn weak drafts into grounded
    ones.

    **Business summary:** Of 65 selected-provider answers, 46 are correct, 17
    keep unsupported claims, 2 miss retrieval, and 0 fail format. The accuracy
    claim stops at this corpus.
  figures: [retrieval_hpo_frontier, failure_taxonomy]
  metrics_keys:
  - retrieval_chunks_200
  - retrieval_random_chunks_200
  - retrieval_model_minilm_chunks_200
  - retrieval_rerank_on_chunks_200
  - rag_agent
- id: conclusions
  text_md: |
    ## Results summary

    Use the diagram as the reading guide for every table below. It connects
    retrieval, answer checks, and final outcomes. Strong retrieval does not
    guarantee a grounded answer.

    ```diagram auto-01-rag-agent-4
    ```

    On 65 tuning questions, the committed setup uses 200-token chunks, MiniLM
    embeddings, and cross-encoder rerank. It reaches recall@5 0.831 and MRR@5
    0.808 against a 0.677 word-match floor. Selected `kimi-for-coding` records
    46 correct and 17 unsupported-claim outcomes, RAGAS faithfulness 0.7337
    [0.6562, 0.8131], and refusal accuracy 1.0. The sealed 55-question pass
    keeps 44 of 55 correct (0.80, CI [0.69, 0.89]) with operational recall@5
    0.745 and refusal accuracy 0.92 (12/13). The corpus is 593 Wikipedia
    articles capped at 12,000 characters. See the
    [full evaluation report](https://amm-ds.github.io/portfolio/projects/01-rag-agent/).

    ## What the experiment taught

    - Retrieval was the solved half. Measurements settled chunk size, embedding
      model, and reranking without a bigger model.
    - Generation was the bottleneck. Of 65 selected-provider answers, 17 kept
      unsupported claims. Verification bounded the harm rather than removing it.
    - Provider selection was not a clean sweep. Rubric faithfulness and answer
      relevance improved, while RAGAS answer relevancy regressed 0.8775 → 0.8602.
    - The sealed set exposed two limits. Tuning recall@5 0.831 did not repeat on
      the original 15 questions. In the 55-question expansion, 9 of 11 failures
      retrieved the right article at rank 1 yet kept unsupported claims.
    - The reusable deliverable is the measurement contract itself: seeded floors,
      three judges, a sealed set, and cost meters.

    ## Exact numbers

    These reference tables preserve full precision for the retrieval and
    generation steps shown in the diagram.

    Retrieval configurations on the 65 tuning questions:

    | Retrieval configuration | recall@5 | recall@10 | MRR@5 |
    |---|---|---|---|
    | MiniLM, 200-token chunks | **0.831** | 0.846 | **0.808** |
    | lexical word match (baseline) | 0.677 | 0.754 | 0.500 |
    | seeded random (chance floor) | 0.031 | 0.046 | 0.018 |

    Delta over the baselines, the comparison a client should read first:

    | Δ vs baseline | recall@5 | recall@10 | MRR@5 |
    |---|---:|---:|---:|
    | over lexical word match | **+0.154** | +0.092 | **+0.308** |
    | over seeded random | +0.800 | +0.800 | +0.790 |

    | Generation metric | Incumbent | Selected `kimi-for-coding` |
    |---|---:|---:|
    | rubric faithfulness | 0.5504 | **0.6209** |
    | rubric answer relevance | 0.5573 | **0.6458** |
    | rubric context recall | 0.9636 | 0.9636 |
    | RAGAS faithfulness | — | **0.7337 [0.6562, 0.8131]** |
    | RAGAS answer relevancy | 0.8775 | **0.8602** |
    | RAGAS context precision / recall | — | 0.7609 / 0.9826 |

    - Selected tuning taxonomy: 46 correct / 17 unsupported / 2 retrieval-miss /
      0 format failures. Refusal accuracy 1.0, false-abstention 0.0545,
      cite-when-expected 0.9636.
    - Selected tuning operations: p50 25.888 s, p95 108.836 s; answer generation
      $0.000906/query before judge/verify costs. No total tuning-suite cost is
      claimed.
    - Sealed held-out pass (55 questions: 32 single-hop, 10 multi-hop, 13
      unanswerable): 44 correct / 9 unsupported-claim / 1 retrieval-miss / 1
      format-failure (0.80 correct, CI [0.69, 0.89]); operational recall@5
      0.745 (+0.691 over the 0.055 random floor), recall@10 0.764, MRR@5
      0.718 (+0.688 over 0.030); on 42 answerable
      questions, rubric faithfulness 0.6338 [0.5726, 0.7021], answer relevance
      0.7114, context recall 0.9762; 12/13 required refusals (accuracy 0.92,
      CI [0.77, 1.0]); 241 calls and $1.950667 cloud-equivalent under the
      $3.00 cap; p50 24.443 s, p95 126.811 s.
    - Citation-correctness pass (second sealed sample, claim-level records
      persisted): 258 claims over 42 verified answers; first-check support
      0.903 CI [0.868, 0.938]; 16 repaired / 11 dropped; the five
      unsupported-claim answers drafted at 0.74 first-check support vs 0.93
      for correct; 236 calls and $1.583466 cloud-equivalent; p50 25.351 s,
      p95 84.681 s.
    - Stress pass (independent 30-question set, no answerability gate;
      `detail.stress`): 16/30 correct (0.53, CI [0.37, 0.70]) against 0.80
      on the gated held-out set; 11 of the 14 non-correct outcomes are
      unsupported-claim with retrieval intact; refusal accuracy 0.60 (6/10,
      CI [0.30, 0.90]) on the abstain rows; rubric faithfulness 0.5175
      [0.3687, 0.6663]; 123 calls, $1.932540 cloud-equivalent; p50 26.115 s,
      p95 340.997 s.

    ## Grounding hardening and independent checks

    The answer-checking step in the diagram also frames the following measured
    interventions. Pre-registered means the targets were fixed before scoring.

    The hardening pass drafts claims with verbatim evidence spans. It applies
    deterministic number, date, and negation guards before an entailment judge,
    which checks whether evidence supports a claim. It then repairs or drops
    claims and applies an inference-time evidence gate. Two sets score it:
    the frozen stress re-run (`detail.stress_after_r6`) and independent set B
    (`data/golden_stress_b.json`). Both admit questions at article level only.
    Set B has 30 questions sealed before tuning.

    Set B has no pre-change baseline. Its absolute targets were unsupported
    claims ≤ 6/30, overall correctness ≥ 0.60, answer-expected correctness
    ≥ 0.70, refusal accuracy ≥ 0.8 on abstain rows, and false abstention
    ≤ 0.10. With n=30, every point estimate carries a CI. A B result is
    preliminary evidence, not proof of generalization.

    - Frozen stress re-run: a normalized comparison uses the same classifier
      on both sides, with baseline row 14 reclassified as budget-terminated.
      Overall correctness moves 0.500 → 0.733 (CI [0.567, 0.867]),
      answer-expected 0.450 → 0.700, unsupported claims 11 → 5, refusal
      accuracy 0.600 → 0.800, and false abstention 0.050 → 0.050. Every
      no-regression gate passes. All six unanswerable rows are refused
      correctly. A schema fix enabled this: the earlier citation mandate made
      honest refusal unrepresentable and caused token-burning tool loops on
      those rows.
    - Independent set B: overall correctness is 0.633 (CI [0.467, 0.80]),
      clearing the 0.60 target. Refusal holds at 0.80 with zero false
      abstentions. Unsupported claims at 9/30 and answer-expected correctness
      at 0.550 miss their pre-registered bars. Unseen adversarial questions
      still produce over-claims. This is measured progress on the frozen set,
      not broad-corpus readiness.
    - Operations: end-to-end hosted answer latency is p50 23.0 s and p95 532 s
      with verification in the critical path. The verify overlay averages 5.9 s
      (6.6% of answer time). A full sealed pass takes ≈50 min wall time.
      Cloud-equivalent cost is $9.74 on the frozen set and $2.19 on B.

    ## Retrieval and judge alternatives

    These measured alternatives did not replace the steps in the diagram.

    - A local, $0 retrieval-only tournament tested structure-aware
      title-prefixed chunking, Qwen3-Embedding, BM25/RRF fusion, and
      Qwen3-Reranker. The best arm moved recall@10 from 0.831 to 0.846
      (+1.5 points), short of the pre-registered +5-point promotion bar. The
      incumbent retrieval stands.
    - A local-judge calibration used 274 labels-by-construction cases. It found
      false-acceptance 1.03%, false-rejection 83.5%, Cohen's κ 0.155, answer
      agreement 52.5%, and repeat flips 9.3%. Cohen's κ measures agreement
      after accounting for chance. The local judge is diagnostic-only, not a
      promotion instrument.
    - Sealed set C had 30 fresh questions with gold spans. It was scored once
      with local generation and hosted adjudication at $0.096 cloud-equivalent.
      Overall correctness was 0.333 against the 0.70 target. Every answerable
      row abstained, and false abstention was 1.000. The traces were published
      rather than tuned away. Hosted generation and incumbent retrieval stayed
      unchanged. A further quality claim required fresh sealed set D.
    - An integrity review later traced C's refuse-all pattern to a verifier
      crash on an empty judge batch (`UnboundLocalError`). C is therefore a
      failure diagnostic, not a measurement of the local generator's ceiling.

    ## Judge alignment and measurement integrity

    The diagram's verification step also bounds the judge-alignment attempt.
    A full-entailment prompt checks every part of every claim. A substantiation
    filter removes irrelevant spans. Both were measured, not adopted.

    - Frozen-set correctness dropped from 0.733 to 0.667, and false abstention
      rose from 0.05 to 0.25. The stricter judge trades unsupported claims for
      over-abstention without net gain. The substantiation filter regressed
      further and is opt-in only.
    - Hosted-versus-local calibration on 274 constructed labels failed in both
      directions: hosted false-acceptance 45.4% and local false-rejection
      83.5%. The answer-level rubric verdict remains the correctness instrument.
    - Sealed set D passed 1/6 targets: overall 0.567, answer-expected 0.550,
      single-hop 0.625, refusal 0.60, and false abstention 0.20. The alignment
      is not promoted. The grounding-hardening configuration remains the
      production champion. This attempt adds a measurement record, not a new
      pipeline.

    The integrity review also fixed the measurement layer. Claims now survive
    infrastructure failures as `verification_error` records. Each answer
    enforces drafted = surviving + dropped + verification_error. Repository
    export excludes dotenv variants, keys, certificates, and databases before
    packaging. Calibration was rebuilt with correct denominators, genuine
    abstention cases, manual-review exclusions, raw predictions, and immutable
    run-id artifacts.

    The rebuilt hosted judge still fails every promotion gate:
    false-acceptance 35.6%, UCB 46.1%, kappa 0.656, agreement 78%, and flips
    6.0%. UCB means upper confidence bound, the conservative upper end of an
    uncertainty range. The answer-level rubric verdict remains the correctness
    instrument. The next independent quality claim requires fresh sealed set E
    once the integrity gates hold.

    ## Hybrid retrieval reference

    The retrieval step in the diagram includes sparse+dense fusion as the
    current production default. This retrieval-only comparison turns reranking
    off and makes no LLM calls. An LLM is a large language model. It compares
    dense search, BM25 (k1=1.2, b=0.75), and RRF k=60 over the top-50 lists.
    BM25 is a word-based ranking method. RRF, reciprocal rank fusion, combines
    ranked lists.

    - Tuning: RRF ties dense on recall@5 (Δ 0.000) and adds MRR@5 +0.006.
      nDCG@10 is slightly lower at 0.700 versus 0.714. nDCG@10 measures ranked
      relevance in the top ten, with more credit for early hits. BM25 alone
      reaches 0.738 (−0.093 versus dense).
    - Sealed raw layer: dense recall@5 is 0.976 versus BM25 0.952 and RRF 0.952.
      This is a consistency read, not a stress test. RRF again does not beat
      dense. At this scale, fusion buys no measured recall for its extra
      latency. The dense+rerank champion is unchanged.

    ## Protocol

    - Tuning: 65 questions (44 single-hop, 11 multi-hop, 10 unanswerable) drive
      selection; sealed: 55 (32 single-hop, 10 multi-hop, 13 unanswerable),
      written after tuning froze, scored once per pass.
    - Floors: seeded random and word-match search, scored per configuration.
    - Judges: rubric judge (failure taxonomy), hosted RAGAS (faithfulness,
      relevancy), claim verifier (per-claim support vs cited chunk, abstains
      below 0.6, at most 2 repairs); intervals are the judges' 95% ranges.
    - Cost: cloud-equivalent rate-card at the kimi-k2.8-preview card
      ($1.00/Mtok input, $4.00/Mtok output, cached reads 30%). Mtok means
      million tokens.

    ## Limits

    - Judge noise at n=30 matches the local A/B deltas. Local repair quality is
      weak; verify gains come mainly through abstention.
    - The HPO grid is small. MiniLM's tie with BGE-small holds at 593 articles.
    - The sealed pass keeps the honest count: 44/55 correct. Every expansion
      question passed an answerability gate before scoring, so its retrieval
      reads are consistency checks, not stress tests.
    - Grounding and repair improvement is deferred until a fresh external
      corpus is available. The registry holds only this Wikipedia slice. No
      broad-corpus claim and no always-on chat are made. Held-out retrieval
      drops, and live hosted calls need a cost budget.

    **Business summary:** Final state: 44 of 55 sealed questions correct with
    refusal accuracy 0.92; 17 of 65 tuning answers kept unsupported claims and
    9 of 11 sealed failures had the right article at rank 1. Retrieval is
    solved, grounding is not; the measurement contract is the deliverable.
  figures: []
key_concepts:
  - "**Seeded floors:** Random and word-match rankings anchor every headline, so a score cannot merely restate how easy the task is."
  - "**Sealed held-out set:** A second question set is written after tuning freezes and scored once, which protects it from tuning overfit."
  - "**Claim support floor:** Each claim needs support of 0.6 or better from its cited passage. Otherwise it is cut, repaired at most twice, or the answer abstains."
  - "**Three separate judges:** Rubric taxonomy, RAGAS, and per-claim verification catch different failures. No single score represents answer quality."
  - "**Cloud-equivalent cost metering:** A public rate card turns token use into estimated dollars and applies a hard cap to every pass."
  - "**Auditable is not trustworthy:** Every answer traces to a readable passage, yet 17 of 65 still kept unsupported claims. Verification bounds harm; it does not remove it."
