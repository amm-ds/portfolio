figure_captions:
  eda_corpus_composition: "Articles per topic and word-length distribution for all 593 bounded Wikipedia articles. Topic coverage is near-balanced. The long tail ends at the 12,000-character cap."
  retrieval_funnel: "Development history: question-level outcomes for the reranked top-3 on 65 golden questions, 54 hits and 11 misses. Upstream candidate volumes are 975 embedding passages (65 x top-15) and 195 retained passages (65 x top-3); those passage counts are deliberately not plotted as question outcomes. Reranking improves rank quality, not recall@5."
  chunk_size_sweep: "Development history: retrieval recall for 200/400/800-token chunks against the lexical word-match floor on 65 tuning questions. All three sizes tie at recall@5 0.831, and 200 tokens minimizes context cost. The seeded-random floor (0.02-0.03) is a tabulated metric, not a plotted line; see Exact numbers."
  latency_histogram: "Development history: per-answer latency for the selected hosted 65-question tuning run. The median, p50, is 25.888 s. The 95th percentile, p95, is 108.836 s."
  kimi_generation_comparison: "Development history: selected kimi-for-coding versus the incumbent on 65 tuning questions. Rubric faithfulness and answer relevance improve. RAGAS faithfulness reaches 0.7337, while RAGAS answer relevancy regresses from 0.8775 to 0.8602."
  model_comparison: "Development history: MiniLM and BGE-small tie at recall@5 0.831 on 65 tuning questions. MiniLM has slightly higher MRR@5 (0.808 vs 0.805), so the smaller CPU model is the measured default here."
  retrieval_ladder: "The tournament that chose the retriever, retrieval-only with no LLM calls. R0 is the as-shipped baseline (size chunks, dense embeddings, rerank); S1 adds title-anchored structure chunks; S2 adds BM25 RRF fusion; S3 adds a per-article diversity cap and is promoted. Bars are recall@5 with Wilson 95% whiskers on frozen splits; the right panel requires every chunk of a relevant article in the top 5. S3 lifts final_v3 recall@5 to 0.9457 from 0.9239; S1 and S2 were never measured on the consumed final_v3 set."
  final_outcome: "The final sealed pass on 120 final_v3 questions. Left: the answer-versus-abstain confusion, 80 true positives, 4 false positives, 24 true negatives, 12 false negatives (F1 0.9091, precision 0.9524, recall 0.8696). Right: correct per question type, single-hop 60 of 68, multi-hop 20 of 24, unanswerable 24 of 28."
  failure_taxonomy: "Final-pass verdicts for the 120 final_v3 rows: 104 correct, 10 empty-answer, 4 budget-terminated, 1 unsupported-claim, 1 retrieval-miss. Grounding hardening cut unsupported claims from 17 of 65 in the tuning pass to 1 of 120; the remaining debt is over-abstention and rail stops."
  verify_funnel: "Claim-level accounting of the final pass verify loop: 166 drafted claims, 16 mechanical fails before judging, 150 judged, 148 supported, 159 accepted (148 originals plus 11 repaired within the two-call rail), 7 dropped. Mean support among surviving claims is 0.9739."
  fusion_arm_comparison: "Development history: dense, BM25, and RRF(k=60) retrieval arms on 65 tuning questions and a 15-question sealed raw layer, reranking off and no LLM calls. Tuning recall@5 ties dense and RRF at 0.831; sealed recall@5 trails 0.533 (RRF) to 0.600 (dense). Plain out-of-the-box fusion was not promoted; the later S3 champion couples hybrid fusion with structure chunks, reranking, and a per-article cap."
