project_id: 01-rag-agent
short_version: "A cited QA assistant over 593 pinned Wikipedia articles. Tuning (65 q): 46 correct, 17 unsupported-claim outcomes. Sealed held-out (55 q): 44 of 55 correct; 9 of 11 failures kept unsupported claims despite rank-1 retrieval; refusal accuracy 0.92. Auditable, not unattended-ready."
sections:
- id: background
  text_md: |
    **This assistant answers only from a pinned corpus, a fixed set of Wikipedia
    articles, and shows a source for every claim.**

    ```diagram 01-rag-pipeline
    ```

    The diagram shows retrieval (passage search) on a CPU (computer processor).
    Search narrows 593 articles to three passages. A model drafts cited answers.
    A verifier cuts or refuses claims below the 0.6 support floor.

    Retrieval reaches recall@5 of 0.831 versus 0.677 for word match. Recall@5
    means the right article appears in the top five. Yet 17 of 65 hosted answers
    kept claims without evidence. A sealed set, held back from tuning, has 44
    of 55 answers correct. However, 9 of 11 failures have the right article at
    rank 1, the first result. Auditable does not mean unattended-ready.

    **Business summary:** Get cited answers from 593 pinned Wikipedia articles.
    The right article surfaces 83% of the time, yet 17 of 65 hosted answers
    kept unsupported claims.
  figures: []
- id: objectives
  text_md: |
    **The product must answer with evidence or refuse honestly. It must never
    guess.** The decision flow is the contract for every question.

    ```diagram auto-01-rag-agent-1
    ```

    Follow the question through the diagram. It first meets the corpus
    boundary. A question outside that boundary receives a calibrated refusal,
    which means the system declines instead of inventing an answer. An
    in-corpus question moves to a cited draft. Each claim must reach the 0.6
    support floor, a score for how well its passage backs it.

    The repair loop gives failing claims a few bounded retries. If they still
    fail, the system abstains, meaning it returns no answer. Only a passing
    answer reaches the cost meter. Success therefore means:

    - Return a structured summary, citations, and confidence, an estimate of
      answer reliability. Bad output fails loudly after a few retries.
    - Find the right article at least 0.60 of the time, cite it when it exists,
      and refuse questions outside the corpus.
    - Keep cost at or under $0.01 a query.

    The diagram also explains two design choices. Retrieval runs on CPU only.
    The model can be local, which keeps prompts and sources on the machine, or
    hosted, which sends them to an outside provider. That is a user choice,
    not a default. Offline mode checks the contract without a provider or
    spend. A bigger hosted model was rejected because scale does not fix
    grounding, the link between claims and evidence, and would break the cost
    cap.

    **Business summary:** The product must answer with citations or refuse
    honestly, find the right article at least 60% of the time, and stay under
    $0.01 per query.
  figures: []
- id: data
  text_md: |
    **A small, pinned corpus makes every claim checkable.** The lineage
    diagram shows how source pages become the exact files used for scoring.
    DVC, a data version-control tool, tracks each step.

    ```diagram auto-01-rag-agent-2
    ```

    Follow the diagram from the bounded scan to the bounded build and then to
    scores. Every score comes from one pinned artifact, or fixed data file.
    A sha256 checksum, a unique digital fingerprint, identifies that file.
    Source, snapshot date, license, and credit sit in the
    [data registry](https://amm-ds.github.io/portfolio/data-registry/wikipedia/).

    The diagram's build step applies these limits and checks:

    - Five topics are covered: Climate, Renewable energy, Aviation, Machine
      learning, and Photosynthesis. Each has at most 120 matched articles plus
      exact-title anchors, which are required known pages.
    - Every article is cut at 12,000 characters. Indexing all Wikipedia would
      make claim checks open-ended. Uncapped articles would not fit one model
      context, the text a model can read at once.
    - Null and length gates reject empty or oversized input before indexing,
      the step that prepares text for search.
    - Both question sets, 65 tuning and 55 sealed, are graded by hand. The
      sealed set was written only after tuning froze.
    - The tuning mix has 44 single-hop questions, 11 multi-hop questions, and
      10 unanswerable questions. Single-hop needs one article; multi-hop
      combines several. This mix exercises retrieval, composition, and refusal.

    **Business summary:** The corpus is five topics, 593 articles capped at
    12,000 characters, pinned by a sha256 contract with source and license in
    the data registry.
  figures: []
- id: eda
  text_md: |
    **Topic counts are near-balanced; article lengths are not.** Read the
    corpus composition figure in two passes.

    - The topic bars show 102–125 articles per topic. No topic dominates
      retrieval training, so one average cannot hide a weak subject.
    - The length distribution has a long tail and a hard right edge at 12,000
      characters. This cap keeps embedding cost low. Embeddings are numeric
      representations of meaning used for search. Every article also fits one
      model context.

    The balanced bars required direct coverage checks, not assumptions:

    - Dump order is not topical. A naive quota fill would pad topics with side
      pages.
    - Several hoped-for flagship titles were missing from the scan.

    Each anchor title and test question was therefore checked against the
    corpus itself. The small corpus makes that cheap. The near-equal bars then
    support a fair corpus-wide average instead of a score carried by one large
    subject.

    **Business summary:** The corpus runs 102–125 articles per topic with
    lengths cut at 12,000 characters; every anchor title and test question was
    verified against it.
  figures: [eda_corpus_composition]
- id: training
  text_md: |
    **Ranking discipline, not a larger model, improves retrieval.** The
    pipeline uses MiniLM embeddings, exact FAISS search, cross-encoder rerank,
    an agent draft, claim verification, and a cited answer or abstention.
    FAISS is a library that finds exact nearest matches between embeddings.
    A cross-encoder is a second model that reorders candidates by relevance.

    Start with the retrieval funnel. Across 65 questions, 975 embedding
    candidates narrow to 195 reranked passages. The final top-3 retains a
    relevant article for 54 questions. The wide first stage avoids discarding
    useful candidates before reranking.

    The other two figures explain the chosen setup:

    - In the chunk-size sweep, 200-, 400-, and 800-token chunks tie at recall@5
      0.831. Tokens are small pieces of text used by models. The 200-token
      setup needs only ≈800 input tokens per query for the top-3 context.
      Larger chunks cost roughly 2–4× the tokens for no recall gain.
    - In the model comparison, the 80 MB MiniLM matches BGE-small at recall@5
      0.831. It edges BGE-small on MRR@5, 0.808 versus 0.805. MRR@5 is the mean
      reciprocal rank of the first relevant hit in the top five. A bigger
      embedding model was rejected, so CPU-only search stays.

    The funnel also isolates the reranker's effect. It lifts MRR@5 from 0.718
    to 0.808 without changing recall@5. It reorders relevant articles rather
    than finding new ones. At 593 articles, exact search is cheap enough that
    no approximate index is needed.

    **Retrieval core: wide candidate recall first, cross-encoder precision
    second.** The code below shows the reranker reordering candidates, never
    replacing the search.

    ```python
    def search(self, query: str, top_k: int | None = None) -> list[Citation]:
        k = top_k or self.config.top_k
        n_candidates = min(len(self.chunks), k * self.config.rerank_multiplier)
        vector = self._embed_query(query)
        _, ids = self.index.search(vector, n_candidates)
        candidates = [self.chunks[int(i)] for i in ids[0] if int(i) >= 0]

        if self.rerank_fn is not None and len(candidates) > k:
            scores = np.asarray(
                self.rerank_fn(query, [c.text for c in candidates]), dtype=np.float32
            )
            order = np.argsort(-scores)
            candidates = [candidates[int(i)] for i in order]

        return [self._to_citation(c) for c in candidates[:k]]
    ```

    Excerpt from [index.py](https://github.com/amm-ds/portfolio/blob/main/projects/01-rag-agent/src/rag_agent/index.py).
    The funnel and model comparison show recall@5 0.831 against 0.677 for word
    match and 0.031 for seeded random. The funnel ends at retrieval, so it
    does not prove answer quality. The hosted pass classified 17 of 65 answers
    as keeping unsupported claims. Full run records live in the conclusions.

    **Business summary:** The chosen retrieval setup finds the right article
    83% of the time; word-match search reaches 68%, random 3%.
    Cross-encoder reranking lifts MRR@5 from 0.718 to 0.808.
  figures: [retrieval_funnel, chunk_size_sweep, model_comparison]
- id: evaluation
  text_md: |
    **Auditable means every claim points to a passage a person can read. A
    reviewer is still necessary.** The measurement diagram shows the gate for
    every result: two seeded floors, three judges, a sealed set, and cost
    metering under a hard cap.

    ```diagram auto-01-rag-agent-3
    ```

    The judges check different things. A rubric judge labels failure types.
    RAGAS is an automated suite for scoring answer quality. A claim verifier
    checks each claim against its cited passage. Follow these checks into the
    generation comparison figure. Hosted `kimi-for-coding` raises rubric
    faithfulness from 0.5504 to 0.6209 and answer relevance from 0.5573 to
    0.6458. Context recall stays at 0.9636. RAGAS faithfulness is 0.7337
    [0.6562, 0.8131], while answer relevancy falls from 0.8775 to 0.8602.
    The selected pass has 46 correct, 17 unsupported-claim, 2 retrieval-miss,
    and 0 format-failure outcomes. Refusal accuracy is 1.0, false-abstention
    is 0.0545, and cite-when-expected is 0.9636.

    The latency histogram shows what the selected pass costs in time. Answer
    generation costs $0.000906/query before judge and verification costs. Its
    p50 latency is 25.888 s and p95 is 108.836 s. These are the median and the
    level below which 95% of answers finish.

    Return to the measurement diagram for the sealed test. It has 55
    questions: 32 single-hop, 10 multi-hop, and 13 unanswerable, expanded from
    15 after tuning froze. It keeps 44 of 55 correct (0.80, CI [0.69, 0.89]).
    CI means confidence interval, a range that reflects sampling uncertainty.
    Operational recall@5 is 0.745 versus a 0.055 random floor. Rubric
    faithfulness is 0.63 [0.57, 0.70], and context recall is 0.976. Of 13
    required refusals, 12 succeed (0.92, CI [0.77, 1.0]); one answer is a false
    abstention. The pass costs $1.95 cloud-equivalent, an estimate at public
    cloud rates rather than a bill. Latency is p50 24.443 s and p95 126.811 s.

    The sealed result needs its gate. Every expansion question passed an
    answerability check, so retrieval is a consistency read, not a stress test.
    Of 11 failures, 9 have the right article at rank 1 yet keep unsupported
    claims. One is a top-k demotion, where the article falls below the retained
    results. None is a raw retrieval miss.

    The same diagram governs an independent 30-question stress set with no
    production-retriever gate. Scored once under the same protocol
    (`evaluate --stress`, $1.93, `detail.stress`), it has 16/30 correct
    (0.53, CI [0.37, 0.70]) against 0.80 on the gated set. Of 14 non-correct outcomes, 11 keep
    unsupported claims with retrieval intact. Refusal accuracy is 0.60 (6/10,
    CI [0.30, 0.90]). This is measured stress performance, not broad-corpus
    proof. A citation pass adds per-claim records (`--citations`, $1.58,
    `detail.heldout_citations`); results appear below.

    Finally, the fusion comparison keeps retrieval honest. Fusion combines
    word-based and embedding search. It ties dense search rather than beating
    it, so the extra latency buys no measured recall. Exact arms and the
    sealed consistency caveat are tabulated in the conclusions.

    **Business summary:** Selected `kimi-for-coding` improves faithfulness
    but leaves 17 unsupported-claim outcomes in 65 tuning answers; the sealed
    pass keeps 44 correct, failures concentrated in grounding; hybrid fusion
    ties dense.
  figures: [latency_histogram, kimi_generation_comparison, fusion_arm_comparison]
  metrics_keys:
