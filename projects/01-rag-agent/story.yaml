project_id: 01-rag-agent
sections:
  - id: background
    text_md: |
      LLM assistants fail silently in the way that matters most to a
      business: they sound confident while inventing facts.
      Retrieval-grounded design removes that failure mode by construction —
      the model can only speak from evidence it was shown, and every claim
      carries a citation a human can audit.

      The problems this design eliminates:

      - **Hallucination by omission** — nothing forces the model to look
        anything up, so it answers from memory instead.
      - **Unverifiable confidence** — fluent answers with no way to check
        where they came from.
      - **Untestable quality** — demos that impress once, with no measurement
        behind the claim.

      This project builds that assistant as a fully reproducible pipeline: a
      bounded, checksum-pinned slice of Wikipedia, a local embeddings index,
      and an agent whose only window into the corpus is two retrieval tools.
      No demo shortcuts — every quality claim below is measured on a graded
      question set.

      **Business implication:** you get an assistant whose answers can be
      audited claim by claim — the difference between "the AI said so" and
      "here is the exact passage it relied on".

  - id: objectives
    text_md: |
      The deliverable is a question-answering agent with three hard
      properties, each enforced rather than prompted:

      - **Typed, validated output** — the model must return a structured
        `AnalysisResult` (summary, citations, confidence); a schema-invalid
        response fails the run loudly instead of reaching a user.
      - **Evidence grounding** — the only corpus access is
        `search_documents` / `read_excerpt`; the system prompt forbids outside
        knowledge.
      - **Operational SLOs** — retrieval recall ≥ 0.60 on the graded set,
        an end-to-end latency target, and a per-query cost a client can
        budget against (≤ $0.01).

      The provider fallback chain makes "works everywhere" explicit:

      ```mermaid
      flowchart LR
          Q[User question] --> A[Agent]
          A -->|LLM_BASE_URL + LLM_API_KEY set| L[OpenAI-compatible provider]
          A -->|no credentials| O[Local Ollama<br/>qwen3.6:35b-a3b-q4_K_M]
          L --> R[Structured AnalysisResult]
          O --> R
          A -->|no provider at all| E[Loud error + setup guidance]
      ```

      Retrieval runs CPU-only and the LLM defaults to a local model, so data
      never leaves the machine — the evaluation included — and `evaluate
      --offline` keeps a retrieval-only CI path without any provider.

      **Business implication:** answers come with citations a reviewer can
      check — trust is a feature, not a promise — and the SLOs are written
      down, so acceptance criteria exist before any demo.

  - id: data
    text_md: |
      The corpus is a topical slice of the English Wikipedia dump
      `20231101.en`, streamed from Hugging Face and bounded by construction.

      - **Bounded scope** — five diverse topics (Climate, Renewable energy,
        Aviation, Machine learning, Photosynthesis), at most 120 articles per
        topic plus exact-title anchor articles collected outside the pattern
        quota. Result: 593 articles (≈3.5 MB of text).
      - **Quality gates** — null-rate and length-range checks halt the
        pipeline loudly on violation; DVC tracks every artifact for
        reproducibility.

      The source dataset is registered in the
      [data registry](https://amm-ds.github.io/portfolio/data-registry/wikipedia/):
      snapshot `20231101.en` of English Wikipedia, streamed via `datasets`,
      licensed **CC BY-SA 3.0 / GFDL (attribution required)**. The derived
      corpus ships with its own sha256-pinned contract at
      `data/raw/dataset_contract.json`, and every transformation replays via
      `dvc repro` in the project directory.

      **Business implication:** the data has a license trail, a checksum and
      a snapshot date — the legal and reproducibility questions procurement
      always asks are answered in one file.

  - id: eda
    text_md: |
      The composition figure `eda_corpus_composition` shows what the bounded
      scan actually collected, and it shaped the pipeline in one concrete way.

      - **Near-symmetric topic coverage** — ≈102–125 articles per topic, so
        no single theme dominates retrieval behavior.
      - **Right-skewed article lengths** — most articles run 500–2,000 words,
        with a long tail of large articles truncated at 12,000 characters to
        keep embedding cost predictable.

      The finding that mattered: the Wikipedia dump order is not topical, so
      naive pattern quotas fill on peripheral articles (journals, albums,
      lists) long before flagship pages appear in the stream — several famous
      titles (e.g. "Photosynthesis", "Renewable energy") are entirely absent
      from this dump. Exact-title anchors and eval questions were verified
      against the real corpus, not assumed.

      **Business implication:** we scoped the corpus by measuring what is
      actually in the data rather than assuming — the same habit that catches
      data-availability surprises before they become project risks.
    figures:
      - eda_corpus_composition

  - id: training
    text_md: |
      "Training" here is index construction, deliberately classical — no
      fine-tuning, just chunking and ranking discipline whose trade-offs are
      measured rather than guessed.

      The retrieval pipeline the agent sees at query time:

      ```mermaid
      flowchart LR
          Q[Question] --> E[MiniLM embedding]
          E --> F[FAISS IndexFlatIP<br/>top 5 x k candidates]
          F --> C[Cross-encoder rerank<br/>ms-marco-MiniLM]
          C --> T[Top-k citations<br/>to the agent]
      ```

      - **Paragraph-aware chunking** — whole paragraphs first, then sentence
        boundaries, then word windows with overlap; max-size and overlap
        guarantees are unit-tested, at three budgets (200/400/800 tokens) so
        the size trade-off can be measured.
      - **Rerank with a reason** — each chunk is embedded with
        `all-MiniLM-L6-v2` (L2-normalized, CPU) into a FAISS `IndexFlatIP`;
        at query time the top 5×k embedding hits are re-scored by the
        `ms-marco-MiniLM-L-6-v2` cross-encoder so the *right* passage tops
        the list — which is what a reading LLM actually consumes.
      - **Provider-agnostic agent layer** — per ADR-0004
        (`docs/architecture/adr/0004-llm-provider-abstraction.md`): an
        env-configured OpenAI-compatible endpoint first, local Ollama second
        — one code path, no runtime mock.

      **Business implication:** the whole pipeline runs on commodity CPU —
      no GPU budget, no vendor lock-in, and one seam swaps the LLM provider
      without touching anything else.
    figures:
      - retrieval_funnel

  - id: evaluation
    text_md: |
      Quality is measured, not demoed. The golden set is 65 graded questions
      (44 single-hop, 11 multi-hop, 10 unanswerable) with known relevant
      article ids, replacing an earlier, too-small 10-question subset.

      - **Bounded HPO grid** — 3 chunk sizes × top_k ∈ {3, 5, 8, 10}, a
        MiniLM vs BGE-small arm, a rerank on/off ablation, and a **seeded
        uniform-random baseline** marking the floor any ranker must beat; the
        `chunk_size_sweep` and `retrieval_hpo_frontier` figures render the
        grid.
      - **Two judge layers** — a rubric judge (provider model by default,
        `JUDGE=keyword` as the deterministic CI floor) measuring faithfulness,
        relevance and context recall; and, behind `evaluate --ragas`, the
        **RAGAS** set (faithfulness, answer_relevancy, context_precision,
        context_recall) scored by the active provider (local: $0 API cost;
        hosted: metered).
      - **Verify-then-answer loop** — every drafted answer is claim-split and
        entailment-checked against the full text of its cited chunks;
        unsupported claims are repaired (budget-capped, max 2 calls) or
        dropped, and answers below the min_support floor (0.6) fall back to
        abstention.
      - **Operations** — per-query latency and token usage persist to
        `reports/cost_telemetry.json`; hosted runs add a per-phase meter
        (agent / judge / verify / RAGAS calls, tokens and cloud-equivalent
        spend) with a hard USD cap per run, and schema-invalid agent output
        is retried (≤2) before it counts as a format failure.

      Everything lands in `reports/metrics.json`. Local inference bounds the
      LLM phases to a 30-question subset; the hosted pass runs the full 65
      questions with every phase metered; `evaluate --offline` keeps a
      CI-safe retrieval-only path.

      **Business implication:** the offline/keyword path means the quality
      harness still runs in CI without secrets or GPUs, while the real
      numbers come from a $0 local run — quality gates survive procurement
      either way.
    figures:
      - chunk_size_sweep
      - retrieval_hpo_frontier
      - latency_histogram
    metrics_keys:
      - retrieval_chunks_200
      - retrieval_random_chunks_200
      - retrieval_model_minilm_chunks_200
      - retrieval_model_bge_small_chunks_200
      - retrieval_rerank_on_chunks_200
      - retrieval_rerank_off_chunks_200
      - rag_agent

  - id: results
    text_md: |
      Retrieval first — everything downstream depends on it (65-question
      golden set, seeded random floor; identical across providers — the
      sweep is embeddings-only):

      | Configuration | recall@5 | recall@10 | MRR@5 |
      |---|---|---|---|
      | chunks=200, top_k=10 | 0.831 | 0.846 | 0.808 |
      | random baseline | 0.031 | 0.046 | 0.018 |
      | **chosen: MiniLM, chunks=200, top_k=3, rerank ON** | **0.831** | — | **0.808** |

      Provider A/B — same pipeline: local `qwen3.6-q4` (30-q subset, the
      local wall-clock bound) vs hosted `kimi-for-coding` (full 65 q).
      Hosted costs are **cloud-equivalent estimates** at the kimi-k2.8 card
      — membership quota, never billed:

      | Pass | Taxonomy | RAGAS faithfulness | Verify overhead |
      |---|---|---|---|
      | local qwen3.6-q4, verify ON (n=30) | 15 correct / 14 unsupported / 1 format | 0.606 | 33 repair calls |
      | hosted kimi-for-coding, verify ON (n=65) | 44 correct / 18 unsupported / 2 retrieval-miss / 1 format | 0.685 [0.605, 0.760] | 39 repair calls |

      - **Grounding tracks the provider** — hosted faithfulness 0.685
        [0.605, 0.760] vs 0.606 local (different denominators, 65 vs 30 —
        directional, not a controlled win); relevancy 0.878 [0.820, 0.918].
        Refusal accuracy 0.9 [0.7, 1.0]; false-abstention 0.036.
      - **Verify overhead is calls, not minutes** — hosted p50/p95 latency
        23 s / 175 s per answer (p95 tail: one runaway tool-loop question
        cut off by the token guard); the new output-retry recovered the
        run's one schema-invalid draft, so the lone format-failure is the
        token guard, not schema noise.
      - **Metered cost (hosted, full 65-q run)** — $3.58 cloud-equivalent
        over 922 calls: agent $1.79, RAGAS $1.13, verify $0.47, judge $0.19;
        79.6% of input tokens were prompt-cache reads. The USD cap is real:
        a first pass tripped at $3.04; the re-run completed under a logged,
        raised cap.

      Retrieval is solid (0.831 vs 0.031 random); grounding is still the
      bottleneck — the hosted column buys ~+0.08 faithfulness, and the
      meter says what it costs.

      **Business implication:** quality claims now carry a provider A/B and
      a per-phase cost table — the evidence a client needs to choose where
      the assistant runs and what to budget.
    figures:
      - model_comparison
      - retrieval_hpo_frontier
      - failure_taxonomy
    metrics_keys:
      - retrieval_chunks_200
      - retrieval_random_chunks_200
      - retrieval_model_minilm_chunks_200
      - retrieval_rerank_on_chunks_200
      - rag_agent

  - id: conclusions
    text_md: |
      Limits first — the numbers above come with caveats a client
      should hear before reuse:

      - **Judge noise is real at n=30** — RAGAS faithfulness moved
        0.651→0.606 across runs; small deltas are directional, not
        significant, and the wide CIs say so.
      - **Repair quality at local-model scale is weak** — the loop's
        measured levers are claim removal and abstention, not fluent
        rewriting; a stronger provider judge may move faithfulness further.
      - **The HPO grid is small and the corpus homogeneous** — BGE-small
        tying MiniLM is evidence about *this* scale, not a universal claim;
        on noisier corpora the stronger encoder may pay off, and the same
        harness will show it.
      - **Corpus coverage is bounded by the dump** — famous anchor titles
        verified absent from `20231101.en`, and per-topic quotas saturate
        with peripheral articles.

      Lessons that transfer:

      - **Typed outputs that fail loudly beat prompt promises.**
      - **Evidence-only tool access makes grounding enforceable, not hopeful.**
      - **A seeded random floor plus ablations in every sweep means "better"
        is always quantified before spend.**
      - **Verify before you trust** — claim-level entailment checking turned
        "the answers look grounded" into a measured 18→14 unsupported-claim
        delta.

      Everything ships as working code with `reports/metrics.json`,
      `reports/question_traces.json` and the rendered `reports/report.html`;
      rationale in `DESIGN.md`, reproduction steps in `README.md`.

      **Business implication:** the same discipline ports to a client dataset
      in days, not months — bounded scope, measured baselines, and a plain
      list of what we do not yet know, delivered as working code.

