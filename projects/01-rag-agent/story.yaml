- id: conclusions
  text_md: "Limits first — caveats a client should hear before reuse:\n\n- **Judge noise is real at n=30** — faithfulness moved 0.651→0.606\n  across runs; small deltas are directional; the wide CIs say so.\n- **Repair quality at local-model scale is weak** — the levers are\n  claim removal and abstention, not fluent rewriting; a stronger\n  judge may help.\n- **The HPO grid is small and the corpus homogeneous** — BGE-small\n  tying MiniLM is evidence about *this* scale, not a universal claim;\n  the same harness will show it on noisier corpora.\n- **Corpus coverage is bounded by the dump** — famous anchor titles\n  verified absent from `20231101.en`, and per-topic quotas saturate\n  with peripheral articles.\n\nLessons that transfer:\n\n- **Typed outputs that fail loudly beat prompt promises.**\n- **Evidence-only tool access makes grounding enforceable.**\n- **A seeded random floor quantifies \"better\" before spend.**\n- **Verify before you trust** — entailment checking turned \"looks\n\
    \  grounded\" into a measured 18→14 delta.\n\n**Results quality:** retrieval is strong (recall@5 0.831 vs 0.031\nrandom — the headline holds up). Generation grounding is\nacceptable-with-caveats — hosted faithfulness 0.685 [0.605, 0.760] is\nreal, but judge noise at n=30 makes small deltas directional and the\nverify loop repairs by removal and abstention, not rewriting. Weak\nspots are known and measured, not hidden.\n\nEverything ships as working code — `reports/metrics.json`,\n`reports/question_traces.json`, `reports/report.html`; see `DESIGN.md`\nand `README.md`.\n\n**Business implication:** The same discipline ports to a client dataset\nin days — bounded scope, measured baselines, a plain list of unknowns,\ndelivered as working code.\n"
