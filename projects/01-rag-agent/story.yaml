project_id: 01-rag-agent
short_version: "Cited question answering over 593 Wikipedia articles. Hybrid search finds a correct passage in the top five 94.6% of the time (recall@5 0.946). Final 120-question test: F1 0.9091, precision 0.952, one unsupported answer. The judge agreed with all 30 hand-labelled checks."
sections:
- id: background
  text_md: |
    **When every answer carries a citation, what can still go wrong?**
    A model can misread a source or stitch two facts into a false bridge. This assistant answers from `593` pinned Wikipedia pages, citing each claim or declining when proof fails.

    ```diagram 01-rag-pipeline
    ```

    Follow the pipeline in three steps:

    - **Hybrid search (`S3`):** Blend `FAISS` vectors and `BM25` keywords over titled chunks, rerank, and cap at `2` chunks per page.
    - **Draft & verify:** Run code span checks and verify each claim against full text, with at most `2` repairs.
    - **Outcome (`n = 120`):** `104` answered or refused correctly (`F1 0.9091`); `1` kept an unsupported claim. One model family wrote, checked and graded the answers; the set was read four times, so treat this as an upper bound.

    Next, we set the rules each answer must clear ([Objectives →](#sec-objectives)).

    **In plain terms:** The assistant answers only from checked Wikipedia passages and says "I don't know" when proof is missing, keeping unsupported answers down to 1 out of 120 questions.
  figures: []
- id: objectives
  text_md: |
    **Set four targets before any tuning begins.**
    An open-web chatbot sounds helpful even when it guesses. A citation-first product fails loudest when it sounds sure and is wrong. Instead of chasing fluent text, we locked down clear rules before writing a single prompt. Every question enters one strict pipeline: search the pinned corpus, verify each claim against full text, and refuse cleanly when proof runs out.

    ```diagram auto-01-rag-agent-1
    ```

    When search finds no match inside the 593 pages, a clear refusal counts as a win rather than a broken run. An open-web chat tool hates saying "I do not know." Here, honest abstention protects readers from invented trivia, while in-corpus answers face three tight gates.

    - At least `60%` of an answer's claims must pass full-text checks against their cited passages (`min_support = 0.6`). Weak claims get two bounded repair tries before they are dropped or trigger a clean refusal.
    - Search must put a gold passage in the top 5 at least `60%` of the time (`recall@5 >= 0.60`). On the final set, gold means the exact source chunk; on tuning sets, any passage from the right article counts.
    - Answer cost stays at or below `$0.01` per query by running search on CPU. Rather than buying a giant model that still guesses between passages, we spend budget on claim checks, with support for local models, hosted endpoints, and a `$0` offline test mode.

    The target table below tracks each up-front goal against our final test numbers; next, we trace how the corpus and test splits were built ([Data →](#sec-data)).

    | Target | Threshold | Final test result |
    |---|---|---|
    | Retrieval recall@5 (92 answerable) | >= 0.60 | **0.9457** |
    | Unanswerable refusals | high recall | **24 / 28** |
    | Answer-path cost (agent + verify) | <= $0.01 / query | **$0.0084 / query** |
    | Unsupported answers | none stated | **1 / 120** |
    | Answer latency (p50 / p95, n = 120) | bounded | **16.5 s / 40.5 s** |

    **In plain terms:** The rules put checked sources and honest "I don't know" replies ahead of smooth guessing, while keeping search accurate and cost under 1 cent per question.
  figures: []
- id: data
  text_md: |
    **A small, pinned corpus makes each claim checkable.**
    Indexing all of Wikipedia turns verification into a slow, open-ended search problem. Freezing a compact slice lets us trace every score back to the exact same bytes, both today and on any future run. This section walks through how the 593 articles and three question splits were selected, capped, and locked against silent drift.

    ```diagram auto-01-rag-agent-2
    ```

    `DVC` tracks each build step from raw Wikipedia dump scan to chunk index, while snapshot dates and licenses sit in the [data registry](https://amm-ds.github.io/portfolio/data-registry/wikipedia/). Articles span five contrasting subjects: `Climate`, `Renewable energy`, `Aviation`, `Machine learning`, and `Photosynthesis` (up to `120` pages per topic plus required anchor titles).

    - Cutting pages at `12,000` characters fits each one into a single prompt window. That bounds search memory and prompt cost while preserving a long tail of rich flagship entries.
    - Empty or oversized files fail loudly before indexing. `SHA-256` hashes lock corpus files and question splits so any changed byte forces a clean rebuild rather than shifting a metric quietly.
    - A local model drafted the `120` final questions straight from ground-truth corpus chunks (one chunk per single-hop question, two per multi-hop). Meanwhile, the `28` unanswerable questions ask about off-topic subjects such as Charon's orbit to test clear boundary refusals.

    The question-set table below logs each split's size, role, and read count before we audit topic balance and page lengths in [EDA →](#sec-eda).

    | Question set | Size (single / multi / abstain) | Role | Reads |
    |---|---:|---|---|
    | Tuning set | 65 (44 / 11 / 10) | Search & prompt tuning | Multiple |
    | Earlier gate set | 55 (32 / 10 / 13) | Early end-to-end gate | Consumed (1) |
    | Final test set (final_v3) | 120 (68 / 24 / 28) | Headline retrieval & final run | Consumed (4) |

    **In plain terms:** Freezing 593 Wikipedia articles and testing a mix of simple, multi-page, and unanswerable questions ensures every run is judged on the exact same text.
  figures: []
- id: eda
  text_md: |
    **Topics sit in a tight band; page lengths do not.**
    Before tuning search parameters, we audit the indexed slice directly. A high average recall can easily mask one weak topic or hide missing flagship pages that test questions expect by name. Checking counts and length cutoffs up front ensures our headline averages reflect real domain coverage rather than dataset quirks.

    Because the raw Wikipedia export is not sorted by topic, taking top-N pages in file order would pack the slice with unrelated early entries. We matched each topic explicitly and checked every resulting title against the slice.

    - All five subjects hold between `102` and `125` indexed pages. That tight spread forces search to handle science, clean energy, flight, and machine learning terms alike.
    - Word counts form a long tail that stops sharply at the `12,000`-character cutoff. That hard edge reflects our curation cap, not natural article lengths on the web.
    - Several expected flagship titles were missing from the first automated scan. Checking anchor titles and test questions straight against the `593`-page corpus prevented scoring questions on pages that were never indexed.

    The corpus table and `eda_corpus_composition` chart below confirm even topic counts and bounded lengths across all `593` pages, setting a clean base for search tuning ([Training →](#sec-training)).

    | Corpus stat | Measured value |
    |---|---|
    | Total indexed pages | 593 |
    | Pages per topic | 102–125 |
    | Maximum page length | 12,000 characters |

    **In plain terms:** Checking the 593 pages first confirmed that all five topics are evenly represented and every page fits within a safe reading length.
  figures: [eda_corpus_composition]
- id: training
  text_md: |
    **Better ranking discipline, not a bigger model, lifted multi-hop search.**
    Simple one-fact questions often match a single dense vector cleanly. Multi-hop questions break down when exact names get diluted or one long page fills all top slots. Below we trace how our hybrid retriever (`S3`) solves those failure modes in four CPU steps, and what earlier tuning sweeps ruled out.

    Each layer of the retriever exists because a real test failure exposed a gap in plain vector search.

    - **Title-anchored chunks:** Adding the article title to each chunk keeps short passages anchored in their subject ("the first flight lasted 12 seconds" means little without the Wright Flyer title). This lifted `recall@5` from `0.9636` to `1.000` on the 65-question tuning split (`dev_v1` and `dev_40` already sat at `1.000`), and stayed because it adds almost zero overhead.
    - **Hybrid rank fusion:** Exact identifiers ("Boeing 737 MAX") favor BM25 word search, while paraphrased ideas ("wind turbine capacity factor") favor FAISS vectors. Blending both top-50 lists by reciprocal rank (`1 / (60 + rank)`) avoids learned weights that overfit small sets.
    - **Cross-encoder reranking (`6 × k`):** A cross-encoder rescores the top 18 fused items at serving (`30` during top-5 measurement) to sharpen rank order.
    - **Per-article diversity cap:** Limiting results to 2 chunks per page prevents one popular entry from crowding out the second source needed for multi-hop synthesis. On 92 answerable final rows, `recall@5` climbed from `0.9239` to `0.9457` (multi-hop `0.7917` to `0.8333`), and `all-articles@5` (requiring *all* gold pages in the top 5) led on all four dev splits.

    What tuning ruled out: 200-, 400-, and 800-token chunks tied at `0.831` `recall@5` on 65 tuning questions, so 200 tokens won by keeping top-3 prompts compact (`443` mean tokens vs `748` at top 5). Cross-encoder reranking lifted `MRR@5` from `0.718` to `0.808` across 975 candidates without raising recall, proving it buys rank order rather than new hits. Plain fusion without title prefixes or reranking trailed dense search (`0.533` vs `0.600`, n=15), and larger Qwen3 arms tied MiniLM at the 16-question ceiling, so CPU MiniLM stayed.

    ```python
    def search(self, query: str, top_k: int | None = None) -> list[Citation]:
        k = top_k or self.config.top_k
        n_candidates = min(len(self.chunks), k * self.config.rerank_multiplier)
        vector = self._embed_query(query)

        if self.config.fusion_rrf:
            pool = min(len(self.chunks), max(n_candidates, self.config.rrf_pool_size))
            _, dense_ids = self.index.search(vector, pool)
            dense = [self.chunks[int(i)].chunk_id for i in dense_ids[0] if int(i) >= 0]
            bm25 = self._bm25_index().ranking(query)[:pool]
            fused = reciprocal_rank_fusion([dense, bm25], k=60)
            candidates = [self._by_id[cid] for cid in fused[:n_candidates] if cid in self._by_id]
        else:
            _, ids = self.index.search(vector, n_candidates)
            candidates = [self.chunks[int(i)] for i in ids[0] if int(i) >= 0]

        if self.rerank_fn is not None and len(candidates) > k:
            scores = np.asarray(
                self.rerank_fn(query, [c.text for c in candidates]), dtype=np.float32
            )
            order = np.argsort(-scores)
            candidates = [candidates[int(i)] for i in order]

        if self.config.max_per_article and self.config.max_per_article > 0:
            candidates = self._cap_per_article(candidates, k)

        return [self._to_citation(c) for c in candidates[:k]]
    ```

    Excerpt from [index.py](https://github.com/amm-ds/portfolio/blob/main/projects/01-rag-agent/src/rag_agent/index.py). Below, `retrieval_ladder` charts the baseline-to-hybrid tournament with Wilson 95% whiskers while `chunk_size_sweep` and `model_comparison` show the earlier tuning runs; next, we examine how final answers are judged ([Evaluation →](#sec-evaluation)).

    **In plain terms:** Adding page titles to each passage, combining keyword and meaning search, re-sorting top hits, and limiting results per page lifted search accuracy to 95% on a normal CPU.
  figures: [retrieval_ladder, chunk_size_sweep, model_comparison]
- id: evaluation
  text_md: |
    **A score earns trust only when you can inspect the text behind it.**
    One high accuracy figure can hide a weak judge or a runaway tool loop that burns budget. Before trusting any headline metric, we stack naive search baselines, code-level span checks, calibrated judges, and hard loop caps so every outcome is easy to audit.

    ```diagram auto-01-rag-agent-3
    ```

    The diagram traces how retrieval floors feed three grading layers inside a strict call and token budget.

    - Search scores anchor on seeded random (`0.031` recall@5) and word-match baselines (`0.677` on tuning). Measuring above chance floors shows real gain over basic rules.
    - Before an LLM judge runs, deterministic code checks verify quoted substrings, numbers, dates, months, and negation words. They logged zero false rejections on the final pass.
    - Our first judge failed openly on the 194-claim tuning set (`Q3a`), missing `86 of 194` claims (`39.7%` hosted miss rate, `kappa 0.605`; `44.3%` local miss rate, `kappa 0.546`). We rebuilt calibration (`judge_v2`) with 72 subtle one-detail swaps out of 147 claims.
    - The author then hand-checked 30 claims blind to model tags (11 supported, 19 unsupported). Seven items were re-checked against the cited passage text and corrected, hitting `30/30` (`Wilson 95% [0.8865, 1.0]`, well over `0.85`).
    - Hard loop rails (12 requests, 16 tool calls, 200k input tokens, plus an in-tool ceiling) block runaway searches. Verification abstained twice and skipped 33 claim-free outputs such as refusals.

    **How clean are the test set and judge?** The `30`-claim blind hand check is complete (`30/30`), yet full end-to-end independence is still open. One model (`kimi-for-coding`) drafted, verified, and graded the `120`-question run, and `final_v3` was read four times (`R0`, `S3` gate, held-out check, and final run). Treat these scores as an upper estimate until a second model family grades a fresh `final_v4` split ([Results →](#sec-results)).

    | Check | Role | Model | Audit status |
    |---|---|---|---|
    | Claim verifier | Passage support (>= 0.6 answer floor) | kimi-for-coding | 30/30 hand-labelled (blind to model labels) |
    | Rubric judge | Answer vs. abstain failure class | kimi-for-coding | Calibrated on judge_v2 |
    | RAGAS suite | Faithfulness & answer relevance | kimi-for-coding | Library v0.3.1 (tuning pass) |

    **In plain terms:** Every answer is checked against simple baselines, exact text rules, and a human-audited verifier (30 out of 30 matched), while openly noting that one model family handled both writing and grading.
  figures: []
- id: results
  text_md: |
    **104 of 120 questions answered or refused cleanly; 1 answer kept an unsupported claim.**
    On the final 120-question pass, coupling hybrid search with bounded verification pushes precision to `0.9524` and overall accuracy to `86.7%` (`Wilson 95% [0.7944, 0.9162]`). Across 92 answerable questions, faithfulness reaches `0.8717 [0.8092, 0.9304]`, with every trace committed under `reports/final_v3_e2e/`.

    ```diagram auto-01-rag-agent-4
    ```

    Follow one real traced question from start to end to see the loop in action. For *"Which company acquired LM Wind Power in April 2017 for €1.5 billion?"*, search ranks the gold chunk first (`top_rank 1`), the draft cites it, and the verifier accepts its claim unchanged. The final answer *"GE Renewable Energy"* ships at `faithfulness 1.0` with zero retries (`question_traces_heldout.json`).

    - **Most misses were silence, not false claims:** `14` of `16` misses came from saying too little (`10` empty answers to answerable questions and `4` refusals forced by the tool budget); `1` was a search miss and `1` an unsupported claim (`2 of 150` judged claims before drops or repairs).
    - **Slice balance holds:** Single-hop (`60/68`), multi-hop (`20/24`), and unanswerable (`24/28`, refusal accuracy `0.8571`) questions all hold steady. Top-5 search covered `88.6%` of exact gold chunks and `93.5%` of key articles (`cite_when_expected 90.2%`).
    - **Claim verification funnel:** Out of `166` drafted claims, `16` failed code checks and `150` reached the judge (`148` passed first check). Then `15` repair calls saved `11` more and `7` dropped, retaining `95.8%` (`159` surviving claims at `0.9739` mean support).
    - **Cost and speed:** Claim checks add `6.2 s` (`31%` of answer latency). Cached reads (`74%`) kept answer cost at `$1.014` (`$0.781` agent + `$0.233` verify = `$0.0084/query`, under `$0.01`); judging raised total spend to `$1.458` (`$0.0121/query`), at `p50 16.5 s` and `p95 40.5 s`.

    The headline table and three charts below (`final_outcome`, `failure_taxonomy`, `verify_funnel`) trace every verdict and claim step before we summarize lessons learned ([Conclusions →](#sec-conclusions)).

    | Final pass metric (final_v3, n = 120) | Value |
    |---|---:|
    | F1 / Precision / Recall | **0.9091** / 0.9524 / 0.8696 |
    | Overall accuracy (Wilson 95% CI) | **0.8667** [0.7944, 0.9162] |
    | Faithfulness (n = 92 answerable, 95% CI) | **0.8717** [0.8092, 0.9304] |
    | Retrieval recall@5 (n = 92 answerable) | **0.9457** (vs 0.9239 baseline) |
    | Outcomes (correct / empty / budget / unsupported / miss) | **104 / 10 / 4 / 1 / 1** |
    | Answer-path cost / Total with judge | **$0.0084** / **$0.0121** per query |

    **In plain terms:** Checking every claim kept unsupported answers to 1 in 120 at under 1 cent per question; the main trade-off is being overly cautious and skipping 10 answerable questions.
  figures: [final_outcome, failure_taxonomy, verify_funnel]
- id: conclusions
  text_md: |
    ## What the experiment taught

    Grounding failures rarely come from one weak prompt; they emerge when search blind spots, silent schema bugs, and uncalibrated checks compound. Stepped isolation across retrieval, verification, and loop rails turned a noisy prototype into an auditable pipeline, leaving four clear lessons for similar systems.

    - **Schema bugs can look like reasoning failures:** Before grounding hardening, our citation mandate made an honest refusal invalid output, causing unanswerable questions to loop until the token cap (~33M tokens in one stress run). Making "no answer" a valid schema output fixed all six unanswerable stress rows cleanly.
    - **Reranking buys order, not missing facts:** On tuning runs, cross-encoder reranking lifted `MRR@5` from `0.718` to `0.808` at constant recall; fixing missed multi-hop articles required title-anchored chunks, BM25+FAISS fusion, and a 2-chunk page cap.
    - **Budget rails turned four refusals into errors:** Tool-budget stops accounted for all four false positives, showing that abstention logic needs an explicit early-exit path before hitting hard loop limits.
    - **The measurement contract is the reusable artifact:** Deterministic floors, pre-set gates, resumable traces, and token meters transfer cleanly to any new domain.

    ## Limits

    - The 120-question final set (`final_v3`) was read four times and is now consumed; a fresh sealed set (`final_v4`) is required before claiming further gains.
    - Answers, claim checks, and grading all used `kimi-for-coding`, partially mitigated by the 30-claim blind hand check but still awaiting a cross-model judge.
    - Against dense-only retrieval (R0) the hybrid lifts recall@5 `0.924` → `0.946` on the same set; no end-to-end F1 for R0 is committed, so the F1 gain from hybrid search is not measured.
    - Against dense-only retrieval (`R0`) the hybrid lifts recall@5 `0.924` → `0.946` on the same set; no end-to-end F1 for `R0` is committed, so the F1 gain from hybrid search is not measured.
    - Results cover 593 capped Wikipedia articles and off-topic unanswerables, not noisy enterprise corpora or near-miss unanswerable traps.

    Below, `final_outcome` summarizes the 120-question confusion matrix and slice totals beside the full historical appendix; see the [full evaluation report](https://amm-ds.github.io/portfolio/projects/01-rag-agent/) for supporting artifacts.

    ## Exact numbers

    Shipped `S3` + verify final pass (`final_v3`, `n = 120`, `reports/final_v3_e2e/`): `F1 0.9091`, precision `0.9524`, recall `0.8696`, accuracy `86.7% [0.7944, 0.9162]`, faithfulness `0.8717 [0.8092, 0.9304]`, `recall@5 0.9457`, answer-path cost `$0.0084/query`, `1/120` unsupported.

    Tuning-pass retrieval configurations (65 tuning questions, `reports/metrics.json`):

    | Retrieval configuration | recall@5 | recall@10 | MRR@5 |
    |---|---|---|---|
    | MiniLM, 200-token chunks | **0.831** | 0.846 | **0.808** |
    | lexical word match (baseline) | 0.677 | 0.754 | 0.500 |
    | seeded random (chance floor) | 0.031 | 0.046 | 0.018 |

    Tuning-pass generation comparison (65 tuning questions, `reports/metrics.json`):

    | Generation metric | Incumbent | Selected `kimi-for-coding` |
    |---|---:|---:|
    | rubric faithfulness | 0.5504 | **0.6209** |
    | rubric answer relevance | 0.5573 | **0.6458** |
    | rubric context recall | 0.9636 | 0.9636 |
    | RAGAS faithfulness | — | **0.7337 [0.6562, 0.8131]** |
    | RAGAS answer relevancy | 0.8775 | **0.8602** |
    | RAGAS context precision / recall | — | 0.7609 / 0.9826 |

    Earlier stress and held-out passes (before final S3 + loop hardening):

    | Pass | Correct | Details / Cause |
    |---|---:|---|
    | Tuning (`65q`) | 46 / 65 | 17 unsupported, 2 retrieval-miss (`p50 25.9 s`, `$0.000906/q` gen) |
    | Early sealed (`55q`) | 44 / 55 | 9 unsupported, `12/13` refusals (`0.80 [0.69, 0.89]`, `$1.95`) |
    | Stress orig (`30q`) | 16 / 30 | `0.53 [0.37, 0.70]`, 11 unsupported, `6/10` refusals |
    | Stress re-run (`30q`) | 22 / 30 | `0.733 [0.567, 0.867]`, 5 unsupported, `p50 23.0 s` |
    | Set B (`30q`) | 19 / 30 | `0.633 [0.467, 0.80]`, 9 unsupported (missed 2 of 5 gates) |
    | Set C (`30q`) | 10 / 30 | 20 empty due to verifier batch crash (`27` verifier errors) |
    | Set D (`30q`) | 17 / 30 | 9 unsupported (infrastructure check) |

    ## Measured alternatives

    - **Hybrid S3 vs Dense R0 (`final_v3`, n=92):** `recall@5` rose `0.9239 -> 0.9457`; `multi-hop recall@5` rose `0.7917 -> 0.8333`; `all-articles@5` reached `0.8804`.
    - **`fusion_arm_comparison` (rerank off):** Dense and RRF tied at `0.831` on 65 tuning questions; on the 15-question raw test, RRF trailed dense (`0.533` vs `0.600`), proving fusion alone needed title chunks and reranking.

    ## Protocol

    - Floors: seeded random and lexical word-match search per configuration.
    - Judges: rubric taxonomy, RAGAS `0.3.1`, and per-claim verification (`0.6` answer floor, `<= 2` repairs).
    - Cost: public rate card estimates at `$1.00/Mtok` input, `$4.00/Mtok` output, `30%` cached reads (`kimi-k2.8-preview` proxy).

    **In plain terms:** Combining better search, claim checking, and strict safety limits answered or refused 104 of 120 questions cleanly with only 1 unsupported answer; next steps are cutting unnecessary refusals and confirming results with a second AI judge on brand-new questions.
  figures: [final_outcome]
key_concepts:
  - "**Seeded floors:** Random and word-match rankings anchor every headline, so a score cannot merely restate how easy the task is."
  - "**Sealed held-out set:** A fresh question set must be written after tuning freezes and scored once to prevent overfit (`final_v3` was read four times and is now consumed)."
  - "**Answer support floor:** At least `60%` of an answer's claims (`min_support = 0.6`) must pass verification against their cited passages; otherwise claims are repaired at most twice, dropped, or the answer abstains."
  - "**Three separate judges:** Rubric taxonomy, RAGAS, and per-claim verification catch different failures; no single score represents answer quality."
  - "**Cloud-equivalent cost metering:** A public rate card turns token use into estimated dollars under a hard budget cap."
  - "**Verification bounds harm; it does not eliminate risk:** Grounding checks cut unsupported answers dramatically, yet single-family judging and empty-answer abstentions remain open limits."
