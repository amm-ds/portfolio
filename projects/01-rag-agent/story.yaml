project_id: 01-rag-agent
short_version: "Grounding-hardened cited QA over 593 Wikipedia articles. S3 hybrid retrieval reaches 0.946 recall@5. Judge sample: 30/30 owner-labelled. Final 120-question pass: F1 0.909, precision 0.952, faithfulness 0.872, 1/120 unsupported."
sections:
- id: background
  text_md: |
    **When every answer carries a citation, what can still go wrong?**
    A footnote looks reassuring, yet a language model can misread a passage or stitch two unrelated facts into a false bridge. This assistant answers strictly from 593 pinned Wikipedia articles, attaching a passage citation to each claim or declining when evidence falls short.

    ```diagram 01-rag-pipeline
    ```

    The pipeline pairs CPU hybrid search with a bounded check-and-repair loop before any text leaves the system.

    - Across 120 test questions, 104 finish cleanly (`F1 0.9091`, balancing precision and recall), and only 1 answer retains an unsupported claim.
    - One model family drafted, verified, and graded the answers, and the final question set was read four times during development, so these scores act as an upper estimate rather than broad-corpus proof.

    **In plain terms:** The assistant answers from checked passages or refuses honestly, holding unsupported answers to 1 in 120 on a fixed slice.
  figures: []
- id: objectives
  text_md: |
    **Set four targets before any tuning begins.**
    An open-web chatbot sounds helpful even when it guesses. A citation-first tool fails loudest when it sounds sure and is wrong. We set one clear rule up front: refuse outside the slice and check every claim before sending text.

    ```diagram auto-01-rag-agent-1
    ```

    When search finds no proof in the 593 pages, a clear refusal counts as a right answer rather than an error. In-corpus answers must pass a strict claim check inside fixed cost rails.

    - At least `60%` of an answer's claims must pass full-text checks against their cited passages (`min_support = 0.6`). Weak claims get two repair tries before removal or abstention.
    - Search must put a gold passage in the top 5 at least `60%` of the time (`recall@5 >= 0.60`). On the final set, gold means the exact source chunk; on tuning sets, any passage from the right page counts.
    - Keep answer cost at or below `$0.01` per query by running search on CPU. We spend the budget on claim checks instead of a larger model, supporting local models, hosted keys, and a `$0` offline mode.

    | Target | Threshold | Final test result |
    |---|---|---|
    | Retrieval `recall@5` (92 answerable) | >= 0.60 | **0.9457** |
    | Unanswerable refusals | high recall | **24 / 28** |
    | Answer-path cost (agent + verify) | <= $0.01 / query | **$0.0084 / query** |
    | Unsupported answers | none stated | **1 / 120** |
    | Answer latency (`p50` / `p95`, n = 120) | bounded | **16.5 s / 40.5 s** |

    **In plain terms:** The contract puts verifiable citations and honest refusals ahead of fluent guessing, clearing both its search and `$0.01` cost goals.
  figures: []
- id: data
  text_md: |
    **A small, pinned corpus makes each claim checkable.**
    Indexing all of Wikipedia turns checking into a slow, open-ended task. Freezing a compact slice lets us trace every score back to the exact same bytes, today and on any future run.

    ```diagram auto-01-rag-agent-2
    ```

    DVC tracks each build step from raw scan to index. Dates and licenses live in the [data registry](https://amm-ds.github.io/portfolio/data-registry/wikipedia/). The 593 pages cover five topics: Climate, Renewable energy, Aviation, Machine learning, and Photosynthesis (up to 120 pages per topic plus key anchor titles).

    - Cutting pages at 12,000 characters keeps each one inside a single prompt window. It caps search memory while keeping a long tail of rich flagship pages.
    - Empty or huge files fail before indexing. SHA-256 hashes lock corpus files and question sets so any changed byte forces a clean rebuild.
    - A local model wrote the 120 final questions from gold corpus chunks (one chunk per single-hop question, two per multi-hop). The 28 unanswerable questions ask about off-topic subjects like Charon's orbit to test clear refusal rules.

    | Question set | Size (single / multi / abstain) | Role | Reads |
    |---|---:|---|---|
    | Tuning set | 65 (44 / 11 / 10) | Search & prompt tuning | Multiple |
    | Earlier gate set | 55 (32 / 10 / 13) | Early end-to-end gate | Consumed (1) |
    | Final test set (`final_v3`) | 120 (68 / 24 / 28) | Headline retrieval & final run | Consumed (4) |

    **In plain terms:** Pinning 593 articles and a three-way question mix ensures retrieval, synthesis, and refusals are measured on identical underlying text.
  figures: []
- id: eda
  text_md: |
    **Topics sit in a tight band; page lengths do not.**
    Before tuning search, we check the indexed slice. A high average score could hide one weak topic or a missing anchor page. The raw Wikipedia dump is not sorted by topic, so taking the first pages in file order would skew the set.

    - All five subjects hold between 102 and 125 pages. Search must work well across science, energy, flight, and AI terms alike.
    - Page lengths form a long tail that stops at 12,000 characters. That sharp edge comes from our size cap, not from the web pages themselves.
    - Some expected flagship titles were missing from the first scan. We checked every anchor title and test question straight against the indexed pages instead of trusting quotas.

    | Corpus stat | Measured value |
    |---|---|
    | Total indexed pages | 593 |
    | Pages per topic | 102–125 |
    | Maximum page length | 12,000 characters |

    **In plain terms:** Checking the corpus early confirmed balanced topic counts and bounded page lengths across all 593 articles before training began.
  figures: [eda_corpus_composition]
- id: training
  text_md: |
    **Better ranking discipline, not a bigger model, lifted multi-hop search.**
    Simple factual questions often match one semantic embedding cleanly. Multi-hop questions fail unless exact identifiers, page titles, and source diversity work together in the top results. Our promoted hybrid retriever (`S3`) builds that discipline in four CPU stages, each added after a measured miss.

    - **Title-anchored chunks:** Prefixing each chunk with its article title keeps short passages grounded in their subject ("the first flight lasted 12 seconds" needs the Wright Flyer title). This lifted `recall@5` from `0.9636` to `1.000` on the 65-question tuning split (`dev_v1` and `dev_40` were already tied at `1.000`), and stayed because it costs almost nothing.
    - **Hybrid rank fusion:** Exact names ("Boeing 737 MAX") favor BM25 word search, whereas paraphrases ("wind turbine capacity factor") favor FAISS vector similarity. Merging both top-50 rankings via reciprocal rank fusion (`1 / (60 + rank)`) avoids learned weights that could overfit small splits.
    - **Cross-encoder reranking (`6 × k`):** A cross-encoder rescores the top 18 candidates at serving (`30` during top-5 evaluation) for fine-grained relevance.
    - **Per-article diversity cap:** Limiting the top results to 2 chunks per page prevents one dominant article from crowding out the second source needed for multi-hop answers. On the 92 answerable final questions, `recall@5` rose from `0.9239` to `0.9457` (multi-hop `0.7917` to `0.8333`), while `all-articles@5` (requiring *all* gold articles for a multi-hop query in the top 5) led the baseline on all four development splits.

    What tuning ruled out: on 65 tuning questions, 200-, 400-, and 800-token chunks tied at `0.831` `recall@5`, so 200 tokens won on prompt size (`443` mean tokens served at top 3 vs `748` at top 5). Reranking there raised `MRR@5` from `0.718` to `0.808` across 975 candidates narrowed to 195 passages without raising recall (buying rank order, not new hits). Plain fusion without title prefixes or reranking trailed dense search on a 15-question raw test (`0.533` vs `0.600`), and larger Qwen3 models tied MiniLM at the 16-question ceiling, so CPU MiniLM stayed.

    ```python
    def search(self, query: str, top_k: int | None = None) -> list[Citation]:
        k = top_k or self.config.top_k
        n_candidates = min(len(self.chunks), k * self.config.rerank_multiplier)
        vector = self._embed_query(query)

        if self.config.fusion_rrf:
            pool = min(len(self.chunks), max(n_candidates, self.config.rrf_pool_size))
            _, dense_ids = self.index.search(vector, pool)
            dense = [self.chunks[int(i)].chunk_id for i in dense_ids[0] if int(i) >= 0]
            bm25 = self._bm25_index().ranking(query)[:pool]
            fused = reciprocal_rank_fusion([dense, bm25], k=60)
            candidates = [self._by_id[cid] for cid in fused[:n_candidates] if cid in self._by_id]
        else:
            _, ids = self.index.search(vector, n_candidates)
            candidates = [self.chunks[int(i)] for i in ids[0] if int(i) >= 0]

        if self.rerank_fn is not None and len(candidates) > k:
            scores = np.asarray(
                self.rerank_fn(query, [c.text for c in candidates]), dtype=np.float32
            )
            order = np.argsort(-scores)
            candidates = [candidates[int(i)] for i in order]

        if self.config.max_per_article and self.config.max_per_article > 0:
            candidates = self._cap_per_article(candidates, k)

        return [self._to_citation(c) for c in candidates[:k]]
    ```

    Excerpt from [index.py](https://github.com/amm-ds/portfolio/blob/main/projects/01-rag-agent/src/rag_agent/index.py). `retrieval_ladder` plots the baseline-to-hybrid tournament with Wilson 95% whiskers; `chunk_size_sweep` and `model_comparison` capture the earlier tuning diagnostics.

    **In plain terms:** Prefixing titles, blending keyword and vector search, reranking, and capping chunks per page lifted final recall to 94.6% on CPU.
  figures: [retrieval_ladder, chunk_size_sweep, model_comparison]
- id: evaluation
  text_md: |
    **A score earns trust only when you can inspect the text behind it.**
    One high score can hide a weak judge or a runaway tool loop. Our test setup layers simple baselines, code checks, three judges, and hard loop caps.

    ```diagram auto-01-rag-agent-3
    ```

    - Search scores anchor on seeded random (`0.031` recall@5) and word-match baselines (`0.677` on tuning). This proves real gain over basic rules.
    - Before any LLM judge runs, code checks match quoted spans, numbers, dates, months, and negation words. They logged zero false drops on the final pass.
    - Our first judge failed openly on the 194-claim tuning set (`Q3a`). It missed `86 of 194` claims (`39.7%` hosted miss rate, `kappa 0.605`; `44.3%` local miss rate, `kappa 0.546`), so we replaced it with `judge_v2` (147 claims, including 72 near-miss swaps).
    - The owner then hand-checked 30 claims blind to the model's tags (11 supported, 19 unsupported). Seven items were reconciled against chunk text with the reviewer audit, hitting `30/30` (`Wilson 95% [0.8865, 1.0]`, over the `0.85` gate).
    - Hard loop caps (12 calls, 16 tool steps, 200k input tokens, plus an in-tool limit) stop runaway search. Checks abstained twice and skipped 33 outputs that had no claims (such as refusals).

    **How clean are the test set and judge?** Not fully independent. One model (`kimi-for-coding`) wrote, checked, and graded the answers. Also, `final_v3` was read four times (`R0`, `S3` gate, held-out check, and final run), so these numbers are an upper bound awaiting a fresh set and cross-model judge.

    | Check | Role | Model | Audit status |
    |---|---|---|---|
    | Claim verifier | Passage support (`>= 0.6` answer floor) | `kimi-for-coding` | 30/30 owner-labelled (blind to model labels) |
    | Rubric judge | Answer vs. abstain failure class | `kimi-for-coding` | Calibrated on `judge_v2` |
    | RAGAS suite | Faithfulness & answer relevance | `kimi-for-coding` | Library v0.3.1 (tuning pass) |

    **In plain terms:** Every output is anchored against search baselines, deterministic span checks, and a 30/30 owner-audited verifier, with single-family judging and four-time test reuse openly disclosed.
  figures: []
- id: results
  text_md: |
    **104 of 120 questions answered or refused cleanly; 1 answer kept an unsupported claim.**
    On the final 120-question run, hybrid search and claim checks reach `0.9524` precision and `86.7%` accuracy (`Wilson 95% [0.7944, 0.9162]`). Faithfulness reaches `0.8717 [0.8092, 0.9304]` across 92 answerable questions. Full traces sit in `reports/final_v3_e2e/`.

    ```diagram auto-01-rag-agent-4
    ```

    Follow one traced question from start to end. For *"Which company acquired LM Wind Power in April 2017 for €1.5 billion?"*, search puts the gold chunk first (`top_rank 1`), the draft cites it, and the verifier passes its claim unchanged. The answer *"GE Renewable Energy"* ships at `faithfulness 1.0` with zero retries (`question_traces_heldout.json`).

    - **Over-caution replaced false claims as the top failure:** Fourteen of 16 misses came from saying too little (`10` empty answers on answerable rows, or `11/92` missed with 1 search miss, plus `4` budget-stop refusals that count as false positives). Only `1 of 120` answers kept an unsupported claim (`2 of 150` judged claims before drops or repairs).
    - **Slice balance holds:** Single-hop (`60/68`), multi-hop (`20/24`), and unanswerable (`24/28`, refusal rate `0.8571`) questions all hold steady. Top-5 search covered `88.6%` of exact gold chunks and `93.5%` of key articles (`cite_when_expected 90.2%`).
    - **Claim funnel:** Out of `166` drafted claims, `16` failed code checks and `150` went to the judge (`148` passed). Then `15` repair calls saved `11` more and `7` were dropped, keeping `95.8%` (`159` claims at `0.9739` mean support).
    - **Cost and speed:** Claim checks add `6.2 s` (`31%` of answer time). Cached reads (`74%`) kept answer cost to `$1.014` (`$0.781` agent + `$0.233` verify = `$0.0084/query`, under `$0.01`). Adding judging raised total spend to `$1.458` (`$0.0121/query`), at `p50 16.5 s` and `p95 40.5 s`.

    | Final pass metric (`final_v3`, n = 120) | Value |
    |---|---:|
    | F1 / Precision / Recall | **0.9091** / 0.9524 / 0.8696 |
    | Overall accuracy (Wilson 95% CI) | **0.8667** `[0.7944, 0.9162]` |
    | Faithfulness (n = 92 answerable, 95% CI) | **0.8717** `[0.8092, 0.9304]` |
    | Retrieval `recall@5` (n = 92 answerable) | **0.9457** (vs 0.9239 baseline) |
    | Outcomes (correct / empty / budget / unsupported / miss) | **104 / 10 / 4 / 1 / 1** |
    | Answer-path cost / Total with judge | **$0.0084** / **$0.0121** per query |

    **In plain terms:** Verification cut unsupported answers to 1 in 120 under `$0.01` per query; the remaining risk is over-abstention on 10 answerable questions.
  figures: [final_outcome, failure_taxonomy, verify_funnel]
- id: conclusions
  text_md: |
    ## What the experiment taught

    Grounding failures rarely come from one weak prompt; they come from retrieval blindness, silent schema bugs, and uncalibrated checks. Four concrete lessons carry forward from the committed runs:

    - **Schema bugs can look like reasoning failures:** Before grounding hardening, our citation mandate made an honest refusal invalid output, causing unanswerable questions to loop until the token cap (~33M tokens in one stress run). Making "no answer" a valid schema output fixed all six unanswerable stress rows cleanly.
    - **Reranking buys order, not missing facts:** On tuning runs, cross-encoder reranking lifted `MRR@5` from `0.718` to `0.808` at constant recall; fixing missed multi-hop articles required title-anchored chunks, BM25+FAISS fusion, and a 2-chunk page cap.
    - **Budget rails turned four refusals into errors:** Tool-budget stops accounted for all four false positives, showing that abstention logic needs an explicit early-exit path before hitting hard loop limits.
    - **The measurement contract is the reusable artifact:** Deterministic floors, pre-set gates, resumable traces, and token meters transfer cleanly to any new domain.

    ## Limits

    - The 120-question final set (`final_v3`) was read four times and is now consumed; a fresh sealed set (`final_v4`) is required before claiming further gains.
    - Answers, claim checks, and grading all used `kimi-for-coding`, partially mitigated by the 30-claim blind owner audit but still awaiting a cross-model judge.
    - Results cover 593 capped Wikipedia articles and off-topic unanswerables, not noisy enterprise corpora or near-miss unanswerable traps.

    ## Exact numbers

    Tuning-pass retrieval configurations (65 tuning questions, `reports/metrics.json`):

    | Retrieval configuration | recall@5 | recall@10 | MRR@5 |
    |---|---|---|---|
    | MiniLM, 200-token chunks | **0.831** | 0.846 | **0.808** |
    | lexical word match (baseline) | 0.677 | 0.754 | 0.500 |
    | seeded random (chance floor) | 0.031 | 0.046 | 0.018 |

    Tuning-pass generation comparison (65 tuning questions, `reports/metrics.json`):

    | Generation metric | Incumbent | Selected `kimi-for-coding` |
    |---|---:|---:|
    | rubric faithfulness | 0.5504 | **0.6209** |
    | rubric answer relevance | 0.5573 | **0.6458** |
    | rubric context recall | 0.9636 | 0.9636 |
    | RAGAS faithfulness | — | **0.7337 [0.6562, 0.8131]** |
    | RAGAS answer relevancy | 0.8775 | **0.8602** |
    | RAGAS context precision / recall | — | 0.7609 / 0.9826 |

    Earlier stress and held-out passes (before final S3 + loop hardening):

    | Pass | Correct | Details / Cause |
    |---|---:|---|
    | Tuning (`65q`) | 46 / 65 | 17 unsupported, 2 retrieval-miss (`p50 25.9 s`, `$0.000906/q` gen) |
    | Early sealed (`55q`) | 44 / 55 | 9 unsupported, `12/13` refusals (`0.80 [0.69, 0.89]`, `$1.95`) |
    | Stress orig (`30q`) | 16 / 30 | `0.53 [0.37, 0.70]`, 11 unsupported, `6/10` refusals |
    | Stress re-run (`30q`) | 22 / 30 | `0.733 [0.567, 0.867]`, 5 unsupported, `p50 23.0 s` |
    | Set B (`30q`) | 19 / 30 | `0.633 [0.467, 0.80]`, 9 unsupported (missed 2 of 5 gates) |
    | Set C (`30q`) | 10 / 30 | 20 empty due to verifier batch crash (`27` verifier errors) |
    | Set D (`30q`) | 17 / 30 | 9 unsupported (infrastructure check) |

    ## Measured alternatives

    - **Hybrid S3 vs Dense R0 (`final_v3`, n=92):** `recall@5` rose `0.9239 -> 0.9457`; `multi-hop recall@5` rose `0.7917 -> 0.8333`; `all-articles@5` reached `0.8804`.
    - **`fusion_arm_comparison` (rerank off):** Dense and RRF tied at `0.831` on 65 tuning questions; on the 15-question raw test, RRF trailed dense (`0.533` vs `0.600`), proving fusion alone needed title chunks and reranking.

    ## Protocol

    - Floors: seeded random and lexical word-match search per configuration.
    - Judges: rubric taxonomy, RAGAS `0.3.1`, and per-claim verification (`0.6` answer floor, `<= 2` repairs).
    - Cost: public rate card estimates at `$1.00/Mtok` input, `$4.00/Mtok` output, `30%` cached reads (`kimi-k2.8-preview` proxy).

    **In plain terms:** Hybrid S3 search, owner-audited verification, and bounded tool rails lift final F1 to 0.9091 with 1 unsupported answer in 120; cutting unnecessary refusals and running a cross-judge check on a fresh `final_v4` set come next. [Full evaluation report →](https://amm-ds.github.io/portfolio/projects/01-rag-agent/)
  figures: [final_outcome]
key_concepts:
  - "**Seeded floors:** Random and word-match rankings anchor every headline, so a score cannot merely restate how easy the task is."
  - "**Sealed held-out set:** A fresh question set must be written after tuning freezes and scored once to prevent overfit (`final_v3` was read four times and is now consumed)."
  - "**Answer support floor:** At least `60%` of an answer's claims (`min_support = 0.6`) must pass verification against their cited passages; otherwise claims are repaired at most twice, dropped, or the answer abstains."
  - "**Three separate judges:** Rubric taxonomy, RAGAS, and per-claim verification catch different failures; no single score represents answer quality."
  - "**Cloud-equivalent cost metering:** A public rate card turns token use into estimated dollars under a hard budget cap."
  - "**Verification bounds harm; it does not eliminate risk:** Grounding checks cut unsupported answers dramatically, yet single-family judging and empty-answer abstentions remain open limits."
