project_id: 01-rag-agent
sections:
  - id: background
    text_md: |
      LLM assistants fail silently in the way that matters most to a business:
      they sound confident while inventing facts. Retrieval-grounded design
      removes that failure mode by construction — the model can only speak from
      evidence it was shown, and every claim carries a citation a human can
      audit.

      The problems this design eliminates:

      - **Hallucination by omission** — the model answers from memory because
        nothing forces it to look anything up.
      - **Unverifiable confidence** — fluent answers with no way to check where
        they came from.
      - **Untestable quality** — demos that impress once, with no measurement
        behind the claim.

      This project builds such an assistant as a fully reproducible pipeline:
      a bounded, checksum-pinned slice of Wikipedia, a local embeddings index,
      and an agent whose only window into the corpus is two retrieval tools.
      No demo shortcuts: every quality claim below is measured on a graded
      question set.

      **Business implication:** you get an assistant whose answers can be
      audited claim by claim — the difference between "the AI said so" and
      "here is the exact passage it relied on".

  - id: objectives
    text_md: |
      Deliver a question-answering agent with three hard properties. First,
      **typed, validated output**: the model must return a structured
      `AnalysisResult` — summary, citations, confidence — and a schema-invalid
      response fails the run loudly instead of reaching a user. Second,
      **evidence grounding**: the agent's only corpus access is
      `search_documents` / `read_excerpt`; the system prompt forbids outside
      knowledge. Third, **operational SLOs**: retrieval recall ≥ 0.60 on the
      graded set, p95 latency ≤ 5 s end-to-end, and an estimated cost per query
      that a client can budget against (target ≤ $0.01).

      The provider fallback chain makes "works everywhere" explicit:

      ```mermaid
      flowchart LR
          Q[User question] --> A[Agent]
          A -->|LLM_BASE_URL + LLM_API_KEY set| L[OpenAI-compatible provider]
          A -->|no credentials| O[Local Ollama<br/>qwen3.6:35b-a3b-q4_K_M]
          L --> R[Structured AnalysisResult]
          O --> R
          A -->|no provider at all| E[Loud error + setup guidance]
      ```

      Retrieval runs CPU-only; the LLM runs on a local model by default — data
      never leaves the machine, the evaluation included — and `evaluate
      --offline` keeps a retrieval-only CI path without any provider.

      **Business implication:** answers come with citations a reviewer can
      check — trust is a feature, not a promise — and the SLOs are written
      down, so acceptance criteria exist before any demo.

  - id: data
    text_md: |
      The corpus is a topical slice of the English Wikipedia dump
      `20231101.en`, streamed from Hugging Face and bounded by construction:
      five diverse topics (Climate, Renewable energy, Aviation, Machine
      learning, Photosynthesis), at most 120 articles per topic, plus a small
      set of exact-title anchor articles collected outside the pattern quota.
      The result is 593 articles (≈3.5 MB of text).

      Data-quality gates (null rates, length ranges) halt the pipeline loudly
      on violation, and DVC tracks every artifact for reproducibility.

      **Datasets**

      - [Wikipedia (HF)](https://amm-ds.github.io/portfolio/data-registry/wikipedia/) —
        English Wikipedia snapshot `20231101.en`, streamed via
        `datasets` (config `20231101.en`). License: **CC BY-SA 3.0 / GFDL,
        attribution required**. This project uses a bounded 593-article topical
        corpus derived from it; the derived corpus ships with its own
        sha256-pinned dataset contract at `data/raw/dataset_contract.json`.
      - **Attribution:** article text is Wikipedia content, authored by the
        Wikipedia community and licensed CC BY-SA 3.0 / GFDL; selection,
        filtering and transformations are reproducible via `dvc repro` in the
        project directory.

      **Business implication:** the data has a license trail, a checksum and a
      snapshot date — the legal and reproducibility questions procurement
      always asks are answered in one file.

  - id: eda
    text_md: |
      The corpus composition figure shows what the bounded scan actually
      collected: near-symmetric topic coverage (≈102–125 articles each) and a
      right-skewed article-length distribution — most articles run 500–2,000
      words, with a long tail of large articles truncated at 12,000 characters
      to keep embedding cost predictable.

      One finding shaped the pipeline: the Wikipedia dump order is not topical,
      so naive pattern quotas fill on peripheral articles (journals, albums,
      lists) long before flagship pages appear in the stream — several famous
      titles (e.g. "Photosynthesis", "Renewable energy") are entirely absent
      from this dump. Exact-title anchors and eval questions were verified
      against the real corpus, not assumed.

      **Business implication:** we scoped the corpus by measuring what is
      actually in the data rather than assuming — the same habit that catches
      data-availability surprises before they become project risks.
    figures:
      - eda_corpus_composition

  - id: training
    text_md: |
      "Training" here is index construction, deliberately classical. Articles
      are split with a paragraph-aware recursive chunker (whole paragraphs
      first, then sentence boundaries, then word windows with overlap;
      max-chunk-size and exact-overlap guarantees are unit-tested) at three
      budgets — 200, 400 and 800 tokens — so the size trade-off can be measured
      rather than guessed.

      The retrieval pipeline the agent sees at query time:

      ```mermaid
      flowchart LR
          Q[Question] --> E[MiniLM embedding]
          E --> F[FAISS IndexFlatIP<br/>top 5 x k candidates]
          F --> C[Cross-encoder rerank<br/>ms-marco-MiniLM]
          C --> T[Top-k citations<br/>to the agent]
      ```

      Each chunk is embedded with `all-MiniLM-L6-v2` (L2-normalized, CPU) into
      a FAISS `IndexFlatIP` per chunk size; at query time the top 5x k embedding
      hits are re-scored by the `ms-marco-MiniLM-L-6-v2` cross-encoder. A
      rerank ablation shows what the reranker is for: without it recall@5 rises
      to 1.000 but MRR@5 falls to 0.833 — it puts the *right* passage at the
      top of the list, which is what a reading LLM actually consumes. The
      agent layer is provider-agnostic per ADR-0004 (amended wave 10): an
      env-configured OpenAI-compatible endpoint first, local Ollama second —
      one code path, no runtime mock.

      **Business implication:** the whole pipeline runs on commodity CPU — no
      GPU budget, no vendor lock-in, and one seam swaps the LLM provider
      without touching anything else.
    figures:
      - retrieval_funnel

  - id: evaluation
    text_md: |
      Quality is measured, not demoed. A graded set of 26 handcrafted questions
      (5–6 per topic) carries known relevant article ids; retrieval is scored
      with recall@k and MRR@5 over a **bounded HPO grid**: 3 chunk sizes x
      top_k in {3, 5, 8, 10}, an embedding-model arm (MiniLM vs BGE-small on
      the same chunk-200 structure), a rerank on/off ablation, and a **seeded
      uniform-random baseline** (`retrieval_random_chunks_{size}`) marking the
      floor any ranker must beat.

      The evaluation harness, end to end:

      ```mermaid
      flowchart LR
          Q[26 graded questions] --> R[Retrieval grid<br/>recall@k, MRR@5]
          Q --> A[Agent run<br/>local model, bounded subset]
          R --> B[Random baseline<br/>delta]
          A --> J[Rubric judge<br/>+ RAGAS metric set]
          R --> M[reports/metrics.json<br/>+ figures]
          J --> M
      ```

      The RAG layer is scored two ways: a rubric judge — the provider model by
      default, `JUDGE=keyword` for the deterministic platform judge — measuring
      answer faithfulness, answer relevance, and context recall; and, behind
      `evaluate --ragas`, the **RAGAS** metric set (faithfulness,
      answer_relevancy, context_precision, context_recall) with the local model
      as evaluator, so the full quality run costs $0 in API calls. Operations
      are measured too — per-query latency (p50/p95) and token usage persisted
      to `reports/cost_telemetry.json`. Local model inference is the
      bottleneck, so the documented real run bounds the LLM phases to the first
      10 graded questions (`--max-questions 10`); retrieval metrics always use
      the full set, and `evaluate --offline` is the CI-safe retrieval-only
      path.

      **Business implication:** the offline/keyword path means the quality
      harness still runs in CI without secrets or GPUs, while the real numbers
      come from a $0 local run — quality gates survive procurement either way.
    figures:
      - chunk_size_sweep
      - retrieval_hpo_frontier
    metrics_keys:
      - retrieval_chunks_200
      - retrieval_random_chunks_200
      - retrieval_model_minilm_chunks_200
      - retrieval_model_bge_small_chunks_200
      - retrieval_rerank_on_chunks_200
      - retrieval_rerank_off_chunks_200
      - rag_agent

  - id: results
    text_md: |
      **Retrieval configuration comparison** (26 graded questions, CPU-only;
      random baseline seeded):

      | Configuration | recall@5 | recall@10 | MRR@5 |
      |---|---|---|---|
      | chunks=200, top_k=10 | 0.962 | 1.000 | 0.936 |
      | chunks=400, top_k=10 | 0.962 | 1.000 | 0.904 |
      | chunks=800, top_k=10 | 0.962 | 1.000 | 0.869 |
      | chunks=200 + BGE-small (vs MiniLM) | 0.962 | 1.000 | 0.936 |
      | chunks=200, rerank OFF | 1.000 | 1.000 | 0.833 |
      | random baseline (seeded) | 0.038 | 0.385 | 0.038 |
      | **chosen: MiniLM, chunks=200, top_k=3, rerank ON** | **0.962** | — | **0.936** |

      **RAG quality — real run** (local `qwen3.6:35b-a3b-q4_K_M`, first 10
      graded questions, chosen config; retrieval metrics above use all 26):

      | Metric | Value | Tool |
      |---|---|---|
      | RAGAS faithfulness | **0.805** | `evaluate --ragas` |
      | RAGAS answer_relevancy | **0.904** | `evaluate --ragas` |
      | RAGAS context_recall | **0.952** | `evaluate --ragas` |
      | RAGAS context_precision | 0.333 | `evaluate --ragas` |
      | faithfulness (CI floor) | 0.36 | keyword judge, same subset |
      | answer relevance (CI floor) | 0.37 | keyword judge, same subset |
      | p50 / p95 per-query latency | **61 s / 245 s** | local model, honest |

      Key findings:

      - Embeddings beat random ranking by **+0.92 recall@5** — the system
        retrieves, it does not luck out.
      - Real grounding is real: RAGAS faithfulness **0.805** vs the keyword
        floor 0.36 on the same answers — cheap lexical overlap cannot see
        entailment; both judges stay in the harness, one for truth, one for CI.
      - RAGAS context_precision 0.333 is expected at top_k=3 with saturated
        recall: the list is wide enough to guarantee coverage, and putting the
        right passage first is the reranker's job (MRR@5 0.936).
      - Local inference costs **$0 in API calls** (cloud-equivalent ≈ $0.0043
        per query at the rate card) and pays in wall clock instead — p50 61 s
        per answer on this machine.

      **So what:** retrieval quality is bought with chunking discipline, not
      model size, and answer quality is verified, not assumed — with the
      numbers produced by the same local model a client can run unmodified.

      Delivered with this evaluation: a **client-corpus onboarding path**
      (`prepare-corpus --source client <jsonl-dir> --license <spdx>` reuses the
      whole pipeline on client documents), **cost telemetry**
      (`reports/cost_telemetry.json` — backend label, per-query tokens, wall
      time; $0 API for local inference), and an **LLM rubric judge** (provider
      model by default, keyword judge as the CI-offline floor, per-verdict
      fallback).

      **Business implication:** "better" was quantified against a random floor
      and two ablations before money was spent on a bigger model, and the
      faithfulness claim now rests on measured evidence rather than a demo —
      the tuning budget went to the knobs that actually mattered.
    figures:
      - model_comparison
      - retrieval_hpo_frontier
    metrics_keys:
      - retrieval_chunks_200
      - retrieval_random_chunks_200
      - retrieval_model_minilm_chunks_200
      - retrieval_rerank_on_chunks_200
      - rag_agent

  - id: conclusions
    text_md: |
      Honest limits:

      - Mock-mode faithfulness (0.273) is a floor, not a product metric: it
        reflects a canned answer, and the live-mode harness exists precisely
        to score real grounding.
      - The judge is a deterministic keyword rubric — directionally useful,
        cheap and reproducible, but no substitute for a provider-model judge
        on a client engagement.
      - The HPO grid is small and the corpus homogeneous: BGE-small tying
        MiniLM is evidence about *this* scale, not a universal claim — on
        noisier or larger corpora the stronger encoder may pay off, and the
        same harness will show it.
      - Corpus coverage is bounded by the dump itself: famous anchor titles
        verified absent from `20231101.en`, and per-topic quotas saturate with
        peripheral articles.

      Lessons that transfer:

      - Typed outputs that fail loudly beat prompt promises.
      - Evidence-only tool access makes grounding enforceable, not hopeful.
      - A seeded random floor plus ablations in every sweep means "better" is
        always quantified before spend.
      - Configuration chosen by measurement and persisted as code
        (`retrieval_best`) keeps decisions reviewable.

      **Business implication:** the same discipline ports to a client dataset
      in days, not months — bounded scope, measured baselines, and an honest
      list of what we do not yet know, delivered as working code.

