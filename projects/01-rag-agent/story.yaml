figure_captions:
  eda_corpus_composition: "Articles per topic and word-length distribution for all 593 bounded Wikipedia articles. Topic coverage is near-balanced. The long tail ends at the 12,000-character cap."
  retrieval_funnel: "Across 65 golden questions, 975 embedding candidates narrow to 195 reranked passages. The final top-3 retains a relevant article for 54 questions. Reranking improves rank quality, not recall@5."
  chunk_size_sweep: "Retrieval recall for 200/400/800-token chunks against the lexical word-match floor on 65 questions. All three sizes tie at recall@5 0.831, and 200 tokens minimizes context cost. The seeded-random floor (0.02-0.03) is a tabulated metric, not a plotted line; see Exact numbers."
  latency_histogram: "Per-answer latency for the selected hosted 65-question run. The median, p50, is 25.888 s. The 95th percentile, p95, is 108.836 s."
  kimi_generation_comparison: "Selected kimi-for-coding versus the incumbent on 65 tuning questions. Rubric faithfulness and answer relevance improve. RAGAS faithfulness reaches 0.7337, while RAGAS answer relevancy regresses from 0.8775 to 0.8602."
  model_comparison: "MiniLM and BGE-small tie at recall@5 0.831 on 65 questions. MiniLM has slightly higher MRR@5 (0.808 vs 0.805), so the smaller CPU model is the measured default here."
  retrieval_hpo_frontier: "Recall@k against estimated input tokens per query across chunk sizes and top-k values. The starred 200-token/top-3/rerank-on setup reaches recall@5 0.831 at ≈800 input tokens."
  failure_taxonomy: "Rubric-judge outcomes for 65 selected hosted answers: 46 correct, 17 unsupported-claim, 2 retrieval-miss, and 0 format failures. Grounding, not retrieval volume, is the main remaining failure mode."
