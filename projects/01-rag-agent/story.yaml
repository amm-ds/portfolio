project_id: 01-rag-agent
short_version: "A cited QA assistant over 593 pinned Wikipedia articles. Tuning set (65 questions): selected kimi-for-coding scores 46 correct, 17 unsupported-claim outcomes. Sealed held-out (15 questions): 11 of 15 correct; recall@5 falls 0.831 → 0.600. Auditable, not unattended-ready."
sections:
- id: background
  text_md: |
    **A question-answering assistant that answers only from a pinned corpus and
    shows a source passage for every claim.** The architecture diagram traces the
    path: bounded corpus, CPU-only retrieval, cited draft, claim verification.

    ```diagram 01-rag-pipeline
    ```

    Trace the path left to right: the corpus is pinned before anything
    runs, CPU retrieval narrows 593 articles to three passages, a model
    drafts with citations, and the verifier cuts or refuses anything under
    the 0.6 support floor.

    On 65 graded questions, recall@5 (relevant article in the top five) is
    0.831 against 0.677 for word-match search — yet 17 of 65 hosted answers
    kept unsupported claims, and a sealed 15-question set drops retrieval to
    0.600. The system is auditable, not yet trustworthy unattended.

    **Business summary:** Ask questions, get cited answers from 593 pinned
    Wikipedia articles — the right article is found 83% of the time, yet 17 of
    65 hosted answers kept unsupported claims.
  figures: []
- id: objectives
  text_md: |
    **The product must answer with evidence, or refuse honestly — never guess.**
    The decision flow below is the contract every question follows.

    ```diagram auto-01-rag-agent-1
    ```

    Follow the chain from question to meter: a question first meets the
    corpus boundary —
    anything outside it gets a calibrated refusal, not a guess. In-corpus
    questions move to a cited draft, then each claim is checked against its
    passage at the 0.6 support floor. Failing claims go through bounded
    retries — repair, not repetition — and if they still fail, the system
    abstains. Only an answer that passes reaches the meter that keeps cost
    at or under $0.01 per query.

    Success means:

    - Return a structured result: summary, citations, confidence. Bad output
      fails loudly after a few retries, never in silence.
    - Find the right article at least 0.60 of the time, cite it when it exists,
      and refuse questions outside the corpus.
    - Keep cost at or under $0.01 a query.

    Retrieval runs on CPU only, and the model is a deliberate seam: with a
    local model, prompts and source text stay on the machine; with a hosted
    provider they leave it — a user choice, not a default. An offline mode
    runs checks with no provider at all, so the contract can be re-validated
    without spending anything. A bigger hosted model was rejected on
    purpose: scale does not fix grounding, and it would break the cost cap.

    What corpus makes this contract checkable?

    **Business summary:** The product must answer with citations or refuse
    honestly, find the right article at least 60% of the time, and stay under
    $0.01 per query.
  figures: []
- id: data
  text_md: |
    **A small, pinned corpus makes every claim checkable.** The lineage
    diagram shows how sources become scored files; DVC tracks every step, and
    a checksum pins it.

    ```diagram auto-01-rag-agent-2
    ```

    The lineage runs from sources to scores: a bounded scan feeds a
    bounded build. The build makes one pinned artifact, and every score
    comes off that file — never from an unpinned step. The build stays
    small on purpose:

    - Five topics are covered — Climate, Renewable energy, Aviation,
      Machine learning, and Photosynthesis — each capped at 120 matched
      articles plus exact-title anchors.
    - Every article is cut at 12,000 characters; the obvious alternatives
      were rejected early — indexing all of Wikipedia would leave every
      claim check open-ended, and uncapped articles would not fit one
      model context.
    - A contract file pins the corpus by sha256; source, snapshot date,
      license, and credit sit in the
      [data registry](https://amm-ds.github.io/portfolio/data-registry/wikipedia/).
    - Null and length gates stop bad input before indexing.
    - Both question sets — 65 tuning, 15 sealed — are graded by hand, and
      the sealed set was written only after tuning froze.
    - The question mix is deliberate — 44 single-hop, 11 multi-hop, and 10
      unanswerable — so retrieval, composition, and refusal all get
      exercised.

    With the corpus pinned, what does it look like inside?

    **Business summary:** The corpus is five topics, 593 articles capped at
    12,000 characters, pinned by a sha256 contract with source and license in
    the data registry.
  figures: []
- id: eda
  text_md: |
    **Topic counts are near-balanced; article lengths are not.** The corpus
    composition figure shows 102–125 articles per topic and a long tail of
    lengths, cut off by the 12,000-character cap. That cap keeps embedding
    cost low and every article short enough for one model context.

    Read the figure in two passes:

    - First the topic bars: five near-equal columns, so no topic dominates
      retrieval training and a headline score cannot hide a weak subject.
    - Second the length distribution: a long tail of short articles with a
      hard right edge at 12,000 characters — the cap doing its job.

    Two checks shaped this section:

    - Dump order is not topical, so a naive quota fill would pad topics
      with side pages.
    - Several hoped-for flagship titles were missing from the scan.

    Each anchor title and each test question was therefore checked against
    the corpus itself, not assumed — a small corpus makes that cheap, and
    nothing about coverage is taken on faith. The near-equal bar heights
    also settle a design worry: no topic can carry the retrieval metrics on
    its own, so a single average score is a fair summary of the whole
    corpus rather than of one over-represented subject.

    If coverage is verified, how should retrieval exploit it?

    **Business summary:** The corpus runs 102–125 articles per topic with
    lengths cut at 12,000 characters; every anchor title and test question was
    verified against it.
  figures: [eda_corpus_composition]
- id: training
  text_md: |
    **Retrieval quality comes from ranking discipline, not a larger model — and
    retrieval is the solved half of this problem.** The pipeline is MiniLM
    embeddings, exact FAISS search, cross-encoder rerank, agent draft, claim
    verification, cited answer or abstention; the retrieval funnel figure
    shows how candidates narrow.

    Read the funnel first: 975 embedding candidates across 65 questions
    narrow to 195 reranked passages, and 54 questions keep a relevant
    article in the final top-3. The funnel is deliberately wide — reranking
    is where quality is bought, so nothing is thrown away early. Three
    comparisons then settled the configuration:

    - The chunk-size sweep figure settles chunking: 200-, 400-, and 800-token
      chunks tie at recall@5 0.831, and 200 tokens needs only ≈800 input
      tokens per query for the top-3 context — the larger sizes cost roughly
      2–4× the tokens for no recall gain, so 200 tokens stays.
    - The model comparison figure settles the embedding model: the 80 MB
      MiniLM matches BGE-small at recall@5 0.831 and edges it on MRR@5 (mean
      reciprocal rank of the first relevant hit), 0.808 vs 0.805. A bigger
      embedding model was rejected, CPU-only stays.
    - Cross-encoder reranking lifts MRR@5 from 0.718 to 0.808 without
      changing recall@5: it reorders right articles rather than finding new
      ones. At 593 articles, exact search is cheap enough that no
      approximate index is needed.

    **Retrieval core — wide candidate recall first, cross-encoder precision
    second.** The reranker reorders the fan-out; it never replaces the search.

    ```python
    def search(self, query: str, top_k: int | None = None) -> list[Citation]:
        k = top_k or self.config.top_k
        n_candidates = min(len(self.chunks), k * self.config.rerank_multiplier)
        vector = self._embed_query(query)
        _, ids = self.index.search(vector, n_candidates)
        candidates = [self.chunks[int(i)] for i in ids[0] if int(i) >= 0]

        if self.rerank_fn is not None and len(candidates) > k:
            scores = np.asarray(
                self.rerank_fn(query, [c.text for c in candidates]), dtype=np.float32
            )
            order = np.argsort(-scores)
            candidates = [candidates[int(i)] for i in order]

        return [self._to_citation(c) for c in candidates[:k]]
    ```

    Excerpt from [index.py](https://github.com/amm-ds/portfolio/blob/main/projects/01-rag-agent/src/rag_agent/index.py).
    Against the seeded floors the margin is real: recall@5 0.831 vs 0.677
    word-match and 0.031 random. Generation, not retrieval, is the bottleneck
    — the hosted pass classified 17 of 65 answers as keeping unsupported
    claims. Full run records live in the conclusions.

    The retrieval numbers are strong — do they survive grading whole answers?

    **Business summary:** The chosen retrieval setup finds the right article
    83% of the time — word-match search reaches 68%, random 3% — and
    cross-encoder reranking lifts MRR@5 from 0.718 to 0.808.
  figures: [retrieval_funnel, chunk_size_sweep, model_comparison]
- id: evaluation
  text_md: |
    **Auditable means every claim points at a passage a person can read — and a
    reviewer is still necessary.** The measurement contract below is the gate
    every number must pass: two seeded floors, three judges, a sealed set, and
    per-phase cost metering under a hard cap.

    ```diagram auto-01-rag-agent-3
    ```

    Treat this contract as the checklist every number survives. The three
    judges are kept separate because they see different failure
    modes: the rubric judge applies the failure taxonomy, RAGAS scores
    faithfulness and relevancy, and the claim verifier checks each claim at
    the 0.6 floor. The seeded floors exist so a headline can never restate
    how easy the task is; the sealed set is written after tuning froze and
    scored once, so it cannot be overfit; the meters keep a pass affordable.

    Results under this contract select hosted `kimi-for-coding`. Rubric
    faithfulness rises from 0.5504 to 0.6209 and answer relevance from 0.5573
    to 0.6458, with context recall unchanged at 0.9636. RAGAS faithfulness is
    0.7337 [0.6562, 0.8131], but answer relevancy regresses slightly from
    0.8775 to 0.8602; context precision and recall are 0.7609 and 0.9826.
    The selected pass has 46 correct, 17 unsupported-claim, 2 retrieval-miss,
    and 0 format-failure outcomes; refusal accuracy is 1.0, false-abstention
    0.0545, and cite-when-expected 0.9636. Answer generation costs
    $0.000906/query before judge and verify costs, at p50 25.888 s and p95
    108.836 s. No replacement total tuning-suite cost is claimed.

    The sealed set warns against over-reading: recall@5 falls to 0.600,
    recall@10 is 0.667, and MRR@5 is 0.567 against a 0.022 random floor. On
    10 answerable questions, rubric faithfulness is 0.64, answer relevance
    0.595, and context recall 0.9; 4 of 5 required refusals succeed (refusal
    accuracy 0.8, CI [0.4, 1.0]). The sealed
    pass meters 61 calls and $0.240699 cloud-equivalent, with p50 28.025 s and
    p95 52.176 s.

    **Hybrid retrieval evaluated out of the box — the champion holds.**
    Sparse+dense fusion is the current production default, so the comparison
    runs retrieval-only (rerank off, no LLM calls): dense, BM25 (k1=1.2,
    b=0.75), and RRF k=60 over both top-50 lists, on both sets. On tuning,
    RRF ties dense exactly (recall@5 0.831 both; MRR@5 0.724 vs 0.718) with
    nDCG@10 slightly lower (0.700 vs 0.714); BM25 alone reaches 0.738. On the
    sealed set dense and BM25 both read 0.600 recall@5 and RRF 0.533 — inside
    the binomial noise of fifteen questions. At this corpus scale fusion buys
    no measured recall for its extra latency; the dense+rerank champion is
    unchanged. The reusable asset is the comparison itself, one command away
    (`uv run python -m rag_agent.cli fusion`).

    What do numbers that survive this gate allow us to claim?

    **Business summary:** Selected `kimi-for-coding` improves faithfulness but
    still leaves 17 unsupported-claim outcomes in 65 tuning answers; sealed
    recall drops to 0.600, RAGAS answer relevancy regresses to 0.8602, and
    out-of-the-box hybrid fusion ties dense instead of beating it.
  figures: [latency_histogram, kimi_generation_comparison, fusion_arm_comparison]
