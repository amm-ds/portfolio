- id: results
  text_md: |
    **These figures do not show broad-corpus readiness.** Both describe one
    Wikipedia slice. The sealed 55-question pass has 44 correct answers and
    refusal accuracy 0.92. Noisier collections are unmeasured. Its expansion
    questions passed an answerability gate, so the retrieval results are
    consistency checks, not stress tests.

    Start with the HPO frontier. HPO means hyperparameter optimization, the
    systematic comparison of configuration settings. The figure plots recall@k,
    the chance of a relevant article in the top k results, against estimated
    input tokens per query. Look at the starred 200-token, top-3, rerank-on
    setup. It reaches recall@5 0.831 at ≈800 input tokens per query. Other
    frontier points are weaker or pricier. None measures grounding. The starred
    point, not the frontier's right edge, is the committed configuration.

    Next, read the failure taxonomy. Among 65 selected-provider answers, it
    shows 46 correct, 17 unsupported-claim, 2 retrieval-miss, and 0 format
    failures. Unsupported claims outnumber every other failure combined. The
    remaining debt is grounding, not retrieval volume.

    The traces behind those failure bars stay visible in opt-in showcase chat.
    Hosted answers cost real money. The committed examples include an
    unsupported answer with faithfulness 0.2, a multi-hop grounding failure,
    and a support-floor abstention. They expose failure instead of hiding it.

    The unsupported-claim bar also guides the claim-level reading. Five
    unsupported-claim answers drafted claims at 0.74 first-check support,
    against 0.93 for correct answers. Across 42 verified answers, 258 claims
    had 16 repairs and 11 drops. Mean answer support is 0.98. The verifier
    bounds, repairs, and abstains; it does not turn weak drafts into grounded
    ones.

    **Business summary:** Of 65 selected-provider answers, 46 are correct, 17
    keep unsupported claims, 2 miss retrieval, and 0 fail format. The accuracy
    claim stops at this corpus.
  figures: [retrieval_hpo_frontier, failure_taxonomy]
  metrics_keys:
  - retrieval_chunks_200
  - retrieval_random_chunks_200
  - retrieval_model_minilm_chunks_200
  - retrieval_rerank_on_chunks_200
  - rag_agent
- id: conclusions
  text_md: |
    ## Results summary

    Use `auto-01-rag-agent-4` to connect retrieval, answer checks, and final
    outcomes. It explains why a retrieved source is not yet a supported answer.

    ```diagram auto-01-rag-agent-4
    ```

    The current champion is the grounding-hardening configuration with hosted
    generation and dense MiniLM retrieval plus cross-encoder reranking. On the
    frozen 30-question stress re-run it reaches 0.733 correct (CI [0.567,
    0.867]). Unsupported-claim outcomes fall to 5 of 30, from 11 of 30; the CI
    width exceeds the change, so this is not a demonstrated gain.
    Independent set B reaches 0.633 correct (CI [0.467, 0.80]) but misses the
    unsupported claim gate at 9/30 and answer-expected correctness at 0.550.
    Earlier tuning and gated sealed results remain separate evidence, not
    inputs to these denominators. See the
    [full evaluation report](https://amm-ds.github.io/portfolio/projects/01-rag-agent/).

    ## What the experiment taught

    - Retrieval was comparatively strong on this corpus, not generally solved.
      The 65-question sweep selected 200-token chunks, MiniLM, and reranking;
      held-out and stress results still expose retrieval and grounding errors.
    - Grounding hardening improved the frozen stress re-run, but independent
      set B failed two pre-registered quality gates. Verification bounds harm;
      it does not guarantee correctness.
    - Provider selection was not a clean sweep. Rubric faithfulness and answer
      relevance improved, while RAGAS answer relevancy regressed 0.8775 →
      0.8602 on the 65-question comparison.
    - Fusion and judge alternatives were not promoted. RRF did not beat dense
      recall, and the rebuilt hosted judge failed every alignment gate.
    - The reusable deliverable is the measurement contract: seeded floors,
      separate judges, sealed sets, explicit denominators, and cost meters.

    ## Exact numbers

    Retrieval configurations on the 65 tuning questions:

    | Retrieval configuration | recall@5 | recall@10 | MRR@5 |
    |---|---|---|---|
    | MiniLM, 200-token chunks | **0.831** | 0.846 | **0.808** |
    | lexical word match (baseline) | 0.677 | 0.754 | 0.500 |
    | seeded random (chance floor) | 0.031 | 0.046 | 0.018 |

    | Generation metric | Incumbent | Selected `kimi-for-coding` |
    |---|---:|---:|
    | rubric faithfulness | 0.5504 | **0.6209** |
    | rubric answer relevance | 0.5573 | **0.6458** |
    | rubric context recall | 0.9636 | 0.9636 |
    | RAGAS faithfulness | — | **0.7337 [0.6562, 0.8131]** |
    | RAGAS answer relevancy | 0.8775 | **0.8602** |
    | RAGAS context precision / recall | — | 0.7609 / 0.9826 |

    Judge and evaluator metadata: the entailment judge and the RAGAS evaluator
    run on the hosted `kimi-for-coding` provider (committed comparison
    artifact), RAGAS library version 0.3.1 from the locked environment.

    - Selected tuning taxonomy: 46 correct / 17 unsupported / 2 retrieval-miss /
      0 format failures. Refusal accuracy 1.0, false-abstention 0.0545,
      cite-when-expected 0.9636; p50 25.888 s and p95 108.836 s. Answer
      generation costs $0.000906/query before judge and verification costs.
    - Earlier gated sealed pass (55 questions): 44 correct / 9 unsupported /
      1 retrieval-miss / 1 format-failure (0.80, CI [0.69, 0.89]); operational
      recall@5 0.745; 12/13 required refusals (0.92, CI [0.77, 1.0]); 241
      calls and $1.950667 cloud-equivalent; p50 24.443 s, p95 126.811 s.
    - Citation pass over 42 verified answers: 258 claims, first-check support
      0.903 CI [0.868, 0.938], 16 repaired and 11 dropped; 236 calls and
      $1.583466 cloud-equivalent.
    - Original independent stress pass (30 questions): 16 correct (0.53, CI
      [0.37, 0.70]), 11 unsupported-claim outcomes with retrieval intact, and
      refusal accuracy 0.60 (6/10, CI [0.30, 0.90]).

    Current grounding-hardened results:

    | evaluation | overall correctness | answer-expected correctness | unsupported claims | refusal / false abstention |
    |---|---:|---:|---:|---:|
    | frozen stress re-run | 0.733 [0.567, 0.867] | 0.700 | 5 | 0.800 / 0.050 |
    | independent set B | 0.633 [0.467, 0.80] | 0.550 | 9/30 | 0.800 / 0.000 |

    Set B's pre-registered gates were overall correctness ≥0.60,
    answer-expected correctness ≥0.70, unsupported claims ≤6/30, refusal
    accuracy ≥0.8, and false abstention ≤0.10. It passes overall, refusal, and
    false-abstention gates but fails the other two. Hosted answer latency on
    the hardened path is p50 23.0 s and p95 532 s; frozen-set and B costs are
    $9.74 and $2.19 cloud-equivalent.

    ## Measured alternatives

    - The retrieval tournament's best arm gained +1.5 points recall@10, below
      the +5-point promotion bar. Dense retrieval with reranking remains.
    - `fusion_arm_comparison` is a retrieval-only candidate comparison with
      reranking off. RRF ties dense tuning recall@5 and trails sealed raw-layer
      recall@5 0.952 to 0.976. It is not the production default.
    - The rebuilt hosted judge fails every promotion gate: false-acceptance
      35.6%, upper confidence bound 46.1%, kappa 0.656, agreement 78%, and
      repeat flips 6.0%. The answer-level rubric remains the correctness
      instrument.

    ## Protocol

    - Tuning: 65 questions (44 single-hop, 11 multi-hop, 10 unanswerable) drive
      selection; the earlier sealed set has 55 (32 single-hop, 10 multi-hop,
      13 unanswerable). Later frozen stress, B, C, and D sets remain distinct.
    - Floors: seeded random and word-match search, scored per configuration.
    - Judges: rubric taxonomy, hosted RAGAS, and per-claim verification against
      cited chunks. The support floor is 0.6 with at most two repairs.
    - Cost: cloud-equivalent rate-card estimates at $1.00/Mtok input and
      $4.00/Mtok output, with cached reads at 30%; these are not billed amounts.

    ## Limits

    - Independent set B still has 9/30 unsupported-claim outcomes and 0.550
      answer-expected correctness. Small samples and judge noise limit every
      comparison; a fresh sealed set is required for the next quality claim.
    - The retrieval grid is small and covers only 593 capped Wikipedia articles.
      The answerability-gated sealed expansion is a consistency check, not a
      stress test; no broad-corpus or unattended-readiness claim follows.
    - Live hosted calls need an explicit budget, and always-on public chat is
      not enabled by this evidence.

    **Business summary:** Grounding hardening improves the frozen stress
    re-run, while independent set B still fails quality gates. Dense+rerank
    retrieval remains the champion; fusion is not promoted. The system is
    auditable, not unattended-ready.
  figures: []
key_concepts:
  - "**Seeded floors:** Random and word-match rankings anchor every headline, so a score cannot merely restate how easy the task is."
  - "**Sealed held-out set:** A second question set is written after tuning freezes and scored once, which protects it from tuning overfit."
  - "**Claim support floor:** Each claim needs support of 0.6 or better from its cited passage. Otherwise it is cut, repaired at most twice, or the answer abstains."
  - "**Three separate judges:** Rubric taxonomy, RAGAS, and per-claim verification catch different failures. No single score represents answer quality."
  - "**Cloud-equivalent cost metering:** A public rate card turns token use into estimated dollars and applies a hard cap to every pass."
  - "**Auditable is not trustworthy:** Every answer traces to a readable passage, yet 17 of 65 still kept unsupported claims. Verification bounds harm; it does not remove it."
