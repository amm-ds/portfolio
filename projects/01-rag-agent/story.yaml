project_id: 01-rag-agent
short_version: "Grounding-hardened cited QA over 593 Wikipedia articles. S3 hybrid retrieval reaches 0.946 recall@5. Judge sample: reviewer-agent audit 30/30; owner hand-label pending. Final 120-question pass: F1 0.909, precision 0.952, faithfulness 0.872, 1/120 unsupported."
sections:
- id: background
  text_md: |
    **When every answer carries a citation, what can still go wrong?**
    A citation looks safe, yet a model can misread a source or invent a link between two quoted lines. This assistant answers strictly from 593 pinned Wikipedia articles. It cites each claim or refuses when evidence is missing.

    ```diagram 01-rag-pipeline
    ```

    The pipeline pairs CPU search with a check-and-repair loop that cuts weak claims before returning text.

    - **Final pass:** Across 120 test questions, 104 answers pass (`F1 0.9091`), and 1 answer keeps an unsupported claim.
    - **Screen, not proof:** Checks reduce bad claims, yet small test sets and single-family judging limit certainty.
    - **Scope:** Scores measure this 593-article slice, not broad-corpus or unattended chat readiness.

    **In plain terms:** The assistant answers from checked passages or refuses honestly, cutting unsupported answers to 1 in 120 on a fixed test set.
  figures: []
- id: objectives
  text_md: |
    **The product must answer with evidence or refuse honestly, and never guess.**
    Every incoming question follows one strict decision flow. We set guardrails before touching any model: a cited assistant fails loudest when it sounds confident and is wrong.

    ```diagram auto-01-rag-agent-1
    ```

    When a question falls outside the 593-article slice, the system issues a calibrated refusal rather than guessing from pretraining memory. Open-web chatbots answer everything fluently; that is the failure mode a citation-first product cannot afford, so "I cannot find this in the corpus" is a first-class output.

    - **Claim support floor (`0.6`):** Each drafted claim is scored against its cited passage, not the model's own confidence. Failing claims enter a bounded repair loop with at most two retries: weak support gets fixed or removed, never argued with, and the loop can never run forever.
    - **Retrieval hit rate (`>= 0.60`):** Place a relevant article in the top 5 (`recall@5`) at least 60% of the time. The generator can only cite what search delivers, so a search miss upstream becomes a hallucination downstream.
    - **Cost and privacy guardrails:** Keep answer-path spend at or under `$0.01` per query so the pipeline stays cheap to re-run. Search runs on CPU only. Generation supports local models (prompts never leave the machine), hosted providers (membership-quota cost), and a `$0` offline contract mode for continuous integration.
    - **Why not a bigger model:** Larger models still extrapolate between retrieved facts and would break the per-query budget without solving grounding. The budget buys verification instead of scale.

    | Target | Threshold | Final test result |
    |---|---|---|
    | Retrieval `recall@5` (92 answerable) | >= 0.60 | **0.9457** |
    | Unanswerable refusals | high recall | **24 / 28** |
    | Answer-path cost (agent + verify) | <= $0.01 / query | **$0.0084 / query** |
    | Answer latency (`p50` / `p95`, n = 120) | bounded | **16.5 s / 40.5 s** |

    **In plain terms:** The architecture prioritizes verifiable citations and honest refusals over fluent guessing, meeting its retrieval and answer-cost targets.
  figures: []
- id: data
  text_md: |
    **A small, pinned corpus makes every claim easy to check.**
    Indexing all of Wikipedia would make claim checks slow and open-ended. Instead, we freeze a compact slice so every score maps to the exact same bytes, today and after any re-download.

    ```diagram auto-01-rag-agent-2
    ```

    DVC tracks each step from raw Wikipedia scan to chunk index. Snapshot dates, source URLs, and licenses sit in the [data registry](https://amm-ds.github.io/portfolio/data-registry/wikipedia/).

    - **Five topics:** Climate, Renewable energy, Aviation, Machine learning, and Photosynthesis. The set spans natural science, engineering, and language-model territory, so retrieval skill is tested across very different vocabularies. Each topic holds up to 120 matched pages plus key anchor titles, the flagship articles a reader would expect by name.
    - **12,000-character cap:** Cutting pages at 12,000 characters fits every page inside one model prompt and bounds search memory. Pages are truncated, not dropped, so the corpus keeps a deliberate long tail while prompt budgets stay small and predictable.
    - **Clean inputs:** Empty or oversized pages fail loudly before indexing. SHA-256 hashes lock every corpus and question split against drift: a changed byte anywhere re-runs the pipeline instead of silently changing a score.
    - **Balanced test mix:** Splits mix single-page, multi-page, and unanswerable questions on purpose. Single-hop rows test search, multi-hop rows test synthesis across pages, and unanswerable rows test refusal discipline; one number cannot hide weakness in any of the three.

    | Question set | Size (single / multi / abstain) | Role | Reads |
    |---|---:|---|---|
    | Tuning set | 65 (44 / 11 / 10) | Search & prompt tuning | Multiple |
    | Earlier gate set | 55 (32 / 10 / 13) | Early full-loop gate | Consumed |
    | Final test set (`final_v3`) | 120 (68 / 24 / 28) | Final search & loop pass | >1 (consumed) |

    **In plain terms:** Locking a 593-page corpus and a balanced 120-question test mix ensures every score traces back to the exact same text.
  figures: []
- id: eda
  text_md: |
    **Topic counts stay even; page lengths do not.**
    Before we tune search, we inspect the indexed pages. A high average recall can easily mask a weak subject if one topic dominates the dataset, or fail silently if flagship articles were never scanned. We therefore audit both topic counts and length bounds before any retrieval model runs.

    - **Even topics (102–125 pages):** All five subjects sit in a tight band. High overall recall therefore requires good search across every domain, not mastery of one lucky topic.
    - **Dump-order bias avoided:** The Wikipedia export is not sorted by topic, so naive top-N sampling would over-represent whatever sections appear early in the dump. We matched pages per topic explicitly instead of trusting the file order.
    - **Right-censored lengths:** Page lengths show a long tail that stops at 12,000 characters. That tail is a property of the cap, not of the web: some flagship articles simply run longer. Prompt budgets stay predictable precisely because the cut is hard.
    - **Checked anchor pages:** Several expected flagship titles were missing on the first scan. We checked every anchor title and every test question directly against the slice, so no score rests on an article that was never indexed. Direct verification caught what summary averages would have smoothed over.

    | Corpus stat | Value |
    |---|---|
    | Total indexed pages | 593 |
    | Pages per topic | 102–125 |
    | Maximum page length | 12,000 characters |

    **In plain terms:** Early checks proved even topic balance and capped page sizes across all 593 pages before any model ran.
  figures: [eda_corpus_composition]
- id: training
  text_md: |
    **Smart ranking beats a bigger model.**
    Single-page questions often match one vector hit. Multi-page questions miss unless exact words, page titles, and result mix work together. Our `S3` retriever solves this in four steps on CPU, and each step exists because a measured failure forced it.

    - **Title-anchored chunks (`S1`):** Pages are split at paragraph and heading boundaries, never mid-thought, and every chunk carries its page title. A chunk that says "the first flight lasted 12 seconds" is useless without the Wright Flyer around it; the title prefix makes short blocks self-contained. Structure-aware chunking alone lifted development recall@5 to `1.000` on every development split in the tournament ladder.
    - **Hybrid RRF blend (`S2`):** Multi-hop questions lean on exact identifiers; single-hop questions lean on phrasing. FAISS vector search finds paraphrases ("wind turbine capacity factor"), BM25 word search finds exact names and numbers ("Boeing 737 MAX"). We merge both rankings with reciprocal rank fusion (`k = 60`, pool of 50), which needs no learned combiner and cannot overfit a training set.
    - **Rerank and page cap (`S3`):** Embedding models rank coarsely, so a cross-encoder re-scores the fused pool. Without the 2-chunk-per-page cap, one popular article can crowd out the second page a multi-hop answer needs; the cap with score-order backfill keeps results diverse. Reranking lifted `MRR@5` from `0.718` to `0.808` across 975 candidate chunks narrowed to 195 passages on the tuning set. On the 92 final answerable rows, recall@5 rose from `0.9239` to `0.9457`, multi-hop recall@5 from `0.7917` to `0.8333`, and `all-articles@5` led on every split (the honest headline; raw recall@5 did not win everywhere).
    - **Promotion protocol:** Each stage had to win on the next set in line, not the one it was tuned on: development splits, then the held-out gate, then the sealed final set. The tournament ran retrieval-only with zero LLM calls, ranking top 5 for measurement while production serves top 3 (mean context 443 tokens at top 3, 748 at top 5); `retrieval_ladder` plots every stage with Wilson 95% whiskers.
    - **What tuning ruled out:** On 65 tuning questions, 200-, 400-, and 800-token chunks tied at `0.831` `recall@5`, so 200 tokens won on context cost alone (larger chunks only inflate prompts). MiniLM (80 MB) matched BGE-small on recall and edged `MRR@5` (`0.808` vs `0.805`) on CPU. Plain RRF without structure chunks and reranking was not promoted: it trailed dense search on the sealed raw layer (`0.533` vs `0.600`, n=15).

    ```python
    def search(self, query: str, top_k: int | None = None) -> list[Citation]:
        k = top_k or self.config.top_k
        n_candidates = min(len(self.chunks), k * self.config.rerank_multiplier)
        vector = self._embed_query(query)

        if self.config.fusion_rrf:
            pool = min(len(self.chunks), max(n_candidates, self.config.rrf_pool_size))
            _, dense_ids = self.index.search(vector, pool)
            dense = [self.chunks[int(i)].chunk_id for i in dense_ids[0] if int(i) >= 0]
            bm25 = self._bm25_index().ranking(query)[:pool]
            fused = reciprocal_rank_fusion([dense, bm25], k=60)
            candidates = [self._by_id[cid] for cid in fused[:n_candidates] if cid in self._by_id]
        else:
            _, ids = self.index.search(vector, n_candidates)
            candidates = [self.chunks[int(i)] for i in ids[0] if int(i) >= 0]

        if self.rerank_fn is not None and len(candidates) > k:
            scores = np.asarray(
                self.rerank_fn(query, [c.text for c in candidates]), dtype=np.float32
            )
            order = np.argsort(-scores)
            candidates = [candidates[int(i)] for i in order]

        if self.config.max_per_article and self.config.max_per_article > 0:
            candidates = self._cap_per_article(candidates, k)

        return [self._to_citation(c) for c in candidates[:k]]
    ```

    Excerpt from [index.py](https://github.com/amm-ds/portfolio/blob/main/projects/01-rag-agent/src/rag_agent/index.py): the dense and BM25 pools feed reciprocal rank fusion, the cross-encoder reorders the survivors, and the per-article cap backfills. `retrieval_ladder` plots the final `R0 -> S3` tournament; `chunk_size_sweep` and `model_comparison` show the earlier 65-question tuning diagnostics.

    **In plain terms:** Prefixing titles, blending keyword and semantic search, reranking, and capping chunks per article lifted final recall to 94.6% on CPU.
  figures: [retrieval_ladder, chunk_size_sweep, model_comparison]
- id: evaluation
  text_md: |
    **Auditable means every claim points to text a person can check.**
    One score can hide subtle errors: a fluent wrong answer, a judge that rubber-stamps, or a runaway agent loop that burns budget. Our test rules therefore stack simple baselines, three judges, and hard tool caps, and every rule exists because an earlier measurement exposed the hole it now closes.

    ```diagram auto-01-rag-agent-3
    ```

    - **Chance floors:** Every run anchors on seeded random (`0.031` recall@5) and word-match search (`0.677` recall@5 on tuning). Without floors, a headline score can merely restate how easy the task is; with them, lift over keyword search and a dice roll is the quantity being measured.
    - **Three judges, because one score lies:** A rubric judge tags answer-versus-abstain classes and failure types, RAGAS scores answer quality, and a per-claim verifier enforces the `0.6` support floor with up to two repairs. Each catches failure modes the others miss: the rubric sees shape, RAGAS sees quality, and the verifier checks the text behind every citation.
    - **The earlier judge failed openly:** The first verifier accepted 44% of unsupported claims (agreement `kappa 0.546` local, `0.605` hosted). A judge that passes bad claims is worse than none, so we published the miss instead of averaging over it.
    - **Judge audit (`judge_v2`):** We rebuilt `judge_v2` with near-miss negatives (147 calibration claims, 72 one-detail same-subject negatives). An independent reviewer agent then checked a 30-claim sample (11 supported, 19 unsupported): agreement hit `30/30` (`Wilson 95% [0.8865, 1.0]`), clearing the `0.85` gate. Human owner hand-labelling is still pending, and the article says so.
    - **Hard agent rails:** Caps of 12 calls, 16 tool steps, and 200k input tokens stop runaway loops, with a soft in-tool ceiling so a single tool cannot dominate a run. The verify stage itself abstained twice, skipped 33 short answers, and made zero mechanical false rejections on the final pass. Saved runs log token spend per stage, so no number in this article is reconstructed from memory.
    - **Single-family judging, stated plainly:** Answers, checks, and judging all use `kimi-for-coding`. That keeps the pipeline consistent but means the generator and its graders share blind spots; a cross-judge check with a different model family is the planned counter. Also, `final_v3` was read more than once (`R0`, `S3` gate, validation, E2E pass), so it is now consumed and the next quality claim needs a fresh sealed set.

    | Check | Role | Model | Audit status |
    |---|---|---|---|
    | Claim verifier | Passage support (`>= 0.6` floor) | `kimi-for-coding` | 30/30 agent audit (owner pending) |
    | Rubric judge | Answer vs. abstain class | `kimi-for-coding` | Calibrated on `judge_v2` |
    | RAGAS suite | Faithfulness & relevance | `kimi-for-coding` | Library v0.3.1 (tuning pass) |

    **In plain terms:** Every answer faces search floors, tool limits, and a 30/30 agent-audited verifier, with single-family judging openly noted.
  figures: [latency_histogram, kimi_generation_comparison, fusion_arm_comparison]
- id: results
  text_md: |
    **104 of 120 questions answered or refused cleanly, with 1 unsupported answer.**
    These 120 questions are the sealed final split, never used during retrieval tuning or guardrail fitting. On the final 120-question run, `S3` search and bounded checks raise precision to `0.9524` (`F1 0.9091`) and faithfulness to `0.8717` across 92 answerable rows. The full per-question traces are committed, so every number below can be re-derived from `reports/final_v3_e2e/`.

    ```diagram auto-01-rag-agent-4
    ```

    - **Accuracy by slice:** Overall accuracy hits `86.7%` with `Wilson 95% [0.7944, 0.9162]` (`80` true positives, `4` false positives, `24` true negatives, `12` false negatives). Faithfulness carries its own interval, `0.8717 [0.8092, 0.9304]`. By type, `60/68` single-hop, `20/24` multi-hop (`+4.2` percentage points retrieval lift from `S3`), and `24/28` unanswerable rows finish right; refusal accuracy is `0.8571` and the assistant cites when expected `90.2%` of the time. At the retrieval layer, top-5 coverage reached `88.6%` of exact gold chunks and `93.5%` of relevant articles on the 92 answerable rows.
    - **Claim-level accounting (`verify_funnel`):** Of 166 drafted claims, 16 failed mechanical checks, 150 reached the judge, and 148 were supported on first pass. Fifteen repair calls rescued 11 more, 7 claims were dropped, and 159 survived with mean support `0.9739`: a 95.8% claim retention rate at the `0.6` floor.
    - **Failures moved, they did not disappear:** Only **1 of 120 answers** kept an unsupported claim, down from `17/65` in tuning; at claim level, `2 of 150` judged claims were unsupported before drop or repair. The dominant risk is now over-caution: `10` answerable rows returned empty answers (`11/92` missed counting `1` search miss, and `8` cited no key page), plus `4` unanswerable rows stopped at the tool budget. A wrong-but-plausible answer is gone; an honest "I am not sure" remains.
    - **Transparent traces, exact cost:** Every run saves its messages, tool calls, and token meter, and the taxonomy counts sit next to the confusion matrix; nothing is reconstructed by hand. Verification adds `6.2 s` on average, 31% of answer latency. Answers (agent + verify) cost `$1.014`, split `$0.781` agent and `$0.233` verify, or `$0.0084` per query against the `$0.01` cap, helped by cached reads covering 74% of agent input tokens. Adding evaluation judging brought the total to `$1.458` (`$0.0121` per query), at `p50 16.5 s` and `p95 40.5 s` per answer.

    | Final pass metric (`final_v3`, n = 120) | Value |
    |---|---:|
    | F1 / Precision / Recall | **0.9091** / 0.9524 / 0.8696 |
    | Overall accuracy (Wilson 95% CI) | **0.8667** `[0.7944, 0.9162]` |
    | Faithfulness (n = 92 answerable, 95% CI) | **0.8717** `[0.8092, 0.9304]` |
    | Retrieval `recall@5` (n = 92 answerable) | **0.9457** (vs 0.9239 R0) |
    | Outcomes (correct / empty / budget / unsupported / miss) | **104 / 10 / 4 / 1 / 1** |
    | Answer-path cost / Total with judge | **$0.0084** / **$0.0121** per query |

    **In plain terms:** Grounding hardening cut unsupported answers to 1 in 120 while keeping answer cost at `$0.0084/query`; the main remaining trade-off is over-abstention on 10 answerable questions.
  figures: [final_outcome, failure_taxonomy, verify_funnel]
- id: conclusions
  text_md: |
    ## Results summary

    Pairing hybrid title-anchored retrieval (`0.9457` recall@5) with a bounded verify-and-repair loop yields `0.9091` F1, `0.9524` precision, and `0.8667` accuracy (`Wilson 95% [0.7944, 0.9162]`) on the 120-question final pass (`reports/final_v3_e2e/f1_summary.json`). Out of 166 drafted claims, 16 failed mechanical checks, 150 were judged (148 supported), 11 repaired within two calls, and 7 dropped (`159` surviving claims at `0.9739` mean support). Answer-path cost stayed at `$0.0084` per query (`$1.014` total), showing that bounded verification can sharply curb hallucinations (`1` of `120` answers unsupported) within a strict per-query budget.

    ## What the experiment taught

    - **Retrieval discipline beats model size:** Title-anchored chunks, dense + BM25 RRF fusion, cross-encoder reranking, and a 2-chunk per-article cap lifted `all-articles@5` on every development split without GPU search.
    - **Verification bounds harm; it does not eliminate risk:** Grounding rules cut unsupported answers dramatically, yet single-family judging (`kimi-for-coding`) and conservative empty answers (`10/92`) remain open constraints.
    - **The measurement contract is the reusable deliverable:** Seeded floors, pre-registered thresholds, resumable checkpoints, and explicit cost meters generalize cleanly to new corpora and tasks.

    ## Limits

    - **Consumed final test set:** `final_v3` was read more than once (`R0` baseline, `S3` promotion gate, held-out validation, E2E pass); a fresh sealed set (`final_v4`) is required for the next quality claim.
    - **Same-family judging and pending human labels:** Generation, verification, and judging all use `kimi-for-coding`, and owner hand-labelling on the 30-claim audit sample is still pending.
    - **Bounded corpus scope:** Numbers cover 593 capped Wikipedia articles; broad-corpus and unattended production readiness remain unmeasured.

    ## Exact numbers

    Tuning-pass retrieval configurations (65 tuning questions, `reports/metrics.json`):

    | Retrieval configuration | recall@5 | recall@10 | MRR@5 |
    |---|---|---|---|
    | MiniLM, 200-token chunks | **0.831** | 0.846 | **0.808** |
    | lexical word match (baseline) | 0.677 | 0.754 | 0.500 |
    | seeded random (chance floor) | 0.031 | 0.046 | 0.018 |

    Tuning-pass generation comparison (65 tuning questions):

    | Generation metric | Incumbent | Selected `kimi-for-coding` |
    |---|---:|---:|
    | rubric faithfulness | 0.5504 | **0.6209** |
    | rubric answer relevance | 0.5573 | **0.6458** |
    | rubric context recall | 0.9636 | 0.9636 |
    | RAGAS faithfulness | — | **0.7337 [0.6562, 0.8131]** |
    | RAGAS answer relevancy | 0.8775 | **0.8602** |
    | RAGAS context precision / recall | — | 0.7609 / 0.9826 |

    - Selected 65-question tuning taxonomy: 46 correct / 17 unsupported / 2 retrieval-miss / 0 format failures (`p50 25.888 s`, `p95 108.836 s`, `$0.000906/query` generation).
    - Earlier gated sealed pass (55 questions): 44 correct / 9 unsupported / 1 retrieval-miss / 1 format failure (`0.80`, CI `[0.69, 0.89]`; `12/13` refusals; `$1.95` cloud-equivalent; `p50 24.443 s`, `p95 126.811 s`).
    - Earlier stress sets (30 questions each, before final S3 + loop hardening): original stress `16/30` (`0.53`, CI `[0.37, 0.70]`); frozen re-run `22/30` (`0.733`, 5 unsupported); set B `19/30` (`0.633`, 9 unsupported); set C `10/30` (`20` empty); set D `17/30` (`9` unsupported).

    ## Measured alternatives

    - **S3 vs R0 on `final_v3` (92 answerable):** `recall@5` rose `0.9239 -> 0.9457`; `multi-hop recall@5` rose `0.7917 -> 0.8333`; `all-articles@5` reached `0.8804`.
    - **`fusion_arm_comparison` (reranking off):** Dense and RRF tied at `0.831` on 65 tuning questions; on the 15-question sealed raw layer, RRF trailed dense (`0.533` vs `0.600`), showing fusion alone needed title-anchored chunks and reranking.

    ## Protocol

    - Floors: seeded random and lexical word-match search per configuration.
    - Judges: rubric taxonomy, RAGAS `0.3.1`, and per-claim verification (`0.6` support floor, `<= 2` repairs).
    - Cost: public rate card estimates at `$1.00/Mtok` input, `$4.00/Mtok` output, `30%` cached reads.

    **In plain terms:** S3 hybrid retrieval, an audited verifier, and bounded tool rails lift final F1 to 0.9091 with 1 unsupported answer in 120; next requires owner sample labelling, a cross-judge check, and a fresh `final_v4` test set. [Full evaluation report →](https://amm-ds.github.io/portfolio/projects/01-rag-agent/)
  figures: [retrieval_funnel]
key_concepts:
  - "**Seeded floors:** Random and word-match rankings anchor every headline, so a score cannot merely restate how easy the task is."
  - "**Sealed held-out set:** A fresh question set is written after tuning freezes and scored once to prevent tuning overfit."
  - "**Claim support floor:** Each claim needs support of 0.6 or better from its cited passage; otherwise it is repaired at most twice, dropped, or the answer abstains."
  - "**Three separate judges:** Rubric taxonomy, RAGAS, and per-claim verification catch different failures; no single score represents answer quality."
  - "**Cloud-equivalent cost metering:** A public rate card turns token use into estimated dollars under a hard budget cap."
  - "**Verification bounds harm; it does not eliminate risk:** Grounding checks cut unsupported answers dramatically, yet single-family judging and empty-answer abstentions remain open limits."
