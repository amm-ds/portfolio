- id: results
  text_md: |
    **These figures do not show broad-corpus readiness.** They describe one
    Wikipedia slice, and the tuning charts in the earlier sections are
    development history from the 65-question passes. The finalized 120-question
    pass below is the only sealed read of the champion. The sealed 55-question
    pass kept 44 correct answers and refusal accuracy 0.92. Noisier collections
    are unmeasured.

    The finalized pass supersedes these tuning figures. On the 120-question
    final_v3 sealed set the pipeline reaches F1 0.9091 (precision 0.9524,
    recall 0.8696), accuracy 0.8667, and faithfulness 0.8717. Of 120 rows,
    104 answers are correct, 1 keeps an unsupported claim, 10 are
    empty-answers, 4 unanswerable rows stop at the tool-budget rail, and 1
    misses retrieval. The full table is in the conclusions.

    Start with the retrieval ladder. It plots the tournament that chose the
    retriever. R0 is the as-shipped baseline: size chunks, dense embeddings,
    reranking. S1 swaps in title-anchored structure chunks. S2 adds BM25
    fusion through reciprocal rank fusion. S3 adds a per-article diversity
    cap. Each left-panel bar is recall@5 with Wilson 95% whiskers on a frozen
    split; the right panel counts a hit only when every chunk of a relevant
    article reaches the top 5. S3 lifts final_v3 recall@5 to 0.9457
    (n = 92 answerable) from 0.9239 for R0, after winning every development
    split. S1 and S2 have no final_v3 bar: the set was consumed by the S3
    promotion gate.

    Next, read the final outcome. The left panel is the answer-versus-abstain
    confusion: 80 true positives, 4 false positives, 24 true negatives, and
    12 false negatives across 120 questions. The right panel splits
    correctness by question type: single-hop 60 of 68, multi-hop 20 of 24,
    and unanswerable 24 of 28.

    The failure taxonomy counts the same 120 rows by verdict: 104 correct,
    10 empty-answer, 4 budget-terminated, 1 unsupported-claim, and 1
    retrieval-miss. The prior 65-question pass had 17 unsupported-claim
    answers, so grounding hardening cut that failure to 1 in 120. The
    remaining debt is over-abstention and rail stops, not grounding volume.

    The traces behind those failure bars stay visible in opt-in showcase chat.
    Hosted answers cost real money. The committed examples include an
    unsupported answer with faithfulness 0.2, a multi-hop grounding failure,
    and a support-floor abstention. They expose failure instead of hiding it.

    The verify funnel in the conclusions is the claim-level reading. Of 166
    drafted claims, 16 fail mechanical checks before judging. A claim
    verifier judges the remaining 150 against their cited passages and
    supports 148. The final answers keep 159 claims: 148 originals plus 11
    repaired after at most two repair calls; 7 are dropped. Mean support
    among surviving claims is 0.9739. The verifier bounds, repairs, and
    abstains; it does not turn weak drafts into grounded ones. Judge
    calibration (Q3a, offline, 194 labels by construction)
    quantifies the miss: the local judge accepts 0.4433 of unsupported
    claims, Wilson 95% [0.3752, 0.5136], kappa 0.5464; the hosted judge
    accepts 0.3966 [0.3269, 0.4707], kappa 0.6052 [0.5262, 0.6831].

    **Business summary:** The finalized 120-question pass reaches F1 0.9091
    with 1 unsupported claim in 120. The earlier 65-answer tuning pass had 46
    correct and 17 unsupported, and it remains the prior baseline. The
    accuracy claim stops at this corpus.
  figures: [retrieval_ladder, final_outcome, failure_taxonomy]
