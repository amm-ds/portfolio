# Mirrors RAGConfig fields (see src/rag_agent/config.py). The CLI overlays
# this file onto the defaults when present; DVC tracks these keys for
# stage invalidation.
topics:
  - Climate
  - Renewable energy
  - Aviation
  - Machine learning
  - Photosynthesis
articles_per_topic: 120
max_scan_rows: 7000000
seed: 42
anchor_titles:
  Climate:
    - Climate change
    - Climate
    - Global warming
    - Greenhouse effect
  Renewable energy:
    - Renewable energy
    - Solar energy
    - Wind power
    - Hydroelectricity
    - Geothermal energy
    - Photovoltaics
    - Biofuel
  Aviation:
    - Aviation
    - Wright brothers
    - Aircraft
    - Airliner
    - Jet engine
    - Airport
    - History of aviation
  Machine learning:
    - Machine learning
    - Artificial intelligence
    - Deep learning
    - Artificial neural network
    - Reinforcement learning
    - Natural language processing
    - Large language model
    - Supervised learning
  Photosynthesis:
    - Photosynthesis
    - Chloroplast
    - Chlorophyll
    - Light-independent reactions
    - Carbon fixation
    - Algae
chunk_sizes:
  - 200
  - 400
  - 800
chunk_overlap: 40
embedding_model: sentence-transformers/all-MiniLM-L6-v2
reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2
top_k: 5
usd_per_mtok_input: 0.15
usd_per_mtok_output: 0.60
# Production retrieval config chosen by the wave-3 HPO sweep
# (see reports/metrics.json detail.hpo.chosen — the two must agree).
retrieval_best:
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  embedding_slug: minilm
  chunk_size: 200
  top_k: 3
  rerank: true
# Verify-then-answer loop (wave 14): claim-level entailment check of the
# drafted answer against its cited chunks; unsupported claims are repaired or
# dropped, and answers below the support floor fall back to abstention.
# Overriden per run with `evaluate --verify/--no-verify` and `chat --verify/--no-verify`.
verify:
  enabled: true
  min_support: 0.6
  max_repair_calls: 2
# R6 inference-time evidence gate: refuse BEFORE generation when the retrieved
# evidence cannot plausibly answer the question. Thresholds calibrated on the
# open-gate tuning diagnostics run (reports/r6-diagnostics, 65 rows):
# zero correct answerable rows below coverage 0.625 or max-similarity 0.5, so
# both thresholds sit far from any measured false-abstention risk; the gate's
# measured correctness delta on tuning is nil post-verify (all abstain-expected
# rows already refuse via the support floor) — its value is operational
# (refuse before spending tokens) plus a defensive failsafe. Sweep:
# scripts/calibrate_gate.py.
evidence_gate:
  min_coverage: 0.2
  min_max_similarity: 0.4
