# Mirrors RAGConfig fields (see src/rag_agent/config.py). The CLI overlays
# this file onto the defaults when present; DVC tracks these keys for
# stage invalidation.
topics:
  - Climate
  - Renewable energy
  - Aviation
  - Machine learning
  - Photosynthesis
articles_per_topic: 120
max_scan_rows: 7000000
seed: 42
anchor_titles:
  Climate:
    - Climate change
    - Climate
    - Global warming
    - Greenhouse effect
  Renewable energy:
    - Renewable energy
    - Solar energy
    - Wind power
    - Hydroelectricity
    - Geothermal energy
    - Photovoltaics
    - Biofuel
  Aviation:
    - Aviation
    - Wright brothers
    - Aircraft
    - Airliner
    - Jet engine
    - Airport
    - History of aviation
  Machine learning:
    - Machine learning
    - Artificial intelligence
    - Deep learning
    - Artificial neural network
    - Reinforcement learning
    - Natural language processing
    - Large language model
    - Supervised learning
  Photosynthesis:
    - Photosynthesis
    - Chloroplast
    - Chlorophyll
    - Light-independent reactions
    - Carbon fixation
    - Algae
chunk_sizes:
  - 200
  - 400
  - 800
chunk_overlap: 40
embedding_model: sentence-transformers/all-MiniLM-L6-v2
reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2
top_k: 5
usd_per_mtok_input: 0.15
usd_per_mtok_output: 0.60
