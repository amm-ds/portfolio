[project]
name = "01-rag-agent"
version = "0.1.0"
description = "Portfolio project 01-rag-agent."
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "datasets>=3.0",
    "pydantic-ai>=1.0",
    "plotly>=5.24",
    "polars>=1.9",
    "numpy>=2.1",
    "ragas>=0.2",
    "langchain-community>=0.2,<0.4",
    "pillow>=10.0",
    "portfolio-core",
    "portfolio-eval",
]

[project.scripts]
rag_agent = "rag_agent.cli:app"

[tool.uv.sources]
portfolio-core = { workspace = true }
portfolio-eval = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_agent"]
