project_id: 07-open-data-mobility
short_version: >-
  Next-hour NYC taxi demand by zone, built on 41.2M real 2024 yellow-taxi
  trips and public weather: on a strict Oct-Dec holdout the model was 28%
  more accurate than same-hour-yesterday; its 90% upper band reached 91%
  coverage (sparse zones excepted).
figure_captions:
  hour_borough_heatmap: >-
    Full-year mean pickups by hour and borough. Manhattan peaks at 103.7
    pickups/zone-hour at 18:00; the Bronx tops out at 0.73.
  zone_hour_heatmap: >-
    Top-30-zone demand for the week of 2024-10-07. Midtown's weekday evening peak
    contrasts with flatter airport demand.
  zone_demand_map: >-
    Full-year mean pickups for the 263 TLC zones with official boundaries.
    Demand concentrates in Manhattan and at JFK/EWR; the busiest zone averages 213.9 pickups/hour.
  actual_vs_pred_top5: >-
    Fourteen days of actual, served-GBM and TemporalNet demand in the five busiest
    zones. City-wide served `gbm_tuned` MAE is 4.676 versus 6.517 for same hour yesterday.
  borough_mae: >-
    Test MAE by borough and run, with same-hour-yesterday lag-24 persistence in grey.
    Manhattan's volume drives absolute error; persistence still edges the default GBM in the Bronx.
  zone_fan: >-
    Served-GBM mean and p90 band against actuals for the two busiest zones over
    14 test days. City-wide empirical coverage is 90.8%.
  gbm_vs_nn: >-
    Q4 run ladder with same-hour-yesterday lag-24 in grey. Served `gbm_tuned` removes
    28.3% of MAE (MASE 0.763); xGB is best on test at −31.2%, while the NN wins MAPE only.
  p90_band: >-
    City-wide actual, served-GBM mean and p90 upper band over 14 test days.
    The band covers 90.8% of zone-hours against a 90% target.
  weather_elasticity: >-
    Raw rain-versus-dry pickup ratios on the test window. Outer-borough demand falls
    7–10%, Manhattan holds at 0.97× and EWR rises to 1.08×; directional, not causal.
sections:
  - id: background
    text_md: |
      **Next-hour taxi demand, zone by zone, on one laptop.** The input:
      41.2M real 2024 yellow-taxi trips plus public Central Park weather.
      On a strict October–December holdout (584,855 zone-hours) the served
      model cuts average error to 4.68 pickups per hour — 28% below the
      same-hour-yesterday rule — and its 90% upper band covers 90.8% of
      outcomes. Two flags: sparse zones under-cover at 84.7%; weather
      links are directional only.

      The pipeline diagram traces one straight path, left to right: two
      public feeds, one prepared zone-hour panel, one forecasting model.
      Read it as a promise that every box is replayable — then ask how
      good the forecast is.

      ```mermaid
      flowchart LR
          subgraph SRC["public sources"]
              TLC["TLC yellow taxis 2024, 41.2M trips"]
              WX["NOAA Central Park weather"]
          end
          subgraph PREP["prepared panel"]
              J["join + data-quality gates"]
              Z["zero-filled grid, 265 zones x 8,784 hours"]
          end
          subgraph FIT["forecast"]
              F["lag, calendar, weather features"]
              G["tuned GBM, mean + p90 twin"]
          end
          TLC --> J
          WX --> J
          J --> Z --> F --> G
          G --> S["served three-file bundle, showcase API"]
      ```

      **Business summary:** Last quarter of 2024: the model beat the
      yesterday rule by 1.8 missed pickups per zone-hour, and its 90% band
      was right 9 times in 10 — except in quiet zones.
    figures: []
    metrics_keys: []
  - id: objectives
    text_md: |
      **The question: can next-hour demand be forecast for all 265 zones,
      with a calibrated upper band a dispatcher can staff against, on one
      laptop?** Success had four measurable bars, each chosen so an
      outsider can check it:

      - At least 20% less error than the same-hour-yesterday baseline —
        the rule every dispatcher already trusts, so the model must beat
        real practice, not just beat chance.
      - A 90% upper band whose empirical coverage lands within about 2
        percentage points of the target — an honest band, not a
        decorative one.
      - The full pipeline under 8 GB of RAM, so any auditor can replay
        the study on ordinary hardware. Cloud instances were ruled out
        for exactly that reason.
      - One-command reruns an auditor can replay end to end.

      Weather stays a side question, read as association only — no causal
      claims. The evaluation contract diagram fixes the judging rules
      before any modeling: the left box is the train side (January
      through September 2024 features, with an embargoed expanding
      validation window where all tuning happens); the middle box is the
      test side (October through December, 584,855 zone-hours) scored
      once; the right box is the judge — four error readings plus the
      band-coverage check. Read it as a one-way gate: only the frozen
      winner crosses to the test side, and nothing learned there flows
      back. With the bars fixed, the next question is where the data
      comes from.

      ```mermaid
      flowchart LR
          subgraph TRAIN["train side"]
              T["Jan-Sep 2024 features"]
              V["embargoed validation, all tuning here"]
          end
          subgraph TEST["test side, scored once"]
              Q["Oct-Dec 2024, 584,855 zone-hours"]
          end
          subgraph JUDGE["judging"]
              M["four error readings vs yesterday rule"]
              C["p90 band vs 90 percent coverage"]
          end
          T --> V
          V -->|frozen winner| Q
          Q --> M
          Q --> C
      ```

      **Business summary:** The bars were set in advance: a fifth less error
      than the dispatcher's rule, an honest 90% band, laptop-class memory,
      and a rerun anyone can replay.
    figures: []
    metrics_keys: [naive_lag24, gbm_mean, temporal_net]
  - id: data
    text_md: |
      Two public sources, joined once. **NYC TLC yellow taxis:** 12 monthly
      2024 Parquet files, 41.2M trips, checksum-pinned, joined to the
      official zone lookup ([dataset card](https://amm-ds.github.io/portfolio/data-registry/nyc-tlc/)).
      **NOAA GHCN-Daily:** Central Park rain, snow and temperature; public
      domain; failed checks become missing
      ([dataset card](https://amm-ds.github.io/portfolio/data-registry/noaa-ghcn/)).

      The lineage diagram reads left to right as the build order. Both
      feeds first pass row checks — keys, zones, and timestamps on the
      taxi side, station quality flags on the weather side — because a
      bad row caught here is cheaper than a bad forecast later. The
      checked rows then meet at one zone lookup join: 263 mapped zones
      plus two honest buckets, N/A and Unknown, for trips that match no
      zone. Splitting those out was deliberate; hiding them inside a
      nearest zone would have invented demand where there is none. The
      join output is reindexed into the zero-filled grid, and the grid
      is written as a partitioned panel so the roughly 1.5 GB download
      happens once and every later run starts from the pinned local
      copies. The boundary stays deliberate: one vehicle class, one
      city, one year. With the panel built, the next question is what
      it actually looks like — and what trap it hides.

      ```mermaid
      flowchart LR
          A["TLC: 12 monthly Parquet, 41.2M trips"] --> J["row checks + zone lookup join"]
          W["NOAA: Central Park weather"] --> J
          J --> G["zero-filled grid, 265 x 8,784 zone-hours"]
          G --> P["partitioned panel, reused after download"]
      ```

      **Business summary:** Two public feeds — 41.2M taxi trips plus Central
      Park weather — join into one zone-hour panel, and nothing downloads
      twice.
    figures: []
    metrics_keys: []
  - id: eda
    text_md: |
      Judging was fixed before modeling. The holdout is strictly temporal:
      training sees January–September 2024. October–December (584,855
      zone-hours) stays untouched until the end. The bar is the baseline
      every dispatcher already uses: predict the same hour yesterday. Error
      is read four ways — MAE (mean absolute error, in missed pickups), RMSE
      (root-mean-square error), MAPE (mean absolute percentage error), and
      MASE (the error ratio, where 1.0 means parity with the baseline).
      Model choice ran on the embargoed validation window only. Band quality
      is judged by empirical coverage against the 90% target.

      One data trap matters most: the panel is reindexed to all 265 × 8,784
      = 2,327,760 zone-hours with explicit zeros, so "previous hour" truly
      means one hour back. Skipping the reindex was rejected — lags would
      silently jump over empty hours and every lag feature would lie.

      The two figures read the demand the model must learn. In the zone
      demand map, look first at the color concentration: Manhattan and the
      two airports glow while most of the 263 mapped zones stay dark; the
      busiest zone averages 213.9 pickups per hour. In the zone-hour
      heatmap, read each row as one day — Midtown's weekday evenings burn
      bright against the flat airport bands, the weekly rhythm that
      calendar features must carry. With the rules and the demand shape
      fixed, the question is which model earns the forecast.

      **Business summary:** Rules were set before modeling: strict time
      split, yesterday rule as bar, four error readings, and a 90% band
      judged on a grid where empty hours count as zero.
    figures: [zone_hour_heatmap, zone_demand_map]
    metrics_keys: []
  - id: training
    text_md: |
      **The served model is a tuned gradient-boosting regressor: 4.676
      pickups of average error on the holdout, 28.3% below the baseline, a
      MASE of 0.763 where 1.0 would mean no improvement.** The run-ladder
      figure puts every candidate on one test. Read the grey bar first —
      that is the same-hour-yesterday baseline — then each model's bar as
      its MAE on the holdout, lower being better: the served `gbm_tuned`
      clears the grey bar by a wide margin, and the ladder also shows the
      two challengers that beat it.

      Selection followed a fixed rule — best score on the embargoed
      validation window among candidates that clear the baseline. There
      the xGB challenger scored 3.182 and the LightGBM challenger 3.173
      against the incumbent's 3.165, so `gbm_tuned` serves even though the
      ladder shows xGB best on test at 4.487 (−31.2%). Picking the
      best-on-test candidate was rejected — that is leakage wearing a
      costume, and it would void the holdout. Default and tuned GBMs sit
      −0.2% apart, flat within noise. The neural challenger trails on
      absolute error (5.178 vs 4.676) and wins only the percentage
      metric.

      The p90 band is calibrated where data is dense — 90.8% coverage
      overall, Manhattan 91.4%, Staten Island 98.5% — but only 84.7% in
      sparse zones, so those zones are flagged. Feature importance agrees
      with the calendar shape: last week's hour (0.80) beats yesterday's
      hour (0.64), last hour (0.55), and hour of day (0.32); weather adds
      about zero to point accuracy, so it stays a side read rather than a
      selling point. The next question is what that error is worth at
      dispatch time.

      **Business summary:** A tuned booster serves, picked on a window the
      test never saw — 28% less error than the yesterday rule, flagging the
      quiet zones where its band runs tight.
    figures: [gbm_vs_nn]
    metrics_keys: []
  - id: evaluation
    text_md: |
      Operationally, −28.3% means 1.8 fewer missed pickups per zone-hour,
      where the baseline misses by 6.5. Three figures turn the forecast
      into a staffing decision. In the actual-versus-predicted figure,
      follow one zone's line across the 14 test days: the served model's
      line sits on the actual curve through the weekday swings, and the
      gaps that remain are the honest error. In the borough error figure,
      compare each borough's bar against the grey persistence bar —
      Manhattan's absolute error looks largest only because its volume is
      largest, while the Bronx shows the one place persistence still edges
      the default GBM. In the zone fan figure, read the shaded band as the
      staffing buffer: plan to the upper line and demand stays under it 9
      times in 10, except in the flagged sparse zones.

      Since training, a drift observatory re-scores each newly published
      month against the persisted model inside a ±15% tolerance — including
      2025-01, a month that did not exist at training time (exact drift
      numbers in conclusions). A month outside tolerance opens the response
      runbook; so far every scored month stays in-window. What remains is
      to say what holds city-wide and what refuses to transfer.

      **Business summary:** Serve it for yellow-taxi next-hour planning, size
      staffing from the 90% band, and keep the flagged sparse zones on
      manual watch.
    figures: [actual_vs_pred_top5, borough_mae, zone_fan]
    metrics_keys: [naive_lag24, gbm_mean, temporal_net]
  - id: results
    text_md: |
      The hour-borough heatmap figure holds the demand context. Read it
      cell by cell: rows are hours, columns are boroughs, and the color
      scale spans two orders of magnitude — Manhattan peaks at 103.7
      pickups per zone-hour at 18:00 while the Bronx tops out at 0.73.
      That contrast, not any single number, is what the model must
      absorb. The city-wide band figure shows the p90 line tracking
      actuals at 90.8% coverage — on target where zones are busy, tight at
      84.7% in sparse zones, and flagged there. The weather elasticity
      figure reads association only: outer-borough demand dips 7–10% on
      wet hours, Manhattan holds at 0.97×, EWR rises to 1.08× — no
      hour-of-week normalization, so not causal.

      Per-service weights are a hard boundary, and it was measured rather
      than assumed. Yellow-trained models lose the green-taxi March test
      to persistence on average error (0.296 vs 0.212); retrained on two
      months of green history, the same recipe wins on all three metrics
      (average error 0.1805 vs 0.212). Shipping one universal model was
      the rejected alternative. Nothing here speaks to other cities,
      fleets, or horizons beyond one hour. The full record — every run,
      the protocol, and the limits — lives in the conclusions.

      **Business summary:** The band is decision-grade where zones are busy
      and says where it is not; weather shifts demand only modestly; a
      second vehicle service needs its own two-month retrain.
    figures: [hour_borough_heatmap, p90_band, weather_elasticity]
    metrics_keys: [naive_lag24, gbm_mean, gbm_tuned, temporal_net, temporal_net_tuned]
  - id: conclusions
    text_md: |
      The full record behind the numbers above.

      ## Exact numbers

      Q4-2024 temporal holdout (train < 2024-10-01 ≤ test; 584,855
      zone-hours); ΔMAE is versus same-hour-yesterday lag-24. **Served is
      `gbm_tuned`, selected on embargoed validation — not the
      better-on-test challenger.**

      | run | MAE | RMSE | MAPE | MASE | ΔMAE |
      |---|---|---|---|---|---|
      | naive_lag24 (same hour yesterday) | 6.517 | 23.367 | 89.4% | 1.063 | — |
      | gbm_mean | 4.667 | 15.096 | 62.0% | 0.761 | −28.4% |
      | gbm_tuned ← served | 4.676 | 15.189 | 61.6% | 0.763 | −28.3% |
      | **gbm_xgb_tuned ← best test MAE** | **4.487** | **14.785** | **58.2%** | **0.732** | **−31.2%** |
      | gbm_lgbm_tuned | 4.582 | 14.794 | 59.9% | 0.747 | −29.7% |
      | temporal_net | 5.510 | 19.686 | 54.5% | 0.899 | −15.5% |
      | temporal_net_tuned | 5.178 | 21.580 | 57.5% | 0.845 | −20.5% |

      Validation window (MAE, lower is better): incumbent 3.165, LightGBM
      challenger 3.173, xGB challenger 3.182 — the serving rule keeps
      `gbm_tuned` even though both challengers beat it on test (xGB −4.1%
      relative MAE). Default vs tuned GBM: −0.2% relative MAE, flat within
      noise. NN tuning buys −6.0% MAE at a −5.6% MAPE cost.

      p90 coverage: overall 90.8% (target 90%); Manhattan 91.4%, Queens
      89.6%, Brooklyn 88.6%, Bronx 91.4%, EWR 94.5%, Staten Island 98.5%,
      Unknown 93.8%, sparse N/A zones 84.7% (under-cover, flagged).

      Permutation importance (tuned GBM): lag_168 0.80 > lag_24 0.64 >
      lag_1 0.55 > hour 0.32; weather ≈ 0 for point MAE — its value is the
      elasticity read, not point accuracy.

      Weather ratios (rain vs dry, test window): sparse N/A 0.89×, Queens
      0.92×, Staten Island 0.93× (outer-borough drops of 7–10%), Manhattan
      0.97×, Bronx 1.03×, EWR 1.08×.

      Drift observatory (persisted model, ±15% tolerance):

      - **2024-11:** MAE 5.0592 vs pinned 4.6763 (+8.19%), MAPE 65.45%,
        p90 coverage 90.6%, 152,110 zone-hours — in-window.
      - **2024-12:** MAE 5.0458 (+7.90%), MAPE 65.59%, coverage 91.2%,
        152,375 zone-hours — in-window.
      - **2025-01** (fetched live, first genuinely unseen month): MAE
        4.4420 (−5.01%), MAPE 59.60%, ΔMAE vs naive +34.6%, coverage
        87.4% — in-window.

      Green transfer (2024-03 green window, 197,160 zone-hours): the
      yellow-trained GBM loses average error to persistence (0.296 vs
      0.212) but wins RMSE (−17%) and MAPE (−19%). Retrained on green
      Jan–Feb (337,080 zone-hours): average error 0.1805 vs 0.212, RMSE
      0.688 vs 1.100, MAPE 66.4% vs 81.8% — all three metrics. The
      production bundle `gbm_green_served` is fit on all 534,240 curated
      green zone-hours in the identical three-file contract, indexed by
      `services.json`, served by `mobility.serving.predict_service`.
      Serving probe: the showcase API returned JFK zone 132 point 223.827
      and p90 251.811 (default yellow); `POST
      /projects/07-open-data-mobility/forecast` takes an optional
      `service=yellow|green` field, routes via `services.json`, echoes the
      choice, and returns 422 on an unknown service.

      ## Protocol

      - Split: temporal holdout — train < 2024-10-01 ≤ test; 584,855 scored
        zone-hours; no reselection after commit.
      - Tuning: Optuna on an embargoed, expanding, train-side validation
        window — 30 boosting trials, 10 neural-net trials, plus challenger
        arms; the test window was never visible to tuning.
      - MASE normalizes by the in-sample same-hour-yesterday error (≈6.13
        pickups/hour), so 1.0 = parity with the baseline.
      - Band: a quantile-0.9 GBM twin fit with the served recipe; judged by
        empirical coverage against the 90% target.
      - Grid: every panel reindexed to 265 zones × 8,784 hours with
        explicit zeros, so lag features are true one-hour steps.
      - Memory: lazy, streaming Polars scans; peak RAM ≈2 GB against the
        8 GB budget.
      - Drift: a scheduled observatory scores each published month against
        the persisted model at a ±15% tolerance; a regression opens the
        response runbook.

      ## Limits

      - One city, one vehicle class, one year, one hour ahead — no claim
        for other fleets, cities, or longer horizons.
      - Weather is association only: ratios lack hour-of-week
        normalization, and the band under-covers sparse zones (84.7%).
      - Trained weights are per-service: yellow models lose to persistence
        on green taxis until retrained on that service's own history.
      - Manhattan volume dominates absolute error; in the Bronx the default
        GBM still trails persistence.
      - Causal weather claims and longer-horizon forecasts stay deferred by
        design — they need a different study contract (randomized weather
        shocks; a multi-hour forecasting setup).

      ## Revision notes

      **Committed holdout (Q4-2024):** the seven-run ladder above was
      scored once on the frozen October–December window; the served
      artifact was frozen after selection on the embargoed validation
      window and never re-tuned against test.

      **Wave 15** productionized per-service retraining: the green-control
      recipe (default GBM family on the service's own history, quantile-0.9
      p90 twin) was fit on all 534,240 curated green zone-hours and
      persisted as `gbm_green_served` under `reports/models/serving/green/`,
      indexed by the typed `services.json` registry and served by
      `mobility.serving.predict_service`.

      **Drift record:** the scheduled observatory scored 2024-11 and
      2024-12 from local snapshots (+8.19% / +7.90% vs pinned MAE, both
      in-window), then 2025-01 — the first genuinely unseen month, fetched
      live through the checksum machinery — at −5.01%, also in-window.

      **Serving record:** the showcase API `service` field went live, with
      tests pinning default-yellow parity, green routing on the committed
      bundle, and 422 on unknown service.

      ## Reproduce

      The raw data is not shipped: the first run downloads about 1.5 GB of
      TLC and NOAA files — a long download — and later runs reuse the
      pinned local copies.

      ```bash
      uv run python -m mobility.cli all                          # full pipeline
      uv run python -m mobility.cli drift-check --month YYYY-MM  # observatory
      ```

      [MODEL_CARD.md](https://github.com/amm-ds/portfolio/tree/main/projects/07-open-data-mobility/MODEL_CARD.md)
      and `SERVING.md` document intended use and the artifact contract;
      committed evidence is under `reports/`.

      ```mermaid
      flowchart LR
          Q["new zone-hour batch"] --> D{"zone class"}
          D -->|"dense"| B["serve gbm_tuned<br/>mean + p90"]
          D -->|"sparse, flagged"| M["manual watch<br/>band at 84.7%"]
          D -->|"new service"| R["retrain on 2 months<br/>own history"]
          B --> O["drift observatory<br/>monthly, ±15% tolerance"]
          M --> O
          R --> O
          O --> X["regression opens<br/>response runbook"]
      ```

      **Business summary:** A tuned booster serves next-hour yellow-taxi
      demand at 4.676 MAE — 28.3% below the yesterday rule — with a 90% band
      at 90.8% coverage where zones are busy.
    figures: []
    metrics_keys: [naive_lag24, gbm_mean, temporal_net]
