    text: Streaming 41.2M-trip pipeline with temporal ladder, p90 calibration and served `gbm_tuned`.
  - status: delivered
    text: Green-transfer study + per-service retraining control (green-trained GBM beats persistence on all metrics); drift 2024-11 and 2024-12 scored in-window.
  - status: delivered
    text: >-
      First genuinely unseen drift month scored (2025-01 fetched live: MAE
      4.442 vs pinned 4.676, −5.0%, in-window; coverage 87.4%) and per-service
      retraining productionized (`gbm_green_served` bundle + typed
      `services.json` registry + `predict_service`).
  - status: delivered
    text: >-
      Showcase-API `service` field live: POST
      /projects/07-open-data-mobility/forecast accepts optional
      service=yellow|green (default yellow), routes via services.json, echoes
      it; API tests pin default-yellow parity, green routing on the committed
      bundle (differs from yellow), 422 on unknown service.
  - status: deferred
    text: Causal weather claims and longer-horizon forecasts — different study contracts.
