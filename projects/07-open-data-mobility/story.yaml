project_id: 07-open-data-mobility
figure_captions:
  hour_borough_heatmap: >-
    Full-year mean pickups by hour and borough. Manhattan peaks at 103.7
    pickups/zone-hour at 18:00; the Bronx tops out at 0.23.
  zone_hour_heatmap: >-
    Top-30-zone demand for the week of 2024-10-07. Midtown's weekday evening peak
    contrasts with flatter airport demand.
  zone_demand_map: >-
    Full-year mean pickups for all 265 TLC zones on official boundaries. Demand
    concentrates in Manhattan and at JFK/EWR; the busiest zone averages 213.9 pickups/hour.
  actual_vs_pred_top5: >-
    Fourteen days of actual, served-GBM and TemporalNet demand in the five busiest
    zones. City-wide served `gbm_tuned` MAE is 4.676 versus 6.517 for same hour yesterday.
  borough_mae: >-
    Test MAE by borough and run, with same-hour-yesterday lag-24 persistence in grey.
    Manhattan's volume drives absolute error; persistence still edges the default GBM in the Bronx.
  zone_fan: >-
    Served-GBM mean and p90 band against actuals for the two busiest zones over
    14 test days. City-wide empirical coverage is 90.8%.
  gbm_vs_nn: >-
    Q4 run ladder with same-hour-yesterday lag-24 in grey. Served `gbm_tuned` removes
    28.3% of MAE (MASE 0.763); xGB is best on test at −31.2%, while the NN wins MAPE only.
  p90_band: >-
    City-wide actual, served-GBM mean and p90 upper band over 14 test days.
    The band covers 90.8% of zone-hours against a 90% target.
  weather_elasticity: >-
    Raw rain-versus-dry pickup ratios on the test window. Outer-borough demand falls
    7–10%, Manhattan holds at 0.97× and EWR rises to 1.08×; directional, not causal.
sections:
  - id: background
    text_md: |
      **Result.** On the strict Q4-2024 holdout (584,855 zone-hours), served
      `gbm_tuned` reaches MAE 4.676 pickups/hour, 28.3% below
      same-hour-yesterday persistence (MASE 0.763); its p90 band covers 90.8%
      overall but only 84.7% in sparse N/A-borough zones.

      **Data.** Real 2024 data: 41.2M NYC TLC yellow-taxi trips in 12
      checksum-pinned Parquet files (~1.5 GB) joined with public-domain NOAA
      Central Park weather; raw data is downloaded, not shipped.

      **Limits.** One city, vehicle class, year and hour-ahead horizon;
      results are associative, not causal, weather ratios lack hour-of-week
      normalization, and yellow-trained weights need per-service retraining.

      Stage taxis before demand arrives at zone-hour granularity. The pipeline
      turns 41.2M raw trips into a zero-filled 265-zone × hour grid, a next-hour
      forecast and a p90 staffing buffer.

      ```mermaid
      flowchart LR
          A[raw trip events] --> B[zone-hour demand]
          B --> C[next-hour forecast]
          C --> D[staffing decisions]
      ```

      Served `gbm_tuned` reduces Q4 MAE by 28.3% versus the same-hour-yesterday
      rule; sparse-zone coverage remains an explicit exception.

      **Business summary:** the served artifact forecasts next-hour demand for
      every NYC zone at 28.3% less error than yesterday-same-hour, and its
      calibrated p90 band (90.8% coverage, sparse zones excepted at 84.7%)
      sizes per-zone staffing buffers; treat the band as unusable for staffing
      decisions in the zones it under-covers.
    figures: []
    metrics_keys: []
  - id: objectives
    text_md: |
      Deliver next-hour demand for every zone plus a calibrated upper band, and
      measure directional weather associations without calling them causal.

      | criterion | target | reason |
      |---|---|---|
      | MAE vs lag-24 | ≥20% reduction | beat same hour yesterday |
      | p90 coverage | ≈90% (±2 pp) | defensible staffing buffer |
      | peak RAM | <8 GB | laptop-scale pipeline |
      | reproduction | one command, minutes | auditable reruns |
    figures: []
    metrics_keys: [naive_lag24, gbm_mean, temporal_net]
  - id: data
    text_md: |
      - **NYC TLC yellow taxis:** 41.2M trips in 12 monthly 2024 Parquet files,
        checksum-pinned and joined to the zone lookup ([dataset card](https://amm-ds.github.io/portfolio/data-registry/nyc-tlc/)).
      - **NOAA GHCN-Daily:** Central Park precipitation, snowfall and temperature;
        public domain, QC failures treated as missing ([dataset card](https://amm-ds.github.io/portfolio/data-registry/noaa-ghcn/)).

      The declared boundary is one vehicle class, city and year. No raw data ships:
      the first run downloads ~1.5 GB, then later stages use pinned local copies.
    figures: []
    metrics_keys: []
  - id: eda
    text_md: |
      Weekdays are twin-peaked, weekends flatten, and Manhattan dominates volume.
      Sparse zone-hours are the key engineering trap: the curated table reindexes
      to all **265 × 8,784 = 2,327,760** zone-hours with explicit zeros before
      lag computation. Otherwise “previous observed hour” silently is not t−1h.
    figures: [zone_hour_heatmap, zone_demand_map]
    metrics_keys: []
  - id: training
    text_md: |
      Lazy/streaming Polars scans each month, applies DQ gates and aggregates to
      zone-hours at ~2 GB observed peak RAM. Models are HistGradientBoosting mean
      and p90 quantile variants plus a hand-written torch TemporalNet loop; the
      target uses log1p space for multiplicative demand.

      Splits are strictly temporal (train < 2024-10-01 ≤ test), with 24-hour-
      embargoed expanding-window CV. Optuna (30 GBM, 10 NN trials, plus challenger
      arms) sees only train-side validation, never the Q4 test window.

      ```mermaid
      flowchart LR
          A[monthly DQ gates] --> B[zero-filled grid]
          B --> C[lags + calendar]
          C --> T[train-side Optuna]
          T --> G[GBM mean + p90]
          T --> N[TemporalNet]
          G --> P[predictions]
          N --> P
      ```
    figures: []
    metrics_keys: []
  - id: evaluation
    text_md: |
      The holdout is October–December 2024 (584,855 zone-hours), scored against
      **naive lag-24 persistence: the same hour yesterday**, not last week.
      Metrics include MAE/RMSE/MAPE/MASE, borough slices, permutation importance
      and p90 coverage. Serving selection uses embargoed validation, not test.

      The scheduled drift observatory scores newly published TLC months against
      the persisted model with training-identical features and a ±15% tolerance;
      regressions can open an issue through the response runbook. Two months are
      scored now (local snapshot): 2024-11 at +8.2% and 2024-12 at +7.9%, both
      in-window — so the wiring, the DQ gates and the reporting contract are
      verified, but no month has yet exceeded tolerance, meaning true
      unseen-drift behavior is still unmeasured.
    figures: [actual_vs_pred_top5, borough_mae, zone_fan]
    metrics_keys: [naive_lag24, gbm_mean, temporal_net]
  - id: results
    text_md: |
      Q4 holdout ladder; ΔMAE is versus same-hour-yesterday lag-24. **Served is
      `gbm_tuned`, selected on validation, not the better-on-test xGB challenger.**

      | run | MAE | RMSE | MAPE | MASE | ΔMAE vs naive |
      |---|---|---|---|---|---|
      | naive_lag24 (same hour yesterday) | 6.517 | 23.367 | 89.4% | 1.063 | — |
      | gbm_mean | 4.667 | 15.096 | 62.0% | 0.761 | −28.4% |
      | gbm_tuned ← served | 4.676 | 15.189 | 61.6% | 0.763 | −28.3% |
      | **gbm_xgb_tuned ← best test MAE** | **4.487** | **14.785** | **58.2%** | **0.732** | **−31.2%** |
      | gbm_lgbm_tuned | 4.582 | 14.794 | 59.9% | 0.747 | −29.7% |
      | temporal_net | 5.510 | 19.686 | 54.5% | 0.899 | −15.5% |
      | temporal_net_tuned | 5.178 | 21.580 | 57.5% | 0.845 | −20.5% |

      MASE normalizes by in-sample lag-24 error; parity is 1.0.

      - **Tuning:** default and tuned GBMs are flat within noise. xGB beats the
        incumbent on Q4 (−4.1% relative MAE) but loses on embargoed validation,
        so `gbm_tuned` remains served. NN tuning buys −6.0% MAE at a −5.6% MAPE cost.
      - **Uncertainty:** p90 coverage is 90.8% overall; Manhattan 91.4%, Queens
        89.6%, sparse N/A zones 84.7% (under-cover) and Staten Island 98.5%.
      - **Negative weather result for point accuracy:** importance is lag_168
        0.80 > lag_24 0.64 > lag_1 0.55 > hour 0.32; weather is ≈0. Raw rain
        ratios still show outer-borough drops of 7–10%, directional only.
      - **Transfer:** yellow-trained GBMs lose green-taxi MAE to persistence
        (0.296 vs 0.212) but win RMSE (−17%) and MAPE (−19%); retrain per
        service. The control now exists: a GBM fit on green Jan–Feb itself
        (`gbm_green_retrained`, `reports/green_transfer.json`) beats green
        persistence on **all three** metrics — MAE 0.1805 vs 0.212, RMSE
        0.688 vs 1.100, MAPE 66.4% vs 81.8% — so the mixed transfer was a
        service-distribution gap, not a sparsity law: per-service retraining
        is the fix, measured.
      - **Serving probe:** the showcase API returned JFK zone 132 point 223.827
        and p90 251.811.

      **Business summary:** served as-is for yellow-taxi next-hour planning
      (−28.3% MAE vs persistence on a strict temporal holdout); size staffing
      buffers from the p90 band except in the flagged sparse zones (84.7%
      coverage); and for any second vehicle service, budget a per-service
      retraining run first — two months of green history already beat
      persistence on every metric measured.
    figures: [hour_borough_heatmap, gbm_vs_nn, p90_band, weather_elasticity]
    metrics_keys: [naive_lag24, gbm_mean, gbm_tuned, temporal_net, temporal_net_tuned]
  - id: conclusions
    text_md: |
      Streaming aggregation, explicit zero-filled grids and temporal validation
      make the 41.2M-row result reproducible on a laptop. The served model's
      measured result is **MAE 4.676, −28.3% versus same hour yesterday, MASE
      0.763**. The p90 band is useful where calibrated and flagged where sparse;
      weather findings remain directional, the drift observatory has scored two
      months in-window (wiring verified, unseen drift still unmeasured), and
      the green-transfer question is settled: yellow weights transfer mixed,
      per-service retraining beats persistence on every metric at two months of
      history. [MODEL_CARD.md](https://github.com/amm-ds/portfolio/tree/main/projects/07-open-data-mobility/MODEL_CARD.md)
      and `SERVING.md` document intended use and the artifact contract.

      **Business summary:** keep serving `gbm_tuned` for yellow-taxi planning;
      the buffer band is decision-grade except in sparse zones; extend to a new
      vehicle service only behind a green-scale retraining run, and treat the
      drift observatory as a watchdog whose alarm path is wired but untested by
      a real regression so far.
    figures: []
    metrics_keys: [naive_lag24, gbm_mean, temporal_net]
roadmap:
  - status: delivered
    text: Streaming 41.2M-trip pipeline with temporal ladder, p90 calibration and served `gbm_tuned`.
  - status: delivered
    text: Green-transfer study + per-service retraining control (green-trained GBM beats persistence on all metrics); drift 2024-11 and 2024-12 scored in-window.
  - status: remaining
    text: Score the first genuinely unseen drift month (2025-01+ needs a network fetch) and productionize per-service retraining.
  - status: deferred
    text: Causal weather claims and longer-horizon forecasts — different study contracts.
