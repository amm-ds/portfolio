  - status: delivered
    text: >-
      Temporal holdout run ladder (naive vs GBM vs TemporalNet) with tuned
      variants and calibrated p90 band (90.8% coverage) — shipped, verified.
  - status: delivered
    text: >-
      Serving artifact per SERVING.md (tuned GBM + p90 + zones) with the
