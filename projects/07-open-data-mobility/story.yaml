project_id: 07-open-data-mobility
figure_captions:
  eda_trips_profile: >-
    Mean pickups per zone-hour by hour of day, one line per borough, over the
    full-year 2024 curated grid. Weekdays are twin-peaked (08:00 and 18:00)
    while weekend profiles flatten — and Manhattan dominates the volume every
    hour.
  zone_hour_heatmap: >-
    Hour-of-week pickup demand for the top 30 zones by volume, grouped by
    borough, for the week of 2024-10-07 (first full Monday of the test
    window). Midtown's 18:00 weekday peak stands out while the airports run
    flat around the clock.
  zone_demand_map: >-
    Mean pickups per zone-hour for all 265 TLC zones across 2024, on official
    TLC boundaries. Demand concentrates in the Midtown/Manhattan cores and at
    JFK/EWR; the busiest zone averages 213.9 pickups/hour.
  actual_vs_pred_top5: >-
    Day-over-day actual (pink), GBM (teal) and TemporalNet (sky) pickups for
    the five busiest zones on a 14-day test slice. Both models track the
    daily shape; city-wide the served GBM scores MAE 4.67 vs 6.52 for "same
    hour last week".
  borough_mae: >-
    Test MAE by borough for every run, naive lag-24 persistence in grey.
    Manhattan drives the absolute error simply because its volume is highest
    — in the Bronx persistence still edges the GBM.
  zone_fan: >-
    Per-zone forecast fans for the two busiest zones: GBM mean with the p90
    band (shaded) against actuals, over the same 14-day window as the
    city-wide band. The band carries the same 90.8% calibration.
  gbm_vs_nn: >-
    Holdout run ladder — MAE bars with a MASE parity line (left) and MAPE
    (right), naive lag-24 in grey. The served GBM removes 28.4% of error vs
    persistence (MASE 0.76); the tuned xGB variant is best (−31.2%), and the
    neural net wins MAPE only.
  p90_band: >-
    City-wide actual vs GBM mean and p90 upper band over 14 days of the test
    window, summed across 265 zones. The band covers 90.8% of realized
    zone-hours against a 90% target.
  weather_elasticity: >-
    Ratio of mean pickups on rain (≥1 mm) vs dry hours, by borough, on the
    test window. Rain cuts outer-borough demand 7–10% (Queens 0.92×, Staten
    Island 0.93×) while Manhattan holds at 0.97× and EWR rises to 1.08× —
    directional, not causal.
sections:
  - id: background
    text_md: |
      Taxi and ride-hail demand is the classic urban-mobility planning
      problem: fleets must be staged before demand arrives, drivers shifted
      between boroughs, and surge/pricing policies tuned hour by hour.

      - **Every decision is a forecast:** staging and shift choices are
        hour-ahead, zone-level demand estimates — a wrong one is either an
        idle fleet or missed pickups.
      - **The data is real and messy:** 41.2M NYC TLC yellow-taxi trips
        (2024) joined with NOAA weather, processed under a laptop-scale
        memory budget.

      ```mermaid
      flowchart LR
          A[raw trip events] --> B[zone-hour demand]
          B --> C[next-hour forecast]
          C --> D[staffing decisions]
      ```

      That chain moves 41.2M raw trip events into a 2.33M-row
      zone × hour demand grid, adds a p90 uncertainty band to the
      next-hour forecast, and drives staffing and fleet decisions.

      This project builds that forecast from the ground up on **real,
      messy, public data** — not a clean Kaggle extract — and quantifies
      how much weather moves the numbers a planner would act on: on a strict
      future holdout the model removes 28.4% of forecast error vs "same hour
      last week".

      **Business summary:** Fleets must be staged and drivers shifted
      before demand arrives, so every staging choice is an hour-ahead
      bet on where pickups will happen — a wrong one is either an idle
      fleet or missed revenue. The signal that de-risks that bet is a
      demand forecast for each of the city's 265 taxi zones, hour by
      hour, with an uncertainty band a dispatcher can staff against. On
      real, messy public data — 41.2M trips joined with weather — this
      project turns that guesswork into a scheduled decision, cutting
      forecast error by 28.4% against the "same hour last week" rule on
      a strict future holdout.
    figures: []
    metrics_keys: []

  - id: objectives
    text_md: |
      The target is **next-hour pickup demand for every NYC taxi zone**
      (265 zones), with two model families and a calibrated uncertainty band,
      answering two business questions: how much better than "same hour
      last week" do modern models get, and what does rain do to curb
      demand?

      - **Point forecast plus buffer:** a gradient-boosted (GBM) mean
        plus a calibrated **p90 (90th-percentile) upper band** per
        zone-hour — the number a dispatcher can staff against.
      - **Weather claims:** every weather statement is labelled
        directional, not causal.
      - **Success gates:**

      | criterion | target | why it matters |
      |---|---|---|
      | MAE vs naive lag-24 | ≥ 20% reduction | clearly beats "same hour last week" |
      | p90 band coverage | ≈ 90% (±2 pp) | buffers a client can staff against |
      | peak RAM | < 8 GB | runs on a laptop, not a cluster |
      | reproduction | one command, minutes of compute | auditable inside the client's environment |

      The deliverable is a forecast plus a defensible buffer size, not a
      leaderboard entry.

      **Business summary:** The deliverable is a staffing decision, not
      a leaderboard entry: expected demand per zone and hour, plus a
      calibrated p90 upper band — the 90th percentile, the demand level
      exceeded only about one hour in ten — which sizes how many extra
      vehicles to hold. The targets are set to be decision-grade: beat
      "same hour last week" by at least 20% on error, keep the band
      within two points of its 90% target, and stay under an 8 GB memory
      footprint so it runs on a laptop. A second question is answered
      with care: what rain does and does not tell you — every weather
      claim is labelled directional, not causal.
    figures: []
    metrics_keys: [naive_lag24, gbm_mean, temporal_net]

  - id: data
    text_md: |
      Two public datasets, both licensed for commercial use and
      re-obtainable by a single command:

      - **NYC TLC yellow-taxi trip records** — 12 consecutive monthly
        Parquet files (2024-01 … 2024-12): 41.2M trips, ~1.5 GB
        compressed, downloaded anonymously under NYC TLC terms of use and
        checksum-pinned so any upstream republication fails loudly; joined
        with the TLC taxi-zone lookup (LocationID → borough/zone). Dataset
        card: [data-registry/nyc-tlc](https://amm-ds.github.io/portfolio/data-registry/nyc-tlc/).
      - **NOAA GHCN-Daily** (Central Park station USW00094728, public
        domain, US Government work) — daily precipitation, snowfall, and
        max/min temperature; quality-control flags honoured, failed QC ⇒
        treated as missing. Dataset card:
        [data-registry/noaa-ghcn](https://amm-ds.github.io/portfolio/data-registry/noaa-ghcn/).

      The bounded slice — one vehicle class, one city, one year — is the
      declared laptop-friendly boundary: large enough to be credible at real
      scale, small enough to re-run in minutes.

      **Business summary:** Both inputs are public and licensed for
      commercial use: a full year of New York yellow-taxi trip records —
      41.2M trips across 12 monthly files — and a public-domain weather
      station's daily precipitation and temperature. Each is
      checksum-pinned, so any upstream republication that changes the
      data fails loudly rather than silently shifting the results. The
      whole analysis re-obtains by a single command and reproduces
      inside a client's own environment, with no proprietary data
      dependency; the bounded slice (one vehicle class, one city, one
      year) is deliberate — credible at real scale, small enough to
      re-run in minutes.
    figures: []
    metrics_keys: []

  - id: eda
    text_md: |
      Demand is sharply structured, and that structure drove the key
      engineering decision.

      - **Twin-peaked weekdays:** morning and evening rush profiles
        flatten on weekends — visible in `eda_trips_profile` and the
        `zone_hour_heatmap`.
      - **Geography concentrates volume:** Manhattan dominates while outer
        boroughs and airports (EWR, "Unknown" zones) run sparse — mapped
        directly in `zone_demand_map`.
      - **Sparsity is the trap:** many zone-hours have **zero** pickups, so
        the curated table is reindexed onto the complete zone × hour grid
        (265 × 8,784 = 2,327,760 rows) with explicit zeros. Without it, lag
        features silently misalign — "previous observed hour" is not t-1h
        for a sparse zone.

      Demand is hour-and-borough driven, not evenly spread.

      **Business summary:** Demand is sharply structured: weekdays are
      twin-peaked (morning and evening rush), weekends flatten, and
      Manhattan dominates volume in every hour. The trap is sparsity —
      many zone-hours have zero pickups — so the data is rebuilt on a
      complete zone-by-hour grid with explicit zeros before any feature
      is computed; without that, "last hour" silently means the wrong
      thing in quiet zones. The staffing consequence: the 18:00
      Manhattan peak and the flat, around-the-clock airports need very
      different plans, and this analysis is what turns a city-wide
      average into per-zone staffing decisions.
    figures: [eda_trips_profile, zone_hour_heatmap, zone_demand_map]
    metrics_keys: []

  - id: training
    text_md: |
      The pipeline is lazy/streaming **Polars** end-to-end: raw trips are
      never materialised.

      - **Bounded compute:** each month is scanned, cleaned, and
        aggregated to the zone-hour grain under a ~2 GB RAM peak.
      - **DQ contracts per month:** null-rate ceilings, range checks,
        freshness, row-count floor; failures halt the pipeline loudly.
      - **Models:** a gradient-boosting mean (sklearn
        `HistGradientBoosting`, NaN-native) plus a **p90 quantile GBM** for
        uncertainty bands; and **TemporalNet**, a small torch MLP trained
        with a fully hand-written loop (DataLoader, Adam, gradient
        clipping, early stopping). The target is trained in log1p space
        because demand is multiplicative.
      - **Leak-proof tuning:** splits are purely temporal (train <
        2024-10-01 ≤ test) with a 24-hour-embargoed expanding-window CV
        for early stopping; **Optuna** (30 GBM trials with median pruning,
        10 NN trials) sees the last train-side validation fold only — the
        test window is never touched.

      ```mermaid
      flowchart LR
          A[per-month DQ gates] --> B[zone-hour grid]
          B --> C[lags + calendar]
          C --> T[Optuna tuning]
          T --> G[GBM mean, p90]
          T --> N[TemporalNet]
          G --> P[predictions.parquet]
          N --> P
      ```

      The method section is the audit trail: no leakage inflates the
      numbers before the headline error rates are trusted.

      **Business summary:** The pipeline streams the raw data month by
      month, never materialising the full 41.2M trips, with a memory
      peak around 2 GB — it fits on a laptop, not a cluster.
      Data-quality contracts run per month and halt the pipeline loudly
      on violation, and tuning follows a leak-proof protocol: temporal
      splits only, with the test window never touched. So a client can
      read the method as an audit trail, verify the protocol, and re-run
      the entire fit before betting a fleet plan on the model.
    figures: []
    metrics_keys: []

  - id: evaluation
    text_md: |
      Holdout: **October–December 2024** (584,855 zone-hours), a pure
      temporal split so drift is priced in by design; every model is
      compared against **naive lag-24 persistence** (same hour last week).

      - **Metric set:** MAE/RMSE/MAPE overall and per borough
        (`borough_mae`), permutation importance of the tuned GBM, and p90
        calibration against the 90% target; `actual_vs_pred_top5` shows the
        fit on the busiest zones.
      - **Leak-proof tuning:** Optuna saw only the last expanding-window
        validation fold (24 h embargo, train side); the test window is
        never touched.
      - **Deployment-shaped protocol:** scoring the most recent quarter —
        not a random shuffle — is the closest analogue to deploying
        forward; `zone_fan` renders per-zone forecast fans for dispatcher
        drill-down.

      That question does not stop at delivery: monitoring is running software,
      not a runbook. The scheduled Thursday `drift-observatory` workflow
      (`.github/workflows/drift-observatory.yml`) scores each newly published
      TLC month against the **persisted serving
      model** (`mobility.cli drift-check --month YYYY-MM`, reports in
      `reports/drift/`): light DQ gates, training-identical features, MAE
      vs the pinned test baseline; beyond the ±15% tolerance it exits 1
      and opens an issue per `docs/runbooks/drift-response.md`, while
      unpublished months exit 2. First scored month (2024-11): +8.2% vs
      pinned, inside tolerance — but that month is in-window, so this is a
      wiring check; the observatory's real value starts with the first
      unseen month.

      **Business summary:** Evaluation mimics deployment: models are
      scored on a pure future quarter rather than a random shuffle, so
      drift is priced in by design, and every model is compared against
      the "same hour last week" rule. Just as important is what happens
      after delivery: a scheduled workflow scores each newly published
      month of data against the persisted serving model, with light
      quality gates and a ±15% tolerance. Breach the tolerance and the
      check fails and opens a tracked issue with a response runbook —
      the client inherits a monitoring contract, not just a model,
      instead of waiting for the next quarterly review to find out the
      forecast has gone stale.
    figures: [actual_vs_pred_top5, borough_mae, zone_fan]
    metrics_keys: [naive_lag24, gbm_mean, temporal_net]

  - id: results
    text_md: |
      Q4 holdout run ladder (pickups/hour); lower is better, ΔMAE vs the
      naive lag-24 floor, bold row = ladder's best, ← served marks the
      incumbent:

      | run | MAE | RMSE | MAPE | MASE | ΔMAE vs naive |
      |---|---|---|---|---|---|
      | naive_lag24 (persistence) | 6.517 | 23.367 | 89.4% | 1.063 | — |
      | gbm_mean ← served | 4.667 | 15.096 | 62.0% | 0.761 | −28.4% |
      | gbm_tuned (30 trials) | 4.676 | 15.189 | 61.6% | 0.763 | −28.3% |
      | **gbm_xgb_tuned (15 trials) ← best** | **4.487** | **14.785** | **58.2%** | **0.732** | **−31.2%** |
      | gbm_lgbm_tuned (15 trials) | 4.582 | 14.794 | 59.9% | 0.747 | −29.7% |
      | temporal_net | 5.510 | 19.686 | 54.5% | 0.899 | −15.5% |
      | temporal_net_tuned (10 trials) | 5.178 | 21.580 | 57.5% | 0.845 | −20.5% |

      MASE 1.0 = persistence parity; served GBM 0.76 (`gbm_vs_nn`).

      - **GBM tuning was flat:** tuned ≈ defaults within noise — tuning
        will not rescue weak features.
      - **Challengers lost on validation:** xgb beat the incumbent on the
        Q4 test (−4.1% MAE) but lost on embargoed validation — `gbm_tuned`
        stays served; serving keys on validation.
      - **p90 calibration: 90.8% overall** (`p90_band`; target 90%):
        Manhattan 91.4% / Queens 89.6% tight; sparse N/A zones 84.7%
        under-cover (flagged, not filled); Staten Island 98.5%.
      - **Importance is temporal**: lag_168 0.80 > lag_24 0.64 > lag_1
        0.55 > hour 0.32; weather ≈ 0 for point MAE — a negative result,
        reported not hidden; the payoff is the elasticity signal
        (`weather_elasticity`): rain ≥1 mm drops outer-borough demand
        7–10% (Queens 0.92×, Staten Island 0.93×), Manhattan holds 0.97×,
        EWR rises 1.08× — directional, not causal.
      - **Cross-service transfer:** yellow-trained GBMs lose MAE to green
        persistence (0.296 vs 0.212; green demand is far sparser) but win
        RMSE (−17%) and MAPE (−19%); per-service retraining is
        recommended.
      - **Serving is live:** the showcase API returned JFK (zone 132):
        223.827 point / 251.811 p90.

      **Business summary:** The served model removes 28.4% of forecast
      error versus "same hour last week" on a strict future quarter, and
      the challenger that scored better on the test window was kept out
      of serving because it lost on embargoed validation — serving keys
      on validation, not on the flattering split. The p90 band is
      calibrated where it matters: 90.8% coverage overall against the
      90% target, which yields a defensible buffer of extra vehicles per
      hour. The exception is stated, not hidden: sparse zones with no
      borough assignment under-cover at 84.7%, so staff from the band in
      dense boroughs and fall back to simple rules in the flagged zones.
    figures: [gbm_vs_nn, p90_band, weather_elasticity]
    metrics_keys: [naive_lag24, gbm_mean, gbm_tuned, temporal_net, temporal_net_tuned]

  - id: conclusions
    text_md: |
      Lessons that transfer to the next engagement:

      - **Scale is a discipline, not a budget:** 41.2M rows processed
        month-by-month through streaming aggregation, observed peak under
        3 GB — it runs on a laptop.
      - **Data contracts earn trust:** per-month DQ gates caught a 2002
        trip inside a 2024 file and 5–13% null passenger counts before they
        could poison the lag features.
      - **Baselines anchor the comparison:** the raw-count NN scored *below*
        persistence until a log1p target transform fixed the loss
        geometry — visible only because the naive baseline was always in
        the comparison.
      - **Calibration is a deliverable:** the p90 band turns a forecast
        into a staffing number; the flagged N/A-zone under-coverage shows
        where not to trust it.
      - **Monitoring is software, not a runbook:** the drift observatory
        scores every new TLC month against the persisted serving model and
        opens an issue on regression (`docs/runbooks/drift-response.md`) —
        2024-11 (+8.2%, within tolerance) is only the wiring check.
      - The served model ships with a model card (`MODEL_CARD.md`) —
        intended use, slices, limits: the procurement one-pager.

      **Results quality: strong on dense zones, caveated on sparse
      ones.** The 28.4% error cut and 90.8% band hold on dense zones;
      flagged N/A zones under-cover at 84.7% — staff from the band in
      dense boroughs, fall back to persistence rules in flagged zones.

      **Business summary:** The lesson for a buyer is about procurement
      leverage: this level of rigour — 41.2M rows, a strict temporal
      holdout, calibrated uncertainty bands, and an automated drift
      monitor — runs on a laptop under a 3 GB memory footprint and
      re-runs in minutes. Enterprise-grade discipline does not require
      enterprise-grade infrastructure, and the re-runnability is the
      guarantee: the client's own team can reproduce every number rather
      than take them on trust. The known limits ship with the results —
      sparse zones under-cover, and per-service retraining is
      recommended when transferring to a different fleet — so the honest
      caveats are part of the deliverable.
    figures: []
    metrics_keys: [naive_lag24, gbm_mean, temporal_net]

