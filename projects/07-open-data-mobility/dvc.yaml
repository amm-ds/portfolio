stages:
  download:
    cmd: uv run python -m mobility.cli download
    deps:
      - src/mobility/download.py
      - src/mobility/config.py
    outs:
      - data/raw

  validate:
    cmd: uv run python -m mobility.cli validate
    deps:
      - src/mobility/validate.py
      - src/mobility/schemas.py
      - data/raw
    outs:
      - data/validated
      - reports/dq
      - reports/dq_validated.md
      - reports/dq_validated.html

  join:
    cmd: uv run python -m mobility.cli join
    deps:
      - src/mobility/join.py
      - data/validated
    outs:
      - data/curated

  features:
    cmd: uv run python -m mobility.cli features
    deps:
      - src/mobility/features.py
      - data/curated
    params:
      - lags
      - train_cutoff
    outs:
      - data/features

  tune:
    cmd: uv run python -m mobility.cli tune
    deps:
      - src/mobility/tune.py
      - src/mobility/model.py
      - data/features
    params:
      - hpo
      - seed
    outs:
      - reports/models/hpo_gbm.json
      - reports/models/hpo_nn.json

  train_baselines:
    cmd: uv run python -m mobility.cli train-baselines
    deps:
      - src/mobility/model.py
      - src/mobility/features.py
      - data/features
      - reports/models/hpo_gbm.json
    params:
      - max_train_rows
      - gbm
      - gbm_tuned
      - xgb_tuned
      - lgbm_tuned
      - seed
    outs:
      - reports/models/predictions_baseline.parquet

  train_arms:
    cmd: uv run python -m mobility.cli train-arms
    deps:
      - src/mobility/arms.py
      - data/features
      - reports/models/predictions_baseline.parquet
    params:
      - hpo
      - max_train_rows
      - seed
    outs:
      - reports/models/hpo_xgb.json
      - reports/models/hpo_lgbm.json
      - reports/models/gbm_xgb_tuned.joblib
      - reports/models/gbm_p90_xgb_tuned.joblib
      - reports/models/gbm_lgbm_tuned.joblib
      - reports/models/gbm_p90_lgbm_tuned.joblib
      - reports/models/predictions_baseline.parquet

  train_nn:
    cmd: uv run python -m mobility.cli train-nn
    deps:
      - src/mobility/model.py
      - data/features
      - reports/models/predictions_baseline.parquet
      - reports/models/predictions_arms.parquet
      - reports/models/hpo_nn.json
    params:
      - nn
      - nn_tuned
      - seed
    outs:
      - reports/models/temporal_net.pt
      - reports/models/temporal_net_norm.json
      - reports/models/temporal_net_tuned.pt
      - reports/models/temporal_net_tuned_norm.json
      - reports/models/predictions.parquet

  evaluate:
    cmd: uv run python -m mobility.cli evaluate
    deps:
      - src/mobility/evaluate.py
      - reports/models/predictions.parquet
      - data/curated
    outs:
      - reports/figures
    metrics:
      - reports/metrics.json

  transfer:
    cmd: uv run python -m mobility.cli transfer
    deps:
      - src/mobility/transfer.py
      - data/curated
      - reports/models/gbm_tuned.joblib
    outs:
      - reports/green_transfer.json

  serving:
    cmd: uv run python -m mobility.cli build-serving-artifact
    deps:
      - src/mobility/serving.py
      - reports/models/gbm_tuned.joblib
      - reports/models/gbm_p90_tuned.joblib
      - data/curated/zones.parquet
      - data/features/test.parquet
    outs:
      - reports/models/serving

  dashboard:
    cmd: uv run python -m mobility.cli dashboard
    deps:
      - src/mobility/evaluate.py
      - reports/models/predictions.parquet
      - data/curated
    outs:
      - reports/report.html
