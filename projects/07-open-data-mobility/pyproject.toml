[project]
name = "07-open-data-mobility"
version = "0.1.0"
description = "Portfolio project 07-open-data-mobility."
requires-python = ">=3.12"
dependencies = [
    "polars>=1.9",
    "scikit-learn>=1.5",
    "torch>=2.4",
    "typer>=0.12",
    "plotly>=5.24",
    "numpy>=2.1",
    "pyarrow>=17",
    # GBM HPO challenger arms (wave 11): same gradient-boosting family as the
    # sklearn baseline so the run ladder isolates library differences, not model class.
    "xgboost>=2.0",
    "lightgbm>=4.0",
    # Flagship geo view (wave 13): TLC zone choropleths (boundaries source
    # pinned in the data registry); pyogrio is the fast vectorio backend.
    "geopandas>=1.0",
    "pyogrio>=0.9",
    "portfolio-core",
    "portfolio-eval",
]

[project.scripts]
mobility = "mobility.cli:app"

[tool.uv.sources]
portfolio-core = { workspace = true }
portfolio-eval = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mobility"]
