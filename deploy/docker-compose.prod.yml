# Production compose for the single-container showcase app. See DEPLOY.md for
# the exact IMAGE/TAG build and rollout flow. DOMAIN, IP_HASH_SALT, and
# ACME_EMAIL are required (no production placeholders).
name: amm-ds-portfolio

services:
  api:
    image: ${IMAGE:-amm-ds-portfolio}:${TAG:-latest}
    restart: unless-stopped
    environment:
      BUILD_SHA: ${BUILD_SHA:-dev}
      IP_HASH_SALT: ${IP_HASH_SALT:?Set IP_HASH_SALT to a long random value}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-30}
      # Kill switch: chat routes are absent unless this is exactly "1".
      RAG_CHAT_ENABLED: ${RAG_CHAT_ENABLED:-}
      # Kill switch: /docs, /redoc and /openapi.json are absent unless this is
      # exactly "1" (fail closed — audit L-9). Empty disables API docs.
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-}
      # Per-call count budget (integer; the guard parses with int()).
      DAILY_LIVE_BUDGET: ${DAILY_LIVE_BUDGET:-10}
      LIVE_KILL_SWITCH: ${LIVE_KILL_SWITCH:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:32b}
      # Optional external provider (takes priority over Ollama when set).
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-60}
      LLM_COST_LIMIT_USD: ${LLM_COST_LIMIT_USD:-3.00}
      LLM_MAX_REQUESTS: ${LLM_MAX_REQUESTS:-400}
      LLM_TOTAL_TOKENS_LIMIT: ${LLM_TOTAL_TOKENS_LIMIT:-4000000}
      # Direct phone line behind the contact page's unlock gate — returned by
      # POST /contact/unlock only, never shipped in the frontend bundle.
      # Empty disables the endpoint (it fails closed with a 503).
      CONTACT_PHONE: ${CONTACT_PHONE:-}
      # The API has no published port: only containers on this private compose
      # network can supply forwarding headers. Restrict this to Caddy's IP if
      # the network topology changes; never publish the API with "*" here.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
      # Append-only log of phone-unlock submissions (valid + invalid), one
      # JSON line each. Root-only on the host volume; unset disables storage.
      CONTACT_STORE_PATH: ${CONTACT_STORE_PATH:-/data/contact_unlock.jsonl}
      # Privacy-preserving field Web Vitals (LCP/INP/CLS by route, device
      # class and release SHA — no identifiers; see showcase_api/vitals.py).
      # Retention: last 50k entries / 30 days. Same volume as the contact log.
      VITALS_PATH: ${VITALS_PATH:-/data/vitals.jsonl}
    volumes:
      - contact-store:/data
    extra_hosts:
      # host.docker.internal is not resolved on Linux by default; this lets the
      # api reach an Ollama sidecar running on the Docker host (see DEPLOY.md).
      - "host.docker.internal:host-gateway"
    # Hardened container shape: read-only rootfs (tmpfs /tmp for transient
    # writes), no capabilities, no privilege escalation. The app logs to
    # stdout and persists nothing, so this is safe; the opt-in RAG path would
    # need HF_HOME pointed at a writable volume (see deploy/DEPLOY.md).
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    # Pinned by digest (multi-arch manifest list, like the Dockerfile base
    # images): tag-only pulls are mutable. Bump deliberately, not casually.
    image: caddy:2-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    restart: unless-stopped
    environment:
      # Required public hostname; Caddy provisions TLS for it automatically.
      DOMAIN: ${DOMAIN:?Set DOMAIN to the public DNS name}
      # ACME account contact (required): certificate expiry/renewal advisories
      # from the CA go here. Caddy's `email` global option takes this verbatim.
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL to the operator's address}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  caddy-data:
  caddy-config:
  contact-store:
