# Production compose for the showcase app (Hetzner VPS).
# Usage: docker compose -f deploy/docker-compose.prod.yml up -d   (from repo root
# or copy deploy/ files next to a loaded image on the server — see deploy/DEPLOY.md)
services:
  api:
    image: amm-ds-portfolio:latest
    restart: unless-stopped
    environment:
      # Public deployment: RAG chat stays disabled. Enable only with a local
      # ollama sidecar or a budgeted provider key + Cloudflare rate limits.
      RAG_CHAT_ENABLED: ${RAG_CHAT_ENABLED:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:32b}
      # Optional external provider (takes priority over Ollama when set):
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  caddy-data:
  caddy-config:
