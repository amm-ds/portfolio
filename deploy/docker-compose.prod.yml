# Production compose for the showcase app (reference VPS: Hetzner — see deploy/DEPLOY.md).
# Usage: DOMAIN=example.com docker compose -f deploy/docker-compose.prod.yml up -d
# (from repo root, or copy deploy/ files next to a loaded image on the server)
services:
  api:
    image: amm-ds-portfolio:latest
    restart: unless-stopped
    environment:
      # Public deployment: RAG chat stays disabled. Enable only with a local
      # ollama sidecar or a budgeted provider key + Cloudflare rate limits.
      RAG_CHAT_ENABLED: ${RAG_CHAT_ENABLED:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:32b}
      # Optional external provider (takes priority over Ollama when set):
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      # Only Caddy (the sole entrypoint on this internal network) may set
      # X-Forwarded-For — so the API's rate limiter keys on real clients,
      # not on the proxy's address for everyone (audit third pass, finding 3).
      FORWARDED_ALLOW_IPS: "*"
    extra_hosts:
      # host.docker.internal is not resolved on Linux by default; this lets the
      # api reach an Ollama sidecar running on the Docker host (see DEPLOY.md).
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      # Public hostname; the Caddyfile uses {$DOMAIN} as its site address and
      # Caddy provisions TLS for it automatically. Fallback default is the
      # same placeholder as in deploy/Caddyfile — always set DOMAIN for real.
      DOMAIN: ${DOMAIN:-your-domain.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  caddy-data:
  caddy-config:
