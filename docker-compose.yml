# Showcase app: FastAPI serves the API + the built React web app.
# Optional dev setup (Vite dev server with hot reload + API):
#   docker compose --profile dev up
services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Optional live LLM provider (unconfigured, Project 01 uses local
      # Ollama and the RAG chat endpoints stay disabled — no mock provider,
      # see .env.example / DEPLOY.md):
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 20s

  web-dev:
    profiles: ["dev"]
    image: node:22-alpine
    working_dir: /web
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host"
    volumes:
      - ./apps/showcase-web:/web
      # Anonymous volume: keep the container's own node_modules (installed for
      # the image arch) instead of shadowing them with the host's macOS arm64
      # tree, which triggers the npm optional-dependencies bug (rollup
      # darwin-arm64 missing). `npm ci` in the command refreshes the volume.
      - /web/node_modules
    ports:
      - "4321:4321"
    depends_on:
      - api
