[project]
name = "portfolio-eval"
version = "0.1.0"
description = "Reusable evaluation harness: ML + RAG metrics, judging, and HTML report builders."
requires-python = ">=3.12"
dependencies = [
    "portfolio-core",
    "plotly>=5.24",
    "pydantic>=2.9",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
llm = ["pydantic-ai>=1.0"]

[tool.uv.sources]
portfolio-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["src/**/*.py", "src/**/py.typed"]

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio_eval"]
