[project]
name = "amm-ds-portfolio"
version = "0.1.0"
description = "Architect-level ML/AI portfolio: reproducible monorepo platform with agentic AI, classical ML, deep learning, and open-data showcases."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[tool.uv.workspace]
members = ["libs/*", "projects/*", "apps/showcase-api"]

[dependency-groups]
dev = [
    "dvc>=3.55",
    "hypothesis>=6.119",
    "kaleido>=0.2",
    "mkdocs-material>=9.5",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pymdown-extensions>=10.12",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["site", "apps/showcase-web/node_modules", "apps/showcase-web/dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "S", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# tests assert by design; temp paths, md5 cache keys, and round-tripping
# pipeline artifacts in tests are non-security-sensitive.
"**/tests/**" = ["S101", "S108", "S324", "S301"]
# exploratory notebooks assert by design.
"**/*.ipynb" = ["S101"]
# trusted-artifact persistence: the UCI xlsx is a registry-pinned archive
# parsed locally, not untrusted XML from the network.
"**/demand_forecasting/uci.py" = ["S314"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
# Test modules share basenames across packages (pytest importlib mode handles
# it at runtime); type-check source only.
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["portfolio_core.*", "portfolio_eval.*"]
strict = true

[[tool.mypy.overrides]]
module = [
    "inference_serving.*",
    "agentic_workflows.*",
    "uplift_experimentation.*",
    "demand_forecasting.*",
    "routing_optimization.*",
]
strict = true

[[tool.mypy.overrides]]
module = ["plotly.*", "sklearn.*", "joblib.*", "pandas.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# --import-mode=importlib: test modules share basenames across packages.
addopts = "-q --import-mode=importlib --timeout=600 --cov=libs --cov-report=term-missing"
testpaths = ["libs", "projects", "apps"]
markers = [
    # Full demo-payload rebuilds (projects/02 tests/test_demo_payload.py::
    # test_deterministic / test_write_demo_payload_roundtrip) — ~20 min each,
    # serial-only. CI cells exclude them (-m "not slow"); run them locally or
    # via the proposed nightly job with -m "slow".
    "slow: full payload-rebuild tests, serial-only, excluded from CI cells",
]

[tool.coverage.run]
source = ["libs"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
