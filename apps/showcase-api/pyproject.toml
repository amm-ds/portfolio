[project]
name = "showcase-api"
version = "0.1.0"
description = "FastAPI showcase backend: project index, results/figures, RAG chat (SSE), DQ reports."
requires-python = ">=3.12"
dependencies = [
    "06-routing-optimization",
    # Serving artifacts for 02/05 are joblib pickles of each project's fitted
    # pipelines — unpickling requires those projects' deps (lightgbm, xgboost)
    # in the API environment, not just at train time.
    "02-demand-forecasting",
    "05-ml-pipeline-churn",
    "fastapi>=0.115",
    "portfolio-core",
    "portfolio-eval",
    "pydantic>=2.9",
    "sse-starlette>=2.1",
    "uvicorn>=0.30",
    "tape-forecast",
]

[project.scripts]
showcase-api = "showcase_api.main:app"

[tool.uv.sources]
06-routing-optimization = { workspace = true }
02-demand-forecasting = { workspace = true }
05-ml-pipeline-churn = { workspace = true }
portfolio-core = { workspace = true }
portfolio-eval = { workspace = true }
tape-forecast = { git = "https://github.com/amm-ds/tape-forecast-demo.git", rev = "v0.2.0" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/showcase_api"]

[tool.pytest.ini_options]
# pytest uses this config (not the repo-root one) when the test path is inside
# this package. Keep the shared import mode; do NOT inherit the root addopts'
# `--cov=libs` gate — that gate is calibrated for full-suite runs (CI:
# `uv run pytest`), and these tests transitively import
# routing_optimization.evaluate, dragging plotting/eval modules into the
# measured set and failing an 80% libs bar this package cannot satisfy alone.
addopts = "--import-mode=importlib"
