[project]
name = "showcase-api"
version = "0.1.0"
description = "FastAPI showcase backend: project index, results/figures, RAG chat (SSE), DQ reports."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "portfolio-core",
    "portfolio-eval",
    "pydantic>=2.9",
    "sse-starlette>=2.1",
    "uvicorn>=0.30",
]

[project.scripts]
showcase-api = "showcase_api.main:app"

[tool.uv.sources]
portfolio-core = { workspace = true }
portfolio-eval = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/showcase_api"]
