[project]
name = "eval-workbench"
version = "0.1.0"
description = "Read-only evaluation review workbench: dataset registry, run history, case-level inspection"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn"]

[project.optional-dependencies]
dev = ["pytest", "httpx", "pytest-timeout"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eval_workbench"]

# Workspace member (like showcase-api): the root suite + the production API
# import this package.
[tool.pytest.ini_options]
testpaths = ["tests"]
