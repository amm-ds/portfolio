[project]
name = "eval-workbench"
version = "0.1.0"
description = "Read-only evaluation review workbench: dataset registry, run history, case-level inspection"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn"]

[project.optional-dependencies]
dev = ["pytest", "httpx", "pytest-timeout"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eval_workbench"]

# Independent uv workspace root (like agent-chat / document-intelligence):
# never walk up and join the repo-level workspace.
[tool.uv.workspace]

[tool.pytest.ini_options]
testpaths = ["tests"]
