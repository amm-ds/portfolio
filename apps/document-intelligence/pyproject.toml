[project]
name = "document-intelligence"
version = "0.2.0"
description = "Page-level, evidence-grounded document analysis with cited page chat."
readme = "README.md"
requires-python = ">=3.12.9,<3.13"
license = { text = "MIT" }
dependencies = [
    "alembic>=1.14",
    "boto3>=1.35",
    "fastapi>=0.115",
    "pydantic-ai>=2.55,<3",
    "pydantic-settings>=2.6",
    "pymupdf>=1.25",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.30",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
document-intelligence-worker = "document_intelligence.worker:main"
document-intelligence-eval = "document_intelligence.evals.analysis_runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/document_intelligence"]

# Independent workspace: uv must not join the repository-level workspace.
[tool.uv.workspace]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "S", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S108"]
"**/scripts/**" = ["S101", "S108"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
