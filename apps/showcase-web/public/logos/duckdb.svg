<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" role="img" aria-labelledby="title">
  <title id="title">DuckDB logo</title>
  <!--
    Simplified recreation of the DuckDB mark: a duck silhouette in front of
    stacked data bars (the project ships its artwork under the DuckDB license
    at https://duckdb.org/images/duckdb-logo.svg; no CC0 source exists).
    Hand-drawn approximation, white on the tile's dark background.
    Unofficial reconstruction for identification only; DuckDB is a trademark
    of the DuckDB Foundation. See logos/README.md.
  -->
  <g fill="#ffffff">
    <!-- stacked data bars behind the duck -->
    <rect x="4" y="30" width="4" height="16" rx="1" opacity="0.45"/>
    <rect x="11" y="22" width="4" height="24" rx="1" opacity="0.45"/>
    <rect x="18" y="14" width="4" height="32" rx="1" opacity="0.45"/>
    <!-- duck body + neck + head -->
    <path d="M14 44c-2.5 0-4.5-2-4.5-4.5 0-4.5 4-8 9-9l7-1.2c1.8-.4 3.1-1.6 3.6-3.3l1.2-4.1c.3-1 1.1-1.6 2.1-1.6h2.2c1 0 1.8.7 2 1.7l.5 3.4c.1.9 1 1.6 1.9 1.6h1.6c1.8 0 3 1.9 2.2 3.6l-2.6 5.6c-.8 1.7-2.4 2.9-4.3 3.2L26 41.6C22.5 43.2 18.4 44 14 44Z"/>
    <!-- beak -->
    <path d="M41.8 25.4h3.4c1 0 1.7 1 .9 1.7l-2.7 2.2-1.6-.4v-3.5Z"/>
    <!-- eye -->
    <circle cx="37.6" cy="24.4" r="1.3" fill="#0f172a"/>
  </g>
</svg>
