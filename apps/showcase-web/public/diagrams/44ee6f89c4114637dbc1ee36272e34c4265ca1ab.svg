<svg id="mmd-45" width="100%" xmlns="http://www.w3.org/2000/svg" class="flowchart" style="max-width: 637.109375px;" viewBox="4 4 637.109375 400" role="graphics-document document" aria-roledescription="flowchart-v2"><style>#mmd-45{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:20px;fill:#e2e8f0;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mmd-45 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mmd-45 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mmd-45 .error-icon{fill:#1e293b;}#mmd-45 .error-text{fill:#94a3b8;stroke:#94a3b8;}#mmd-45 .edge-thickness-normal{stroke-width:1px;}#mmd-45 .edge-thickness-thick{stroke-width:3.5px;}#mmd-45 .edge-pattern-solid{stroke-dasharray:0;}#mmd-45 .edge-thickness-invisible{stroke-width:0;fill:none;}#mmd-45 .edge-pattern-dashed{stroke-dasharray:3;}#mmd-45 .edge-pattern-dotted{stroke-dasharray:2;}#mmd-45 .marker{fill:#38bdf8;stroke:#38bdf8;}#mmd-45 .marker.cross{stroke:#38bdf8;}#mmd-45 svg{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:20px;}#mmd-45 p{margin:0;}#mmd-45 .label{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#f1f5f9;}#mmd-45 .cluster-label text{fill:#e2e8f0;}#mmd-45 .cluster-label span{color:#e2e8f0;}#mmd-45 .cluster-label span p{background-color:transparent;}#mmd-45 .label text,#mmd-45 span{fill:#f1f5f9;color:#f1f5f9;}#mmd-45 .node rect,#mmd-45 .node circle,#mmd-45 .node ellipse,#mmd-45 .node polygon,#mmd-45 .node path{fill:#1e293b;stroke:#2dd4bf;stroke-width:1px;}#mmd-45 .rough-node .label text,#mmd-45 .node .label text,#mmd-45 .image-shape .label,#mmd-45 .icon-shape .label{text-anchor:middle;}#mmd-45 .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#mmd-45 .rough