<svg id="mmd-50-light" width="100%" xmlns="http://www.w3.org/2000/svg" class="flowchart" style="max-width: 744.828125px;" viewBox="4 4 744.828125 250" role="graphics-document document" aria-roledescription="flowchart-v2"><style>#mmd-50-light{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:20px;fill:#172433;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mmd-50-light .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mmd-50-light .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mmd-50-light .error-icon{fill:#f4f7fb;}#mmd-50-light .error-text{fill:#4e6276;stroke:#4e6276;}#mmd-50-light .edge-thickness-normal{stroke-width:1px;}#mmd-50-light .edge-thickness-thick{stroke-width:3.5px;}#mmd-50-light .edge-pattern-solid{stroke-dasharray:0;}#mmd-50-light .edge-thickness-invisible{stroke-width:0;fill:none;}#mmd-50-light .edge-pattern-dashed{stroke-dasharray:3;}#mmd-50-light .edge-pattern-dotted{stroke-dasharray:2;}#mmd-50-light .marker{fill:#0369a1;stroke:#0369a1;}#mmd-50-light .marker.cross{stroke:#0369a1;}#mmd-50-light svg{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:20px;}#mmd-50-light p{margin:0;}#mmd-50-light .label{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#172433;}#mmd-50-light .cluster-label text{fill:#172433;}#mmd-50-light .cluster-label span{color:#172433;}#mmd-50-light .cluster-label span p{background-color:transparent;}#mmd-50-light .label text,#mmd-50-light span{fill:#172433;color:#172433;}#mmd-50-light .node rect,#mmd-50-light .node circle,#mmd-50-light .node ellipse,#mmd-50-light .node polygon,#mmd-50-light .node path{fill:#ffffff;stroke:#0f766e;stroke-width:1px;}#mmd-50-light .rough-node .label text,#mmd-50-light .node .label text,#mmd-50-light .image-shape .label,#mmd-50-light .icon-shape .label{text-anchor:middle;}#mmd-50-light .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#mmd-50-light .rough-node .label,#mmd-50-light .node .label,#mmd-50-light .image-shape .label,#mmd-50-light .icon-shape .label{text-align:center;}#mmd-50-light .node.clickable{cursor:pointer;}#mmd-50-light .root .anchor path{fill:#0369a1!important;stroke-width:0;stroke:#0369a1;}#mmd-50-light .arrowheadPath{fill:rgba(255, 255, 255, 0);}#mmd-50-light .edgePaths .path{stroke:#0369a1;stroke-width:1px;}#mmd-50-light .flowchart-link{stroke:#0369a1;fill:none;}#mmd-50-light .edgeLabel{background-color:#ffffff;text-align:center;}#mmd-50-light .edgeLabel p{background-color:#ffffff;}#mmd-50-light .edgeLabel rect{opacity:0.5;background-color:#ffffff;fill:#ffffff;}#mmd-50-light .labelBkg{background-color:rgba(255, 255, 255, 0.5);}#mmd-50-light .cluster rect{fill:#edf3f8;stroke:#b8c6d6;stroke-width:1px;}#mmd-50-light .cluster text{fill:#172433;}#mmd-50-light .cluster span{color:#172433;}#mmd-50-light .node .collapsed-indicator{fill:#b8c6d6;stroke:none;opacity:0.6;}#mmd-50-light .node .collapsed-separator{stroke:#b8c6d6;stroke-width:0.75px;}#mmd-50-light div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;background:#f4f7fb;border:1px solid #d6dee8;border-radius:2px;pointer-events:none;z-index:100;}#mmd-50-light .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#172433;}#mmd-50-light rect.text{fill:none;stroke-width:0;}#mmd-50-light .icon-shape,#mmd-50-light .image-shape{background-color:#ffffff;text-align:center;}#mmd-50-light .icon-shape p,#mmd-50-light .image-shape p{background-color:#ffffff;padding:2px;}#mmd-50-light .icon-shape .label rect,#mmd-50-light .image-shape .label rect{opacity:0.5;background-color:#ffffff;fill:#ffffff;}#mmd-50-light .label-icon{display:inline-block;height:1em;overflow:visible;vertical-align:-0.125em;}#mmd-50-light .node .label-icon path{fill:currentColor;stroke:revert;stroke-width:revert;}#mmd-50-light .node .neo-node{stroke:#0f766e;}#mmd-50-light [data-look="neo"].node rect,#mmd-50-light [data-look="neo"].cluster rect,#mmd-50-light [data-look="neo"].node polygon{stroke:#0f766e;filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mmd-50-light [data-look="neo"].swimlane.cluster rect{filter:none;}#mmd-50-light [data-look="neo"].node path{stroke:#0f766e;stroke-width:1px;}#mmd-50-light [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mmd-50-light [data-look="neo"].node .neo-line path{stroke:#0f766e;filter:none;}#mmd-50-light [data-look="neo"].node circle{stroke:#0f766e;filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mmd-50-light [data-look="neo"].node circle .state-start{fill:#000000;}#mmd-50-light [data-look="neo"].icon-shape .icon{fill:#0f766e;filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mmd-50-light [data-look="neo"].icon-shape .icon-neo path{stroke:#0f766e;filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mmd-50-light :root{--mermaid-font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}</style><g><marker id="mmd-50-light_flowchart-v2-pointEnd" class="marker flowchart-v2" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"></path></marker><marker id="mmd-50-light_flowchart-v2-pointStart" class="marker flowchart-v2" viewBox="0 0 10 10" refX="4.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 5 L 10 10 L 10 0 z" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"></path></marker><marker id="mmd-50-light_flowchart-v2-pointEnd-margin" class="marker flowchart-v2" viewBox="0 0 11.