<svg id="mmd-8-light" width="100%" xmlns="http://www.w3.org/2000/svg" class="flowchart" style="max-width: 762.5625px;" viewBox="4.5 4 762.5625 302.53125" role="graphics-document document" aria-roledescription="flowchart-v2"><style>#mmd-8-light{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:20px;fill:#172433;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mmd-8-light .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mmd-8-light .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mmd-8-light .error-icon{fill:#f4f7fb;}#mmd-8-light .error-text{fill:#4e6276;stroke:#4e6276;}#mmd-8-light .edge-thickness-normal{stroke-width:1px;}#mmd-8-light .edge-thickness-thick{stroke-width:3.5px;}#mmd-8-light .edge-pattern-solid{stroke-dasharray:0;}#mmd-8-light .edge-thickness-invisible{stroke-width:0;fill:none;}#mmd-8-light .edge-pattern-dashed{stroke-dasharray:3;}#mmd-8-light .edge-pattern-dotted{stroke-dasharray:2;}#mmd-8-light .marker{fill:#0369a1;stroke:#0369a1;}#mmd-8-light .marker.cross{stroke:#0369a1;}#mmd-8-light svg{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:20px;}#mmd-8-light p{margin:0;}#mmd-8-light .label{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#172433;}#mmd-8-light .cluster-label text{fill:#172433;}#mmd-8-light .cluster-label span{color:#172433;}#mmd-8-light .cluster-label span p{background-color:transparent;}#mmd-8-light .label text,#mmd-8-light span{fill:#172433;color:#172433;}#mmd-8-light .node rect,#mmd-8-light .node circle,#mmd-8-light .node ellipse,#mmd-8-light .node polygon,#mmd-8-light .node path{fill:#ffffff;stroke:#0f766e;stroke-width:1px;}#mmd-8-light .rough-node .label text,#mmd-8-light .node .label text,#mmd-8-light .image-shape .label,#mmd-8-light .icon-shape .label{text-anchor:middle;}#mmd-8-light .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#mmd-8-light .rough-node .label,#mmd-8-light .node .label,#mmd-8-light .image-shape .label,#mmd-8-light .icon-shape .label{text-align:center;}#mmd-8-light .node.clickable{cursor:pointer;}#mmd-8-light .root .anchor path{fill:#0369a1!important;stroke-width:0;stroke:#0369a1;}#mmd-8-light .arrowheadPath{fill:rgba(255, 255, 255, 0);}#mmd-8-light .edgePaths .path{stroke:#0369a1;stroke-width:1px;}#mmd-8-light .flowchart-link{stroke:#0369a1;fill:none;}#mmd-8-light .edgeLabel{background-color:#ffffff;text-align:center;}#mmd-8-light .edgeLabel p{background-color:#ffffff;}#mmd-8-light .edgeLabel rect{opacity:0.5;background-color:#ffffff;fill:#ffffff;}#mmd-8-light .labelBkg{background-color:rgba(255, 255, 255, 0.5);}#mmd-8-light .cluster rect{fill:#edf3f8;stroke:#b8c6d6;stroke-width:1px;}#mmd-8-light .cluster text{fill:#172433;}#mmd-8-light .cluster span{color:#172433;}#mmd-8-light .node .collapsed-indicator{fill:#b8c6d6;stroke:none;opacity:0.6;}#mmd-8-light .node .collapsed-separator{stroke:#b8c6d6;stroke-width:0.75px;}#mmd-8-light div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;background:#f4f7fb;border:1px solid #d6dee8;border-radius:2px;pointer-events:none;z-index:100;}#mmd-8-light .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#172433;}#mmd-8-light rect.text{fill:none;stroke-width:0;}#mmd-8-light .icon-shape,#mmd-8-light .image-shape{background-color:#ffffff;text-align:center;}#mmd-8-light .icon-shape p,#mmd-8-light .image-shape p{background-color:#ffffff;padding:2px;}#mmd-8-light .icon-shape .label rect,#mmd-8-light .image-shape .label rect{opacity:0.5;background-color:#ffffff;fill:#ffffff;}#mmd-8-light .label-icon{display:inline-block;height:1em;overflow:visible;vertical-align:-0.12