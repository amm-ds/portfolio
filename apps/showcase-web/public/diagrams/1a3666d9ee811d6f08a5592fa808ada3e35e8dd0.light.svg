<svg id="mmd-24-light" width="100%" xmlns="http://www.w3.org/2000/svg" class="flowchart" style="max-width: 756.453125px;" viewBox="4 4 756.453125 250" role="graphics-document document" aria-roledescription="flowchart-v2"><style>#mmd-24-light{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:20px;fill:#172433;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mmd-24-light .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mmd-24-light .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mmd-24-light .error-icon{fill:#f4f7fb;}#mmd-24-light .error-text{fill:#4e6276;stroke:#4e6276;}#mmd-24-light .edge-thickness-normal{stroke-width:1px;}#mmd-24-light .edge-thickness-thick{stroke-width:3.5px;}#mmd-24-light .edge-pattern-solid{stroke-dasharray:0;}#mmd-24-light .edge-thickness-invisible{stroke-width:0;fill:none;}#mmd-24-light .edge-pattern-dashed{stroke-dasharray:3;}#mmd-24-light .edge-pattern-dotted{stroke-dasharray:2;}#mmd-24-light .marker{fill:#0369a1;stroke:#0369a1;}#mmd-24-light .marker.cross{stroke:#0369a1;}#mmd-24-light svg{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:20px;}#mmd-24-light p{margin:0;}#mmd-24-light .label{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#172433;}#mmd-24-light .cluster-label text{fill:#172433;}#mmd-24-light .cluster-label span{color:#172433;}#mmd-24-light .cluster-label span p{background-color:transparent;}#mmd-24-light .label text,#mmd-24-light span{fill:#172433;color:#172433;}#mmd-24-light .node rect,#mmd-24-light .node circle,#mmd-24-light .node ellipse,#mmd-24-light .node polygon,#mmd-24-light .node path{fill:#ffffff;stroke:#0f766e;stroke-width:1px;}#mmd-24-light .rough-node .label text,#mmd-24-light .node .label text,#mmd-24-light .image-shape .label,#mmd-24-light .icon-shape .label{text-anchor:middle;}#mmd-24-light .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#mmd-24-light .rough-node .label,#mmd-24-light .node .label,#mmd-24-light .image-shape .label,#mmd-24-light .icon-shape .label{text-align:center;}#mmd-24-light .node.clickable{cursor:pointer;}#mmd-24-light .root .anchor path{fill:#0369a1!important;stroke-width:0;stroke:#0369a1;}#mmd-24-light .arrowheadPath{fill:rgba(255, 255, 255, 0);}#mmd-24-light .edgePaths .path{stroke:#0369a1;stroke-width:1px;}#mmd-24-light .flowchart-link{stroke:#0369a1;fill:none;}#mmd-24-light .edgeLabel{background-color:#ffffff;text-align:center;}#mmd-24-light .edgeLabel p{background-color:#ffffff;}#mmd-24-light .edgeLabel rect{opacity:0.5;background-color:#ffffff;fill:#ffffff;}#mmd-24-light .labelBkg{background-color:rgba(255, 255, 255, 0.5);}#mmd-24-light .cluster rect{fill:#edf3f8;stroke:#b8c6d6;stroke-width:1px;}#mmd-24-light .cluster text{fill:#172433;}#mmd-24-light .cluster span{color:#172433;}#mmd-24-light .node .collapsed-indicator{fill:#b8c6d6;stroke:none;opacity:0.6;}#mmd-24-light .node .collapsed-separator{stroke:#b8c6d6;stroke-width:0.75px;}#mmd-24-light div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;background:#f4f7fb;border:1px solid #d6dee8;border-radius:2px;pointer-events:none;z-index:100;}#mmd-24-light .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#172433;}#mmd-24-light rect.text{fill:none;stroke-width:0;}#mmd-24-light .icon-shape,#mmd-24-light .image-shape{background-color:#ffffff;text-align:center;}#mmd-24-light .icon-shape p,#mmd-24-light .image-shape p{background-color:#ffffff;padding:2px;}#mmd-24-light .icon-shape .label rect,#mmd-24-light .image-shape .label rect{opacity:0.5;background-color:#ffffff;fill:#ffffff;}#mmd-24-light .label-icon{display:inlin