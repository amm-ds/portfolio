<svg id="mmd-26-dark" width="100%" xmlns="http://www.w3.org/2000/svg" class="flowchart" style="max-width: 768.5px;" viewBox="4 4 768.5 374" role="graphics-document document" aria-roledescription="flowchart-v2"><style>#mmd-26-dark{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:20px;fill:#e2e8f0;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mmd-26-dark .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mmd-26-dark .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mmd-26-dark .error-icon{fill:#1e293b;}#mmd-26-dark .error-text{fill:#94a3b8;stroke:#94a3b8;}#mmd-26-dark .edge-thickness-normal{stroke-width:1px;}#mmd-26-dark .edge-thickness-thick{stroke-width:3.5px;}#mmd-26-dark .edge-pattern-solid{stroke-dasharray:0;}#mmd-26-dark .edge-thickness-invisible{stroke-width:0;fill:none;}#mmd-26-dark .edge-pattern-dashed{stroke-dasharray:3;}#mmd-26-dark .edge-pattern-dotted{stroke-dasharray:2;}#mmd-26-dark .marker{fill:#38bdf8;stroke:#38bdf8;}#mmd-26-dark .marker.cross{stroke:#38bdf8;}#mmd-26-dark svg{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:20px;}#mmd-26-dark p{margin:0;}#mmd-26-dark .label{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#f1f5f9;}#mmd-26-dark .cluster-label text{fill:#e2e8f0;}#mmd-26-dark .cluster-label span{color:#e2e8f0;}#mmd-26-dark .cluster-label span p{background-color:transparent;}#mmd-26-dark .label text,#mmd-26-dark span{fill:#f1f5f9;color:#f1f5f9;}#mmd-26-dark .node rect,#mmd-26-dark .node circle,#mmd-26-dark .node ellipse,#mmd-26-dark .node polygon,#mmd-26-dark .node path{fill:#1e293b;stroke:#2dd4bf;stroke-width:1px;}#mmd-26-dark .rough-node .label text,#mmd-26-dark .node .label text,#mmd-26-dark .image-