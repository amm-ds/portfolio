<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Static SEO defaults; scripts/gen_sitemap.py rewrites them for VITE_SITE_URL. -->
    <link rel="canonical" href="https://alejandromerida.dev/" />
    <meta
      name="description"
      content="Live showcase of the alejandromerida.dev public ML/AI portfolio: reproducible case studies with metrics, interactive figures and published pipelines."
    />
    <meta name="theme-color" content="#0f172a" />
    <meta name="build-sha" content="dev" />
    <meta property="og:site_name" content="alejandromerida.dev" />
    <meta property="og:title" content="alejandromerida.dev — ML/AI Engineering Portfolio" />
    <meta
      property="og:description"
      content="End-to-end ML/AI systems — agentic AI, forecasting, optimization, serving — every claim reproducible."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://alejandromerida.dev/" />
    <meta
      property="og:image"
      content="https://alejandromerida.dev/social-card.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="alejandromerida.dev — ML/AI Engineering Portfolio" />
    <meta
      name="twitter:description"
      content="End-to-end ML/AI systems — agentic AI, forecasting, optimization, serving — every claim reproducible."
    />
    <meta
      name="twitter:image"
      content="https://alejandromerida.dev/social-card.png"
    />
    <title>alejandromerida.dev — ML/AI Engineering Portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Apply the persisted site theme before React hydrates to avoid a flash.
      (() => {
        try {
          const theme = window.localStorage.getItem("portfolio-theme") === "light" ? "light" : "dark";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute("content", theme === "light" ? "#f5f8fc" : "#0f172a");
        } catch {
          // Storage can be unavailable in hardened browsers; dark remains the default.
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
