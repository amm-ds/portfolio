[project]
name = "agent-chat"
version = "0.1.0"
description = "Lift-out-able chatbot-agent template: pydantic-ai v2 + FastAPI + Postgres/pgvector."
readme = "README.md"
requires-python = ">=3.12.9,<3.13"
license = { text = "MIT" }
dependencies = [
    "pydantic-ai>=2.55,<3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy[asyncio]>=2.0.49",
    "asyncpg>=0.30",
    "pgvector>=0.3.6",
    "pydantic-settings>=2.6",
]

# The local MiniLM embedder is optional so the base install stays light
# (sentence-transformers pulls torch). The hashing embedder needs no extra.
[project.optional-dependencies]
embeddings = ["sentence-transformers>=6.0"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
agent-chat-ingest = "agent_chat.rag.ingest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_chat"]

# This empty table makes apps/agent-chat its own uv workspace root, so uv never
# walks up and joins the repo-level workspace (root pyproject.toml is off-limits).
[tool.uv.workspace]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "S", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# tests assert by design; tmp paths in tests are non-security-sensitive.
"**/tests/**" = ["S101", "S108"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
# optional [embeddings] extra — not installed in the base environment.
module = ["sentence_transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
