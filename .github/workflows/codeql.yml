name: codeql
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 3 * * 1"

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - uses: github/codeql-action/init@d0bae162f31f17dd92c46ccdc4dfee5710f8dc67 # v3.28.15
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@d0bae162f31f17dd92c46ccdc4dfee5710f8dc67 # v3.28.15
      - uses: github/codeql-action/analyze@d0bae162f31f17dd92c46ccdc4dfee5710f8dc67 # v3.28.15
