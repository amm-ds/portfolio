# Nightly drift guards: the expensive byte-identity / full-rebuild checks that
# are too slow for PR CI. PR CI runs the fast guards on every push; this job
# proves the expensive reproducibility contracts nightly and on demand.
name: nightly

on:
  schedule:
    # 03:17 UTC — off the top-of-the-hour herd
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slow-drift-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a3267505838078e36cf38b85af677262 # v4.3.1
      - uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4.2.0
        with:
          enable-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install workspace
        run: uv sync --all-packages --dev
      # TODO(demo-rebuild phase): the forecast-workbench demo and the
      # hierarchical track were removed; their nightly drift guards (the
      # payload full-rebuild slow tests and the evaluate-hierarchical
      # run-twice byte-identity check) went with them. The rebuilt demo's M5
      # byte-identity step lands here.
