name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  LLM_BASE_URL: "" # no hosted key in CI; LLM phases fall back to keyword judges / skip
  # joblib's loky backend spawns a worker per core inside each pytest-xdist
  # worker; on 2-vCPU runners that nested parallelism thrashes (sys CPU ~=
  # user CPU observed locally). Cap loky at 1 CPU per worker: 2 workers x 1
  # thread on 2 cores.
  LOKY_MAX_CPU_COUNT: "1"

jobs:
  changes:
    # Path filters: docs-only pushes/PRs skip the heavy matrix below. Every
    # other job gates its steps (or itself) on these outputs.
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      web: ${{ steps.filter.outputs.web }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          fetch-depth: 0 # paths-filter diffs against the merge base
      - uses: dorny/paths-filter@f3360c560367c9daf72b88c0e6164162034c5721 # v3
        id: filter
        with:
          filters: |
            python:
              - 'libs/**'
              - 'projects/**'
              - 'apps/showcase-api/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/showcase-web/**'
            docs:
              - 'docs/**'
              - 'mkdocs.yml'
              - 'README.md'

  gate:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4.2.0
        with:
          enable-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install workspace
        run: uv sync --all-packages --dev
      - name: Ruff
        if: needs.changes.outputs.python == 'true'
        run: uv run ruff check . && uv run ruff format --check .
      - name: Demo contract check
        if: needs.changes.outputs.python == 'true'
        run: uv run python scripts/check_demo_contract.py
      - name: "Mypy (libs strict + projects/apps typed)"
        if: needs.changes.outputs.python == 'true'
        run: uv run mypy libs projects apps
      - name: "Frontend — install, test, typecheck, build"
        if: needs.changes.outputs.web == 'true'
        working-directory: apps/showcase-web
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - name: Bundle budget (index-*.js gzip ≤ 250 KB)
        # Blocking: the main entry chunk must stay lean; route-heavy pages are
        # already code-split by Vite. No new deps — gzip via node:zlib.
        if: needs.changes.outputs.web == 'true'
        working-directory: apps/showcase-web
        run: >-
          node --input-type=module -e
          "import z from 'node:zlib'; import f from 'node:fs';
          const files = f.readdirSync('dist/assets').filter((n) => /^index-.*\.js$/.test(n));
          if (!files.length) { console.error('no index chunk found'); process.exit(1); }
          let fail = false;
          for (const n of files) {
            const gz = z.gzipSync(f.readFileSync('dist/assets/' + n)).length;
            console.log(n + ': ' + (gz / 1024).toFixed(1) + ' KB gzip');
            if (gz > 250 * 1024) fail = true;
          }
          if (fail) { console.error('bundle budget exceeded (250 KB gzip)'); process.exit(1); }"
      - name: Docs build (strict)
        if: needs.changes.outputs.docs == 'true'
        run: uv run mkdocs build --strict
      - name: Dependency audit
        # uv has no audit subcommand (uv pip audit / uv audit are both invalid);
        # export the locked runtime requirements and audit them with pip-audit.
        if: needs.changes.outputs.python == 'true'
        run: |
          uv export --frozen --no-dev -o /tmp/requirements.txt
          uvx pip-audit --requirement /tmp/requirements.txt --strict

  eslint:
    # NON-BLOCKING this wave (continue-on-error); becomes a required gate in a
    # later wave. Minimal flat config: jsx-a11y recommended.
    needs: changes
    if: needs.changes.outputs.web == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: npm
          cache-dependency-path: apps/showcase-web/package-lock.json
      - name: ESLint (jsx-a11y recommended)
        working-directory: apps/showcase-web
        run: |
          npm ci --no-audit --no-fund
          npm run lint

  a11y-axe:
    # NON-BLOCKING this wave (continue-on-error). Runs the axe-core check
    # (scripts/axe_check.mjs) against a preview build with chromium installed,
    # and uploads reports/axe.json for inspection.
    needs: changes
    if: needs.changes.outputs.web == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: npm
          cache-dependency-path: apps/showcase-web/package-lock.json
      - name: Install deps + chromium
        working-directory: apps/showcase-web
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4.2.0
        with:
          enable-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Boot API + dev server, run axe check
        working-directory: apps/showcase-web
        # The vite dev server proxies /projects + /demos to the API, so axe
        # exercises the real render path (not only the API-down fallback).
        run: |
          uv sync --all-packages --dev
          (cd apps/showcase-api 2>/dev/null || cd ../showcase-api; uv run uvicorn showcase_api.main:app --host 127.0.0.1 --port 8000) &
          npm run dev -- --port 4321 --strictPort &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1 && curl -fsS http://127.0.0.1:4321/ >/dev/null 2>&1 && break
            sleep 1
          done
          AXE_BASE_URL=http://127.0.0.1:4321 node ../../scripts/axe_check.mjs
      - name: Upload axe report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v6.0.0
        with:
          name: axe-report
          path: reports/axe.json
          if-no-files-found: warn

  links:
    # NON-BLOCKING link check over docs + README (continue-on-error).
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - uses: lycheeverse/lychee-action@649b0e4890508ea3e11ea6b3ee35ce899a25afd5 # v2
        with:
          # LinkedIn 999s bot requests; exclude it (the URL is config-driven).
          args: --no-progress --exclude-loopback --exclude '^https://www\.linkedin\.com' --exclude '^/' README.md docs/
        # non-blocking this wave: root-relative SPA links and rate-limited
        # hosts fail local resolution; tracked via the uploaded report
        continue-on-error: true

  tests:
    # The full suite outgrew a single 2-vCPU runner (the lattice wave pushed
    # the monolithic step past 1.5h). One free runner per project keeps every
    # cell under ~15 min, runs them concurrently, and makes any future hang
    # identifiable by project.
    needs: [changes, gate]
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - { name: libs, path: libs, cov: "--cov=libs --cov-fail-under=80" }
          - { name: 01-rag-agent, path: projects/01-rag-agent, cov: "--cov=src" }
          - name: 02-unit
            path: projects/02-demand-forecasting
            cov: "--cov=src"
            unit_args: "unit-only"

          - name: 02-models
            path: projects/02-demand-forecasting
            cov: "--cov=src tests/test_multihorizon.py tests/test_multistep_metrics.py tests/test_peak_models.py"

          - { name: 03-anomaly-detection, path: projects/03-anomaly-detection, cov: "--cov=src" }
          - { name: 04-nlp-classification, path: projects/04-nlp-classification, cov: "--cov=src" }
          - { name: 05-ml-pipeline-churn, path: projects/05-ml-pipeline-churn, cov: "--cov=src" }
          - { name: 06-routing-optimization, path: projects/06-routing-optimization, cov: "--cov=src" }
          - { name: 07-open-data-mobility, path: projects/07-open-data-mobility, cov: "--cov=src" }
          - { name: 08-inference-serving, path: projects/08-inference-serving, cov: "--cov=src" }
          - { name: 09-agentic-workflows, path: projects/09-agentic-workflows, cov: "--cov=src" }
          - { name: 10-uplift-experimentation, path: projects/10-uplift-experimentation, cov: "--cov=src" }
          - { name: showcase-api, path: apps/showcase-api, cov: "--cov=src" }
    name: tests · ${{ matrix.suite.name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4.2.0
        with:
          enable-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install workspace
        run: uv sync --all-packages --dev
      - name: Pytest (${{ matrix.suite.name }})
        working-directory: ${{ matrix.suite.path }}
        # per-project pytest.ini/pyproject applies its own floor; the libs
        # cell carries the shared ≥80% gate via its cov flags
        run: >-
          uv run pytest -o addopts="${{ matrix.suite.addopts || '--import-mode=importlib -q -n 2 --timeout=900 --durations=30' }}"
          ${{ matrix.suite.cov }}
          ${{
            matrix.suite.unit_args == 'unit-only'
            && '--ignore=tests/test_multihorizon.py --ignore=tests/test_multistep_metrics.py --ignore=tests/test_peak_models.py'
            || ''
          }}

  docker:
    needs: [gate, tests]
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - name: Build showcase image
        run: docker build -t amm-ds-portfolio .
      - name: Smoke test
        # Verifies the real deployment surface of the image: the SPA (baked
        # web build) + the API, including a live forecast from the git-baked
        # serving artifacts. The forecast assert guards the artifact-baking
        # regression: it would 503 if the artifacts went missing from git.
        run: |
          trap "docker rm -f showcase" EXIT
          docker run -d --name showcase -p 8000:8000 amm-ds-portfolio
          # poll readiness (cold joblib loads on a 2-vCPU runner can exceed a
          # fixed sleep; a previous run flaked here)
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health 2>/dev/null | grep -q '"ready":true'; then
              echo "ready after ${i}s"; break
            fi
            sleep 1
            if [ "$i" = "60" ]; then echo "container never became ready"; docker logs showcase; exit 1; fi
          done
          # html minification may strip attribute quotes — match either form
          root_code=$(curl -s -o /tmp/root.html -w '%{http_code}' http://localhost:8000/)
          echo "GET / -> $root_code"
          grep -oE '<div[^>]*>' /tmp/root.html | head -3
          grep -c 'root' /tmp/root.html
          test "$root_code" = "200"
          grep -qE 'id="?root"?' /tmp/root.html
          # Deep links must return the SPA shell (client-side routing fallback).
          # NB: bare /projects is a JSON API route (project index), not the SPA.
          for route in /projects/06-routing-optimization /services; do
            rc=$(curl -s -o /tmp/deep.html -w '%{http_code}' "http://localhost:8000$route")
            echo "GET $route -> $rc ($(wc -c < /tmp/deep.html) bytes)"
            cat /tmp/deep.html
            echo
            test "$rc" = "200"
            grep -qE 'id="?root"?' /tmp/deep.html || { echo "ROOT-GREP-FAILED"; exit 1; }
          done
          # Project-index API answers JSON.
          curl -fsS http://localhost:8000/projects | grep -q '"id":"01-rag-agent"'
          # Story/metrics APIs must answer JSON for a real project.
          curl -fsS http://localhost:8000/projects/05-ml-pipeline-churn/metrics \
            | grep -q 'selected_model_calibrated'
          # Live forecast endpoint: build the request from the serving artifact's
          # example_row so the smoke test tracks whichever track the artifact
          # was built from (the UCI track).
          body=$(python3 -c "
          import json
          meta = json.load(open('projects/02-demand-forecasting/reports/models/serving/meta.json'))
          row = dict(meta['example_row'])
          sid = row.pop('series_id')
          print(json.dumps({'series_id': sid, 'features': row}))
          ")
          curl -fsS -o /dev/null -w '%{http_code}\n' \
            -X POST http://localhost:8000/projects/02-demand-forecasting/forecast \
            -H 'content-type: application/json' \
            -d "$body" \
            | grep -q '^200$'
