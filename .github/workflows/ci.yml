name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  LLM_BASE_URL: "" # no hosted key in CI; LLM phases fall back to keyword judges / skip

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install workspace
        run: uv sync --all-packages --dev
      - name: Ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: Mypy (libs strict + projects/apps typed)
        run: uv run mypy libs projects apps
      - name: Tests with coverage gates (libs ≥80% strict)
        run: uv run pytest --cov=libs --cov-fail-under=80 --cov-report=term-missing
      - name: "Coverage floor — projects + apps ≥55%"
        # Override addopts to exclude libs from this pass's total
        run: uv run pytest -o addopts="--import-mode=importlib -q" --cov=projects --cov=apps --cov-fail-under=55 --cov-report=term
      - name: "Frontend — install, test, typecheck, build"
        working-directory: apps/showcase-web
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - name: Docs build (strict)
        run: uv run mkdocs build --strict
      - name: Dependency audit
        run: uv pip audit

  docker:
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v4
      - name: Build showcase image
        run: docker build -t amm-ds-portfolio .
      - name: Smoke test
        # Verifies the real deployment surface of the image: the SPA (baked
        # web build) + the API, including a live forecast from the git-baked
        # serving artifacts. The forecast assert guards the artifact-baking
        # regression: it would 503 if the artifacts went missing from git.
        run: |
          trap "docker rm -f showcase" EXIT
          docker run -d --name showcase -p 8000:8000 amm-ds-portfolio
          sleep 15
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:8000/ | grep -q 'id="root"'
          curl -fsS -o /dev/null -w '%{http_code}\n' http://localhost:8000/projects
          # Features from projects/02-demand-forecasting reports/models/serving/meta.json
          # example_row (series_id excluded) — see apps/showcase-api/SERVING.md.
          curl -fsS -o /dev/null -w '%{http_code}\n' \
            -X POST http://localhost:8000/projects/02-demand-forecasting/forecast \
            -H 'content-type: application/json' \
            -d '{"series_id": "store_0|product_0",
                 "features": {"t": 371.5, "dow": 4.0, "is_weekend": 0.0, "month": 7.0,
                              "week": 27.0, "doy_sin": -0.0312, "doy_cos": -0.0312,
                              "lag_1": 66.0, "lag_7": 66.0, "lag_14": 65.0}}' \
            | grep -q '^200$'
